 |\n\n회원 2명이지만 주문이 3건이므로 결과는 3행\n\n1:N 조인의 결과 행 수는 부모(1쪽)가 아니라 자식(N쪽)에 맞춰 결정된다 — 부모 한 행이 매칭된 자식 수만큼 복제된다고 보면 됨. 이 사실을 잊고 부모 컬럼(예: 회원 등급별 포인트)을 그대로 SUM 하면 자식 수만큼 부풀려진 합계가 나온다. 1:N 조인 후 부모 쪽 집계가 필요하면 자식 합계를 서브쿼리로 먼저 구해 1:1 로 만들어 붙이는 것이 안전.\n\n### 💻 [SQL 실전 트레이스] 관계로 연결된 테이블 조인\n\n```sql\n-- 1:N 조인: 회원과 주문\nSELECT  M.NAME, O.ORDER_ID, O.ORD_DATE\nFROM    MEMBER M\n        JOIN ORDERS O ON M.MEMBER_ID = O.MEMBER_ID;\n\n-- M:N → 교차 테이블 거쳐 두 번 조인\nSELECT  S.NAME AS STUDENT, K.NAME AS SUBJECT, R.GRADE\nFROM    STUDENT  S\n        JOIN REGISTER R ON S.STU_ID = R.STU_ID\n        JOIN SUBJECT  K ON R.SUB_ID = K.SUB_ID;\n```\n\n---\n\n## 🚨 STEP 3. 출제위원 단골 함정 O/X & 노랭이·기출 문항별 족보\n\n### ⚠️ 시험장 단골 함정 vs 정답 1:1 대조표\n\n| 함정 | 정답 |\n|---|---|\n| 관계는 SQL에서 무엇으로 구현되는가 | 외래키(FK) |\n| 1:N 관계를 조인하면 행 수는 | 부모 1행에 자식 N개면 결과는 N행 |\n| M:N을 조인할 때 | 반드시 교차 엔터티를 거침 |\n| 조인 조건 누락 시 | 카티션 곱(Cartesian Product) |\n| 외래키는 항상 NOT NULL인가 | 선택 관계면 NULL 허용 |\n\n단골 트릭: 1:N 관계를 조인한 뒤 부모의 합계를 그대로 SUM 하면 자식 수만큼 부풀려짐. 서브쿼리로 자식 합계를 먼저 구한 뒤 조인해야 안전\n\n### 📒 이 단원과 직결된 『SQL 자격검정 실전문제(노랭이)』 & 기출 킬러 족보\n\n- **[노랭이 1과목 47번 ★중요체크]** 슈퍼/서브타입 데이터 모델 변환: 개별로 발생하면 `OneToOne(1:1)`, 슈퍼+서브를 함께 처리하면 `Plus(슈퍼+서브)`, 전체를 일괄 처리하면 `Single(All-in-One)` 타입으로 변환한다.\n- **[노랭이 1과목 51번]** 조인이 빈번할 경우 **FK(외래키)에도 인덱스를 생성**하는 것이 성능에 좋으며, DB에 물리적 FK 제약조건을 생성하지 않았더라도 조인 성능을 위해 FK 칼럼에 인덱스를 생성할 수 있다.\n- **[30회 기출 6번]** 1:N 관계에서 1쪽(부모)이 N쪽(자식)의 모든 데이터를 포함하는 것은 아니며, N쪽도 1쪽의 모든 데이터를 포함하지 않을 수 있다(선택 참여 시).\n\n---\n\n## ✍️ STEP 4. 실전 적중! 단원 마무리 확인 문제\n\n<div class=\"sqld-quiz-box\" data-answer=\"3\">\n\n**Q. [1-2-2 대표 적중 문제]** 슈퍼타입/서브타입(Extended ER) 데이터 모델을 물리적 테이블로 변환하는 방법 중, 전체 데이터를 한꺼번에 일괄 처리하는 트랜잭션이 주로 발생할 때 **하나의 통합 테이블**로 변환하는 방식과 그 특징으로 **올바른** 것은?\n\n- ① OneToOne Type — 조인(Join)은 발생하지 않으나 `NULL` 값이 많이 발생하여 디스크 공간이 낭비된다.\n- ② Plus Type — 슈퍼타입과 서브타입 테이블 간 조인(Join)이 빈번하게 발생하여 관리가 쉽다.\n- ③ Single Type (All-in-One Type) — 조인 성능은 가장 우수하고 `UNION` 연산이 불필요하지만, 서브타입별 전용 칼럼들에 `NULL` 값이 많이 발생하여 I/O 성능이 저하될 수 있다.\n- ④ Single Type (All-in-One Type) — 테이블이 여러 개로 분리되어 서브타입 간 통합 조회 시 `UNION` 연산으로 인해 성능이 저하된다.\n\n<details>\n<summary>💡 <b>정답 및 시나공·과외노트식 보기별 완벽 해설 확인하기 (클릭)</b></summary>\n\n**정답: ③**\n- **해설**: 전체를 하나의 테이블로 합치는 방식은 **Single Type (All-in-One Type)**입니다. 테이블이 1개이므로 조인이나 `UNION`이 전혀 필요 없어 전체 일괄 조회에 유리하지만, 특정 서브타입에만 해당하는 컬럼들이 다른 서브타입 행에서는 모두 `NULL`이 되어 블록 크기가 커지고 I/O 성능은 나빠질 수 있습니다.\n\n</details>\n</div>\n\n---\n\n## ⏱️ STEP 5. 시험장 입실 직전 30초 최종 요약 카드\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · 관계 → SQL 에서 **외래키(FK)** → 조회 시 **JOIN** 으로 활용\n> · 1:N 조인 → 결과 행 수 = 자식 N (부모 1행이 N행으로 부풀려짐)\n> · M:N → **교차 엔터티** 거쳐 두 번 조인 (수강·주문상세 등)\n> · 외부 조인 시 추가 조건은 반드시 **ON 절**에 (WHERE 에 두면 INNER 됨)\n> · 조인 조건 누락 → **카티션 곱** (행 수 폭발)"}, {"id": "ch-08", "index": 8, "title": "1-2-3. 모델이 표현하는 트랜잭션의 이해", "subj_id": "tab1", "subj_name": "1과목 · 데이터 모델링의 이해", "badge": "1과목 2장 · 데이터 모델과 SQL", "md": "# 1-2-3. 모델이 표현하는 트랜잭션의 이해\n\n> **단원 분류**: `1과목` > `1-2. 데이터 모델과 SQL` > **`1-2-3. 모델이 표현하는 트랜잭션의 이해`**\n> **🎯 출제 빈도**: `★★★★☆ (빈출)` &nbsp;|&nbsp; **🧠 두문자 암기 공식**: `트랜잭션 = All or Nothing (전부 반영되거나 전부 취소되거나!)`\n\n## 🎯 과외선배의 1분 브리핑 & 핵심 구조도\n\n> [!TIP]\n> **👨‍🏫 1:1 과외선배의 학습 코칭 (`유선배 과외노트` 스타일)**\n> 데이터 모델에서 **필수 참여 관계(`|` 실선)**로 묶여 있는 두 엔터티(예: 계좌이체의 출금내역과 입금내역, 주문과 주문상세)는 반드시 **하나의 트랜잭션(원자성, All or Nothing)**으로 동시에 입력·삭제되어야 한다는 원리가 핵심입니다.\n\n> 트랜잭션(Transaction)이란 함께 성공하거나 함께 실패해야 하는 데이터 작업의 묶음이다. 모델은 이 묶음을 관계의 필수성과 식별성으로 표현한다.\n\nex) 계좌 이체에서 A에서 1만원이 빠지고 B에 1만원이 들어와야 정상. A에서만 빠지고 멈추면 돈이 사라지므로, 둘 다 성공하거나 둘 다 취소되어야 함\n\n### 🗺️ 한눈에 보는 핵심 구조도: 트랜잭션의 ACID\n\n| 트랜잭션 4대 특성 (ACID) | 영문명 | 핵심 의미 (시험 필수 키워드) |\n| :---: | :---: | :--- |\n| **A — 원자성** | **Atomicity** | 트랜잭션의 연산은 **전부 실행되거나 전혀 실행되지 않아야 함 (`All or Nothing`)** |\n| **C — 일관성** | **Consistency** | 트랜잭션 실행 전후에 데이터베이스의 **무결성 제약조건과 일관성이 유지**되어야 함 |\n| **I — 고립성** | **Isolation** | 실행 중인 트랜잭션의 중간 결과를 **다른 트랜잭션이 간섭하거나 볼 수 없음** |\n| **D — 영속성(지속성)** | **Durability** | 일단 `COMMIT`된 트랜잭션의 결과는 시스템 장애가 나도 **영구적으로 보존**됨 |\n\n| 성질 | 의미 | 비유 |\n|---|---|---|\n| 원자성 (Atomicity) | 모두 성공하거나 모두 실패 | 이체는 출금+입금 한 묶음 |\n| 일관성 (Consistency) | 트랜잭션 전후 데이터 무결성 규칙 유지 | 잔고 합계는 변하지 않음 |\n| 고립성 (Isolation) | 동시 실행이라도 서로 간섭 없음 | 다른 사람 이체와 겹치지 않음 |\n| 지속성 (Durability) | 커밋되면 시스템이 죽어도 보존 | 영수증으로 기록됨 |\n\n---\n\n## 📘 STEP 1. 시험 출제 핵심 이론 & 강의 도표 완벽 정복\n\n### 📌 1. 트랜잭션(Transaction)의 개념과 원자성(All or Nothing)\n- **트랜잭션의 정의**: 데이터베이스의 **논리적 연산단위 (하나의 연속적인 업무단위)**이다.\n- 하나의 트랜잭션에는 하나 이상의 SQL 문장이 포함되며, **분할할 수 없는 최소의 단위**이기 때문에 전부 적용하거나 전부 취소한다 (**`All or Nothing` — 원자성, Atomicity**).\n- 예: 계좌이체 시 `A계좌 출금(UPDATE)`과 `B계좌 입금(UPDATE)`은 하나의 트랜잭션으로 묶여야 하며, 둘 중 하나만 성공하고 하나가 실패한 채로 커밋될 수 없다.\n\n![트랜잭션의 All or Nothing(원자성) 개념도 (부분 커밋 불가)](images/p019_img01.png)\n\n### 📌 2. 필수적/선택적 관계와 트랜잭션의 연결\n- 데이터 모델(ERD)의 **관계선택사양(필수참여 `|` vs 선택참여 `O`)**은 단순한 그림이 아니라 **업무의 트랜잭션이 어떻게 수행되어야 하는지**를 정의한 것이다!\n  1. **필수적 관계 (Mandatory, 양쪽 모두 필수 `|` - `|`)**:\n     - 부모와 자식이 **반드시 하나의 트랜잭션 안에서 동시에 입력/처리**되어야 함을 의미한다. (예: 계좌 개설 시 원장과 거래내역이 동시에 생성되어야 하는 경우)\n  2. **선택적 관계 (Optional, 한쪽이 선택 `O`)**:\n     - 부모 엔터티의 인스턴스가 먼저 생성된 후, 자식 엔터티의 인스턴스는 **별도의 트랜잭션으로 나중에 독립적으로 발생**할 수 있음을 의미한다. (예: 고객 등록 후 주문은 나중에 발생할 수 있음)\n\n![IE 표기법과 Barker 표기법에서의 필수/선택 관계 및 트랜잭션 해석](images/p019_img02.png)\n\n---\n\n## 🔍 STEP 2. 직관적 Before & After 비교 & 실전 SQL 트레이스\n\n### 🔄 [Before & After] 트랜잭션이 깨지면\n\nA 계좌에서 B 계좌로 1만원 이체. 출금(A) → 입금(B) 두 작업 사이에서 시스템이 멈춘 상황 vs 두 작업을 한 트랜잭션으로 묶어 ROLLBACK 한 상황의 잔고 비교\n\n### Before — 출금만 성공, 입금 실패\n\n| 계좌 | 잔고 |\n|---|---|\n| A | 90,000 (10,000 빠짐) |\n| B | 50,000 (그대로) |\n\n1만원이 사라짐\n\n### After — 트랜잭션으로 묶었을 때\n\nROLLBACK 후\n\n| 계좌 | 잔고 |\n|---|---|\n| A | 100,000 (원상복구) |\n| B | 50,000 |\n\n데이터 보존\n\n출금과 입금은 업무적으로 한 사건(이체)이지만 SQL 입장에선 별개 UPDATE 두 개. 묶지 않으면 중간 실패가 곧 데이터 모순(원자성 깨짐). 모델에서 두 엔터티가 식별 관계나 필수 관계로 묶여 있다는 건 곧 \"이 INSERT/UPDATE/DELETE 들은 한 트랜잭션 안에서 함께 처리해야 한다\"는 신호. 함께 변해야 하는 데이터는 코드에서도 BEGIN ~ COMMIT 으로 한 묶음이 되도록 설계해야 한다.\n\n### 💻 [SQL 실전 트레이스] 트랜잭션 묶음\n\nINSERT/UPDATE/DELETE 는 **DML**, COMMIT/ROLLBACK 은 **TCL** 로 트랜잭션 마감\n\n```sql\n-- 시작 (Oracle은 DML 실행 시 자동 시작)\nINSERT INTO ORDERS(ORDER_ID, CUST_ID, ORD_DATE)\nVALUES (1001, 'C001', SYSDATE);\n\nINSERT INTO ORDER_DETAIL(ORDER_ID, PROD_ID, QTY)\nVALUES (1001, 'P01', 2);\n\nINSERT INTO ORDER_DETAIL(ORDER_ID, PROD_ID, QTY)\nVALUES (1001, 'P02', 1);\n\nCOMMIT;  -- 한 묶음으로 영구 저장\n\n-- 중간에 오류 발생 시\nROLLBACK; -- 모두 취소\n```\n\n---\n\n## 🚨 STEP 3. 출제위원 단골 함정 O/X & 노랭이·기출 문항별 족보\n\n### ⚠️ 시험장 단골 함정 vs 정답 1:1 대조표\n\n| 함정 | 정답 |\n|---|---|\n| ACID 4성질 | 원자성 / 일관성 / 고립성 / 지속성 |\n| 모델에서 트랜잭션의 흔적 | 관계의 필수성, 식별성 |\n| \"원자성은 일부만 반영해도 된다\" | 전부 또는 전무 |\n| 식별 관계의 의미 | 부모 없이 자식 존재 불가 → 함께 처리 |\n| 필수 관계의 의미 | 관계 자체가 반드시 있어야 함(NOT NULL FK) |\n| COMMIT의 역할 | 트랜잭션을 영구 반영(지속성) |\n\n단골 출제: \"모델은 트랜잭션을 표현할 수 없다\" → 틀림. 관계의 필수성·식별성으로 표현 가능\n\n### 📒 이 단원과 직결된 『SQL 자격검정 실전문제(노랭이)』 & 기출 킬러 족보\n\n- **[노랭이 2과목 19번 ★중요체크]** 참조동작(Insert/Delete Action): **Dependent**(Master에 PK 존재할 때만 Child 입력 허용), **Automatic**(Master PK가 없으면 자동 생성 후 Child 입력), **Cascade**(Master 삭제 시 Child 연쇄 삭제), **Restrict**(Child에 참조 행이 없을 때만 Master 삭제 허용).\n\n---\n\n## ✍️ STEP 4. 실전 적중! 단원 마무리 확인 문제\n\n<div class=\"sqld-quiz-box\" data-answer=\"3\">\n\n**Q. [1-2-3 대표 적중 문제]** 다음 중 데이터 모델이 표현하는 트랜잭션(Transaction)의 이해와 참조 동작(Reference Action)에 대한 설명으로 **가장 부적절한** 것은?\n\n- ① 트랜잭션은 데이터베이스의 논리적 작업 단위로서, 하나의 트랜잭션에 묶인 작업들은 모두 완벽히 처리되거나 아니면 전혀 처리되지 않아야 한다(All or Nothing).\n- ② 부모 엔터티와 자식 엔터티가 상호 **필수 참여(Mandatory) 관계**로 연결되어 있다면, 두 엔터티의 데이터는 하나의 트랜잭션으로 동시에 입력되어야 데이터 무결성이 보장된다.\n- ③ 입력 참조동작(Insert Action) 중 **Dependent** 방식은 부모(Master) 테이블에 해당 PK가 없는 경우 부모 PK를 자동으로 생성한 후 자식(Child) 데이터를 입력하는 방식이다.\n- ④ 삭제 참조동작(Delete Action) 중 **Cascade** 방식은 부모(Master) 테이블의 행을 삭제할 때 연관된 자식(Child) 테이블의 행들도 함께 연쇄적으로 삭제하는 방식이다.\n\n<details>\n<summary>💡 <b>정답 및 시나공·과외노트식 보기별 완벽 해설 확인하기 (클릭)</b></summary>\n\n**정답: ③**\n- **해설**: 부모 테이블에 PK가 없을 때 부모 PK를 자동으로 생성한 뒤 자식을 입력하는 것은 **Automatic** 방식입니다! **Dependent** 방식은 부모 테이블에 PK가 **이미 존재하는 경우에만** 자식 입력을 허용하고, 없으면 입력을 거부하는 방식입니다.\n\n</details>\n</div>\n\n---\n\n## ⏱️ STEP 5. 시험장 입실 직전 30초 최종 요약 카드\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · ACID = **원자성·일관성·고립성·지속성**\n> · 모델 단서 = **관계의 필수성** (반드시 있어야) + **관계의 식별성** (실선 = 부모 키가 자식 PK 일부)\n> · COMMIT = 영구 반영 (지속성) / ROLLBACK = 트랜잭션 시작 시점으로 복구\n> · DDL 은 자동 COMMIT — 따라서 ROLLBACK 불가"}, {"id": "ch-09", "index": 9, "title": "1-2-4. NULL 속성의 이해", "subj_id": "tab1", "subj_name": "1과목 · 데이터 모델링의 이해", "badge": "1과목 2장 · 데이터 모델과 SQL", "md": "# 1-2-4. NULL 속성의 이해\n\n> **단원 분류**: `1과목` > `1-2. 데이터 모델과 SQL` > **`1-2-4. Null 속성의 이해`**\n> **🎯 출제 빈도**: `★★★★★ (매회 1~2문항 100% 출제!)` &nbsp;|&nbsp; **🧠 두문자 암기 공식**: `단일행 연산(+,-,*,/,=) + NULL = NULL 또는 UNKNOWN / 집계함수(SUM,AVG,COUNT)는 NULL 무시!`\n\n## 🎯 과외선배의 1분 브리핑 & 핵심 구조도\n\n> [!TIP]\n> **👨‍🏫 1:1 과외선배의 학습 코칭 (`유선배 과외노트` 스타일)**\n> SQLD 전 과목을 통틀어 `NULL`은 가장 중요한 출제 테마입니다! **가로 방향(행 내부의 사칙연산 `NULL + 100`) 결과는 무조건 `NULL`**, **비교연산(`NULL = NULL`, `NULL > 0`) 결과는 무조건 `UNKNOWN`(거짓 취급)**, 반대로 **세로 방향 집계함수(`SUM`, `AVG`, `MAX`, `MIN`, `COUNT(컬럼)`)는 `NULL`인 행을 아예 제외하고 계산**합니다!\n\n> NULL이란 값이 없거나 아직 모름을 나타내는 특수한 표시다. 0이나 공백과는 전혀 다르다.\n\nex) 설문지에서 \"월 소득: 0원\"은 0이라는 값이 적힌 것, \"월 소득: ␣\"(한 칸 띈 상태)는 공백 문자, \"월 소득: 미작성\"이 NULL(값 자체가 없음)\n\n### 🗺️ 한눈에 보는 핵심 구조도: NULL의 비교\n\n```\n   ┌───────┬───────┬───────┐\n   │   0   │  ' '  │  NULL  │\n   ├───────┼───────┼───────┤\n   │ 숫자값  │ 공백문자 │ 값 없음│\n   │ 존재O  │ 존재O  │ 존재X  │\n   └───────┴───────┴───────┘\n```\n\n| 비교 | 0 | 공백 | NULL |\n|---|---|---|---|\n| 데이터 존재 여부 | 있음 | 있음 | 없음 |\n| 비교 가능 여부 | 가능 | 가능 | 불가(`= NULL` 안 됨) |\n| 산술연산 | 가능 | — | 불가(결과는 모두 NULL) |\n\n---\n\n## 📘 STEP 1. 시험 출제 핵심 이론 & 강의 도표 완벽 정복\n\n### 📌 1. NULL의 정확한 의미\n- **NULL의 정의**:\n  1. **아직 정의되지 않은 미지의 값 (Unknown Value)**\n  2. **현재 데이터를 입력하지 못하는 경우 (값의 부재, Absence of Value)**\n- **주의 (`NULL` ≠ `0` ≠ `''` 공백문자)**:\n  - 숫자 **`0`**이나 공백문자 **`' '`**는 **특정한 값이 있는 것**이지만, **`NULL`은 아예 값이 존재하지 않거나 확정되지 않은 상태**이다!\n  - *(단, **Oracle에서는 빈 문자열 `''`을 입력하면 `NULL`로 취급**하고, **SQL Server에서는 `''`을 길이가 0인 빈 문자열 값 그대로 취급**한다는 차이는 2과목에서 매우 중요!)*\n\n### 📌 2. NULL이 포함된 연산의 2대 대원칙 (★시험 매회 출제!)\n\n| 구분 | 연산 방향 및 대상 | `NULL` 처리 규칙 및 결과 (★절대 빈출!) |\n| :---: | :--- | :--- |\n| **1. 가로 연산**<br>*(단일 행 내부 연산)* | • **사칙연산**: `NULL + 100`, `NULL * 0`<br>• **비교연산**: `COL = NULL`, `COL != NULL` | • 사칙연산 결과는 무조건 **`NULL`**!<br>• 비교연산 결과는 무조건 **`UNKNOWN` (WHERE절에서 거짓 취급, 조회 0건)**! |\n| **2. 세로 연산**<br>*(다중 행 집계 함수)* | • **`SUM`, `AVG`, `MAX`, `MIN`, `COUNT(컬럼)`** | • 연산 대상에서 **`NULL`인 행을 아예 제외(무시)**하고 남은 행끼리만 계산!<br>• 예: `[10, 20, NULL]`의 `AVG`는 `30 / 3`이 아니라 **`30 / 2 = 15`**!<br>• *(단, `COUNT(*)`는 `NULL` 포함 전체 행 개수 반환)* |\n\n1. **단일행 연산 (가로 연산)**:\n   - `NULL`과의 모든 **산술 연산 (`+`, `-`, `*`, `/`)의 결과는 무조건 `NULL`**이다.\n   - `NULL`과의 모든 **일반 비교 연산 (`=`, `!=`, `<>`, `>`, `<`)의 결과는 `UNKNOWN` (WHERE절에서는 `FALSE`처럼 동작하여 한 건도 조회되지 않음)**이다! 반드시 **`IS NULL` / `IS NOT NULL`** 연산자를 사용해야 한다.\n2. **집계함수 연산 (세로 연산)**:\n   - `SUM`, `AVG`, `MIN`, `MAX`, `COUNT(컬럼명)` 등 **집계함수는 `NULL` 값을 연산 대상에서 제외(무시)**하고 처리한다!\n   - 단, 모든 행이 `NULL`인 컬럼에 대해 `SUM`, `AVG`, `MAX`, `MIN`을 수행하면 결과는 `0`이 아니라 **`NULL`**이고, **`COUNT`만 결과가 `0`**이 나온다!\n\n![NULL이 포함된 조건절 및 집계함수 결과 비교](images/p020_img01.png)\n\n### 📌 3. 데이터 모델(ERD)에서의 NULL 표기법\n- **IE 표기법**: 속성 옆에 `NULL` 허용 여부를 직접 텍스트(`NULL` / `NOT NULL`)로 명시\n- **Barker 표기법**: 속성명 앞에 **`o` (동그라미)**를 붙이면 `NULL` 허용(Optional), **`*` (별표)**를 붙이면 `NOT NULL` 필수(Mandatory)\n\n![IE 표기법과 Barker 표기법의 NULL 속성 표기 비교](images/p020_img02.png)\n\n---\n\n## 🔍 STEP 2. 직관적 Before & After 비교 & 실전 SQL 트레이스\n\n### 🔄 [Before & After] NULL이 끼면 결과가 달라진다\n\n기본급(SAL)에 커미션(COMM)을 더해 총급여를 구하는 상황. 아래 EMP 에서 B는 커미션이 등록되지 않아 COMM 이 NULL. 단순 합산 vs NVL 처리 결과\n\n### EMP\n\n| NAME | SAL | COMM |\n|---|---|---|\n| A | 100 | 10 |\n| B | 200 | NULL |\n| C | 300 | 20 |\n\n### `SELECT NAME, SAL + COMM FROM EMP;`\n\n| NAME | SAL+COMM |\n|---|---|\n| A | 110 |\n| B | NULL |\n| C | 320 |\n\n### `SELECT NAME, SAL + NVL(COMM, 0) FROM EMP;`\n\n| NAME | TOTAL |\n|---|---|\n| A | 110 |\n| B | 200 |\n| C | 320 |\n\nNULL 은 산술 연산에 들어가면 결과 전체를 NULL 로 만든다. B처럼 커미션이 비어 있을 뿐인 직원의 총급여까지 사라져버린다. NVL(COMM, 0) 으로 \"커미션 없음 = 0\"으로 안전하게 치환하면 NULL 행도 정상 합산되어 보고서에 누락이 안 생긴다. 합계·평균 같은 집계 전에는 늘 NULL 처리 방식을 정해두는 것이 안전.\n\n### 💻 [SQL 실전 트레이스] NULL 다루기\n\n```sql\n-- 잘못된 비교\nSELECT * FROM EMP WHERE COMM = NULL;     -- 결과 0건\nSELECT * FROM EMP WHERE COMM != NULL;    -- 결과 0건\n\n-- 올바른 비교\nSELECT * FROM EMP WHERE COMM IS NULL;\nSELECT * FROM EMP WHERE COMM IS NOT NULL;\n\n-- NULL 대체\nSELECT NAME, NVL(COMM, 0) AS COMM_FIX FROM EMP;\nSELECT NAME, COALESCE(PHONE, EMAIL, '연락처 없음') FROM MEMBER;\n```\n\n---\n\n## 🚨 STEP 3. 출제위원 단골 함정 O/X & 노랭이·기출 문항별 족보\n\n### ⚠️ 시험장 단골 함정 vs 정답 1:1 대조표\n\n| 함정 | 정답 |\n|---|---|\n| `WHERE COL = NULL`의 결과 | 결과 없음(0건). IS NULL을 사용 |\n| `NULL + 100` | NULL |\n| AVG(컬럼) | NULL 제외 평균(분모도 줄어듦) |\n| COUNT(*) vs COUNT(컬럼) | `*`는 NULL 포함, 컬럼명은 NULL 제외 |\n| `NULL = NULL`의 결과 | FALSE(UNKNOWN) |\n| Oracle ORDER BY ASC 기본 NULL 위치 | 마지막(LAST) |\n| `NULLIF(10, 10)` | NULL |\n| `COALESCE(NULL, NULL, 'X')` | 'X' |\n\n단골 함정: \"NULL은 0이다\" \"NULL은 공백이다\" → 둘 다 틀림. NULL = 값 없음\n\n### 📒 이 단원과 직결된 『SQL 자격검정 실전문제(노랭이)』 & 기출 킬러 족보\n\n- **[21회 기출 27번 / 단답형 1번]** `NULL`끼리, 또는 `NULL`과의 일반 비교연산(`=`, `<>`, `>`, `<`) 결과는 항상 **`UNKNOWN` (WHERE절에서 False 취급)**이며, 사칙연산 시 `NULL`을 반환한다.\n- **[노랭이 1과목 핵심]** ERD 표기법에서 속성의 `NULL` 허용 여부는: **IE 표기법**에서는 관계선 위의 **원(`O`)**으로 선택 참여(FK `NULL` 허용 가능)를 나타내고, **Barker 표기법**에서는 속성명 앞의 **`o`(선택, `NULL` 허용)**와 **`*`(필수, `NOT NULL`)** 기호로 명확히 구분한다.\n\n---\n\n## ✍️ STEP 4. 실전 적중! 단원 마무리 확인 문제\n\n<div class=\"sqld-quiz-box\" data-answer=\"3\">\n\n**Q. [1-2-4 대표 적중 문제]** `EMP` 테이블의 4개 행에 대해 `BONUS` 컬럼 값이 각각 `[100, 200, NULL, 300]`이고 `COMM` 컬럼 값이 각각 `[50, NULL, 100, 50]`일 때, 다음 중 SQL 실행 결과와 설명이 **올바른** 것은?\n\n- ① `SELECT SUM(BONUS + COMM) FROM EMP;` 의 결과는 `800`이다.\n- ② `SELECT AVG(BONUS) FROM EMP;` 의 결과는 `150`이다.\n- ③ `SELECT COUNT(BONUS), COUNT(*) FROM EMP;` 의 결과는 각각 `3`과 `4`이다.\n- ④ `SELECT COUNT(*) FROM EMP WHERE BONUS = NULL;` 의 결과는 `1`이다.\n\n<details>\n<summary>💡 <b>정답 및 시나공·과외노트식 보기별 완벽 해설 확인하기 (클릭)</b></summary>\n\n**정답: ③**\n- **해설**:\n  - ③ `COUNT(BONUS)`는 `NULL`을 제외한 `3`을 반환하고, `COUNT(*)`는 `NULL` 포함 전체 행 수인 `4`를 반환합니다 (정답!).\n  - ① 가로 방향 덧셈 `BONUS + COMM`을 먼저 수행하면 `[150, NULL, NULL, 350]`이 되고, 이를 `SUM`하면 `500`이 됩니다 (`800` 아님!).\n  - ② `AVG(BONUS)`는 `NULL` 행을 분모에서도 제외하므로 `(100 + 200 + 300) / 3 = 200`입니다 (`150`이 되려면 `AVG(NVL(BONUS, 0))`이어야 함).\n  - ④ `BONUS = NULL`은 항상 `UNKNOWN`이므로 결과 건수는 `0`입니다 (`IS NULL`을 써야 `1`이 나옵니다).\n\n</details>\n</div>\n\n---\n\n## ⏱️ STEP 5. 시험장 입실 직전 30초 최종 요약 카드\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · NULL = **값 없음** (≠ 0, ≠ 공백)\n> · 비교는 `IS NULL` / `IS NOT NULL` 만 가능 (`= NULL` 항상 거짓)\n> · NULL + 값 = **NULL**\n> · COUNT(*) = NULL 포함 / COUNT(컬럼) = NULL 제외 / SUM·AVG·MAX·MIN = NULL **무시**\n> · NVL(A, B) = A null 이면 B / NVL2(A, B, C) / NULLIF(A, B) / COALESCE(...)\n> · Oracle ASC 기본 NULL 위치 = **마지막 (NULLS LAST)**"}, {"id": "ch-10", "index": 10, "title": "1-2-5. 본질식별자 vs 인조식별자", "subj_id": "tab1", "subj_name": "1과목 · 데이터 모델링의 이해", "badge": "1과목 2장 · 데이터 모델과 SQL", "md": "# 1-2-5. 본질식별자 vs 인조식별자\n\n> **단원 분류**: `1과목` > `1-2. 데이터 모델과 SQL` > **`1-2-5. 본질식별자 vs 인조식별자`**\n> **🎯 출제 빈도**: `★★★★☆ (빈출)` &nbsp;|&nbsp; **🧠 두문자 암기 공식**: `인조식별자(대리키)의 양날의 검: 조인/개발은 편해지지만 ➔ 데이터 중복 막기 위해 별도 UNIQUE 인덱스 필요!`\n\n## 🎯 과외선배의 1분 브리핑 & 핵심 구조도\n\n> [!TIP]\n> **👨‍🏫 1:1 과외선배의 학습 코칭 (`유선배 과외노트` 스타일)**\n> 본질식별자(원래 업무 속성) 대신 **인조식별자(일련번호 같은 대리키)**를 쓰면 복합 PK가 단일 컬럼으로 줄어들어 **SQL 조인이 단순해지고 개발이 편리**해집니다. 하지만 원래 업무 속성 조합의 **중복 데이터 입력을 막을 수 없어 별도의 `UNIQUE INDEX(제약조건)`를 추가로 생성해야 하므로 인덱스 저장공간·DML 부하가 발생**한다는 단점이 시험에 무조건 나옵니다!\n\n> 본질**식별자**는 업무에서 자연스럽게 도출된 식별자, 인조식별자는 인위적으로 만든 식별자다. 둘의 장단점을 알고 상황에 맞게 선택.\n\nex) 도서관에서 ISBN(출판사 부여 = 본질식별자)과 자체 분류번호 A-001(도서관 임의 부여 = 인조식별자) 두 가지로 책을 구분 가능. ISBN이 길고 형식이 들쑥날쑥해서 도서관은 자체 번호를 더 자주 씀\n\n### 🗺️ 한눈에 보는 핵심 구조도: 본질 vs 인조\n\n| 구분 | 본질식별자 | 인조식별자 |\n|---|---|---|\n| 출처 | 업무에서 자연 발생 | 인위적으로 부여 |\n| 예시 | 주민번호 · 사업자번호 · ISBN | 자동증가 ID · UUID · GUID |\n| 의미 | 업무적 의미 있음 | 의미 없음 (대체 키) |\n| 변경 | 변경되면 큰 영향 | 자유롭게 부여 가능 |\n\n```\n[ 식별자 후보 ]\n      │\n      ▼\n업무에서 자연 도출되는가?\n      ├─ NO  ─→  [ 인조식별자 ]\n      │\n      └─ YES ─→  너무 길거나 보안·변경 위험 있는가?\n                       ├─ YES ─→ [ 인조식별자 ]\n                       └─ NO  ─→ [ 본질식별자 ]\n```\n\n---\n\n## 📘 STEP 1. 시험 출제 핵심 이론 & 강의 도표 완벽 정복\n\n### 📌 1. 식별자의 대체 여부에 따른 분류\n- **본질식별자 (Original / Natural Identifier, 원조키)**:\n  - **업무에 의해 자연스럽게 만들어지는 식별자** (예: 주민등록번호, 사원번호, 과목코드 등)\n- **인조식별자 (Surrogate / Artificial Identifier, 대리키)**:\n  - 원조식별자가 복잡한 구성을 가지고 있기 때문에(복합 PK 속성이 너무 많을 때) **인위적으로 만든 식별자** (예: 주문번호 일련번호 `SEQ`, 게시판 글번호 등)\n  - 주로 **식별자 관계가 연속되어 주식별자(PK)의 속성 개수가 지나치게 많아질 때**, 조인 SQL을 단순화하기 위해 도입한다.\n\n![본질식별자(복합 PK)와 인조식별자(단일 일련번호 PK) 모델 비교](images/p021_img01.png)\n\n![본질식별자 사용 시 데이터 예시](images/p021_img02.png)\n\n![본질식별자 사용 시 조인 SQL과 인조식별자 사용 시 조인 SQL 비교 1](images/p021_img03.png)\n\n![본질식별자 사용 시 조인 SQL과 인조식별자 사용 시 조인 SQL 비교 2](images/p021_img04.png)\n\n### 📌 2. 인조식별자(대리키) 사용 시의 장단점 및 주의사항 (★단골 출제!)\n- **인조식별자의 장점**:\n  - 복합 식별자를 단일 속성(일련번호 등)으로 대체하므로 **조인(JOIN) 조건이 단순해지고 개발 편의성이 향상**된다.\n- **인조식별자의 2대 단점 (★시험에서 가장 자주 묻는 핵심 포인트!)**:\n  1. **중복 데이터 발생 가능성 (데이터 정합성 저하)**:\n     - 본질식별자(예: `계약번호 + 상품코드 + 시작일자`)를 PK로 쓰면 동일한 조합이 두 번 입력될 때 PK 제약조건이 막아주지만, 인조식별자(`일련번호 1, 2, 3...`)를 PK로 쓰면 **업무적으로 완전히 동일한 데이터가 일련번호만 다르게 해서 중복 삽입되는 것을 PK만으로는 막을 수 없다!** (이를 방지하려면 원래의 본질식별자 속성 조합에 별도의 **`UNIQUE` 제약조건/인덱스**를 추가로 걸어야 함)\n  2. **불필요한 인덱스(Index) 추가 생성 및 저장공간 낭비**:\n     - PK를 위한 인조식별자 인덱스 외에, 실제 업무 조회 조건(WHERE절)에서 자주 쓰이는 본질식별자 컬럼들에 대해 **별도의 인덱스를 추가로 생성해야 하므로 저장공간 낭비 및 DML(INSERT/UPDATE/DELETE) 시 인덱스 유지보수 부하**가 발생한다.\n\n![인조식별자 도입 시 중복 데이터가 발생하는 문제 예시](images/p022_img01.png)\n\n![인조식별자 도입 시 발생하는 SQL 및 인덱스 측면의 영향](images/p022_img02.png)\n\n---\n\n## 🔍 STEP 2. 직관적 Before & After 비교 & 실전 SQL 트레이스\n\n### 🔄 [Before & After] 인조식별자 도입의 효과\n\n회원 김철수의 주민번호(800101-1234567)를 회원 PK 로 쓰는 경우 vs 인조식별자(M01)를 PK 로 두고 주민번호는 UNIQUE 로 보존하는 경우. 자식 테이블(주문)에 어떤 값이 흩뿌려지는가\n\n### Before — 본질식별자(주민번호)를 PK로\n\n| 주문 (FK: 주민번호) |\n|---|\n| 800101-1234567 → 김철수 주문 1 |\n| 800101-1234567 → 김철수 주문 2 |\n\n모든 자식 테이블에 주민번호가 흩뿌려져 개인정보 노출 위험 증가\n\n### After — 인조식별자(MEMBER_ID) 도입\n\n**MEMBER**\n\n| MEMBER_ID(PK) | RRN(UQ) | NAME |\n|---|---|---|\n| M01 | 800101-1234567 | 김철수 |\n\n**ORDER (FK: MEMBER_ID)**\n\n| ORDER_ID | MEMBER_ID |\n|---|---|\n| 1 | M01 |\n| 2 | M01 |\n\n자식 테이블엔 의미 없는 ID만 들어가 보안·JOIN 효율 모두 향상\n\nPK 는 모든 자식 테이블에 FK 로 흩어지므로, 본질식별자가 PK 면 그 값(주민번호)도 함께 흩어진다 — 보안 사고의 표면적이 그대로 늘어남. 본질키는 길거나 형식이 들쑥날쑥해 인덱스·조인 비용도 커진다. 인조식별자(M01 같은 짧은 키)를 PK 로 두고 본질키는 회원 테이블 한 곳에 UNIQUE 로 가둬두면 보안·성능·일관성이 한꺼번에 정리된다. 단, 본질키의 무결성 검증을 위해 UNIQUE 제약을 빼먹지 않는 것이 핵심.\n\n### 💻 [SQL 실전 트레이스]\n\n### 본질식별자 사용\n\n```sql\nCREATE TABLE BOOK (\n    ISBN     VARCHAR2(20) PRIMARY KEY,  -- 본질식별자\n    TITLE    VARCHAR2(200),\n    AUTHOR   VARCHAR2(100)\n);\n```\n\n### 인조식별자 사용\n\n```sql\nCREATE TABLE BOOK (\n    BOOK_ID  NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,  -- 인조식별자\n    ISBN     VARCHAR2(20) UNIQUE,                              -- 본질키는 UNIQUE로 유지\n    TITLE    VARCHAR2(200),\n    AUTHOR   VARCHAR2(100)\n);\n```\n\n권장 패턴: 인조식별자를 PK로, 본질식별자를 UNIQUE 제약으로 함께\n\n---\n\n## 🚨 STEP 3. 출제위원 단골 함정 O/X & 노랭이·기출 문항별 족보\n\n### ⚠️ 시험장 단골 함정 vs 정답 1:1 대조표\n\n| 함정 | 정답 |\n|---|---|\n| 인조식별자 단점 | 업무적 의미 없음, 중복 검증 어려움 |\n| 본질식별자 단점 | 길거나 변경 위험, 보안 이슈 |\n| \"인조식별자는 항상 본질식별자보다 좋다\" | 상황에 따라 다름 |\n| 인조식별자 도입 시 본질키 처리 | UNIQUE 제약으로 무결성 보존 |\n| \"주민등록번호를 PK로 쓰는 것이 보안상 권장된다\" | 보통 인조식별자 권장 |\n\n단골 출제: 인조식별자 도입 시 본질키에 UNIQUE 처리를 안 하면 중복 데이터 발생 가능\n\n### 📒 이 단원과 직결된 『SQL 자격검정 실전문제(노랭이)』 & 기출 킬러 족보\n\n- **[노랭이 1과목 핵심]** 인조식별자(Artificial/Surrogate Identifier) 적용 시 장점: 개발 편의성 향상 및 복잡한 복합 조인 단순화 / **단점: 중복 데이터 발생 가능성 증가(정합성 저하) 및 중복 방지를 위한 추가 인덱스(Alternate Key Index) 생성 필요**.\n\n---\n\n## ✍️ STEP 4. 실전 적중! 단원 마무리 확인 문제\n\n<div class=\"sqld-quiz-box\" data-answer=\"3\">\n\n**Q. [1-2-5 대표 적중 문제]** 다음 중 본질식별자(Natural Identifier)와 인조식별자(Artificial Identifier)에 대한 설명으로 **가장 부적절한** 것은?\n\n- ① 본질식별자는 업무에 의해 자연스럽게 만들어지는 식별자이고, 인조식별자는 주식별자 구성 속성이 너무 많거나 복잡할 때 인위적으로 만든 대리 식별자(일련번호 등)이다.\n- ② 인조식별자를 사용하면 복합 식별자 구조가 단일 속성으로 단순화되어 애플리케이션 개발 편의성이 높아지고 조인(Join) 조건이 간결해진다.\n- ③ 인조식별자를 주식별자(PK)로 설정하면 기존 본질식별자 속성들의 데이터 중복이 자동으로 방지되므로 추가적인 제약조건이나 인덱스를 생성할 필요가 없다.\n- ④ 인조식별자를 남용할 경우 불필요한 인덱스가 추가로 생성되어 저장공간이 낭비되고 입력·수정·삭제(DML) 시 인덱스 유지 비용이 증가할 수 있다.\n\n<details>\n<summary>💡 <b>정답 및 시나공·과외노트식 보기별 완벽 해설 확인하기 (클릭)</b></summary>\n\n**정답: ③**\n- **해설**: 인조식별자(예: `주문상세일련번호` 1, 2, 3...)만 PK로 지정하면, 원래 같으면 안 되는 본질 속성 조합(예: 동일한 `주문번호 + 상품코드`)이 일련번호만 다르게 해서 **중복 입력되는 현상을 막을 수 없습니다!** 따라서 이를 막기 위해 기존 본질식별자 컬럼들에 **별도의 `UNIQUE` 제약조건(추가 인덱스)**을 따로 걸어주어야 합니다.\n\n</details>\n</div>\n\n---\n\n## ⏱️ STEP 5. 시험장 입실 직전 30초 최종 요약 카드\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · 본질식별자 = 업무 자연 도출 (주민번호·사업자번호·ISBN)\n> · 인조식별자 = 인위적 부여 (자동증가 ID·UUID)\n> · \"주민번호를 PK로 쓰는 것이 권장된다\" → **틀림**. 보안·길이·변경 위험 → 인조식별자 권장\n> · 인조식별자 도입 시 본질키는 **UNIQUE 제약**으로 무결성 보존\n> · 인조식별자 단점 = **업무적 의미 없음**, 중복 데이터 자연 검출 어려움"}, {"id": "ch-11", "index": 11, "title": "2-1-1. 관계형 데이터베이스 개요", "subj_id": "tab2", "subj_name": "2과목 1장 · SQL 기본", "badge": "2과목 1장 · SQL 기본", "md": "# 2-1-1. 관계형 데이터베이스 개요\n\n> **단원 분류**: `2과목` > `2-1. SQL 기본` > **`2-1-1. 관계형 데이터베이스 개요`**\n> **🎯 출제 빈도**: `★★★★☆ (빈출)` &nbsp;|&nbsp; **🧠 두문자 암기 공식**: `DDL(수-자-카: CREATE·ALTER·DROP·RENAME·TRUNCATE) / DML(세-인-업-딜) / DCL(그-리) / TCL(커-롤-세)`\n\n## 🎯 과외선배의 1분 브리핑 & 핵심 구조도\n\n> [!TIP]\n> **👨‍🏫 1:1 과외선배의 학습 코칭 (`유선배 과외노트` 스타일)**\n> 2과목 1번 문제는 보통 **SQL 명령어 4대 분류(DDL / DML / DCL / TCL)** 짝짓기나 **순수 관계 연산자(`SELECT`, `PROJECT`, `JOIN`, `DIVIDE`)**에서 출제됩니다. 특히 **`TRUNCATE`는 `DELETE`와 달리 `DDL`이다!** 그리고 **`SELECT`는 행(수평) 추출, `PROJECT`는 열(수직) 추출**이라는 점을 절대 헷갈리지 마세요!\n\n> 관계형 데이터베이스(RDB)는 데이터를 행과 열로 된 표(테이블)로 저장하고, 표들 사이의 관계로 데이터를 관리하는 시스템이다.\n\nex) 엑셀 한 권에 여러 시트(=테이블), VLOOKUP 키(=외래키)로 시트끼리 연결되는 구조를 안전·동시 처리까지 가능하게 만든 것이 RDB\n\n### 🗺️ 한눈에 보는 핵심 구조도: 데이터베이스의 구조\n\n```\n   ┌──────────────────────────────────┐\n   │            DBMS                  │\n   │  ┌─────────────────────────┐    │\n   │  │         Database          │    │\n   │  │   ┌───────┐ ┌───────┐   │    │\n   │  │   │TABLE A│ │TABLE B│   │    │\n   │  │   │       │ │       │   │    │\n   │  │   └───┬───┘ └───┬───┘   │    │\n   │  │       └────관계──┘        │    │\n   │  └─────────────────────────┘    │\n   └──────────────────────────────────┘\n```\n\n| 용어 | 의미 |\n|---|---|\n| DBMS | 데이터베이스를 관리하는 SW (Oracle, MySQL 등) |\n| Database | 데이터의 저장소 |\n| Table | 행과 열로 된 표 |\n| Row(Record) | 한 줄(한 인스턴스) |\n| Column(Attribute) | 한 칸(속성) |\n\n---\n\n## 📘 STEP 1. 시험 출제 핵심 이론 & 강의 도표 완벽 정복\n\n### 📌 1. 데이터베이스(DB)와 DBMS, 관계형 데이터베이스(RDB) 구성요소\n- **데이터베이스(Database)**: 동시에 복수의 적용 업무를 지원할 수 있도록 복수 이용자의 요구에 대응해서 데이터를 받아들이고 저장·공급하기 위하여 일정한 구조에 따라서 편성된 데이터의 집합.\n- **DBMS (Database Management System)**: 이용자와 데이터베이스 사이에서 이용자의 요구에 따라 정보를 생성해주고, 데이터베이스를 관리해주는 소프트웨어.\n- **관계형 데이터베이스 (RDB, Relational Database)**:\n  - `1970년 E.F. Codd` 박사가 제안한 관계형 모델을 기반으로 구성.\n  - 데이터를 **2차원 테이블(Table, 릴레이션)** 형태로 표현하며, 정규화를 통한 합리적인 테이블 모델링을 통해 이상(Anomaly) 현상을 제거하고 데이터 중복을 피할 수 있다.\n  - 동시성 관리와 병행 제어를 통해 많은 사용자들이 동시에 데이터를 공유 및 조작할 수 있는 기능을 제공한다.\n\n![관계형 데이터베이스(RDB) 테이블(릴레이션)의 구성 요소 도식](images/p023_img01.png)\n\n![튜플(행), 속성(열), 카디널리티, 디그리 용어 매핑](images/p023_img02.png)\n\n| 관계형 데이터 모델 용어 | 일반 파일 시스템 용어 | 관계형 DB (SQL) 용어 | 의미 및 시험 핵심 포인트 |\n| :---: | :---: | :---: | :--- |\n| **릴레이션 (Relation)** | 파일 (File) | **테이블 (Table)** | 데이터를 저장하는 2차원 표 형태의 기본 단위 |\n| **튜플 (Tuple)** | 레코드 (Record) | **행 (Row, 로우)** | 테이블의 가로 한 줄 (하나의 개체 인스턴스) |\n| **속성 (Attribute)** | 필드 (Field) | **열 (Column, 칼럼)** | 테이블의 세로 한 칸 (데이터의 가장 작은 논리적 단위) |\n| **도메인 (Domain)** | 값의 범위 | 데이터 타입 + 제약조건 | 하나의 속성(컬럼)이 가질 수 있는 원자값들의 집합(범위) |\n| **카디널리티 (Cardinality)** | 레코드 수 | **행(Row)의 개수** | 릴레이션에 포함된 **튜플(행)의 수** (수시로 변함) |\n| **디그리 (Degree, 차수)** | 필드 수 | **열(Column)의 개수** | 릴레이션에 포함된 **속성(열)의 수** |\n\n### 📌 2. 릴레이션(테이블)의 4대 특징\n1. **튜플(행)의 유일성**: 한 릴레이션에 포함된 튜플들은 모두 상이하며, 중복된 튜플은 존재할 수 없다.\n2. **튜플(행)의 무순서성**: 한 릴레이션에 포함된 튜플 사이에는 순서가 없다.\n3. **속성(열)의 무순서성**: 한 릴레이션을 구성하는 속성 사이에는 순서가 없다.\n4. **속성값의 원자성**: 모든 속성값은 더 이상 분해할 수 없는 **원자값(Atomic Value)**만을 가진다.\n\n---\n\n### 📌 3. SQL (Structured Query Language) 문장의 4가지 종류 (★필수 암기!)\n\n> 💡 **[핵심 필수 암기]**\n> **명령어 소속 구분 암기 팁**:\n> - **DML (`\"세·인·업·딜·머\"`)**: `SELECT`, `INSERT`, `UPDATE`, `DELETE`, `MERGE` ➔ **데이터(행)**를 조작 (Oracle에서는 수동 `COMMIT`/`ROLLBACK` 필요!)\n> - **DDL (`\"크·알·드·트·리\"`)**: `CREATE`, `ALTER`, `DROP`, `TRUNCATE`, `RENAME` ➔ **구조(객체)**를 정의 (Oracle에서는 실행 즉시 **`AUTO COMMIT`**!)\n> - **DCL (`\"그·리\"`)**: `GRANT`, `REVOKE` ➔ **권한** 부여 및 회수\n> - **TCL (`\"커·롤·세\"`)**: `COMMIT`, `ROLLBACK`, `SAVEPOINT` ➔ **트랜잭션** 제어\n> - ⚠️ **단골 함정**: `DELETE`(DML, 롤백 가능) vs `TRUNCATE`(DDL, 롤백 불가) vs `DROP`(DDL, 테이블 구조 자체 삭제)! 그리고 `ALTER`(DDL, 컬럼 구조 변경) vs `UPDATE`(DML, 데이터 값 변경)!\n\n![SQL 문장의 4가지 종류 (DML, DDL, DCL, TCL) 완벽 비교표](images/p024_img01.png)\n\n### 📌 4. 무결성 제약조건(Integrity Constraints) 4가지\n1. **개체 무결성 (Entity Integrity, 기본키 PK 제약)**:\n   - 테이블의 기본키(Primary Key)를 구성하는 컬럼은 **`NULL` 값을 가질 수 없으며, 중복된 값을 가질 수 없다** (`UNIQUE + NOT NULL`).\n2. **참조 무결성 (Referential Integrity, 외래키 FK 제약)**:\n   - 외래키(Foreign Key) 값은 **`NULL`이거나 참조하는 부모 릴레이션의 기본키(PK) 값과 동일**해야 한다 (부모 테이블에 없는 값을 자식이 참조할 수 없음).\n3. **도메인 무결성 (Domain Integrity)**:\n   - 주어진 속성의 값이 그 속성이 정의된 **도메인(데이터 타입, 길이, `CHECK`, `NOT NULL` 등)에 속한 값**이어야 한다.\n4. **고유 무결성 (Unique Integrity)**:\n   - 특정 속성에 대해 각 튜플이 갖는 값들이 서로 달라야 한다 (`UNIQUE` 제약조건 — 단, **Oracle에서 `UNIQUE` 제약조건은 `NULL` 값을 여러 개 허용**함!).\n\n![무결성 제약조건 요약 표](images/p025_img01.png)\n\n### 📌 5. 테이블 정의서와 ERD 매핑\n- 논리 모델의 **엔터티 ➔ 테이블**, **인스턴스 ➔ 행(Row)**, **속성 ➔ 열(Column)**, **식별자 ➔ PK/FK**로 물리 모델에 매핑된다.\n\n![선수(PLAYER)와 팀(TEAM) 테이블 구조 및 PK/FK 매핑 예시](images/p026_img01.png)\n\n![K-리그 데이터베이스 전체 ERD 구조도](images/p026_img02.png)\n\n![데이터 모델링 용어와 물리적 테이블 용어 비교표](images/p026_img03.png)\n\n---\n\n## 🔍 STEP 2. 직관적 Before & After 비교 & 실전 SQL 트레이스\n\n### 🔄 [Before & After] 파일 시스템 vs RDB\n\n직원 데이터(EMP_ID, NAME, SAL) 2건을 보관하고 \"급여 2000 초과인 사람\"을 찾는 상황. 텍스트 파일 vs RDB 의 EMP 테이블.\n\n### Before — 일반 파일에 저장\n\n```\nemp.txt\n1, 김철수, 3000\n2, 이영희, 4000\n```\n\n동시 수정 불가, 검색 느림, 무결성 보장 어려움\n\n### After — RDB 사용\n\n```sql\nSELECT * FROM EMP WHERE SAL > 2000;\n```\n\n빠른 검색(인덱스), 동시 처리(트랜잭션), 무결성 제약 보장\n\n파일은 의미·타입·관계 정보가 없어 매번 직접 파싱해야 하고, 동시 수정 시 한쪽 변경이 사라짐. RDB 는 스키마·인덱스·트랜잭션을 엔진이 보장하므로 데이터가 많거나 다중 사용자 환경에서는 RDB 가 정답.\n\n### 💻 [SQL 실전 트레이스] 가장 기본적인 흐름\n\n```sql\n-- DDL: 테이블 생성\nCREATE TABLE EMP (\n    EMP_ID NUMBER PRIMARY KEY,\n    NAME   VARCHAR2(50),\n    SAL    NUMBER\n);\n\n-- DML: 데이터 입력/조회\nINSERT INTO EMP VALUES (1, '김철수', 3000);\nSELECT * FROM EMP;\n\n-- TCL: 영구 저장\nCOMMIT;\n\n-- DCL: 권한 부여\nGRANT SELECT ON EMP TO USER1;\n```\n\n---\n\n## 🚨 STEP 3. 출제위원 단골 함정 O/X & 노랭이·기출 문항별 족보\n\n### ⚠️ 시험장 단골 함정 vs 정답 1:1 대조표\n\n| 함정 | 정답 |\n|---|---|\n| TRUNCATE는 DDL인가 DML인가 | DDL(롤백 불가) |\n| DELETE는 어디에 속하는가 | DML(롤백 가능) |\n| COMMIT은 | TCL |\n| GRANT/REVOKE는 | DCL |\n| RDB 데이터 저장 단위 | 테이블(행과 열) |\n| 한 행을 무엇이라 하는가 | Row, Record, Tuple |\n| 한 열을 무엇이라 하는가 | Column, Attribute, Field |\n\n단골 함정: \"INSERT/UPDATE/DELETE/SELECT 모두 DML\" 은 옳음. MERGE 도 DML.\n\n### 📒 이 단원과 직결된 『SQL 자격검정 실전문제(노랭이)』 & 기출 킬러 족보\n\n- **[노랭이 2과목 4번]** SQL 같은 **비절차적 데이터 조작어(DML)**는 사용자가 **무슨(What) 데이터**를 원하는지만 기술하며, 어떻게(How) 데이터에 접근할지는 기술하지 않는다 (절차적 언어 = PL/SQL, T-SQL).\n- **[노랭이 2과목 65번]** **순수 관계 연산자 4가지**: `SELECT`(조건에 맞는 행 추출), `PROJECT`(조건에 맞는 열/속성 추출), `JOIN`(공통 속성 기준 결합), `DIVIDE`(나눗셈). **일반 집합 연산자 4가지**: `UNION`, `INTERSECT`, `DIFFERENCE(EXCEPT/MINUS)`, `CARTESIAN PRODUCT(CROSS JOIN)`.\n- **[30회 기출 23번]** `COMMIT`, `ROLLBACK` = **TCL**(일부 분류에서 DCL에 포함하기도 함), **`TRUNCATE` = DDL**\n\n---\n\n## ✍️ STEP 4. 실전 적중! 단원 마무리 확인 문제\n\n<div class=\"sqld-quiz-box\" data-answer=\"3\">\n\n**Q. [2-1-1 대표 적중 문제]** 다음 중 관계형 데이터베이스의 연산자 및 SQL 명령어의 분류에 대한 설명으로 **가장 부적절한** 것은?\n\n- ① 관계형 데이터베이스에서 조건을 만족하는 수평적 부분집합인 튜플(행)을 추출하는 순수 관계 연산자는 `SELECT`이고, 수직적 부분집합인 속성(열)을 추출하는 연산자는 `PROJECT`이다.\n- ② `CREATE`, `ALTER`, `DROP`, `RENAME`은 테이블 등 객체의 구조를 정의·변경하는 데이터 정의어(DDL)에 속한다.\n- ③ `TRUNCATE TABLE`은 테이블의 구조는 남기고 내부 데이터만 전체 삭제하므로 `DELETE`와 마찬가지로 데이터 조작어(DML)로 분류되며 `ROLLBACK`이 가능하다.\n- ④ SQL은 사용자가 어떤 데이터를 원하는지만 명세하는 비절차적(Non-procedural) 데이터 조작어를 제공한다.\n\n<details>\n<summary>💡 <b>정답 및 시나공·과외노트식 보기별 완벽 해설 확인하기 (클릭)</b></summary>\n\n**정답: ③**\n- **해설**: `TRUNCATE TABLE`은 데이터를 삭제하고 저장공간(초기 용량)까지 즉시 반환하는 **데이터 정의어(DDL)**입니다! 따라서 실행 즉시 **자동 커밋(Auto Commit)**되므로 `ROLLBACK`으로 복구할 수 없습니다.\n\n</details>\n</div>\n\n---\n\n## ⏱️ STEP 5. 시험장 입실 직전 30초 최종 요약 카드\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · DDL: **CREATE / ALTER / DROP / TRUNCATE / RENAME** (자동 COMMIT, 롤백 불가)\n> · DML: **SELECT / INSERT / UPDATE / DELETE / MERGE**\n> · DCL: **GRANT / REVOKE** (권한)\n> · TCL: **COMMIT / ROLLBACK / SAVEPOINT** (트랜잭션)\n> · 함정: **TRUNCATE = DDL** (롤백 X), **DELETE = DML** (롤백 O)\n> · 행/열 동의어: Row=Record=Tuple / Column=Attribute=Field"}, {"id": "ch-12", "index": 12, "title": "2-1-2. SELECT 문", "subj_id": "tab2", "subj_name": "2과목 1장 · SQL 기본", "badge": "2과목 1장 · SQL 기본", "md": "# 2-1-2. SELECT 문\n\n> **단원 분류**: `2과목` > `2-1. SQL 기본` > **`2-1-2. SELECT 문`**\n> **🎯 출제 빈도**: `★★★★★ (매회 1~2문항 출제)` &nbsp;|&nbsp; **🧠 두문자 암기 공식**: `SQL 작성 순서: 세-프-웨-그-해-오 / 논리적 실행 순서: 프-웨-그-해-세-오 (FROM ➔ WHERE ➔ GROUP BY ➔ HAVING ➔ SELECT ➔ ORDER BY)`\n\n## 🎯 과외선배의 1분 브리핑 & 핵심 구조도\n\n> [!TIP]\n> **👨‍🏫 1:1 과외선배의 학습 코칭 (`유선배 과외노트` 스타일)**\n> **SELECT 문 실행 순서(`FROM ➔ WHERE ➔ GROUP BY ➔ HAVING ➔ SELECT ➔ ORDER BY`)**가 모든 함정의 뿌리입니다! `SELECT` 절에서 정의한 **컬럼 별칭(`ALIAS`)은 `SELECT`보다 먼저 실행되는 `WHERE`, `GROUP BY`, `HAVING` 절에서는 절대 사용할 수 없고, 가장 마지막에 실행되는 `ORDER BY` 절에서만 사용할 수 있다**는 규칙이 시험에 매번 나옵니다!\n\n> SELECT 문은 데이터베이스에서 원하는 데이터를 골라서 뽑아내는 가장 기본적인 명령어다.\n\nex) 식당 주문처럼 \"어느 식당(FROM)·어떤 음식(SELECT)·조건(WHERE)·그룹별(GROUP BY)·정렬(ORDER BY)\" 을 차례로 지정\n\n### 🗺️ 한눈에 보는 핵심 구조도: SELECT 문의 6대 절\n\n```\nSELECT    컬럼1, 컬럼2, ...      ← ② 어떤 컬럼? (함수 활용)\nFROM      테이블                   ← ① 어디서? (조인 가능)\nWHERE     조건                     ← ③ 어떤 행?\nGROUP BY  그룹기준                 ← ④ 어떻게 묶을지?\nHAVING    그룹조건                 ← ⑤ 묶은 후 조건?\nORDER BY  정렬기준;                ← ⑥ 어떻게 정렬?\n```\n\n각 절의 자세한 사용은 **WHERE**, **GROUP BY/HAVING**, **ORDER BY**, **함수**, **조인** 챕터 참고\n\n### 작성 순서 vs 실행 순서\n\n| ① `FROM` | ➔ | ② `WHERE` | ➔ | ③ `GROUP BY` | ➔ | ④ `HAVING` | ➔ | ⑤ `SELECT` | ➔ | ⑥ `ORDER BY` |\n| :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: |\n| 대상 테이블 읽기 | | 개별 행 조건 필터링 | | 기준 컬럼으로 그룹화 | | 그룹 집계 조건 필터링 | | 출력할 컬럼/별칭 계산 | | 최종 결과 정렬 (맨 마지막!) |\n\n| 작성 순서 | 실행 순서 |\n|---|---|\n| 1. SELECT | 5. SELECT |\n| 2. FROM | 1. FROM |\n| 3. WHERE | 2. WHERE |\n| 4. GROUP BY | 3. GROUP BY |\n| 5. HAVING | 4. HAVING |\n| 6. ORDER BY | 6. ORDER BY |\n\n암기: FROM → WHERE → GROUP → HAVING → SELECT → ORDER (FWGHSO)\n\n---\n\n## 📘 STEP 1. 시험 출제 핵심 이론 & 강의 도표 완벽 정복\n\n### 📌 1. SELECT 문의 문법 작성 순서 vs 내부 실행(파싱) 순서 (★초빈출!)\n\n> 💡 **[핵심 필수 암기]**\n> **SELECT 문 작성 순서 vs 실행 순서 (별칭 Alias 사용 가능 위치를 결정짓는 핵심 원리!)**\n> - **작성(문법) 순서 (`\"셀·프·웨·그·해·오\"`)**:\n>   `SELECT` ➔ `FROM` ➔ `WHERE` ➔ `GROUP BY` ➔ `HAVING` ➔ `ORDER BY`\n> - **실제 실행 순서 (`\"프·웨·그·해·셀·오\"`)**:\n>   **`① FROM` ➔ `② WHERE` ➔ `③ GROUP BY` ➔ `④ HAVING` ➔ `⑤ SELECT` ➔ `⑥ ORDER BY`**\n> - **핵심 결론**: `SELECT` 절에서 정의한 **컬럼 별칭(Alias)**은 `SELECT`보다 먼저 실행되는 **`WHERE`, `GROUP BY`, `HAVING` 절에서는 절대 사용할 수 없으며(에러 발생!)**, `SELECT` 이후에 실행되는 **`ORDER BY` 절에서만 사용할 수 있다!**\n> - 반면, `FROM` 절에서 정의한 **테이블 별칭(Table Alias)**은 가장 먼저 실행되므로 `WHERE`, `SELECT`, `ORDER BY` 등 **모든 절에서 사용 가능**하다(오히려 테이블 별칭을 선언했다면 원래 테이블명 대신 반드시 별칭을 써야 함!).\n\n![SELECT 구문 기본 구조 및 절별 역할](images/p027_img01.png)\n\n### 📌 2. SELECT 절 옵션 (`*`, `ALL`, `DISTINCT`)과 ALIAS(별칭) 부여 규칙\n- **`ALL` (기본값)**: 중복된 데이터가 있어도 모두 출력 (생략 시 기본값은 `ALL`).\n- **`DISTINCT`**: 조회 결과에서 **중복된 행(Row)을 제거**하고 유일한 값만 출력.\n  - **`DISTINCT` 주의사항**: `SELECT` 키워드 바로 뒤에 작성하며, 뒤에 여러 컬럼(`SELECT DISTINCT DEPTNO, JOB`)을 나열하면 한 컬럼이 아니라 **나열된 모든 컬럼의 조합(세트)이 동일한 경우에만 중복으로 간주**하여 제거한다! 또한 **`DISTINCT`는 `NULL`도 하나의 값으로 인정**하여 여러 개의 `NULL`이 있으면 결과에 `NULL` 행 1개를 포함시킨다!\n- **ALIAS (별칭) 부여 시 주의사항 4가지**:\n  1. 컬럼명 바로 뒤에 작성하며, 컬럼명과 별칭 사이에 **`AS`** 키워드를 넣을 수 있다 (생략 가능). *(단, **Oracle에서 `FROM` 절의 테이블 별칭에는 `AS`를 쓰면 문법 에러**가 발생한다!)*\n  2. 별칭에 **공백(띄어쓰기), 특수문자(`_`, `$`, `#` 제외)**가 포함되거나 **대소문자를 그대로 구분**해서 출력하고 싶을 때, 혹은 **숫자로 시작**할 때는 반드시 **큰따옴표(`\"별칭\"`)**로 감싸야 한다! (작은따옴표 `' '`는 문자열 리터럴에만 사용!)\n\n![SELECT * 전체 컬럼 조회 및 기본 예제](images/p027_img02.png)\n\n![DISTINCT 중복 제거 및 ALIAS 별칭 부여 예제](images/p027_img03.png)\n\n![ALIAS 쌍따옴표(\" \") 사용 사례 및 문법 오류 비교](images/p028_img01.png)\n\n### 📌 3. 산술 연산자 우선순위와 합성(연결) 연산자 `||` / `+`, DUAL 테이블\n- **산술 연산자**: `()` 괄호 ➔ `*`, `/` ➔ `+`, `-` 순으로 우선순위를 가진다.\n  - 숫자나 날짜 데이터에 사용 가능하며, **`NULL`과 산술 연산을 수행하면 결과는 무조건 `NULL`**이다!\n- **합성(Concatenation) 연산자 (문자열 결합)**:\n  - **Oracle**: **`||`** (수직바 2개, 예: `'A' || 'B'` ➔ `'AB'`)\n  - **SQL Server**: **`+`** (더하기 기호, 예: `'A' + 'B'` ➔ `'AB'`)\n  - **공통 함수**: **`CONCAT(문자열1, 문자열2)`** *(주의: Oracle의 `CONCAT` 함수는 인자를 **딱 2개만** 받을 수 있다! 3개를 연결하려면 `CONCAT(CONCAT(A, B), C)`처럼 중첩하거나 `||`를 써야 함)*\n  - **합성 연산자와 `NULL`의 함정**:\n    - **Oracle**에서 `'SQL' || NULL`의 결과는 `NULL`이 아니라 **`'SQL'`**이다! (합성 연산 시 `NULL`은 빈 문자열처럼 무시됨)\n    - 반면 **SQL Server**에서 `'SQL' + NULL`의 결과는 기본 설정상 **`NULL`**이 된다!\n- **DUAL 테이블 (Oracle)**:\n  - 오라클에서 기본 제공하는 더미(Dummy) 테이블로, `DUMMY`라는 `VARCHAR2(1)` 컬럼 하나에 `'X'`라는 값 1건만 들어 있다.\n  - 테이블을 참조할 필요 없이 함수 계산이나 상수 연산(`SELECT 1 + 1 FROM DUAL;`, `SELECT SYSDATE FROM DUAL;`)만 수행할 때 `FROM` 절에 사용한다. (SQL Server는 `FROM` 절 자체를 생략 가능)\n\n![산술 연산자 우선순위 표](images/p028_img02.png)\n\n![산술 연산자를 활용한 SELECT 조회 예제 1](images/p028_img03.png)\n\n![산술 연산자를 활용한 SELECT 조회 예제 2](images/p028_img04.png)\n\n![합성 연산자(||, +, CONCAT) 비교 및 실행 결과](images/p029_img01.png)\n\n---\n\n## 🔍 STEP 2. 직관적 Before & After 비교 & 실전 SQL 트레이스\n\n### 🔄 [Before & After] 직관적 비교\n\nEMP 4명 중 동명이인 김철수가 D1·D2 부서에 한 명씩 있는 상황. 컬럼 지정·DISTINCT·연봉 계산 별칭에 따라 결과가 달라지는 양상 비교.\n\n### EMP\n\n| EMP_ID | NAME | DEPT_ID | SAL |\n|---|---|---|---|\n| 1 | 김철수 | D1 | 3000 |\n| 2 | 이영희 | D1 | 4000 |\n| 3 | 박민수 | D2 | 3500 |\n| 4 | 김철수 | D2 | 3200 |\n\n### `SELECT NAME, SAL FROM EMP;`\n\n| NAME | SAL |\n|---|---|\n| 김철수 | 3000 |\n| 이영희 | 4000 |\n| 박민수 | 3500 |\n| 김철수 | 3200 |\n\n### `SELECT DISTINCT NAME FROM EMP;`\n\n| NAME |\n|---|\n| 김철수 |\n| 이영희 |\n| 박민수 |\n\n### `SELECT NAME, SAL*12 AS \"연봉\" FROM EMP;`\n\n| NAME | 연봉 |\n|---|---|\n| 김철수 | 36000 |\n| 이영희 | 48000 |\n| 박민수 | 42000 |\n| 김철수 | 38400 |\n\nDISTINCT 는 SELECT 절 전체(여러 컬럼이면 조합) 단위로 중복 제거 → NAME 만 보면 동명이인 김철수도 한 줄로 합쳐짐. SAL*12 같은 표현은 행 단위 계산이라 같은 이름이라도 별개 행. 원본 그대로면 컬럼 나열, 값 종류만이면 DISTINCT, 가공값에 의미있는 이름이면 별칭.\n\n### 💻 [SQL 실전 트레이스]\n\n```sql\n-- 1. 모든 컬럼\nSELECT * FROM EMP;\n\n-- 2. 특정 컬럼\nSELECT EMP_ID, NAME, SAL FROM EMP;\n\n-- 3. 별칭(AS 생략 가능, 한글 별칭은 \"\")\nSELECT NAME AS 사원명, SAL*12 \"연봉\" FROM EMP;\n\n-- 4. 중복 제거\nSELECT DISTINCT DEPT_ID FROM EMP;\n\n-- 5. 문자열 연결\nSELECT NAME || '님' AS GREETING FROM EMP;\n```\n\n---\n\n## 🚨 STEP 3. 출제위원 단골 함정 O/X & 노랭이·기출 문항별 족보\n\n### ⚠️ 시험장 단골 함정 vs 정답 1:1 대조표\n\n| 함정 | 정답 |\n|---|---|\n| SELECT 실행 순서 | FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY |\n| WHERE에서 SELECT 별칭 사용 가능? | 불가(SELECT가 나중에 실행됨) |\n| ORDER BY에서 SELECT 별칭 사용 가능? | 가능 |\n| DISTINCT 적용 범위 | SELECT 절 전체(여러 컬럼이면 조합 단위) |\n| Oracle 테이블 별칭에 AS | 사용 불가 |\n| `SELECT * FROM DUAL`의 결과 | 1행 1컬럼('X') |\n\n자주 출제: WHERE 절에서 SELECT 별칭 사용 시 에러. 실행 순서상 WHERE 가 먼저 처리되기 때문.\n\n### 📒 이 단원과 직결된 『SQL 자격검정 실전문제(노랭이)』 & 기출 킬러 족보\n\n- **[21회 기출 26번]** `FROM` 절은 `SELECT` 절과 항상 짝을 이루며(단, SQL Server에서는 계산식 조회 시 `FROM` 생략 가능, Oracle은 `FROM DUAL` 필수), 별칭(Alias)에 공백이나 특수문자, 대소문자 구분이 들어가면 반드시 **큰따옴표(`\" \"`)**로 감싸야 한다.\n- **[노랭이 2과목 94번]** `SELECT COUNT(DISTINCT A || B)`는 `A`와 `B`를 결합한 문자열의 중복을 제거한 뒤 건수를 센다.\n\n---\n\n## ✍️ STEP 4. 실전 적중! 단원 마무리 확인 문제\n\n<div class=\"sqld-quiz-box\" data-answer=\"3\">\n\n**Q. [2-1-2 대표 적중 문제]** 다음 중 `SELECT` 문의 문법 및 논리적 실행 순서에 대한 설명으로 **가장 부적절한** 것은?\n\n- ① `SELECT` 문에 `DISTINCT` 키워드를 사용하면 뒤에 나열된 모든 컬럼들의 조합이 중복되는 행을 제거하여 한 번만 출력한다.\n- ② 컬럼 별칭(Alias)에 공백이나 특수문자(`_`, `$`, `#` 제외)가 포함되거나 대소문자를 그대로 유지해야 할 경우에는 별칭을 큰따옴표(`\" \"`)로 감싸야 한다.\n- ③ `SELECT SAL * 12 AS ANNUAL_SAL FROM EMP WHERE ANNUAL_SAL >= 50000;` 쿼리는 연봉이 50,000 이상인 사원을 정상적으로 조회한다.\n- ④ 오라클(Oracle)에서 문자열 합성 연산자 `||`를 사용하여 `'SQL' || NULL || 'D'`를 실행하면 결과는 `'SQLD'`가 된다.\n\n<details>\n<summary>💡 <b>정답 및 시나공·과외노트식 보기별 완벽 해설 확인하기 (클릭)</b></summary>\n\n**정답: ③**\n- **해설**: SQL의 논리적 실행 순서는 **`FROM ➔ WHERE ➔ GROUP BY ➔ HAVING ➔ SELECT ➔ ORDER BY`**입니다. `WHERE` 절이 실행될 시점에는 아직 `SELECT` 절이 실행되지 않았으므로 `ANNUAL_SAL`이라는 별칭을 인식하지 못해 **에러(부적합한 식별자)**가 발생합니다! (별칭은 `ORDER BY` 절에서만 사용 가능!)\n\n</details>\n</div>\n\n---\n\n## ⏱️ STEP 5. 시험장 입실 직전 30초 최종 요약 카드\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · 작성: SELECT → FROM → WHERE → GROUP → HAVING → ORDER\n> · 실행: **FROM → WHERE → GROUP → HAVING → SELECT → ORDER (FWGHSO)**\n> · 별칭 사용: **ORDER BY 만 가능**, WHERE/GROUP/HAVING 은 불가 (SELECT 가 더 늦게 실행됨)\n> · DISTINCT = SELECT 절 전체에 적용 (여러 컬럼이면 컬럼 조합 단위로 중복 제거)\n> · Oracle 테이블 별칭 = AS 사용 **불가** / 컬럼 별칭 = AS 사용 **가능 (생략도 가능)**\n> · DUAL = Oracle 시스템 내장 1행 1컬럼 가짜 테이블 (계산·함수 테스트용)"}, {"id": "ch-13", "index": 13, "title": "2-1-3. 함수(Function)", "subj_id": "tab2", "subj_name": "2과목 1장 · SQL 기본", "badge": "2과목 1장 · SQL 기본", "md": "# 2-1-3. 함수(Function)\n\n> **단원 분류**: `2과목` > `2-1. SQL 기본` > **`2-1-3. 함수`**\n> **🎯 출제 빈도**: `★★★★★ (매회 3~4문항 최다 출제!)` &nbsp;|&nbsp; **🧠 두문자 암기 공식**: `NULL 함수 4대장: NVL(a,b) / NVL2(a,널아닐때,널일때) / NULLIF(같으면NULL,다르면앞에거) / COALESCE(첫NULL아닌값)`\n\n## 🎯 과외선배의 1분 브리핑 & 핵심 구조도\n\n> [!TIP]\n> **👨‍🏫 1:1 과외선배의 학습 코칭 (`유선배 과외노트` 스타일)**\n> 함수 파트는 계산 결과가 무엇인지 맞히는 문제가 3문제 이상 쏟아집니다! ① **`SUBSTR('SQLD', 2, 2)` ➔ `'QL'`**, ② **`ROUND(15.36, 1) = 15.4`, `ROUND(15.36, -1) = 20`**(음수 자릿수는 소수점 왼쪽 반올림!), ③ **`CEIL(-3.2) = -3` vs `FLOOR(-3.2) = -4` vs `TRUNC(-3.2) = -3`**(음수에서 바닥/버림 차이!), ④ **`NULLIF(A, B)`(두 값이 같으면 `NULL`, 다르면 첫 번째 `A` 반환!)**를 반드시 손으로 풀어보세요!\n\n> 함수는 데이터를 입력받아 가공된 결과를 돌려주는 도구다. 문자, 숫자, 날짜, **NULL**을 가공할 수 있다.\n\n### 🗺️ 한눈에 보는 핵심 구조도: 함수의 분류\n\n| 함수 대분류 | 세부 분류 | 대표 핵심 함수 |\n| :---: | :---: | :--- |\n| **단일행 함수**<br>*(1행 입력 ➔ 1결과 반환)* | • **문자형 함수**<br>• **숫자형 함수**<br>• **날짜형 함수**<br>• **변환형 함수**<br>• **NULL / 일반 함수** | • `UPPER`, `LOWER`, `SUBSTR`, `INSTR`, `LENGTH`, `TRIM`, `LPAD`<br>• `ROUND`(반올림), `TRUNC`(버림), `CEIL`(올림), `FLOOR`(내림), `MOD`(나머지)<br>• `SYSDATE`, `ADD_MONTHS`, `EXTRACT`, 날짜 `± 숫자`(일 단위 연산)<br>• `TO_CHAR`, `TO_NUMBER`, `TO_DATE`, `CAST`, `CONVERT`<br>• `NVL`, `NVL2`, `NULLIF`, `COALESCE`, `ISNULL`, `CASE`, `DECODE` |\n| **다중행(집계) 함수**<br>*(N행 입력 ➔ 1결과 반환)* | • **그룹 집계 함수** | • `COUNT(*)`, `COUNT(컬럼)`, `SUM`, `AVG`, `MAX`, `MIN`, `STDDEV`, `VARIAN` |\n\n---\n\n## 📘 STEP 1. 시험 출제 핵심 이론 & 강의 도표 완벽 정복\n\n### 📌 1. 내장 함수(Built-in Function)의 개요와 단일행 함수의 특징\n- **단일행 함수 (Single-Row Function)**:\n  - 테이블에 저장되어 있는 **개별 행(Row)마다 함수가 하나씩 적용**되어, 입력 행 수만큼 결과값을 반환하는 함수 (1:1 대응).\n  - `SELECT`, `WHERE`, `ORDER BY`, `GROUP BY`, `HAVING` 절 등 **어디서나 사용 가능**하다!\n  - 여러 인자를 입력받아도 **단 하나의 결과값**만 반환하며, **` 함수1(함수2(컬럼)) `처럼 중첩해서 사용**할 수 있다 (안쪽 함수부터 바깥쪽 순서로 실행).\n\n![내장 함수의 분류 체계 (단일행 함수 vs 다중행 함수)](images/p029_img02.png)\n\n---\n\n### 📌 2. 문자형 함수 (Character Functions) 완벽 정리\n\n| 함수명 (Oracle / SQL Server) | 기능 및 문법 | 시험 빈출 예제 및 결과 |\n| :--- | :--- | :--- |\n| **`LOWER(문자열)`** | 모든 영문자를 **소문자**로 변환 | `LOWER('SQL Expert')` ➔ **`'sql expert'`** |\n| **`UPPER(문자열)`** | 모든 영문자를 **대문자**로 변환 | `UPPER('sql expert')` ➔ **`'SQL EXPERT'`** |\n| **`INITCAP(문자열)`** *(Oracle)* | 단어의 **첫 글자만 대문자**, 나머지는 소문자로 변환 *(구분자: 공백, 특수문자, 숫자 뒤의 첫 알파벳도 대문자가 됨!)* | `INITCAP('sql expert')` ➔ **`'Sql Expert'`** |\n| **`ASCII(문자)`** | 문자의 아스키 코드 번호 반환 (`'A'=65`, `'a'=97`, `'0'=48`) | `ASCII('A')` ➔ **`65`** |\n| **`CHR(숫자)` / `CHAR(숫자)`** | 아스키 코드 번호에 해당하는 문자 반환 | `CHR(65)` ➔ **`'A'`** |\n| **`CONCAT(문자열1, 문자열2)`** | 두 문자열을 연결 *(Oracle은 인자 **2개만** 가능!)* | `CONCAT('RDBMS', ' SQL')` ➔ **`'RDBMS SQL'`** |\n| **`SUBSTR(문자열, 시작위치 [, 길이])`**<br>/ **`SUBSTRING(...)`** | 문자열의 `시작위치`(1부터 시작!)부터 `길이`만큼 잘라서 반환.<br>★`시작위치`가 **음수(`-n`)이면 뒤에서부터 `n`번째 위치**에서 오른쪽 방향으로 자름! `길이` 생략 시 끝까지 반환. | `SUBSTR('SQL Expert', 5, 3)` ➔ **`'Exp'`**<br>`SUBSTR('SQL Expert', -3, 2)` ➔ **`'er'`** |\n| **`LENGTH(문자열)` / `LEN(문자열)`** | 문자열의 글자 수(길이)를 숫자로 반환 | `LENGTH('SQL Expert')` ➔ **`10`** |\n| **`INSTR(문자열, 찾을문자 [, 시작위치, n번째])`** | 문자열에서 특정 문자의 위치(인덱스, 1부터 시작)를 반환 (없으면 `0`). | `INSTR('CORPORATE FLOOR', 'OR', 3, 2)` ➔ **`14`** (3번째 글자부터 찾아서 2번째로 나오는 `'OR'`의 위치) |\n| **`LPAD(문자열, 총길이, 채울문자)`**<br>**`RPAD(문자열, 총길이, 채울문자)`** | 문자열이 `총길이`가 되도록 **왼쪽(`LPAD`)** 또는 **오른쪽(`RPAD`)** 남는 공간을 `채울문자`로 채움 (채울문자 생략 시 공백). | `LPAD('SQL', 5, '*')` ➔ **`'**SQL'`**<br>`RPAD('SQL', 5, '*')` ➔ **`'SQL**'`** |\n| **`LTRIM(문자열 [, 제거문자집합])`**<br>**`RTRIM(문자열 [, 제거문자집합])`** | 왼쪽(`LTRIM`) 또는 오른쪽(`RTRIM`) 끝에서부터 **제거문자집합에 포함된 문자가 아닌 글자가 나올 때까지 한글자씩 모두 제거**! | `LTRIM('xxxYYZZxYZ', 'x')` ➔ **`'YYZZxYZ'`**<br>`RTRIM('xxxYYZZxYZ', 'YZx')` ➔ **`''`** (모두 제거됨!) |\n| **`TRIM([LEADING\\|TRAILING\\|BOTH] ['문자' FROM] 문자열)`** | 양쪽(`BOTH`, 기본값), 왼쪽(`LEADING`), 오른쪽(`TRAILING`)에서 특정 **단일 문자(1글자만 지정 가능!)**를 제거. | `TRIM('x' FROM 'xxYYZZxx')` ➔ **`'YYZZ'`** |\n| **`REPLACE(문자열, 찾을문자열 [, 바꿀문자열])`** | 문자열에서 **`찾을문자열`이라는 덩어리 전체**를 찾아 `바꿀문자열`로 치환. `바꿀문자열` 생략 시 해당 문자열을 **삭제**함! | `REPLACE('ABC_DEF', 'B', '')` ➔ **`'AC_DEF'`** |\n| **`TRANSLATE(문자열, 찾을문자들, 바꿀문자들)`** | 문자열에서 `찾을문자들`과 `바꿀문자들`을 **1글자씩 1:1 매핑**하여 변환! 매핑될 바꿀문자가 없으면 해당 글자는 **삭제**됨! | `TRANSLATE('12345', '135', 'ab')`<br>(`1->a`, `3->b`, `5->삭제`) ➔ **`'a2b4'`** |\n\n> ⚠️ **[시험 단골 함정 주의]**\n> **시험 단골 함정 3가지 (`TRIM` vs `LTRIM/RTRIM`, `REPLACE` vs `TRANSLATE`)**:\n> 1. **`TRIM`은 제거할 문자를 딱 1글자만** 지정할 수 있다 (`TRIM('xy' FROM 'xyABC')` ➔ **에러 발생!**). 반면 **`LTRIM`/`RTRIM`은 여러 글자로 된 문자 집합**을 넣을 수 있으며(`LTRIM('xyxABC', 'xy')` ➔ `'ABC'`), 단어 단위가 아니라 **집합 내 개별 문자 단위로 비교**하여 연속 제거한다!\n> 2. **`REPLACE`는 단어(문자열 덩어리) 단위** 치환이고, **`TRANSLATE`는 글자 대 글자(1:1 문자 매핑)** 치환이다!\n\n![문자형 함수 실행 예제 (CONCAT, INITCAP, UPPER, LOWER, LPAD, RPAD)](images/p030_img01.png)\n\n![SUBSTR / INSTR 인덱스 구조 도식](images/p030_img02.png)\n\n![LTRIM / RTRIM / TRIM 동작 비교 도식](images/p031_img01.png)\n\n![문자형 함수 전체 목록 및 Oracle vs SQL Server 비교표](images/p031_img02.png)\n\n---\n\n### 📌 3. 숫자형 함수 (Numeric Functions) 완벽 정리\n\n> 🚨 **[절대 주의 / 원본 오타 교정]**\n> **🚨 원본 요약본(`SQLD_2과목_SQL 기본.pdf`) 오타 교정 1번 반영!**\n> - `ROUND(163.76, -1)`의 결과는 `163`이 아니라 **`160`**입니다!\n> - 두 번째 인자 `m`이 **양수(`+n`)**이면 **소수점 아래 `n`째 자리까지 출력**(즉, 소수점 `n+1`째 자리에서 반올림/버림)하고,\n> - 두 번째 인자 `m`이 **`0`(또는 생략)**이면 **소수점 첫째 자리에서 반올림/버림하여 정수(일의 자리)까지 출력**하며,\n> - 두 번째 인자 `m`이 **음수(`-1`, `-2`...)**이면 **소수점 왼쪽(정수부 `10^1`, `10^2` 자리)에서 반올림/버림**합니다! 따라서 `-1`은 **일의 자리(`3`)에서 반올림하여 십의 자리까지 표시하므로 `160`**이 됩니다!\n\n| 함수명 | 설명 및 동작 원리 | 핵심 예제 및 결과 (★부호 및 음수 자릿수 주의!) |\n| :--- | :--- | :--- |\n| **`ABS(n)`** | 숫자의 **절댓값** 반환 | `ABS(-15)` ➔ **`15`** |\n| **`SIGN(n)`** | 부호 판별: **양수면 `1`, 음수면 `-1`, `0`이면 `0`** 반환 | `SIGN(-20)` ➔ **`-1`**, `SIGN(0)` ➔ **`0`** |\n| **`MOD(n1, n2)`** | `n1`을 `n2`로 나눈 **나머지** 반환 (`n2=0`이면 `n1` 자체 반환) | `MOD(7, 3)` ➔ **`1`**, `MOD(-15, 4)` ➔ **`-3`** |\n| **`CEIL(n)` / `CEILING(n)`** | `n`보다 **크거나 같은 최소 정수** (수직선 오른쪽 방향 올림!) | `CEIL(38.123)` ➔ **`39`**<br>★`CEIL(-38.123)` ➔ **`-38`** (`-39` 아님 주의!) |\n| **`FLOOR(n)`** | `n`보다 **작거나 같은 최대 정수** (수직선 왼쪽 방향 내림!) | `FLOOR(38.9)` ➔ **`38`**<br>★`FLOOR(-38.123)` ➔ **`-39`** (`-38` 아님 주의!) |\n| **`ROUND(n [, m])`** | 소수점 `m`자리까지 남도록 **반올림** (`m` 기본값 `0`) | `ROUND(163.76, 1)` ➔ **`163.8`**<br>`ROUND(163.76, 0)` ➔ **`164`**<br>★**`ROUND(163.76, -1)` ➔ `160`** *(오타 교정 완료!)*<br>`ROUND(163.76, -2)` ➔ **`200`** |\n| **`TRUNC(n [, m])`** | 소수점 `m`자리까지 남도록 **버림(절사)** (`m` 기본값 `0`) | `TRUNC(163.76, 1)` ➔ **`163.7`**<br>`TRUNC(163.76, -1)` ➔ **`160`**<br>`TRUNC(-38.9)` ➔ **`-38`** (`FLOOR`와 음수에서 결과 다름!) |\n| **`POWER(m, n)` / `SQRT(n)`** | `m`의 `n`거듭제곱 (`m^n`) / `n`의 제곱근(√n) | `POWER(3, 2)` ➔ **`9`**, `SQRT(4)` ➔ **`2`** |\n| **`EXP(n)` / `LN(n)` / `LOG(m, n)`** | e^n 지수함수 / 자연로그 ln(n) / 밑이 `m`인 로그 log_m(n) | `LN(EXP(1))` ➔ **`1`**, `LOG(10, 100)` ➔ **`2`** |\n\n![ROUND와 TRUNC 자릿수(양수, 0, 음수) 위치 도식](images/p031_img03.png)\n\n![숫자형 함수 전체 목록 및 실행 결과 비교표](images/p032_img01.png)\n\n---\n\n### 📌 4. 날짜형 함수 (Date Functions) 및 날짜 산술 연산\n- **날짜형 데이터의 산술 연산 원리 (★숫자 `1` = 하루 `1일(24시간)`!)**:\n  - `날짜 + 숫자` = 해당 날짜로부터 숫자(일수)만큼 지난 날짜\n  - `날짜 - 숫자` = 해당 날짜로부터 숫자(일수)만큼 이전 날짜\n  - **`날짜 + 1/24`** = **1시간**을 더함\n  - **`날짜 + 1/24/60`** (= `날짜 + 1/1440`) = **1분**을 더함\n  - **`날짜 + 1/24/60/60`** (= `날짜 + 1/86400`) = **1초**를 더함\n  - `날짜1 - 날짜2` = 두 날짜 사이의 일수(Day) 차이 (숫자 반환) *(단, `날짜 + 날짜`는 연산 불가 — 에러!)*\n\n| 함수명 (Oracle / SQL Server) | 기능 및 문법 | 예시 |\n| :--- | :--- | :--- |\n| **`SYSDATE` / `GETDATE()`** | 현재 데이터베이스 시스템의 연, 월, 일, 시, 분, 초 반환 | `SELECT SYSDATE FROM DUAL;` |\n| **`EXTRACT(단위 FROM 날짜)`**<br>/ **`DATEPART(단위, 날짜)`** | 날짜 데이터에서 특정 단위(`YEAR`, `MONTH`, `DAY`, `HOUR`, `MINUTE`, `SECOND`) 값을 **숫자형**으로 추출 | `EXTRACT(MONTH FROM HIREDATE)` ➔ `12` |\n| **`TO_NUMBER(TO_CHAR(날짜, 포맷))`** | 날짜를 포맷 문자열(`'YYYY'`, `'MM'`, `'DD'`)로 바꾼 뒤 숫자로 변환 | `TO_CHAR(SYSDATE, 'YYYY')` |\n| **`ADD_MONTHS(날짜, n)`**<br>/ **`DATEADD(MONTH, n, 날짜)`** | 날짜에 `n`개월을 더하거나(`+n`) 뺀(`-n`) 날짜 반환 | `ADD_MONTHS(DATE '2024-01-31', 1)` ➔ `'2024-02-29'` (말일 자동 보정) |\n| **`MONTHS_BETWEEN(날짜1, 날짜2)`** | 두 날짜 사이의 개월 수 차이를 실수로 반환 | `MONTHS_BETWEEN(SYSDATE, HIREDATE)` |\n| **`NEXT_DAY(날짜, 요일)`** | 지정한 날짜 이후에 돌아오는 가장 빠른 특정 요일의 날짜 반환 | `NEXT_DAY(SYSDATE, '월요일')` |\n| **`LAST_DAY(날짜)`** | 해당 날짜가 속한 달(Month)의 **마지막 날짜(말일)** 반환 | `LAST_DAY(DATE '2024-02-10')` ➔ `'2024-02-29'` |\n| **`ROUND(날짜, 단위)` / `TRUNC(날짜, 단위)`** | 날짜를 특정 단위(`'YEAR'`, `'MONTH'`, `'DAY'`/생략) 기준으로 반올림/버림(절사). `TRUNC(SYSDATE)`는 시분초를 `00:00:00`으로 초기화! | `TRUNC(DATE '2024-11-06', 'MM')` ➔ `'2024-11-01'` |\n\n![날짜형 함수 및 날짜 산술 연산 요약표](images/p033_img01.png)\n\n---\n\n### 📌 5. 변환형 함수 (Conversion Functions): 명시적 vs 암시적 형변환\n- **명시적 데이터 유형 변환**: 변환형 함수를 사용하여 데이터 타입 변환을 직접 명시해주는 것 (권장!).\n- **암시적(자동) 데이터 유형 변환**: DBMS가 내부적으로 알아서 데이터 타입을 변환하는 것. (편리하지만 **인덱스 컬럼에 암시적 형변환이 일어나면 인덱스를 사용하지 못해(Full Table Scan) 심각한 성능 저하**가 발생할 수 있음!)\n  - *(우선순위 참고: 문자열 `'100'`과 숫자 `100`을 비교(`WHERE VARCHAR_COL = 100`)하면 **문자열이 숫자로 변환(`TO_NUMBER(VARCHAR_COL) = 100`)**된다! 따라서 만약 `VARCHAR_COL`에 `'A'` 같은 문자가 섞여 있으면 `ORA-01722: 수치가 부적합합니다(Invalid Number)` 에러가 발생함!)*\n\n| 변환 함수 | 방향 | 설명 및 문법 |\n| :--- | :---: | :--- |\n| **`TO_NUMBER(문자열)`** | 문자 ➔ 숫자 | 숫자 형태의 문자열을 숫자 타입으로 변환 (`'123'` ➔ `123`). 숫자로 바꿀 수 없는 문자가 포함되면 에러! |\n| **`TO_CHAR(숫자 또는 날짜 [, 포맷])`** | 숫자/날짜 ➔ 문자 | 숫자나 날짜를 지정된 `포맷`의 문자열로 변환 (예: `TO_CHAR(SYSDATE, 'YYYY-MM-DD HH24:MI:SS')`, `TO_CHAR(12345, 'L99,999')`) |\n| **`TO_DATE(문자열 [, 포맷])`** | 문자 ➔ 날짜 | 문자열을 지정된 `포맷`에 맞춰 날짜 타입으로 변환 |\n| **`CAST(표현식 AS 데이터타입)`** | ANSI 표준 (공통) | `CAST('123' AS NUMBER)`처럼 표준 문법으로 타입 변환 |\n| **`CONVERT(데이터타입, 표현식 [, 스타일])`** | SQL Server 전용 | SQL Server에서 데이터 타입 변환 시 사용 |\n\n![명시적·암시적 형변환 및 변환형 함수 요약표](images/p034_img01.png)\n\n---\n\n### 📌 6. CASE 표현(Expression)과 DECODE 함수\n1. **Simple CASE Expression (`= ` 동등 비교만 가능)**:\n   ```sql\n   CASE 컬럼명\n        WHEN 비교값1 THEN 결과값1\n        WHEN 비교값2 THEN 결과값2\n        ELSE 기본값\n   END\n   ```\n2. **Searched CASE Expression (부등호 `>`, `<`, `BETWEEN`, `IS NULL` 등 모든 조건식 가능)**:\n   ```sql\n   CASE WHEN 조건식1 THEN 결과값1\n        WHEN 조건식2 THEN 결과값2\n        ELSE 기본값\n   END\n   ```\n   > ⚠️ **주의**: `ELSE` 절을 생략하고 모든 `WHEN` 조건에 해당하지 않으면 **`NULL`이 반환**된다!\n3. **`DECODE(표현식, 기준값1, 결과1, 기준값2, 결과2, ..., 기본값)` (Oracle 전용)**:\n   - `Simple CASE`와 동일하게 동등(`=`) 비교만 수행하며, `기본값` 생략 시 일치하는 값이 없으면 **`NULL`**을 반환한다.\n   - ★ **유일한 예외이자 시험 특급 포인트**: SQL에서 원래 `NULL = NULL`은 거짓(Unknown)이지만, **`DECODE(COL, NULL, '널이다', '널아니다')`에서는 예외적으로 `NULL`과 `NULL`을 같다(True)고 판정**하여 `'널이다'`를 반환한다! (반면 `CASE COL WHEN NULL THEN ...`으로 쓰면 동작하지 않으며, 반드시 `CASE WHEN COL IS NULL THEN ...`으로 써야 한다!)\n\n![CASE 표현(Simple vs Searched)과 DECODE 함수 비교 도표](images/p035_img01.png)\n\n---\n\n### 📌 7. NULL 관련 함수 4대장 (`NVL`/`ISNULL`, `NVL2`, `NULLIF`, `COALESCE`)\n\n> 🚨 **[절대 주의 / 원본 오타 교정]**\n> **🚨 원본 요약본(`SQLD_2과목_SQL 기본.pdf`) 오타 교정 2번 반영!**\n> - `COALESECE` (❌ 오타) ➔ **`COALESCE`** (⭕ 정답: `C-O-A-L-E-S-C-E`)\n\n| 함수명 | 문법 및 동작 원리 | `표현식1`이 `NULL`일 때 | `표현식1`이 `NULL`이 아닐 때 |\n| :--- | :--- | :---: | :---: |\n| **`NVL(식1, 식2)`** *(Oracle)*<br>**`ISNULL(식1, 식2)`** *(SQL Server)* | `식1`이 `NULL`이면 `식2`를 반환하고, 아니면 `식1` 그대로 반환 *(주의: `식1`과 `식2`의 데이터 타입이 호환되어야 함!)* | **`식2`** 반환 | **`식1`** 반환 |\n| **`NVL2(식1, 식2, 식3)`** *(Oracle)* | `식1`이 **`NULL`이 아니면 `식2`**를 반환하고, **`NULL`이면 `식3`**를 반환! *(순서 헷갈림 주의: **\"아닐 때 먼저(식2), 널일 때 나중(식3)\"**)* | **`식3`** 반환 | **`식2`** 반환 |\n| **`NULLIF(식1, 식2)`** *(ANSI 표준)* | 두 식을 비교하여 **`식1 = 식2`로 같으면 `NULL`**을 반환하고, **다르면 첫 번째 값인 `식1`**을 반환! | (`식1`이 `NULL`이면 다름 판정되어 **`NULL(=식1)`** 반환) | 같으면 **`NULL`**,<br>다르면 **`식1`** 반환 |\n| **`COALESCE(식1, 식2, 식3, ...)`** *(ANSI 표준)* | 인자 리스트를 왼쪽부터 순서대로 검사하여 **가장 먼저 등장하는 `NULL`이 아닌 값**을 반환! (모두 `NULL`이면 `NULL` 반환) | `식2`, `식3` 중 첫 `NOT NULL` 값 | **`식1`** 반환 |\n\n![NULL 관련 함수 (NVL, ISNULL, NVL2, NULLIF, COALESCE) 완벽 비교표](images/p035_img02.png)\n\n---\n\n## 🔍 STEP 2. 직관적 Before & After 비교 & 실전 SQL 트레이스\n\n### 🔄 [Before & After] 함수 활용\n\nEMP 의 NAME(소문자), HIRE_DATE(날짜형), SAL+COMM(NULL 가능)을 한 번에 가공해야 하는 상황. 김철수는 COMM 이 NULL, 이영희는 200. 문자·날짜·NULL 함수를 결합해 \"대문자 이름 / 입사연도 / 총급여\" 를 동시에 뽑음.\n\n### EMP\n\n| NAME | HIRE_DATE | SAL | COMM |\n|---|---|---|---|\n| 김철수 | 2020-03-15 | 3000 | NULL |\n| 이영희 | 2022-08-20 | 4000 | 200 |\n\n### 쿼리\n\n```sql\nSELECT  UPPER(NAME)              AS UPPER_NAME,\n        TO_CHAR(HIRE_DATE,'YYYY')   AS HIRE_YEAR,\n        SAL + NVL(COMM, 0)         AS TOTAL\nFROM    EMP;\n```\n\n| UPPER_NAME | HIRE_YEAR | TOTAL |\n|---|---|---|\n| 김철수 | 2020 | 3000 |\n| 이영희 | 2022 | 4200 |\n\nUPPER 는 문자형, TO_CHAR(HIRE_DATE,'YYYY') 는 날짜→문자, NVL(COMM,0) 은 NULL 안전 산술 — 함수마다 다루는 도메인이 다름. NVL 을 빼면 김철수의 TOTAL 이 NULL 로 사라지는 사고 발생. 출력 형식·표시 단위·NULL 처리를 모두 함수 단계에서 정리해 SELECT 결과를 화면에 바로 쓸 수 있는 형태로 만드는 것이 안전\n\n### 💻 [SQL 실전 트레이스]\n\n### 조건 함수 — CASE / DECODE\n\n```sql\n-- DECODE (Oracle 전용, 동등비교만 가능)\nSELECT NAME,\n       DECODE(GENDER, 'M', '남자', 'F', '여자', '기타') AS GENDER_KOR\nFROM   MEMBER;\n\n-- CASE (표준, 모든 비교 가능)\nSELECT NAME,\n       CASE WHEN SAL >= 5000 THEN '고급'\n            WHEN SAL >= 3000 THEN '중급'\n            ELSE '초급'\n       END AS LEVEL\nFROM   EMP;\n```\n\n| 함수 | 동등비교 | 범위비교 |\n|---|---|---|\n| DECODE | 가능 | 불가 |\n| CASE | 가능 | 가능 |\n\n---\n\n## 🚨 STEP 3. 출제위원 단골 함정 O/X & 노랭이·기출 문항별 족보\n\n### ⚠️ 시험장 단골 함정 vs 정답 1:1 대조표\n\n| 함정 | 정답 |\n|---|---|\n| `SUBSTR('ABCDE', 2, 3)` | 'BCD' (2번째부터 3글자) |\n| Oracle `LENGTH('한글')` | 2(글자수). LENGTHB는 바이트수 |\n| `MOD(10, 3)` | 1 |\n| `ROUND(3.456, 2)` | 3.46 |\n| `TRUNC(3.456, 2)` | 3.45 |\n| DECODE로 범위비교 가능? | 불가 |\n| 날짜 - 날짜 결과 | 숫자(일수) |\n| `NVL2(NULL, 'A', 'B')` | 'B' |\n| 암시적 형변환 권장? | 명시적이 안전 |\n\n단골: COUNT(*) vs COUNT(컬럼) 차이를 묻는 문제. NULL 처리 주의\n\n### 📒 이 단원과 직결된 『SQL 자격검정 실전문제(노랭이)』 & 기출 킬러 족보\n\n- **[노랭이 2과목 39번 ★중요체크]** `TO_DATE('2024', 'YYYY')` 또는 `TO_DATE('202405', 'YYYYMM')` 실행 시 **월(MM)을 생략하면 현재 월**, **일(DD)을 생략하면 `1일(01)`**이 디폴트 값으로 들어간다!\n- **[노랭이 2과목 41·42번]** `REPLACE(문자열, 찾을문자)`에서 세 번째 인수를 생략하면 찾을 문자를 **전부 제거**한다. 오라클 날짜 연산에서 **`+ 1/24`은 1시간**, **`+ 1/24/60`은 1분**, **`+ 1/24/(60/10)`은 10분**을 더한다!\n- **[친구의 단원별 오답메모]** `CASE` 표현식에서 `ELSE` 절을 생략하고 조건을 만족하지 않으면 **`NULL`**이 반환된다.\n\n---\n\n## ✍️ STEP 4. 실전 적중! 단원 마무리 확인 문제\n\n<div class=\"sqld-quiz-box\" data-answer=\"4\">\n\n**Q. [2-1-3 대표 적중 문제]** 다음 SQL 함수들의 실행 결과로 **올바르지 않은** 것은? (단, 오라클 DBMS 기준)\n\n- ① `SELECT ROUND(164.58, -2), TRUNC(-3.8), FLOOR(-3.8), CEIL(-3.8) FROM DUAL;` ➔ 결과: `200`, `-3`, `-4`, `-3`\n- ② `SELECT SUBSTR('DATABASE', 3, 3), INSTR('DATABASE', 'A', 1, 2) FROM DUAL;` ➔ 결과: `'TAB'`, `4`\n- ③ `SELECT NVL2(NULL, 'A', 'B'), NULLIF('SQL', 'SQL'), COALESCE(NULL, NULL, 'PASS', 'FAIL') FROM DUAL;` ➔ 결과: `'B'`, `NULL`, `'PASS'`\n- ④ `SELECT LENGTH(RTRIM('xyxXxyLAST WORDxyxy', 'xy')) FROM DUAL;` ➔ 결과: `9`\n\n<details>\n<summary>💡 <b>정답 및 시나공·과외노트식 보기별 완벽 해설 확인하기 (클릭)</b></summary>\n\n**정답: ④**\n- **해설**:\n  - ④ `RTRIM('xyxXxyLAST WORDxyxy', 'xy')`는 오른쪽 끝에서부터 `'x'` 또는 `'y'`에 해당하는 문자가 나오면 계속 잘라냅니다. 오른쪽 끝의 `'xyxy'` 4글자가 제거되고 `'xyxXxyLAST WORD'`가 남으므로, 그 문자열의 길이(`LENGTH`)는 **`15`**입니다 (`9`가 아님!).\n  - ① `ROUND(164.58, -2)`는 십의 자리(`6`)에서 반올림하여 `200`, 음수 `-3.8`에서 `TRUNC`(버림)는 `-3`, `FLOOR`(작거나 같은 최대 정수)는 `-4`, `CEIL`(크거나 같은 최소 정수)는 `-3`입니다.\n\n</details>\n</div>\n\n---\n\n## ⏱️ STEP 5. 시험장 입실 직전 30초 최종 요약 카드\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · 함수 = **단일행** (1행 → 1결과) vs **다중행 = 집계** (여러 행 → 1결과)\n> · SUBSTR 인덱스 = **1부터** 시작 (Oracle)\n> · LENGTH = 글자 수 / LENGTHB = 바이트 수 (한글 1자 = 3바이트)\n> · ROUND vs TRUNC = 반올림 vs 버림\n> · DECODE = **동등 비교만** / CASE = **모든 비교 (범위 가능)**\n> · NVL(A, B) / NVL2(A, B, C) / NULLIF(A, B) / COALESCE(A, B, ...)\n> · 집계 함수는 **NULL 무시** (단 COUNT(*) 만 NULL 포함)\n> · 명시적 형변환 (TO_*) 권장 — 암시적은 의도치 않은 결과 위험"}, {"id": "ch-14", "index": 14, "title": "2-1-4. WHERE 절", "subj_id": "tab2", "subj_name": "2과목 1장 · SQL 기본", "badge": "2과목 1장 · SQL 기본", "md": "# 2-1-4. WHERE 절\n\n> **단원 분류**: `2과목` > `2-1. SQL 기본` > **`2-1-4. WHERE 절`**\n> **🎯 출제 빈도**: `★★★★★ (매회 2~3문항 100% 출제!)` &nbsp;|&nbsp; **🧠 두문자 암기 공식**: `연산자 우선순위: 괄호 ➔ 부정(NOT) ➔ 비교(=, LIKE, IN, BETWEEN) ➔ AND ➔ OR / NOT IN (..., NULL) = 무조건 0건!`\n\n## 🎯 과외선배의 1분 브리핑 & 핵심 구조도\n\n> [!TIP]\n> **👨‍🏫 1:1 과외선배의 학습 코칭 (`유선배 과외노트` 스타일)**\n> **`WHERE COL NOT IN (10, 20, NULL)`의 결과는 무조건 `0건(공집합)`!** 왜냐하면 `COL <> 10 AND COL <> 20 AND COL <> NULL`로 풀리는데, `COL <> NULL`이 `UNKNOWN`이라서 `AND` 연산 전체가 `UNKNOWN`이 되기 때문입니다! 반대로 **`WHERE COL IN (10, 20, NULL)`은 `OR`로 풀리므로 `NULL`만 무시되고 `10, 20`인 행이 정상 출력**됩니다. 이 차이는 시험장 갈 때 팔뚝에 적어가야 할 수준으로 중요합니다!\n\n> WHERE 절은 어떤 행만 가져올지 조건을 거는 필터다. 테이블 전체에서 원하는 행만 골라낸다.\n\nex) 옷가게에서 \"검은색(`= '검정'`)·5만원 이하(`<= 50000`)·M 또는 L 사이즈(`IN ('M','L')`)\" 라고 조건을 거는 것과 같음\n\n### 🗺️ 한눈에 보는 핵심 구조도: WHERE의 위치\n\n**SELECT 문** 의 6대 절 중 행 단위 필터 역할\n\n| 원본 테이블 전체 데이터 (예: 1,000행) | ─── `WHERE` 조건절 필터링 (`TRUE`인 행만 통과!) ───▶ | 조건을 만족하는 결과 행 (예: 100행) |\n| :---: | :---: | :---: |\n| 모든 행 스캔 | 결과가 `FALSE` 이거나 **`UNKNOWN`(`NULL` 비교)**인 행은 모두 탈락! | 통과한 행만 `GROUP BY` / `SELECT`로 전달 |\n\n---\n\n## 📘 STEP 1. 시험 출제 핵심 이론 & 강의 도표 완벽 정복\n\n### 📌 1. WHERE 절의 개요와 연산자 우선순위\n- **WHERE 절의 역할**: `FROM` 절의 테이블로부터 원하는 조건(True)을 만족하는 행(Row)들만 필터링하여 제한한다 (`SELECT`, `UPDATE`, `DELETE` 문에서 사용 가능하며, `INSERT` 문에는 `WHERE` 절을 쓰지 않음).\n- **연산자 전체 우선순위 (★시험 필수 암기!)**:\n  > **`① 괄호 ()` ➔ `② 부정 연산자 (NOT)` ➔ `③ 비교 연산자 (=, >, <, >=, <=) 및 SQL 연산자 (BETWEEN, IN, LIKE, IS NULL)` ➔ `④ 논리 연산자 AND` ➔ `⑤ 논리 연산자 OR`**\n  - 핵심: **`NOT` > `AND` > `OR`** 순서! 따라서 `WHERE A = 1 OR B = 2 AND C = 3`은 `B = 2 AND C = 3`이 먼저 묶여서 계산된 뒤 `A = 1`과 `OR` 연산된다!\n\n![WHERE 절 기본 구조 및 실행 예시 1](images/p036_img01.png)\n\n![WHERE 절 비교 연산자 실행 예시 2](images/p036_img02.png)\n\n![WHERE 절 다중 조건 실행 예시 3](images/p036_img03.png)\n\n![문자열 상수 비교 및 조건절 주의사항 1](images/p036_img04.png)\n\n![문자열 상수 비교 및 조건절 주의사항 2](images/p036_img05.png)\n\n![문자열 상수 비교 및 조건절 주의사항 3](images/p036_img06.png)\n\n### 📌 2. 비교 연산자 및 부정 비교 연산자\n- **일반 비교 연산자**: `=`, `>`, `>=`, `<`, `<=`\n  - 문자열 비교 시 사전순(아스키 코드순)으로 크기를 비교하며, 숫자로 변환 가능한 문자열과 숫자를 비교하면 문자열이 숫자로 자동 형변환되어 비교된다.\n- **부정 비교 연산자**:\n  - **`!=`**, **`^=`**, **`<>`** (ANSI 표준): 같지 않다 (모두 사용 가능)\n  - **`NOT 컬럼명 = 값`**, **`NOT 컬럼명 > 값`**\n  - ⚠️ **절대 불가(문법 오류) 연산자**: **`!>` (크지 않다)**, **`!<` (작지 않다)** 같은 기호는 오라클/표준 SQL에 존재하지 않는 잘못된 기호이다!\n\n![산술 연산자를 포함한 WHERE 절 비교 예시 1](images/p037_img01.png)\n\n![산술 연산자를 포함한 WHERE 절 비교 예시 2](images/p037_img02.png)\n\n![비교 연산자·부정 비교 연산자·SQL 연산자·논리 연산자 총정리 표](images/p037_img03.png)\n\n### 📌 3. SQL 연산자 (`BETWEEN`, `IN`, `LIKE`, `IS NULL`)와 부정 SQL 연산자\n\n1. **`A BETWEEN a AND b`**:\n   - **`A >= a AND A <= b`**와 완전히 동일하다 (**양 끝값 `a`, `b`를 모두 포함하는 이상/이하(폐구간)**!).\n   - 주의: 반드시 **작은 값(`a`)을 앞에, 큰 값(`b`)을 뒤에** 써야 한다! 만약 `BETWEEN 200 AND 100`처럼 큰 값을 앞에 쓰면 에러는 나지 않지만 **조회 결과가 0건(공집합)**이 나온다!\n   - 부정: **`NOT (A BETWEEN a AND b)`** 또는 **`A NOT BETWEEN a AND b`** ➔ **`A < a OR A > b`** (양 끝값 불포함!).\n\n2. **`A IN (값1, 값2, ...)` vs `A NOT IN (값1, 값2, ...)` (★NULL 함정 1순위!)**:\n   - **`A IN (1, 2, NULL)`**: 내부적으로 **`A = 1 OR A = 2 OR A = NULL`**로 풀린다. `A = NULL`은 `UNKNOWN`이지만, **`OR` 연산은 하나만 `TRUE`여도 전체가 `TRUE`**가 되므로 `A`가 `1`이거나 `2`인 행은 **정상적으로 조회된다!**\n   - **`A NOT IN (1, 2, NULL)`**: 내부적으로 **`A != 1 AND A != 2 AND A != NULL`**로 풀린다. `A != NULL`이 `UNKNOWN`이 되는데, **`AND` 연산에 `UNKNOWN`이 하나라도 끼면 전체 조건이 `UNKNOWN`(거짓)이 되어버린다!** 따라서 `NOT IN` 괄호(또는 서브쿼리 결과) 안에 **`NULL`이 단 하나라도 포함되어 있으면 결과는 무조건 0건(한 건도 조회 안 됨!)**이 된다!\n\n3. **`LIKE '패턴'` 및 와일드카드 (`%`, `_`), `ESCAPE` 옵션**:\n   - **`%` (퍼센트)**: **0글자 이상**의 임의의 문자열 (글자 수 제한 없음)\n   - **`_` (언더바)**: **정확히 1글자**의 임의의 문자\n   - **`ESCAPE` 옵션**: 데이터 값 자체에 포함된 실제 `%`나 `_` 기호를 문자로 검색하고 싶을 때 사용!\n     ```sql\n     -- 예: 이름에 실제 언더바('_')가 포함된 사원 조회 ('A_A' 등)\n     SELECT * FROM EMP WHERE ENAME LIKE '%#_%' ESCAPE '#';\n     ```\n     *(설명: `ESCAPE '#'`으로 지정하면 `#` 바로 뒤에 오는 `_`나 `%` 딱 1글자만 와일드카드가 아닌 일반 문자로 취급한다!)*\n\n4. **`IS NULL` / `IS NOT NULL`**:\n   - `NULL` 값을 찾을 때는 절대 `= NULL`이나 `!= NULL`을 쓰면 안 되며(에러는 안 나지만 결과 0건!), 반드시 **`IS NULL`**, **`IS NOT NULL`**을 사용해야 한다.\n\n![IN 연산자와 다중 컬럼 IN (Pairwise 비교) 예시](images/p037_img04.png)\n\n![IN 연산자 다중 조건 비교 예시 1](images/p038_img01.png)\n\n![IN 연산자 다중 조건 비교 예시 2](images/p038_img02.png)\n\n![LIKE 연산자 와일드카드(%, _) 패턴 매칭 사례](images/p038_img03.png)\n\n![ESCAPE 옵션을 활용한 특수문자(_, %) 검색 예시](images/p038_img04.png)\n\n![BETWEEN a AND b 범위 검색 및 IS NULL 조회 예시](images/p038_img05.png)\n\n![논리 연산자(AND, OR, NOT) 진리표 및 결합 예시 1](images/p038_img06.png)\n\n![논리 연산자 우선순위(NOT > AND > OR) 비교 예시 2](images/p038_img07.png)\n\n![논리 연산자 괄호 유무에 따른 결과 차이 예시 3](images/p038_img08.png)\n\n![부정 비교 연산자 및 부정 SQL 연산자 실행 예시 1](images/p038_img09.png)\n\n![부정 SQL 연산자 (NOT BETWEEN, NOT IN) 실행 예시 2](images/p039_img01.png)\n\n### 📌 4. ROWNUM (Oracle)과 TOP (SQL Server) 기초\n- **Oracle `ROWNUM`**: 조회된 결과 행에 `1`부터 순차적으로 부여되는 가상 컬럼(Pseudo Column).\n  - 단, `1`번이 먼저 만들어져야 `2`번이 만들어지므로, **`WHERE ROWNUM = 1`이나 `WHERE ROWNUM <= 5`는 조회되지만, `WHERE ROWNUM = 2`나 `WHERE ROWNUM > 1`은 영원히 0건이 조회된다!**\n- **SQL Server `TOP (N)`**: `SELECT TOP(3) * FROM EMP` 형태로 상위 `N`건을 추출한다.\n\n![ROWNUM = 1 단건 조회 예시](images/p039_img02.png)\n\n---\n\n## 🔍 STEP 2. 직관적 Before & After 비교 & 실전 SQL 트레이스\n\n### 🔄 [Before & After] 직관적 비교\n\nEMP 4명에서 부서·급여·이름·커미션 조건을 조합해 행을 골라내는 상황. IN·LIKE·IS NULL 결합 방식에 따라 결과 행이 어떻게 달라지는지 비교.\n\n### EMP\n\n| EMP_ID | NAME | DEPT_ID | SAL | COMM |\n|---|---|---|---|---|\n| 1 | 김철수 | D1 | 3000 | NULL |\n| 2 | 이영희 | D1 | 4500 | 200 |\n| 3 | 박민수 | D2 | 2500 | NULL |\n| 4 | 김영수 | D3 | 5000 | 500 |\n\n### `WHERE DEPT_ID IN ('D1', 'D3') AND SAL >= 3000`\n\n| EMP_ID | NAME | DEPT_ID | SAL |\n|---|---|---|---|\n| 1 | 김철수 | D1 | 3000 |\n| 2 | 이영희 | D1 | 4500 |\n| 4 | 김영수 | D3 | 5000 |\n\n### `WHERE NAME LIKE '김%' AND COMM IS NULL`\n\n| EMP_ID | NAME |\n|---|---|\n| 1 | 김철수 |\n\nWHERE 는 행을 하나씩 검사해 조건이 TRUE 인 행만 통과 → 조건 표현이 곧 결과 집합. NULL 비교는 항상 UNKNOWN 이라 `=`·`!=` 로는 잡히지 않으니 IS NULL 사용. IN 으로 다중 선택과 비교 연산자를 AND 로 묶어 조건 세분화. \"정확히 어떤 행이 필요한가\" 를 먼저 말로 풀어 쓴 뒤 그대로 연산자로 옮기면 실수가 줄어듦\n\n### 💻 [SQL 실전 트레이스]\n\n```sql\n-- 비교\nSELECT * FROM EMP WHERE SAL >= 3000;\n\n-- BETWEEN\nSELECT * FROM EMP WHERE SAL BETWEEN 3000 AND 5000;\n\n-- IN\nSELECT * FROM EMP WHERE DEPT_ID IN ('D1', 'D2', 'D3');\n\n-- LIKE\nSELECT * FROM EMP WHERE NAME LIKE '김%';\n\n-- IS NULL\nSELECT * FROM EMP WHERE COMM IS NULL;\n\n-- AND/OR\nSELECT * FROM EMP WHERE DEPT_ID = 'D1' AND SAL >= 3000;\n```\n\n---\n\n## 🚨 STEP 3. 출제위원 단골 함정 O/X & 노랭이·기출 문항별 족보\n\n### ⚠️ 시험장 단골 함정 vs 정답 1:1 대조표\n\n| 함정 | 정답 |\n|---|---|\n| `WHERE COMM = NULL`의 결과 | 0건. IS NULL을 사용 |\n| `BETWEEN 100 AND 200` | 100, 200 포함(양 끝 포함) |\n| `LIKE '_김%'` | 두 번째 글자가 '김'으로 시작 |\n| `IN (a, b, c)`은 OR과 같음 | 옳음 |\n| AND와 OR 우선순위 | AND가 먼저 |\n| `NOT IN` 사용 시 NULL 주의 | NULL이 포함되면 결과가 비어버릴 수 있음 |\n| `_`와 `%` 차이 | `_`은 1글자, `%`은 0개 이상 |\n\n단골 함정: `WHERE A NOT IN (1, 2, NULL)` 은 항상 거짓 → 결과 0건\n\n### 📒 이 단원과 직결된 『SQL 자격검정 실전문제(노랭이)』 & 기출 킬러 족보\n\n- **[21회 기출 3번 & 30회 기출 15번 ★최빈출]** `IN` 연산에 `NULL`이 포함되어 있으면 `OR` 연산이므로 `NULL`을 무시하고 나머지 일치하는 행을 출력하지만, **`NOT IN` 연산에 `NULL`이 하나라도 포함되어 있으면 `AND` 연산이므로 전체 조건이 `UNKNOWN`이 되어 결과는 항상 `0건(공집합)`이 반환**된다!\n- **[노랭이 2과목 37·45번]** `VARCHAR2` 컬럼에 모든 데이터가 숫자로만 들어있으면 숫자와 비교 가능(자동 형변환). 단, 숫자가 아닌 문자가 하나라도 섞여 있으면 `ORA-01722(수치가 부적합합니다)` 에러 발생!\n- **[노랭이 2과목 79번]** 다중 컬럼에 대해 `(A, B) NOT IN ((1, 2), (3, 4))`와 `A NOT IN (1, 3) AND B NOT IN (2, 4)`는 전혀 다른 결과를 반환한다 (다중 컬럼은 묶어서 비교해야 함).\n- **[34회 기출 33번]** Oracle에서 `LIKE 'A%'` 조회 시 대소문자를 구분하지만, SQL Server는 기본적으로 대소문자를 구분하지 않는다.\n\n---\n\n## ✍️ STEP 4. 실전 적중! 단원 마무리 확인 문제\n\n<div class=\"sqld-quiz-box\" data-answer=\"2\">\n\n**Q. [2-1-4 대표 적중 문제]** `EMP` 테이블에 5명의 사원이 있고 `MGR` 컬럼 값이 각각 `[100, 100, 200, 300, NULL]`일 때, 다음 두 SQL 쿼리의 실행 결과 건수(`CNT1`, `CNT2`)로 **올바른** 것은?\n```sql\n-- [쿼리 1]\nSELECT COUNT(*) AS CNT1 FROM EMP WHERE MGR IN (100, 200, NULL);\n-- [쿼리 2]\nSELECT COUNT(*) AS CNT2 FROM EMP WHERE MGR NOT IN (100, 200, NULL);\n```\n\n- ① `CNT1 = 3`, `CNT2 = 1`\n- ② `CNT1 = 3`, `CNT2 = 0`\n- ③ `CNT1 = 0`, `CNT2 = 0`\n- ④ `CNT1 = 4`, `CNT2 = 2`\n\n<details>\n<summary>💡 <b>정답 및 시나공·과외노트식 보기별 완벽 해설 확인하기 (클릭)</b></summary>\n\n**정답: ② (`CNT1 = 3`, `CNT2 = 0`)**\n- **해설**:\n  - **[쿼리 1] (`IN`)**: `MGR = 100 OR MGR = 200 OR MGR = NULL`과 같습니다. `MGR = NULL`은 `UNKNOWN`이지만 `OR` 연산이므로 `100`(2명)과 `200`(1명)이 참(`TRUE`)이 되어 **총 `3`건**이 조회됩니다.\n  - **[쿼리 2] (`NOT IN`)**: `MGR <> 100 AND MGR <> 200 AND MGR <> NULL`과 같습니다. `MGR <> NULL`이 항상 `UNKNOWN`이므로 `AND` 연산 전체가 `UNKNOWN`이 되어 단 한 건도 통과하지 못하고 **`0`건**이 됩니다! (`NOT IN` 서브쿼리 쓸 때는 반드시 `WHERE MGR IS NOT NULL` 조건을 넣어야 합니다!)\n\n</details>\n</div>\n\n---\n\n## ⏱️ STEP 5. 시험장 입실 직전 30초 최종 요약 카드\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · BETWEEN A AND B = **A·B 양 끝 포함** (A ≤ x ≤ B)\n> · IN(a,b,c) = OR 의 단축형 / NOT IN + NULL = **항상 거짓** (결과 0건)\n> · LIKE: `%` = 0개 이상 / `_` = 정확히 1개. 자체 검색은 ESCAPE\n> · NULL 비교는 **IS NULL / IS NOT NULL** 만 가능 (`= NULL` 항상 거짓)\n> · 우선순위: 산술 > 연결(||) > 비교 > NOT > AND > OR\n> · 함정: `A=1 OR B=2 AND C=3` = `A=1 OR (B=2 AND C=3)` (AND 가 먼저)"}, {"id": "ch-15", "index": 15, "title": "2-1-5. GROUP BY, HAVING 절", "subj_id": "tab2", "subj_name": "2과목 1장 · SQL 기본", "badge": "2과목 1장 · SQL 기본", "md": "# 2-1-5. GROUP BY, HAVING 절\n\n> **단원 분류**: `2과목` > `2-1. SQL 기본` > **`2-1-5. GROUP BY · HAVING 절`**\n> **🎯 출제 빈도**: `★★★★★ (매회 2문항 100% 출제!)` &nbsp;|&nbsp; **🧠 두문자 암기 공식**: `GROUP BY 시 SELECT 절에는 '그룹 기준 컬럼'과 '집계함수'만 가능! / HAVING 공집합 COUNT(*) = 공집합!`\n\n## 🎯 과외선배의 1분 브리핑 & 핵심 구조도\n\n> [!TIP]\n> **👨‍🏫 1:1 과외선배의 학습 코칭 (`유선배 과외노트` 스타일)**\n> 여기서 수험생 90%가 틀리는 킬러 함정이 2개 있습니다: ① **`AVG(NVL(COL, 0))`은 `NULL`을 `0`으로 바꾼 뒤 전체 행 수로 나누고, `NVL(AVG(COL), 0)`은 `NULL`을 제외하고 평균을 먼저 낸 뒤 전체가 `NULL`일 때만 `0`으로 바꾼다!** ② **일반 `WHERE` 절에서 조건에 맞는 행이 없을 때 `SELECT COUNT(*)`는 `0`을 출력하지만, `GROUP BY`나 `HAVING` 절에서 조건에 맞는 그룹이 하나도 없을 때 `SELECT COUNT(*)`는 `0`이 아니라 `공집합(No rows selected)`을 반환한다!** (34회 기출 23번)\n\n> GROUP BY는 데이터를 그룹별로 묶는 절, HAVING은 묶인 그룹에 조건을 거는 절이다.\n\nex) 영수증 50장을 \"분류별로 묶어 합계(GROUP BY 분류)\" → \"합계 10만원 넘는 분류만(HAVING 합계 > 10만)\" 으로 거르는 것과 같음\n\n### 🗺️ 한눈에 보는 핵심 구조도: WHERE vs HAVING의 위치\n\n| 1단계: `WHERE` 절 | ➔ | 2단계: `GROUP BY` 절 | ➔ | 3단계: `HAVING` 절 |\n| :---: | :---: | :---: | :---: | :---: |\n| **그룹화 전 개별 행 필터링**<br>*(집계함수 사용 절대 불가!)* | | **살아남은 행들을 그룹으로 묶음**<br>*(SELECT절 별칭 사용 불가!)* | | **그룹화 후 집계 결과 필터링**<br>*(집계함수 조건 사용 가능!)* |\n\n실행 순서: **FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY**\n\n---\n\n## 📘 STEP 1. 시험 출제 핵심 이론 & 강의 도표 완벽 정복\n\n### 📌 1. 집계 함수 (Aggregate Functions)의 특징과 종류\n\n> 🚨 **[절대 주의 / 원본 오타 교정]**\n> **🚨 원본 요약본(`SQLD_2과목_SQL 기본.pdf`) 오타 교정 3번 반영!**\n> - `COUNT(DISTRICT 컬럼)` (❌ 오타) ➔ **`COUNT(DISTINCT 컬럼)`** (⭕ 정답)\n\n- **집계 함수의 5대 핵심 규칙 (★매 시험 출제!)**:\n  1. 여러 행들의 그룹이 모여서 **그룹당 단 하나의 결과**를 돌려주는 다중행 함수이다.\n  2. `GROUP BY` 절은 행들을 소그룹화하며, **`GROUP BY` 절 없이도 테이블 전체를 하나의 그룹으로 보고 `SELECT SUM(SAL) FROM EMP;`처럼 집계 함수를 단독 사용할 수 있다.**\n  3. **`SELECT` 절, `HAVING` 절, `ORDER BY` 절에 사용할 수 있다.** (★절대 **`WHERE` 절에는 집계 함수를 직접 쓸 수 없다!** `WHERE AVG(SAL) > 2000` ➔ **문법 에러!**)\n  4. **`COUNT(*)`을 제외한 모든 집계 함수는 `NULL` 값을 연산에서 제외(무시)**하고 계산한다!\n     - 예: 값 4개가 `[10, 20, 30, NULL]`일 때:\n       - `COUNT(*)` ➔ **`4`** (`NULL` 행 포함 전체 행 수)\n       - `COUNT(컬럼)` ➔ **`3`** (`NULL` 제외 건수)\n       - `SUM(컬럼)` ➔ **`60`**\n       - `AVG(컬럼)` ➔ `60 / 4`가 아니라 **`60 / 3 = 20`**!\n       - 만약 `NULL`을 `0`으로 치환해서 4명으로 나눈 평균(`15`)을 구하고 싶다면 **`AVG(NVL(컬럼, 0))`**으로 작성해야 한다! *(주의: `NVL(AVG(컬럼), 0)`은 이미 `NULL`을 빼고 3으로 나눈 평균 `20`을 구한 뒤 그 결과가 `NULL`일 때만 `0`으로 바꾸는 것이므로 결과가 `20`으로 전혀 다르다!)*\n  5. **공집합(조회된 행이 0건)일 때의 반환값**:\n     - `GROUP BY` 없이 `WHERE 1=2`처럼 대상 행이 0건일 때 `COUNT(*)`나 `COUNT(컬럼)`은 **`0`**을 반환하고, `SUM`, `AVG`, `MAX`, `MIN`은 **`NULL`** (1행)을 반환한다.\n\n| 집계 함수 | 의미 |\n| :--- | :--- |\n| **`COUNT(*)`** | **`NULL` 값을 포함한** 전체 행(Row)의 수를 출력 |\n| **`COUNT(표현식)`** | 표현식의 값이 **`NULL`인 것을 제외한** 행의 수를 출력 |\n| **`COUNT(DISTINCT 표현식)`** | 표현식의 값이 **`NULL`인 것을 제외하고, 중복된 값도 제거한** 유일한 값의 개수를 출력 *(오타 교정 완료!)* |\n| **`SUM([DISTINCT\\|ALL] 표현식)`** | `NULL`을 제외한 합계 출력 |\n| **`AVG([DISTINCT\\|ALL] 표현식)`** | `NULL`을 제외한 평균 출력 (`SUM / COUNT(표현식)`) |\n| **`MAX(표현식)` / `MIN(표현식)`** | `NULL`을 제외한 최댓값 / 최솟값 출력 *(숫자뿐만 아니라 **문자열, 날짜 타입에도 사용 가능**!)* |\n| **`STDDEV(표현식)` / `VARIANCE(표현식)`** | 표준편차 / 분산 출력 |\n\n![집계 함수의 종류와 설명 요약표](images/p039_img03.png)\n\n![GROUP BY 없이 전체 테이블에 집계 함수를 사용한 예시](images/p039_img04.png)\n\n![GROUP BY 절을 사용하여 포지션별 통계를 구한 예시](images/p040_img01.png)\n\n---\n\n### 📌 2. GROUP BY 절과 HAVING 절의 핵심 규칙 및 WHERE 절과의 차이\n- **GROUP BY 절의 특징**:\n  1. **`GROUP BY` 절에는 컬럼 별칭(Alias)을 사용할 수 없다!** (실행 순서상 `GROUP BY`가 `SELECT`보다 먼저 수행되기 때문)\n  2. **`GROUP BY` 절에서는 `NULL` 값도 하나의 독립된 그룹으로 묶인다!** (집계 함수는 `NULL`을 무시하지만, `GROUP BY 부서코드`를 하면 부서코드가 `NULL`인 사원들끼리 하나의 그룹 행으로 출력됨!)\n  3. `GROUP BY` 절을 사용할 때, **`SELECT` 절과 `ORDER BY` 절에는 `GROUP BY`에 명시된 기준 컬럼(또는 그 표현식)과 집계 함수만 올 수 있다!** (`GROUP BY DEPTNO`만 했는데 `SELECT DEPTNO, ENAME, AVG(SAL)`처럼 그룹화되지 않은 일반 컬럼 `ENAME`을 쓰면 `ORA-00979: GROUP BY 표현식이 아닙니다` 에러 발생!)\n- **WHERE 절 vs HAVING 절 완벽 비교**:\n  - **`WHERE` 절**: `GROUP BY`로 그룹화하기 **이전에 개별 행(Row)**을 먼저 걸러내는 조건절. (집계 함수 사용 **불가**, 조건에 맞지 않는 행을 미리 버리므로 그룹화 연산량을 줄여줌)\n  - **`HAVING` 절**: `GROUP BY`로 그룹화한 **이후에 집계된 소그룹(Group)**을 걸러내는 조건절. (**집계 함수 사용 가능!**)\n  - *(참고: 문법적으로 `GROUP BY`와 `HAVING`의 작성 순서를 바꿔서 `HAVING ... GROUP BY ...`로 써도 Oracle에서는 에러 없이 돌아가지만, 논리적 실행 순서는 무조건 **`WHERE` ➔ `GROUP BY` ➔ `HAVING`** 순이다!)*\n\n![WHERE 절에 집계 함수를 잘못 사용하여 에러가 발생한 예시](images/p040_img02.png)\n\n![HAVING 절을 사용하여 그룹별 평균키 조건을 필터링한 올바른 예시](images/p040_img03.png)\n\n![CASE 표현과 집계 함수를 결합하여 월별/부서별 가로 집계(Pivot 효과)를 구현한 쿼리 1](images/p041_img01.png)\n\n![CASE 표현과 집계 함수를 결합한 가로 집계 실행 결과 2](images/p041_img02.png)\n\n---\n\n## 🔍 STEP 2. 직관적 Before & After 비교 & 실전 SQL 트레이스\n\n### 🔄 [Before & After] 직관적 비교\n\nEMP 5명을 D1·D2·D3 세 부서로 묶어 부서별 인원수·평균급여를 구하고, 그중 평균급여 3500 이상 부서만 남기는 상황. GROUP BY 로 그룹화한 단계와 HAVING 으로 거른 단계의 결과를 단계별로 비교.\n\n### EMP\n\n| NAME | DEPT_ID | SAL |\n|---|---|---|\n| 김 | D1 | 3000 |\n| 이 | D1 | 4000 |\n| 박 | D2 | 2500 |\n| 최 | D2 | 3500 |\n| 홍 | D3 | 5000 |\n\n### `GROUP BY DEPT_ID`\n\n| DEPT_ID | COUNT(*) | AVG(SAL) |\n|---|---|---|\n| D1 | 2 | 3500 |\n| D2 | 2 | 3000 |\n| D3 | 1 | 5000 |\n\n### `HAVING AVG(SAL) >= 3500`\n\n| DEPT_ID | AVG(SAL) |\n|---|---|\n| D1 | 3500 |\n| D3 | 5000 |\n\nGROUP BY 는 행을 키 단위로 접어 한 그룹당 한 행으로 만들고, 그 위에서 집계 함수 동작. 평균급여 같은 집계 결과를 조건으로 걸려면 행 단위 WHERE 가 아니라 그룹 단위 HAVING 사용. \"어떤 행을 걸러야 하나\" 는 WHERE, \"묶은 결과 중 어떤 그룹을 남기나\" 는 HAVING — 필터를 어느 단계에 둘지 먼저 정하고 쿼리를 짜는 것이 안전\n\n### 💻 [SQL 실전 트레이스]\n\n```sql\n-- 부서별 인원수와 평균급여\nSELECT  DEPT_ID,\n        COUNT(*)    AS CNT,\n        AVG(SAL)    AS AVG_SAL\nFROM    EMP\nGROUP BY DEPT_ID;\n\n-- 부서별 평균급여가 3500 이상인 부서만\nSELECT  DEPT_ID, AVG(SAL)\nFROM    EMP\nGROUP BY DEPT_ID\nHAVING  AVG(SAL) >= 3500;\n\n-- WHERE + GROUP BY + HAVING 조합\nSELECT  DEPT_ID, AVG(SAL)\nFROM    EMP\nWHERE   HIRE_DATE >= DATE '2020-01-01'   -- 2020년 이후 입사자만\nGROUP BY DEPT_ID\nHAVING  COUNT(*) >= 3;                   -- 3명 이상인 부서\n```\n\n---\n\n## 🚨 STEP 3. 출제위원 단골 함정 O/X & 노랭이·기출 문항별 족보\n\n### ⚠️ 시험장 단골 함정 vs 정답 1:1 대조표\n\n| 함정 | 정답 |\n|---|---|\n| WHERE에 집계함수 사용 | 불가 → HAVING에서 사용 |\n| GROUP BY에 없는 일반 컬럼을 SELECT에 사용 | 불가 |\n| HAVING은 GROUP BY 없이 쓸 수 있는가 | 가능(전체를 1개 그룹으로 봄) |\n| 실행 순서 | FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY |\n| COUNT(*) vs COUNT(컬럼) | NULL 포함 여부의 차이 |\n| GROUP BY (A, B) 결과 행 수 | A, B 조합 개수 |\n\n단골 함정: SELECT 에 그룹화되지 않은 컬럼이 끼어 있는 쿼리를 에러로 판별하라는 문제\n\n### 📒 이 단원과 직결된 『SQL 자격검정 실전문제(노랭이)』 & 기출 킬러 족보\n\n- **[노랭이 2과목 51·53·56번 ★중요체크]** `GROUP BY` 기준 칼럼에 `NULL` 값들이 있을 경우 **`NULL`끼리도 하나의 그룹으로 묶여 집계**된다! 또한 `GROUP BY` 사용 시 `SELECT` 절에는 **그룹 대상 칼럼과 집계함수 외의 일반 칼럼은 올 수 없다**.\n- **[34회 기출 23번 ★전설의 킬러 문항]** 일반 `SELECT COUNT(*) FROM EMP WHERE 1=2;`는 결과 행이 `0`이라는 1건이 출력되지만, **`GROUP BY` 및 `HAVING` 절을 사용하여 만족하는 그룹이 하나도 없을 때는 그룹 자체의 결과 집합이 생성되지 않으므로 `COUNT(*)`도 `0`이 아닌 `공집합(0행)`이 반환**된다!\n- **[34회 기출 27번]** `WHERE` 절에는 집계함수를 직접 사용할 수 없다 (단, `WHERE` 절 내부의 서브쿼리 안에서는 사용 가능).\n\n---\n\n## ✍️ STEP 4. 실전 적중! 단원 마무리 확인 문제\n\n<div class=\"sqld-quiz-box\" data-answer=\"3\">\n\n**Q. [2-1-5 대표 적중 문제]** 다음 중 `GROUP BY` 절과 `HAVING` 절 및 집계함수에 대한 설명으로 **가장 부적절한** 것은?\n\n- ① `GROUP BY` 절을 사용할 때 기준 컬럼에 `NULL` 값이 여러 건 존재하면, 해당 `NULL` 값들도 하나의 그룹으로 묶여서 집계 결과가 출력된다.\n- ② `WHERE` 절은 그룹화하기 전에 개별 행을 필터링하므로 집계함수를 직접 쓸 수 없고, `HAVING` 절은 그룹화된 결과 집합에 대해 조건을 부여하므로 집계함수를 사용할 수 있다.\n- ③ `COMM` 컬럼에 `NULL` 값이 포함된 테이블에서 `SELECT AVG(NVL(COMM, 0))`과 `SELECT NVL(AVG(COMM), 0)`의 실행 결과는 항상 동일하다.\n- ④ `GROUP BY DEPTNO HAVING COUNT(*) > 100`과 같이 `HAVING` 조건을 만족하는 그룹이 단 하나도 없을 경우, `SELECT COUNT(*) FROM EMP GROUP BY DEPTNO HAVING COUNT(*) > 100;`의 결과는 `0`이 아니라 **공집합(선택된 레코드 없음)**이다.\n\n<details>\n<summary>💡 <b>정답 및 시나공·과외노트식 보기별 완벽 해설 확인하기 (클릭)</b></summary>\n\n**정답: ③**\n- **해설**: `COMM` 값이 `[100, 200, NULL, NULL]`(4건)일 때:\n  - `AVG(NVL(COMM, 0))`은 `NULL`을 먼저 `0`으로 바꾼 뒤 평균을 구하므로 `(100 + 200 + 0 + 0) / 4 = 75`가 됩니다.\n  - 반면 `NVL(AVG(COMM), 0)`은 `AVG(COMM)`이 먼저 실행되어 `NULL`을 제외하고 `(100 + 200) / 2 = 150`을 구한 뒤 `NVL(150, 0)`을 수행하므로 `150`이 되어 **결과가 완전히 다릅니다!**\n\n</details>\n</div>\n\n---\n\n## ⏱️ STEP 5. 시험장 입실 직전 30초 최종 요약 카드\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · WHERE = **행 단위 필터** / HAVING = **그룹 단위 필터** (실행 순서상 GROUP BY 후 적용)\n> · WHERE 에 집계 함수 = **불가** / HAVING 에 집계 함수 = **가능**\n> · GROUP BY 에 없는 일반 컬럼을 SELECT 에 그대로 사용 = **불가**\n> · GROUP BY 없이 HAVING 단독 = **가능** (전체를 1개 그룹으로 봄)\n> · 결과 행 수 = GROUP BY 컬럼 조합의 개수"}, {"id": "ch-16", "index": 16, "title": "2-1-6. ORDER BY 절", "subj_id": "tab2", "subj_name": "2과목 1장 · SQL 기본", "badge": "2과목 1장 · SQL 기본", "md": "# 2-1-6. ORDER BY 절\n\n> **단원 분류**: `2과목` > `2-1. SQL 기본` > **`2-1-6. ORDER BY 절`**\n> **🎯 출제 빈도**: `★★★★☆ (빈출)` &nbsp;|&nbsp; **🧠 두문자 암기 공식**: `Oracle은 NULL이 가장 큰 값(맨 뒤!) vs SQL Server는 NULL이 가장 작은 값(맨 앞!)`\n\n## 🎯 과외선배의 1분 브리핑 & 핵심 구조도\n\n> [!TIP]\n> **👨‍🏫 1:1 과외선배의 학습 코칭 (`유선배 과외노트` 스타일)**\n> `ORDER BY`에서 시험에 나오는 건 딱 2가지입니다: ① **Oracle은 `NULL`을 무한대(가장 큰 값)로 취급**해서 오름차순(`ASC`)일 때 **맨 마지막**에 나오고 내림차순(`DESC`)일 때 **맨 처음**에 나온다! 반대로 **SQL Server는 `NULL`을 가장 작은 값으로 취급**해서 정반대다! ② `GROUP BY`를 사용한 쿼리에서는 **`ORDER BY` 절에도 그룹 기준 컬럼이나 집계함수만 올 수 있다**(일반 개별 행 컬럼으로 정렬 시도 시 에러!).\n\n> ORDER BY는 결과를 어떤 순서로 보여줄지 정렬하는 절이다. SELECT 문에서 가장 마지막에 실행된다.\n\nex) 책장 정리처럼 \"가나다순(`ASC`)·최신순(`DESC`)·분야별 → 분야 내 가나다순(`ORDER BY 분야, 책이름`)\" 식으로 1차·2차 정렬 가능\n\n### 🗺️ 한눈에 보는 핵심 구조도: ORDER BY의 위치\n\n```\nSELECT  ...\nFROM    ...\nWHERE   ...\nGROUP BY ...\nHAVING  ...\nORDER BY ...   ← 항상 맨 마지막\n```\n\n| 정렬 전 조회 결과 집합 | ─── `ORDER BY` 절 실행 (SQL 맨 마지막 6번째 순서) ───▶ | 최종 정렬된 출력 결과 |\n| :---: | :---: | :---: |\n| `SELECT`절까지 완료된 행들 | 컬럼명, **별칭(Alias)**, **컬럼 순번(1, 2...)** 모두 사용 가능! | 기본값은 **`ASC`(오름차순)** |\n\n---\n\n## 📘 STEP 1. 시험 출제 핵심 이론 & 강의 도표 완벽 정복\n\n### 📌 1. ORDER BY 정렬의 기본 특징과 3가지 지정 방식\n- **`ORDER BY` 절의 특징**:\n  - SQL 문장으로 조회된 데이터들을 다양한 목적에 맞게 특정 컬럼을 기준으로 정렬하여 출력하는데 사용한다.\n  - **`ORDER BY` 절을 명시하지 않으면 데이터는 임의의 순서(무순서)로 출력**된다.\n  - 기본 정렬 순서는 **오름차순(`ASC`, Ascending — 생략 가능)**이며, 내림차순은 **`DESC`(Descending — 생략 불가)**를 명시한다.\n  - 여러 기준을 콤마(`,`)로 나열하면(`ORDER BY A DESC, B ASC`), 앞의 `A` 컬럼은 내림차순으로 정렬하고 `A` 값이 같은 행들끼리는 `B` 컬럼 기준 오름차순으로 정렬한다 (`DESC`는 바로 앞의 컬럼 하나에만 적용됨!).\n- **`ORDER BY` 절에서 정렬 기준을 지정하는 3가지 방법 (모두 혼용 가능!)**:\n  1. **컬럼명(Column Name)** 직접 사용: `ORDER BY PLAYER_NAME DESC`\n  2. **`SELECT` 절에서 부여한 별칭(Alias)** 사용: `ORDER BY 선수명 DESC` *(실행 순서상 `ORDER BY`는 `SELECT` 다음에 마지막으로 실행되므로 별칭 사용 가능!)*\n  3. **`SELECT` 절에 나열된 컬럼의 순서 번호(1, 2, 3...)** 사용: `ORDER BY 1 DESC, 2 ASC`\n\n> ⚠️ **[시험 단골 함정 주의]**\n> **ORDER BY 절에 `SELECT` 절에 없는 컬럼을 쓸 수 있는가?**\n> - **일반 조회 쿼리 (`GROUP BY`나 `DISTINCT`, 집합 연산자가 없을 때)**: `SELECT` 절에 출력하지 않은 테이블 내 다른 컬럼으로도 **`ORDER BY` 정렬이 가능하다!** (예: `SELECT ENAME FROM EMP ORDER BY SAL DESC;` ➔ **정상 실행!**)\n> - **예외 (에러가 나는 경우 3가지)**:\n>   1. **`GROUP BY` 절을 사용한 경우**: `ORDER BY` 절에도 반드시 **`GROUP BY` 기준 컬럼이나 집계 함수만** 올 수 있다! (일반 개별 행 컬럼 사용 시 에러!)\n>   2. **`SELECT DISTINCT`를 사용한 경우**: `SELECT` 절에 명시된 컬럼으로만 `ORDER BY` 할 수 있다!\n>   3. **집합 연산자 (`UNION`, `INTERSECT`, `MINUS`)를 사용한 경우**: 쿼리 맨 마지막에 딱 한 번만 `ORDER BY`를 쓸 수 있으며, **첫 번째 `SELECT` 절의 컬럼명, 별칭, 또는 위치 번호**만 사용할 수 있다!\n\n![ORDER BY 절 기본 문법 및 정렬 예시](images/p041_img03.png)\n\n![컬럼명, 별칭, 순서번호를 혼합한 다중 정렬 예시](images/p042_img01.png)\n\n---\n\n### 📌 2. Oracle vs SQL Server의 NULL 정렬 순서 차이 (★100% 출제!)\n\n> 💡 **[핵심 필수 암기]**\n> **DBMS별 `NULL`의 크기 취급 (암기: `\"오·큰 / 설·작\"` — 오라클은 NULL이 가장 큰 값, SQL Server는 NULL이 가장 작은 값!)**\n\n| 구분 | Oracle (오라클) | SQL Server (MSSQL) |\n| :---: | :--- | :--- |\n| **`NULL`의 크기 취급** | **`NULL`을 가장 큰 값(무한대 ∞)**으로 취급! | **`NULL`을 가장 작은 값(-∞)**으로 취급! |\n| **오름차순 (`ASC`, 기본값)** | 작은 값 ➔ 큰 값 ➔ **`NULL`이 맨 마지막(맨 아래)에 출력** | **`NULL`이 맨 처음(맨 위)에 출력** ➔ 작은 값 ➔ 큰 값 |\n| **내림차순 (`DESC`)** | **`NULL`이 맨 처음(맨 위)에 출력** ➔ 큰 값 ➔ 작은 값 | 큰 값 ➔ 작은 값 ➔ **`NULL`이 맨 마지막(맨 아래)에 출력** |\n| **위치 강제 변경 옵션** | `ORDER BY 컬럼 ASC` **`NULLS FIRST`** (NULL을 맨 위로)<br>`ORDER BY 컬럼 DESC` **`NULLS LAST`** (NULL을 맨 아래로) | 별도 키워드 대신 `CASE WHEN COL IS NULL THEN 1 ELSE 0 END` 등 활용 |\n\n---\n\n### 📌 3. SELECT 문 실행 순서와 ROWNUM + ORDER BY 함정\n- **실행 순서 복습**: `FROM` ➔ `WHERE` ➔ `GROUP BY` ➔ `HAVING` ➔ `SELECT` ➔ `ORDER BY`\n- **🔥 `WHERE ROWNUM <= 3`과 `ORDER BY SAL DESC`를 같은 레벨에 쓰면 왜 틀리는가?**:\n  ```sql\n  -- ❌ 잘못된 쿼리 (급여 상위 3명을 뽑으려 했으나 실패!)\n  SELECT ENAME, SAL\n    FROM EMP\n   WHERE ROWNUM <= 3\n   ORDER BY SAL DESC;\n  ```\n  - **이유**: 실행 순서상 **`WHERE` 절이 `ORDER BY` 절보다 먼저 실행**된다! 따라서 위 쿼리는 정렬되기 전 테이블에서 **아무나 무작위로 3명을 먼저 뽑은 뒤(`WHERE ROWNUM <= 3`)**, 그 뽑힌 3명끼리만 급여순으로 정렬(`ORDER BY SAL DESC`)해버린다!\n  - **⭕ 올바른 해결법 (인라인 뷰 사용)**: 서브쿼리(`FROM` 절 인라인 뷰) 안에서 먼저 `ORDER BY SAL DESC`로 정렬을 끝내놓은 뒤, 바깥쪽 메인 쿼리에서 `WHERE ROWNUM <= 3`으로 잘라야 한다!\n\n![SELECT 문 실행 순서와 인라인 뷰를 활용한 Top-N 정렬 원리](images/p043_img01.png)\n\n---\n\n## 🔍 STEP 2. 직관적 Before & After 비교 & 실전 SQL 트레이스\n\n### 🔄 [Before & After] 직관적 비교\n\nEMP 5명을 부서별로 묶고, 같은 부서 안에서는 급여가 높은 사람이 먼저 보이도록 정렬하는 상황. DEPT_ID(오름차순)와 SAL(내림차순)을 한 ORDER BY 절에 섞었을 때 결과 순서가 어떻게 결정되는지 확인.\n\n### EMP\n\n| NAME | DEPT_ID | SAL |\n|---|---|---|\n| 김 | D1 | 3000 |\n| 이 | D2 | 4000 |\n| 박 | D1 | 2500 |\n| 최 | D2 | 4500 |\n| 홍 | D1 | 4000 |\n\n### `ORDER BY DEPT_ID ASC, SAL DESC`\n\n| NAME | DEPT_ID | SAL |\n|---|---|---|\n| 홍 | D1 | 4000 |\n| 김 | D1 | 3000 |\n| 박 | D1 | 2500 |\n| 최 | D2 | 4500 |\n| 이 | D2 | 4000 |\n\n부서 오름차순 → 부서 내 급여 내림차순으로 정렬됨\n\nORDER BY 는 나열된 컬럼 순서대로 1차·2차·3차 정렬을 적용하고, ASC/DESC 는 컬럼별로 따로 지정됨. \"DEPT_ID 는 오름차순, SAL 은 내림차순\" 처럼 키마다 방향이 달라도 한 줄에 함께 쓸 수 있음. 결과 순서를 사람 눈에 보일 형태로 확정해야 하는 보고서·페이지네이션·TopN 쿼리에서는 정렬 키를 의도대로 명시해두는 것이 안전\n\n### 💻 [SQL 실전 트레이스]\n\n```sql\n-- 단일 컬럼\nSELECT NAME, SAL FROM EMP\nORDER BY SAL DESC;\n\n-- 다중 컬럼\nSELECT NAME, DEPT_ID, SAL FROM EMP\nORDER BY DEPT_ID, SAL DESC;\n\n-- 별칭으로\nSELECT NAME, SAL*12 AS YEAR_SAL FROM EMP\nORDER BY YEAR_SAL DESC;\n\n-- 컬럼 번호로\nSELECT NAME, DEPT_ID, SAL FROM EMP\nORDER BY 3 DESC, 2 ASC;\n```\n\n---\n\n## 🚨 STEP 3. 출제위원 단골 함정 O/X & 노랭이·기출 문항별 족보\n\n### ⚠️ 시험장 단골 함정 vs 정답 1:1 대조표\n\n| 함정 | 정답 |\n|---|---|\n| ORDER BY 기본값 | ASC(오름차순) |\n| ORDER BY에서 SELECT 별칭 사용 | 가능 |\n| ORDER BY에서 컬럼 번호(숫자) 사용 | 가능 |\n| Oracle ORDER BY ASC, NULL의 위치 | 마지막 |\n| MS-SQL ORDER BY ASC, NULL의 위치 | 처음 |\n| `ORDER BY DEPT, SAL DESC`의 의미 | DEPT는 ASC(생략값), SAL만 DESC |\n| 집합연산자(UNION) 후 ORDER BY 위치 | 맨 마지막에 한 번만 |\n\n단골 함정: 문자형 컬럼에 숫자값이 들어 있을 때 정렬 순서. 예) '1', '10', '2' 를 정렬하면 사전순으로 '1', '10', '2'\n\n### 📒 이 단원과 직결된 『SQL 자격검정 실전문제(노랭이)』 & 기출 킬러 족보\n\n- **[빈출 핵심]** `ORDER BY` 절에서는 컬럼명, `SELECT` 절에 정의한 **별칭(Alias)**, 그리고 `SELECT` 절의 **컬럼 순서 번호(`1, 2, ...`)**를 모두 혼용하여 사용할 수 있다.\n\n---\n\n## ✍️ STEP 4. 실전 적중! 단원 마무리 확인 문제\n\n<div class=\"sqld-quiz-box\" data-answer=\"2\">\n\n**Q. [2-1-6 대표 적중 문제]** `T1` 테이블의 `SCORE` 컬럼에 `[10, 30, NULL, 20]` 4개의 행이 저장되어 있을 때, **오라클(Oracle)**과 **SQL Server**에서 각각 아래 쿼리를 실행했을 때 **첫 번째 행**에 출력되는 값으로 올바르게 짝지어진 것은?\n```sql\nSELECT SCORE FROM T1 ORDER BY SCORE DESC;\n```\n\n- ① Oracle: `30` / SQL Server: `30`\n- ② Oracle: `NULL` / SQL Server: `30`\n- ③ Oracle: `30` / SQL Server: `NULL`\n- ④ Oracle: `NULL` / SQL Server: `NULL`\n\n<details>\n<summary>💡 <b>정답 및 시나공·과외노트식 보기별 완벽 해설 확인하기 (클릭)</b></summary>\n\n**정답: ② (Oracle: `NULL` / SQL Server: `30`)**\n- **해설**:\n  - **오라클(Oracle)**은 `NULL`을 **가장 큰 값**으로 취급하므로, 내림차순(`DESC`) 정렬 시 가장 큰 값인 **`NULL`**이 맨 첫 번째 행에 출력됩니다 (`NULL ➔ 30 ➔ 20 ➔ 10`).\n  - **SQL Server**는 `NULL`을 **가장 작은 값**으로 취급하므로, 내림차순(`DESC`) 정렬 시 **`30`**이 첫 번째 행에 출력되고 `NULL`은 맨 마지막 행에 출력됩니다 (`30 ➔ 20 ➔ 10 ➔ NULL`).\n\n</details>\n</div>\n\n---\n\n## ⏱️ STEP 5. 시험장 입실 직전 30초 최종 요약 카드\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · 기본값 = **ASC** (오름차순). DESC 명시 필수\n> · ORDER BY 에는 **컬럼명 / 별칭 / 컬럼 번호** 모두 사용 가능 (가장 마지막 실행이라)\n> · `ORDER BY DEPT, SAL DESC` = DEPT ASC + SAL DESC (정렬 옵션은 컬럼별 개별 적용)\n> · NULL 위치: Oracle ASC = **마지막** / MS-SQL ASC = **처음**. 명시는 `NULLS FIRST/LAST`\n> · 문자형 정렬 = **사전순** ('1', '10', '2' 순). 숫자 정렬 원하면 TO_NUMBER 후\n> · UNION 등 집합연산 후 ORDER BY = **맨 마지막에 한 번만**"}, {"id": "ch-17", "index": 17, "title": "2-1-7. 조인(JOIN)", "subj_id": "tab2", "subj_name": "2과목 1장 · SQL 기본", "badge": "2과목 1장 · SQL 기본", "md": "# 2-1-7. 조인(JOIN)\n\n> **단원 분류**: `2과목` > `2-1. SQL 기본` > **`2-1-7. 조인`**\n> **🎯 출제 빈도**: `★★★★★ (매회 1~2문항 출제)` &nbsp;|&nbsp; **🧠 두문자 암기 공식**: `N개 테이블 조인 시 최소 조인 조건 = N-1개 / 오라클 (+) 기호는 데이터가 부족한(자식) 쪽에 붙인다!`\n\n## 🎯 과외선배의 1분 브리핑 & 핵심 구조도\n\n> [!TIP]\n> **👨‍🏫 1:1 과외선배의 학습 코칭 (`유선배 과외노트` 스타일)**\n> 오라클 외부 조인 기호 **`(+)`**의 방향과 `AND` 조건 함정을 조심하세요! ① `WHERE A.ID = B.ID(+)`는 **`+`가 안 붙은 `A` 테이블이 기준(`LEFT OUTER JOIN`)**입니다! ② 만약 `WHERE A.ID = B.ID(+) AND B.DEPT = '영업'`처럼 일반 조건에 `(+)`를 빠뜨리면 **외부 조인이 깨지고 내부 조인(`INNER JOIN`)으로 변질**됩니다! 기준 테이블(`A`)의 모든 행을 살리려면 `B.DEPT(+) = '영업'`처럼 `(+)`를 함께 붙여주거나 ANSI `ON` 절 안에 넣어야 합니다!\n\n> 조인은 두 개 이상의 테이블을 키로 연결해 한 결과로 합치는 작업이다.\n\nex) 영화관 티켓(영화 정보)과 회원증(회원 정보)을 회원번호라는 공통 키로 매칭해 \"누가 어떤 영화를 봤는지\" 알아내는 것과 같음\n\n### 🗺️ 한눈에 보는 핵심 구조도: 조인의 기본 원리\n\n조인은 모델링 단계의 **관계** 가 SQL 단에서 실제로 사용되는 방식. 이론적 배경은 **관계와 조인의 이해** 참고\n\n| `MEMBER` 테이블 (회원) | ◀─── 공통 키 (`M_ID`) 매칭 조인 ───▶ | `ORDERS` 테이블 (주문) |\n| :--- | :---: | :--- |\n| • `M01` (김철수)<br>• `M02` (이영희) | `MEMBER.M_ID = ORDERS.M_ID` | • 주문 1 (`M01` 김철수의 첫 주문)<br>• 주문 2 (`M01` 김철수의 두 번째 주문)<br>• 주문 3 (`M02` 이영희의 주문) |\n\n---\n\n## 📘 STEP 1. 시험 출제 핵심 이론 & 강의 도표 완벽 정복\n\n### 📌 1. 조인(JOIN)의 개념과 수행 원리\n- **조인의 정의**: 두 개 이상의 테이블들을 연결 또는 결합하여 데이터를 출력하는 것.\n- 일반적인 경우 행들은 **PK(기본키)나 FK(외래키) 값의 연관에 의해 조인이 성립**된다. 하지만 어떤 경우에는 **PK, FK의 관계가 없어도 논리적인 값들의 연관만으로 조인이 성립** 가능하다!\n- **N개 테이블 조인 시 최소 조인 조건의 개수**:\n  - **`N`개의 테이블을 조인하려면 최소 `N - 1`개의 조인 조건이 필요**하다! (예: 4개의 테이블을 조인하려면 최소 `4 - 1 = 3`개의 조인 조건문이 필요함. 만약 조인 조건을 누락하면 **카티션 곱(Cartesian Product, 교차곱)**이 발생하여 행 수가 `M × N`개로 폭발한다!)\n\n### 📌 2. EQUI JOIN (등가 조인)과 테이블 별칭(Alias) 규칙\n- **EQUI JOIN (등가 조인)**: 두 테이블 간에 칼럼 값들이 서로 정확하게 일치하는 경우에 사용되는 방법으로, **`=` (등호) 연산자**를 사용하여 조건을 표현한다 (대부분 PK ↔ FK 관계를 기반으로 함).\n- **⚠️ 테이블 별칭(Table Alias) 사용 시 절대 규칙**:\n  - 두 테이블에 같은 이름의 컬럼(예: `TEAM_ID`)이 존재할 때 `SELECT TEAM_ID`처럼 앞에 테이블명이나 별칭을 붙이지 않으면 **`ORA-00918: 열의 정의가 애매합니다 (Column ambiguously defined)` 에러**가 발생한다!\n  - **`FROM PLAYER P, TEAM T`처럼 테이블에 별칭(`P`, `T`)을 부여했다면, `SELECT` 절이나 `WHERE` 절에서는 원래 테이블명(`PLAYER.TEAM_ID`)을 쓰면 에러가 나며, 반드시 별칭(`P.TEAM_ID`)만 사용해야 한다!**\n\n![EQUI JOIN (등가 조인) 개념 및 WHERE 절 조인 조건 예시 1](images/p044_img01.png)\n\n![ANSI/ISO 표준 INNER JOIN ON 구문 예시 2](images/p044_img02.png)\n\n![조인 결과 데이터 매핑 도식](images/p044_img03.png)\n\n![WHERE 절에 조인 조건과 일반 검색 조건을 함께 작성한 예시](images/p044_img04.png)\n\n### 📌 3. NON-EQUI JOIN (비등가 조인)\n- **NON-EQUI JOIN (비등가 조인)**: 두개의 테이블 간에 칼럼 값들이 서로 정확하게 일치하지 않는 경우에 사용되며, **`=` 연산자가 아닌 `BETWEEN`, `>`, `>=`, `<`, `<=` 등의 연산자**를 사용하여 조인을 수행한다. (예: 사원의 급여 `EMP.SAL`이 급여등급 테이블 `SALGRADE`의 `LOSAL`과 `HISAL` 사이에 속하는지 조인: `WHERE E.SAL BETWEEN S.LOSAL AND S.HISAL`)\n\n![비등가 조인(NON-EQUI JOIN)을 위한 사원(EMP)과 급여등급(SALGRADE) 관계](images/p045_img01.png)\n\n![EMP 테이블과 SALGRADE 테이블의 BETWEEN 비등가 조인 매핑 도식](images/p045_img02.png)\n\n![NON-EQUI JOIN SQL 쿼리문 예시](images/p045_img03.png)\n\n![NON-EQUI JOIN 실행 결과 테이블](images/p045_img04.png)\n\n![테이블 3개 이상 조인 시 ERD 관계 도식](images/
