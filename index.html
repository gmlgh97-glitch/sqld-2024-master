CHED THEN\n    INSERT (EMP_ID, NAME, SAL) VALUES (N.EMP_ID, N.NAME, N.SAL);\n```\n\n### 시각화\n\n```\n     NEW_EMP의 행\n        │\n   E.EMP_ID 매칭?\n   ├ 있음 → UPDATE\n   └ 없음 → INSERT\n```\n\n---\n\n## DML과 트랜잭션\n\n```sql\nINSERT INTO EMP ...;\nUPDATE EMP ...;\nDELETE FROM EMP ...;\nCOMMIT;        -- 영구 반영\n-- 또는\nROLLBACK;      -- 취소\n```\n\nDML은 **트랜잭션**의 대상이며 COMMIT 전까지 메모리에만 있다. COMMIT/ROLLBACK 같은 트랜잭션 제어 명령은 **TCL**에서 다룬다.\n\n---\n\n## [Before & After]\n\n3행짜리 EMP 테이블에 INSERT → UPDATE → DELETE를 순서대로 적용한다. D1 부서 직원(김·이) 두 명에게만 10% 인상이 들어가고, 새로 추가했던 4번 직원(최)은 마지막에 다시 삭제되는 흐름이다.\n\n### EMP\n\n| EMP_ID | NAME | DEPT_ID | SAL |\n|---|---|---|---|\n| 1 | 김 | D1 | 3000 |\n| 2 | 이 | D1 | 4000 |\n| 3 | 박 | D2 | 3500 |\n\n### `INSERT INTO EMP VALUES (4, '최', 'D2', 4500);`\n\n| EMP_ID | NAME | DEPT_ID | SAL |\n|---|---|---|---|\n| 1 | 김 | D1 | 3000 |\n| 2 | 이 | D1 | 4000 |\n| 3 | 박 | D2 | 3500 |\n| 4 | 최 | D2 | 4500 |\n\n### `UPDATE EMP SET SAL = SAL * 1.1 WHERE DEPT_ID = 'D1';`\n\n| EMP_ID | NAME | DEPT_ID | SAL |\n|---|---|---|---|\n| 1 | 김 | D1 | 3300 |\n| 2 | 이 | D1 | 4400 |\n| 3 | 박 | D2 | 3500 |\n| 4 | 최 | D2 | 4500 |\n\n### `DELETE FROM EMP WHERE EMP_ID = 4;`\n\n| EMP_ID | NAME | DEPT_ID | SAL |\n|---|---|---|---|\n| 1 | 김 | D1 | 3300 |\n| 2 | 이 | D1 | 4400 |\n| 3 | 박 | D2 | 3500 |\n\nDML은 행 단위로 데이터를 바꾸지만 테이블 구조는 건드리지 않는다. 위 작업은 모두 COMMIT 전까지 메모리에만 머무르므로, 잘못 친 UPDATE·DELETE는 ROLLBACK으로 되돌릴 수 있다. 반대로 같은 \"삭제\"라도 TRUNCATE·DROP은 DDL이라 자동 COMMIT되며 되돌릴 수 없다. 데이터만 비울지·구조까지 없앨지·되돌릴 여지를 둘지를 의식해서 명령을 고른다.\n\n---\n\n## [시험 출제 포인트]\n\n| 함정 | 정답 |\n|---|---|\n| TRUNCATE는 DDL인가 DML인가 | DDL(롤백 불가) |\n| DELETE 후 ROLLBACK 가능? | 가능(DML) |\n| `INSERT INTO ... VALUES`는 한 번에 한 행만? | 일반 INSERT는 1행. INSERT ALL 또는 `INSERT INTO ... SELECT`로 다중행 |\n| `UPDATE ... WHERE` 누락 시 | 모든 행 수정 |\n| MERGE의 두 가지 절 | WHEN MATCHED / WHEN NOT MATCHED |\n| DML 후 자동 커밋? | Oracle은 명시적 COMMIT 필요 |\n\n단골 함정: TRUNCATE와 DELETE의 차이. TRUNCATE는 롤백 불가, AUTO_COMMIT, 빠름.\n\n---\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · DML 5종: **INSERT / UPDATE / DELETE / MERGE / SELECT**\n> · DELETE = **DML** (롤백 O) / TRUNCATE = **DDL** (롤백 X, 자동 COMMIT) / DROP = 테이블 자체 삭제\n> · UPDATE 에 WHERE 누락 = **모든 행 수정** (위험)\n> · MERGE = `WHEN MATCHED THEN UPDATE` + `WHEN NOT MATCHED THEN INSERT` (UPSERT)\n> · INSERT 다중행 = **`INSERT ALL`** 또는 **`INSERT INTO ... SELECT`**\n> · DML 후 Oracle 은 **명시적 COMMIT 필요** (DDL 은 자동)\n\n\n---\n\n---\n\n## 📘 STEP 2. 상세 출제 이론 & 원본 강의 도표·슬라이드 완벽 정복 제3장 제1절. DML (Data Manipulation Language)\n\n#### 1. DML(데이터 조작어)의 개요와 4대 명령어 (`INSERT`, `UPDATE`, `DELETE`, `MERGE`)\n- 테이블에 데이터를 입력(`INSERT`), 수정(`UPDATE`), 삭제(`DELETE`), 병합(`MERGE`), 조회(`SELECT`)하는 명령어이다.\n\n![DML 주요 명령어(INSERT, UPDATE, DELETE, MERGE) 요약표](images/p082_img01.png)\n\n---\n\n#### 2. `INSERT` 문 작성법 2가지와 빈 문자열(`''`)의 DBMS별 차이\n1. **컬럼 리스트를 명시하는 방식**:\n   ```sql\n   INSERT INTO 테이블명 (컬럼1, 컬럼2, ...) VALUES (값1, 값2, ...);\n   ```\n   - `컬럼 리스트`의 순서·개수·데이터 타입과 `VALUES` 절의 값 순서·개수·타입이 1:1로 일치해야 한다.\n   - **명시하지 않은 나머지 컬럼들에는 자동으로 `NULL` 값(또는 테이블 생성 시 지정한 `DEFAULT` 값)이 입력**된다! (단, 생략된 컬럼에 `NOT NULL` 제약조건이 걸려 있고 `DEFAULT` 값도 없다면 에러 발생!)\n2. **컬럼 리스트를 생략하는 방식 (전체 컬럼 입력)**:\n   ```sql\n   INSERT INTO 테이블명 VALUES (전체컬럼값1, 전체컬럼값2, ...);\n   ```\n   - 테이블에 정의된 **모든 컬럼의 순서대로 빠짐없이** 값을 나열해야 한다. 값을 넣지 않을 컬럼 자리에는 명시적으로 `NULL`이나 `''`을 적어야 한다.\n3. **🔥 빈 문자열(`''`) 입력 시 Oracle vs SQL Server 차이 (★단골 출제!)**:\n   - **Oracle**: `INSERT` 시 빈 문자열 **`''`을 입력하면 자동으로 `NULL`로 변환되어 저장**된다! 따라서 조회할 때도 `WHERE COL = ''`이 아니라 **`WHERE COL IS NULL`**로 조회해야 나온다!\n   - **SQL Server**: 빈 문자열 **`''`을 `NULL`이 아닌 길이가 0인 빈 문자열 값 자체로 저장**한다! 따라서 조회할 때 **`WHERE COL = ''`**로 조회해야 나온다!\n\n![INSERT 문 2가지 작성 유형 및 실행 예시 1](images/p082_img02.png)\n\n![INSERT 문 실행 예시 2](images/p082_img03.png)\n\n![INSERT 문 실행 예시 3](images/p082_img04.png)\n\n![INSERT 시 NULL 및 빈 문자열('') 입력 처리 예시 1](images/p083_img01.png)\n\n![서브쿼리를 이용한 다중 행 INSERT (INSERT INTO ... SELECT ...) 예시 2](images/p083_img02.png)\n\n![INSERT 문 제약조건 및 컬럼 매칭 주의사항 3](images/p083_img03.png)\n\n---\n\n#### 3. `UPDATE` 문과 `DELETE` 문, 그리고 DDL vs DML의 내부 처리 차이\n- **`UPDATE` 문**:\n  ```sql\n  UPDATE 테이블명\n     SET 수정할컬럼1 = 새값1, 수정할컬럼2 = 새값2\n   [WHERE 조건절];\n  ```\n  - ⚠️ **`WHERE` 절을 생략하면 테이블의 모든 행(전체 데이터)이 전부 수정**되므로 주의!\n- **`DELETE` 문**:\n  ```sql\n  DELETE [FROM] 테이블명\n   [WHERE 조건절];\n  ```\n  - **`FROM` 키워드는 생략 가능**하다 (`DELETE EMP WHERE ...` 가능!).\n  - **`WHERE` 절을 생략하면 테이블의 모든 행이 삭제**된다. (단, 테이블 구조와 디스크 저장공간(용량)은 그대로 남아있으며 `ROLLBACK` 가능!)\n- **🔥 DML (`INSERT/UPDATE/DELETE`) vs DDL (`CREATE/ALTER/DROP/TRUNCATE`) 처리 방식 차이**:\n  - **DML**: 명령어를 실행하면 디스크의 데이터 파일에 바로 반영되는 것이 아니라 **메모리 버퍼(Buffer)에만 변경사항이 올라가며 Redo/Undo 로그를 기록**한다. 따라서 변경을 확정하려면 **`COMMIT`**을 해야 하고, 취소하려면 **`ROLLBACK`**으로 원상복구할 수 있다! *(단, SQL Server는 기본적으로 DML도 `AUTO COMMIT` 모드이나, `BEGIN TRAN`을 열면 수동 커밋/롤백이 가능함)*\n  - **DDL**: 실행하는 즉시 **자동으로 `AUTO COMMIT`**이 수행되어 디스크에 영구 반영되며 **`ROLLBACK`이 불가능**하다!\n\n![UPDATE 문 기본 문법 및 다중 컬럼 수정 예시 1](images/p083_img04.png)\n\n![UPDATE 문 실행 쿼리 예시 2](images/p083_img05.png)\n\n![서브쿼리를 활용한 UPDATE 문 예시 1](images/p084_img01.png)\n\n![서브쿼리를 활용한 UPDATE 문 예시 2](images/p084_img02.png)\n\n![DELETE 문 기본 구문 및 실행 예시 3](images/p084_img03.png)\n\n![DELETE 문 실행 결과 확인 4](images/p084_img04.png)\n\n---\n\n#### 4. `MERGE` 문 (조건부 입력·수정·삭제 통합 구문) 및 DML 에러 사례\n- **`MERGE` 문의 역할**: 기준 테이블(Target)과 소스 테이블(Source/서브쿼리)을 조인(`ON`)하여, **일치하는 행이 있으면(`WHEN MATCHED THEN`) `UPDATE`(또는 `DELETE` 포함 가능)**를 수행하고, **일치하는 행이 없으면(`WHEN NOT MATCHED THEN`) `INSERT`**를 한 번에 수행하는 명령어이다.\n\n```sql\nMERGE INTO 타겟테이블 T\nUSING 소스테이블 S\n   ON (T.사원번호 = S.사원번호)               -- ★주의: ON 절에 사용된 연결 컬럼(T.사원번호)은 아래 UPDATE SET 절에서 절대 수정할 수 없음!(에러 발생)\n WHEN MATCHED THEN\n      UPDATE SET T.급여 = S.급여, T.부서 = S.부서   -- (주의: UPDATE 키워드 뒤에 테이블명 안 씀!)\n      [DELETE WHERE 조건]                     -- UPDATE 된 결과 행 중 특정 조건 행 즉시 삭제 가능\n WHEN NOT MATCHED THEN\n      INSERT (T.사원번호, T.급여, T.부서)     -- (주의: INSERT 뒤에 INTO 키워드 안 씀!)\n      VALUES (S.사원번호, S.급여, S.부서);\n```\n\n![MERGE 문 기본 문법 및 수행 과정 예시 1](images/p085_img01.png)\n\n![MERGE 문 실행 예시 2](images/p085_img02.png)\n\n![MERGE 문 실행 예시 3](images/p085_img03.png)\n\n![MERGE 문 실행 예시 4](images/p085_img04.png)\n\n![DML 수행 시 발생하는 주요 제약조건 위반 에러 사례 1 (PK 중복, NOT NULL 위반)](images/p086_img01.png)\n\n![DML 수행 시 발생하는 제약조건 위반 에러 사례 2 (FK 참조 무결성 위반 — 부모 없는 자식 INSERT 불가)](images/p086_img02.png)\n\n![DML 수행 시 발생하는 제약조건 위반 에러 사례 3 (자식이 참조 중인 부모 행 DELETE 불가)](images/p086_img03.png)\n\n![DML 수행 시 데이터 타입 및 자리수 초과 에러 사례 4](images/p086_img04.png)"}, {"id": "ch-28", "index": 28, "title": "2-3-2. TCL (Transaction Control Language)", "subj_id": "tab4", "subj_name": "2과목 3장 · 관리 구문", "badge": "2과목 3장 · 관리 구문 (DML/TCL/DDL/DCL)", "md": "# 2-3-2. TCL (Transaction Control Language)\n\n> **단원 분류**: `2과목` > `2-3. 관리 구문` > **`2-3-2. TCL`**\n\n## 💡 STEP 1. 핵심 개념 한눈에 이해하기\n\n> TCL은 트랜잭션을 제어하는 명령어들이다(COMMIT, ROLLBACK, SAVEPOINT).\n\nex) 워드(Word)에서 작성 중인 내용은 메모리에만 있고, 저장 버튼이 COMMIT(영구 반영), CTRL+Z가 ROLLBACK(취소), 임시 저장 지점이 SAVEPOINT(부분 취소)에 해당한다.\n\n---\n\n## [개념 도식화] 트랜잭션의 흐름\n\n| 트랜잭션 진행 흐름 | 명령어 | 실행 결과 및 Lock 상태 |\n| :---: | :---: | :--- |\n| **1. 트랜잭션 시작 & 작업** | `INSERT` / `UPDATE` / `DELETE` | 메모리 버퍼에만 반영된 상태, 변경된 행에 **Lock(잠금)** 설정, 본인만 변경 결과 조회 가능 |\n| **2. 중간 저장점 설정** | `SAVEPOINT sp1;` | 전체 롤백 대신 특정 지점(`sp1`)까지만 부분 롤백(`ROLLBACK TO sp1`)할 수 있도록 북마크 지정 |\n| **3-A. 영구 반영 (성공)** | **`COMMIT;`** | 변경 사항을 디스크 DB에 **영구 저장**, 모든 저장점 소멸, **Lock 해제**, 이전 상태로 롤백 불가 |\n| **3-B. 전체 취소 (실패)** | **`ROLLBACK;`** | 마지막 `COMMIT` 직후(또는 트랜잭션 시작 전) 상태로 **전부 되돌림**, 모든 저장점 소멸, **Lock 해제** |\n\n---\n\n## COMMIT — 영구 반영\n\n**DML** 작업을 묶어서 영구 반영한다.\n\n```sql\nINSERT INTO EMP VALUES (1, '김', 3000);\nUPDATE EMP SET SAL = 4000 WHERE EMP_ID = 1;\nCOMMIT;     -- 위 두 작업을 영구 반영\n```\n\n| COMMIT 후 | 결과 |\n|---|---|\n| 다른 사용자도 변경 사항을 볼 수 있음 | 가능 |\n| ROLLBACK | 불가 |\n| 락(Lock) 해제 | 됨 |\n\n---\n\n## ROLLBACK — 취소\n\n```sql\nINSERT INTO EMP VALUES (1, '김', 3000);\nDELETE FROM EMP WHERE EMP_ID = 999;\nROLLBACK;   -- 위 두 작업 모두 취소\n```\n\n마지막 COMMIT 이후의 모든 DML이 취소된다.\n\n---\n\n## SAVEPOINT — 임시 저장 지점\n\n```sql\nINSERT INTO EMP VALUES (1, '김', 3000);\nSAVEPOINT SP1;\n\nINSERT INTO EMP VALUES (2, '이', 4000);\nSAVEPOINT SP2;\n\nINSERT INTO EMP VALUES (3, '박', 5000);\n\n-- SP2 시점으로 되돌리기 (3번 INSERT만 취소)\nROLLBACK TO SP2;\n```\n\n| 시점 | 상태 |\n|---|---|\n| 시작 | EMP 비어있음 |\n| SP1 | 김 |\n| SP2 | 김, 이 |\n| 마지막 INSERT 후 | 김, 이, 박 |\n| ROLLBACK TO SP2 | 김, 이 |\n\n---\n\n## **트랜잭션**의 ACID\n\n| 성질 | 의미 |\n|---|---|\n| Atomicity (원자성) | 전부 또는 전무 |\n| Consistency (일관성) | 규칙 유지 |\n| Isolation (고립성) | 동시 처리 격리 |\n| Durability (지속성) | COMMIT 후 영구 |\n\n---\n\n## 자동 커밋 vs 명시적 커밋\n\n| 상황 | Oracle | MS-SQL |\n|---|---|---|\n| DML 후 | 수동 COMMIT 필요 | 자동 커밋(설정 따라) |\n| DDL 후 | 자동 COMMIT | 트랜잭션 가능 |\n| 정상 종료 | 자동 COMMIT | — |\n| 비정상 종료 | 자동 ROLLBACK | — |\n\nOracle에서 CREATE, DROP 같은 DDL은 자동 COMMIT된다.\n\n---\n\n## [SQL 실전]\n\n```sql\n-- 트랜잭션 1: 정상 처리\nINSERT INTO ACCOUNT VALUES (101, 'A', 10000);\nINSERT INTO ACCOUNT VALUES (102, 'B', 5000);\nCOMMIT;     -- 둘 다 저장\n\n-- 트랜잭션 2: 중간 오류\nUPDATE ACCOUNT SET BALANCE = BALANCE - 1000 WHERE ID = 101;\nSAVEPOINT BEFORE_DEPOSIT;\n\nUPDATE ACCOUNT SET BALANCE = BALANCE + 1000 WHERE ID = 999;  -- 존재 X\n\n-- 부분 취소 후 다른 처리\nROLLBACK TO BEFORE_DEPOSIT;\nUPDATE ACCOUNT SET BALANCE = BALANCE + 1000 WHERE ID = 102;\nCOMMIT;\n```\n\n---\n\n## [Before & After] SAVEPOINT 동작\n\n비어있는 EMP에 김·이·박을 차례로 INSERT하면서 SP1, SP2 두 지점을 찍어 둔다. 마지막에 `ROLLBACK TO SP1`을 걸면 어디까지 살아남는지, 그 뒤 COMMIT까지 어떻게 이어지는지를 시점별로 추적한다.\n\n### EMP\n\n| EMP_ID | NAME |\n|---|---|\n| (비어있음) | |\n\n### 작업 시나리오\n\n```sql\nINSERT INTO EMP VALUES (1, '김');\nSAVEPOINT SP1;\nINSERT INTO EMP VALUES (2, '이');\nSAVEPOINT SP2;\nINSERT INTO EMP VALUES (3, '박');\nROLLBACK TO SP1;\nCOMMIT;\n```\n\n### 시점별 상태\n\n| 시점 | 데이터 |\n|---|---|\n| 첫 INSERT 후 | 김 |\n| SP1 | 김 |\n| 둘째 INSERT 후 | 김, 이 |\n| SP2 | 김, 이 |\n| 셋째 INSERT 후 | 김, 이, 박 |\n| ROLLBACK TO SP1 | 김 |\n| COMMIT | 김 |\n\n`ROLLBACK TO SP1`은 SP1 이후의 DML(이·박 INSERT)만 취소하고 그 이전 작업은 그대로 둔다. 그래서 최종 COMMIT 시점에는 김 한 행만 남는다. 트랜잭션 도중 일부만 되돌리고 싶을 때는 SAVEPOINT로 안전 지점을 찍어둔다. 단, 전체 ROLLBACK이나 COMMIT이 일어나면 SAVEPOINT는 모두 사라진다.\n\n---\n\n## 트랜잭션 격리 수준 (참고)\n\n| 수준 | 설명 |\n|---|---|\n| READ UNCOMMITTED | 커밋 안 된 것도 읽음 |\n| READ COMMITTED | 커밋된 것만(Oracle 기본) |\n| REPEATABLE READ | 같은 쿼리는 같은 결과 |\n| SERIALIZABLE | 완전 격리(가장 엄격) |\n\n---\n\n## [시험 출제 포인트]\n\n| 함정 | 정답 |\n|---|---|\n| TCL 명령어 종류 | COMMIT / ROLLBACK / SAVEPOINT |\n| DDL 실행 후 | Oracle은 자동 COMMIT |\n| ROLLBACK의 범위 | 마지막 COMMIT 이후 모든 DML |\n| SAVEPOINT의 의미 | 부분 ROLLBACK 가능 지점 |\n| ROLLBACK TO SP1 후 SP1 이전 작업 | 유지 |\n| ROLLBACK 후 SAVEPOINT는 | 모두 사라짐 |\n| 비정상 종료 시 | 자동 ROLLBACK |\n\n단골 함정: \"DDL 실행 후 ROLLBACK으로 취소 가능\"은 틀렸다. Oracle에서 DDL은 자동 COMMIT이다.\n\n---\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · TCL 3종: **COMMIT / ROLLBACK / SAVEPOINT**\n> · COMMIT = 영구 반영 + 락 해제 + 다른 사용자도 변경 사항 조회 가능\n> · ROLLBACK = **마지막 COMMIT 이후** 모든 DML 취소 (SAVEPOINT 도 함께 사라짐)\n> · ROLLBACK TO sp = **부분 취소** (sp 이전 작업은 유지)\n> · DDL 실행 = **자동 COMMIT** (롤백 불가)\n> · 비정상 종료 = **자동 ROLLBACK** / 정상 종료 = 자동 COMMIT\n> · Oracle 기본 격리 수준 = **READ COMMITTED**\n\n\n---\n\n---\n\n## 📘 STEP 2. 상세 출제 이론 & 원본 강의 도표·슬라이드 완벽 정복 제3장 제2절. TCL (Transaction Control Language)\n\n#### 1. 트랜잭션(Transaction)의 정의와 4대 특성 (`ACID`) (★100% 출제!)\n- **트랜잭션의 정의**: 데이터베이스의 논리적 연산단위 (밀접히 관련되어 분리될 수 없는 한 개 이상의 데이터베이스 조작).\n- **트랜잭션의 4가지 특성 (`\"원·일·고·지\"` / `ACID`)**:\n\n| 특성 | 영문명 | 핵심 정의 (객관식 보기 판별 키워드) |\n| :---: | :---: | :--- |\n| **1. 원자성** | **Atomicity** | 트랜잭션에서 정의된 연산들은 **모두 성공적으로 실행되던지 아니면 전혀 실행되지 않은 상태로 남아있어야 한다 (`All or Nothing`)**. |\n| **2. 일관성** | **Consistency** | 트랜잭션이 실행되기 전의 데이터베이스 내용이 잘못되어 있지 않다면 **트랜잭션이 실행된 이후에도 데이터베이스의 내용에 잘못이 있으면 안 된다** (제약조건, 합계 일치 등 정합성 유지). |\n| **3. 고립성<br>(격리성)** | **Isolation** | 트랜잭션이 실행되는 도중에 **다른 트랜잭션의 영향을 받아 잘못된 결과를 만들어서는 안 된다**. |\n| **4. 지속성<br>(영속성)** | **Durability** | 트랜잭션이 일단 성공적으로 수행되면(`COMMIT` 완료 시) **그 트랜잭션이 갱신한 데이터베이스의 내용은 영구적으로 저장**된다. |\n\n![트랜잭션의 4대 특성 (원자성, 일관성, 고립성, 지속성) 요약표](images/p087_img01.png)\n\n#### 2. 트랜잭션 격리성(Isolation)이 낮을 때 발생하는 3대 문제점\n> 💡 **[핵심 필수 암기]**\n> **동시성 제어 3대 이상 현상 구분 (`\"더·논·팬\"`)**:\n> 1. **Dirty Read (오손 읽기)**: 다른 트랜잭션에 의해 **수정되었고 아직 커밋되지 않은(`Uncommitted`) 데이터**를 읽는 것. (만약 그 트랜잭션이 롤백되면 잘못된 데이터를 읽은 셈이 됨!)\n> 2. **Non-Repeatable Read (반복 불가능 읽기)**: 한 트랜잭션 내에서 같은 쿼리를 두 번 수행했는데, 그 사이에 다른 트랜잭션이 값을 **수정(`UPDATE`) 또는 삭제(`DELETE`)하고 커밋**하여 **두 쿼리의 결과가 다르게 나타나는 현상**.\n> 3. **Phantom Read (유령 데이터 읽기)**: 한 트랜잭션 내에서 같은 범위 쿼리를 두 번 수행했는데, 그 사이에 다른 트랜잭션이 **새로운 행을 삽입(`INSERT`)하고 커밋**하여 첫 번째 쿼리에서 **없던 유령(Phantom) 레코드가 두 번째 쿼리에서 새로 나타나는 현상**.\n\n---\n\n#### 3. `COMMIT`, `ROLLBACK`, `SAVEPOINT`의 동작 원리와 주의사항\n\n1. **`COMMIT` (변경사항 영구 반영)**:\n   - 입력/수정/삭제한 자료에 대해서 전혀 문제가 없다고 판단되었을 경우 `COMMIT` 명령어를 통해서 트랜잭션을 완료한다.\n   - **🔥 Oracle에서 자동으로 `COMMIT`이 일어나는 경우 (★초빈출 함정!)**:\n     - **`DDL` 문 (`CREATE`, `ALTER`, `DROP`, `TRUNCATE`, `RENAME`)이나 `DCL` 문 (`GRANT`, `REVOKE`)을 실행하면, 그 이전에 수행했던 아직 커밋 안 된 모든 DML 문장들까지 자동으로 함께 `AUTO COMMIT` 되어버린다!** (이후 `ROLLBACK`을 해도 이미 DDL 시점에 커밋되었으므로 절대 되돌릴 수 없다!)\n     - SQL*Plus 등을 **정상 종료(`EXIT`)**하면 자동 `COMMIT` 되고, 정전이나 강제 종료 등으로 **비정상 종료**되면 자동 `ROLLBACK` 된다.\n\n2. **`ROLLBACK` (변경사항 취소)**:\n   - 테이블 내 입력한 데이터나 수정한 데이터, 삭제한 데이터에 대하여 `COMMIT` 이전에는 변경 사항을 취소할 수 있다.\n   - 전체 `ROLLBACK`을 실행하면 **직전 `COMMIT` 한 지점(또는 트랜잭션 시작 시점)**까지 모든 DML 변경사항이 취소되고, 걸려 있던 행 잠금(Lock)이 해제된다.\n\n3. **`SAVEPOINT` (저장점, 부분 롤백)**:\n   - 저장점(`SAVEPOINT`)을 정의하면 롤백할 때 트랜잭션에 포함된 전체 작업을 롤백하는 것이 아니라 **현 시점에서 해당 `SAVEPOINT`까지만 트랜잭션의 일부를 롤백**할 수 있다!\n   - **문법 차이**:\n     - **Oracle**: `SAVEPOINT SV1;` ➔ **`ROLLBACK TO SV1;`**\n     - **SQL Server**: `SAVE TRANSACTION SV1;` (또는 `SAVE TRAN SV1`) ➔ **`ROLLBACK TRANSACTION SV1;`** (또는 `ROLLBACK TRAN SV1`)\n   - **🚨 `SAVEPOINT` 절대 함정 2가지 (★시험에서 행 개수 계산할 때 100% 출제!)**:\n     1. **과거로 돌아가면 미래의 세이브포인트는 소멸된다!**:\n        - 시간 순서대로 `SAVEPOINT A` ➔ (작업) ➔ `SAVEPOINT B`를 만든 상태에서, 먼저 **`ROLLBACK TO A;`를 실행하여 과거(`A`)로 돌아가 버리면, 그 이후에 만들었던 `SAVEPOINT B`는 메모리에서 사라진다!** 따라서 그 직후에 `ROLLBACK TO B;`를 실행하면 **에러가 발생**한다! (반대로 `ROLLBACK TO B`를 먼저 하고 그 다음에 `ROLLBACK TO A`를 하는 것은 가능!)\n     2. **중간에 `COMMIT`이나 `DDL`(`CREATE`, `ALTER` 등)이 실행되면 모든 `SAVEPOINT`가 초기화(소멸)된다!**:\n        - 트랜잭션이 종료되었으므로 이전의 `SAVEPOINT`로 `ROLLBACK TO`를 시도하면 에러가 나며 데이터도 되돌아가지 않는다!\n\n![COMMIT과 ROLLBACK 수행 전후 데이터 상태 예시](images/p087_img02.png)\n\n![트랜잭션 진행 중 타 세션(사용자)에서 조회되는 데이터와 Lock(잠금) 상태 도식](images/p088_img01.png)\n\n![SAVEPOINT 설정 및 부분 롤백(ROLLBACK TO) 타임라인 도식 1](images/p089_img01.png)\n\n![SAVEPOINT A -> B 설정 후 ROLLBACK 순서에 따른 유효성 비교 도식 2](images/p089_img02.png)\n\n![SAVEPOINT 단계별 DML 실행 및 최종 테이블 결과 추적 예제 3](images/p089_img03.png)"}, {"id": "ch-29", "index": 29, "title": "2-3-3. DDL (Data Definition Language)", "subj_id": "tab4", "subj_name": "2과목 3장 · 관리 구문", "badge": "2과목 3장 · 관리 구문 (DML/TCL/DDL/DCL)", "md": "# 2-3-3. DDL (Data Definition Language)\n\n> **단원 분류**: `2과목` > `2-3. 관리 구문` > **`2-3-3. DDL`**\n\n## 💡 STEP 1. 핵심 개념 한눈에 이해하기\n\n> DDL은 테이블·뷰·인덱스 같은 객체를 만들고 바꾸고 지우는 명령어들이다(CREATE, ALTER, DROP, TRUNCATE, RENAME).\n\n---\n\n## [개념 도식화] DDL 명령 5종\n\n| DDL (데이터 정의어) 5대 명령어 | 역할 및 핵심 특징 (★Oracle에서는 실행 즉시 `AUTO COMMIT`!) |\n| :---: | :--- |\n| **`CREATE TABLE / VIEW / INDEX`** | 새로운 데이터베이스 객체 생성 |\n| **`ALTER TABLE`** | 컬럼 추가(`ADD`), 컬럼 속성 변경(`MODIFY` / `ALTER COLUMN`), 컬럼 삭제(`DROP COLUMN`), 제약조건 추가/삭제 |\n| **`DROP TABLE`** | 테이블의 **데이터와 구조(존재 자체)를 아예 삭제** (`ROLLBACK` 절대 불가, 용량 완전 반환) |\n| **`TRUNCATE TABLE`** | 테이블의 **구조(껍데기)는 남기고 전체 데이터만 즉시 초기화** (`ROLLBACK` 절대 불가, 용량 초기화됨) |\n| **`RENAME 기존명 TO 새이름`** | 테이블 등 객체의 이름을 변경 |\n\n| 명령 | 의미 |\n|---|---|\n| CREATE | 객체(테이블/뷰/인덱스) 생성 |\n| ALTER | 객체 구조 변경 |\n| DROP | 객체 삭제 |\n| TRUNCATE | 데이터만 비움(구조 유지) |\n| RENAME | 이름 변경 |\n\nDDL은 자동 COMMIT된다. 실행 즉시 영구 반영되며 ROLLBACK 불가.\n\n---\n\n## [SQL 실전]\n\n## CREATE — 객체 생성\n\n```sql\nCREATE TABLE EMP (\n    EMP_ID    NUMBER       PRIMARY KEY,\n    NAME      VARCHAR2(50) NOT NULL,\n    SAL       NUMBER       DEFAULT 0,\n    DEPT_ID   VARCHAR2(10),\n    HIRE_DATE DATE         DEFAULT SYSDATE,\n    CONSTRAINT FK_EMP_DEPT FOREIGN KEY (DEPT_ID) REFERENCES DEPT(DEPT_ID)\n);\n-- Table created.\n```\n\n### 테이블 명명 규칙\n\n| 규칙 | 설명 |\n|---|---|\n| 영문/숫자/`_`만 | 한글, 특수문자 불가 |\n| 첫 글자는 영문 | 숫자로 시작 불가 |\n| 예약어 사용 불가 | SELECT, FROM 등 |\n| 길이 30바이트 이내 | (Oracle 기준) |\n| 동일 사용자 내 중복 불가 | — |\n\n---\n\n## 제약조건(Constraints)\n\n| 제약 | 의미 | 예 |\n|---|---|---|\n| PRIMARY KEY | 기본키(UNIQUE + NOT NULL), **식별자** 역할 | EMP_ID |\n| FOREIGN KEY | 외래키 | DEPT_ID 참조 |\n| UNIQUE | 중복 불가(**NULL** 허용) | EMAIL |\n| NOT NULL | NULL 불가 | NAME |\n| CHECK | 조건 만족 | CHECK (SAL > 0) |\n| DEFAULT | 기본값 | DEFAULT 0 |\n\n### PK vs UNIQUE\n\n| 비교 | PRIMARY KEY | UNIQUE |\n|---|---|---|\n| 중복 | 불가 | 불가 |\n| NULL | 불가 | 허용 |\n| 테이블당 개수 | 1개 | 여러 개 |\n\n### FK 옵션\n\n```sql\nFOREIGN KEY (DEPT_ID) REFERENCES DEPT(DEPT_ID)\n    ON DELETE CASCADE       -- 부모 삭제 시 자식도 삭제\n    ON DELETE SET NULL      -- 부모 삭제 시 자식 FK NULL\n```\n\n---\n\n## ALTER — 구조 변경\n\n```sql\n-- 컬럼 추가\nALTER TABLE EMP ADD (PHONE VARCHAR2(20));\n-- Table altered.\n\n-- 컬럼 변경\nALTER TABLE EMP MODIFY (PHONE VARCHAR2(30));\n-- Table altered.\n\n-- 컬럼 이름 변경\nALTER TABLE EMP RENAME COLUMN PHONE TO MOBILE;\n-- Table altered.\n\n-- 컬럼 삭제\nALTER TABLE EMP DROP COLUMN MOBILE;\n-- Table altered.\n\n-- 제약조건 추가/삭제\nALTER TABLE EMP ADD CONSTRAINT UQ_NAME UNIQUE (NAME);\nALTER TABLE EMP DROP CONSTRAINT UQ_NAME;\n-- Table altered.\n```\n\n---\n\n## DROP — 객체 삭제\n\n```sql\nDROP TABLE EMP;                  -- 테이블 자체 삭제\nDROP TABLE EMP CASCADE CONSTRAINTS;  -- 참조 제약까지 함께\nDROP TABLE EMP PURGE;            -- 휴지통도 비움(복구 불가)\n-- Table dropped.\n```\n\n---\n\n## TRUNCATE — 데이터만 비우기\n\n```sql\nTRUNCATE TABLE EMP;\n-- Table truncated.\n```\n\n| TRUNCATE 특징 | 설명 |\n|---|---|\n| 데이터 모두 삭제 | 됨 |\n| 테이블 구조 | 유지 |\n| 롤백 | 불가 |\n| 속도 | 매우 빠름 |\n\n---\n\n## RENAME — 이름 변경\n\n```sql\nRENAME EMP TO EMPLOYEE;\nALTER TABLE EMP RENAME TO EMPLOYEE;  -- 동일\n-- Table renamed.\n```\n\n---\n\n## DELETE vs TRUNCATE vs DROP\n\n| 비교 | DELETE | TRUNCATE | DROP |\n|---|---|---|---|\n| 분류 | **DML** | DDL | DDL |\n| 데이터 | 삭제 | 모두 삭제 | 삭제 |\n| 구조 | 유지 | 유지 | 삭제 |\n| ROLLBACK | 가능 | 불가 | 불가 |\n| WHERE | 가능 | 불가 | — |\n| 속도 | 느림 | 빠름 | 매우 빠름 |\n| 자동 COMMIT | 없음 | 있음 | 있음 |\n\n---\n\n## VIEW (뷰)\n\n```sql\nCREATE VIEW V_EMP_HIGH AS\nSELECT NAME, SAL FROM EMP WHERE SAL > 5000;\n\nSELECT * FROM V_EMP_HIGH;     -- 사용\nDROP VIEW V_EMP_HIGH;\n```\n\n| 뷰의 장점 | |\n|---|---|\n| 복잡한 쿼리를 간단한 이름으로 | 됨 |\n| 보안(특정 컬럼/행만 노출 — **DCL**과 함께 권한 통제) | 됨 |\n| 실제 테이블 아님(가상) | 됨 |\n\n---\n\n## 인덱스(INDEX)\n\n```sql\nCREATE INDEX IDX_EMP_NAME ON EMP(NAME);\n-- Index created.\nDROP INDEX IDX_EMP_NAME;\n-- Index dropped.\n```\n\n도서관의 목차 같은 역할이다. 검색 속도는 빨라지지만 입력·수정 속도는 느려질 수 있다.\n\n---\n\n## [Before & After]\n\nEMP_ID(PK)·NAME(NOT NULL)·SAL(DEFAULT 0)을 가진 EMP 테이블을 만들고, PHONE 컬럼을 더한 뒤, 같은 테이블에 TRUNCATE와 DROP을 차례로 적용한다. 데이터·구조·테이블 자체가 어느 명령에서 사라지는지를 비교한다.\n\n### CREATE 후\n\n```\nEMP\n─────────\nEMP_ID (PK)\nNAME (NOT NULL)\nSAL (DEFAULT 0)\n```\n\n### `ALTER TABLE EMP ADD (PHONE VARCHAR2(20))` 후\n\n```\nEMP\n─────────\nEMP_ID (PK)\nNAME (NOT NULL)\nSAL (DEFAULT 0)\nPHONE      (추가됨)\n```\n\n### `TRUNCATE TABLE EMP` 후\n\n```\nEMP (구조 유지, 데이터 0행)\n─────────\nEMP_ID (PK)\nNAME\nSAL\nPHONE\n```\n\n### `DROP TABLE EMP` 후\n\n```\n(테이블 자체가 사라짐)\n```\n\nALTER는 컬럼을 추가해 구조를 키우고, TRUNCATE는 데이터만 비우되 컬럼 정의(EMP_ID·NAME·SAL·PHONE)는 그대로 남기며, DROP은 테이블 객체 자체를 지운다. 셋 다 DDL이라 실행 즉시 자동 COMMIT되어 ROLLBACK으로 되돌릴 수 없다. \"데이터만 비우고 싶다 → TRUNCATE\", \"테이블 자체가 필요 없다 → DROP\", \"구조만 바꾼다 → ALTER\" 식으로 의도와 명령을 정확히 매칭한다.\n\n---\n\n## [시험 출제 포인트]\n\n| 함정 | 정답 |\n|---|---|\n| TRUNCATE 분류 | DDL |\n| DDL 실행 후 ROLLBACK 가능? | 불가(자동 COMMIT) |\n| PRIMARY KEY는 NULL 허용? | 불허 |\n| UNIQUE는 NULL 허용? | 허용 |\n| 한 테이블에 PK는 몇 개? | 1개 |\n| FK가 참조하는 컬럼 조건 | PK 또는 UNIQUE |\n| CHECK 제약 예 | `CHECK (SAL > 0)` |\n| ON DELETE CASCADE | 부모 삭제 시 자식도 삭제 |\n| `ALTER TABLE ... DROP COLUMN`은 ROLLBACK 가능? | 불가 |\n\n단골 함정: TRUNCATE는 DDL이지만 데이터만 삭제(구조 유지)된다. DROP은 테이블 자체를 삭제한다.\n\n---\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · DDL 5종: **CREATE / ALTER / DROP / TRUNCATE / RENAME** — 모두 **자동 COMMIT** (롤백 불가)\n> · 제약 6종: **PK / FK / UNIQUE / NOT NULL / CHECK / DEFAULT**\n> · PK = **UNIQUE + NOT NULL** / 테이블당 1개 / FK 가 참조하는 컬럼은 PK 또는 UNIQUE\n> · UNIQUE = **NULL 허용** (중복만 막음)\n> · DELETE / TRUNCATE / DROP — **데이터·구조·롤백** 차이 (가장 단골 함정)\n> · ON DELETE CASCADE = 부모 삭제 시 자식도 자동 삭제\n> · 컬럼 추가 = `ALTER TABLE ADD` / 변경 = `MODIFY` / 삭제 = `DROP COLUMN`\n\n\n---\n\n---\n\n## 📘 STEP 2. 상세 출제 이론 & 원본 강의 도표·슬라이드 완벽 정복 제3장 제3절. DDL (Data Definition Language) 및 기타 객체\n\n#### 1. 데이터 타입: `CHAR` vs `VARCHAR2` 비교 (★단골 출제!)\n\n| 데이터 타입 | 의미 | 저장 방식 및 공백 채움 | 동등 비교 (`=`) 시 규칙 |\n| :--- | :--- | :--- | :--- |\n| **`CHAR(길이)`** | **고정 길이** 문자열 | 지정한 길이보다 짧은 문자열이 들어오면 **남는 공간을 공백(`' '`)으로 채워서(Padding)** 고정된 크기로 저장! | 끝에 붙은 **공백의 개수만 다르면 서로 같은 값(`TRUE`)으로 판정**! (`'AA' = 'AA   '` ➔ **참!**) |\n| **`VARCHAR2(길이)`** *(Oracle)*<br>**`VARCHAR(길이)`** *(SQL Server)* | **가변 길이** 문자열 | 실제 입력된 문자열의 길이만큼만 저장 공간을 할당하고 **남는 공간을 공백으로 채우지 않음!** | 공백도 엄연한 하나의 문자로 취급하므로 **공백 개수가 다르면 다른 값(`FALSE`)으로 판정**! (`'AA' = 'AA   '` ➔ **거짓!**)<br>*(따라서 `CHAR` 컬럼과 `VARCHAR2` 컬럼을 조인/비교할 때는 `TRIM`이 필요할 수 있음!)* |\n| **`NUMBER(P, S)`** | 가변 숫자형 | `P`(전체 유효 자릿수 Precision), `S`(소수점 이하 자릿수 Scale). 예: `NUMBER(8, 2)`는 전체 8자리 중 정수부 6자리, 소수부 2자리. | |\n| **`DATE` / `DATETIME`** | 날짜 및 시간형 | 연, 월, 일, 시, 분, 초 저장 | |\n\n![주요 데이터 타입(CHAR, VARCHAR2, NUMBER, DATE) 요약표](images/p090_img01.png)\n\n---\n\n#### 2. `CREATE TABLE` 규칙과 5대 제약조건 (Constraints), 참조 무결성 옵션\n- **테이블 및 칼럼 명명(Naming) 규칙 (★객관식 선지 단골!)**:\n  1. 반드시 **문자로 시작**해야 한다 (**숫자로 시작할 수 없다!** 단, 중간이나 끝에 숫자가 들어가는 것은 가능).\n  2. 알파벳(`A-Z`, `a-z`), 숫자, 그리고 특수문자는 **`_` (언더바), `$` (달러), `#` (샵) 딱 3가지만 허용**된다! (공백이나 `-` 하이픈 등은 사용 불가!)\n  3. 한 계정(스키마) 내에서 다른 테이블/객체와 이름이 중복될 수 없으며, 한 테이블 내에서 컬럼명이 중복될 수 없다.\n  4. SQL 예약어(`SELECT`, `TABLE`, `WHERE` 등)는 이름으로 사용할 수 없다.\n\n- **5대 제약조건 (Constraints) 특징 비교**:\n  1. **`PRIMARY KEY` (기본키)**: **`UNIQUE` + `NOT NULL`**. 테이블당 **단 1개만** 생성 가능(여러 컬럼을 묶어 1개의 복합 PK로 만드는 것은 가능!). 생성 시 자동으로 고유 인덱스(Unique Index) 생성.\n  2. **`UNIQUE KEY` (고유키)**: 중복된 값을 허용하지 않으나, **`NULL` 값은 여러 개 입력 가능**하다! (테이블에 여러 개 생성 가능)\n  3. **`NOT NULL`**: `NULL` 값 입력을 금지함. (주의: 테이블 레벨 방식으로는 정의할 수 없고 **컬럼 정의 옆에 쓰는 '컬럼 레벨' 방식으로만 정의 가능**!)\n  4. **`CHECK`**: 입력될 수 있는 값의 범위나 조건을 제한 (`CHECK (SAL > 0)`). *(단, 조건식이 `UNKNOWN` 즉 **`NULL`이 들어오면 `CHECK` 제약조건 위반으로 보지 않고 통과(허용)**시킨다!)*\n  5. **`FOREIGN KEY` (외래키)**: 부모 테이블의 `PK` 또는 `UNIQUE` 컬럼을 참조하며, 테이블당 여러 개 생성 가능하고 **`NULL` 값도 가질 수 있다**.\n\n- **외래키(FK) 참조 무결성 옵션 (부모 행 삭제 `ON DELETE` / 수정 시 자식 처리 방식)**:\n  - **`CASCADE`**: 부모 데이터 삭제 시 **자식 테이블의 관련 행들도 연쇄적으로 자동 삭제**!\n  - **`SET NULL`**: 부모 데이터 삭제 시 **자식 테이블의 FK 컬럼 값을 `NULL`로 변경**! (단, 자식 FK 컬럼이 `NOT NULL`이면 불가능)\n  - **`SET DEFAULT`**: 부모 데이터 삭제 시 자식 FK 값을 기본값(`DEFAULT`)으로 변경.\n  - **`RESTRICT` / `NO ACTION` (기본값)**: 자식 테이블에 참조하고 있는 행이 존재하면 **부모 데이터의 삭제를 거부(에러 발생)**!\n  - *(참고: 자식 테이블에 새 행을 `INSERT` 할 때 부모 테이블에 없는 키 값을 넣으려고 할 때의 옵션으로는 **`AUTOMATIC`**(부모 테이블에 자동으로 먼저 PK 생성 후 자식 삽입)과 **`DEPENDENT`**(부모에 있을 때만 삽입 허용, 기본값)가 있다.)*\n\n- **`CREATE TABLE 테이블명 AS SELECT ...` (CTAS, 서브쿼리로 테이블 복사 생성)**:\n  - ⚠️ **초특급 시험 포인트**: CTAS로 테이블을 복사 생성하면 기존 테이블의 구조(컬럼명, 데이터 타입)와 데이터는 그대로 복사되지만, **`PK`, `UNIQUE`, `FK`, `CHECK`, `DEFAULT` 등 모든 제약조건은 사라지고 오직 `NOT NULL` 제약조건 딱 하나만 복사된다!** (따라서 PK 등이 필요하면 생성 후 `ALTER TABLE`로 다시 추가해야 함!)\n\n![제약조건의 종류(PK, UK, NOT NULL, CHECK, FK) 요약표](images/p091_img01.png)\n\n![참조 무결성 옵션 (Delete/Modify Action 및 Insert Action) 표](images/p091_img02.png)\n\n![CREATE TABLE 구문 (컬럼 레벨 및 테이블 레벨 제약조건 정의) 예시 1](images/p091_img03.png)\n\n![DESC 명령어로 생성된 테이블 구조 확인 2](images/p091_img04.png)\n\n![SQL Server의 CREATE TABLE 구문 예시 1](images/p092_img01.png)\n\n![DEFAULT 기본값 옵션 지정 예시 2](images/p092_img02.png)\n\n![제약조건 위배 시 에러 확인 예시 3](images/p092_img03.png)\n\n![CTAS (CREATE TABLE AS SELECT) 테이블 복사 생성 예시 4](images/p092_img04.png)\n\n![CTAS 생성 결과 (NOT NULL 제약조건만 유지됨!) 확인 5](images/p092_img05.png)\n\n---\n\n#### 3. `ALTER TABLE` (테이블 구조 변경) Oracle vs SQL Server 문법 비교 (★빈출!)\n\n> 💡 **[핵심 필수 암기]**\n> **Oracle과 SQL Server의 `ALTER TABLE` 문법 차이 (객관식 문법 정오 판별 단골!)**\n\n| 변경 작업 | Oracle (오라클) 문법 | SQL Server (MSSQL) 문법 | 주의사항 |\n| :---: | :--- | :--- | :--- |\n| **1. 컬럼 추가 (`ADD`)** | `ALTER TABLE 테이블명` **`ADD (컬럼명 타입)`**;<br>*(괄호 사용 가능, **`COLUMN` 키워드 안 씀!**)* | `ALTER TABLE 테이블명` **`ADD 컬럼명 타입`**; | 새로 추가된 컬럼은 테이블의 **맨 마지막 열**에 위치하며(중간 위치 지정 불가!), 기존 행들의 값은 `NULL`로 채워짐. |\n| **2. 컬럼 삭제 (`DROP`)** | `ALTER TABLE 테이블명` **`DROP COLUMN 컬럼명`**; | `ALTER TABLE 테이블명` **`DROP COLUMN 컬럼명`**; | 데이터가 있든 없든 즉시 삭제되며 **롤백(복구) 불가!** 테이블에 최소 1개의 컬럼은 남아있어야 함 (모두 삭제 불가). |\n| **3. 컬럼 타입/길이/NOT NULL 변경** | `ALTER TABLE 테이블명` **`MODIFY (컬럼명 타입 [DEFAULT 값] [NOT NULL])`**; | `ALTER TABLE 테이블명` **`ALTER COLUMN 컬럼명 타입 [NOT NULL]`**;<br>*(주의: SQL Server는 **괄호를 쓰지 않으며**, 여러 컬럼을 동시에 변경할 수 없고, `DEFAULT` 제약조건 변경 시 별도 구문 필요!)* | - 컬럼 크기를 **늘리는 것은 항상 가능**하지만, **줄이는 것은 해당 컬럼의 모든 값이 `NULL`이거나 줄이려는 크기보다 작을 때만** 가능!<br>- 데이터 타입 변경은 해당 컬럼의 **모든 값이 `NULL`일 때만** 가능!<br>- `NOT NULL` 추가는 기존 행에 `NULL`이 하나도 없을 때만 가능!<br>- **`DEFAULT` 값을 변경하면 변경 이후에 `INSERT` 되는 행부터만 적용**되며 기존 행의 값은 바뀌지 않음! |\n| **4. 컬럼 이름 변경 (`RENAME`)** | `ALTER TABLE 테이블명` **`RENAME COLUMN 기존컬럼명 TO 새컬럼명`**; | **`sp_rename '테이블명.기존컬럼명', '새컬럼명', 'COLUMN'`* | |\n| **5. 제약조건 삭제 / 추가** | - 삭제: `ALTER TABLE 테이블명` **`DROP CONSTRAINT 제약조건명`**;<br>- 추가: `ALTER TABLE 테이블명` **`ADD CONSTRAINT 제약조건명 PRIMARY KEY (컬럼)`**; | Oracle과 동일! | |\n\n![ALTER TABLE ADD 컬럼 추가 구문 및 예시 1](images/p093_img01.png)\n\n![ALTER TABLE ADD 실행 결과 확인 2](images/p093_img02.png)\n\n![ALTER TABLE DROP COLUMN 컬럼 삭제 구문 3](images/p093_img03.png)\n\n![ALTER TABLE DROP COLUMN 실행 결과 4](images/p093_img04.png)\n\n![ALTER TABLE MODIFY / ALTER COLUMN 구문 5](images/p093_img05.png)\n\n![ALTER TABLE MODIFY로 컬럼 길이 및 NOT NULL 변경 예시 6](images/p093_img06.png)\n\n![ALTER TABLE RENAME COLUMN 컬럼명 변경 구문 7](images/p093_img07.png)\n\n![ALTER TABLE RENAME COLUMN 실행 예시 1](images/p094_img01.png)\n\n![ALTER TABLE DROP CONSTRAINT 제약조건 삭제 예시 2](images/p094_img02.png)\n\n![ALTER TABLE ADD CONSTRAINT 제약조건 추가 예시 3](images/p094_img03.png)\n\n![ALTER TABLE ADD CONSTRAINT로 FK 추가 후 구조 확인 4](images/p094_img04.png)\n\n![RENAME 테이블명 변경 구문 예시 1](images/p095_img01.png)\n\n![ON DELETE CASCADE 옵션이 적용된 테이블 생성 및 부모 삭제 테스트 2](images/p095_img02.png)\n\n![ON DELETE CASCADE 수행 결과 자식 행까지 연쇄 삭제된 모습 3](images/p095_img03.png)\n\n---\n\n#### 4. `RENAME`, `DROP TABLE`, `TRUNCATE TABLE` 및 **`DELETE` vs `TRUNCATE` vs `DROP` 완벽 비교**\n- **테이블 이름 변경 (`RENAME`)**:\n  - Oracle: **`RENAME 기존테이블명 TO 새테이블명;`** (또는 `ALTER TABLE 기존테이블명 RENAME TO 새테이블명;`)\n  - SQL Server: **`sp_rename '기존테이블명', '새테이블명';`**\n- **`DROP TABLE 테이블명 [CASCADE CONSTRAINTS];`**:\n  - 테이블의 모든 데이터뿐만 아니라 **테이블의 구조(스키마 정의) 자체를 완전히 삭제**한다.\n  - 다른(자식) 테이블에서 이 테이블의 PK를 외래키(FK)로 참조하고 있는 경우 그냥 `DROP TABLE`을 하면 에러가 발생하는데, 뒤에 **`CASCADE CONSTRAINTS`** 옵션을 붙이면 **자식 테이블에 걸려 있던 참조 제약조건(FK)까지 먼저 자동으로 끊어버린 뒤 부모 테이블을 삭제**한다! *(단, SQL Server에는 `CASCADE CONSTRAINTS` 옵션이 없으므로 자식 테이블의 FK 제약조건이나 자식 테이블을 먼저 삭제해야만 부모 테이블을 `DROP`할 수 있다!)*\n- **`TRUNCATE TABLE 테이블명;`**:\n  - 테이블 구조는 그대로 남기고 **모든 행(데이터)을 한 번에 영구 삭제**하며, 테이블이 사용하던 **디스크 저장 공간(용량)까지 초기 상태로 반환(해제)**한다! (DDL이므로 즉시 `AUTO COMMIT` 되어 **절대 `ROLLBACK` 불가**!)\n\n> 💡 **[핵심 필수 암기]**\n> **🔥 시험 출제율 100%! `DELETE` vs `TRUNCATE` vs `DROP` 3대 삭제 명령어 완벽 비교표**\n\n| 비교 항목 | `DELETE [FROM] 테이블명` | `TRUNCATE TABLE 테이블명` | `DROP TABLE 테이블명` |\n| :---: | :---: | :---: | :---: |\n| **SQL 명령어 분류** | **DML (데이터 조작어)** | **DDL (데이터 정의어)** | **DDL (데이터 정의어)** |\n| **`WHERE` 절(일부 행만 삭제)** | **⭕ 가능** (일부 행 선택 삭제 가능) | **❌ 불가능** (무조건 전체 행 삭제) | **❌ 불가능** (테이블 통째로 삭제) |\n| **삭제 후 테이블 구조(스키마)** | **유지됨** (남아있음) | **유지됨** (남아있음) | **❌ 완전히 삭제됨 (사라짐!)** |\n| **디스크 저장 공간 (용량)** | **반환 안 됨** (공간 그대로 차지) | **⭕ 즉시 반환됨 (초기화)** | **⭕ 즉시 전부 반환됨** |\n| **COMMIT / ROLLBACK 여부** | **수동 `COMMIT` / `ROLLBACK` 가능!** | **`AUTO COMMIT` / `ROLLBACK` 불가!** | **`AUTO COMMIT` / `ROLLBACK` 불가!** |\n| **Undo 로그 생성 및 처리 속도** | 행 단위로 로그 기록 ➔ **느림 (부하 큼)** | 로그 최소 기록 ➔ **매우 빠름 (부하 적음)** | 즉시 삭제 ➔ **가장 빠름** |\n\n![DROP TABLE CASCADE CONSTRAINTS 구문 및 실행 예시 1](images/p096_img01.png)\n\n![TRUNCATE TABLE 구문 예시 2](images/p096_img02.png)\n\n![TRUNCATE TABLE 실행 후 테이블 구조는 남고 데이터만 초기화된 모습 3](images/p096_img03.png)\n\n![DELETE를 사용한 전체 행 삭제 예시 4](images/p096_img04.png)\n\n![트랜잭션 및 테이블 삭제 실습 예시 5](images/p096_img05.png)\n\n![데이터 삭제 실습 결과 비교 1](images/p097_img01.png)\n\n![데이터 삭제 실습 결과 비교 2](images/p097_img02.png)\n\n![DROP, TRUNCATE, DELETE 개념 요약 3](images/p097_img03.png)\n\n![DROP vs TRUNCATE vs DELETE 완벽 비교표 (시험 직전 필수 암기!)](images/p097_img04.png)\n\n---\n\n#### 5. 기타 데이터베이스 객체: 뷰(`VIEW`), 시퀀스(`SEQUENCE`), 시노님(`SYNONYM`)\n1. **뷰 (VIEW) — 가상 테이블**:\n   - 실제 데이터를 물리적으로 저장하고 있지 않고, **`SELECT` 쿼리문(정의)만 저장**하고 있는 가상의 테이블이다.\n   - **뷰 사용의 3대 장점 (`\"독·편·보\"`)**:\n     - **독립성 (Independence)**: 원본 테이블 구조가 변경되어도 뷰를 사용하는 응용 프로그램은 변경하지 않아도 됨 (논리적 데이터 독립성 제공).\n     - **편리성 (Convenience)**: 복잡한 조인/서브쿼리 SQL을 뷰로 만들어 두면 사용자는 단순한 `SELECT * FROM 뷰이름`으로 쉽게 조회 가능.\n     - **보안성 (Security)**: 급여나 주민번호 같은 민감한 컬럼을 제외한 채 뷰를 만들어 권한을 부여함으로써 중요 데이터 노출 방지.\n   - 생성/수정: **`CREATE [OR REPLACE] VIEW 뷰이름 AS SELECT ...`** / 삭제: **`DROP VIEW 뷰이름;`**\n2. **시퀀스 (SEQUENCE)**:\n   - 자동으로 순차적으로 증가하는 유일한 번호(일련번호 PK 등)를 생성해주는 객체.\n   - **`시퀀스명.NEXTVAL`** (다음 번호 생성 및 증가), **`시퀀스명.CURRVAL`** (현재 번호 조회).\n3. **시노님 (SYNONYM, 동의어)**:\n   - 다른 유저의 객체나 긴 테이블 이름에 대해 간단한 별명(별칭)을 붙여주는 객체 (`CREATE [PUBLIC] SYNONYM 별칭 FOR 원본객체;`).\n\n![CREATE OR REPLACE VIEW 뷰 생성 구문](images/p098_img01.png)\n\n![시퀀스(SEQUENCE) 생성 옵션(START WITH, INCREMENT BY, MAXVALUE, CYCLE, CACHE) 및 실행 예시 1](images/p099_img01.png)\n\n![시퀀스 NEXTVAL을 활용한 INSERT 실행 결과 2](images/p099_img02.png)\n\n![시노님(SYNONYM) 생성 및 조회 예시 1](images/p100_img01.png)\n\n![DROP SYNONYM 시노님 삭제 구문 2](images/p100_img02.png)"}, {"id": "ch-30", "index": 30, "title": "2-3-4. DCL (Data Control Language)", "subj_id": "tab4", "subj_name": "2과목 3장 · 관리 구문", "badge": "2과목 3장 · 관리 구문 (DML/TCL/DDL/DCL)", "md": "# 2-3-4. DCL (Data Control Language)\n\n> **단원 분류**: `2과목` > `2-3. 관리 구문` > **`2-3-4. DCL`**\n\n## 💡 STEP 1. 핵심 개념 한눈에 이해하기\n\n> DCL은 사용자에게 권한을 주거나 회수하는 명령어들이다(GRANT, REVOKE).\n\nex) 사무실 출입카드처럼 신입에게 발급(GRANT)·퇴사자 회수(REVOKE)·부서별 묶음(ROLE)으로 누가 어떤 테이블을 SELECT/INSERT/UPDATE 할 수 있는지를 통제한다.\n\n---\n\n## [개념 도식화] DCL 흐름\n\n| 권한 관리 주체 및 명령어 | 동작 방향 | 핵심 설명 |\n| :---: | :---: | :--- |\n| **`GRANT 권한 TO 사용자`** | 관리자/소유자 ➔ 사용자 | 특정 시스템 권한 또는 테이블 객체 권한을 부여 |\n| **`REVOKE 권한 FROM 사용자`** | 관리자/소유자 ◀ 사용자 | 부여했던 권한을 회수 (`WITH GRANT OPTION`은 연쇄 회수, `WITH ADMIN OPTION`은 본인만 회수!) |\n| **`CREATE ROLE 롤이름`** | 권한 묶음 생성 후 `GRANT 롤 TO 사용자` | 여러 권한을 하나의 **롤(ROLE, 역할 묶음)**로 만들어 여러 사용자에게 편리하게 일괄 부여/관리 |\n\n---\n\n## 권한의 종류\n\n### 시스템 권한 (System Privilege)\n\n| 권한 | 의미 |\n|---|---|\n| CREATE SESSION | 접속 권한 |\n| CREATE TABLE | 테이블 생성 권한 |\n| CREATE VIEW | 뷰 생성 권한 |\n| CREATE USER | 사용자 생성 권한 |\n| DROP ANY TABLE | 모든 테이블 삭제 권한 |\n\n### 객체 권한 (Object Privilege)\n\n| 권한 | 의미 |\n|---|---|\n| SELECT | 조회 |\n| INSERT | 입력 |\n| UPDATE | 수정 |\n| DELETE | 삭제 |\n| ALTER | 변경 |\n| EXECUTE | 프로시저/함수 실행 |\n| REFERENCES | FK로 참조 |\n\n---\n\n## GRANT — 권한 부여\n\n```sql\n-- 시스템 권한\nGRANT CREATE SESSION TO USER1;\nGRANT CREATE TABLE   TO USER1;\n\n-- 객체 권한\nGRANT SELECT ON EMP TO USER1;\nGRANT SELECT, INSERT, UPDATE ON EMP TO USER1;\n\n-- 모든 사용자에게\nGRANT SELECT ON EMP TO PUBLIC;\n\n-- 권한 부여 가능 권한도 함께(재부여 가능)\nGRANT SELECT ON EMP TO USER1 WITH GRANT OPTION;\n```\n\n| 옵션 | 의미 |\n|---|---|\n| WITH GRANT OPTION | 객체 권한: 받은 사람이 다른 사람에게 다시 줄 수 있음 |\n| WITH ADMIN OPTION | 시스템 권한: 관리자처럼 다시 부여 가능 |\n\n---\n\n## REVOKE — 권한 회수\n\n```sql\nREVOKE SELECT ON EMP FROM USER1;\nREVOKE CREATE TABLE FROM USER1;\n```\n\n### 연쇄 회수\n\nWITH GRANT OPTION으로 다른 사람에게 부여된 권한도 함께 회수된다.\n\n```\n관리자 → USER1 (WITH GRANT OPTION) → USER2\n        REVOKE 시 USER2 권한도 함께 사라짐\n```\n\n---\n\n## ROLE — 권한 묶음\n\n```sql\n-- 1. 역할 만들기\nCREATE ROLE DEV_ROLE;\n\n-- 2. 역할에 권한 부여\nGRANT SELECT, INSERT, UPDATE ON EMP TO DEV_ROLE;\nGRANT SELECT ON DEPT                TO DEV_ROLE;\n\n-- 3. 사용자에게 역할 부여\nGRANT DEV_ROLE TO USER1;\nGRANT DEV_ROLE TO USER2;\n\n-- 회수\nREVOKE DEV_ROLE FROM USER1;\n```\n\n| 개별 권한들 (`CREATE TABLE`, `SELECT`, `INSERT` 등) | ─── `GRANT 권한 TO 롤(ROLE)` ───▶ | **`ROLE` (권한 바구니)** | ─── `GRANT 롤 TO 사용자들` ───▶ | `USER 1`, `USER 2` 일괄 부여 완료! |\n| :---: | :---: | :---: | :---: | :---: |\n\n---\n\n## 사용자 관리 (참고)\n\nCREATE USER, ALTER USER, DROP USER 자체는 **DDL**이지만 권한 관리와 짝을 이룬다.\n\n```sql\n-- 사용자 생성\nCREATE USER USER1 IDENTIFIED BY password123;\n\n-- 비밀번호 변경\nALTER USER USER1 IDENTIFIED BY newpass;\n\n-- 사용자 삭제\nDROP USER USER1;\nDROP USER USER1 CASCADE;     -- 소유 객체까지 모두 삭제\n```\n\nOracle에서 사용자 = 스키마(객체 모음). 사용자 생성 권한은 DBA가 가진다.\n\n---\n\n## [SQL 실전] 권한 흐름\n\n```sql\n-- 관리자(DBA)로 접속\nCREATE USER STAFF IDENTIFIED BY pw1234;\n\nGRANT CREATE SESSION TO STAFF;       -- 접속 권한\nGRANT SELECT ON HR.EMP TO STAFF;     -- HR 스키마 EMP 조회 권한\n\n-- STAFF로 접속\nSELECT * FROM HR.EMP;     -- 가능\n\n-- 권한 회수\nREVOKE SELECT ON HR.EMP FROM STAFF;\n\nSELECT * FROM HR.EMP;     -- 권한 부족 에러\n```\n\n---\n\n## [Before & After]\n\n방금 만들어진 USER1 계정에 권한을 한 단계씩 부여하다가 마지막에 SELECT 한 가지만 회수한다. 시스템 권한(CREATE SESSION)이 먼저 있어야 접속이 되고, 그 위에 객체 권한(SELECT/INSERT)이 올라가는 순서를 따라간다.\n\n### USER1의 권한 변화\n\n| 시점 | 가능한 작업 |\n|---|---|\n| 초기 | 접속도 불가 |\n| GRANT CREATE SESSION 후 | 접속 가능 |\n| GRANT SELECT ON EMP 후 | EMP 조회 가능 |\n| GRANT INSERT ON EMP 후 | EMP 입력 가능 |\n| REVOKE SELECT ON EMP 후 | EMP 조회 불가 |\n\n권한은 \"접속(시스템 권한) → 개별 객체 작업(객체 권한)\" 순으로 쌓인다. CREATE SESSION이 없으면 SELECT 권한이 있어도 접속이 안 되고, REVOKE는 해당 권한만 떼어내므로 INSERT 권한은 그대로 남는다. WITH GRANT OPTION으로 재부여된 권한이라면 REVOKE 한 번에 연쇄적으로 회수된다.\n\n---\n\n## DBA의 대표 ROLE\n\n| ROLE | 설명 |\n|---|---|\n| CONNECT | 접속 권한(CREATE SESSION 포함) |\n| RESOURCE | 객체 생성 권한(테이블, 시퀀스 등) |\n| DBA | 모든 권한 |\n\n```sql\nGRANT CONNECT, RESOURCE TO USER1;\n```\n\n---\n\n## DCL vs 다른 명령어 분류\n\n```\nDDL: CREATE, ALTER, DROP, TRUNCATE, RENAME       (객체)\nDML: INSERT, UPDATE, DELETE, MERGE, SELECT       (데이터)\nTCL: COMMIT, ROLLBACK, SAVEPOINT                 (트랜잭션)\nDCL: GRANT, REVOKE                               (권한)\n```\n\n---\n\n## [시험 출제 포인트]\n\n| 함정 | 정답 |\n|---|---|\n| DCL 명령어 | GRANT, REVOKE |\n| 시스템 권한 부여 시 옵션 | WITH ADMIN OPTION |\n| 객체 권한 부여 시 옵션 | WITH GRANT OPTION |\n| ROLE의 목적 | 권한 묶음을 한 번에 관리 |\n| `GRANT DEV_ROLE TO USER1`의 분류 | DCL |\n| 모든 사용자에게 권한 | TO PUBLIC |\n| WITH GRANT OPTION 회수 영향 | 연쇄 회수(다시 부여한 사용자도) |\n\n단골 함정: GRANT/REVOKE를 DDL이나 DML로 잘못 분류하는 보기. DCL이 정답이다.\n\n---\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · DCL 명령: **GRANT / REVOKE** (ROLE 부여도 GRANT 로 함)\n> · 권한 종류: **시스템 권한** (CREATE SESSION/TABLE 등) + **객체 권한** (SELECT/INSERT/UPDATE 등)\n> · 옵션: **WITH GRANT OPTION** (객체 권한 재부여) / **WITH ADMIN OPTION** (시스템 권한 재부여)\n> · ROLE = 권한 묶음 → 여러 사용자에 한 번에 부여 (CONNECT / RESOURCE / DBA 가 대표)\n> · `TO PUBLIC` = 모든 사용자에게\n> · WITH GRANT OPTION 으로 재부여한 권한 = REVOKE 시 **연쇄 회수**\n> · 4대 분류 한 줄 정리: **DDL=객체 / DML=데이터 / TCL=트랜잭션 / DCL=권한**\n\n\n---\n\n---\n\n## 📘 STEP 2. 상세 출제 이론 & 원본 강의 도표·슬라이드 완벽 정복 제3장 제4절. DCL (Data Control Language)\n\n#### 1. 유저(User)와 권한(Privileges)의 개요: 시스템 권한 vs 객체 권한\n- **데이터베이스 보안의 2가지 영역**:\n  - **시스템 보안**: 데이터베이스 자체에 대한 접근(로그인, 유저 생성, 테이블 생성 등)을 통제하는 보안.\n  - **데이터 보안**: 특정 테이블이나 뷰 등 **객체(Object)의 내용에 접근(조회, 입력, 수정, 삭제)**하는 것을 통제하는 보안.\n- **권한의 2가지 종류**:\n  1. **시스템 권한 (System Privileges)**: 사용자가 데이터베이스에서 특정 작업(로그인 접속 `CREATE SESSION`, 테이블 생성 `CREATE TABLE`, 뷰 생성 `CREATE VIEW`, 유저 생성 `CREATE USER` 등)을 수행할 수 있도록 하는 권한 (주로 DBA가 부여).\n     - **⚠️ 단골 함정**: `CREATE USER`로 유저를 새로 만들었다고 해서 바로 로그인을 할 수 있는 것이 아니다! 반드시 데이터베이스 접속 권한인 **`CREATE SESSION`** 권한을 `GRANT` 받아야 로그인이 가능하며, 테이블을 만들려면 `CREATE TABLE` 권한과 테이블스페이스 할당량(Quota)이 필요하다!\n  2. **객체 권한 (Object Privileges)**: 특정 테이블, 뷰, 시퀀스 등에 대해 **`SELECT`, `INSERT`, `UPDATE`, `DELETE`, `ALTER`, `INDEX`, `REFERENCES`** 등을 수행할 수 있는 권한 (`ON 객체명`이 붙음!).\n- **유저 관리 DDL**:\n  - 생성: `CREATE USER 유저명 IDENTIFIED BY 비밀번호;`\n  - 비밀번호 변경: `ALTER USER 유저명 IDENTIFIED BY 새비밀번호;`\n  - 삭제: **`DROP USER 유저명 [CASCADE];`** *(유저가 이미 생성하여 소유하고 있는 테이블/객체가 하나라도 있다면 그냥 `DROP USER`는 에러가 나며, 반드시 **`CASCADE` 옵션**을 붙여야 소유 객체들을 먼저 모두 삭제한 뒤 유저를 삭제한다!)*\n\n![CREATE USER 구문 예시](images/p100_img03.png)\n\n![GRANT 명령어 기본 문법 및 객체 권한 부여 구조](images/p101_img01.png)\n\n![시스템 권한 부여 및 유저 접속 실습 예시 1](images/p101_img02.png)\n\n![테이블 생성 권한 부여 및 스키마.테이블명 조회 예시 2](images/p101_img03.png)\n\n---\n\n#### 2. `GRANT`와 `REVOKE`의 핵심 비교: `WITH GRANT OPTION` vs `WITH ADMIN OPTION` (★100% 출제!)\n\n```sql\n-- 1. 객체 권한 부여 및 회수 (ON 객체명 포함!)\nGRANT SELECT, INSERT ON EMP TO SCOTT [WITH GRANT OPTION];\nREVOKE SELECT, INSERT ON EMP FROM SCOTT;\n\n-- 2. 시스템 권한 부여 및 회수 (ON 절 없음!)\nGRANT CREATE SESSION, CREATE TABLE TO SCOTT [WITH ADMIN OPTION];\nREVOKE CREATE SESSION, CREATE TABLE FROM SCOTT;\n```\n\n> 💡 **[핵심 필수 암기]**\n> **🔥 DCL 최고 빈출 문제! 중간자(`B`)의 권한을 회수(`REVOKE`)했을 때 제3자(`C`)의 권한은 어떻게 되는가?**\n> `A(DBA/소유자)` ➔ **`B`에게 권한 부여** ➔ **`B`가 `C`에게 권한 재부여**한 상태에서, **`A`가 `B`로부터 권한을 `REVOKE`(회수)**했을 때:\n\n| 구분 | 객체 권한 옵션: **`WITH GRANT OPTION`** | 시스템 권한 옵션: **`WITH ADMIN OPTION`** |\n| :---: | :--- | :--- |\n| **적용 대상** | **객체 권한** (`SELECT`, `INSERT` **ON 테이블** 등) | **시스템 권한** (`CREATE TABLE`, `CREATE SESSION` 등) 및 **ROLE(롤)** |\n| **역할** | 부여받은 객체 권한을 다른 사용자에게 또 부여할 수 있는 권한 | 부여받은 시스템 권한을 다른 사용자에게 또 부여할 수 있는 권한 |\n| **`A`가 `B`의 권한을 `REVOKE` 했을 때 `C`의 운명 (★핵심!)** | **⚡ 연쇄 회수됨 (Cascade Revoke)!**<br>`B`의 권한이 회수되면 `B`가 `C`에게 주었던 권한까지 **자동으로 함께 연쇄 회수(박탈)**된다! | **🛡️ 연쇄 회수 안 됨 (유지됨)!**<br>`B`의 권한만 회수될 뿐, `B`가 이미 `C`에게 부여했던 권한은 **회수되지 않고 `C`에게 그대로 남아 유지**된다! |\n\n![GRANT와 REVOKE 실행 예시](images/p102_img01.png)\n\n---\n\n#### 3. 롤 (ROLE: 권한들의 묶음 주머니)\n- **롤(Role)의 정의**: 사용자에게 허가할 수 있는 **관련 권한들의 집합(묶음)**. 일일이 수십 개의 권한을 사용자마다 `GRANT`하는 대신, 롤 하나에 권한들을 담아두고 사용자에게 롤을 부여하면 권한 관리가 매우 편리해진다.\n- **롤(Role)의特征**:\n  - 롤은 **시스템 권한과 객체 권한을 모두 포함**할 수 있다!\n  - 롤은 사용자에게 직접 부여할 수도 있고, **다른 롤에 포함시켜 부여**할 수도 있다.\n- **롤 생성 및 부여 3단계 순서 (★순서 빈칸 문제 출제!)**:\n  ```sql\n  -- 1단계: 롤 생성 (CREATE ROLE)\n  CREATE ROLE LOGIN_TABLE;\n\n  -- 2단계: 생성된 롤에 권한들을 담기 (GRANT 권한 TO 롤이름)\n  GRANT CREATE SESSION, CREATE TABLE TO LOGIN_TABLE;\n\n  -- 3단계: 사용자에게 롤을 부여하기 (GRANT 롤이름 TO 사용자명)\n  GRANT LOGIN_TABLE TO JISUNG;\n  ```\n- **오라클 기본 내장 롤**:\n  - **`CONNECT` 롤**: `CREATE SESSION` 등 기본 접속 권한 포함.\n  - **`RESOURCE` 롤**: `CREATE TABLE`, `CREATE SEQUENCE`, `CREATE TRIGGER` 등 객체 생성 권한 포함.\n  - **`DBA` 롤**: 모든 시스템 권한을 포함하는 최고 관리자 롤.\n\n![ROLE(롤) 생성 ➔ 롤에 권한 부여 ➔ 사용자에게 롤 부여하는 3단계 실습 1](images/p102_img02.png)\n\n![부여된 ROLE을 통한 로그인 및 테이블 생성 확인 2](images/p102_img03.png)\n\n![DROP ROLE 롤 삭제 및 회수 구문 3](images/p102_img04.png)\n\n![객체 권한 부여 및 타 스키마 테이블 조회 마무리 확인](images/p103_img01.png)"}, {"id": "ch-31", "index": 31, "title": "부록: 시험 당일 핵심 총정리 (30개 챕터 빈출 함정 + 체크리스트)", "subj_id": "tab6", "subj_name": "시험 직전 30초 총정리", "badge": "최종 점검 부록", "md": "# 부록: 시험 당일 핵심 총정리 (30개 챕터 빈출 함정 + 체크리스트)\n\n> **시험 직전 통독용**: 30개 전 챕터의 핵심 포인트와 자주 출제되는 단골 함정, 시험 당일 체크리스트를 한눈에 정리한 요약본입니다.\n\n---\n\n## 1. 챕터별 핵심 정리 + 빈출 함정\n\n### 1과목 — 데이터 모델링의 이해\n\n#### [1-1-1] 데이터 모델의 이해\n\n- 3단계: **개념 → 논리 → 물리**\n- 3대 관점: **데이터 / 프로세스 / 상관**\n- 3층 스키마: 외부(View) / 개념(ERD) / 내부(저장)\n- 좋은 모델 6요소: 완전성·중복배제·업무규칙·재사용·의사소통·통합성\n\n> **⚠ 함정**\n> - \"물리 모델링이 가장 먼저\" → **X** (개념 → 논리 → 물리)\n> - \"정규화는 물리 단계\" → **X** (논리 단계)\n\n#### [1-1-2] 엔터티\n\n- 6대 특징 **업·식·인·프·속·관** — 업무 필요·식별·인스턴스 ≥ 2·프로세스가 이용·속성 ≥ 2·관계\n- 유무형 분류: 유형 / 개념 / 사건\n- 발생 시점 분류: **기본 → 중심 → 행위**\n\n> **⚠ 함정**\n> - 인스턴스 1개도 OK → **X (≥ 2)**\n> - 속성 1개도 OK → **X (≥ 2)**\n\n#### [1-1-3] 속성\n\n- 분류: **기본 / 설계 / 파생**\n- 구성 분류: 단순 / 복합 / 다치\n- 한 컬럼에 한 값(원자성) — 1NF의 기본\n\n> **⚠ 함정**\n> - 다치 속성(여러 값) 그대로 OK → **X (1NF 위반)**\n> - 파생 속성은 저장하면 안 된다 → 상황에 따라(성능 시 허용)\n\n#### [1-1-4] 관계\n\n- 차수: **1:1 / 1:N / M:N**\n- 식별 관계 vs 비식별 관계\n- M:N은 분해(연관 엔터티) 필요\n\n> **⚠ 함정**\n> - M:N 그대로 RDB 구현 → **X (분해 필수)**\n\n#### [1-1-5] 식별자\n\n- 4대 조건 **유·최·불·존** — 유일성·최소성·불변성·존재성\n- 4대 분류: 주/보조, 본질/인조, 단일/복합, 내부/외부\n- **PK = UNIQUE + NOT NULL**, 테이블당 1개\n\n> **⚠ 함정**\n> - PK 여러 개 가능? → **X (1개)**\n> - UNIQUE는 NULL 안 됨? → **X (NULL 허용)**\n\n#### [1-2-1] 정규화\n\n- **1NF → 2NF → 3NF → BCNF**\n- **부분종속 = 2NF 위반** / **이행종속 = 3NF 위반**\n- 이상현상 3종: 삽입·갱신·삭제 이상\n- 반정규화: 의도적 중복 허용(성능 위함)\n\n> **⚠ 함정**\n> - BCNF가 3NF보다 약하다 → **X (더 강함)**\n> - 정규화는 항상 성능 개선 → **X (조인 늘어 느려질 수 있음)**\n\n#### [1-2-2] 관계와 조인의 이해\n\n- **관계 = FK = JOIN**의 토대\n- 필수성(NOT NULL)·식별성(PK 포함 여부)\n\n> **⚠ 함정**\n> - FK 없으면 조인 불가 → **X (논리적으론 가능, 권장 X)**\n\n#### [1-2-3] 트랜잭션의 이해\n\n- **ACID** — 원자성 / 일관성 / 고립성 / 지속성\n- 모델의 필수성·식별성이 트랜잭션 무결성과 연결\n\n> **⚠ 함정**\n> - ACID는 3개 원칙 → **X (4개)**\n\n#### [1-2-4] NULL 속성의 이해\n\n- `= NULL` 안 됨 — **`IS NULL` / `IS NOT NULL`만 가능**\n- NULL과 산술 → 결과는 모두 **NULL**\n- SQL 3-값 논리: TRUE / FALSE / **UNKNOWN**\n- 집계: `COUNT(*)`만 NULL 포함 / 나머지는 NULL 무시\n- NULL 처리 함수: `NVL` / `NVL2` / `NULLIF` / `COALESCE`\n\n> **⚠ 함정 (시험 단골)**\n> - `NULL = NULL` → **UNKNOWN** (FALSE 아님)\n> - `WHERE COL = NULL` → **결과 0건**. `IS NULL` 사용\n> - `NULL + 100` → **NULL**\n> - `AVG(컬럼)`의 분모는 **NULL 제외 개수** (0 포함 평균과 다름)\n> - `NULLIF(A, B)` — A=B면 **NULL**\n> - `COALESCE(NULL, NULL, 'X')` → **'X'**\n\n#### [1-2-5] 본질·인조 식별자\n\n- **본질식별자**: 업무 의미가 있는 자연 키 (주민번호, ISBN 등)\n- **인조식별자**: 의도적으로 만든 대리키 (시퀀스, GUID)\n- 인조키는 가독성↓·중복 위험, 별도 UNIQUE 제약 필요\n\n> **⚠ 함정**\n> - 본질식별자가 항상 좋다 → **X (보안·변경 위험 시 인조 선호)**\n\n### 2과목 — SQL 기본 \n\n#### [2-1-1] 관계형 DB 개요\n\n- SQL 분류: **DDL / DML / DCL / TCL**\n- DDL: CREATE/ALTER/DROP/TRUNCATE/RENAME — **자동 COMMIT**\n- DML: INSERT/UPDATE/DELETE/MERGE — **ROLLBACK 가능**\n- DCL: GRANT/REVOKE — 자동 COMMIT\n- TCL: COMMIT/ROLLBACK/SAVEPOINT\n\n> **⚠ 함정**\n> - `TRUNCATE`는 DML이다 → **X (DDL — 자동 COMMIT, ROLLBACK 불가)**\n> - `DELETE`는 DDL이다 → **X (DML — ROLLBACK 가능)**\n\n#### [2-1-2] SELECT문\n\n- 작성 순서: **SELECT** - FROM - WHERE - GROUP BY - HAVING - ORDER BY\n- 실행 순서: **FROM → WHERE → GROUP → HAVING → SELECT → ORDER** (FWGHSO)\n- DUAL: Oracle 시스템 가상 테이블 (1행 1컬럼)\n- DISTINCT로 중복 제거\n\n> **⚠ 함정**\n> - SELECT가 가장 먼저 실행 → **X (거의 마지막)**\n> - SELECT의 별칭(AS)을 WHERE에서 사용 → **X (WHERE는 SELECT보다 먼저 실행)**\n\n#### [2-1-3] 함수\n\n- 단일행 vs 다중행(집계)\n- 문자: UPPER/LOWER/SUBSTR/INSTR/LENGTH/LPAD/RPAD/REPLACE/CONCAT(`||`)\n- 숫자: ROUND/TRUNC/MOD/CEIL/FLOOR\n- 날짜: SYSDATE/ADD_MONTHS/MONTHS_BETWEEN/LAST_DAY/NEXT_DAY\n- 변환: TO_CHAR/TO_NUMBER/TO_DATE\n- NULL: NVL/NVL2/NULLIF/COALESCE\n- 조건: **CASE**(범위 가능) vs **DECODE**(동등비교만)\n\n```sql\n-- 문자/숫자/날짜\nSELECT SUBSTR('SQLD',1,3)        → 'SQL'\n     , LENGTH('양파')             → 2\n     , ROUND(123.456, 1)         → 123.5\n     , MOD(10, 3)                → 1\n     , TO_CHAR(SYSDATE,'YYYY-MM-DD')\nFROM DUAL;\n\n-- NULL/조건\nNVL(SAL, 0), NVL2(COMM,'있음','없음')\nCASE WHEN SAL > 3000 THEN '高' ELSE '低' END\nDECODE(JOB, 'CLERK', 1, 'SALES', 2, 0)\n```\n\n> **⚠ 함정**\n> - DECODE로 BETWEEN 같은 범위 비교 가능 → **X (CASE만 가능)**\n> - 날짜 - 날짜 = 날짜 → **X (일수, 숫자)**\n\n#### [2-1-4] WHERE절\n\n- 비교: =, <>, !=, >, <\n- 논리: AND > OR (AND 우선)\n- SQL 연산자: **BETWEEN**(양 끝 포함) / **IN** / **LIKE**(`_`=1글자, `%`=0+) / **IS NULL**\n\n> **⚠ 함정**\n> - BETWEEN 100 AND 200 → 100, 200 **포함**\n> - `NOT IN (서브쿼리)`에 NULL 있으면 → **결과 0건** 위험\n> - AND/OR 우선순위 헷갈리면 **괄호 사용**\n\n#### [2-1-5] GROUP BY / HAVING\n\n- **WHERE는 집계 전**, **HAVING은 집계 후**\n- SELECT의 일반 컬럼은 GROUP BY에 명시 필수 (집계 함수는 예외)\n- NULL은 하나의 그룹으로 처리\n\n> **⚠ 함정**\n> - HAVING 없이 집계 결과 필터 → **X**\n> - SELECT의 일반 컬럼이 GROUP BY 없으면 → **에러**\n\n#### [2-1-6] ORDER BY절\n\n- 실행 순서 마지막. ASC(기본) / DESC\n- NULLS FIRST / NULLS LAST 직접 지정 가능\n- SELECT의 별칭·컬럼 위치(1, 2, ...) 사용 가능\n\n> **⚠ 함정**\n> - Oracle ASC 기본 NULL 위치 → **마지막 (NULLS LAST)**\n> - MS-SQL ASC 기본 NULL 위치 → **처음 (NULLS FIRST)**\n\n#### [2-1-7] 조인 (JOIN)\n\n- 5종: **EQUI / Non-EQUI / SELF / OUTER / CROSS**\n- EQUI: `=`로 연결 (가장 흔함)\n- Non-EQUI: BETWEEN, >, < 등으로 연결\n- SELF: 같은 테이블 두 번 조인 (별칭 필수)\n- OUTER: LEFT/RIGHT/FULL — 매칭 안 돼도 한쪽 다 포함\n- CROSS: 카티션 곱 (조인 조건 없음)\n\n> **⚠ 함정**\n> - OUTER JOIN 조건은 **ON에**. WHERE에 두면 NULL 행 제외돼 INNER 효과\n> - CROSS JOIN: 조인 조건 빼먹어도 발생 → **의도치 않으면 위험**\n> - Oracle `(+)`는 **NULL로 보충될 쪽(없을 수 있는 쪽)**에 붙임\n\n#### [2-1-8] 표준 조인\n\n- INNER / LEFT OUTER / RIGHT OUTER / FULL OUTER / CROSS / NATURAL / USING\n- **NATURAL**: 같은 이름·타입 컬럼 자동 조인 (조건 명시 X)\n- **USING**: 같은 이름 컬럼 명시\n- FULL OUTER: 양쪽 다 (없는 쪽 NULL)\n\n> **⚠ 함정**\n> - NATURAL JOIN: 이름 같고 **타입 다르면 에러**\n> - MySQL은 FULL OUTER 미지원 → LEFT UNION RIGHT\n\n### 2과목 — SQL 활용 \n\n#### [2-2-1] 서브쿼리\n\n- 위치별: 스칼라 / 인라인뷰 / WHERE 서브쿼리\n- 행 수별: 단일행(=, <, > 등) / 다중행(IN, ANY, ALL, EXISTS)\n- 연관 vs 비연관 서브쿼리\n\n> **⚠ 함정**\n> - **ANY = 최소 기준**(중 어느 하나보다 작아도 OK) / **ALL = 최대 기준**(모두보다 커야)\n> - `IN (a, b, c)` = OR 연결의 단축\n> - 스칼라 서브쿼리는 **1행 1컬럼만 반환**\n\n#### [2-2-2] 집합 연산자\n\n- **UNION**: 합집합 (정렬 + 중복 제거)\n- **UNION ALL**: 합집합 (그대로, 빠름)\n- **INTERSECT**: 교집합 / **MINUS**(EXCEPT): 차집합\n- 컬럼 수·타입 일치 필수\n\n> **⚠ 함정**\n> - UNION ALL은 정렬 안 함 → **O (UNION만 정렬)**\n> - 컬럼 수 다르면 → **에러**\n\n#### [2-2-3] 그룹 함수\n\n- **ROLLUP(A, B)**: N+1 단계 — (A,B), (A), () 3단계\n- **CUBE(A, B)**: 2^N 단계 — 모든 조합 4가지\n- **GROUPING SETS**: 지정한 조합만 (가장 유연)\n- `GROUPING()` 함수로 소계 행 식별 (1=소계, 0=원본)\n\n```sql\nSELECT DEPT, JOB, SUM(SAL)\nFROM EMP\nGROUP BY ROLLUP(DEPT, JOB);\n-- (DEPT,JOB) → (DEPT) → ()  3단계\n\nGROUP BY CUBE(DEPT, JOB);\n-- (D,J),(D),(J),()  4단계 (2^2)\n\nGROUP BY GROUPING SETS((DEPT,JOB),(DEPT));\n-- 지정한 조합만\n```\n\n> **⚠ 함정**\n> - ROLLUP(A,B,C) → **4단계** ((A,B,C), (A,B), (A), ())\n> - CUBE(A,B,C) → **8단계 (2^3)**\n\n#### [2-2-4] 윈도우 함수\n\n- 순위: **RANK**(1,1,3) / **DENSE_RANK**(1,1,2) / **ROW_NUMBER**(1,2,3)\n- 행 순서: LAG / LEAD (앞·뒤 행 값)\n- 집계 OVER: SUM/AVG/COUNT OVER PARTITION BY\n- WINDOWING: ROWS BETWEEN ... AND ... (행 범위 지정)\n\n```sql\nSELECT ENAME, DEPT, SAL,\n  RANK()       OVER(PARTITION BY DEPT ORDER BY SAL DESC) R,\n  DENSE_RANK() OVER(PARTITION BY DEPT ORDER BY SAL DESC) DR,\n  ROW_NUMBER() OVER(ORDER BY SAL DESC) RN,\n  LAG(SAL,1)   OVER(ORDER BY HIRE) PREV,\n  SUM(SAL)    OVER(PARTITION BY DEPT) DEPT_SUM\nFROM EMP;\n-- RANK: 1,1,3 / DENSE_RANK: 1,1,2 / ROW_NUMBER: 1,2,3\n```\n\n> **⚠ 함정**\n> - RANK는 동률 다음 순위 **건너뜀**, DENSE_RANK는 **연속**\n> - LAG/LEAD 기본 오프셋은 **1**\n> - PARTITION BY 없으면 전체가 한 그룹\n\n#### [2-2-5] Top N 쿼리\n\n- Oracle **ROWNUM**: 의사컬럼, 인라인뷰 + ORDER BY 후 사용\n- 표준 **FETCH FIRST** N ROWS ONLY/WITH TIES (Oracle 12c+)\n- MS-SQL **TOP** N / TOP N WITH TIES\n- 윈도우 **ROW_NUMBER() OVER** + PARTITION BY (그룹별 TopN)\n\n> **⚠ 함정**\n> - ROWNUM은 **정렬 전 매겨짐** — 인라인뷰로 정렬 먼저\n> - `ROWNUM = N` (N≥2) → **결과 0건**\n> - `ROWNUM > N` → **항상 거짓**\n\n#### [2-2-6] 계층형 질의\n\n- `START WITH` ... `CONNECT BY PRIOR`\n- **LEVEL** 의사컬럼 (계층 깊이)\n- SYS_CONNECT_BY_PATH (경로 출력)\n- ORDER SIBLINGS BY (같은 LEVEL 정렬)\n\n> **⚠ 함정**\n> - PRIOR 위치가 **부모 결정** (PRIOR 컬럼 = 부모 컬럼)\n> - 일반 ORDER BY는 LEVEL 순서를 흩트림 → ORDER SIBLINGS BY 사용\n\n#### [2-2-7] PIVOT / UNPIVOT\n\n- **PIVOT**: 세로 → 가로 변환\n- **UNPIVOT**: 가로 → 세로 변환\n- PIVOT은 **집계 함수 필수** (SUM, COUNT 등)\n- UNPIVOT는 NULL 기본 제외 → `INCLUDE NULLS` 옵션으로 포함\n\n> **⚠ 함정**\n> - PIVOT은 집계 없이도 가능 → **X (집계 필수)**\n> - UNPIVOT은 NULL 자동 포함 → **X (기본 제외)**\n\n#### [2-2-8] 정규 표현식\n\n- 5함수: REGEXP_LIKE / REPLACE / SUBSTR / INSTR / COUNT\n- 메타문자: `.` `*` `+` `?` `[]` `^` `$` `|` `{n}`\n- 한글: `[가-힣]`\n\n```sql\n-- 한글만 / 휴대폰 형식\nWHERE REGEXP_LIKE(NAME, '^[가-힣]+$')\nWHERE REGEXP_LIKE(PHONE, '^010-[0-9]{4}-[0-9]{4}$')\n\n-- 숫자 추출\nSELECT REGEXP_SUBSTR('A123B45', '[0-9]+') FROM DUAL;\n→ '123'\n\nSELECT REGEXP_REPLACE(STR, '[^0-9]', '') FROM ...;\n-- 숫자만 남김\n```\n\n> **⚠ 함정**\n> - Oracle은 **POSIX 1003.2 기반** — `\\d`·`\\w`·`\\s`는 12c 이후 일부 동작\n> - 호환 안전: `[0-9]`·`[[:digit:]]` 사용\n\n### 2과목 — 관리 구문  · 명령어 분류 포함\n\n#### [2-3-1] DML\n\n- **분류**: INSERT / UPDATE / DELETE / MERGE (SELECT 포함 시 5종)\n- ROLLBACK 가능 → TCL로 확정 필요\n- MERGE: INSERT + UPDATE 합쳐진 형태 (UPSERT)\n\n```sql\nINSERT INTO EMP (ID, NAME, SAL) VALUES (1, '홍길동', 3000);\n\nUPDATE EMP SET SAL = SAL * 1.1 WHERE DEPT = 10;\n\nDELETE FROM EMP WHERE ID = 1;\n\nMERGE INTO TGT USING SRC ON (TGT.ID = SRC.ID)\n  WHEN MATCHED THEN UPDATE SET TGT.NAME = SRC.NAME\n  WHEN NOT MATCHED THEN INSERT (ID, NAME) VALUES (SRC.ID, SRC.NAME);\n```\n\n> **⚠ 함정 (단골)**\n> - `DELETE`는 DDL이다 → **X (DML)**\n> - DELETE WHERE 빠뜨림 → **전체 삭제 위험** (다만 ROLLBACK 가능)\n\n#### [2-3-2] TCL\n\n- **분류**: COMMIT / ROLLBACK / SAVEPOINT\n- SAVEPOINT 후 `ROLLBACK TO SP` = SP 이후 작업만 취소\n- 전체 ROLLBACK 또는 COMMIT 시 SAVEPOINT 소멸\n\n```sql\nINSERT INTO EMP VALUES (1, 'A');\nSAVEPOINT SP1;\nUPDATE EMP SET NAME = 'B' WHERE ID = 1;\nROLLBACK TO SP1;   -- UPDATE만 취소 (INSERT는 살아있음)\nCOMMIT;             -- INSERT 확정\n```\n\n> **⚠ 함정**\n> - COMMIT 후 ROLLBACK 가능 → **X (불가)**\n> - DDL 실행 시 펜딩 트랜잭션 → **자동 COMMIT됨**\n\n#### [2-3-3] DDL\n\n- **분류**: CREATE / ALTER / DROP / TRUNCATE / RENAME\n- **자동 COMMIT** — ROLLBACK 불가\n- 제약조건: PRIMARY KEY / FOREIGN KEY / UNIQUE / NOT NULL / CHECK / DEFAULT\n- PK = UNIQUE + NOT NULL (1개) / UNIQUE는 NULL 허용 (여러 개)\n\n```sql\nCREATE TABLE EMP (\n  ID      NUMBER PRIMARY KEY,\n  NAME    VARCHAR2(20) NOT NULL,\n  EMAIL   VARCHAR2(50) UNIQUE,\n  SAL     NUMBER DEFAULT 0 CHECK (SAL >= 0),\n  DEPT_ID NUMBER REFERENCES DEPT(ID)\n);\n\nALTER TABLE EMP ADD (HIRE_DT DATE);\nALTER TABLE EMP MODIFY (NAME VARCHAR2(30));\nALTER TABLE EMP DROP COLUMN EMAIL;\n\nTRUNCATE TABLE EMP;   -- 전체 삭제, 자동 COMMIT\nDROP TABLE EMP;\n```\n\n> **⚠ 함정 (단골)**\n> - `TRUNCATE`는 DML이다 → **X (DDL — ROLLBACK 불가)**\n> - TRUNCATE는 WHERE 가능 → **X (전체 삭제만)**\n> - FK는 부모의 일반 컬럼 참조 가능 → **X (PK or UNIQUE만)**\n\n#### [2-3-4] DCL\n\n- **분류**: GRANT / REVOKE\n- 시스템 권한: **WITH ADMIN OPTION** (ex: CREATE TABLE)\n- 객체 권한: **WITH GRANT OPTION** (ex: SELECT ON EMP)\n- ROLE: 권한 묶음. GRANT/REVOKE 한 번에\n\n```sql\n-- 객체 권한\nGRANT SELECT, INSERT ON EMP TO USER1;\nGRANT SELECT ON EMP TO USER1 WITH GRANT OPTION;\n\n-- 시스템 권한\nGRANT CREATE TABLE TO USER1 WITH ADMIN OPTION;\n\n-- 회수\nREVOKE SELECT ON EMP FROM USER1;\n\n-- ROLE\nCREATE ROLE DEV_ROLE;\nGRANT SELECT ON EMP TO DEV_ROLE;\nGRANT DEV_ROLE TO USER1;\n```\n\n> **⚠ 함정**\n> - GRANT는 자동 COMMIT 안 됨 → **X (자동 COMMIT)**\n> - REVOKE WITH GRANT OPTION → **연쇄 회수** (위임 받은 사용자도 잃음)\n> - WITH ADMIN OPTION 회수 → **위임 받은 사용자는 유지** (객체 권한과 차이)\n\n---\n\n## 2. 시험 당일 체크리스트\n\n### 📋 준비물\n- **신분증** (필수 — 없으면 응시 불가)\n- 수험표 출력본\n- 컴퓨터용 사인펜 또는 검정 볼펜 2자루\n- 수정테이프 (필요 시)\n- 아날로그 시계 (스마트워치 X)\n\n### ⏰ 시간 관리\n- 시험 시작 **30분 전 도착**\n- 총 **50문항 / 90분** (1문항 평균 1.8분)\n- 막히면 일단 ① 표시 후 다음으로\n- 마지막 5분 OMR 검토\n\n### 💪 컨디션\n- 전날 **충분한 수면** (밤샘 X)\n- 아침 가벼운 식사\n- 커피·차는 평소 양만\n- 화장실 시험 전 미리\n- 긴장될 땐 깊게 호흡 3번\n\n### ★ 마음가짐\n- 모르는 문제가 보여도 당황 X. 보기만 봐도 답이 좁혀지는 경우 많음.\n- 함정 패턴(`NULL`, `ROWNUM`, `ON` vs `WHERE`) 떠올리면서 침착하게.\n- 완전히 막히면 패스 후 끝까지 푼 다음 돌아오기.\n- 합격 기준 60점(60/100). **킬러 문제 욕심 X**, 풀 수 있는 문제부터.\n\n---"}, {"id": "ch-32", "index": 32, "title": "🎁 부록 2. [친구 공유 합격 노션 완결판] 2주 합격 로드맵 · 김강민&홍쌤 족보 · 노랭이 전 문항 오답노트 · 기출 킬러 총정리", "subj_id": "tab5", "subj_name": "노랭이 · 기출 킬러 족보", "badge": "친구 공유 합격 족보 & 오답노트", "md": "# 🎁 부록 2. [친구 공유 합격 노션 완결판] 2주 합격 로드맵 · 김강민&홍쌤 족보 · 노랭이 전 문항 오답노트 · 기출 킬러 총정리\n\n> [!IMPORTANT]\n> **희호님 친구분의 합격 노션(`equinox-gull-ade.notion.site/SQLD`) 100% 완벽 통합본!**\n> 친구분이 직접 정리한 **본문 + 하위 페이지 10개 + 이미지 70장 + 첨부파일 6개(`[정리] SQLD.docx`, `SQL 자격검정 실전문제.txt`, `SQLD 기출문제.txt`, `SQLD 개념 요약.pdf`, `SQLD 요점정리.pdf`, `SQLD 요약정리 2021.pdf`)**의 모든 핵심 알짜배기 족보를 단 하나도 빠짐없이 보기 좋게 재구성하여 수록했습니다.\n> 원본 첨부파일 6개도 [`친구공유자료/`](file:///C:/Users/gmlgh/Downloads/sqld_notion/친구공유자료) 폴더에 모두 다운로드되어 있습니다!\n\n---\n\n## 6-1. 친구의 2주 단기 합격 커리큘럼 & 추천 유튜브 강의 링크 모음\n\n> [!TIP]\n> **친구분이 실제로 합격할 때 사용한 2주 타임라인 & 유튜브 특강 바로가기**\n\n| 단계 | 학습 일정 | 추천 유튜브 강의 / 핵심 자료 | 바로가기 링크 |\n| :---: | :--- | :--- | :--- |\n| **참고 영상** | 시작 전 필독 | 종윤 — *SQLD 자격증 노베이스 2주 합격 공부법 (2024 개정 후기)* | [유튜브 보기](https://www.youtube.com/watch?v=SoZOTt7UZI4&t=409s) |\n| **참고 영상** | 3주/2주 플랜 | 곰사원은 곰대표 — *비전공자 노베이스 SQLD 3주 독학 합격 공부법* | [유튜브 보기](https://www.youtube.com/watch?v=llk__mId4yQ) |\n| **1주차 (Day 1~3)** | 유튜브 강의 보면서 **단권화 3일** | **홍쌤의 데이터랩** — `[2024/2025개정] SQLD 1과목·2과목 완벽 정리` | [1과목 강의](https://www.youtube.com/watch?v=xmkaOqbTQRE&list=PLbflMVhwy2jNx9F4mmDXKSuNkcRetD4LY&index=2) |\n| **1주차 (Day 1~3)** | 빠른 개념 요약 (대체/보조) | **한종구쌤** — `2시간으로 끝내는 SQLD 핵심요약 1과목 / 3시간 2과목` | [1과목](https://www.youtube.com/watch?v=gmMaH5mMJ9M) / [2과목](https://www.youtube.com/watch?v=s22922s5s2c) |\n| **1주차 (Day 4~6)** | **노랭이 1회독 3일** | `SQL 자격검정 실전문제` (노랭이) 풀기 & 틀린 문제 체크 | 아래 **6-4절 노랭이 1줄 오답노트** 참고 |\n| **1주차 (Day 7~9)** | **오답노트 & 기출 풀이 3일** | **어쩌다 DBA쌤** 기출문제 해설 재생목록 / **미나쌤** 핵심 기출 100제 | [어쩌다DBA](https://www.youtube.com/playlist?list=PL_hDrax6_odulENm_BrLTbbzLQCWYYf__) / [미나쌤](https://www.youtube.com/playlist?list=PLyQR2NzLKOCZU_jjLAdebyx9oE9dvvsrE) |\n| **2주차 (시험 3일 전)** | **D-3 초압축 총정리** | **김강민쌤** — *SQLD 최종 요약 정리 강의 (\"이것만 보면 60점 넘는다\")* | [유튜브 보기](https://www.youtube.com/watch?v=PC3ypt_VGWI) |\n| **2주차 (시험 직전)** | **D-1 스피드 암기 점검** | **미나쌤** — *시험 직전 필수 영상! SQLD 스피드 퀴즈* | [유튜브 보기](https://www.youtube.com/watch?v=rWdfFV8Wb18) |\n| **기출 모음** | 블로그 & 카페 복원 기출 | 유나맘 티스토리 기출 모음 / 데이터 전문가 포럼 네이버 카페 | [기출 블로그](https://yunamom.tistory.com/category/IT%EC%9E%90%EA%B2%A9%EC%A6%9D%20%EA%B3%B5%EB%B6%80/SQLD%20%EA%B8%B0%EC%B6%9C%EB%AC%B8%EC%A0%9C) / [네이버 카페](https://cafe.naver.com/sqlpd/13623) |\n\n---\n\n## 6-2. 김강민쌤 *\"이것만 보면 60점 넘는다\"* 초압축 암기 공식 & 1과목 키워드 노트\n\n> [!IMPORTANT]\n> **시험장에서 1초 만에 답을 고르는 두문자 암기 공식 모음 (친구 노션 `김강민 정리` & `요약 공부` 통합)**\n\n### 1. 두문자 암기 공식 5대장\n1. **데이터 모델링 3단계 (`개·논·물`)**:\n   - **개**념적 모델링 (추상화 최고, 업무 중심/포괄적, 핵심 엔터티 도출 및 ERD 작성) ➔ **논**리적 모델링 (식별자·속성·관계 정의, 재사용성 최고, **정규화 수행**) ➔ **물**리적 모델링 (가장 구체적, DB 성능·디스크 저장 구조·파티셔닝 고려)\n2. **스키마 3단계 구조 (`외·개·내`)**:\n   - **외**부 스키마 (개별 사용자 관점, `VIEW`) ➔ **개**념 스키마 (조직 전체의 **통합된** 논리적 구조, 설계자 관점) ➔ **내**부 스키마 (물리적 저장 구조, 칼럼·인덱스·파일)\n   - **논리적 독립성**: 개념 스키마가 바뀌어도 외부 스키마(응용 프로그램)에 영향 X\n   - **물리적 독립성**: 내부(물리) 스키마가 바뀌어도 개념/외부 스키마에 영향 X\n3. **속성의 특성에 따른 분류 (`기·설·파`)**:\n   - **기**본 속성 (업무로부터 추출된 본래 속성) / **설**계 속성 (업무 규칙화를 위해 새로 만든 코드·일련번호) / **파**생 속성 (다른 속성으로부터 계산된 값, 가급적 적게 정의)\n4. **논리 연산자 우선순위 (`NAO 나오~`)**:\n   - 괄호 `()` ➔ **`1순위 NOT` ➔ `2순위 AND` ➔ `3순위 OR`** (앞글자 따서 **`NAO 나오~`**!)\n5. **NULL 관련 함수 암기법 (`널뛰기` & `같이놀자`)**:\n   - **널뛰기 (`NVL`, `NVL2`, `ISNULL`)**:\n     - `NVL(값1, 값2)` / `ISNULL(값1, 값2)`: 값1이 `NULL`이면 값2, 아니면 값1\n     - `NVL2(값1, 값2, 값3)`: 값1이 **`NULL`이 아니면 값2**, **`NULL`이면 값3** (순서 헷갈리지 말 것!)\n   - **같이놀자 (`NULLIF`, `COALESCE`)**:\n     - `NULLIF(값1, 값2)`: 두 값이 **같으면 `NULL`**, 다르면 **값1** 반환 (\"같으면 널(NULL)이다!\")\n     - `COALESCE(값1, 값2, ...)`: 나열된 값 중 **`NULL`이 아닌 첫 번째 값** 반환\n\n### 2. SQL 기본 핵심 함정 & 정렬(`ORDER BY`) 4대 출제 패턴\n- **SQL 실행 순서**: `FROM` ➔ `WHERE` ➔ `GROUP BY` ➔ `HAVING` ➔ `SELECT` ➔ `ORDER BY`\n- **`SELECT DISTINCT deptno, mgr`**: 두 컬럼 조합이 **모두 같아야** 중복으로 제거됨 (`DISTINCT` 뒤의 모든 컬럼에 걸림).\n- **별칭(`AS`) 규칙**:\n  - `SELECT` 절에서는 `AS` 생략 가능, 별칭에 **공백(띄어쓰기)·특수문자·대소문자 구분**이 필요할 때는 **쌍따옴표(`\"직원 번호\"`)** 사용!\n  - **`FROM` 절 테이블 별칭에는 `AS`를 절대 사용할 수 없음!** (Oracle 기준 에러 발생)\n- **`CONCAT` 함수**: 인수가 **무조건 2개**만 가능! (3개 이상 결합 시 중첩하거나 Oracle `||` / SQL Server `+` 연산자 사용)\n- **`ROWNUM` (Oracle) vs `TOP` (SQL Server) 시험 단골 문제**:\n  ```sql\n  SELECT EMPNO, SAL\n  FROM EMP\n  WHERE ROWNUM <= 3\n  ORDER BY SAL DESC;\n  ```\n  - **함정 해설**: `ORDER BY`는 **가장 마지막**에 실행되므로, 급여 상위 3명이 뽑히는 게 아니라 **무작위로 먼저 읽힌 3명을 뽑은 뒤 그 3명끼리만 급여 내림차순 정렬**함! (진짜 상위 3명을 뽑으려면 인라인 뷰에서 먼저 정렬해야 함)\n- **`ORDER BY` 정렬 4문제 고정 출제 포인트**:\n  1. **정의 및 특성**: 가장 마지막에 실행됨, 소팅(Sorting) 작업으로 성능 저하 가능성, **Oracle은 `NULL`을 무한대(최댓값)**로 취급 / **SQL Server는 `NULL`을 `-무한대`(최솟값)**로 취급.\n  2. **컬럼 번호 정렬**: `ORDER BY 1, 2` 가능하지만, **출력(`SELECT`)되는 컬럼의 개수보다 큰 번호는 사용 불가**!\n  3. **인수 여러 개 정렬**: `ORDER BY SAL DESC, ENAME ASC` (각 컬럼마다 개별 정렬 기준 적용)\n  4. **출력되지 않는 컬럼 정렬**: 일반 `SELECT ENAME FROM EMP ORDER BY SAL;` 처럼 **`SELECT` 절에 없는 컬럼으로도 정렬 가능!** (단, `GROUP BY`나 `DISTINCT`, 집합연산자를 쓴 경우에는 `SELECT`절에 있는 컬럼/집계함수만 가능)\n\n---\n\n## 6-3. 노랭이(`SQL 자격검정 실전문제`) 전 과목 문항별 1줄 킬러 오답노트\n\n> [!WARNING]\n> **노랭이 풀다가 막힐 때 바로 찾아보는 문항 번호별 핵심 해설 (`SQL_자격검정_실전문제.txt` + 노션 `문제 풀이` 통합)**\n> 친구분이 노랭이 전 문항을 풀면서 틀렸거나 헷갈렸던 문항의 **핵심 함정 1줄 요약**입니다.\n\n| 비고 | ﻿ |\n| 비고 | # SQL 자격검정 실전문제 # |\n| 비고 | ------------------------------------------------------------------------------------------------------- |\n| 비고 | 1과목 - (1) |\n| **8번** | 가장 중요한 엔터티 왼쪽 상단에 배치. (왼쪽 상단에서 조금 아래쪽 중앙) |\n| **12번** | 기본, 중심, 행위 |\n| **21번** | 관계명, 관계차수, 관계선택사양 |\n| **26번** | 식별자 특성 암기 |\n| 비고 | 1과목 - (2) |\n| **31번** | 성능 데이터모델링을 하면서 데이터 모델의 구조도 변경될 수 있다. |\n| **36번** | 정규화, 몇:몇 관계 개념 확인 |\n| **37번** | 도메인 원자값 말고도 칼럼의 중복도 1차 정규화 대상 |\n| **38번** | 37번과 동일 (칼럼의 중복 = 1차 정규화 대상) |\n| **40번** | 다량의 데이터 탐색 = 반정규화 보다는 파티셔닝 및 클러스터링 먼저 고려 |\n| **46번** | 논리적으로 하나, 물리적으로 여러개로 분할 ---------------------------- |\n| 비고 | # 교재 문제 및 답지 확인 (유형 파악) # |\n| 비고 | [ 1 과목 ] |\n| 비고 | 26번, 36번, 40번, 46번, 47번 |\n| 비고 | [ 2 과목 ] |\n| 비고 | 7번, 19번, 67번, 73번, 90번, 93번, 95번, 98번, 101번, 109번, 118번, 124번, 136번, 143번 |\n| 비고 | -------------------------------------------------------------------------------------------------------- |\n\n### 📌 친구의 노랭이 단원별 추가 오답 메모 (`문제 풀이` 하위 페이지 발췌)\n- **1과목 1장 (`데이터 모델링의 이해`)**:\n  - **ERD 배치**: 가장 중요한 엔터티는 **왼쪽 상단**에 배치한다.\n  - **UML 클래스 다이어그램 관계**: **연관관계(실선)**는 소스코드에서 **멤버변수**로 선언하여 사용하고, **의존관계(점선)**는 오퍼레이션에서 **파라미터** 등으로 이용한다.\n  - **물리적 독립성**: 물리(내부) 스키마나 파일 저장구조가 변경되어도 개념(논리)/외부 스키마와 응용 프로그램에 영향을 주지 않는다.\n  - **관계 체크사항 4가지**: ① 관심 있는 연관 규칙이 존재하는가? ② 정보의 조합이 발생되는가? ③ 업무기술서·장표에 관계연결 규칙이 서술되어 있는가? ④ 관계연결을 가능하게 하는 **동사(Verb)**가 있는가?\n- **1과목 2장 (`데이터 모델과 SQL`)**:\n  - **정규화 수행 단계**: 개념 데이터 모델이 아니라 **논리 데이터 모델 상세화 과정**의 대표적 활동이다.\n  - **정규화 vs 반정규화**: 정규화는 입력/수정/삭제 성능을 향상시키지만 조인으로 인해 조회 성능이 저하될 수 있고, 반정규화는 데이터 중복을 허용하여 **조회 속도**를 향상시킨다.\n  - **식별관계 vs 비식별관계**: 부모의 식별자를 자식의 주식별자에 포함하면 **식별관계(실선)**, 자식의 일반속성으로 상속하면 **비식별관계(점선)**.\n- **2과목 1장 (`SQL 기본`)**:\n  - **빈 문자열(`''`) 입력 시**: **Oracle**은 `NULL`로 삽입되고(`IS NULL`로 조회), **SQL Server**는 빈 문자열(`''`) 그대로 삽입된다(`= ''`로 조회).\n  - **Oracle 날짜 연산**: `+ 1`은 **1일**, `+ 1/24`은 **1시간**, `+ 1/24/60`은 **1분**, `+ 1/24/(60/10)`은 **10분**을 더한다.\n  - **`CASE` 표현식**: `ELSE` 절을 생략하고 조건을 만족하지 않으면 **`NULL`**이 반환된다.\n  - **순수 관계 연산자 4가지**: `SELECT`(행 선택), `PROJECT`(열 추출), `JOIN`(결합), `DIVIDE`(나누기 — 현재 SQL에는 없음).\n- **2과목 2장 (`SQL 활용`)**:\n  - **집합 연산자와 `ORDER BY`**: 집합 연산자(`UNION` 등)를 사용한 SQL의 `ORDER BY` 절은 최종 결과를 정렬하며, **가장 마지막 줄에 단 한 번만** 사용할 수 있다.\n  - **계층형 질의 (`START WITH` / `WHERE` / `PRIOR` / `ORDER SIBLINGS BY`)**:\n    - `START WITH`에 해당되는 루트 행은 `CONNECT BY` 조건과 상관없이 무조건 출력된다.\n    - `WHERE` 절은 **모든 계층 전개를 진행한 이후** 필터 조건으로서 조건을 만족하는 데이터만 추출한다.\n    - `PRIOR` 키워드는 `SELECT`, `WHERE`, `CONNECT BY` 절 모두에서 사용할 수 있다.\n    - `ORDER SIBLINGS BY`는 **동일한 레벨(형제 노드) 사이에서 정렬**을 수행한다.\n    - **SQL Server의 계층형 질의**: `CTE`(`WITH`절)를 재귀 호출하며, **앵커 멤버(Anchor Member)**를 실행해 기본 결과 집합을 만든 뒤 **재귀 멤버(Recursive Member)**를 반복 실행한다.\n  - **서브쿼리**:\n    - **비연관 서브쿼리**: 서브쿼리가 메인쿼리 컬럼을 가지지 않으며, 주로 메인쿼리에 값을 제공할 목적으로 사용된다.\n    - **연관 서브쿼리**: 서브쿼리가 메인쿼리 컬럼을 포함한다.\n    - **다중 컬럼 서브쿼리**: 여러 컬럼을 동시에 비교하며, **SQL Server에서는 지원하지 않는다**.\n    - **다중 행 비교 연산자(`IN`, `ANY`, `ALL`)**는 단일 행 서브쿼리의 비교 연산자로도 사용할 수 있다 (단, 반대로 단일 행 연산자 `=`, `>` 등을 다중 행 서브쿼리에 쓰면 에러 발생!).\n  - **윈도우 함수**:\n    - `PARTITION BY` 절이 없으면 전체 집합을 하나의 파티션으로 정의한 것과 동일하다.\n    - 윈도우 함수 처리로 인해 **결과 행 건수가 줄어들지 않는다** (`GROUP BY`와의 결정적 차이!).\n    - 윈도우 함수 적용 범위는 `PARTITION` 경계를 넘을 수 없다.\n- **2과목 3장 (`관리 구문`)**:\n  - **`WITH GRANT OPTION` vs `REVOKE`**: `WITH GRANT OPTION`으로 객체 권한을 부여받은 사용자가 제3자에게 부여한 권한은, 원래 권한이 `REVOKE`되면 **연쇄적으로 함께 취소(Cascade)**된다.\n  - **참조 동작 (Delete / Insert Action)**:\n    - **Delete(/Modify) Action**:\n      1. `Cascade`: Master 삭제 시 Child 같이 삭제\n      2. `Set Null`: Master 삭제 시 Child 해당 필드 `NULL` 처리\n      3. `Set Default`: Master 삭제 시 Child 해당 필드 `Default` 값으로 설정\n      4. `Restrict`: Child 테이블에 참조하는 PK 값이 없는 경우만 Master 삭제 허용\n      5. `No Action`: 참조무결성을 위반하는 삭제/수정 액션을 취하지 않음\n    - **Insert Action**:\n      1. `Automatic`: Master 테이블에 PK가 없는 경우 Master PK를 자동 생성 후 Child 입력\n      2. `Set Null`: Master 테이블에 PK가 없는 경우 Child 외래키를 `NULL` 값으로 처리\n      3. `Set Default`: Master 테이블에 PK가 없는 경우 Child 외래키를 지정된 기본값으로 입력\n      4. `Dependent`: Master 테이블에 PK가 존재할 때만 Child 입력 허용\n      5. `No Action`: 참조무결성을 위반하는 입력 액션을 취하지 않음\n\n---\n\n## 6-4. 실제 기출문제 (21회 · 30회 · 34회) 킬러 문항 오답노트\n\n> [!CAUTION]\n> **실제 시험장에서 수험생 절반 이상이 틀린 기출 킬러 문항 족보 (`SQLD_기출문제.txt` 전문 완벽 정리)**\n> 특히 **34회 23번(`HAVING`절 공집합 `COUNT(*)`)**과 **30회 42번(`MERGE`문 내 `DELETE`절 동작 조건)**은 시험 직전에 반드시 읽고 가세요!\n\n| 핵심 정리 | # SQLD 기출문제 # |\n| 핵심 정리 | -------------------------------------------------------------------------------------------- |\n| 핵심 정리 | [ 21회 ] |\n| 핵심 정리 | * 객관식 |\n| **3번** | NOT IN 연산에서 NULL 값이 포함되어 있을 경우, 조건식에 대해 TRUE 리턴 |\n| 핵심 정리 | ( NULL |\n| 핵심 정리 | DELETE |\n| 핵심 정리 | WHEN NOT MATCHED THEN |\n| 핵심 정리 | INSERT(칼럼, 칼럼, 칼럼) VALUES(인수, 인수 인수); |\n| 핵심 정리 | MERGE INTO 구문은 테이블에 데이터를 조회하여 이미 존재하는 키 값이면 |\n| 핵심 정리 | 수정할 데이터를 입력하고, 존재하지 않으면 새로 삽입하게 해주는 구문이다. |\n| 핵심 정리 | * MERGE INTO 구문에서 DELETE 절은 UPDATE 절에 종속된다. |\n| 핵심 정리 | (UPDATE가 실행된 건에 한해서만 DELETE가 동작함) |\n| **47번** | Default 값 = INSERT 문에서 컬럼 명시 없이 삽입 OR 컬럼 명시 후 Default 입력 시 입력되는 값. |\n| 핵심 정리 | (컬럼 명시 후, NULL 입력시, NULL이 입력됨.) |\n| 핵심 정리 | 45 / 50 = 90점 |\n| 핵심 정리 | -------------------------------------------------------------------------------------------- |\n| 핵심 정리 | [ 34회 ] |\n| **7번** | 식별자 관계 : 자식의 주식별자로 상속, NULL값 X, 부모에 종속, 상속받은 주식별자를 |\n| 핵심 정리 | 타 엔터티에 이전 가능 |\n| **12번** | 서브쿼리를 벗어나면 사라지는 값들은 서브쿼리의 SELECT절에 명시되지 않은 칼럼들 뿐. |\n| **16번** | [MERGE JOIN = Sort Merge Join], WHERE절에 EQUI 조건 한 개만 있을 시 Hash 보다 |\n| 핵심 정리 | NL이 반드시 좋다고 할 수 없음. |\n| **23번** | 기본적으로 COUNT(*)시, 결과가 없으면 0이 출력되지만, |\n| 핵심 정리 | 이 문제에서는 HAVING은 GROUP으로 묶어 조건에 만족되는 것들로 결과 집합을 만들어 반환하는데, |\n| 핵심 정리 | 만족하는 것이 없어 아예 반환 자체가 안되기 때문에, 셀 수 있는 구조 자체가 없어 공집합이 반환된다. |\n| **27번** | WHERE절에서 집계함수 사용 불가. (WHERE절의 서브쿼리 내에서는 가능) |\n| **31번** | CROSS JOIN = 왼쪽 테이블의 한 행당 오른쪽 테이블 모든 행 한 번씩 붙여서 출력 (N*M) |\n| 핵심 정리 | OUTER JOIN이랑 전혀 다름. |\n| **33번** | Oracle 에서는 Like 'A%'로 조회 시, 대소문자 구분. (SQL Server는 구분 안함) |\n| **36번** | [ DELETE FROM 테이블명; ]에서 FROM은 생략 가능 → [ DELETE 테이블명; ] 가능 |\n| 핵심 정리 | 전체 칼럼을 명시(INSERT 구문에서 칼럼명 생략)할 경우, Default 값 있더라도 값 입력해야 함. |\n| 핵심 정리 | → 만약 칼럼이 명시된 상태에서 Default 값 주고 싶으면 인수 입력에 Default 입력하면 됨. |\n| **42번** | PARTITION BY 대신 GROUP BY를 사용할 수는 있지만, GROUP BY 되어진 결과 집합 내에서 |\n| 핵심 정리 | WINDOW 함수를 사용하는 것이라 전체 원본 테이블에서 병행 사용이 가능하다고 보기는 힘듦. |\n| 핵심 정리 | 명확하지 않은 표현이기 떄문에 적절하지 않은 것 맞음. |\n| **47번** | CTE(Common Table Expression)를 재귀 호출함으로써 상위부터 하위 방향 전개 |\n| 핵심 정리 | WITH 테이블명_ANCHOR AS |\n| 핵심 정리 | ( SELECT 하위칼럼명, 칼럼명, 상위칼럼명, 0 AS LEVEL |\n| 핵심 정리 | FROM 테이블명 |\n| 핵심 정리 | WHERE 상위칼럼명 IS NULL /* 재귀 호출의 시작점 */ |\n| 핵심 정리 | UNION ALL |\n| 핵심 정리 | SELECT R.칼럼명, R.칼럼명, R.계층칼럼명, A.LEVEL + 1 |\n| 핵심 정리 | FROM 테이블명_ANCHOR A, 테이블명 R |\n| 핵심 정리 | WHERE A.하위칼럼 = R.상위칼럼 ) |\n| 핵심 정리 | 48 / 50 = 96점 |\n| 핵심 정리 | -------------------------------------------------------------------------------------------- |\n\n---\n\n---\n\n## 6-5. 2024 개정 신유형 핵심 요약 (`PIVOT` / `UNPIVOT` / 정규표현식 `REGEXP`)\n\n> [!IMPORTANT]\n> **2024년 개정 SQLD부터 출제 비중이 대폭 강화된 신유형 3대장 요약**\n\n### 1. `PIVOT` 절 (행 ➔ 열 변환, 데이터 가로 펼치기)\n```sql\nSELECT *\nFROM (\n    SELECT 부서명, 직책, 급여\n    FROM 사원\n)\nPIVOT (\n    SUM(급여)\n    FOR 직책 IN ('사원' AS 사원급여, '대리' AS 대리급여, '과장' AS 과장급여)\n);\n```\n- **핵심 규칙**: `PIVOT` 절에 명시되지 않은 나머지 컬럼(`부서명`)이 자동으로 그룹화(`GROUP BY`) 기준 컬럼이 된다!\n\n### 2. `UNPIVOT` 절 (열 ➔ 행 변환, 데이터 세로 모으기)\n```sql\nSELECT 부서명, 분기, 매출액\nFROM 매출테이블\nUNPIVOT (\n    매출액 FOR 분기 IN (Q1, Q2, Q3, Q4)\n);\n```\n- **핵심 규칙**: 기본적으로 값이 `NULL`인 행은 결과에서 제외(`EXCLUDE NULLS`)되며, `NULL` 행까지 출력하려면 `UNPIVOT INCLUDE NULLS (...)` 옵션을 사용한다.\n\n### 3. 정규 표현식 (`Regular Expression`) 핵심 메타문자\n| 메타문자 | 의미 | 대표 예시 및 일치 문자열 |\n| :---: | :--- | :--- |\n| **`.`** | 임의의 **문자 1개**와 일치 | `a.c` ➔ `'abc'`, `'a1c'` 일치 (`'ac'` 불일치) |\n| **`^`** | 문자열의 **시작** (대괄호 `[^...]` 안에서는 **부정 NOT**!) | `^abc` ➔ `'abc'`로 시작하는 문자열 / `[^0-9]` ➔ 숫자가 아닌 문자 |\n| **`$`** | 문자열의 **끝** | `abc$` ➔ `'abc'`로 끝나는 문자열 |\n| **`*`** | 앞 문자가 **0회 이상** 반복 | `ab*c` ➔ `'ac'`, `'abc'`, `'abbc'` 모두 일치 |\n| **`+`** | 앞 문자가 **1회 이상** 반복 | `ab+c` ➔ `'abc'`, `'abbc'` 일치 (`'ac'` 불일치!) |\n| **`?`** | 앞 문자가 **0회 또는 1회** 등장 | `ab?c` ➔ `'ac'`, `'abc'` 일치 (`'abbc'` 불일치) |\n| **`{m,n}`** | 앞 문자가 **최소 m회 ~ 최대 n회** 반복 | `a{2,4}` ➔ `'aa'`, `'aaa'`, `'aaaa'` 일치 |\n| **`[abc]`** | 괄호 안의 문자 중 **하나라도** 일치 | `[0-9]` (숫자), `[a-zA-Z]` (영문자) |\n\n---\n\n## 6-6. 친구 공유 홍쌤 1과목 핵심 슬라이드 & 시각 자료 모음 (70장 전수 수록)\n\n![친구 공유 홍쌤 강의 핵심 슬라이드 1](images/friend_img_01.png)\n\n![친구 공유 홍쌤 강의 핵심 슬라이드 2](images/friend_img_02.png)\n\n![친구 공유 홍쌤 강의 핵심 슬라이드 3](images/friend_img_03.png)\n\n![친구 공유 홍쌤 강의 핵심 슬라이드 4](images/friend_img_04.png)\n\n![친구 공유 홍쌤 강의 핵심 슬라이드 5](images/friend_img_05.png)\n\n![친구 공유 홍     let currentChapterIdx = 0;
    let viewAllInSubject = false;
    let currentFontSize = 16;

    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("open");
    }

    function toggleTheme() {
      const doc = document.documentElement;
      const isDark = doc.getAttribute("data-theme") === "dark";
      doc.setAttribute("data-theme", isDark ? "light" : "dark");
      document.getElementById("theme-btn").textContent = isDark ? "🌙 다크" : "☀️ 라이트";
    }

    function changeFontSize(delta) {
      currentFontSize = Math.min(22, Math.max(13, currentFontSize + delta));
      document.body.style.fontSize = currentFontSize + "px";
    }

    function toggleViewMode() {
      viewAllInSubject = !viewAllInSubject;
      const btn = document.getElementById("mode-btn");
      btn.textContent = viewAllInSubject ? "📜 과목 연속 보기 중" : "📖 단원별 집중 보기";
      btn.classList.toggle("active", viewAllInSubject);
      renderReader();
    }

    function selectSubject(subjId) {
      document.querySelectorAll(".subj-tab").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.subj === subjId);
      });
      const firstIdx = CHAPTERS.findIndex(c => c.subj_id === subjId);
      if (firstIdx !== -1) {
        currentChapterIdx = firstIdx;
        renderSidebar(document.getElementById("search-box").value);
        renderReader();
      }
    }

    function selectChapter(idx) {
      currentChapterIdx = idx;
      const ch = CHAPTERS[idx];
      document.querySelectorAll(".subj-tab").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.subj === ch.subj_id);
      });
      document.getElementById("sidebar").classList.remove("open");
      renderSidebar(document.getElementById("search-box").value);
      renderReader();
    }

    function filterChapters(query) {
      renderSidebar(query);
    }

    function renderSidebar(query = "") {
      const listEl = document.getElementById("chapter-list");
      listEl.innerHTML = "";
      const q = query.trim().toLowerCase();
      let lastSubj = "";

      CHAPTERS.forEach((ch, idx) => {
        if (q && !ch.title.toLowerCase().includes(q) && !ch.md.toLowerCase().includes(q)) {
          return;
        }
        if (ch.subj_name !== lastSubj) {
          lastSubj = ch.subj_name;
          const groupTitle = document.createElement("div");
          groupTitle.className = "subj-group-title";
          groupTitle.textContent = lastSubj;
          listEl.appendChild(groupTitle);
        }
        const btn = document.createElement("button");
        btn.className = "ch-item" + (idx === currentChapterIdx ? " active" : "");
        btn.onclick = () => selectChapter(idx);
        btn.innerHTML = `<span class="ch-num">${String(idx).padStart(2, '0')}</span><span>${ch.title.replace(/^\d-\d-\d\.\s*/, '')}</span>`;
        listEl.appendChild(btn);
      });
    }

    function enhanceRenderedCard(cardEl) {
      // Wrap tables for horizontal scroll on mobile
      cardEl.querySelectorAll("table").forEach(tbl => {
        if (!tbl.parentElement.classList.contains("table-wrap")) {
          const wrap = document.createElement("div");
          wrap.className = "table-wrap";
          tbl.parentNode.insertBefore(wrap, tbl);
          wrap.appendChild(tbl);
        }
      });

      // Style headings (STEP 1, STEP 2) and build quick jump pills
      const headings = cardEl.querySelectorAll("h2");
      const jumpBar = cardEl.querySelector(".sec-jump-bar");
      if (headings.length > 1 && jumpBar) {
        headings.forEach((h, i) => {
          const hid = "h2-" + i + "-" + Math.random().toString(36).slice(2, 6);
          h.id = hid;
          if (h.textContent.includes("STEP 1") || h.textContent.includes("핵심 개념")) {
            h.classList.add("step1-heading");
          } else if (h.textContent.includes("STEP 2") || h.textContent.includes("상세 출제")) {
            h.classList.add("step2-heading");
          }
          const a = document.createElement("a");
          a.className = "sec-pill";
          a.href = "#" + hid;
          a.textContent = h.textContent.replace(/^\[|\]$/g, "");
          jumpBar.appendChild(a);
        });
      } else if (jumpBar) {
        jumpBar.style.display = "none";
      }

      // Style callout blockquotes
      cardEl.querySelectorAll("blockquote").forEach(bq => {
        const html = bq.innerHTML;
        if (html.includes("[!SUMMARY]")) {
          bq.classList.add("callout-summary");
        } else if (html.includes("[!CAUTION]")) {
          bq.classList.add("callout-danger");
        } else if (html.includes("[!WARNING]")) {
          bq.classList.add("callout-warn");
        }
        bq.innerHTML = html
          .replace(/\[!SUMMARY\]/g, "")
          .replace(/\[!IMPORTANT\]/g, "<strong>💡 [핵심 필수 암기]</strong><br>")
          .replace(/\[!WARNING\]/g, "<strong>⚠️ [시험 단골 함정 주의]</strong><br>")
          .replace(/\[!CAUTION\]/g, "<strong>🚨 [절대 주의 / 킬러 포인트]</strong><br>")
          .replace(/\[!TIP\]/g, "<strong>🍯 [실전 합격 꿀팁]</strong><br>")
          .replace(/\[!NOTE\]/g, "<strong>📌 [참고 안내]</strong><br>");
      });

      // Syntax highlighting + Copy button
      cardEl.querySelectorAll("pre code").forEach(block => {
        if (window.hljs) {
          hljs.highlightElement(block);
        }
        const pre = block.parentElement;
        const btn = document.createElement("button");
        btn.className = "copy-btn";
        btn.textContent = "SQL 복사";
        btn.onclick = () => {
          navigator.clipboard.writeText(block.textContent);
          btn.textContent = "✓ 복사됨!";
          setTimeout(() => btn.textContent = "SQL 복사", 1500);
        };
        pre.appendChild(btn);
      });

      // Image click-to-zoom lightbox
      cardEl.querySelectorAll("img").forEach(img => {
        img.loading = "lazy";
        img.onclick = () => {
          document.getElementById("lightbox-img").src = img.src;
          document.getElementById("lightbox").style.display = "flex";
        };
      });
    }

    function renderReader() {
      const container = document.getElementById("reader-container");
      container.innerHTML = "";
      const currentCh = CHAPTERS[currentChapterIdx];
      const targetChapters = viewAllInSubject
        ? CHAPTERS.filter(c => c.subj_id === currentCh.subj_id)
        : [currentCh];

      targetChapters.forEach(ch => {
        const card = document.createElement("article");
        card.className = "chapter-card";

        const prevCh = ch.index > 0 ? CHAPTERS[ch.index - 1] : null;
        const nextCh = ch.index < CHAPTERS.length - 1 ? CHAPTERS[ch.index + 1] : null;

        const parsedHtml = window.marked
          ? marked.parse(ch.md, { gfm: true, breaks: false })
          : "<pre>" + ch.md + "</pre>";

        let navFooterHtml = `<div class="chapter-nav-footer">`;
        if (prevCh) {
          navFooterHtml += `<button class="nav-card-btn prev" onclick="selectChapter(${prevCh.index})">
            <span class="nav-label">◀ 이전 단원</span>
            <span class="nav-title">${prevCh.title}</span>
          </button>`;
        } else {
          navFooterHtml += `<div></div>`;
        }
        if (nextCh) {
          navFooterHtml += `<button class="nav-card-btn next" onclick="selectChapter(${nextCh.index})">
            <span class="nav-label">다음 단원 ▶</span>
            <span class="nav-title">${nextCh.title}</span>
          </button>`;
        }
        navFooterHtml += `</div>`;

        card.innerHTML = `
          <div class="chapter-meta-bar">
            <span class="chapter-badge">📚 ${ch.badge}</span>
            <span class="chapter-progress">전체 진도: ${ch.index + 1} / ${CHAPTERS.length} 단원</span>
          </div>
          <div class="sec-jump-bar"><span style="font-size:12px;font-weight:700;color:var(--fg-muted);align-self:center;margin-right:4px;">⚡ 단원 내 빠른 이동:</span></div>
          <div class="chapter-body">${parsedHtml}</div>
          ${navFooterHtml}
        `;

        enhanceRenderedCard(card);
        container.appendChild(card);
      });

      document.getElementById("main").scrollTop = 0;
    }

    window.addEventListener("DOMContentLoaded", () => {
      renderSidebar();
      renderReader();
    });
  </script>
</body>
</html>
