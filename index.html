<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>🏆 2024 개정판 SQLD 단기 합격 마스터북 (희호님 전용 올인원 교재)</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/sql.min.js"></script>
<style>
  :root {
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --fg: #0f172a;
    --fg-muted: #475569;
    --sidebar-bg: #ffffff;
    --header-bg: #0f172a;
    --header-fg: #ffffff;
    --border: #e2e8f0;
    --accent: #2563eb;
    --accent-soft: #eff6ff;
    --accent-hover: #1d4ed8;
    --step1-bg: #f0fdf4;
    --step1-border: #16a34a;
    --step1-fg: #15803d;
    --step2-bg: #eff6ff;
    --step2-border: #2563eb;
    --step2-fg: #1d4ed8;
    --summary-bg: #fefce8;
    --summary-border: #ca8a04;
    --warn-bg: #fff7ed;
    --warn-border: #ea580c;
    --danger-bg: #fef2f2;
    --danger-border: #dc2626;
    --code-bg: #0f172a;
    --table-head: #f1f5f9;
    --table-stripe: #f8fafc;
    --shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06);
  }
  [data-theme="dark"] {
    --bg: #0b0f19;
    --card-bg: #111827;
    --fg: #f1f5f9;
    --fg-muted: #94a3b8;
    --sidebar-bg: #111827;
    --header-bg: #030712;
    --header-fg: #f8fafc;
    --border: #1e293b;
    --accent: #3b82f6;
    --accent-soft: #1e293b;
    --accent-hover: #60a5fa;
    --step1-bg: #052e16;
    --step1-border: #22c55e;
    --step1-fg: #4ade80;
    --step2-bg: #172554;
    --step2-border: #3b82f6;
    --step2-fg: #60a5fa;
    --summary-bg: #272009;
    --summary-border: #eab308;
    --warn-bg: #2a1205;
    --warn-border: #f97316;
    --danger-bg: #2d0a0a;
    --danger-border: #ef4444;
    --code-bg: #030712;
    --table-head: #1e293b;
    --table-stripe: #0f172a;
    --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.4);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.75;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    font-size: 16px;
  }

  /* Top Header & Subject Tabs */
  #top-header {
    background: var(--header-bg);
    color: var(--header-fg);
    border-bottom: 1px solid var(--border);
    z-index: 100;
    flex-shrink: 0;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    gap: 12px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 17px;
    letter-spacing: -0.3px;
    white-space: nowrap;
  }
  #menu-toggle {
    display: none;
    background: rgba(255,255,255,0.12);
    border: none;
    color: #fff;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header-btn {
    background: rgba(255,255,255,0.12);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.18);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .header-btn:hover, .header-btn.active {
    background: var(--accent);
    border-color: var(--accent);
  }
  #subject-tabs {
    display: flex;
    overflow-x: auto;
    background: rgba(255,255,255,0.04);
    padding: 0 16px;
    gap: 4px;
    scrollbar-width: none;
  }
  #subject-tabs::-webkit-scrollbar { display: none; }
  .subj-tab {
    padding: 10px 14px;
    color: #cbd5e1;
    font-size: 13.5px;
    font-weight: 600;
    border: none;
    background: transparent;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .subj-tab:hover {
    color: #fff;
    background: rgba(255,255,255,0.05);
  }
  .subj-tab.active {
    color: #fff;
    border-bottom-color: #60a5fa;
    background: rgba(59, 130, 246, 0.18);
  }

  /* Workspace Layout */
  #workspace {
    display: flex;
    flex: 1;
    overflow: hidden;
    position: relative;
  }
  #sidebar {
    width: 310px;
    min-width: 290px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100%;
    z-index: 50;
  }
  .sidebar-search {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }
  #search-box {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--fg);
    font-size: 13.5px;
    outline: none;
  }
  #search-box:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }
  #chapter-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
  }
  .subj-group-title {
    font-size: 11.5px;
    font-weight: 800;
    text-transform: uppercase;
    color: var(--fg-muted);
    padding: 10px 10px 4px 10px;
    letter-spacing: 0.4px;
  }
  .ch-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    text-align: left;
    padding: 9px 12px;
    border: none;
    background: transparent;
    color: var(--fg);
    font-size: 13.5px;
    font-weight: 500;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 2px;
    transition: all 0.12s;
  }
  .ch-item:hover {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .ch-item.active {
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.28);
  }
  .ch-num {
    font-size: 11.5px;
    opacity: 0.75;
    min-width: 24px;
  }

  /* Main Textbook Area */
  #main {
    flex: 1;
    overflow-y: auto;
    padding: 28px 36px 90px 36px;
    scroll-behavior: smooth;
  }
  #reader-container {
    max-width: 920px;
    margin: 0 auto;
  }
  .chapter-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 44px;
    box-shadow: var(--shadow);
    margin-bottom: 32px;
  }
  .chapter-meta-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
    padding-bottom: 14px;
    border-bottom: 1px dashed var(--border);
  }
  .chapter-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 700;
    font-size: 13px;
    padding: 5px 12px;
    border-radius: 999px;
  }
  .chapter-progress {
    font-size: 13px;
    color: var(--fg-muted);
    font-weight: 600;
  }
  .sec-jump-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 14px 0 24px 0;
    padding: 12px;
    background: var(--bg);
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .sec-pill {
    font-size: 12.5px;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 6px;
    background: var(--card-bg);
    color: var(--fg);
    border: 1px solid var(--border);
    text-decoration: none;
    transition: all 0.12s;
  }
  .sec-pill:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }

  /* Typography inside Textbook */
  .chapter-card h1 {
    font-size: 28px;
    font-weight: 800;
    margin: 0 0 16px 0;
    color: var(--fg);
    line-height: 1.3;
    letter-spacing: -0.5px;
  }
  .chapter-card h2 {
    font-size: 20px;
    font-weight: 800;
    margin: 38px 0 14px 0;
    padding: 10px 16px;
    border-radius: 10px;
    background: var(--table-head);
    border-left: 5px solid var(--accent);
    color: var(--fg);
  }
  .chapter-card h2.step1-heading {
    background: var(--step1-bg);
    border-left-color: var(--step1-border);
    color: var(--step1-fg);
  }
  .chapter-card h2.step2-heading {
    background: var(--step2-bg);
    border-left-color: var(--step2-border);
    color: var(--step2-fg);
  }
  .chapter-card h3 {
    font-size: 17.5px;
    font-weight: 700;
    margin: 28px 0 10px 0;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .chapter-card h4 {
    font-size: 16px;
    font-weight: 700;
    margin: 22px 0 8px 0;
    color: var(--fg);
  }
  .chapter-card p, .chapter-card li {
    font-size: 1em;
    color: var(--fg);
  }
  .chapter-card ul, .chapter-card ol {
    padding-left: 22px;
  }
  .chapter-card li {
    margin-bottom: 6px;
  }

  /* Tables */
  .table-wrap {
    overflow-x: auto;
    margin: 18px 0;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 14.5px;
    margin: 0;
  }
  th, td {
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    padding: 11px 14px;
    text-align: left;
    vertical-align: middle;
  }
  th:last-child, td:last-child { border-right: none; }
  tr:last-child td { border-bottom: none; }
  th {
    background: var(--table-head);
    font-weight: 700;
    color: var(--fg);
  }
  tr:nth-child(even) td {
    background: var(--table-stripe);
  }

  /* Code Blocks */
  pre {
    position: relative;
    background: var(--code-bg);
    color: #f8fafc;
    padding: 16px 20px;
    border-radius: 10px;
    overflow-x: auto;
    font-size: 14px;
    line-height: 1.6;
    margin: 16px 0;
    border: 1px solid #1e293b;
  }
  code {
    font-family: "JetBrains Mono", Consolas, "Courier New", monospace;
    background: rgba(37, 99, 235, 0.1);
    color: var(--accent);
    padding: 2px 6px;
    border-radius: 5px;
    font-size: 0.9em;
    font-weight: 600;
  }
  pre code {
    background: none;
    color: inherit;
    padding: 0;
    font-weight: 400;
  }
  .copy-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(255,255,255,0.14);
    color: #e2e8f0;
    border: none;
    padding: 4px 10px;
    border-radius: 5px;
    font-size: 12px;
    cursor: pointer;
  }
  .copy-btn:hover { background: rgba(255,255,255,0.28); }

  /* Callouts */
  blockquote {
    margin: 18px 0;
    padding: 16px 20px;
    border-left: 5px solid var(--accent);
    background: var(--accent-soft);
    border-radius: 0 12px 12px 0;
  }
  blockquote p:first-child { margin-top: 0; }
  blockquote p:last-child { margin-bottom: 0; }
  blockquote.callout-summary {
    border-left-color: var(--summary-border);
    background: var(--summary-bg);
  }
  blockquote.callout-warn {
    border-left-color: var(--warn-border);
    background: var(--warn-bg);
  }
  blockquote.callout-danger {
    border-left-color: var(--danger-border);
    background: var(--danger-bg);
  }

  /* Images & Lightbox */
  .chapter-card img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 18px auto;
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    background: #ffffff;
    padding: 6px;
    cursor: zoom-in;
    transition: transform 0.15s;
  }
  .chapter-card img:hover {
    transform: scale(1.01);
  }
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 20px;
    cursor: zoom-out;
  }
  #lightbox img {
    max-width: 96vw;
    max-height: 94vh;
    border-radius: 8px;
    background: #fff;
    padding: 6px;
  }

  /* Chapter Prev/Next Footer */
  .chapter-nav-footer {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    margin-top: 36px;
    padding-top: 24px;
    border-top: 2px solid var(--border);
  }
  .nav-card-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 14px 18px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
  }
  .nav-card-btn.next { text-align: right; }
  .nav-card-btn:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
    transform: translateY(-2px);
  }
  .nav-label {
    font-size: 12px;
    color: var(--fg-muted);
    font-weight: 700;
    margin-bottom: 4px;
  }
  .nav-title {
    font-size: 15px;
    font-weight: 800;
    color: var(--accent);
  }

  hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 32px 0;
  }

  /* Mobile Responsive */
  @media (max-width: 900px) {
    #menu-toggle { display: inline-block; }
    #sidebar {
      position: fixed;
      top: 90px;
      left: 0;
      bottom: 0;
      transform: translateX(-105%);
      transition: transform 0.25s ease;
      box-shadow: 4px 0 24px rgba(0,0,0,0.25);
    }
    #sidebar.open {
      transform: translateX(0);
    }
    #main {
      padding: 16px 12px 80px 12px;
    }
    .chapter-card {
      padding: 20px 16px;
      border-radius: 12px;
    }
    .chapter-card h1 { font-size: 22px; }
    .chapter-card h2 { font-size: 17.5px; padding: 8px 12px; }
  }
</style>
</head>
<body>
  <header id="top-header">
    <div class="header-row">
      <div class="brand">
        <button id="menu-toggle" onclick="toggleSidebar()">☰ 목차</button>
        <span>🏆 2024 SQLD 단기 합격 마스터북</span>
      </div>
      <div class="header-actions">
        <button id="mode-btn" class="header-btn" onclick="toggleViewMode()" title="단원별 집중 보기 / 과목 전체 연속 보기 전환">📖 단원별 집중 보기</button>
        <button class="header-btn" onclick="changeFontSize(1)">가+</button>
        <button class="header-btn" onclick="changeFontSize(-1)">가-</button>
        <button id="theme-btn" class="header-btn" onclick="toggleTheme()">🌙 다크</button>
      </div>
    </div>
    <nav id="subject-tabs">
      <button class="subj-tab active" data-subj="tab0" onclick="selectSubject('tab0')">🏠 0. 합격로드맵·오타교정</button>
      <button class="subj-tab" data-subj="tab1" onclick="selectSubject('tab1')">📘 1과목: 데이터 모델링 (10단원)</button>
      <button class="subj-tab" data-subj="tab2" onclick="selectSubject('tab2')">📗 2과목 1장: SQL 기본 (8단원)</button>
      <button class="subj-tab" data-subj="tab3" onclick="selectSubject('tab3')">📙 2과목 2장: SQL 활용 (8단원)</button>
      <button class="subj-tab" data-subj="tab4" onclick="selectSubject('tab4')">📕 2과목 3장: 관리 구문 (4단원)</button>
      <button class="subj-tab" data-subj="tab5" onclick="selectSubject('tab5')">🎯 노랭이·기출 킬러 족보</button>
      <button class="subj-tab" data-subj="tab6" onclick="selectSubject('tab6')">⚡ 시험 직전 30초 총정리</button>
    </nav>
  </header>

  <div id="workspace">
    <aside id="sidebar">
      <div class="sidebar-search">
        <input type="text" id="search-box" placeholder="🔍 전 범위 키워드/단원 즉시 검색..." oninput="filterChapters(this.value)">
      </div>
      <div id="chapter-list"></div>
    </aside>

    <main id="main">
      <div id="reader-container"></div>
    </main>
  </div>

  <div id="lightbox" onclick="this.style.display='none'">
    <img id="lightbox-img" src="" alt="확대 이미지">
  </div>

  <script>
    const CHAPTERS = [{"id": "ch-00", "index": 0, "title": "🏆 2024 개정판 SQLD 단기 합격 마스터북 (전 범위 완벽 통합 교본)", "subj_id": "tab0", "subj_name": "0. 합격전략 · 오타교정", "badge": "합격 가이드", "md": "# 🏆 2024 개정판 SQLD 단기 합격 마스터북 (전 범위 완벽 통합 교본)\n\n> **희호님을 위한 맞춤형 올인원(All-in-One) 수험서**\n> 본 교재는 다음 3가지 핵심 원본 자료의 모든 텍스트, 표, ERD 도식, SQL 예제, 실행 결과 이미지(총 **347개 원본 고화질 도표·캡처 수록**)를 **단 하나의 누락도 없이** 2024년 개정 출제 기준에 맞춰 완벽하게 통합·교정한 출판급 마스터 교재입니다.\n> 1. **`2024개정판_SQLD_개념정리.pdf` (103쪽 전 범위)**: 국민대 김남규 교수님 + 홍쌤의 데이터랩 강의 기반 핵심 필기 및 347개 시각 자료(ERD, 테이블, SQL 실행 결과) 전수 수록 (`범위 X`로 표시된 구버전 비출제 요소는 명확히 분리/배제)\n> 2. **`SQLD_2과목_SQL 기본(워터마크 O).pdf` (11쪽 핵심 요약)**: 2과목 1장 SQL 기본의 필수 암기 포인트 통합 및 **치명적 오타 3건 완벽 교정 완료**\n> 3. **`SQLD_전범위_이론정리_SQLD양파.pdf` (258쪽 분량 전 30개 챕터 + 시험 직전 부록)**: 개념 구조도, 단계별 SQL 트레이스, `Before & After` 비교표, 시험 출제 포인트, `30초 시험 직전 정리` 전량 통합\n\n---\n\n## 📅 0. 희호님 맞춤형 D-8 (11/6 ~ 11/14) 초단기 합격 로드맵 & 노랭이 학습법\n\n### 🎯 SQLD 시험 핵심 스펙 및 합격 기준\n- **문항 수 및 배점**: 총 **50문항** (객관식 45문항 + 단답형 최대 5문항, 문항당 2점 = 100점 만점)\n  - **1과목 (데이터 모델링의 이해)**: 10문항 (20점) — *4문항 이하 득점 시(8점 이하) 과락(40% 미만)*\n  - **2과목 (SQL 기본 및 활용)**: 40문항 (80점) — *16문항 이하 득점 시(32점 이하) 과락(40% 미만)*\n- **합격 기준**: **총점 60점 이상** (50문제 중 **30문제 이상** 정답) & **과목별 40% 미만 과락 없을 것**\n- **시험 시간**: **90분** (마킹 시간 포함, 1문항당 평균 1.8분)\n\n| 1단계: 개념 속독 | ➔ | 2단계: 노랭이 풀이 | ➔ | 3단계: 3대 함정 정복 | ➔ | 4단계: 직전 30초 요약 |\n| :---: | :---: | :---: | :---: | :---: | :---: | :---: |\n| **핵심 요약 & 비교표 중심**<br>빠르게 1회독 흐름 잡기 | | **직접 고민보다 해설 역추적**<br>출제위원 함정 패턴 파악 | | **`NULL` 연산 / `ROWNUM` 정렬**<br>**`ON` vs `WHERE` 조건 위치** | | **단원별 30초 요약 카드**<br>**60점 이상 안정권 합격!** |\n\n### 🗓️ D-8 일자별 실전 스케줄 (11/6 목 ~ 11/14 금)\n\n| 일자 | D-Day | 핵심 학습 목표 및 범위 | 노랭이(`SQL 자격검정 실전문제`) 병행 전략 |\n| :--- | :---: | :--- | :--- |\n| **11/6 (목)** | **D-8** | **1과목 전 범위 마스터** (`1-1-1` ~ `1-2-5`: 엔터티·속성·관계·식별자·정규화·반정규화) | 1과목 전체 문제 풀기 (이론 암기만으로 10문제 중 8문제 이상 확보 가능! 과락 완벽 방어) |\n| **11/7 (금)** | **D-7** | **2과목 1장 절반** (`2-1-1` RDB 개요 ~ `2-1-4` WHERE절, 단일행 함수, `NULL` 연산 총정리) | 2과목 1장 초반부 (함수 결과값 예측, `NULL` 사칙연산/비교연산 함정 체크) |\n| **11/8 (토)** | **D-6** | **2과목 1장 완주** (`2-1-5` GROUP BY/HAVING ~ `2-1-8` 조인 & 표준 조인 `ON` vs `WHERE`) | 2과목 1장 완주 (주말 집중 투자! 조인 결과 건수, `LEFT OUTER JOIN` 조건 위치 구분) |\n| **11/9 (일)** | **D-5** | **2과목 2장 핵심 1** (`2-2-1` 서브쿼리, `2-2-2` 집합연산자, `2-2-3` 그룹함수 `ROLLUP/CUBE/GROUPING SETS`) | 2과목 2장 전반부 (`NOT IN` vs `NOT EXISTS` NULL 함정, `ROLLUP`/`CUBE` 결과 행 개수 공식) |\n| **11/10 (월)** | **D-4** | **2과목 2장 핵심 2** (`2-2-4` 윈도우 함수, `2-2-5` Top N 쿼리, `2-2-6` 계층형 질의, `2-2-7` PIVOT, `2-2-8` 정규표현식) | 2과목 2장 후반부 (2024 개정 강화 파트인 `PIVOT/UNPIVOT`, `REGEXP_*` 함수 문법 집중 점검) |\n| **11/11 (화)** | **D-3** | **2과목 3장 완주** (`2-3-1` DML, `2-3-2` TCL, `2-3-3` DDL, `2-3-4` DCL 권한 부여/회수) | 2과목 3장 문제 (`DELETE/TRUNCATE/DROP` 비교, `WITH GRANT OPTION` vs `WITH ADMIN OPTION`) |\n| **11/12 (수)** | **D-2** | **노랭이 1회독 오답 정복 (1과목 + 2과목 1장)** | 틀린 문제와 찍어서 맞힌 문제만 해설 정독 후 본 마스터북 해당 챕터의 `[시험 출제 포인트]` 재확인 |\n| **11/13 (목)** | **D-1** | **노랭이 1회독 오답 정복 (2과목 2장 + 3장) & 유튜브 기출특강 1편** | 모르는 킬러 문제(복잡한 쿼리 길이 30줄짜리)는 과감히 버리고, 빈출 유형 정답 패턴 각인 |\n| **11/14 (금)** | **D-Day Eve** | **본 교재 부록 `[시험 당일 핵심 총정리]` & 각 챕터 `[30초 시험 직전 정리]` 통독** | 새로운 문제 풀이 중단! 헷갈리는 암기표(`IE vs Barker`, `정규화`, `윈도우 프레임`, `DDL/DML/TCL`)만 복습 후 숙면 |\n\n---\n\n### 💡 노랭이(`SQL 자격검정 실전문제`) 200% 효율 학습 꿀팁 (시간 절약 비법)\n\n> 🍯 **[실전 합격 꿀팁]**\n> **노랭이는 '시험장 난이도보다 상위 20% 더 꼬아놓은 모의훈련장'입니다!**\n> 1. **1문항당 2분 이상 고민 금지**: 쿼리가 한 페이지를 넘어가거나 처음 보는 유형이면 고민하지 말고 바로 **해설지**를 펴세요. 노랭이는 \"내가 스스로 풀어내는 능력\"을 테스트하는 용도가 아니라, **\"출제위원이 어디에 함정을 파는지 해설을 통해 스포일러 당하는 책\"**으로 써야 8일 만에 끝납니다.\n> 2. **4지선다 오답 소거법 훈련**:\n>    - 보기 1, 2, 3, 4번의 SQL 문을 위에서 아래로 다 읽지 마세요! **보기끼리 다른 부분(Diff)**만 형광펜으로 밑줄 그어 비교하세요. (예: ①번은 `WHERE`절에 조건이 있고, ②번은 `ON`절에 조건이 있다면 100% **Outer Join 조건 위치 함정** 문제입니다.)\n> 3. **2024 개정 이후 제외된 구버전 문제 스킵**:\n>    - 노랭이 구판/개정판에 일부 남아있는 **옵티마이저(CBO/RBO), 인덱스 스캔(Index Range Scan 등), 조인 수행 원리(NL Join, Sort Merge Join, Hash Join), 실행계획(Execution Plan) 해석** 문제는 2024년 개정부터 **SQLD 범위에서 완전히 삭제(SQLP 범위로 이동)**되었습니다. 과감히 X표 치고 넘어가세요!\n\n---\n\n### 🚨 원본 요약본(`SQLD_2과목_SQL 기본.pdf`) 치명적 오타 3건 완벽 교정표\n\n> 🚨 **[절대 주의 / 원본 오타 교정]**\n> 기존에 가지고 계시던 11쪽짜리 `SQLD_2과목_SQL 기본(워터마크 O).pdf` 요약본에 있던 **시험에 그대로 외우면 틀리는 치명적 오타 3군데**를 찾아내어 본 교재 본문에는 모두 **올바른 정답**으로 교정 반영했습니다.\n\n| 번호 | 위치 (단원) | 기존 PDF의 잘못된 표기 (❌ 오타) | 본 마스터북 교정 내용 (⭕ 정답) | 핵심 이유 (시험 포인트) |\n| :---: | :--- | :--- | :--- | :--- |\n| **1** | 2과목 1장 함수 (`ROUND`) | `ROUND(163.76, -1)` → **`163`** | `ROUND(163.76, -1)` → **`160`** | 두 번째 인자가 **`-1`이면 소수점 첫째 자리가 아니라 '일의 자리(10의 -1승 역방향)'에서 반올림**하여 십의 자리까지 나타냅니다 (`3`에서 반올림하므로 `160`). 참고로 `TRUNC(163.76, -1)` 역시 `160`입니다. |\n| **2** | 2과목 1장 함수 (NULL 함수) | `COALESECE(값1, 값2, ...)` | **`COALESCE(값1, 값2, ...)`** | 단답형 빈칸 문제에서 철자 실수 주의! `S`와 `C` 사이에 `E`가 들어가지 않습니다 (`COAL-ES-CE`). 처음으로 `NULL`이 아닌 값을 반환합니다. |\n| **3** | 2과목 1장 GROUP BY / 집계함수 | `COUNT(DISTRICT 컬럼)` | **`COUNT(DISTINCT 컬럼)`** | 중복을 제거한 행의 개수를 셀 때 사용하는 키워드는 지역(District)이 아니라 구별되는(**`DISTINCT`**)입니다! |\n\n---\n\n## 📑 전체 목차 (전 30개 챕터 + D-8 합격 로드맵 + 시험 당일 빈출 함정 부록)\n\n1. **[00. 희호님 맞춤형 D-8 초단기 합격 로드맵 & 노랭이 200% 활용법 & 원본 오타 3건 교정표]**\n2. **[제1과목: 데이터 모델링의 이해 (10문항 / 20점)]**\n   - **제1장. 데이터 모델링의 이해**\n     - `1-1-1` 데이터 모델의 이해 (모델링 3대 특징, 3단계 스키마, 독립성, ERD 작성 순서)\n     - `1-1-2` 엔터티 (엔터티 6대 특징, 유무형/발생시점 분류, 명명 규칙)\n     - `1-1-3` 속성 (엔터티·인스턴스·속성·속성값 관계, 기본·설계·파생 속성, 도메인)\n     - `1-1-4` 관계 (존재 vs 행위 관계, 관계차수, 필수/선택 참여, IE vs Barker 표기법 완벽 비교)\n     - `1-1-5` 식별자 (주식별자 4대 특징 유·최·불·존, 4대 분류 체계, 식별자 실선 vs 비식별자 점선 관계)\n   - **제2장. 데이터 모델과 SQL**\n     - `1-2-1` 정규화 (함수적 종속성, 이상현상, 1NF·2NF·3NF·BCNF·4NF·5NF, 반정규화와 성능)\n     - `1-2-2` 관계와 조인의 이해 (식별자 상속, 셀프 조인 순환 관계, 상호배타적 Exclusive-OR Arc 관계)\n     - `1-2-3` 모델이 표현하는 트랜잭션의 이해 (원자성 All or Nothing, 필수/선택 관계와 트랜잭션)\n     - `1-2-4` Null 속성의 이해 (가로 단일행 연산 vs 세로 집계함수 연산, ERD 표기법)\n     - `1-2-5` 본질식별자 vs 인조식별자 (대리키의 장단점: 중복 데이터 발생 및 추가 인덱스 부하)\n3. **[제2과목: SQL 기본 및 활용 (40문항 / 80점)]**\n   - **제1장. SQL 기본**\n     - `2-1-1` 관계형 데이터베이스 개요 (릴레이션/튜플/속성/카디널리티/디그리, DML·DDL·DCL·TCL, 무결성 제약조건)\n     - `2-1-2` SELECT 문 (작성 순서 vs 실행 순서, `DISTINCT`, `ALIAS` 쌍따옴표 규칙, 산술/합성 연산자 `||`, `DUAL`)\n     - `2-1-3` 함수 (문자형·숫자형 `ROUND/TRUNC/CEIL/FLOOR`·날짜형·변환형·`CASE/DECODE`·NULL 함수 `NVL/NVL2/NULLIF/COALESCE`)\n     - `2-1-4` WHERE 절 (연산자 우선순위 `NOT > AND > OR`, `BETWEEN`, `IN` vs `NOT IN` NULL 함정, `LIKE` & `ESCAPE`)\n     - `2-1-5` GROUP BY · HAVING 절 (집계함수와 `NULL`, `AVG(NVL(...))` vs `NVL(AVG(...))`, `WHERE` vs `HAVING`)\n     - `2-1-6` ORDER BY 절 (별칭/순서번호 정렬, Oracle vs SQL Server `NULL` 정렬 위치 차이, `NULLS FIRST/LAST`)\n     - `2-1-7` 조인 (`EQUI JOIN`, `NON-EQUI JOIN`, 3개 이상 테이블 조인, Oracle `(+)` 외부 조인 기호 규칙)\n     - `2-1-8` 표준 조인 (`NATURAL JOIN` vs `USING` 별칭 사용 불가 규칙, `ON` 절 vs `WHERE` 절 조건 차이, `CROSS/LEFT/RIGHT/FULL OUTER JOIN`)\n   - **제2장. SQL 활용**\n     - `2-2-1` 서브쿼리 (비연관/연관, 단일행/다중행 `IN, ALL, ANY, EXISTS`/다중컬럼, 스칼라 서브쿼리/인라인 뷰/중첩 서브쿼리)\n     - `2-2-2` 집합 연산자 (`UNION`, `UNION ALL`, `INTERSECT`, `MINUS`/`EXCEPT` 비교 및 정렬·별칭 규칙)\n     - `2-2-3` 그룹 함수 (`ROLLUP`, `CUBE`, `GROUPING SETS`, `GROUPING` 함수, 결합 컬럼 괄호, `UNION ALL` 치환)\n     - `2-2-4` 윈도우 함수 (`OVER(PARTITION BY ... ORDER BY ...)`, `ROWS` vs `RANGE` 프레임, `RANK/DENSE_RANK/ROW_NUMBER`, `FIRST_VALUE/LAST_VALUE/LAG/LEAD`, `RATIO_TO_REPORT/PERCENT_RANK/CUME_DIST/NTILE`)\n     - `2-2-5` Top N 쿼리 (`ROWNUM` 동작 원리와 함정, 인라인 뷰 정렬, `OFFSET ... FETCH FIRST N ROWS ONLY / WITH TIES`, `TOP`)\n     - `2-2-6` 계층형 질의와 셀프 조인 (`START WITH ... CONNECT BY PRIOR`, 순방향 vs 역방향, `CONNECT BY` 조건 vs `WHERE` 조건 차이, `ORDER SIBLINGS BY`)\n     - `2-2-7` PIVOT / UNPIVOT 절 (Long vs Wide 데이터, `PIVOT` / `UNPIVOT` 구문 및 `INCLUDE/EXCLUDE NULLS`)\n     - `2-2-8` 정규 표현식 (메타문자, 수량자, 문자클래스, `REGEXP_LIKE/REPLACE/SUBSTR/INSTR/COUNT` 및 `match_param`)\n   - **제3장. 관리 구문**\n     - `2-3-1` DML (`INSERT`, Oracle vs SQL Server `''` 차이, `UPDATE`, `DELETE`, `MERGE INTO`, 제약조건 에러 사례)\n     - `2-3-2` TCL (트랜잭션 4대 특성 `ACID`, 격리성 문제 Dirty/Non-Repeatable/Phantom Read, `COMMIT`, `ROLLBACK`, `SAVEPOINT` 소멸 규칙)\n     - `2-3-3` DDL (`CHAR` vs `VARCHAR2`, `CREATE TABLE`, 5대 제약조건 및 `ON DELETE CASCADE/SET NULL`, `CTAS`와 `NOT NULL`, `ALTER TABLE`, **`DELETE` vs `TRUNCATE` vs `DROP` 완벽 비교표**, `VIEW/SEQUENCE/SYNONYM`)\n     - `2-3-4` DCL (시스템 권한 vs 객체 권한, `GRANT/REVOKE`, **`WITH GRANT OPTION` 연쇄 회수 vs `WITH ADMIN OPTION` 유지**, `ROLE`)\n4. **[부록: 시험 당일 핵심 총정리 (전 30개 챕터 빈출 함정 카드 + 최종 체크리스트)]**\n\n---"}, {"id": "ch-01", "index": 1, "title": "1-1-1. 데이터 모델의 이해", "subj_id": "tab1", "subj_name": "1과목 · 데이터 모델링의 이해", "badge": "1과목 1장 · 데이터 모델링의 이해", "md": "# 1-1-1. 데이터 모델의 이해\n\n> **단원 분류**: `1과목` > `1-1. 데이터 모델링의 이해` > **`1-1-1. 데이터 모델의 이해`**\n\n## 💡 STEP 1. 핵심 개념 한눈에 이해하기\n\n> 데이터 모델이란 현실의 정보를 데이터베이스(DB)에 담기 위해 그린 **설계 도면**이다.\n\n회원·상품·주문 같은 정보를 어떻게 저장하고 연결할지 미리 그려보는 작업이다. 정보의 덩어리는 **엔터티**, 세부 항목은 **속성**, 엔터티 간 연결은 **관계**로 표현한다.\n\n---\n\n## [개념 도식화] 모델링 흐름\n\n개념 → 논리 → 물리 → DB, 4단계로 점점 구체화\n\n### 1단계 — 개념적 모델 (큰 그림)\n\n핵심 명사(엔터티)와 그 사이 연결만. 속성·자료형은 아직\n\n| 엔터티 관계 (개념적 모델 큰 그림) | 관계 설명 |\n| :--- | :--- |\n| **`[회원]` 1 ─── 0..N `[주문]`** | 한 명의 회원은 여러 번 주문할 수 있다 (1:N) |\n| **`[주문]` 1 ─── 1..N `[주문상세]`** | 하나의 주문에는 1개 이상의 주문상세 내역이 포함된다 (1:N) |\n| **`[상품]` 1 ─── 0..N `[주문상세]`** | 하나의 상품은 여러 주문상세에 포함될 수 있다 (1:N) |\n\n### 2단계 — 논리적 모델 (속성·키·정규화)\n\n엔터티마다 속성을 채우고 PK·FK 를 정함. DBMS 와는 아직 무관한 추상 모델\n\n| 엔터티(테이블) | 주식별자 (PK) | 외래키 (FK) | 일반 속성 (Attributes) |\n| :---: | :--- | :--- | :--- |\n| **회원 (`MEMBER`)** | `회원ID` (PK) | - | `이름`, `전화번호` |\n| **상품 (`PRODUCT`)** | `상품ID` (PK) | - | `상품명`, `가격` |\n| **주문 (`ORDERS`)** | `주문번호` (PK) | `회원ID` (FK ➔ 회원) | `주문일` |\n| **주문상세 (`ORDER_ITEM`)** | `주문번호` (PK) + `상품ID` (PK) | `주문번호` (FK), `상품ID` (FK) | `수량` |\n\n**정규화** (1NF → 2NF → 3NF) 도 여기서\n\n### 3단계 — 물리적 모델 (실제 DBMS 구현)\n\n논리 모델을 실제 DB의 **테이블** 로. 자료형·인덱스·제약조건까지 명시\n\n```sql\nCREATE TABLE MEMBER (\n    MEMBER_ID  VARCHAR2(10) PRIMARY KEY,\n    NAME       VARCHAR2(50) NOT NULL,\n    PHONE      VARCHAR2(20)\n);\n\nCREATE TABLE PRODUCT (\n    PROD_ID    VARCHAR2(10) PRIMARY KEY,\n    PROD_NAME  VARCHAR2(100) NOT NULL,\n    PRICE      NUMBER(10) NOT NULL\n);\n\nCREATE TABLE ORDERS (\n    ORDER_ID   NUMBER PRIMARY KEY,\n    MEMBER_ID  VARCHAR2(10) REFERENCES MEMBER(MEMBER_ID),\n    ORD_DATE   DATE DEFAULT SYSDATE\n);\n\nCREATE INDEX IDX_ORDERS_MEMBER ON ORDERS(MEMBER_ID);  -- 성능용 인덱스\n```\n\n### 4단계 — 데이터베이스 (운영 중인 실제 데이터)\n\n테이블에 데이터가 **차곡차곡 쌓인 상태**. 사용자는 SQL 로 조회·입력·수정\n\n**MEMBER**\n\n| MEMBER_ID | NAME | PHONE |\n|---|---|---|\n| M01 | 김철수 | 010-1111 |\n| M02 | 이영희 | 010-2222 |\n\n**PRODUCT**\n\n| PROD_ID | PROD_NAME | PRICE |\n|---|---|---|\n| P01 | 사과 | 1,000 |\n| P02 | 배 | 2,000 |\n\n**ORDERS**\n\n| ORDER_ID | MEMBER_ID | ORD_DATE |\n|---|---|---|\n| 1001 | M01 | 2026-04-01 |\n| 1002 | M02 | 2026-04-05 |\n\n### 단계 정리\n\n| 단계 | 이름 | 결과물 | 비유 |\n|---|---|---|---|\n| 1 | 개념적 모델링 | 핵심 엔터티·관계 ERD (큰 그림) | 손으로 그린 스케치 |\n| 2 | 논리적 모델링 | 속성·키 상세 ERD + **정규화** | 정식 건축 도면 |\n| 3 | 물리적 모델링 | DBMS 별 CREATE TABLE + 인덱스·파티션 | 시공 계획서 |\n| → | 운영 | 데이터가 쌓인 실제 데이터베이스 | 입주 완료된 건물 |\n\n---\n\n## 데이터 모델링의 3가지 관점\n\n| 관점 | 영문 | 모델링 대상 | 핵심 질문 |\n|---|---|---|---|\n| 데이터 관점 | Data | 업무가 관리하는 데이터 (엔터티·속성) | 무엇을(What) 저장하지 |\n| 프로세스 관점 | Process | 업무가 실제 하고 있는 일 (또는 해야 할 일) | 어떻게(How) 처리하지 |\n| 데이터·프로세스 상관관계 관점 | Interaction | 프로세스가 데이터에 미치는 영향 (CRUD 매트릭스) | 언제(When) 어떤 데이터가 변하지 |\n\n---\n\n## 좋은 데이터 모델의 특징\n\n| 특징 | 의미 |\n|---|---|\n| 완전성 | 업무에 필요한 데이터를 빠짐없이 담았는가 |\n| 중복 배제 | 같은 데이터가 여러 곳에 흩어져 있지 않은가 |\n| 업무 규칙 | 회사의 규칙이 모델에 녹아 있는가 |\n| 데이터 재사용 | 다른 업무에서도 활용할 수 있는가 |\n| 의사소통 | 보는 사람마다 같은 의미로 읽히는가 |\n| 통합성 | 같은 데이터는 한 곳에 정의되어 있는가 |\n\n---\n\n## 3층 스키마 (ANSI/SPARC)\n\n같은 DB도 보는 사람에 따라 전혀 다르게 보임. 외부 / 개념 / 내부, 세 층으로 나눠봄\n\n### 관점 1. 외부 스키마 (External) — 각 사용자/앱이 보는 화면\n\n같은 회원·주문 데이터, 사용자마다 보는 모습이 다름\n\n| 누가 본다 | 화면 (View) | 보이는 컬럼 예시 |\n|---|---|---|\n| 김철수 (모바일앱) | \"내 주문 내역\" | 주문번호 · 상품명 · 금액 · 주문일 |\n| 이영희 (웹) | \"위시리스트\" | 상품명 · 가격 · 이미지 |\n| 관리자 (백오피스) | \"일별 매출\" | 날짜 · 총매출 · 주문건수 |\n\n각 화면은 SQL 의 **VIEW** 또는 응용 프로그램 단에서 가공한 데이터\n\n### 관점 2. 개념 스키마 (Conceptual) — 조직 전체가 공유하는 ERD\n\n모든 외부 화면의 원본이 되는 **하나의 통합 설계도**. 회원·상품·주문·주문상세·결제·배송 등 전 엔터티와 관계가 한 ERD 안에\n\n| 중심 엔터티 | 연결 관계 (개념 스키마 통합 ERD 구조) |\n| :---: | :--- |\n| **주문 (`ORDERS`)** | • **`[회원]` 1 ── 0..N `[주문]`** (회원이 주문을 생성)<br>• **`[주문]` 1 ── 1..N `[주문상세]` 0..N ── 1 `[상품]`** (주문에 담긴 상품 내역)<br>• **`[주문]` 1 ── 1 `[결제]`** (주문당 결제 1건)<br>• **`[주문]` 1 ── 0..1 `[배송]`** (주문당 배송 0 또는 1건) |\n\n설계자(DA)가 관리하는 **전사 데이터 모델**. DB 하나당 단 하나\n\n### 관점 3. 내부 스키마 (Internal) — 디스크 위 실제 저장 구조\n\n개념 스키마가 **물리적으로 어떻게 저장되는가**. DBA·DBMS 의 영역\n\n| 항목 | 예시 |\n|---|---|\n| 데이터 파일 | `/oracle/data/SHOP_DATA01.dbf` (8KB 블록 단위) |\n| 인덱스 | `IDX_ORDERS_MEMBER` (B-Tree, 회원ID 정렬) |\n| 파티션 | ORDERS 테이블을 월별로 분할 (`P_2026_04`, `P_2026_05` ...) |\n| 캐시 | 자주 조회되는 회원 데이터 메모리 캐시 |\n\n### 3층이 분리된 이유 — 데이터 독립성\n\n| 계층 단계 | 스키마 명칭 | 구체적 예시 및 역할 |\n| :---: | :---: | :--- |\n| **1층 (사용자 관점)** | **외부 스키마 (External)**<br>*(여러 개 존재)* | • 모바일앱 화면: `'내 주문 내역'`<br>• 웹사이트 화면: `'위시리스트'`<br>• 백오피스 화면: `'일별 매출'` |\n| **↕ 논리적 독립성** | *개념 스키마가 바뀌어도 외부 스키마(화면/응용프로그램)는 영향 없음* | 논리적 사상 (External-Conceptual Mapping) |\n| **2층 (통합 설계 관점)** | **개념 스키마 (Conceptual)**<br>*(조직 전체 단 1개)* | • **전체 통합 ERD** (회원·상품·주문·결제·배송 전체 구조와 관계 정의) |\n| **↕ 물리적 독립성** | *내부 스키마(디스크/인덱스)가 바뀌어도 개념·외부 스키마는 영향 없음* | 물리적 사상 (Conceptual-Internal Mapping) |\n| **3층 (물리 저장 관점)** | **내부 스키마 (Internal)**<br>*(1개 존재)* | • 실제 디스크 데이터 파일, B-Tree 인덱스, 월별 파티션 등 물리적 저장 구조 |\n\n- **논리적 독립성**: 개념 스키마(ERD)가 바뀌어도 외부 스키마(앱 화면)는 영향 없음\n- **물리적 독립성**: 내부 스키마(저장 위치·인덱스)가 바뀌어도 개념·외부 스키마는 영향 없음\n\n| 스키마 | 관점 | 개수 | 누가 다룬다 |\n|---|---|---|---|\n| 외부 (External) | 사용자·응용 프로그램 | **여러 개** | 사용자·개발자 |\n| 개념 (Conceptual) | 설계자 통합 | **1개** | DA (Data Architect) |\n| 내부 (Internal) | 물리 저장 | **1개** | DBA (DB Administrator) |\n\n### 데이터 독립성 2가지\n\n| 종류 | 의미 |\n|---|---|\n| 논리적 독립성 | 개념 스키마가 변경돼도 외부 스키마(응용)는 영향 없음 |\n| 물리적 독립성 | 내부 스키마가 변경돼도 개념·외부 스키마는 영향 없음 |\n\n---\n\n## [SQL 실전] 모델이 곧 테이블이 된다\n\n논리 모델의 PK는 물리 모델에서 **식별자**(PRIMARY KEY 제약)가 된다.\n\n```sql\n-- 논리 모델의 '고객' 엔터티 → 물리 모델의 CUSTOMER 테이블\nCREATE TABLE CUSTOMER (\n    CUST_ID    VARCHAR2(10) PRIMARY KEY,  -- 식별자\n    CUST_NAME  VARCHAR2(50) NOT NULL,     -- 속성\n    PHONE      VARCHAR2(20)               -- 속성\n);\n```\n\n---\n\n## [Before & After] 모델링이 없을 때 vs 있을 때\n\n한 테이블에 다 욱여넣은 모양 vs 고객·주문을 분리한 모양\n\n### Before — 모델링 없이 만든 테이블\n\n| 주문번호 | 고객이름 | 고객전화 | 상품1 | 상품2 | 상품3 |\n|---|---|---|---|---|---|\n| 1 | 김철수 | 010-1111 | 사과 | 배 | NULL |\n| 2 | 김철수 | 010-1111 | 포도 | NULL | NULL |\n\n고객 정보가 중복되고, 상품 칸이 모자라면 더 못 담음\n\n### After — 모델링 후 분리된 테이블\n\n**CUSTOMER**\n\n| CUST_ID | NAME | PHONE |\n|---|---|---|\n| C001 | 김철수 | 010-1111 |\n\n**ORDER**\n\n| ORD_ID | CUST_ID | PRODUCT |\n|---|---|---|\n| 1 | C001 | 사과 |\n| 2 | C001 | 배 |\n| 3 | C001 | 포도 |\n\n중복이 사라지고 상품을 무한히 추가 가능\n\nBefore 는 \"상품1·상품2·상품3\" 같은 컬럼을 미리 박아둬서 주문 개수가 늘면 한계가 분명하다. 고객 정보도 주문마다 반복 저장이라 전화번호 하나 바뀌면 모든 행을 손봐야 한다. 모델링은 이걸 엔터티 분리로 푼다 — 같은 의미는 한 곳에만, 관계는 키로 잇는다.\n\n---\n\n## [시험 출제 포인트]\n\n| 함정 | 정답 |\n|---|---|\n| 물리적 모델링이 가장 먼저다 | 개념 → 논리 → 물리 순서 |\n| 데이터 모델은 코드를 위한 것 | 현실 세계를 추상화한 것 |\n| 좋은 모델은 데이터 중복을 일부 허용한다 | 원칙은 중복 배제. 다만 성능을 위해 의도적으로 허용하는 반정규화는 별개 |\n| 데이터 모델링 3대 관점 | 데이터 / 프로세스 / 상관관계 |\n| 좋은 모델의 6대 특징 | 완전성 / 중복배제 / 업무규칙 / 데이터 재사용 / 의사소통 / 통합성 |\n\n단골 함정: \"물리적 모델링 단계에서 정규화를 한다\" — 정규화는 **논리** 단계\n\n---\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · 모델링 순서: **개념 → 논리 → 물리** (정규화 = 논리)\n> · 3가지 관점: **데이터 / 프로세스 / 데이터·프로세스 상관관계**\n> · 좋은 모델 6요소: **완전성 · 중복배제 · 업무규칙 · 재사용성 · 의사소통 · 통합성**\n> · 3층 스키마: **외부(View) / 개념(ERD) / 내부(저장)** + **논리적·물리적 독립성** 보장\n\n\n---\n\n---\n\n## 📘 STEP 2. 상세 출제 이론 & 원본 강의 도표·슬라이드 완벽 정복 제1절. 데이터 모델의 이해\n\n#### 1. SQLD 전체 출제 범위 한눈에 보기\n- **제1과목: 데이터 모델링의 이해 (총 10문항 / 20점)**\n  - **제1장 데이터 모델링의 이해**: 엔터티(Entity), 속성(Attribute), 관계(Relationship), 식별자(Identifier)\n  - **제2장 데이터 모델과 SQL**: 정규화(Normalization), 관계와 조인의 이해, 모델이 표현하는 트랜잭션의 이해, Null 속성의 이해, 본질식별자 vs 인조식별자\n  - *(※ 참고: 구버전 교재의 '성능 데이터 모델링의 개요' 일반론은 2024 개정에서 축소되었으나, 정규화/반정규화와 성능의 관계는 여전히 빈출됩니다!)*\n\n![SQLD 1과목 출제 범위 및 학습 목차](images/p001_img01.png)\n\n![SQLD 2과목 출제 범위 및 학습 목차](images/p001_img02.png)\n\n---\n\n#### 2. 모델링(Modeling)의 정의와 3대 특징\n1. **모델링의 정의**\n   - 복잡한 '현실세계'를 단순화시켜 표현하는 기법\n   - 사물 또는 사건에 관한 양상(Aspect)이나 관점(Perspective)을 연관된 사람이나 그룹을 위하여 명확하게 하는 것\n   - 현실세계의 추상화된 반영\n2. **모델링의 3대 특징 (★단골 객관식 1번 문제: `\"추·단·명\"`)**\n   - **추상화 (Abstraction, 모형화·가설적)**: 현실세계를 일정한 형식에 맞추어 간략하게 표현하는 과정\n   - **단순화 (Simplification)**: 복잡한 현실세계를 약속된 규약에 의해 제한된 표기법이나 언어로 이해하기 쉽게 하는 과정\n   - **명확화 (Clarity)**: 누구나 이해하기 쉽게 하기 위해 대상에 대한 애매모호함을 제거하고 정확하게 현상을 기술하는 과정\n\n#### 3. 데이터 모델링의 3가지 관점\n| 관점 | 영문명 | 핵심 설명 (시험 키워드) |\n| :---: | :---: | :--- |\n| **데이터 관점** | **Data** (`What`) | 업무가 어떤 데이터와 관련이 있는지 또는 **데이터 간의 관계**는 무엇인지에 대해서 모델링하는 방법 |\n| **프로세스 관점** | **Process** (`How`) | 업무가 실제로 **하고 있는 일은 무엇인지** 또는 무엇을 해야 하는지를 모델링하는 방법 |\n| **데이터와 프로세스의 상관 관점** | **Data vs Process** (`Interaction`) | 업무가 처리하는 일의 방법에 따라 **데이터는 어떻게 영향을 받고 있는지** 모델링하는 방법 (예: CRUD Matrix) |\n\n#### 4. 데이터 모델링의 중요성 및 3대 유의점\n- **중요성**: 파급효과(Leverage), 복잡한 정보 요구사항의 간결한 표현(Conciseness), 데이터 품질(Data Quality)\n- **데이터 모델링 시 유의점 3가지 (★암기: `\"중·비·비\"` — 중복, 비유연성, 비일관성)**\n  1. **중복 (Duplication)**: 같은 시간 같은 데이터는 같은 정보를 제공해야 함. 여러 장소의 데이터베이스에 같은 정보를 저장하지 않도록 하여 중복성을 최소화한다.\n  2. **비유연성 (Inflexibility)**: 사소한 업무변화에 데이터 모델이 수시로 변경되면 안 된다. **데이터의 정의를 데이터의 사용 프로세스와 분리**함으로써 유연성을 높인다.\n  3. **비일관성 (Inconsistency)**: 데이터 중복이 없더라도 비일관성은 발생할 수 있다. **데이터와 데이터 간의 상호 연관 관계에 대한 명확한 정의**를 통해 예방한다. (예: 신용상태에 대한 갱신 없이 고객의 납부이력 정보만 갱신하는 경우)\n\n#### 5. 데이터 모델링의 3단계 진행 과정\n| 단계 | 추상화 수준 | 업무 중심 / 기술 중심 | 핵심 수행 작업 및 산출물 |\n| :---: | :---: | :---: | :--- |\n| **1. 개념적 데이터 모델링**<br>(Conceptual) | **가장 높음**<br>(추상적) | 전사적(기업 전체) 업무 중심 | 추상화 수준이 높고 **업무중심적이고 포괄적인 수준**의 모델링 진행. 핵심 엔터티와 그들 간의 관계를 발견하고 **엔터티-관계 다이어그램(ERD)**을 생성. |\n| **2. 논리적 데이터 모델링**<br>(Logical) | 중간 | 업무 중심 (재사용성 가장 높음) | 시스템으로 구축하고자 하는 업무에 대해 **Key(식별자), 속성, 관계 등을 정확하게 표현**하는 단계. 이 단계에서 **정규화(Normalization)**를 수행하며, 데이터 모델링이 최종적으로 완료되는 단계. |\n| **3. 물리적 데이터 모델링**<br>(Physical) | **가장 낮음**<br>(구체적) | 특정 DBMS / 하드웨어 중심 | 실제로 데이터베이스에 이식할 수 있도록 **성능, 저장 등 물리적인 성격**을 고려하여 설계하는 단계 (테이블, 칼럼, 데이터 타입, 인덱스, 파티셔닝 설계). |\n\n---\n\n#### 6. 데이터 독립성(Data Independence)과 ANSI-SPARC 3단계 스키마 구조\n- **데이터 독립성의 필요성**\n  - 데이터 독립성의 반대말은 **데이터 종속성**이다.\n  - 데이터 종속성이 높으면 유지보수 비용이 증가하고, 데이터 중복성이 증가하며, 요구사항 대응력이 저하된다.\n  - **목적**: 각 View의 독립성을 유지하고 계층별 View에 영향을 주지 않고 변경이 가능하게 하며, 단계별 Schema에 따라 데이터 정의어(DDL)와 데이터 조작어(DML)가 다름을 제공한다.\n\n![데이터 독립성 확보의 효과](images/p003_img01.png)\n\n- **3단계 스키마(Schema) 구조와 2가지 데이터 독립성 (★절대 빈출)**\n  1. **외부 스키마 (External Schema, 사용자 관점 - Multiple User's View)**: 각 사용자 단계로서 개개 사용자가 보는 개인적 DB 스키마 (응용프로그램이 접근하는 DB 정의)\n  2. **개념 스키마 (Conceptual Schema, 통합 관점 - Community View of DB)**: 조직 전체의 통합된 관점을 표현하는 스키마. 모든 응용시스템과 사용자들이 필요로 하는 데이터를 통합한 **조직 전체의 DB 구조를 논리적으로 정의**한 스키마 (DB에 저장되는 데이터와 그들 간의 관계를 표현, **1개만 존재**)\n  3. **내부 스키마 (Internal Schema, 물리적 관점 - Physical Representation)**: 물리적 장치에서 데이터가 **실제적으로 저장되는 방법**을 표현하는 스키마 (레코드 구조, 필드 정의, 인덱스 등)\n\n![3단계 스키마 구조와 논리적·물리적 데이터 독립성 및 사상(Mapping)](images/p003_img02.png)\n\n- **두 영역의 데이터 독립성 & 사상(Mapping)**\n  - **논리적 독립성 (Logical Independence)**: **개념 스키마가 변경**되어도 **외부 스키마에는 영향을 미치지 않도록** 지원하는 것. 논리적 구조가 변경되어도 응용 프로그램에 영향이 없음 (`외부적/개념적 사상` — 논리적 사상).\n  - **물리적 독립성 (Physical Independence)**: **내부 스키마가 변경**되어도 **외부/개념 스키마는 영향을 받지 않도록** 지원하는 것. 저장장치의 구조변경은 응용프로그램과 개념스키마에 영향이 없음 (`개념적/내부적 사상` — 물리적 사상).\n  - **사상 (Mapping)**: 상호 독립적인 개념을 연결시켜주는 다리(Bridge)를 뜻한다.\n\n#### 7. 데이터 모델링의 3대 요소와 ERD 작성 순서 6단계\n- **데이터 모델링의 3가지 핵심 개념**:\n  1. 업무가 관여하는 **어떤 것 (Things)** ➔ **엔터티 (Entity)** (단수 명사: `Entity`, 복수 개념: `Entities`, 개별 대상: `Instance`)\n  2. 어떤 것이 가지는 **성격 (Attributes)** ➔ **속성 (Attribute)** (개별 값: `Attribute Value`)\n  3. 업무가 관여하는 어떤 것 간의 **관계 (Relationships)** ➔ **관계 (Relationship)** (개별 짝: `Pairing`)\n\n![데이터 모델링의 3요소 개념과 개별 구성요소 대조표](images/p003_img03.png)\n\n- **좋은 데이터 모델의 요소 6가지**:\n  1. **완전성 (Completeness)**: 업무에서 필요로 하는 모든 데이터가 데이터 모델에 정의되어 있어야 함\n  2. **중복배제 (Non-Redundancy)**: 하나의 데이터베이스 내에 동일한 사실은 반드시 한 번만 기록하여야 함\n  3. **업무규칙 (Business Rules)**: 데이터 모델링 과정에서 도출되는 수많은 업무규칙을 데이터 모델에 표현하고 모든 사용자가 공유해야 함\n  4. **데이터 재사용 (Data Reusability)**: 데이터의 통합성과 독립성에 대해서 충분히 고려해야 함\n  5. **의사소통 (Communication)**: 많은 관련자들이 설계자가 정의한 업무규칙들을 동일한 의미로 받아들이고 활용할 수 있게 해야 함\n  6. **통합성 (Integration)**: 동일한 데이터는 조직 전체에서 한 번만 정의되고 이를 여러 다른 영역에서 참조·활용해야 함\n\n- **ERD (Entity Relationship Diagram) 작성 순서 6단계 (★순서 암기 필수!)**:\n  > **`① 엔터티를 그린다` ➔ `② 엔터티를 적절하게 배치한다` ➔ `③ 엔터티간 관계를 설정한다` ➔ `④ 관계명을 기술한다` ➔ `⑤ 관계의 참여도(Cardinality, 1:1/1:M)를 기술한다` ➔ `⑥ 관계의 필수여부(Optionality)를 기술한다`**\n  - **엔터티 배치 원칙**: 인간이 눈으로 보았을 때 **왼쪽에서 오른쪽, 위에서 아래로** 이동하는 경향이 있으므로, 데이터 모델링에서도 **가장 중요한 엔터티(기본/중심 엔터티)를 왼쪽 상단(Left-Top)**에 배치하고 이것을 중심으로 다른 엔터티를 나열한다.\n  - **ERD 관계 연결 시 주의점**: 초기에는 모두 Primary Key 속성이 상속되는 식별자 관계를 설정하고, 중복되는 관계가 발생하거나 Circle 관계가 발생할 경우 주식별자 속성을 빼는 등 비식별자 관계로 조정한다."}, {"id": "ch-02", "index": 2, "title": "1-1-2. 엔터티(Entity)", "subj_id": "tab1", "subj_name": "1과목 · 데이터 모델링의 이해", "badge": "1과목 1장 · 데이터 모델링의 이해", "md": "# 1-1-2. 엔터티(Entity)\n\n> **단원 분류**: `1과목` > `1-1. 데이터 모델링의 이해` > **`1-1-2. 엔터티`**\n\n## 💡 STEP 1. 핵심 개념 한눈에 이해하기\n\n> 엔터티(Entity)란 업무에서 관리해야 할 정보의 덩어리(명사)다. 실제 테이블의 후보가 된다.\n\nex) 쇼핑몰이라면 **회원·상품·주문·배송** 같은 명사 하나하나가 엔터티이며, 각 엔터티의 개별 사례(예: '김철수 회원')를 **인스턴스(Instance, 한 행)** 라고 부른다.\n\n---\n\n## [개념 도식화] 엔터티의 구성\n\n| 계층 구분 | 대응 개념 (DB) | 의미 및 실제 예시 |\n| :---: | :---: | :--- |\n| **1. 엔터티 (Entity)** | **테이블 (Table)** | 업무에서 관리하는 정보의 큰 덩어리 (예: `회원`) |\n| **2. 속성 (Attribute)** | **컬럼 (Column, 열)** | 엔터티를 구성하는 세부 항목 (예: `회원ID`, `이름`, `전화번호`) |\n| **3. 인스턴스 (Instance)** | **로우 (Row, 행)** | 실제 저장된 개별 데이터 사례<br>• 행 1: `(C001, 김철수, 010-1111)`<br>• 행 2: `(C002, 이영희, 010-2222)` |\n\n---\n\n## 엔터티의 5가지 특징\n\n| 특징 | 의미 | 예시 |\n|---|---|---|\n| 업무에서 필요 | 회사가 관리할 가치가 있어야 함 | 쇼핑몰의 '회원'은 필요, 회원의 '발 사이즈'는 불필요 |\n| 식별 가능 | 다른 인스턴스와 구분되는 **식별자** 존재 | 회원ID로 구별 |\n| 인스턴스 집합 | 2개 이상의 인스턴스 존재 | 회원이 1명만 있으면 엔터티 X |\n| 속성 보유 | 2개 이상의 **속성**을 가짐 | 회원ID + 이름 + … |\n| 관계 보유 | 다른 엔터티와 **관계**가 있음 | 회원 ─ 주문 |\n\n암기: **업·식·인·속·관**\n\n---\n\n## 엔터티의 분류\n\n### 유무형에 따른 분류\n\n| 종류 | 설명 | 예시 |\n|---|---|---|\n| 유형 엔터티 | 물리적으로 존재 | 상품, 사원, 매장 |\n| 개념 엔터티 | 개념적으로만 존재 | 부서, 조직, 학과 |\n| 사건 엔터티 | 행위로 발생 | 주문, 결제, 출입기록 |\n\n### 발생 시점에 따른 분류\n\n| 1단계: 기본(Key) 엔터티 | ➔ | 2단계: 중심(Main) 엔터티 | ➔ | 3단계: 행위(Active) 엔터티 |\n| :---: | :---: | :---: | :---: | :---: |\n| **독립적으로 원래 존재**<br>부모 역할 수행, 고유 PK 보유<br>*(예: 사원, 부서, 고객, 상품)* | **파생** | **업무의 핵심 역할 수행**<br>기본 엔터티로부터 발생<br>*(예: 주문, 계약, 청구, 매출)* | **관계에서 발생** | **2개 이상 부모로부터 발생**<br>데이터양이 가장 많고 자주 변경<br>*(예: 주문상세, 사원변경이력)* |\n\n| 종류 | 의존성 | 예시 |\n|---|---|---|\n| 기본(Key) 엔터티 | 독립적 존재 가능 (다른 엔터티 없이도 성립) | 사원, 부서, 고객 |\n| 중심(Main) 엔터티 | 기본 엔터티에서 파생 (업무의 주요 결과물) | 주문, 계약, 매출 |\n| 행위(Action) 엔터티 | 2개 이상 엔터티의 관계에서 발생 | 주문상세, 출고, 입출금 |\n\n---\n\n## [SQL 실전] 엔터티는 테이블이 된다\n\n```sql\nCREATE TABLE MEMBER (\n    MEMBER_ID    VARCHAR2(10) PRIMARY KEY,  -- 식별자\n    NAME         VARCHAR2(50),\n    PHONE        VARCHAR2(20),\n    JOIN_DATE    DATE\n);\n```\n\n---\n\n## [Before & After] 엔터티 도출 전후\n\n\"김철수가 2026-04-01에 사과 2개를 주문했다\" 같은 한 줄 사건 기록을 그대로 적어두는 방식과, 회원·상품·주문 세 엔터티로 갈라낸 방식 비교\n\n### Before — 엔터티 구분 없이 한 덩어리\n\n| 데이터(혼재) |\n|---|\n| 김철수가 2026-04-01에 사과 2개 주문 |\n| 이영희가 2026-04-02에 배 1개 주문 |\n\n### After — 엔터티 분리\n\n**회원(MEMBER)**\n\n| MEMBER_ID | NAME |\n|---|---|\n| M01 | 김철수 |\n| M02 | 이영희 |\n\n**상품(PRODUCT)**\n\n| PROD_ID | NAME |\n|---|---|\n| P01 | 사과 |\n| P02 | 배 |\n\n**주문(ORDER)**\n\n| ORD_ID | MEMBER_ID | PROD_ID | QTY | ORD_DATE |\n|---|---|---|---|---|\n| 1 | M01 | P01 | 2 | 2026-04-01 |\n| 2 | M02 | P02 | 1 | 2026-04-02 |\n\n한 줄에 \"회원·상품·주문\"이라는 서로 다른 성질의 정보가 섞여 있으면 회원 전화번호 갱신·상품 단가 변경·주문 취소가 한 행을 동시에 건드린다. 엔터티 단위로 분리하면 각 변경이 그 엔터티 안에서만 끝난다. \"사람 얘기인가, 물건 얘기인가, 사건 얘기인가\"를 구분해 명사로 뽑아내는 것이 엔터티 도출의 출발점.\n\n---\n\n## [시험 출제 포인트]\n\n| 함정 | 정답 |\n|---|---|\n| 엔터티는 1개 인스턴스만 있어도 된다 | 2개 이상 필요 |\n| 엔터티는 속성이 1개여도 가능하다 | 2개 이상 필요 |\n| 행위 엔터티의 예 | 주문, 입출금, 출고 |\n| 엔터티 명명 규칙 | 현업 용어 사용, 단수 명사, 약어 지양, 대문자 표기 권장 |\n\n단골 보기: \"엔터티는 영속적으로 존재하는 인스턴스의 집합이다\" → 옳음. \"인스턴스가 1개여도 무방하다\" → 틀림\n\n---\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · 엔터티 5대 특징: **업·식·인·속·관** (업무에 필요 / 식별 가능 / 인스턴스 ≥ 2 / 속성 ≥ 2 / 관계 보유)\n> · 유무형 분류: **유형 / 개념 / 사건**\n> · 발생 시점 분류: **기본 → 중심 → 행위**\n> · 명명 규칙: **단수 명사 / 현업 용어 / 약어 지양 / 대문자 권장**\n\n\n---\n\n---\n\n## 📘 STEP 2. 상세 출제 이론 & 원본 강의 도표·슬라이드 완벽 정복 제2절. 엔터티 (Entity)\n\n#### 1. 엔터티(Entity)의 개념과 6대 특징\n- **엔터티의 정의**: 업무에 필요하고 유용한 정보를 저장하고 관리하기 위한 집합적인 것(Things). 보이지 않는 개념 등도 포함된다. (엔터티는 **인스턴스의 집합**이다.)\n- **엔터티의 6대 특징 (★시험 100% 출제 — 하나라도 어긋나면 부적절한 엔터티!)**:\n  1. **반드시 해당 업무에서 필요하고 관리하고자 하는 정보**여야 한다. (예: 학교 시스템의 '학생'은 엔터티이지만, 병원 시스템의 '학생'은 불필요하므로 엔터티가 아님)\n  2. **유일한 식별자(Unique Identifier)에 의해 식별이 가능**해야 한다.\n  3. 영속적으로 존재하는 **인스턴스의 집합**이어야 한다 (**`두 개 이상`**의 인스턴스!). 한 개만 존재하는 엔터티는 집합이 아니므로 성립하지 않는다.\n  4. 엔터티는 **업무 프로세스에 의해 반드시 이용**되어야 한다. (고립된 엔터티는 제거하거나 누락된 프로세스가 있는지 점검)\n  5. 엔터티는 **반드시 속성(Attribute)이 있어야 한다**. (**두 개 이상의 속성**을 가짐 — 단, 예외적으로 **관계엔터티(Associative Entity)의 경우는 주식별자 속성만 가지고 있어도 인정**할 수 있다.)\n  6. 엔터티는 **다른 엔터티와 최소 한 개 이상의 관계**가 있어야 한다. (단, **통계성 엔터티**, **코드성 엔터티**, **시스템 처리용 내부 엔터티**의 경우 관계를 생략할 수 있는 예외 존재!)\n\n![엔터티의 정의와 엔터티/인스턴스 예시 표](images/p004_img01.png)\n\n#### 2. 엔터티의 분류 (유무형에 따른 분류 vs 발생시점에 따른 분류)\n- **① 유무형에 따른 분류 (`\"유·개·사\"`)**:\n  1. **유형 엔터티 (Tangible Entity)**: 물리적인 형태가 있고 안정적이며 지속적으로 활용되는 엔터티 (예: `사원`, `물품`, `강사`)\n  2. **개념 엔터티 (Conceptual Entity)**: 물리적인 형태는 존재하지 않으나 관리해야 할 개념적 정보로 구분되는 엔터티 (예: `조직`, `보험상품`, `부서`, `학번`)\n  3. **사건 엔터티 (Event Entity)**: 업무를 수행함에 따라 발생되는 엔터티로서 비교적 발생량이 많으며 각종 통계자료에 이용될 수 있음 (예: `주문`, `청구`, `미납`)\n\n![유무형에 따른 엔터티 분류 예시 도식](images/p005_img01.png)\n\n- **② 발생시점(Generation)에 따른 분류 (`\"기·중·행\"`)**:\n  1. **기본/키 엔터티 (Fundamental / Key Entity)**: 그 업무에 원래 존재하는 정보로서 다른 엔터티와 관계에 의해 생성되지 않고 **독립적으로 생성**이 가능하며 자신은 타 엔터티의 부모 역할을 하게 된다. 다른 엔터티로부터 주식별자를 상속받지 않고 **자신의 고유한 주식별자**를 가지게 된다. (예: `사원`, `부서`, `고객`, `상품`, `자재`)\n  2. **중심 엔터티 (Main Entity)**: 기본 엔터티로부터 발생되고 그 업무에 있어서 **중심적인 역할**을 한다. 데이터의 양이 많이 발생되고 다른 엔터티와의 관계를 통해 많은 행위 엔터티를 생성한다. (예: `계약`, `사고`, `예금원장`, `청구`, `주문`, `매출`)\n  3. **행위 엔터티 (Active Entity)**: **두 개 이상의 부모엔터티로부터 발생**되고 자주 내용이 바뀌거나 데이터량이 증가된다. 분석초기 단계보다는 상세 설계단계나 프로세스와 상관모델링을 진행하면서 도출될 수 있다. (예: `주문목록`, `사원변경이력`, `이력`)\n\n![발생시점에 따른 엔터티 분류 (기본·중심·행위 엔터티)](images/p005_img02.png)\n\n#### 3. 엔터티의 명명(Naming) 원칙 5가지\n1. 가능하면 **현업업무에서 사용하는 용어**를 사용한다.\n2. 가능하면 **약어를 사용하지 않는다**.\n3. **단수명사**를 사용한다 (복수명사 X).\n4. **모든 엔터티에서 유일하게 이름이 부여**되어야 한다 (중복 이름 X).\n5. **엔터티 생성의미대로 이름을 부여**한다."}, {"id": "ch-03", "index": 3, "title": "1-1-3. 속성(Attribute)", "subj_id": "tab1", "subj_name": "1과목 · 데이터 모델링의 이해", "badge": "1과목 1장 · 데이터 모델링의 이해", "md": "# 1-1-3. 속성(Attribute)\n\n> **단원 분류**: `1과목` > `1-1. 데이터 모델링의 이해` > **`1-1-3. 속성`**\n\n## 💡 STEP 1. 핵심 개념 한눈에 이해하기\n\n> 속성(Attribute)이란 **엔터티**가 가지는 세부 정보 항목, 곧 컬럼이다. 엔터티를 설명하는 가장 작은 단위다.\n\nex) 명함 한 장에서 명함 자체는 엔터티(사람), 이름·전화번호·이메일 같은 각 항목이 속성. 이름은 더 이상 쪼개지지 않는 최소 단위\n\n---\n\n## [개념 도식화] 엔터티 / 인스턴스 / 속성 / 속성값\n\n회원(MEMBER) 테이블 예시:\n\n| ID&nbsp;(속성) | 이름&nbsp;(속성) | 전화번호&nbsp;(속성) |\n|---|---|---|\n| **M01** | **김철수** | **010-1111** ← 속성값(Value) |\n| M02 | 이영희 | 010-2222 |\n\n각 행 = **인스턴스(Row)** / 각 칸 = **속성값(Value)** / 각 컬럼 = **속성(Attribute)**.\n\n---\n\n## 속성의 3가지 분류 기준\n\n| 속성 분류 기준 | 세부 종류 | 핵심 특징 및 예시 |\n| :---: | :--- | :--- |\n| **① 특성에 따른 분류**<br>*(★암기: 기·설·파)* | • **기본 속성 (Basic)**<br>• **설계 속성 (Designed)**<br>• **파생 속성 (Derived)** | • 업무에서 추출한 본래 속성 (예: 이름, 원금, 입사일)<br>• 업무 규칙화를 위해 새로 부여한 속성 (예: 부서코드, 일련번호)<br>• 다른 속성으로부터 계산/가공된 속성 (예: 총합계, 평균, 이자) |\n| **② 분해 가능 여부** | • **단일(단순) 속성**<br>• **복합 속성 (Composite)** | • 더 이상 쪼갤 수 없는 원자값 (예: 나이, 성별)<br>• 시·구·동 등으로 쪼갤 수 있는 속성 (예: 주소) |\n| **③ 값의 개수** | • **단일값 속성 (Single-Valued)**<br>• **다중값 속성 (Multi-Valued)** | • 속성 하나에 값 1개만 존재 (예: 주민번호)<br>• 값이 여러 개 존재 ➔ **제1정규화(별도 엔터티 분리) 대상!** (예: 취미, 전화번호 여러 개) |\n\n### 특성에 따른 분류\n\n| 종류 | 의미 | 예시 |\n|---|---|---|\n| 기본 속성 | 업무에서 직접 추출된 본래의 속성 | 이름, 전화번호, 주소 |\n| 설계 속성 | 업무 설계 과정에서 새로 만든 속성 | 회원ID, 상품코드 |\n| 파생 속성 | 다른 속성에서 계산되어 나온 속성 | 총주문금액(=수량×단가) |\n\n시험 단골: \"주민번호로부터 구한 나이\" → 파생 속성\n\n### 분해 가능 여부\n\n| 종류 | 의미 | 예시 |\n|---|---|---|\n| 단순(원자) 속성 | 더 이상 분해 불가 | 이름, 나이 |\n| 복합 속성 | 여러 의미가 합쳐진 형태 — 분해해서 저장하면 활용도 ↑ | 주소(시+구+동) |\n\n> **주의** — '복합 속성'  과 '복합식별자'  는 **다른 개념**.\n> 복합 속성 = 한 속성을 여러 의미로 쪼갤 수 있음.\n> 복합식별자 = 여러 속성을 묶어 PK로 씀.\n\n### 속성값의 개수\n\n| 종류 | 의미 | 예시 |\n|---|---|---|\n| 단일값 속성 | 하나만 가짐 | 주민번호 |\n| 다중값 속성 | 여러 개 가능 → 별도 엔터티로 분리 | 전화번호(집, 휴대폰) |\n\n---\n\n## 속성의 명명 규칙\n\n```\n[속성 이름 짓기 4원칙]\n  1. 현업 용어 사용 — 코드가 아닌 업무 용어로\n  2. 명사형 (서술식 X) — '주문수량' O, '주문은얼마인가' X\n  3. 약어 자제 — 'qty' 보다 '수량'\n  4. 전체 모델에서 유일 — 같은 이름이 여러 엔터티에 흩어지지 않도록\n```\n\n| 좋은 예 | 나쁜 예 |\n|---|---|\n| 회원_등록일 | regdt (약어 남발) |\n| 상품_가격 | 상품의가격은얼마인가 (서술식) |\n| 주문_수량 | qty (축약형 모호) |\n\n---\n\n## 도메인(Domain) — 속성의 값 범위\n\n도메인은 속성이 가질 수 있는 **값의 종류·범위·제약**. **데이터 타입 + 크기 + 허용값(제약조건)** 세 가지가 모두 포함됨. NOT NULL 여부도 도메인의 일부로, **NULL** 허용 여부는 속성마다 별도 결정\n\n| 속성 | 도메인 (타입 · 크기 · 제약) |\n|---|---|\n| 성별 | CHAR(1) / { 'M', 'F' } 만 허용 |\n| 나이 | NUMBER(3) / 0 ~ 150 사이 정수 |\n| 이메일 | VARCHAR2(100) / @ 포함 형식 |\n\n같은 도메인을 가진 속성은 여러 엔터티에 나와도 같은 의미로 다뤄야 함 (통합성)\n\n---\n\n## [SQL 실전] 속성 정의\n\n```sql\nCREATE TABLE MEMBER (\n    MEMBER_ID    VARCHAR2(10),     -- 설계 속성\n    NAME         VARCHAR2(50),      -- 기본 속성\n    BIRTH        DATE,              -- 기본 속성\n    AGE          NUMBER GENERATED ALWAYS AS  -- 파생 속성\n                 (TRUNC(MONTHS_BETWEEN(SYSDATE, BIRTH)/12)) VIRTUAL\n);\n```\n\n---\n\n## [Before & After] 다중값 속성의 분리\n\n회원 한 명이 휴대폰·집 전화 두 개를 동시에 가진 상황. 한 칸에 \"010-1111, 02-333-4444\"처럼 쉼표로 이어 붙이는 방식 vs 별도 엔터티로 빼는 방식\n\n### Before — 다중값 속성을 한 칸에\n\n| MEMBER_ID | NAME | PHONE |\n|---|---|---|\n| M01 | 김철수 | 010-1111, 02-333-4444 |\n\n검색·변경 모두 어려움\n\n### After — 별도 엔터티로 분리\n\n**MEMBER**\n\n| MEMBER_ID | NAME |\n|---|---|\n| M01 | 김철수 |\n\n**MEMBER_PHONE**\n\n| MEMBER_ID | TYPE | PHONE |\n|---|---|---|\n| M01 | 휴대폰 | 010-1111 |\n| M01 | 집 | 02-333-4444 |\n\n한 칸에 두 값이 들어가면 \"휴대폰 번호만 검색\"이나 \"집 전화 변경\" 같은 단순 작업도 문자열 파싱부터 해야 하고, 번호가 셋으로 늘면 컬럼 자체를 늘려야 한다. 한 속성엔 한 값만 — 한 인스턴스가 같은 속성에 여러 값을 갖는 순간 별도 엔터티 후보다. 1NF 의 원자값 원칙도 같은 맥락.\n\n---\n\n## [시험 출제 포인트]\n\n| 함정 | 정답 |\n|---|---|\n| \"주문수량 × 단가 = 주문금액\"은 어떤 속성인가 | 파생 속성 |\n| \"주민등록번호로부터 추출한 성별\"은 | 파생 속성 |\n| 다중값 속성을 그대로 둔다 | 별도 엔터티로 분리(정규화) |\n| 복합 속성과 단순 속성 | 주소(시·구·동) = 복합, 나이 = 단순 |\n| 속성은 더 이상 쪼갤 수 없는 단위인가 | 그렇다(최소 단위) |\n| 속성과 인스턴스의 관계 | 한 인스턴스는 각 속성에 단 하나의 값을 가짐 |\n\n함정 단골: \"파생 속성은 가급적 줄여야 한다\" → 옳음 (데이터 일관성). 단, 성능을 위해 의도적으로 둘 수는 있음\n\n---\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · 특성 분류: **기본 / 설계 / 파생** (파생 = 다른 속성에서 계산)\n> · 분해 분류: **단순(원자) / 복합** (복합 ≠ 복합식별자)\n> · 값 개수 분류: **단일값 / 다중값** (다중값은 별도 엔터티로 분리)\n> · 도메인 = **타입 + 크기 + 제약조건**\n\n\n---\n\n---\n\n## 📘 STEP 2. 상세 출제 이론 & 원본 강의 도표·슬라이드 완벽 정복 제3절. 속성 (Attribute)\n\n#### 1. 속성(Attribute)의 정의와 엔터티·인스턴스·속성·속성값의 관계\n- **속성의 정의**: 업무에서 필요로 하는 인스턴스로 관리하고자 하는 **의미상 더 이상 분리되지 않는 최소의 데이터 단위**.\n- **엔터티, 인스턴스, 속성, 속성값의 관계 (★1:M 문장 진위 판별 단골 출제!)**:\n  - 한 개의 **엔터티**는 **두 개 이상의 인스턴스의 집합**이어야 한다.\n  - 한 개의 **엔터티**는 **두 개 이상의 속성**을 갖는다.\n  - 한 개의 **속성**은 **한 개의 속성값**을 갖는다. *(만약 한 속성이 여러 개의 값을 가지면 다중값 속성이므로 **제1정규화** 대상!)*\n- **속성의 표기법**: 엔터티 내에 이름을 포함하여 표현한다 (IE 표기법은 상단 칸에 PK, 하단 칸에 일반 속성 / Barker 표기법은 `#`이 PK, `*`이 필수(Mandatory), `o`가 선택(Optional)).\n\n![속성의 IE 표기법과 Barker 표기법 비교](images/p005_img03.png)\n\n#### 2. 속성의 특징과 분류 체계\n- **속성의 특징**:\n  - 엔터티와 마찬가지로 반드시 해당 업무에서 필요하고 관리하고자 하는 정보여야 한다.\n  - 정규화 이론에 근간하여 **정해진 주식별자에 함수적 종속성**을 가져야 한다.\n  - **하나의 속성에는 한 개의 값**만을 가진다. 하나의 속성에 여러 개의 값이 있는 다중값일 경우 별도의 엔터티를 이용하여 분리한다.\n- **① 속성의 특성에 따른 분류 (`\"기·설·파\"` — 시험 출제율 1위!)**:\n  1. **기본 속성 (Basic Attribute)**: 업무로부터 추출한 모든 일반적인 속성. 엔터티에 가장 일반적이고 많은 속성을 차지한다. (예: 원금, 예치기간 등 원래 있는 값. *주의: 코드성 데이터, 일련번호, 자동 계산된 합계 등은 기본속성이 아님!*)\n  2. **설계 속성 (Designed Attribute)**: 업무상 필요한 데이터 이외에 **데이터 모델링을 위해, 업무를 규칙화하기 위해 속성을 새로 만들거나 변형하여 정의**하는 속성. (예: **코드성 속성**(`지점코드`, `상품코드`), **일련번호**(`주문번호`) 등)\n  3. **파생 속성 (Derived Attribute)**: 다른 속성에 영향을 받아 발생하는 속성으로서 보통 **계산된 값**들이 이에 해당된다. 데이터 정합성을 유지하기 위해 **가급적 파생속성을 적게 정의**하는 것이 좋다. (예: `합계`, `평균`, `이자`, `재고수량` 등)\n- **② 엔터티 구성방식에 따른 분류**:\n  - **PK (Primary Key, 주식별자) 속성**: 엔터티를 식별할 수 있는 속성\n  - **FK (Foreign Key, 외래식별자) 속성**: 다른 엔터티와의 관계에서 포함된 속성\n  - **일반 속성**: 엔터티에 포함되어 있고 PK, FK에 포함되지 않은 속성\n- **③ 분리가능성에 따른 분류**:\n  - **단순 속성 (Simple Attribute)**: 나이, 성별 등 다른 속성과 독립적인 의미의 단일 구성\n  - **복합 속성 (Composite Attribute)**: 주소(시·구·동·번지), 전화번호 등 여러 세부 속성들로 구성될 수 있는 속성\n- **④ 속성값의 수에 따른 분류**:\n  - **단일값 속성 (Single-Valued Attribute)**: 속성 하나에 한 개의 값을 가짐 (예: 주민등록번호)\n  - **다중값 속성 (Multi-Valued Attribute)**: 속성 하나에 여러 개의 값을 가질 수 있는 경우 (예: 여러 개의 전화번호, 취미) ➔ **1차 정규화를 하거나, 별도의 엔터티로 만들어 관계로 연결해야 한다!**\n\n![단일값 속성과 다중값 속성의 엔터티 분리 예시](images/p006_img01.png)\n\n#### 3. 도메인(Domain)과 속성의 명명(Naming) 원칙\n- **도메인 (Domain)**: 각 속성이 가질 수 있는 **값의 범위**를 말한다. 엔터티 내에서 속성에 대한 **데이터타입과 크기 그리고 제약사항을 지정**하는 것이다. (예: '학생' 엔터티의 '학점' 속성의 도메인은 `0.0에서 4.5 사이의 실수`이며, '주소' 속성은 `길이가 20자리 이내인 문자열`로 정의할 수 있다.)\n- **속성의 명명(Naming) 원칙**:\n  1. 해당 업무에서 사용하는 이름을 부여한다.\n  2. **서술식 속성명은 사용하지 않는다** (명사형 사용).\n  3. **약어 사용은 가급적 제한**한다.\n  4. **전체 데이터모델에서 유일성 확보**가 되도록 명명하는 것이 좋다 (데이터 정합성 및 반정규화/이력관리 시 혼란 방지).\n\n![속성의 명명 원칙 (잘못된 사례 vs 올바른 사례)](images/p006_img02.png)"}, {"id": "ch-04", "index": 4, "title": "1-1-4. 관계(Relationship)", "subj_id": "tab1", "subj_name": "1과목 · 데이터 모델링의 이해", "badge": "1과목 1장 · 데이터 모델링의 이해", "md": "# 1-1-4. 관계(Relationship)\n\n> **단원 분류**: `1과목` > `1-1. 데이터 모델링의 이해` > **`1-1-4. 관계`**\n\n## 💡 STEP 1. 핵심 개념 한눈에 이해하기\n\n> 관계(Relationship)란 두 **엔터티**가 서로 어떻게 연결되어 있는지 표현한 것이다.\n\nex) 가족의 '부모 ─ 자식 : 낳다/자식이다'처럼, 데이터 모델에서도 '회원 ─ 주문 : 주문하다/주문되다', '부서 ─ 사원 : 소속하다/소속되다'와 같이 양방향 동사로 표현\n\n---\n\n## [개념 도식화] 관계의 4요소\n\n| 기준 엔터티 | ➔ | 관계명 (동사) | ➔ | 대상 엔터티 |\n| :---: | :---: | :---: | :---: | :---: |\n| **회원 (`M01`)** | ➔ | **\"주문한다\"** *(능동적 표현)* | ➔ | **주문 (`O100`)** |\n| **주문 (`O100`)** | ➔ | **\"주문된다\"** *(수동적 표현)* | ➔ | **회원 (`M01`)** |\n\n회원 1명 → 주문 여러 건 (1:N). 양방향 관계명을 모두 명명\n\n| 요소 | 영문 | 설명 | 예 |\n|---|---|---|---|\n| 관계명 | Membership | 두 엔터티를 잇는 동사·역할명 | 주문하다 / 주문되다 |\n| 관계차수 | Cardinality | 1:1, 1:N, M:N | 회원 1 : N 주문 |\n| 관계선택성 | Optionality | 필수(Mandatory) / 선택(Optional) | 주문엔 반드시 회원이 있어야 하는가 |\n| 관계의 방향성 | Direction | 양방향 표현 (양쪽 관계명 모두 명명) | 회원→주문 / 주문→회원 |\n\n---\n\n## 관계차수(Cardinality) 3가지\n\n| 관계 차수 (Cardinality) | 엔터티 연결 형태 | 대표 예시 |\n| :---: | :---: | :--- |\n| **1 : 1 관계** | `[남편]` 1 ─── 1 `[아내]` | 양쪽 모두 1건씩만 매칭되는 관계 |\n| **1 : N 관계** | `[부모(부서)]` 1 ─── N `[자식(사원)]` | 한 부서에 여러 사원이 소속됨 (가장 보편적인 관계) |\n| **M : N 관계** | `[학생]` M ─── N `[과목]` | 한 학생이 여러 과목 수강 & 한 과목에 여러 학생 수강 |\n\n### 1:1 관계\n\n| 예시 | 설명 |\n|---|---|\n| 사원 ─ 사원증 | 사원 1명당 사원증 1개 |\n\n### 1:N 관계\n\n| 예시 | 설명 |\n|---|---|\n| 부서 ─ 사원 | 1개 부서에 N명 사원 |\n| 회원 ─ 주문 | 회원 1명이 N건 주문 |\n\n### M:N 관계\n\n| 예시 | 설명 |\n|---|---|\n| 학생 ─ 과목 | 학생 M명, 과목 N개 (서로 여러 개) |\n\nM:N 은 그대로 구현 불가. 중간에 교차 엔터티를 두어 1:N 두 개로 분해\n\n| 변환 전 (개념 모델 M:N) | ➔ | 변환 후 (논리/물리 모델 1:N, N:1 해소) |\n| :---: | :---: | :---: |\n| **`[학생]` M ─── N `[과목]`**<br>*(실제 DB 테이블로 바로 구현 불가 — 카티션 곱 발생)* | ➔ | **`[학생]` 1 ──▶ N `[수강 (교차/관계 엔터티)]` N ◀── 1 `[과목]`**<br>*(중간에 교차 엔터티 `수강`을 두어 1:N 관계 2개로 분해!)* |\n\n---\n\n## 관계선택성(Optionality)\n\n| 종류 | 표기 | 의미 |\n|---|---|---|\n| 필수(Mandatory) | ─ | 반드시 있어야 함 |\n| 선택(Optional) | ○ | 있을 수도 있고 없을 수도 있음 |\n\n```\n[회원] ──── [주문]      :  주문은 반드시 회원이 있어야 함(필수)\n[회원] ──○─ [쿠폰]      :  회원이 쿠폰은 없을 수도 있음(선택)\n```\n\n---\n\n## 관계의 분류 — 식별 vs 비식별\n\n| 관계 종류 | 선 모양 | 부모 PK(`부서코드`)의 상속 위치 | 자식 엔터티 구성 예시 |\n| :---: | :---: | :--- | :--- |\n| **식별 관계 (Identifying)** | **실선 (`───`)** | 자식의 **주식별자(PK)의 일부**로 상속 | • 자식 PK: **`부서코드(PK, FK)` + `사원번호(PK)`** |\n| **비식별 관계 (Non-Identifying)** | **점선 (`- - -`)** | 자식의 **일반 속성(FK)**으로만 상속 | • 자식 PK: **`사원번호(PK)`**<br>• 자식 일반속성: `부서코드(FK)` |\n\n| 종류 | 자식의 PK에 부모 **식별자**가 포함? | 표기 | 비유 |\n|---|---|---|---|\n| 식별 관계 | 포함됨 (강한 종속) | 실선 | 자식이 부모 없이 존재 불가 (예: 주문 ↔ 주문상세) |\n| 비식별 관계 | 포함 안 됨 (약한 종속) | 점선 | 자식이 부모 없이도 존재 가능 (예: 부서 ↔ 사원) |\n\n---\n\n## [SQL 실전] 관계는 외래키(FK)로 구현된다\n\n설계 단계의 관계는 SQL 단계에서 **조인**으로 활용. 관계와 조인의 연결은 **관계와 조인의 이해**에서\n\n```sql\n-- 회원(부모) 1 : N 주문(자식)\nCREATE TABLE MEMBER (\n    MEMBER_ID  VARCHAR2(10) PRIMARY KEY,\n    NAME       VARCHAR2(50)\n);\n\nCREATE TABLE ORDERS (\n    ORDER_ID   NUMBER PRIMARY KEY,\n    MEMBER_ID  VARCHAR2(10),  -- 외래키(관계의 구현)\n    ORD_DATE   DATE,\n    CONSTRAINT FK_ORDER_MEMBER\n        FOREIGN KEY(MEMBER_ID) REFERENCES MEMBER(MEMBER_ID)\n);\n```\n\n---\n\n## [Before & After] M:N 관계의 분해\n\n학생은 여러 과목을 듣고 한 과목엔 여러 학생이 등록 — 양쪽 모두 다(多)인 M:N. 그대로 두는 시도 vs 가운데 '수강' 교차 엔터티를 끼워 1:N 두 개로 쪼갠 형태\n\n### Before — M:N 관계는 그대로 구현 불가\n\n```\n[학생] M ────── N [과목]\n```\n\n| 학생 | 듣는 과목들 |\n|---|---|\n| 김철수 | 수학, 영어, 국어 |\n| 이영희 | 영어, 과학 |\n\n### After — 1:N + 1:N으로 분해\n\n```\n[학생] 1 ── N [수강] N ── 1 [과목]\n```\n\n**학생**\n\n| STU_ID | NAME |\n|---|---|\n| S01 | 김철수 |\n| S02 | 이영희 |\n\n**과목**\n\n| SUB_ID | NAME |\n|---|---|\n| K1 | 수학 |\n| K2 | 영어 |\n| K3 | 국어 |\n| K4 | 과학 |\n\n**수강(교차 엔터티)**\n\n| STU_ID | SUB_ID |\n|---|---|\n| S01 | K1 |\n| S01 | K2 |\n| S01 | K3 |\n| S02 | K2 |\n| S02 | K4 |\n\nM:N 을 그대로 두면 학생 행에 \"수학, 영어, 국어\" 같은 다중값 컬럼을 넣을 수밖에 없는데, 이는 1NF 위반이고 성적·수강일 같은 관계 속성도 둘 곳이 없어진다. 교차 엔터티를 두면 (S01, K1) 한 줄이 한 수강 사실을 표현하므로 관계 속성도 자연스럽게 거기에 붙는다. 양쪽이 다(多)인 관계를 만나면 반사적으로 교차 엔터티를 끼워 1:N + 1:N 으로 분해하는 것이 안전.\n\n---\n\n## [시험 출제 포인트]\n\n| 함정 | 정답 |\n|---|---|\n| M:N 관계는 그대로 구현 가능하다 | 교차 엔터티로 1:N 두 개로 분해 |\n| 식별 관계 = 점선 | 식별 관계 = 실선, 비식별 = 점선 |\n| 관계의 4가지 표기 요소 | 관계명 / 차수 / 선택성 / 방향성 |\n| 관계차수 3종류 | 1:1, 1:N, M:N |\n| 자식 엔터티에 부모 식별자가 PK로 들어가면 | 식별 관계 |\n| 부모 식별자가 일반 속성(FK)으로만 들어가면 | 비식별 관계 |\n\n단골 트릭: \"관계의 페어링(pairing)은 인스턴스 간의 개별적 연결\" → 관계의 구체적 사례를 가리키는 옳은 설명\n\n---\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · 관계 4요소: **관계명 / 관계차수 / 관계선택성 / 관계방향**\n> · 차수 3종: **1:1 · 1:N · M:N** (M:N은 교차 엔터티로 분해)\n> · 식별 = **실선**, 비식별 = **점선**\n> · 관계는 SQL 에서 **외래키(FK)** 로 구현된다\n\n\n---\n\n---\n\n## 📘 STEP 2. 상세 출제 이론 & 원본 강의 도표·슬라이드 완벽 정복 제4절. 관계 (Relationship)\n\n#### 1. 관계(Relationship)와 페어링(Pairing)의 이해\n- **관계의 정의**: 엔터티의 인스턴스 사이의 **논리적인 연관성**으로서 존재의 형태로서나 행위로서 서로에게 연관성이 부여된 상태.\n- **페어링 (Relationship Pairing)**: 엔터티 안에 **인스턴스가 개별적으로 관계를 가지는 것(짝)**이 페어링이고, **이것의 집합을 관계(Relationship)**로 표현한다는 것이다.\n  - *(비교: 개별 인스턴스들이 모여 **엔터티**가 되듯, 개별 **페어링**들이 모여 논리적인 **관계**가 된다!)*\n\n#### 2. 관계의 분류: 존재에 의한 관계 vs 행위에 의한 관계\n| 구분 | 존재에 의한 관계 (Existence) | 행위에 의한 관계 (Action / Event) |\n| :---: | :--- | :--- |\n| **의미** | 엔터티 간의 **상태(소속)** 자체에 의해 연관성이 발생하는 관계 | 엔터티 간에 **어떤 행위(Event)**가 일어남으로써 발생하는 관계 |\n| **예시** | `사원`과 `부서` 간의 **\"소속된다\"** 관계 | `고객`과 `주문` 간의 **\"주문한다\"** 관계 |\n| **UML 클래스 다이어그램 대응** | **연관관계 (Association)** — **실선**으로 표현 | **의존관계 (Dependency)** — **점선**으로 표현 |\n\n> ⚠️ **[시험 단골 함정 주의]**\n> **ERD와 UML 표기법 혼동 주의!**\n> - **ERD에서는** 존재적 관계와 행위에 의한 관계를 **구분하지 않고 단일화된 표기법**을 사용한다! (ERD에서 실선/점선은 존재/행위가 아니라 **식별자 관계(실선) vs 비식별자 관계(점선)**를 뜻함!)\n> - 반면 **UML(클래스 다이어그램)에서는** 존재에 의한 관계는 **연관관계(실선)**, 행위에 의한 관계는 **의존관계(점선)**로 구분하여 표현한다.\n\n![존재에 의한 관계(부서-사원)와 행위에 의한 관계(고객-주문)](images/p007_img01.png)\n\n#### 3. 관계의 표기법 3요소: 관계명, 관계차수(Cardinality), 관계선택사양(Optionality)\n1. **관계명 (Membership)**:\n   - 관계의 시작과 끝(양방향)에 모두 관계이름을 가져야 하며, 참여자의 관점에 따라 **능동적(Active)이거나 수동적(Passive)**으로 명명된다.\n   - 애매한 동사(`관계된다`, `관련있다` 등)를 피하고 **현재형**(`강의를 한다`, `소속된다` 등)으로 표현해야 한다.\n2. **관계차수 (Degree / Cardinality)**:\n   - 두 개의 엔터티 간 관계에서 참여자의 수를 표현하는 것 (`1:1`, `1:M`, `M:N`).\n   - 한 개가 참여하는 경우는 실선(`|`), 다수가 참여하는 경우는 **까마귀발(Crow's Foot, 삼발이)**로 표시한다.\n   - **`M:N` 관계**: 카티션 곱(Cartesian Product)이 발생하여 성능 저하 및 데이터 중복이 생기므로, 추후 **반드시 두 엔터티의 주식별자를 상속받는 '관계엔터티(교차엔터티)'를 추가하여 `1:M`, `1:N` 관계로 해소**해야 한다!\n\n![관계차수 (1:1, 1:M, M:N) 표기법 도식](images/p007_img02.png)\n\n3. **관계선택사양 (Optionality)**:\n   - **필수참여 (Mandatory Membership)**: 참여하는 모든 인스턴스가 반드시 관계를 맺어야 하는 경우 (IE: `|` 수직선, Barker: **실선**)\n   - **선택참여 (Optional Membership)**: 참여하는 인스턴스가 관계를 맺을 수도 있고 안 맺을 수도 있는 경우 (IE: `O` 동그라미, Barker: **점선**). 선택참여로 지정된 쪽의 FK 속성은 **NULL을 허용**하게 된다!\n\n![필수참여(Mandatory)와 선택참여(Optional) 비교 예시 (지하철 안내방송 비유)](images/p008_img01.png)\n\n#### 4. IE(Information Engineering) 표기법 vs Barker(바커) 표기법 총정리\n\n![IE 표기법과 Barker 표기법 완벽 비교 도표](images/p008_img02.png)\n\n| 비교 항목 | IE (Information Engineering) 표기법 | Barker (Case*Method) 표기법 |\n| :---: | :--- | :--- |\n| **엔터티 표기** | 사각형 박스 (모서리 직각), 상단에 엔터티명 | **둥근 모서리 사각형** (Soft-box), 내부 상단에 엔터티명 |\n| **속성 구분칸** | 박스 내부 가로선으로 **상단(PK 영역) / 하단(일반속성 영역)** 분리 | 가로 구분선 없음! 기호(`#`, `*`, `o`)로 구분 |\n| **속성 기호** | 별도 기호 대신 `PK`, `FK`, `NOT NULL` 텍스트 표기 | **`#` (주식별자 UID)**, **`*` (필수 Mandatory / NOT NULL)**, **`o` (선택 Optional / NULL 허용)** |\n| **관계차수 (`1:M`)** | `1`은 수직선(`\\|`), `M`은 까마귀발(삼발이) | `1`은 별도 수직선 없음, `M`은 까마귀발(삼발이) |\n| **관계선택사양 (필수/선택)** | 관계선 끝에 **`\\|` (필수)** / **`O` (선택)** 기호 표시 | 관계선 자체를 **실선(필수)** / **점선(선택)**으로 절반씩 나누어 표시 |\n| **식별자/비식별자 관계** | 관계선 전체가 **실선(식별자 관계)** / **점선(비식별자 관계)** | 자식 엔터티 측 관계선에 **`\\|` (UID Bar, 수직 막대)**를 그으면 식별자 관계! |\n\n#### 5. 관계의 정의 체크리스트 및 ERD 읽는 방법\n- **두 엔터티 간 관계 정의 시 체크사항 3가지**:\n  1. 두 개의 엔터티 사이에 **관심있는 연관규칙**이 존재하는가?\n  2. 두 개의 엔터티 사이에 **정보의 조합**이 발생되는가?\n  3. 업무기술서, 장표에 **관계연결에 대한 규칙이 서술**되어 있는가? / **관계연결을 가능하게 하는 동사(Verb)**가 있는가?\n- **ERD 관계 읽는 방법**:\n  - **각각(Each)** ➔ **엔터티명** ➔ **관계선택사양(반드시 / 때때로)** ➔ **관계차수(하나의 / 하나 이상의)** ➔ **상대 엔터티명** ➔ **관계명(동사)** 순서로 읽는다."}, {"id": "ch-05", "index": 5, "title": "1-1-5. 식별자(Identifier)", "subj_id": "tab1", "subj_name": "1과목 · 데이터 모델링의 이해", "badge": "1과목 1장 · 데이터 모델링의 이해", "md": "# 1-1-5. 식별자(Identifier)\n\n> **단원 분류**: `1과목` > `1-1. 데이터 모델링의 이해` > **`1-1-5. 식별자`**\n\n## 💡 STEP 1. 핵심 개념 한눈에 이해하기\n\n> 식별자(Identifier)란 **엔터티** 안의 인스턴스를 서로 구분해 주는 유일한 표식이다. 테이블의 기본키(Primary Key)가 된다.\n\nex) 같은 이름의 김철수가 100명이어도 주민등록번호는 모두 다름 — 이름은 일반 속성, 주민번호는 식별자(겹치지 않는 유일값)\n\n---\n\n## [개념 도식화] 식별자의 위치\n\n회원(MEMBER) 테이블 — PK 가 모든 행을 유일하게 구분:\n\n| PK&nbsp;(주식별자) | 이름 | 전화번호 |\n|---|---|---|\n| **M01** | 김철수 | 010-1111 |\n| **M02** | 이영희 | 010-2222 |\n\n같은 이름이어도 PK가 다르므로 **100% 구분 가능**.\n\n---\n\n## 식별자의 4가지 분류 기준\n\n| 식별자 4대 분류 기준 | 구분 1 | 구분 2 | 핵심 구분 포인트 |\n| :---: | :---: | :---: | :--- |\n| **① 대표성 여부** | **주식별자 (Primary)** | **보조식별자 (Alternate)** | 엔터티를 대표하며 타 엔터티와 참조(FK) 연결 가능 여부 |\n| **② 스스로 생성 여부** | **내부식별자 (Internal)** | **외부식별자 (Foreign, FK)** | 자신의 엔터티 내부에서 스스로 생성되었는가 vs 부모에게 상속받았는가 |\n| **③ 구성 속성 수** | **단일식별자 (Single)** | **복합식별자 (Composite)** | PK를 구성하는 컬럼이 1개인가 vs 2개 이상인가 |\n| **④ 대체 여부** | **본질식별자 (Natural)** | **인조식별자 (Surrogate)** | 업무에 원래 존재하는 본래 키인가 vs 인위적으로 만든 일련번호인가 |\n\n| 기준 | 분류 | 핵심 차이 |\n|---|---|---|\n| ① 대표성 | **주식별자 / 보조식별자** | 엔터티의 대표 식별자 vs 보조용 |\n| ② 생성 여부 | **내부식별자 / 외부식별자** | 자기 엔터티에서 생성 vs 다른 엔터티에서 가져옴 (= FK) |\n| ③ 속성 수 | **단일식별자 / 복합식별자** | 1개 속성 vs 2개 이상 결합 |\n| ④ 대체 여부 | **본질식별자 / 인조식별자** | 업무 자연 도출 vs 인위적 부여 |\n\n### 대표성\n\n| 종류 | 의미 | 예 |\n|---|---|---|\n| 주식별자(Primary) | 엔터티 대표 식별자 | 회원ID |\n| 보조식별자(Alternate) | 보조적 식별자 | 이메일 |\n\n### 스스로 만든 vs 외부에서 받음\n\n| 종류 | 의미 | 예 |\n|---|---|---|\n| 내부식별자 | 자기 엔터티 내에서 생성 | MEMBER 테이블의 MEMBER_ID |\n| 외부식별자 | 다른 엔터티의 주식별자를 참조해 가져옴 = **외래키(FK)** | 주문 테이블의 MEMBER_ID (← 회원 PK 참조) |\n\n### 속성의 개수\n\n| 종류 | 의미 | 예 |\n|---|---|---|\n| 단일식별자 | 1개 속성 | 회원ID |\n| 복합식별자 | 2개 이상 속성 결합 | (주문ID + 상품ID) → 주문상세 PK |\n\n### 본질 vs 인조\n\n| 종류 | 의미 | 예 |\n|---|---|---|\n| 본질식별자 | 업무에서 자연스럽게 도출 | 주민번호, 학번 |\n| 인조식별자 | 인위적으로 만든 식별자 | 자동증가 ID, UUID |\n\n본질·인조의 트레이드오프는 **본질식별자 vs 인조식별자**에서\n\n---\n\n## 주식별자의 4가지 조건\n\n| 조건 | 의미 |\n|---|---|\n| 유일성 | 모든 인스턴스를 유일하게 구분 |\n| 최소성 | 꼭 필요한 속성만으로 구성 (**정규화**와 직결) |\n| 불변성 | 한번 정해지면 거의 변하지 않음 |\n| 존재성 | NULL이 될 수 없음 |\n\n암기: **유·최·불·존**\n\n---\n\n## [SQL 실전] PK / FK 정의\n\n```sql\n-- 회원: 단일 PK\nCREATE TABLE MEMBER (\n    MEMBER_ID  VARCHAR2(10) PRIMARY KEY,   -- 주식별자\n    EMAIL      VARCHAR2(100) UNIQUE,       -- 보조식별자\n    NAME       VARCHAR2(50) NOT NULL\n);\n\n-- 주문상세: 복합 PK\nCREATE TABLE ORDER_DETAIL (\n    ORDER_ID   NUMBER,\n    PROD_ID    VARCHAR2(10),\n    QTY        NUMBER,\n    CONSTRAINT PK_ORD_DTL PRIMARY KEY (ORDER_ID, PROD_ID),  -- 복합 식별자\n    CONSTRAINT FK_OD_ORD  FOREIGN KEY (ORDER_ID) REFERENCES ORDERS(ORDER_ID),\n    CONSTRAINT FK_OD_PROD FOREIGN KEY (PROD_ID)  REFERENCES PRODUCT(PROD_ID)\n);\n```\n\n---\n\n## [Before & After] 식별자를 잘못 잡으면\n\n이름이 똑같은 김철수가 두 명 가입한 상황. 이름을 PK로 잡은 경우 vs 회원ID 를 따로 부여한 경우\n\n### Before — 식별자가 '이름'\n\n| NAME (PK?) | PHONE |\n|---|---|\n| 김철수 | 010-1111 |\n| 김철수 | 010-2222 |\n\n동명이인 등록 불가 (유일성 위반)\n\n### After — 식별자가 '회원ID'\n\n| MEMBER_ID (PK) | NAME | PHONE |\n|---|---|---|\n| M01 | 김철수 | 010-1111 |\n| M02 | 김철수 | 010-2222 |\n\n동명이인이라도 ID로 구분 가능\n\n이름은 같은 값이 얼마든지 나올 수 있어 유일성을 보장하지 못한다. 식별자의 4대 조건(유·최·불·존) 중 가장 먼저 깨지는 게 유일성이고, 결혼·개명 등으로 변할 수 있어 불변성도 위태롭다. 업무 속성 중 자연스러운 유일값이 마땅치 않으면 회원ID 같은 인조식별자를 PK 로 두는 것이 안전.\n\n---\n\n## 식별자 표기\n\nERD 표기 — 회원 엔터티:\n\n| 영역 | 속성 | 비고 |\n|---|---|---|\n| **PK 영역** | MEMBER_ID | 주식별자 (Primary) |\n| 일반 속성 | NAME | |\n| 일반 속성 | EMAIL | UNIQUE = 보조식별자 |\n| 일반 속성 | PHONE | |\n\n---\n\n## [시험 출제 포인트]\n\n| 함정 | 정답 |\n|---|---|\n| 주식별자 4대 조건 | 유일성 / 최소성 / 불변성 / 존재성(NOT NULL) |\n| 주식별자는 NULL이 가능하다 | 불가 |\n| 복합식별자는 PK가 될 수 없다 | 될 수 있다(여러 속성으로 구성된 PK) |\n| 외부식별자는 다른 엔터티의 주식별자를 참조 | 옳다(= 외래키, FK) |\n| 인조식별자의 단점 | 업무적 의미가 없어 데이터 품질 검증이 어려움 |\n| 본질식별자가 너무 길거나 자주 변하면 | 인조식별자(대체키) 도입 고려 |\n\n단골 트릭: \"주식별자는 자주 변경되어도 된다\" → 불변성 위반\n\n---\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · 4대 조건: **유·최·불·존** (유일성 / 최소성 / 불변성 / 존재성=NOT NULL)\n> · 4대 분류: **대표성·생성여부·속성수·대체여부** 4가지 기준 ⟶ 8개 종류\n> · 외부식별자 = **외래키(FK)** = 다른 엔터티의 PK 참조\n> · 본질식별자가 너무 길거나 자주 변하면 → **인조식별자(대체키)** 도입\n> · NULL 가능? → **불가** (존재성 위반)\n\n\n---\n\n---\n\n## 📘 STEP 2. 상세 출제 이론 & 원본 강의 도표·슬라이드 완벽 정복 제5절. 식별자 (Identifier)\n\n#### 1. 식별자(Identifier)의 개념과 주식별자의 4대 특징\n- **식별자의 정의**: 하나의 엔터티에 구성되어 있는 여러 개의 속성 중에 **엔터티를 대표할 수 있는 속성**을 의미하며, 하나의 엔터티는 반드시 **하나의 유일한 식별자**가 존재해야 한다.\n- *(용어 구분: 논리 데이터 모델링에서는 **'식별자(Identifier)'**라고 부르고, 물리 데이터 모델링에서는 **'키(Key)'**라고 부른다!)*\n- **주식별자(Primary Identifier)의 4대 특징 (★무조건 출제: `\"유·최·불·존\"`)**:\n  1. **유일성 (Uniqueness)**: 주식별자에 의해 엔터티 내에 **모든 인스턴스들이 유일하게 구분**되어야 한다. (예: '사원번호'는 각 사원을 유일하게 구분하지만, '이름'은 동명이인이 있어 유일성을 만족하지 못함)\n  2. **최소성 (Minimality)**: 주식별자를 구성하는 속성의 수는 **유일성을 만족하는 최소의 수**가 되어야 한다. (예: `사원번호` 하나만으로 유일하게 식별 가능한데 `사원번호 + 사원이름`으로 묶으면 최소성 위배!)\n  3. **불변성 (Immutability)**: 지정된 주식별자의 값은 **자주 변하지 않는 것**이어야 한다. 한 번 특정 엔터티에 지정되면 그 식별자의 값은 변하지 않아야 한다.\n  4. **존재성 (Existence)**: 주식별자가 지정되면 **반드시 값이 들어와야 한다 (`NOT NULL` — Null 안 됨!)**.\n\n![주식별자의 4가지 특징 요약](images/p009_img01.png)\n\n#### 2. 식별자 분류 체계 4대 기준\n> 💡 **[핵심 필수 암기]**\n> **시험 단골 문제**: 4가지 분류 기준과 대응하는 식별자 쌍을 정확히 짝지어야 합니다!\n\n![식별자 분류 체계 4대 기준 총정리 표](images/p009_img02.png)\n\n| 분류 기준 | 구분 1 | 구분 2 | 핵심 설명 및 특징 |\n| :---: | :---: | :---: | :--- |\n| **1. 대표성 여부** | **주식별자**<br>(Primary Identifier) | **보조식별자**<br>(Alternate Identifier) | - **주식별자**: 엔터티 내에서 각 어커런스를 구분할 수 있는 구분자이며, **타 엔터티와 참조관계를 연결할 수 있는 식별자**<br>- **보조식별자**: 엔터티 내에서 각 어커런스를 구분할 수 있는 구분자이나 대표성을 가지지 못해 **참조관계 연결을 못함** (물리 모델에서 Unique Key / AK로 전환) |\n| **2. 스스로 생성 여부** | **내부식별자**<br>(Internal Identifier) | **외부식별자**<br>(Foreign Identifier) | - **내부식별자**: 엔터티 내부에서 **스스로 만들어지는 식별자**<br>- **외부식별자 (FK)**: 타 엔터티와의 관계를 통해 **타 엔터티로부터 받아오는 식별자** |\n| **3. 단일 속성 여부** | **단일식별자**<br>(Single Identifier) | **복합식별자**<br>(Composite Identifier) | - **단일식별자**: **하나의 속성**으로 구성된 식별자<br>- **복합식별자**: **둘 이상의 속성**으로 구성된 식별자 |\n| **4. 대체 여부** | **본질식별자**<br>(Original Identifier) | **인조식별자**<br>(Surrogate Identifier) | - **본질식별자**: 업무에 의해 만들어지는 식별자 (원조식별자)<br>- **인조식별자**: 업무적으로 만들어지지는 않지만 원조식별자가 복잡한 구성을 가지고 있기 때문에 **인위적으로 만든 식별자** (대리식별자, 일련번호 등) |\n\n#### 3. 주식별자 도출 기준 4가지\n1. **해당 업무에서 자주 이용되는 속성**을 주식별자로 지정한다. (예: 학생번호와 주민번호 중 학사 업무에서 자주 쓰는 `학생번호`를 주식별자로, `주민번호`를 보조식별자로 지정)\n2. **명칭, 내역 등과 같이 이름으로 기술되는 것들은 가능하면 주식별자로 지정하지 않는다.** (예: 부서명보다는 `부서코드`를 부여하여 주식별자로 설정 — 명칭은 길고 변경 가능성이 있으며 WHERE절 기술 시 불편함)\n3. **복합으로 주식별자로 구성할 경우 너무 많은 속성이 포함되지 않도록 한다.** (주식별자 속성이 너무 많으면(보통 7~8개 이상) 조인 시 SQL이 복잡해지고 성능이 저하되므로 **새로운 인조식별자(일련번호)**를 생성하여 처리한다.)\n\n![주식별자 도출 기준 시각 자료](images/p010_img01.png)\n\n#### 4. 식별자 관계(Identifying) vs 비식별자 관계(Non-Identifying)\n- **외부식별자(FK)를 자식 엔터티의 주식별자(PK)에 포함시킬 것인가?**에 따라 결정된다.\n  - **식별자 관계 (Identifying Relationship, 실선)**: 부모로부터 받은 식별자를 **자식엔터티의 주식별자(PK)로 이용**하는 경우. Null 값이 오면 안 되므로 **반드시 부모엔터티가 생성되어야 자기 자신의 엔터티가 생성**되는 강한 연결관계.\n  - **비식별자 관계 (Non-Identifying Relationship, 점선)**: 부모엔터티로부터 속성을 받았지만 **자식엔터티의 주식별자로 사용하지 않고 일반적인 속성(FK만)으로만 사용**하는 경우.\n\n![식별자 관계와 비식별자 관계의 결정 요인 흐름도](images/p010_img02.png)\n\n- **비식별자 관계(점선)로 설정해야 하는 4가지 경우**:\n  1. 자식엔터티에서 받은 속성이 **반드시 필수가 아니어도 무방**하기 때문에 부모 없는 자식이 생성될 수 있는 경우 (약한 연결관계)\n  2. 엔터티별로 **데이터의 생명주기(Life Cycle)를 다르게 관리**할 경우 (예: 부모 엔터티 인스턴스가 먼저 소멸되어도 자식 엔터티의 데이터는 남아있어야 하는 경우)\n  3. 여러 개의 엔터티가 하나의 엔터티로 통합되어 표현되었는데 각각의 엔터티가 별도의 관계를 가질 때\n  4. 자식엔터티에 주식별자로 사용하여도 되지만, **자식엔터티에서 별도의 주식별자를 생성하는 것이 더 유리**하다고 판단될 때 (PK 속성이 계속 누적되는 것을 차단할 때)\n\n- **식별자 관계로만 설정할 경우의 문제점**:\n  - 부모 ➔ 자식 ➔ 손자 엔터티로 내려갈수록 **주식별자 속성이 지속적으로 증가**하여 개발자(사람)가 취급하기에 **개발 복잡성과 오류가능성을 유발**시키는 요인이 될 수 있다! (WHERE절 조인 조건이 기하급수적으로 길어짐)\n\n![식별자 관계로만 연결했을 때 PK 속성이 누적되어 SQL이 복잡해지는 문제](images/p011_img01.png)\n\n![비식별자 관계로 전환하여 PK 복잡도를 낮춘 모델과 SQL 비교](images/p011_img02.png)\n\n- **식별자 관계 vs 비식별자 관계 핵심 비교표**:\n\n![식별자 관계와 비식별자 관계 완벽 비교표](images/p011_img03.png)\n\n| 비교 항목 | 식별자 관계 (Identifying Relationship) | 비식별자 관계 (Non-Identifying Relationship) |\n| :---: | :--- | :--- |\n| **목적** | **강한 연결관계** 표현 | **약한 연결관계** 표현 |\n| **자식 주식별자 영향** | 자식 주식별자(PK)의 구성에 **포함됨 (PK + FK)** | 자식 **일반 속성**에 포함됨 (**FK만**) |\n| **표기법 (IE)** | **실선** 표현 | **점선** 표현 |\n| **연결 고려사항** | - 반드시 부모엔터티에 종속<br>- 자식 주식별자구성에 부모 주식별자 포함 필요<br>- 상속받은 주식별자속성을 타 엔터티에 이전 필요 | - 약한 종속관계<br>- 자식 주식별자구성을 독립적으로 구성<br>- 자식 주식별자구성에 부모 주식별자 부분 필요<br>- 상속받은 주식별자속성을 타 엔터티에 차단 필요<br>- 부모쪽의 관계참여가 선택관계 |"}, {"id": "ch-06", "index": 6, "title": "1-2-1. 정규화(Normalization)", "subj_id": "tab1", "subj_name": "1과목 · 데이터 모델링의 이해", "badge": "1과목 2장 · 데이터 모델과 SQL", "md": "# 1-2-1. 정규화(Normalization)\n\n> **단원 분류**: `1과목` > `1-2. 데이터 모델과 SQL` > **`1-2-1. 정규화`**\n\n## 💡 STEP 1. 핵심 개념 한눈에 이해하기\n\n> 정규화(Normalization)란 데이터의 중복을 없애고 깔끔하게 정리하는 작업이다. 테이블을 단계적으로 쪼개서 이상현상을 막는다.\n\nex) 옷장 한 칸에 속옷·양말·셔츠·외투를 다 욱여넣으면 양말 찾기가 어렵고, 셔츠를 빼다가 다른 옷이 떨어진다. 칸을 나눠 종류별로 분리하는 것이 정규화.\n\n---\n\n## [개념 도식화] 정규화 단계\n\n| 비정규형 | ➔ | 제1정규형 (1NF) | ➔ | 제2정규형 (2NF) | ➔ | 제3정규형 (3NF) | ➔ | BCNF |\n| :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: |\n| 중복·다중값 존재 | | **원자값 확보**<br>(반복/다중값 제거) | | **부분 함수 종속 제거**<br>(복합 PK의 일부에만 종속 분리) | | **이행 함수 종속 제거**<br>(일반속성 간 `A→B→C` 분리) | | **결정자이면서 후보키가 아닌 것 제거** |\n\n| 단계 | 핵심 규칙 | 한줄 의미 |\n|---|---|---|\n| 1NF | 모든 속성이 원자값 | 한 칸에 한 값만 |\n| 2NF | 부분 함수 종속 제거 | PK 일부에만 종속된 컬럼 분리 |\n| 3NF | 이행 함수 종속 제거 | A→B→C 형태 분리 |\n| BCNF | 모든 결정자가 후보키 | 더 엄격한 3NF |\n\n---\n\n## 이상현상(Anomaly) 3가지\n\n| 종류 | 무슨 일인가 | 비유 |\n|---|---|---|\n| 삽입 이상 | 데이터 넣으려는데 다른 정보가 없어 못 넣음 | 학생 등록하려는데 수강과목 칸을 비울 수 없음 |\n| 갱신 이상 | 한 곳만 바꿨는데 다른 곳이 안 바뀜 | 회원 주소 1곳만 수정해 데이터 불일치 |\n| 삭제 이상 | 데이터 지우려다 필요한 정보까지 사라짐 | 마지막 수강 취소했는데 학생 정보까지 삭제 |\n\n---\n\n## 1NF — 원자값 만들기\n\n### Before(비정규형)\n\n| 학생 | 수강과목 |\n|---|---|\n| 김철수 | 수학, 영어, 국어 |\n\n### After(1NF)\n\n| 학생 | 수강과목 |\n|---|---|\n| 김철수 | 수학 |\n| 김철수 | 영어 |\n| 김철수 | 국어 |\n\n모든 칸이 하나의 값을 가짐\n\n---\n\n## 2NF — 부분 함수 종속 제거\n\n부분 함수 종속이란 **복합 식별자**인 PK (A, B) 중 어떤 컬럼이 A에만 또는 B에만 의존하는 상태\n\n### Before(1NF, 부분종속 존재)\n\nPK = (학생ID, 과목ID)\n\n| 학생ID | 과목ID | 학생이름 | 과목명 | 성적 |\n|---|---|---|---|---|\n| S01 | K1 | 김철수 | 수학 | 90 |\n| S01 | K2 | 김철수 | 영어 | 85 |\n\n학생이름은 학생ID에만, 과목명은 과목ID에만 종속됨\n\n### After(2NF)\n\n**학생**\n\n| 학생ID | 학생이름 |\n|---|---|\n| S01 | 김철수 |\n\n**과목**\n\n| 과목ID | 과목명 |\n|---|---|\n| K1 | 수학 |\n| K2 | 영어 |\n\n**수강**\n\n| 학생ID | 과목ID | 성적 |\n|---|---|---|\n| S01 | K1 | 90 |\n| S01 | K2 | 85 |\n\n---\n\n## 3NF — 이행 함수 종속 제거\n\n이행 종속이란 A → B → C 형태로, PK가 아닌 B를 통해 C가 결정되는 상태\n\n### Before(2NF, 이행종속)\n\n| 사원ID(PK) | 부서ID | 부서명 |\n|---|---|---|\n| E01 | D1 | 영업부 |\n| E02 | D1 | 영업부 |\n\n사원ID → 부서ID → 부서명 (이행 종속)\n\n### After(3NF)\n\n**사원**\n\n| 사원ID | 부서ID |\n|---|---|\n| E01 | D1 |\n| E02 | D1 |\n\n**부서**\n\n| 부서ID | 부서명 |\n|---|---|\n| D1 | 영업부 |\n\n---\n\n## BCNF — 더 엄격한 3NF\n\n3NF 까지 정규화해도 일부 비정상 종속이 남는 경우가 있다. **모든 결정자(determinant)가 후보키여야** BCNF.\n\n> **결정자란?** — A → B 일 때 B 를 결정하는 A. 이 A 가 후보키 (PK 또는 UNIQUE) 가 아니면 BCNF 위반.\n\n### 예시 (3NF 만족, BCNF 위반)\n\nPK = (학생, 과목)\n\n| 학생 | 과목 | 강사 |\n|---|---|---|\n| S01 | 수학 | 김교수 |\n| S02 | 수학 | 김교수 |\n| S03 | 영어 | 이교수 |\n\n규칙: 한 강사는 한 과목만 가르침 → **강사 → 과목** 종속 존재\n\n문제: '강사' 는 후보키가 아닌데 '과목' 을 결정 → BCNF 위반\n\n### After (BCNF)\n\n**강사_과목**: (강사, 과목)\n**학생_강사**: (학생, 강사)\n\n| 단계 | 차이 |\n|---|---|\n| 3NF | PK가 아닌 컬럼이 PK에 직접 종속 (이행 종속 제거 완료) |\n| BCNF | 모든 함수 종속의 **결정자가 후보키** 여야 함 |\n\n비유하면 3NF 는 거의 깔끔, BCNF 는 완벽주의 정리\n\n---\n\n## [SQL 실전] 정규화로 분리\n\n```sql\n-- 정규화 전: 한 테이블에 모든 정보\nCREATE TABLE BAD_ORDER (\n    ORDER_ID NUMBER,\n    PROD_ID  VARCHAR2(10),\n    PROD_NAME VARCHAR2(50),  -- 상품명이 함께\n    QTY      NUMBER,\n    CUST_NAME VARCHAR2(50)   -- 고객명이 함께\n);\n\n-- 정규화 후: 책임에 따라 분리\nCREATE TABLE PRODUCT (PROD_ID VARCHAR2(10) PRIMARY KEY, PROD_NAME VARCHAR2(50));\nCREATE TABLE CUSTOMER(CUST_ID VARCHAR2(10) PRIMARY KEY, CUST_NAME VARCHAR2(50));\nCREATE TABLE ORDERS  (ORDER_ID NUMBER PRIMARY KEY, CUST_ID VARCHAR2(10));\nCREATE TABLE ORDER_DETAIL(ORDER_ID NUMBER, PROD_ID VARCHAR2(10), QTY NUMBER);\n```\n\n---\n\n## [Before & After] 정규화 효과\n\n주문 한 건마다 고객 정보·상품 단가까지 한 줄에 다 적어두는 비정규형 테이블. 김철수가 두 번 주문하면 그의 전화번호가 두 번 똑같이 적히고, 사과 단가는 주문될 때마다 반복. 정규화 전후 차이.\n\n### Before\n\n| 주문ID | 고객명 | 고객전화 | 상품명 | 단가 | 수량 |\n|---|---|---|---|---|---|\n| 1 | 김철수 | 010-1111 | 사과 | 1000 | 2 |\n| 2 | 김철수 | 010-1111 | 배 | 2000 | 1 |\n| 3 | 이영희 | 010-2222 | 사과 | 1000 | 3 |\n\n고객 정보 중복, 상품 단가 중복, 수정 시 일관성 깨짐\n\n### After (3NF)\n\n고객·상품·주문·주문상세 4개로 분리되어 중복 제거\n\n같은 고객 전화번호가 주문 행마다 반복되는 것은 함수 종속이 한 테이블 안에 섞여 있기 때문(고객명·고객전화는 고객ID 에, 상품명·단가는 상품ID 에 종속). 종속이 다른 데이터끼리 같은 테이블을 공유하면 갱신·삭제·삽입 이상이 한 자리에서 다 터진다. \"한 테이블엔 한 가지 의미만\"이라는 원칙으로 단계적으로 쪼개면, 김철수의 전화번호는 고객 테이블 한 줄에서만 관리하면 된다.\n\n---\n\n## 정규화의 장단점\n\n| 장점 | 단점 |\n|---|---|\n| 데이터 중복 제거 | 테이블이 많아짐 |\n| 이상현상 방지 | **조인**이 늘어남 |\n| 데이터 무결성 | 조회 성능 일부 저하 가능 |\n| 변경/유지보수 용이 | — |\n\n성능을 위해 의도적 반정규화(역정규화)도 가능\n\n---\n\n## [시험 출제 포인트]\n\n| 함정 | 정답 |\n|---|---|\n| 정규화 단계 순서 | 1NF → 2NF → 3NF → BCNF |\n| 1NF 핵심 | 원자값 |\n| 2NF 핵심 | 부분 함수 종속 제거 |\n| 3NF 핵심 | 이행 함수 종속 제거 |\n| 정규화의 단점 | 조인 증가로 인한 조회 성능 저하 |\n| 이상현상 3종 | 삽입/갱신/삭제 이상 |\n| \"정규화하면 항상 성능이 좋아진다\" | 조회는 느려질 수 있음. 단 데이터 무결성은 향상 |\n\n단골 출제: \"복합 PK 중 일부 속성에만 종속되는 컬럼이 있으면 어느 정규형 위반인가\" → 2NF\n\n---\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · 단계: **1NF → 2NF → 3NF → BCNF** (순서 함정 단골)\n> · 1NF = **원자값** / 2NF = **부분종속 제거** / 3NF = **이행종속 제거** / BCNF = **결정자 = 후보키**\n> · 이상현상 3종: **삽입 / 갱신 / 삭제**\n> · 정규화 ↔ 반정규화 — 무결성 vs 성능. 조회 성능을 위해 의도적 반정규화 가능\n\n\n---\n\n---\n\n## 📘 STEP 2. 상세 출제 이론 & 원본 강의 도표·슬라이드 완벽 정복 제2장 제1절. 정규화 (Normalization)와 성능\n\n> 📌 **[2024 개정 출제 안내]**\n> **2024 개정 범위 안내**: 구버전 교재의 '제1절 성능 데이터 모델링의 개요(수행 시점, 일반적 절차 등)'는 2024 개정 출제범위에서 제외(`범위 X`)되었으나, **정규화(1NF~BCNF), 함수적 종속성(FD), 이상현상(Anomaly), 반정규화, 정규화와 조회/입력/수정/삭제 성능의 관계**는 시험에서 가장 중요하게 출제됩니다.\n\n![성능 데이터 모델링 개요 참고 도식 (2024 개정 범위 외 참고용)](images/p012_img01.png)\n\n![성능 데이터 모델링 고려사항 참고 도식](images/p012_img02.png)\n\n#### 1. 정규화(Normalization)의 개념과 함수적 종속성(FD), 이상현상(Anomaly)\n- **정규화의 정의**: 다양한 유형의 검사를 통해 데이터 모델을 더욱 구조화하고 개선시켜 나가는 절차에 관련된 이론. **데이터의 일관성, 최소한의 데이터 중복, 최대한의 데이터 유연성**을 위한 방법이며 데이터를 분해하는 과정이다.\n- **함수적 종속성 (Functional Dependency, FD: `X → Y`)**:\n  - 데이터들이 어떤 기준값에 의해 종속되는 현상을 지칭한다.\n  - 이때 기준값을 **결정자(Determinant, `X`)**라 하고, 종속되는 값을 **종속자(Dependent, `Y`)**라고 한다.\n  - 예: `주민등록번호 -> (이름, 출생지, 호주)` — 주민등록번호가 결정자이고 이름/출생지/호주가 종속자이다. **정규화의 궁극적인 목적은 반복적인 데이터를 분리하고 각 데이터가 종속된 테이블에 적절하게 배치되도록 하는 것**이다.\n\n![함수적 종속성(결정자와 종속자) 개념도](images/p012_img03.png)\n\n- **이상현상 (Anomaly)**: 정규화를 수행하지 않아서(데이터 중복으로 인해) 발생하는 3가지 부작용\n  1. **삽입 이상 (Insertion Anomaly)**: 데이터를 삽입할 때 의도와 상관없이 불필요한 값들도 함께 삽입해야 하거나(또는 PK가 없어 삽입 자체가 불가능한) 현상\n  2. **삭제 이상 (Deletion Anomaly)**: 특정 데이터를 삭제할 때 의도와 상관없이 **유지되어야 할 다른 유용한 정보까지 연쇄적으로 함께 삭제**되는 현상\n  3. **갱신 이상 (Update Anomaly)**: 중복된 데이터 중 일부만 수정되어 **데이터 간의 불일치(모순)**가 발생하는 현상\n\n#### 2. 단계별 정규화 (1NF ➔ 2NF ➔ 3NF ➔ BCNF ➔ 4NF ➔ 5NF) 완벽 분석\n\n> 💡 **[핵심 필수 암기]**\n> **정규화 단계 판별 핵심 키워드 (`\"도·부·이·결·다·조\"`)**:\n> - **제1정규형 (1NF)**: 모든 속성은 반드시 **하나의 값(원자값, Atomic Value)**만 가져야 함 + **중복되는 속성(반복 그룹)** 분리!\n> - **제2정규형 (2NF)**: **부분 함수 종속성(Partial FD) 제거** (복합 PK의 일부에만 종속되는 속성을 분리 ➔ **완전 함수 종속** 달성! *단, 단일 PK 테이블은 1NF이면 자동으로 2NF를 만족함!*)\n> - **제3정규형 (3NF)**: **이행 함수 종속성(Transitive FD) 제거** (`X → Y` 이고 `Y → Z` 일 때 `X → Z`가 되는 관계에서 일반 속성 `Y`가 결정자 역할을 하는 종속 제거)\n> - **BCNF (Boyce-Codd Normal Form)**: **결정자이면서 후보키가 아닌 것**을 제거 (강한 제3정규형)\n> - **제4정규형 (4NF)**: **다중값 종속(Multi-Valued Dependency)** 제거\n> - **제5정규형 (5NF)**: **조인 종속(Join Dependency)** 제거\n\n- **① 제1정규화 (1NF, First Normal Form)**:\n  - **조건**: 모든 속성은 반드시 **하나의 값(원자값)**만 가져야 한다. 또한 **같은 성격과 내용의 컬럼이 연속적으로 나타나는 경우(중복 속성: 예 `관심과목1, 관심과목2, ...`)**도 제1정규화 대상이다!\n  - **주의**: 제1정규화는 단순히 로우(Row) 단위의 중복뿐만 아니라 **칼럼(Column) 단위로 중복되는 경우**도 해당된다!\n\n![제1정규화 대상 테이블 예시 (다중값 및 반복 속성)](images/p013_img01.png)\n\n![제1정규화 수행 전후 비교 (칼럼 단위 중복 속성 분리)](images/p014_img01.png)\n\n![제1정규화 수행 전후 비교 (로우 단위 다중값 분리)](images/p014_img02.png)\n\n- **② 제2정규화 (2NF, Second Normal Form)**:\n  - **조건**: 엔터티의 일반속성은 주식별자 전체에 종속적이어야 한다 (**부분 함수 종속 제거 ➔ 완전 함수 종속**).\n  - 예: `[관심과목]` 테이블의 PK가 `(학번 + 과목코드)` 복합식별자인데, `등록일`은 학번과 과목코드 모두에 종속되지만 **`성명`, `전화번호`, `생년월일`은 `학번`에만 종속(부분종속)**되므로 `[학생]` 테이블로 분리해야 한다!\n\n![제2정규화(부분 함수 종속 제거) 수행 과정 도식](images/p015_img01.png)\n\n- **③ 제3정규화 (3NF, Third Normal Form)**:\n  - **조건**: 엔터티의 일반속성 간에는 서로 종속적이지 않아야 한다 (**이행적 함수 종속 제거**).\n  - 예: `학번(PK) -> 강좌이름 -> 수강료` 또는 `학번(PK) -> 소속학과코드 -> 학과장명`처럼 주식별자가 아닌 일반속성이 다른 일반속성을 결정할 때 이를 별도 엔터티로 분리한다.\n\n![제3정규화(이행 함수 종속 제거) 수행 과정 도식 1](images/p015_img02.png)\n\n![제3정규화 수행 결과 분리된 엔터티 도식](images/p015_img03.png)\n\n- **④ BCNF, 제4정규화, 제5정규화 및 반정규화(De-Normalization)**:\n  - **반정규화 (De-Normalization)**: 정규화된 엔터티, 속성, 관계에 대해 시스템의 성능향상과 개발(Development)과 운영(Maintenance)의 단순화를 위해 **중복, 통합, 분리 등을 수행하는 데이터 모델링의 기법**이다. (반드시 **정규화를 먼저 충실히 수행한 후**, 성능 문제가 있을 때 제한적으로 수행!)\n\n![정규화 심화 단계 예시 도식 1](images/p016_img01.png)\n\n![정규화 심화 단계 예시 도식 2](images/p016_img02.png)\n\n#### 3. 정규화와 성능의 관계 (★오답 선지 1순위!)\n> 🚨 **[절대 주의 / 원본 오타 교정]**\n> **\"정규화를 하면 조인이 발생하므로 조회 성능이 무조건 나빠진다\" ➔ ❌ 틀린 설명!**\n> - 정규화를 수행하면 데이터 처리 시 속도가 **빨라질 수도 있고 느려질 수도 있다.**\n> - **입력 / 수정 / 삭제 (DML) 성능**: 중복 데이터가 제거되고 테이블 크기가 작아지므로 **무조건 향상**된다!\n> - **조회 (SELECT) 성능**: 조인(JOIN)이 많이 발생하여 느려질 수도 있지만, 반대로 **한 테이블의 속성 수가 줄어들어 한 블록당 저장되는 행 수가 늘어나고(I/O 감소), 고유 인덱스를 활용할 수 있어 조회 성능이 향상되는 경우도 많다!**\n\n![정규화를 통한 성능 향상 사례 1 (인덱스 및 범위 스캔 효율화)](images/p016_img03.png)\n\n![정규화를 통한 성능 향상 사례 2 (집계 테이블 분리 효과)](images/p016_img04.png)"}, {"id": "ch-07", "index": 7, "title": "1-2-2. 관계와 조인의 이해", "subj_id": "tab1", "subj_name": "1과목 · 데이터 모델링의 이해", "badge": "1과목 2장 · 데이터 모델과 SQL", "md": "# 1-2-2. 관계와 조인의 이해\n\n> **단원 분류**: `1과목` > `1-2. 데이터 모델과 SQL` > **`1-2-2. 관계와 조인의 이해`**\n\n## 💡 STEP 1. 핵심 개념 한눈에 이해하기\n\n> 모델에서의 **관계**는 외래키(FK)로 구현되고, 그 관계를 따라 여러 테이블을 합쳐 보는 작업이 조인(JOIN)이다.\n\nex) 영수증엔 주문 정보만, 회원카드엔 회원 정보만 있음. 같은 사람의 영수증과 카드를 맞춰 보면 \"김철수가 사과 2개 샀구나\"가 보인다 — 흩어진 정보를 키로 맞춰 합치는 것이 조인.\n\n---\n\n## [개념 도식화] 관계 → FK → JOIN\n\n| 1단계: 설계 (개념 모델) | ➔ | 2단계: 구현 (논리/물리 모델) | ➔ | 3단계: 조회 (SQL 실행) |\n| :---: | :---: | :---: | :---: | :---: |\n| **관계 (Relationship)** 정의 | | **외래키 (Foreign Key, FK)** 상속 | | **`JOIN` 구문**으로 데이터 결합 조회 |\n\n| 부모 테이블 (`MEMBER`) | ─── 관계 연결 (`MEMBER_ID`) ───▶ | 자식 테이블 (`ORDERS`) |\n| :--- | :---: | :--- |\n| • **`MEMBER_ID` (PK, 기본키)**<br>• `NAME` (이름) | 부모의 PK를 자식의 FK로 참조 | • **`ORDER_ID` (PK, 기본키)**<br>• **`MEMBER_ID` (FK, 외래키)** |\n\n자식 테이블의 **FK = 조인 키**.\n\n---\n\n## 조인의 4가지 종류 — 개념 미리보기\n\n| 종류 | 의미 | 비유 |\n|---|---|---|\n| INNER JOIN | 양쪽에 다 있는 것만 | 양쪽 카드 모두 가진 사람 |\n| LEFT OUTER | 왼쪽 다, 오른쪽은 매칭만 | 왼쪽 기준, 오른쪽 없으면 NULL |\n| RIGHT OUTER | 오른쪽 다 | 오른쪽 기준 |\n| FULL OUTER | 양쪽 모두 다 | 한쪽만 있어도 표시 |\n\n자세한 구문은 **조인** / **표준 조인**에서\n\n---\n\n## 관계의 종류와 조인 시 주의점\n\n### 1:1 관계 — 단순 매칭\n\n```\n[사원] 1 ── 1 [사원증]\n```\n\nINNER JOIN 결과: 사원 한 명당 사원증 한 개 → 사원 행 수 그대로 유지 (사원증 없는 사원은 LEFT JOIN 써야 결과에 남음)\n\n### 1:N 관계 — 행이 늘어남\n\n```\n[회원] 1 ── N [주문]\n```\n\n회원 1명에게 주문 3건이면 조인 후 3행으로 늘어남\n\n### M:N 관계 — 교차 엔터티 필요\n\n```\n[학생] M ── N [과목]    →    [학생] 1─N [수강] N─1 [과목]\n```\n\n조인은 반드시 수강(교차)을 거쳐 두 번\n\n---\n\n## [SQL 실전] 관계로 연결된 테이블 조인\n\n```sql\n-- 1:N 조인: 회원과 주문\nSELECT  M.NAME, O.ORDER_ID, O.ORD_DATE\nFROM    MEMBER M\n        JOIN ORDERS O ON M.MEMBER_ID = O.MEMBER_ID;\n\n-- M:N → 교차 테이블 거쳐 두 번 조인\nSELECT  S.NAME AS STUDENT, K.NAME AS SUBJECT, R.GRADE\nFROM    STUDENT  S\n        JOIN REGISTER R ON S.STU_ID = R.STU_ID\n        JOIN SUBJECT  K ON R.SUB_ID = K.SUB_ID;\n```\n\n---\n\n## [Before & After] 데이터가 합쳐지는 모습\n\n회원은 2명(김철수·이영희), 주문은 3건(김철수가 2건, 이영희가 1건). MEMBER 와 ORDERS 가 MEMBER_ID 로 1:N 관계일 때, INNER JOIN 결과 행 수가 어떻게 결정되는가\n\n### 입력 테이블\n\n**MEMBER**\n\n| MEMBER_ID | NAME |\n|---|---|\n| M01 | 김철수 |\n| M02 | 이영희 |\n\n**ORDERS**\n\n| ORDER_ID | MEMBER_ID | ORD_DATE |\n|---|---|---|\n| 1 | M01 | 2026-04-01 |\n| 2 | M01 | 2026-04-05 |\n| 3 | M02 | 2026-04-10 |\n\n### After — INNER JOIN 결과\n\n| NAME | ORDER_ID | ORD_DATE |\n|---|---|---|\n| 김철수 | 1 | 2026-04-01 |\n| 김철수 | 2 | 2026-04-05 |\n| 이영희 | 3 | 2026-04-10 |\n\n회원 2명이지만 주문이 3건이므로 결과는 3행\n\n1:N 조인의 결과 행 수는 부모(1쪽)가 아니라 자식(N쪽)에 맞춰 결정된다 — 부모 한 행이 매칭된 자식 수만큼 복제된다고 보면 됨. 이 사실을 잊고 부모 컬럼(예: 회원 등급별 포인트)을 그대로 SUM 하면 자식 수만큼 부풀려진 합계가 나온다. 1:N 조인 후 부모 쪽 집계가 필요하면 자식 합계를 서브쿼리로 먼저 구해 1:1 로 만들어 붙이는 것이 안전.\n\n---\n\n## 조인 시 자주 하는 실수\n\n| 실수 | 결과 | 해결 |\n|---|---|---|\n| 조인 조건 빠짐 | 카티션 곱(행 수 폭발) | ON 명시 |\n| 1:N 관계인데 합계 계산 | 중복 합산 | DISTINCT 또는 서브쿼리 분리 |\n| OUTER JOIN과 WHERE 혼동 | NULL 행이 빠짐 | OUTER JOIN 시 조건은 ON에 둠 |\n\n---\n\n## 조인의 방향성\n\n일반적으로 PK(부모) ← FK(자식) 방향으로 조인\n\n```\n[부서] PK ←─── FK [사원]\n   조인 키 = 부서.PK = 사원.FK\n```\n\n---\n\n## [시험 출제 포인트]\n\n| 함정 | 정답 |\n|---|---|\n| 관계는 SQL에서 무엇으로 구현되는가 | 외래키(FK) |\n| 1:N 관계를 조인하면 행 수는 | 부모 1행에 자식 N개면 결과는 N행 |\n| M:N을 조인할 때 | 반드시 교차 엔터티를 거침 |\n| 조인 조건 누락 시 | 카티션 곱(Cartesian Product) |\n| 외래키는 항상 NOT NULL인가 | 선택 관계면 NULL 허용 |\n\n단골 트릭: 1:N 관계를 조인한 뒤 부모의 합계를 그대로 SUM 하면 자식 수만큼 부풀려짐. 서브쿼리로 자식 합계를 먼저 구한 뒤 조인해야 안전\n\n---\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · 관계 → SQL 에서 **외래키(FK)** → 조회 시 **JOIN** 으로 활용\n> · 1:N 조인 → 결과 행 수 = 자식 N (부모 1행이 N행으로 부풀려짐)\n> · M:N → **교차 엔터티** 거쳐 두 번 조인 (수강·주문상세 등)\n> · 외부 조인 시 추가 조건은 반드시 **ON 절**에 (WHERE 에 두면 INNER 됨)\n> · 조인 조건 누락 → **카티션 곱** (행 수 폭발)\n\n\n---\n\n---\n\n## 📘 STEP 2. 상세 출제 이론 & 원본 강의 도표·슬라이드 완벽 정복 제2장 제2절. 관계와 조인의 이해\n\n#### 1. 관계와 조인(Join)의 본질적 연결\n- **조인(Join)의 정의**: 식별자를 상속하고, 상속된 속성을 매핑키(조인키)로 활용하여 데이터를 결합하는 것.\n- 부모 엔터티의 식별자를 자식이 상속받고(식별자/비식별자 관계), 이를 이용해 `WHERE A.KEY = B.KEY` 형태로 조인 조건을 작성한다.\n\n![모델의 관계(식별자 상속)와 SQL 조인의 매핑 도식](images/p017_img01.png)\n\n#### 2. 계층형 데이터 모델 (셀프 조인 / 순환 관계, Recursive Relationship)\n- 계층형 데이터 모델이란 **자기 자신 엔터티와 관계가 발생**하는 경우(재귀적 관계, 순환 관계)를 말한다. (예: 사원 테이블 내의 `사원번호(PK)`와 `매니저사원번호(FK)` 간의 관계, 부서 테이블의 `부서코드`와 `상위부서코드` 관계)\n- 계층형 데이터 모델을 SQL 문장으로 처리할 때는 **셀프 조인(Self-Join)** 또는 **계층형 질의(`START WITH ... CONNECT BY PRIOR`)**를 사용한다. (같은 테이블을 두 번 이상 참조하므로 반드시 **테이블 별칭(Alias)**을 다르게 부여해야 한다!)\n\n![계층형 데이터 모델(순환 관계) ERD 표현](images/p017_img02.png)\n\n![계층형 데이터 모델의 셀프 조인(Self-Join) SQL 작성 예시](images/p018_img01.png)\n\n#### 3. 상호배타적 관계 (Exclusive-OR / 아크 Arc 관계)\n- **상호배타적 관계(Exclusive-OR)**: 두 테이블 중 **하나만 가능한 관계**를 말한다. (예: 주문 엔터티가 `개인고객` 또는 `법인고객` 중 **어느 한쪽과만** 관계를 맺어야 하고, 동시에 둘 다 맺거나 둘 다 안 맺을 수 없는 경우)\n- ERD에서는 관계선들을 묶어 **호(Arc, 아크)** 기호 또는 동그라미 안에 `X` 표시로 표현한다.\n- 물리적 설계 시에는:\n  1. **FK를 각각 분리**하여 두고 둘 중 하나만 `NOT NULL`이 되도록 `CHECK` 제약조건을 걸거나,\n  2. **통합 FK 컬럼 1개 + 구분 코드 컬럼(개인/법인 구분)**을 두는 방식으로 구현한다.\n\n![상호배타적(Exclusive-OR / Arc) 관계의 ERD 표기법](images/p018_img02.png)\n\n![상호배타적 관계의 테이블 설계 방식 1 (개별 FK 분리)](images/p018_img03.png)\n\n![상호배타적 관계의 테이블 설계 방식 2 (통합 FK + 구분코드)](images/p018_img04.png)"}, {"id": "ch-08", "index": 8, "title": "1-2-3. 모델이 표현하는 트랜잭션의 이해", "subj_id": "tab1", "subj_name": "1과목 · 데이터 모델링의 이해", "badge": "1과목 2장 · 데이터 모델과 SQL", "md": "# 1-2-3. 모델이 표현하는 트랜잭션의 이해\n\n> **단원 분류**: `1과목` > `1-2. 데이터 모델과 SQL` > **`1-2-3. 모델이 표현하는 트랜잭션의 이해`**\n\n## 💡 STEP 1. 핵심 개념 한눈에 이해하기\n\n> 트랜잭션(Transaction)이란 함께 성공하거나 함께 실패해야 하는 데이터 작업의 묶음이다. 모델은 이 묶음을 관계의 필수성과 식별성으로 표현한다.\n\nex) 계좌 이체에서 A에서 1만원이 빠지고 B에 1만원이 들어와야 정상. A에서만 빠지고 멈추면 돈이 사라지므로, 둘 다 성공하거나 둘 다 취소되어야 함\n\n---\n\n## [개념 도식화] 트랜잭션의 ACID\n\n| 트랜잭션 4대 특성 (ACID) | 영문명 | 핵심 의미 (시험 필수 키워드) |\n| :---: | :---: | :--- |\n| **A — 원자성** | **Atomicity** | 트랜잭션의
