p045_img05.png)\n\n### 📌 4. 3개 이상 테이블 조인 및 Oracle OUTER JOIN `(+)` 기호 규칙\n- **3개 이상 테이블 조인**: `PLAYER`, `TEAM`, `STADIUM` 3개 테이블을 조인할 때는 최소 `3 - 1 = 2`개의 조인 조건을 `AND`로 연결한다.\n- **Oracle 전용 OUTER JOIN 기호 `(+)` 완벽 정리 (★위치 헷갈림 주의!)**:\n  - `(+)` 기호는 **\"데이터가 부족한 쪽(모자란 쪽, 즉 `NULL` 행이 새로 덧붙여져서라도 나와야 하는 보조 테이블 쪽)\"** 컬럼 뒤에 붙인다!\n  - **`WHERE A.ID = B.ID(+)`** ➔ 기준이 `A` 테이블이므로 **`A LEFT OUTER JOIN B`**와 같다! (`A`의 모든 행이 다 나오고, `B`에 매칭되는 값이 없으면 `B` 컬럼들이 `NULL`로 채워짐)\n  - **`WHERE A.ID(+) = B.ID`** ➔ 기준이 `B` 테이블이므로 **`A RIGHT OUTER JOIN B`**와 같다!\n  - *(주의: 양쪽에 동시에 `A.ID(+) = B.ID(+)`처럼 붙이는 것은 문법 에러이다! Oracle `(+)` 기호로는 `FULL OUTER JOIN`을 직접 표현할 수 없다.)*\n\n![3개 테이블(PLAYER, TEAM, STADIUM) 동시 조인 쿼리 및 결과](images/p046_img01.png)\n\n![ANSI 표준 구문으로 작성한 3개 테이블 조인 쿼리](images/p046_img02.png)\n\n![STADIUM과 TEAM의 OUTER JOIN 대상 데이터 구조](images/p046_img03.png)\n\n![Oracle (+) 기호를 사용한 OUTER JOIN 실행 결과](images/p046_img04.png)\n\n![INNER JOIN과 OUTER JOIN의 벤다이어그램 비교](images/p047_img01.png)\n\n![INNER JOIN 수행 시 매칭되지 않는 행이 탈락하는 과정](images/p047_img02.png)\n\n![Oracle (+) 기호를 이용한 OUTER JOIN 쿼리문](images/p047_img03.png)\n\n---\n\n## 🔍 STEP 2. 직관적 Before & After 비교 & 실전 SQL 트레이스\n\n### 🔄 [Before & After] 직관적 비교\n\nEMP 에는 부서가 없는 박, DEPT 에는 아무도 속하지 않은 D3(개발부)가 있는 상황. 같은 두 테이블에 INNER / LEFT / RIGHT / FULL OUTER 조인을 차례로 적용해 결과 행이 늘었다 줄었다 하는 양상 비교.\n\n### EMP\n\n| EMP_ID | NAME | DEPT_ID |\n|---|---|---|\n| 1 | 김 | D1 |\n| 2 | 이 | D2 |\n| 3 | 박 | NULL |\n\n### DEPT\n\n| DEPT_ID | DEPT_NAME |\n|---|---|\n| D1 | 영업부 |\n| D2 | 인사부 |\n| D3 | 개발부 |\n\n### INNER JOIN\n\n| NAME | DEPT_NAME |\n|---|---|\n| 김 | 영업부 |\n| 이 | 인사부 |\n\n### LEFT OUTER (EMP 기준)\n\n| NAME | DEPT_NAME |\n|---|---|\n| 김 | 영업부 |\n| 이 | 인사부 |\n| 박 | NULL |\n\n### RIGHT OUTER (DEPT 기준)\n\n| NAME | DEPT_NAME |\n|---|---|\n| 김 | 영업부 |\n| 이 | 인사부 |\n| NULL | 개발부 |\n\n### FULL OUTER\n\n| NAME | DEPT_NAME |\n|---|---|\n| 김 | 영업부 |\n| 이 | 인사부 |\n| 박 | NULL |\n| NULL | 개발부 |\n\nINNER 조인은 양쪽 모두 매칭되는 행만 남기므로 박과 개발부가 동시에 사라짐. LEFT/RIGHT OUTER 는 기준 쪽을 다 살리고 반대쪽이 비면 NULL 을 채움. FULL OUTER 는 양쪽 모두 살림. \"어느 쪽에 매칭이 없는 데이터까지 보고 싶은가\" 가 INNER vs OUTER 선택 기준. OUTER 조인 후 WHERE 에 비기준 컬럼 조건을 걸면 NULL 행이 도로 빠지므로 추가 조건은 ON 절에 두는 것이 안전\n\n### 💻 [SQL 실전 트레이스] 다양한 조인\n\n```sql\n-- INNER JOIN\nSELECT E.NAME, D.DEPT_NAME\nFROM   EMP E JOIN DEPT D ON E.DEPT_ID = D.DEPT_ID;\n\n-- 3개 테이블 조인\nSELECT E.NAME, D.DEPT_NAME, L.CITY\nFROM   EMP E\n       JOIN DEPT D     ON E.DEPT_ID = D.DEPT_ID\n       JOIN LOCATION L ON D.LOC_ID  = L.LOC_ID;\n\n-- LEFT OUTER JOIN\nSELECT M.NAME, O.ORDER_ID\nFROM   MEMBER M LEFT JOIN ORDERS O ON M.MEMBER_ID = O.MEMBER_ID;\n```\n\n---\n\n## 🚨 STEP 3. 출제위원 단골 함정 O/X & 노랭이·기출 문항별 족보\n\n### ⚠️ 시험장 단골 함정 vs 정답 1:1 대조표\n\n| 함정 | 정답 |\n|---|---|\n| 조인 조건이 빠지면 | 카티션 곱(Cartesian Product) |\n| Oracle 외부조인 표기 | `(+)` 기호(NULL 보충될 쪽에 붙임) |\n| N개 테이블 조인 시 조인 조건 수 | 최소 N-1개 |\n| Non-EQUI 조인 예 | BETWEEN, >, < 등 |\n| SELF 조인은 같은 테이블을 두 번 사용? | 그렇다(별칭 필수) |\n| INNER vs OUTER 차이 | OUTER는 매칭 안 되는 행도 NULL과 함께 포함 |\n\n단골 함정: Oracle 의 `(+)` 위치는 NULL 을 채울 쪽(없을 수 있는 쪽)에 붙임\n\n### 📒 이 단원과 직결된 『SQL 자격검정 실전문제(노랭이)』 & 기출 킬러 족보\n\n- **[노랭이 2과목 77번 ★중요체크]** Oracle에서 `(+)` 기호가 붙은 반대 방향 쪽으로 `OUTER JOIN`이 수행되며, 조인 대상 테이블의 추가 필터 조건에도 **`(+)` 표시가 함께 있어야** ANSI 표준의 `ON` 절 안에 조건을 함께 작성한 것과 동일한 결과가 나온다 (`(+)`를 안 붙이면 `WHERE` 절 필터가 되어 `INNER JOIN` 결과와 같아짐!).\n- **[30회 기출 30번]** '구매 이력이 없는 회원을 포함한 모든 회원의 구매 금액 합계'를 구하라고 할 때 `INNER JOIN`을 쓰면 구매 안 한 회원이 누락되므로 반드시 **`OUTER JOIN`**을 사용해야 한다.\n\n---\n\n## ✍️ STEP 4. 실전 적중! 단원 마무리 확인 문제\n\n<div class=\"sqld-quiz-box\" data-answer=\"3\">\n\n**Q. [2-1-7 대표 적중 문제]** `DEPT` 테이블(부서번호 10, 20, 30, 40)과 `EMP` 테이블(부서번호 10, 20, 30에만 사원 존재, 40번 부서 사원 없음)을 오라클(Oracle)에서 조인할 때, 다음 두 쿼리에 대한 설명으로 **가장 적절한** 것은?\n```sql\n-- [쿼리 A]\nSELECT D.DEPTNO, E.EMPNO FROM DEPT D, EMP E\nWHERE D.DEPTNO = E.DEPTNO(+) AND E.SAL(+) >= 2000;\n\n-- [쿼리 B]\nSELECT D.DEPTNO, E.EMPNO FROM DEPT D, EMP E\nWHERE D.DEPTNO = E.DEPTNO(+) AND E.SAL >= 2000;\n```\n\n- ① [쿼리 A]는 문법 에러가 발생하며, `(+)` 기호는 조인 조건에만 사용할 수 있다.\n- ② [쿼리 A]와 [쿼리 B] 모두 40번 부서(`DEPTNO = 40`)가 결과에 반드시 출력된다.\n- ③ [쿼리 A]는 40번 부서를 포함한 모든 부서가 출력되지만, [쿼리 B]는 `E.SAL >= 2000`에 `(+)`가 없어 `NULL`로 채워진 행이 제거되므로 40번 부서가 출력되지 않는다.\n- ④ [쿼리 A]는 ANSI 표준의 `FROM DEPT D LEFT OUTER JOIN EMP E ON D.DEPTNO = E.DEPTNO WHERE E.SAL >= 2000`과 동일한 결과를 출력한다.\n\n<details>\n<summary>💡 <b>정답 및 시나공·과외노트식 보기별 완벽 해설 확인하기 (클릭)</b></summary>\n\n**정답: ③**\n- **해설**:\n  - **[쿼리 A]**처럼 `E.SAL(+) >= 2000`에 `(+)`를 붙여야 ANSI 표준의 **`LEFT OUTER JOIN ... ON (D.DEPTNO = E.DEPTNO AND E.SAL >= 2000)`**과 동일하게 동작하여 사원이 없는 40번 부서도 살아남습니다.\n  - **[쿼리 B]**처럼 `E.SAL >= 2000`에 `(+)`를 빼먹으면, 외부 조인으로 생긴 `(40, NULL)` 행이 `NULL >= 2000 (UNKNOWN)` 조건에 걸러져 사라지므로 사실상 **`INNER JOIN`**이 되어버립니다!\n\n</details>\n</div>\n\n---\n\n## ⏱️ STEP 5. 시험장 입실 직전 30초 최종 요약 카드\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · 5종류: **EQUI / Non-EQUI / SELF / OUTER / CROSS**\n> · 조인 조건 누락 = **카티션 곱** (행 수 폭발: A행 × B행)\n> · N개 테이블 조인 = 조인 조건 **최소 N-1 개**\n> · SELF 조인 = **별칭 필수** (같은 테이블을 두 번 사용)\n> · Oracle `(+)` 표기 = **NULL 채울 쪽** (없을 수 있는 쪽)에 붙임\n> · OUTER JOIN 추가 조건 = **ON 절에** (WHERE 두면 NULL 행 빠져 INNER 와 같아짐)"}, {"id": "ch-18", "index": 18, "title": "2-1-8. 표준 조인 (ANSI Standard Join)", "subj_id": "tab2", "subj_name": "2과목 1장 · SQL 기본", "badge": "2과목 1장 · SQL 기본", "md": "# 2-1-8. 표준 조인 (ANSI Standard Join)\n\n> **단원 분류**: `2과목` > `2-1. SQL 기본` > **`2-1-8. 표준 조인`**\n> **🎯 출제 빈도**: `★★★★★ (매회 2문항 100% 출제!)` &nbsp;|&nbsp; **🧠 두문자 암기 공식**: `NATURAL JOIN & USING 절의 공통 기준 컬럼에는 테이블명/별칭(접두어 A.컬럼) 절대 사용 금지!`\n\n## 🎯 과외선배의 1분 브리핑 & 핵심 구조도\n\n> [!TIP]\n> **👨‍🏫 1:1 과외선배의 학습 코칭 (`유선배 과외노트` 스타일)**\n> 표준 조인(ANSI JOIN)에서는 무조건 이 2가지가 출제됩니다! ① **`NATURAL JOIN`이나 `USING(공통컬럼)`을 쓸 때, 그 공통 기준 컬럼 앞에는 `SELECT` 절이든 `WHERE` 절이든 절대 `E.DEPTNO`처럼 테이블 별칭(접두어)을 붙이면 에러가 난다!** (반면 `ON (E.DEPTNO = D.DEPTNO)` 절을 쓸 때는 반대로 별칭을 **반드시 붙여야** 한다!), ② `LEFT OUTER JOIN`에서 추가 조건을 **`ON` 절 안에 쓰면 왼쪽 테이블 행이 전부 살아남지만, `WHERE` 절에 쓰면 `NULL` 행이 걸러져서 건수가 줄어든다!**\n\n> 표준 조인은 ANSI/ISO에서 정의한, 모든 DBMS에서 통하는 조인 문법이다. `JOIN ... ON` 키워드를 사용한다. 앞 챕터의 **조인** 종류를 표준 문법으로 정리.\n\n### 🗺️ 한눈에 보는 핵심 구조도: 표준 조인의 종류\n\n| ANSI 표준 조인 6대 구문 | 조인 결과 및 문법 핵심 규칙 |\n| :---: | :--- |\n| **`INNER JOIN`** | 양쪽 테이블에서 조인 조건이 일치하는 행만 반환 (`INNER` 생략 가능, `ON` 또는 `USING` 필수) |\n| **`LEFT OUTER JOIN`** | 왼쪽 테이블의 모든 행을 무조건 보존 + 오른쪽 테이블 매칭 행 결합 (`OUTER` 생략 가능) |\n| **`RIGHT OUTER JOIN`** | 오른쪽 테이블의 모든 행을 무조건 보존 + 왼쪽 테이블 매칭 행 결합 (`OUTER` 생략 가능) |\n| **`FULL OUTER JOIN`** | 왼쪽·오른쪽 양쪽 테이블의 모든 행을 보존 (`LEFT` 결과 ∪ `RIGHT` 결과, Oracle `(+)`로는 표현 불가!) |\n| **`CROSS JOIN`** | 조인 조건 없이 `M × N` 모든 조합 반환 (`ON`절 사용 불가) |\n| **`NATURAL JOIN` / `USING`** | 같은 이름의 컬럼으로 등가 조인 (**★절대 규칙: 기준 컬럼에 테이블 별칭 `E.DEPTNO` 사용 시 에러 발생!**) |\n\n---\n\n## 📘 STEP 1. 시험 출제 핵심 이론 & 강의 도표 완벽 정복\n\n### 📌 1. ANSI/ISO 표준 조인의 4대 형태 개요\n- **`INNER JOIN`**: 조인 조건을 만족하는(양쪽 모두에 존재하는) 행만 반환 (`JOIN` 앞에 `INNER`는 생략 가능).\n- **`NATURAL JOIN`**: 두 테이블에서 **같은 이름을 가진 모든 컬럼**들에 대해 자동으로 EQUI(`=`) 조인을 수행.\n- **`CROSS JOIN`**: 조인 조건 없이 두 테이블 간의 가능한 **모든 행의 조합(카티션 곱, `M × N`행)**을 반환.\n- **`OUTER JOIN`**: 조인 조건을 만족하지 않는 행도 결과에 포함 (`LEFT OUTER JOIN`, `RIGHT OUTER JOIN`, `FULL OUTER JOIN` — 여기서 `OUTER` 키워드는 생략 가능!).\n\n---\n\n### 📌 2. NATURAL JOIN vs USING 조건절 vs ON 조건절 완벽 비교 (★시험 100% 출제!)\n\n> 💡 **[핵심 필수 암기]**\n> **조인 기준 컬럼에 테이블 별칭(Alias, 예 `D.DEPTNO`)을 붙일 수 있는가?**\n> - **`ON` 조건절 (`JOIN ... ON D.DEPTNO = E.DEPTNO`)**: 이름이 같은 컬럼에 **반드시 테이블명/별칭을 붙여야 한다!** (안 붙이면 애매모호 에러!)\n> - **`NATURAL JOIN` 및 `USING(컬럼)` 조건절**: 조인 기준이 되는 공통 컬럼(`DEPTNO`)이 결과에서 **하나의 컬럼으로 통합**되므로, **`SELECT` 절이나 `WHERE` 절, `USING` 절 어디에서도 해당 공통 컬럼 앞에 테이블명이나 별칭(`D.DEPTNO`)을 붙이면 문법 에러가 발생한다!** (무조건 별칭 없이 그냥 `DEPTNO`로만 써야 함!)\n\n| 비교 항목 | `NATURAL JOIN` | `JOIN ... USING (공통컬럼)` | `JOIN ... ON (조건식)` |\n| :---: | :--- | :--- | :--- |\n| **조인 컬럼 지정** | 지정 불가! (`ON`이나 `USING` 쓸 수 없음). 두 테이블에서 **이름이 같은 모든 컬럼**을 자동으로 찾아서全部 `AND` 등가조인 수행! | 이름이 같은 컬럼 중 **내가 원하는 특정 컬럼만 `(괄호)` 안에 지정**하여 등가조인 수행! (괄호 필수!) | 컬럼 이름이 **같든 다르든 상관없이** 자유롭게 조건식(`=`, `BETWEEN` 등) 지정 가능! |\n| **공통 컬럼에 별칭(Alias) 사용** | **❌ 절대 사용 불가!** (`E.DEPTNO` ➔ 에러! 그냥 `DEPTNO`로만 써야 함) | **❌ 절대 사용 불가!** (`USING` 괄호 안이나 `SELECT` 절에서 `E.DEPTNO` 쓰면 에러!) | **⭕ 반드시 별칭 사용해야 함!** (`E.DEPTNO`, `D.DEPTNO` 구분 필수) |\n| **`SELECT *` 수행 시 컬럼 수** | 공통 컬럼이 **맨 앞에 1번만** 출력됨 (중복 제거) | `USING`에 쓴 컬럼이 **맨 앞에 1번만** 출력됨 (중복 제거) | 양쪽 테이블의 컬럼이 **각각 따로(2번 모두)** 출력됨 |\n\n![INNER JOIN ON 절 기본 작성 예시](images/p047_img04.png)\n\n![NATURAL JOIN 실행 결과 (공통 컬럼 통합 및 별칭 불가)](images/p048_img01.png)\n\n![NATURAL JOIN 시 별칭을 사용하여 에러가 나는 사례](images/p048_img02.png)\n\n![NATURAL JOIN과 INNER JOIN ON을 SELECT * 로 실행했을 때 결과 컬럼 차이](images/p048_img03.png)\n\n![USING 조건절 사용 시 별칭 에러 사례와 올바른 작성법 비교](images/p049_img01.png)\n\n![ON 조건절에 WHERE 절 검색 조건을 함께 사용한 예시](images/p049_img02.png)\n\n![ON 조건절에 조인 조건과 부가 조건을 결합한 예시 및 다중 테이블 표준 조인](images/p050_img01.png)\n\n---\n\n### 📌 3. OUTER JOIN에서 `ON` 절 조건 vs `WHERE` 절 조건의 결정적 차이 (★킬러 문항!)\n\n| 비교 구분 | 케이스 1: `ON` 절에 조건 작성<br>`LEFT JOIN DEPT D ON (E.DEPTNO = D.DEPTNO AND D.LOC = 'SEOUL')` | 케이스 2: `WHERE` 절에 조건 작성<br>`LEFT JOIN DEPT D ON (E.DEPTNO = D.DEPTNO) WHERE D.LOC = 'SEOUL'` |\n| :---: | :--- | :--- |\n| **동작 순서** | 조인 매칭 시점에만 `D.LOC = 'SEOUL'` 조건을 검사함 | 일단 `LEFT JOIN`을 끝낸 뒤, 마지막 `WHERE`절에서 `D.LOC = 'SEOUL'`이 아닌 행을 걸러냄 |\n| **좌측(`EMP`) 보존 여부** | **EMP 전체 사원이 모두 살아남음!** (`SEOUL`이 아닌 부서 사원은 `D` 컬럼만 `NULL`로 표시됨) | `D.LOC`가 `NULL`이거나 타 지역인 사원이 **전부 삭제됨!** (**`INNER JOIN`과 똑같은 결과**가 됨!) |\n\n---\n\n### 📌 4. CROSS JOIN (교차 조인)과 LEFT / RIGHT / FULL OUTER JOIN\n- **`CROSS JOIN` (카티션 곱, Cartesian Product)**:\n  - 조인 조건이 없으므로 테이블 `A`가 `m`건, 테이블 `B`가 `n`건이면 결과는 무조건 **`m × n`건**이 생성된다. (`FROM A CROSS JOIN B` 또는 `FROM A, B`에서 `WHERE` 조인 조건을 안 쓴 것과 동일)\n- **`LEFT OUTER JOIN`**:\n  - 왼쪽(먼저 쓴) 테이블의 데이터는 **무조건 100% 모두 출력**하고, 오른쪽 테이블에 조인 조건에 맞는 값이 없으면 오른쪽 컬럼들을 `NULL`로 채워서 출력한다.\n- **`RIGHT OUTER JOIN`**:\n  - 오른쪽(나중에 쓴) 테이블의 데이터를 **무조건 100% 모두 출력**하고, 왼쪽 테이블에 매칭되는 값이 없으면 왼쪽 컬럼들을 `NULL`로 채워서 출력한다.\n- **`FULL OUTER JOIN`**:\n  - 왼쪽과 오른쪽 테이블의 데이터를 **양쪽 모두 빠짐없이 출력**한다 (합집합 개념: **`LEFT OUTER JOIN` 결과 ∪ `RIGHT OUTER JOIN` 결과 (`UNION`과 동일!)**).\n\n![INNER / LEFT / RIGHT / FULL OUTER JOIN 및 CROSS JOIN 한눈에 보는 시각 비교표](images/p050_img02.png)\n\n![CROSS JOIN 수행 과정 및 M x N 행 생성 예시 1](images/p051_img01.png)\n\n![CROSS JOIN 수행 결과 예시 2](images/p051_img02.png)\n\n![LEFT OUTER JOIN 쿼리 및 결과](images/p052_img01.png)\n\n![RIGHT OUTER JOIN 쿼리 및 결과](images/p052_img02.png)\n\n![FULL OUTER JOIN 쿼리 및 결과](images/p052_img03.png)\n\n![LEFT OUTER JOIN UNION RIGHT OUTER JOIN으로 FULL OUTER JOIN을 구현한 쿼리](images/p052_img04.png)\n\n---\n\n## 🔍 STEP 2. 직관적 Before & After 비교 & 실전 SQL 트레이스\n\n### 🔄 [Before & After] 표준 조인 결과 비교\n\nEMP 3행(박은 부서 미지정)과 DEPT 3행(D3 개발은 소속 사원 없음)을 같은 키 DEPT_ID 로 조인하는 상황. 동일한 두 테이블에 INNER / LEFT / RIGHT / FULL / CROSS 를 차례로 적용해 ANSI 표준 문법별 결과 행 수가 어떻게 달라지는지 비교.\n\n### 입력\n\n**EMP**\n\n| EMP_ID | NAME | DEPT_ID |\n|---|---|---|\n| 1 | 김 | D1 |\n| 2 | 이 | D2 |\n| 3 | 박 | NULL |\n\n**DEPT**\n\n| DEPT_ID | DEPT_NAME |\n|---|---|\n| D1 | 영업 |\n| D2 | 인사 |\n| D3 | 개발 |\n\n### INNER JOIN\n\n| NAME | DEPT_NAME |\n|---|---|\n| 김 | 영업 |\n| 이 | 인사 |\n\n### LEFT JOIN\n\n| NAME | DEPT_NAME |\n|---|---|\n| 김 | 영업 |\n| 이 | 인사 |\n| 박 | NULL |\n\n### RIGHT JOIN\n\n| NAME | DEPT_NAME |\n|---|---|\n| 김 | 영업 |\n| 이 | 인사 |\n| NULL | 개발 |\n\n### FULL JOIN\n\n| NAME | DEPT_NAME |\n|---|---|\n| 김 | 영업 |\n| 이 | 인사 |\n| 박 | NULL |\n| NULL | 개발 |\n\n### CROSS JOIN\n\n3 × 3 = 9행\n\nANSI 표준은 결과 집합을 키워드 한 단어로 명확히 구분 — INNER 는 매칭만, LEFT/RIGHT 는 한쪽 기준 모두, FULL 은 양쪽 모두, CROSS 는 카티션 곱. \"어느 쪽에 매칭이 없는 데이터까지 살릴 것인가\" 를 먼저 정한 뒤 그에 맞는 키워드 선택. OUTER 조인의 추가 조건은 반드시 ON 절에 두어야 매칭 안 되는 NULL 행이 그대로 살아남음\n\n### 💻 [SQL 실전 트레이스]\n\n### INNER JOIN — 양쪽 매칭만\n\n```sql\nSELECT  E.NAME, D.DEPT_NAME\nFROM    EMP E\n        INNER JOIN DEPT D ON E.DEPT_ID = D.DEPT_ID;\n        -- INNER 생략 가능: JOIN ... ON\n```\n\n```\n   EMP    DEPT\n   ┌──┐  ┌──┐\n   │  ╲╱  │      ← 교집합만\n   └──┘  └──┘\n```\n\n---\n\n### LEFT OUTER JOIN — 왼쪽 다, 오른쪽 매칭\n\n```sql\nSELECT  E.NAME, D.DEPT_NAME\nFROM    EMP E\n        LEFT OUTER JOIN DEPT D ON E.DEPT_ID = D.DEPT_ID;\n        -- OUTER 생략 가능: LEFT JOIN\n```\n\n```\n   EMP    DEPT\n   ┌──┐  ┌──┐\n   │██╲╱  │      ← 왼쪽 모두 + 매칭된 오른쪽\n   └──┘  └──┘\n```\n\n---\n\n### RIGHT OUTER JOIN — 오른쪽 다, 왼쪽 매칭\n\n```sql\nSELECT  E.NAME, D.DEPT_NAME\nFROM    EMP E\n        RIGHT OUTER JOIN DEPT D ON E.DEPT_ID = D.DEPT_ID;\n```\n\n---\n\n### FULL OUTER JOIN — 양쪽 다\n\n```sql\nSELECT  E.NAME, D.DEPT_NAME\nFROM    EMP E\n        FULL OUTER JOIN DEPT D ON E.DEPT_ID = D.DEPT_ID;\n```\n\n```\n   EMP    DEPT\n   ┌──┐  ┌──┐\n   │██╲╱██│      ← 양쪽 모두(한쪽만 있어도 NULL 채워서)\n   └──┘  └──┘\n```\n\n---\n\n### CROSS JOIN — 모든 조합\n\n```sql\nSELECT  *\nFROM    EMP E CROSS JOIN DEPT D;\n```\n\n조인 조건 없음. 결과는 A행수 × B행수\n\n---\n\n### NATURAL JOIN — 같은 이름 컬럼 자동 조인\n\n```sql\nSELECT  *\nFROM    EMP NATURAL JOIN DEPT;     -- DEPT_ID로 자동 조인\n```\n\n| 특징 | 설명 |\n|---|---|\n| 자동 매칭 | 이름이 같은 컬럼으로 매칭 |\n| 별칭 사용 X | 같은 이름 컬럼에 별칭 사용 불가 |\n| 같은 이름 컬럼은 한 번만 등장 | 중복 제거 |\n\n의도치 않은 컬럼이 매칭될 수 있어 실무에서는 잘 안 씀\n\n---\n\n### USING 절 — 명시적 컬럼 매칭\n\n```sql\nSELECT  NAME, DEPT_NAME, DEPT_ID\nFROM    EMP JOIN DEPT USING (DEPT_ID);\n```\n\n| NATURAL vs USING | 차이 |\n|---|---|\n| NATURAL | 자동(모든 같은 이름) |\n| USING | 지정한 컬럼만 |\n\nUSING 으로 조인된 컬럼은 테이블 별칭 사용 불가(예: `E.DEPT_ID` 불가)\n\n---\n\n### ON 절 vs WHERE 절 (OUTER JOIN 핵심)\n\n```sql\n-- 잘못된 예: OUTER JOIN인데 WHERE로 필터하면 NULL 행이 빠짐\nSELECT M.NAME, O.ORDER_ID\nFROM   MEMBER M LEFT JOIN ORDERS O ON M.MEMBER_ID = O.MEMBER_ID\nWHERE  O.AMOUNT > 1000;     -- 주문 없는 회원이 사라짐\n\n-- 올바른 예: 조인 조건에 함께\nSELECT M.NAME, O.ORDER_ID\nFROM   MEMBER M LEFT JOIN ORDERS O\n       ON M.MEMBER_ID = O.MEMBER_ID\n       AND O.AMOUNT > 1000;\n```\n\n---\n\n## 🚨 STEP 3. 출제위원 단골 함정 O/X & 노랭이·기출 문항별 족보\n\n### ⚠️ 시험장 단골 함정 vs 정답 1:1 대조표\n\n| 함정 | 정답 |\n|---|---|\n| INNER JOIN 키워드 생략 가능? | 가능. `JOIN ... ON`이 INNER JOIN |\n| OUTER 키워드 생략 가능? | 가능. `LEFT JOIN` = `LEFT OUTER JOIN` |\n| NATURAL JOIN의 매칭 기준 | 이름이 같은 모든 컬럼 |\n| NATURAL JOIN에서 같은 이름 컬럼에 별칭 | 사용 불가 |\n| USING 절의 컬럼에 테이블 별칭 | 사용 불가 |\n| OUTER JOIN의 조건은 ON vs WHERE | ON에 둬야 NULL 행이 살아남음 |\n| FULL OUTER 결과 | 양쪽 매칭 안 되는 것까지 모두 |\n| CROSS JOIN 행수 | A × B |\n\n단골 함정: LEFT JOIN 인데 WHERE 에 오른쪽 조건을 거는 케이스 → 결과적으로 INNER JOIN 과 같아짐\n\n### 📒 이 단원과 직결된 『SQL 자격검정 실전문제(노랭이)』 & 기출 킬러 족보\n\n- **[노랭이 2과목 70번 & 21회 기출 21번 ★최빈출]** `NATURAL JOIN`에서 사용된 열이나 `USING` 절의 기준 열에는 **테이블 이름이나 별칭(Alias, 접두사)을 절대 붙일 수 없다!** (오직 컬럼명만 단독 기술)\n- **[30회 기출 35번]** `CROSS JOIN`과 `NATURAL JOIN`은 `ON` 절(조인 조건절)을 사용할 수 없을 뿐, **`WHERE` 절에서 일반 검색 조건은 얼마든지 걸 수 있다**.\n- **[34회 기출 31번]** `CROSS JOIN`은 조인 조건 없이 왼쪽 테이블 `N`행과 오른쪽 테이블 `M`행을 가능한 모든 조합(`N × M`행)으로 곱집합 출력하며, `OUTER JOIN`과는 전혀 다르다.\n\n---\n\n## ✍️ STEP 4. 실전 적중! 단원 마무리 확인 문제\n\n<div class=\"sqld-quiz-box\" data-answer=\"2\">\n\n**Q. [2-1-8 대표 적중 문제]** `EMP` 테이블과 `DEPT` 테이블이 공통 컬럼으로 `DEPTNO`와 `LOC_CD` 2개를 가지고 있을 때, 다음 표준 조인(ANSI JOIN) 쿼리 중 **문법 오류가 발생하는** 것은?\n\n- ① `SELECT DEPTNO, E.ENAME, D.DNAME FROM EMP E NATURAL JOIN DEPT D WHERE DEPTNO = 10;`\n- ② `SELECT E.DEPTNO, E.ENAME, D.DNAME FROM EMP E JOIN DEPT D USING (DEPTNO) WHERE E.LOC_CD = 'SEOUL';`\n- ③ `SELECT DEPTNO, E.LOC_CD, E.ENAME, D.DNAME FROM EMP E JOIN DEPT D USING (DEPTNO);`\n- ④ `SELECT E.DEPTNO, E.ENAME, D.DNAME FROM EMP E JOIN DEPT D ON (E.DEPTNO = D.DEPTNO);`\n\n<details>\n<summary>💡 <b>정답 및 시나공·과외노트식 보기별 완벽 해설 확인하기 (클릭)</b></summary>\n\n**정답: ②**\n- **해설**: `USING (DEPTNO)` 절에 사용된 기준 컬럼인 **`DEPTNO`** 앞에는 `SELECT` 절이나 `WHERE` 절 어디에서도 **`E.DEPTNO`처럼 테이블 별칭(접두사)을 붙일 수 없습니다!** (`SELECT DEPTNO, ...`로 써야 정상 실행됩니다. 참고로 `USING`에 포함되지 않은 `E.LOC_CD`는 오히려 별칭을 반드시 붙여야 모호성 에러가 나지 않으므로 ③번은 정상입니다!)\n\n</details>\n</div>\n\n---\n\n## ⏱️ STEP 5. 시험장 입실 직전 30초 최종 요약 카드\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · `JOIN ... ON` = 표준 ANSI 문법 (어느 DBMS 든 통함)\n> · INNER 키워드 생략 가능 / OUTER 키워드 생략 가능 (`LEFT JOIN` = `LEFT OUTER JOIN`)\n> · NATURAL JOIN = 같은 이름 컬럼 **자동 전부** 매칭. 별칭 사용 **불가**\n> · USING (컬럼) = **지정한 컬럼만** 매칭. USING 컬럼에 테이블 별칭 **불가**\n> · OUTER JOIN 추가 조건은 반드시 **ON** 에 (WHERE 두면 INNER 효과)\n> · 결과 행: INNER ≤ LEFT/RIGHT ≤ FULL, CROSS = A × B"}, {"id": "ch-19", "index": 19, "title": "2-2-1. 서브쿼리(Sub Query)", "subj_id": "tab3", "subj_name": "2과목 2장 · SQL 활용", "badge": "2과목 2장 · SQL 활용", "md": "# 2-2-1. 서브쿼리(Sub Query)\n\n> **단원 분류**: `2과목` > `2-2. SQL 활용` > **`2-2-1. 서브쿼리`**\n> **🎯 출제 빈도**: `★★★★★ (매회 2문항 100% 출제!)` &nbsp;|&nbsp; **🧠 두문자 암기 공식**: `위치별 명칭: SELECT절 = 스칼라 서브쿼리(1행1열) / FROM절 = 인라인 뷰(동적 뷰) / WHERE·HAVING절 = 중첩 서브쿼리`\n\n## 🎯 과외선배의 1분 브리핑 & 핵심 구조도\n\n> [!TIP]\n> **👨‍🏫 1:1 과외선배의 학습 코칭 (`유선배 과외노트` 스타일)**\n> 서브쿼리 단골 포인트 4가지: ① **`SELECT` 절의 스칼라 서브쿼리는 반드시 단일 행, 단일 컬럼만 반환**해야 하며 결과가 0건이면 `NULL`을 반환하고 2건 이상이면 에러가 난다! ② **`EXISTS`는 존재 여부만 체크**하므로 `SELECT 1`이든 `SELECT *`이든 상관없으며 조건을 만족하는 행을 찾는 즉시 스캔을 멈춘다! ③ **`> ALL(10, 20)`은 최댓값(`20`)보다 큰 것, `> ANY(10, 20)`은 최솟값(`10`)보다 큰 것!** ④ 서브쿼리 안에는 `ORDER BY`를 쓸 수 없다(인라인 뷰 제외).\n\n> 서브쿼리는 쿼리 안에 들어 있는 또 다른 쿼리다. 메인쿼리가 사용할 값을 미리 계산해 알려주는 보조 쿼리다.\n\nex) \"평균 가격보다 비싼 상품\"을 찾을 때, 평균을 먼저 계산(서브쿼리)한 뒤 그 값보다 큰 상품을 찾는(메인쿼리) 두 단계 작업.\n\n### 🗺️ 한눈에 보는 핵심 구조도: 서브쿼리의 위치\n\n```sql\nSELECT  컬럼들                    ← SELECT 서브쿼리(스칼라)\nFROM    (서브쿼리)                 ← FROM 서브쿼리(인라인 뷰)\nWHERE   컬럼 = (서브쿼리);         ← WHERE 서브쿼리(대표적)\n```\n\n| ① 메인쿼리 (Main Query) 실행 중 | ➔ | ② 서브쿼리 (Subquery) 실행 | ➔ | ③ 메인쿼리 최종 완료 |\n| :---: | :---: | :---: | :---: | :---: |\n| 조건 비교나 값 계산을 위해 서브쿼리 호출 | | 서브쿼리가 먼저 값을 계산하여 반환 | | 반환된 값을 받아 메인쿼리 조건/출력 완성 |\n\n---\n\n## 📘 STEP 1. 시험 출제 핵심 이론 & 강의 도표 완벽 정복\n\n### 📌 1. 서브쿼리(Subquery)의 개념과 3대 분류 체계\n- **서브쿼리의 정의**: 하나의 SQL문 안에 포함되어 있는 또 다른 SQL문을 말한다.\n- **서브쿼리 사용 시 주의사항 (★단골 객관식 보기!)**:\n  1. 서브쿼리는 반드시 **괄호 `( )`**로 감싸서 기술한다.\n  2. 서브쿼리는 단일 행 또는 복수 행 비교 연산자와 함께 사용할 수 있다 (단, **단일 행 비교 연산자(`=`, `<`, `>`, `<=`, `>=`, `<>`)는 서브쿼리의 결과가 반드시 1건 이하**여야 하며, 2건 이상 반환되면 에러 발생!).\n  3. **서브쿼리(특히 중첩 서브쿼리/스칼라 서브쿼리) 안에서는 `ORDER BY` 절을 사용할 수 없다!** (`ORDER BY` 절은 메인 쿼리의 마지막 문장에 단 한 개만 올 수 있음. *단, `FROM` 절에 쓰이는 **인라인 뷰(Inline View)** 안에서는 Top-N 추출 등을 위해 예외적으로 `ORDER BY` 사용이 가능하다!*)\n  4. 서브쿼리가 사용 가능한 위치: **`SELECT` 절**, **`FROM` 절**, **`WHERE` 절**, **`HAVING` 절**, **`ORDER BY` 절**, **`INSERT` 문의 `VALUES` 절**, **`UPDATE` 문의 `SET` 절**. *(주의: `GROUP BY` 절에는 서브쿼리를 사용할 수 없다!)*\n\n| 분류 기준 | 세부 유형 | 핵심 설명 및 특징 |\n| :---: | :--- | :--- |\n| **1. 동작하는 방식에 따른 분류** | **비연관(Un-Correlated) 서브쿼리** | 서브쿼리가 메인쿼리 컬럼을 가지고 있지 않은 형태. 메인쿼리에 값(서브쿼리가 실행된 결과)을 제공하기 위한 목적으로 주로 사용. |\n| | **연관(Correlated) 서브쿼리** | 서브쿼리가 **메인쿼리의 컬럼을 포함**하고 있는 형태. 일반적으로 메인쿼리가 먼저 수행되어 읽혀진 데이터를 서브쿼리에서 조건이 맞는지 확인하고자 할 때 사용. |\n| **2. 반환되는 데이터 형태에 따른 분류** | **단일행(Single Row) 서브쿼리** | 서브쿼리의 실행 결과가 **항상 1건 이하**인 서브쿼리. 단일행 비교연산자(`=`, `<`, `<=`, `>`, `>=`, `<>`)와 함께 사용. |\n| | **다중행(Multi Row) 서브쿼리** | 서브쿼리의 실행 결과가 **여러 건**인 서브쿼리. 다중행 비교연산자(**`IN`, `ALL`, `ANY`, `SOME`, `EXISTS`**)와 함께 사용. |\n| | **다중컬럼(Multi Column) 서브쿼리** | 서브쿼리의 실행 결과로 **여러 컬럼**을 반환. 메인쿼리의 조건절에 여러 컬럼을 동시에 비교(`WHERE (DEPTNO, SAL) IN (SELECT ...)`). **SQL Server에서는 지원하지 않음!** |\n| **3. 위치에 따른 분류 (★명칭 암기!)** | **스칼라 서브쿼리 (Scalar Subquery)** | **`SELECT` 절**에 사용하는 서브쿼리 (**반드시 1행 1열 단일 값**만 반환해야 함! 결과가 0건이면 **`NULL`** 반환, 2건 이상이면 에러!) |\n| | **인라인 뷰 (Inline View)** | **`FROM` 절**에 사용하는 서브쿼리 (**동적 뷰(Dynamic View)**라고도 부르며, 가상의 테이블처럼 취급되어 메인쿼리에서 인라인 뷰의 컬럼을 자유롭게 참조 가능!) |\n| | **중첩 서브쿼리 (Nested Subquery)** | **`WHERE` 절**이나 **`HAVING` 절**에 조건절의 일부로 사용하는 서브쿼리. |\n\n![서브쿼리의 분류 체계 총정리 및 단일행 서브쿼리 구조](images/p053_img01.png)\n\n![단일행 서브쿼리 실행 쿼리 예시 1](images/p053_img02.png)\n\n![단일행 서브쿼리 실행 과정 도식 1](images/p053_img03.png)\n\n![집계 함수를 사용한 단일행 서브쿼리 예시 2](images/p053_img04.png)\n\n![집계 함수를 사용한 단일행 서브쿼리 실행 과정 도식 2](images/p053_img05.png)\n\n---\n\n### 📌 2. 다중행 서브쿼리 연산자 (`IN`, `ALL`, `ANY`/`SOME`, `EXISTS`) 완벽 비교\n\n> 💡 **[핵심 필수 암기]**\n> **`ALL` vs `ANY(SOME)` 부등호 크기 비교 암기 공식!**\n> 서브쿼리 결과 집합이 `(1000, 2000, 3000)`일 때:\n> - **`SAL > ALL (1000, 2000, 3000)`**: **\"모두보다 크다\"** ➔ 제일 큰 값(`MAX = 3000`)보다 커야 함! (**`SAL > MAX(...)`**와 동일)\n> - **`SAL < ALL (1000, 2000, 3000)`**: **\"모두보다 작다\"** ➔ 제일 작은 값(`MIN = 1000`)보다 작아야 함! (**`SAL < MIN(...)`**와 동일)\n> - **`SAL > ANY (1000, 2000, 3000)`**: **\"하나라도 크다\"** ➔ 제일 작은 값(`MIN = 1000`)보다만 크면 됨! (**`SAL > MIN(...)`**와 동일)\n> - **`SAL < ANY (1000, 2000, 3000)`**: **\"하나라도 작다\"** ➔ 제일 큰 값(`MAX = 3000`)보다만 작으면 됨! (**`SAL < MAX(...)`**와 동일)\n> - **`SAL = ANY (1000, 2000, 3000)`**: **`SAL IN (1000, 2000, 3000)`**과 완전히 동일!\n\n![다중행 연산자(IN, ALL, ANY, SOME, EXISTS) 비교표](images/p054_img01.png)\n\n![단일행 연산자에 다중행 서브쿼리를 사용하여 에러가 나는 사례](images/p054_img02.png)\n\n![IN 연산자를 사용하여 다중행 서브쿼리를 정상 처리한 사례](images/p054_img03.png)\n\n![다중컬럼(Multi-Column) 서브쿼리 작성 및 실행 결과](images/p055_img01.png)\n\n![연관(Correlated) 서브쿼리 작성 및 수행 원리](images/p055_img02.png)\n\n![EXISTS 연산자를 활용한 연관 서브쿼리 예시](images/p055_img03.png)\n\n---\n\n### 📌 3. 스칼라 서브쿼리, 인라인 뷰, HAVING절/DML 서브쿼리 및 `NOT IN` vs `NOT EXISTS`\n- **스칼라 서브쿼리 (`SELECT` 절)**:\n  - 메인쿼리의 한 행당 **단일 행, 단일 컬럼(1행 1열)**을 반환한다 (`LEFT OUTER JOIN`과 유사한 효과를 냄 — 매칭되는 서브쿼리 결과가 없으면 해당 행을 탈락시키지 않고 **`NULL`을 출력**함!).\n- **인라인 뷰 (`FROM` 절)**:\n  - SQL 문이 실행될 때만 임시로 생성되는 **동적 뷰(Dynamic View)**이기 때문에 데이터베이스에 해당 구조가 저장되지 않는다 (일반 뷰를 **정적 뷰(Static View)**라고 하는 것과 대비됨).\n  - 인라인 뷰 안의 컬럼은 메인 쿼리의 `SELECT`, `WHERE` 등에서 자유롭게 참조할 수 있다! (반면 일반 `WHERE` 절 서브쿼리의 컬럼은 메인쿼리 `SELECT` 절에서 출력할 수 없음!)\n- **🔥 `NOT IN` vs `NOT EXISTS`의 결정적 차이 (★서브쿼리에 `NULL`이 있을 때!)**:\n  - **`WHERE A NOT IN (서브쿼리)`**: 서브쿼리의 결과 집합에 **`NULL`이 단 1건이라도 포함되어 있으면**, `AND A != NULL`이 `UNKNOWN`이 되어 **전체 메인쿼리 결과가 무조건 0건(공집합)**이 나온다!\n  - **`WHERE NOT EXISTS (연관 서브쿼리)`**: 메인쿼리 행을 대입했을 때 조건을 만족하는 행이 존재하는지 여부(`TRUE`/`FALSE`)만 검사하므로, 서브쿼리 테이블에 **`NULL`이 들어있어도 영향을 받지 않고 정상적으로 차집합 결과를 반환**한다!\n\n![스칼라 서브쿼리(Scalar Subquery) 구조 및 실행 결과](images/p055_img04.png)\n\n![인라인 뷰(Inline View)를 활용한 조인 및 Top-N 조회 예시 1](images/p056_img01.png)\n\n![인라인 뷰 실행 결과 테이블 1](images/p056_img02.png)\n\n![인라인 뷰와 그룹 함수를 결합한 예시 2](images/p056_img03.png)\n\n![HAVING 절에 서브쿼리를 사용한 예시](images/p056_img04.png)\n\n![UPDATE 문의 SET 절에 서브쿼리를 사용한 예시](images/p056_img05.png)\n\n![INSERT 문의 VALUES 절에 서브쿼리를 사용한 예시](images/p056_img06.png)\n\n![서브쿼리 위치별 활용 종합 비교 예시](images/p056_img07.png)\n\n![뷰(View)의 개념 및 사용 장점 (독립성, 편리성, 보안성)](images/p057_img01.png)\n\n![CREATE VIEW 생성 및 조회·삭제 구문 예시](images/p057_img02.png)\n\n![인라인 뷰와 뷰(View)를 결합한 실전 SQL 예제 1](images/p057_img03.png)\n\n![서브쿼리 심화 비교 예제 2](images/p058_img01.png)\n\n---\n\n## 🔍 STEP 2. 직관적 Before & After 비교 & 실전 SQL 트레이스\n\n### 🔄 [Before & After] 직관적 비교\n\n같은 EMP 4명 데이터에 같은 비교(자기보다 평균이 큰 사람)를 적용해도, 비교 기준이 \"회사 전체 평균\"이냐 \"자기 부서 평균\"이냐에 따라 결과가 갈린다. 단일행 서브쿼리(전체 평균 1개) vs 연관 서브쿼리(부서별 평균 2개).\n\n### EMP\n\n| NAME | DEPT_ID | SAL |\n|---|---|---|\n| 김 | D1 | 3000 |\n| 이 | D1 | 5000 |\n| 박 | D2 | 4000 |\n| 최 | D2 | 4500 |\n\n### 단일행 서브쿼리\n\n```sql\nSELECT NAME, SAL FROM EMP WHERE SAL > (SELECT AVG(SAL) FROM EMP);\n```\n\n전체 평균 = 4125\n\n| NAME | SAL |\n|---|---|\n| 이 | 5000 |\n| 최 | 4500 |\n\n### 연관 서브쿼리\n\n```sql\nSELECT NAME, SAL FROM EMP E\nWHERE  SAL > (SELECT AVG(SAL) FROM EMP WHERE DEPT_ID = E.DEPT_ID);\n```\n\n부서별 평균: D1=4000, D2=4250\n\n| NAME | SAL |\n|---|---|\n| 이 | 5000 |\n| 최 | 4500 |\n\n비연관(단일행) 서브쿼리는 메인쿼리와 무관하게 한 번만 실행되어 4125라는 한 값을 만들고, 모든 행이 그 값과 비교된다. 반면 연관 서브쿼리는 바깥의 E.DEPT_ID를 참조하므로 행마다 평균이 다시 계산된다(D1행은 4000, D2행은 4250 기준). 결과 행 집합이 우연히 같아 보여도 비교 기준은 행마다 다르다. \"전체 기준\"이면 단일행, \"그룹 기준\"이면 연관.\n\n### 💻 [SQL 실전 트레이스]\n\n### 단일행 서브쿼리\n\n```sql\n-- 평균 급여보다 많이 받는 사원\nSELECT  NAME, SAL\nFROM    EMP\nWHERE   SAL > (SELECT AVG(SAL) FROM EMP);\n```\n\n서브쿼리 결과가 1행 1값이므로 `>` 같은 단순 연산자 사용 가능\n\n---\n\n### 다중행 서브쿼리 — IN / ANY / ALL\n\n| 연산자 | 의미 |\n|---|---|\n| IN (...) | 값 중 하나와 같으면 |\n| > ANY(...) | 하나 이상보다 크면 → 최솟값보다 크면 됨 |\n| > ALL(...) | 모두보다 크면 → 최댓값보다 커야 함 |\n| EXISTS (...) | 존재하면 참 |\n\n```sql\n-- IN\nSELECT  *\nFROM    EMP\nWHERE   DEPT_ID IN (SELECT DEPT_ID FROM DEPT WHERE LOC = 'SEOUL');\n\n-- > ANY: 어느 한 값보다 크면 → 최솟값보다만 크면 됨\nSELECT  *\nFROM    EMP\nWHERE   SAL > ANY (SELECT SAL FROM EMP WHERE DEPT_ID = 'D1');\n\n-- > ALL: 모든 값보다 커야 함 → 최댓값보다 커야 함\nSELECT  *\nFROM    EMP\nWHERE   SAL > ALL (SELECT SAL FROM EMP WHERE DEPT_ID = 'D1');\n```\n\n---\n\n### EXISTS 서브쿼리\n\n```sql\n-- 주문 내역이 있는 회원만\nSELECT  *\nFROM    MEMBER M\nWHERE   EXISTS (SELECT 1 FROM ORDERS O WHERE O.MEMBER_ID = M.MEMBER_ID);\n```\n\n| 특징 | 설명 |\n|---|---|\n| 결과가 존재하기만 하면 TRUE | 1건이라도 있으면 통과 |\n| IN보다 효율적일 수 있음 | 존재 확인만 하면 됨 |\n\n---\n\n### 스칼라 서브쿼리 (SELECT 절)\n\n```sql\nSELECT  E.NAME,\n        E.SAL,\n        (SELECT AVG(SAL) FROM EMP) AS 전체평균\nFROM    EMP E;\n```\n\n반드시 1행 1값 반환. 여러 행 반환 시 에러\n\n---\n\n### 인라인 뷰 (FROM 절)\n\n```sql\n-- 부서별 평균 중 평균 4000 이상인 부서\nSELECT  *\nFROM    (SELECT DEPT_ID, AVG(SAL) AS AVG_SAL\n         FROM   EMP\n         GROUP BY DEPT_ID) X\nWHERE   X.AVG_SAL >= 4000;\n```\n\n임시 테이블처럼 사용. 별칭 필수\n\n---\n\n### 연관 서브쿼리\n\n```sql\n-- 자기 부서 평균보다 많이 받는 사원\nSELECT  E.NAME, E.SAL, E.DEPT_ID\nFROM    EMP E\nWHERE   E.SAL > (SELECT AVG(SAL)\n                 FROM   EMP\n                 WHERE  DEPT_ID = E.DEPT_ID);   -- E.DEPT_ID는 메인쿼리 참조\n```\n\n| 특징 | 설명 |\n|---|---|\n| 메인쿼리의 각 행마다 서브쿼리 실행 | 행 수만큼 반복 |\n| 성능 영향 | 큼. 필요시 **조인**으로 변환 |\n\n---\n\n## 🚨 STEP 3. 출제위원 단골 함정 O/X & 노랭이·기출 문항별 족보\n\n### ⚠️ 시험장 단골 함정 vs 정답 1:1 대조표\n\n| 함정 | 정답 |\n|---|---|\n| 다중행에 `=` 사용 | 에러 → IN 사용 |\n| `> ANY` 의미 | 최솟값보다 크면 통과 |\n| `> ALL` 의미 | 최댓값보다 커야 통과 |\n| 스칼라 서브쿼리 결과 | 1행 1값 |\n| 인라인 뷰의 위치 | FROM 절 |\n| EXISTS는 결과를 사용? | 존재 여부만 확인 |\n| 연관 서브쿼리 특징 | 메인쿼리 컬럼 참조 |\n\n단골 함정: `SAL > ANY(...)`를 \"모두보다 큰\"으로 잘못 해석하는 보기. ANY=최소 기준, ALL=최대 기준. 두 SELECT 결과를 합치는 도구는 서브쿼리가 아니라 **집합 연산자**(혼동 주의).\n\n### 📒 이 단원과 직결된 『SQL 자격검정 실전문제(노랭이)』 & 기출 킬러 족보\n\n- **[노랭이 2과목 66·95·99·100번 ★중요체크]** ① `EXISTS` 절은 존재 유무만 판단한다. ② **다중 컬럼 서브쿼리는 SQL Server에서 지원하지 않는다.** ③ **다중 행 비교 연산자(`IN`, `ALL`, `ANY`)는 단일 행 서브쿼리의 비교 연산자로도 사용할 수 있다** (반대는 불가!). ④ 스칼라 서브쿼리는 `OUTER JOIN`으로 동일한 결과를 추출할 수 있으며, 인라인 뷰(Inline View)는 SQL이 실행될 때만 임시로 생성되는 **동적 뷰(Dynamic View)**이다.\n- **[30회 기출 12번]** 스칼라 서브쿼리에서 한 번의 값 전달에 2개 이상의 행이 반환될 수 없다(단일행·단일칼럼만 가능).\n- **[34회 기출 12번]** 인라인 뷰(서브쿼리)를 벗어나면 메인쿼리에서 참조할 수 없는 값들은 인라인 뷰의 `SELECT` 절에 명시되지 않은 칼럼들뿐이다 (인라인 뷰의 `SELECT` 절에 명시된 칼럼은 메인쿼리 전체에서 사용 가능!).\n\n---\n\n## ✍️ STEP 4. 실전 적중! 단원 마무리 확인 문제\n\n<div class=\"sqld-quiz-box\" data-answer=\"3\">\n\n**Q. [2-2-1 대표 적중 문제]** 다음 중 서브쿼리(Subquery)에 대한 설명으로 **가장 부적절한** 것은?\n\n- ① `SELECT` 절에 사용하는 스칼라 서브쿼리(Scalar Subquery)는 한 번에 단일 행, 단일 컬럼만을 반환해야 하며, 일치하는 데이터가 없을 경우 `NULL`을 반환한다.\n- ② `FROM` 절에 사용하는 인라인 뷰(Inline View)는 SQL 문이 실행될 때만 임시로 생성되는 동적 뷰(Dynamic View)로서, 인라인 뷰 내부에서는 `ORDER BY` 절을 사용할 수 있다.\n- ③ 서브쿼리의 결과가 1건(단일 행)만 반환되는 경우에는 다중 행 비교 연산자인 `IN`, `ANY`, `ALL`을 사용하면 문법 오류가 발생한다.\n- ④ `WHERE SAL < ALL (SELECT SAL FROM EMP WHERE DEPTNO = 20)`은 20번 부서 사원들의 급여 중 **최솟값(`MIN(SAL)`)보다 작은** 급여를 받는 사원을 조회하는 것과 같다.\n\n<details>\n<summary>💡 <b>정답 및 시나공·과외노트식 보기별 완벽 해설 확인하기 (클릭)</b></summary>\n\n**정답: ③**\n- **해설**: **다중 행 비교 연산자(`IN`, `ANY`, `ALL`, `EXISTS`)는 서브쿼리 결과가 1건(단일 행)일 때도 아무 문제 없이 사용할 수 있습니다!** (노랭이 99번 핵심 지문). 반대로 단일 행 비교 연산자(`=`, `<`, `>`)를 2건 이상 반환되는 다중 행 서브쿼리에 쓰면 에러(`ORA-01427: 단일 행 하위 질의에 2개 이상의 행이 리턴되었습니다`)가 발생합니다.\n\n</details>\n</div>\n\n---\n\n## ⏱️ STEP 5. 시험장 입실 직전 30초 최종 요약 카드\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · 행수 분류: **단일행** (`=`,`>`,…) / **다중행** (IN, ANY, ALL, EXISTS) / **다중컬럼**\n> · 위치 분류: **스칼라** (SELECT) / **인라인뷰** (FROM) / **중첩** (WHERE)\n> · `> ANY` = **최솟값보다 크면** 통과 (헐거움) / `> ALL` = **최댓값보다 커야** 통과 (엄격)\n> · EXISTS = 존재 여부만 확인 (1건이라도 있으면 TRUE)\n> · 연관 서브쿼리 = 메인쿼리 컬럼 참조, **각 행마다 반복 실행** (성능 주의)\n> · 인라인뷰 = **별칭 필수** (FROM 절 서브쿼리)"}, {"id": "ch-20", "index": 20, "title": "2-2-2. 집합 연산자(Set Operators)", "subj_id": "tab3", "subj_name": "2과목 2장 · SQL 활용", "badge": "2과목 2장 · SQL 활용", "md": "# 2-2-2. 집합 연산자(Set Operators)\n\n> **단원 분류**: `2과목` > `2-2. SQL 활용` > **`2-2-2. 집합 연산자`**\n> **🎯 출제 빈도**: `★★★★☆ (매회 1문항 출제)` &nbsp;|&nbsp; **🧠 두문자 암기 공식**: `UNION / INTERSECT / MINUS(EXCEPT) = 중복 제거 + 자동 정렬(느림) vs UNION ALL = 중복 포함 + 정렬 없음(빠름!)`\n\n## 🎯 과외선배의 1분 브리핑 & 핵심 구조도\n\n> [!TIP]\n> **👨‍🏫 1:1 과외선배의 학습 코칭 (`유선배 과외노트` 스타일)**\n> 집합 연산자 3대 공식: ① 결과 테이블의 **컬럼 이름(별칭)은 무조건 첫 번째 `SELECT` 문**을 따라간다! ② **`ORDER BY` 절은 쿼리의 맨 마지막 줄에 딱 한 번만** 쓸 수 있으며, 정렬 기준 컬럼 이름도 첫 번째 `SELECT` 문의 컬럼명(또는 별칭/순서번호)을 써야 한다! ③ 두 집합에 중복된 행이 하나도 없을 때 `UNION`과 `UNION ALL`은 **행 건수는 같지만 정렬 순서가 다를 수 있으므로 완전히 똑같다고 할 수 없다**(단, `COUNT(*)` 건수 비교 문제에서는 같음!).\n\n> 집합 연산자는 두 개 이상의 SELECT 결과를 합치거나 비교하는 도구다. 합집합(UNION), 교집합(INTERSECT), 차집합(MINUS).\n\nex) 도시락 A={김밥,사과,우유}와 B={사과,빵,우유} → UNION={김밥,사과,우유,빵}, INTERSECT={사과,우유}, MINUS(A-B)={김밥}.\n\n### 🗺️ 한눈에 보는 핵심 구조도\n\n```\nA = { 김, 이, 박 }      B = { 이, 박, 최 }\n\nUNION       (A ∪ B, 중복 제거)  →  { 김, 이, 박, 최 }\nUNION ALL   (A + B, 중복 유지)  →  { 김, 이, 박, 이, 박, 최 }\nINTERSECT   (A ∩ B, 교집합)     →  { 이, 박 }\nMINUS       (A − B, 차집합)     →  { 김 }       (A 에만 있는 것)\n```\n\n---\n\n## 📘 STEP 1. 시험 출제 핵심 이론 & 강의 도표 완벽 정복\n\n### 📌 1. 집합 연산자 4종 (`UNION`, `UNION ALL`, `INTERSECT`, `MINUS`/`EXCEPT`) 완벽 비교\n- **집합 연산자의 정의**: 두 개 이상의 테이블에서 조인을 사용하지 않고 연관된 데이터를 조회하는 방법. 여러 개의 질의의 결과를 연결하여 하나로 결합하는 방식을 사용한다. (**조인(JOIN)이 컬럼(열)을 옆으로 붙이는 수평 결합**이라면, **집합 연산자는 행(Row)을 위아래로 이어 붙이는 수직 결합**이다!)\n\n| 집합 연산자 | 수학적 의미 | 중복 행 제거 여부 | 내부 정렬(SORT) 발생 여부 | 실행 속도 / 성능 |\n| :---: | :---: | :---: | :---: | :---: |\n| **`UNION`** | **합집합** (`A ∪ B`) | **⭕ 중복 행 제거** (유일한 행만 남김) | **⭕ 정렬 발생** (중복 비교를 위해 내부 소트 수행) | 느림 (부하 큼) |\n| **`UNION ALL`** | **합집합 + 교집합 그대로 유지** (`A + B`) | **❌ 중복 제거 안 함!** (단순히 위아래로 이어 붙임) | **❌ 정렬 발생 안 함** | **⚡ 가장 빠름!** |\n| **`INTERSECT`** | **교집합** (`A ∩ B`, 양쪽 모두 존재하는 행) | **⭕ 중복 행 제거** | **⭕ 정렬 발생** | 느림 |\n| **`MINUS`** *(Oracle)*<br>**`EXCEPT`** *(SQL Server)* | **차집합** (`A - B`, 앞 쿼리 결과에서 뒤 쿼리 결과를 뺌) | **⭕ 중복 행 제거** | **⭕ 정렬 발생** | 느림 |\n\n> 💡 **[핵심 필수 암기]**\n> **집합 연산자 사용 시 5대 필수 규칙 (★시험 단골 출제!)**:\n> 1. 두 `SELECT` 절의 **컬럼 개수가 같아야** 하고, 대응되는 위치의 **컬럼 데이터 타입이 상호 호환**되어야 한다 (컬럼 이름은 달라도 무방!).\n> 2. 결과 테이블의 **컬럼 제목(Header/별칭)은 무조건 첫 번째 `SELECT` 문의 컬럼명(또는 별칭)**을 따라간다!\n> 3. **`ORDER BY` 절은 개별 쿼리마다 쓸 수 없고, 전체 집합 연산 쿼리의 맨 마지막 줄에 딱 한 번만** 사용할 수 있다! (이때 `ORDER BY`에는 첫 번째 `SELECT` 절의 컬럼명, 별칭, 또는 순서 번호 `1, 2...`를 사용해야 함!)\n> 4. 만약 두 쿼리의 결과가 애초에 서로 겹칠 일이 없는 배타적 조건(예: 쿼리1은 `DEPTNO = 10`, 쿼리2는 `DEPTNO = 20`)이라면, **`UNION`과 `UNION ALL`의 결과 행 집합은 100% 동일**하다! (단, 성능은 정렬을 하지 않는 `UNION ALL`이 훨씬 좋다!)\n\n![집합 연산자 4종(UNION, UNION ALL, INTERSECT, MINUS/EXCEPT) 개념 및 벤다이어그램 비교표](images/p058_img02.png)\n\n![집합 연산자 단계별 쿼리 변환 예시 1](images/p059_img01.png)\n\n![UNION 합집합 수행 쿼리 및 결과 2](images/p059_img02.png)\n\n![UNION ALL 중복 포함 합집합 수행 쿼리 및 결과 3](images/p059_img03.png)\n\n![INTERSECT 교집합 수행 쿼리 및 결과 4](images/p059_img04.png)\n\n![MINUS(EXCEPT) 차집합 수행 쿼리 및 결과 5](images/p059_img05.png)\n\n![MINUS를 NOT EXISTS / NOT IN으로 대체한 쿼리 비교](images/p060_img01.png)\n\n---\n\n## 🔍 STEP 2. 직관적 Before & After 비교 & 실전 SQL 트레이스\n\n### 🔄 [Before & After] 직관적 비교\n\n본사(EMP_A)와 지사(EMP_B) 두 명단을 합치거나 비교. 두 표에 \"이\"와 \"박\"이 양쪽 모두 있고, \"김\"은 A에만, \"최\"는 B에만 있다. 같은 데이터를 네 가지 집합 연산자(UNION/UNION ALL/INTERSECT/MINUS)에 넣었을 때 결과가 어떻게 갈라지는지.\n\n### EMP_A\n\n| NAME |\n|---|\n| 김 |\n| 이 |\n| 박 |\n\n### EMP_B\n\n| NAME |\n|---|\n| 이 |\n| 박 |\n| 최 |\n\n### UNION\n\n| NAME |\n|---|\n| 김 |\n| 이 |\n| 박 |\n| 최 |\n\n(중복 제거, 4행)\n\n### UNION ALL\n\n| NAME |\n|---|\n| 김 |\n| 이 |\n| 박 |\n| 이 |\n| 박 |\n| 최 |\n\n(중복 그대로, 6행)\n\n### INTERSECT\n\n| NAME |\n|---|\n| 이 |\n| 박 |\n\n### MINUS\n\n| NAME |\n|---|\n| 김 |\n\n같은 두 입력에서 4가지 결과가 갈라지는 이유는 \"중복을 어떻게 다루느냐\"와 \"어느 쪽 기준으로 비교하느냐\"가 연산마다 다르기 때문이다. UNION은 중복 제거를 위해 정렬을 한 번 더 거치므로 행 수가 줄고, UNION ALL은 그 단계를 건너뛰어 그대로 이어붙인다. INTERSECT는 양쪽 모두에 있는 값만, MINUS는 A에만 있는 값만 남긴다. \"합칠 때 중복이 의미가 있는가\", \"두 집합의 공통 부분만 보고 싶은가\", \"한쪽에만 있는 것을 추리는가\"를 먼저 묻고 연산자를 고를 것.\n\n### 💻 [SQL 실전 트레이스]\n\n```sql\n-- UNION (중복 제거)\nSELECT NAME FROM EMP_A\nUNION\nSELECT NAME FROM EMP_B;\n\n-- UNION ALL (중복 유지)\nSELECT NAME FROM EMP_A\nUNION ALL\nSELECT NAME FROM EMP_B;\n\n-- INTERSECT (교집합)\nSELECT NAME FROM EMP_A\nINTERSECT\nSELECT NAME FROM EMP_B;\n\n-- MINUS (차집합, A에만 있는 것)\nSELECT NAME FROM EMP_A\nMINUS\nSELECT NAME FROM EMP_B;\n\n-- ORDER BY는 마지막에\nSELECT NAME FROM EMP_A\nUNION\nSELECT NAME FROM EMP_B\nORDER BY NAME;\n```\n\n---\n\n## 🚨 STEP 3. 출제위원 단골 함정 O/X & 노랭이·기출 문항별 족보\n\n### ⚠️ 시험장 단골 함정 vs 정답 1:1 대조표\n\n| 함정 | 정답 |\n|---|---|\n| 컬럼 개수가 다르면 | 에러 |\n| UNION vs UNION ALL | UNION은 중복 제거, ALL은 그대로 |\n| 결과 컬럼명 기준 | 첫 SELECT |\n| ORDER BY 위치 | 마지막에 한 번 |\n| 정렬 발생 여부 | UNION/INTERSECT/MINUS는 정렬 발생(중복 제거 위해) |\n| MINUS는 표준인가 | Oracle 전용. 표준은 EXCEPT |\n| NULL의 처리 | NULL = NULL로 간주(중복) |\n\n단골 함정: 컬럼 데이터 타입이 다른데 합치려는 케이스는 에러\n\n### 📒 이 단원과 직결된 『SQL 자격검정 실전문제(노랭이)』 & 기출 킬러 족보\n\n- **[노랭이 2과목 82·86번 ★중요체크]** ① 집합 연산자 사용 시 같은 칼럼의 `ALIAS`가 각 모듈마다 다르게 선언될 경우, **첫 번째 `SELECT` 모듈에 선언된 `ALIAS`가 최종 적용**된다. ② `UNION`과 `UNION ALL` 결과에 대해 바깥에서 `SELECT COUNT(*)`를 수행하는 경우, 교집합(중복 행)이 없다면 두 쿼리의 결과 건수(`COUNT(*)`)는 동일하다.\n\n---\n\n## ✍️ STEP 4. 실전 적중! 단원 마무리 확인 문제\n\n<div class=\"sqld-quiz-box\" data-answer=\"3\">\n\n**Q. [2-2-2 대표 적중 문제]** 다음 중 집합 연산자(`UNION`, `UNION ALL`, `INTERSECT`, `MINUS`)에 대한 설명으로 **가장 부적절한** 것은?\n\n- ① `UNION`, `INTERSECT`, `MINUS` 연산자는 두 결과 집합의 중복된 행을 제거하기 위해 내부적으로 정렬(Sort) 작업을 수행하므로, 중복을 제거하지 않고 그대로 합치는 `UNION ALL`보다 성능상 부하가 크다.\n- ② 집합 연산자로 연결된 SQL 문에서 결과 컬럼의 헤더(별칭)는 첫 번째 `SELECT` 절에 정의된 컬럼명 또는 별칭으로 결정된다.\n- ③ 집합 연산자를 사용할 때 각 `SELECT` 절마다 개별적으로 `ORDER BY` 절을 사용하여 정렬한 뒤 합칠 수 있다.\n- ④ 차집합 연산자의 경우 오라클(Oracle)에서는 `MINUS`를 사용하고, SQL Server에서는 `EXCEPT`를 사용한다.\n\n<details>\n<summary>💡 <b>정답 및 시나공·과외노트식 보기별 완벽 해설 확인하기 (클릭)</b></summary>\n\n**정답: ③**\n- **해설**: 집합 연산자를 사용한 SQL 문에서 **`ORDER BY` 절은 개별 `SELECT` 문 뒤에 쓸 수 없으며, 전체 집합 연산의 맨 마지막 줄에 단 한 번만** 기술할 수 있습니다! (만약 개별 집합에서 정렬 후 상위 N건을 자르고 싶다면 인라인 뷰로 감싸야 합니다).\n\n</details>\n</div>\n\n---\n\n## ⏱️ STEP 5. 시험장 입실 직전 30초 최종 요약 카드\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · UNION = **중복 제거** (정렬 발생, 느림) / UNION ALL = **중복 유지** (정렬 없음, 빠름)\n> · INTERSECT = 교집합 (중복 제거) / MINUS(Oracle) = EXCEPT(표준) = A − B (중복 제거)\n> · 사용 조건: **컬럼 개수 동일** + **타입 호환** + 컬럼명은 첫 SELECT\n> · ORDER BY = **맨 마지막에 한 번만**\n> · NULL 처리 = `NULL = NULL` 로 간주 (중복 제거 대상)\n> · 중복 없다고 확신 → **UNION ALL** 로 성능 ↑"}, {"id": "ch-21", "index": 21, "title": "2-2-3. 그룹 함수(Group Functions)", "subj_id": "tab3", "subj_name": "2과목 2장 · SQL 활용", "badge": "2과목 2장 · SQL 활용", "md": "# 2-2-3. 그룹 함수(Group Functions)\n\n> **단원 분류**: `2과목` > `2-2. SQL 활용` > **`2-2-3. 그룹 함수`**\n> **🎯 출제 빈도**: `★★★★★ (매회 1~2문항 100% 출제!)` &nbsp;|&nbsp; **🧠 두문자 암기 공식**: `ROLLUP(A, B) = N+1개(계층 소계+총계, 순서 중요!) / CUBE(A, B) = 2^N개(모든 조합!) / GROUPING SETS(A, B) = 개별 소계만(총계 없음!)`\n\n## 🎯 과외선배의 1분 브리핑 & 핵심 구조도\n\n> [!TIP]\n> **👨‍🏫 1:1 과외선배의 학습 코칭 (`유선배 과외노트` 스타일)**\n> 그룹 함수는 **출력되는 그룹 조합 개수 공식**만 알면 10초 만에 풉니다! 컬럼이 2개(`A, B`)일 때: ① **`ROLLUP(A, B)` ➔ `(A,B) + (A) + () 총계` = 3가지** (순서 바꾸면 결과 달라짐!), ② **`CUBE(A, B)` ➔ `(A,B) + (A) + (B) + () 총계` = $2^2 = 4$가지**, ③ **`GROUPING SETS(A, B)` ➔ `(A) + (B)` = 2가지**(총계 없음! 총계 넣으려면 `GROUPING SETS(A, B, ())`). 그리고 소계/총계 행에서 집계되어 합쳐진 자리에는 `NULL`이 찍히며, 이때 **`GROUPING(컬럼)` 함수는 집계로 생긴 가짜 `NULL`이면 `1`, 원래 데이터는 `0`을 반환**합니다!\n\n> 그룹 함수는 다양한 단위의 소계와 합계를 한 쿼리로 한꺼번에 뽑아주는 확장 **GROUP BY** 도구다(ROLLUP, CUBE, GROUPING SETS).\n\nex) 매장 매출 보고서에서 \"부서별 / 부서+상품별 / 전체 합계\"를 따로따로 SELECT하지 않고 한 번에 뽑는 도구.\n\n### 🗺️ 한눈에 보는 핵심 구조도: 그룹 함수의 종류\n\n| 확장 그룹 함수 3대장 | 핵심 요약 |\n| :---: | :--- |\n| **`ROLLUP(A, B)`** | 오른쪽부터 하나씩 컬럼을 빼며 계층적 소계 + 전체 총계 산출 ($N+1$ 단계) |\n| **`CUBE(A, B)`** | 가능한 모든 컬럼 조합의 소계 + 전체 총계 산출 ($2^N$ 단계, 시스템 부하 가장 큼) |\n| **`GROUPING SETS(A, B, ...)`** | 괄호 안에 내가 지정한 그룹 조합만 콕 집어서 소계 산출 (가장 유연함) |\n\n| 함수 | 의미 | 비유 |\n|---|---|---|\n| ROLLUP(A, B) | A별, A+B별, 전체 합계 | 단계적 소계 |\n| CUBE(A, B) | 모든 조합(A별, B별, A+B별, 전체) | 큐브의 모든 면 |\n| GROUPING SETS((A), (B)) | 특정 조합만 | 골라서 보기 |\n\n---\n\n## 📘 STEP 1. 시험 출제 핵심 이론 & 강의 도표 완벽 정복\n\n### 📌 1. 그룹 함수(소계·합계 산출 함수)의 개요와 3대장 비교\n- 일반 `GROUP BY`만으로는 소그룹별 집계와 전체 합계를 한 번에 구하기 위해 `UNION ALL`로 같은 테이블을 여러 번 읽어야 했다.\n- **`ROLLUP`**, **`CUBE`**, **`GROUPING SETS`**를 사용하면 **테이블을 딱 한 번만 읽으면서 원하는 레벨의 소계(Subtotal)와 총계(Grand Total)를 자동으로 생성**해 준다!\n\n| 그룹 함수 (인자 2개 `A, B` 기준) | 생성되는 소계·총계 그룹 조합 | 총 그룹 개수 공식 | 순서 영향 여부 |\n| :---: | :--- | :---: | :---: |\n| **`ROLLUP(A, B)`**<br>*(계층적 소계)* | ① `(A, B)` 그룹별 소계<br>② `(A)` 단독 소계<br>③ `()` 전체 총계 | **$N + 1$ 개**<br>*(2 + 1 = 3개)* | **순서 중요!**<br>`ROLLUP(A,B)` ≠ `ROLLUP(B,A)` |\n| **`CUBE(A, B)`**<br>*(다차원 모든 조합 소계)* | ① `(A, B)` 그룹별 소계<br>② `(A)` 단독 소계<br>③ **`(B)` 단독 소계 (추가!)**<br>④ `()` 전체 총계 | **$2^N$ 개**<br>*(2² = 4개)* | **순서 무관!**<br>`CUBE(A,B)` = `CUBE(B,A)` |\n| **`GROUPING SETS(A, B)`**<br>*(지정한 항목만 개별 소계)* | ① `(A)` 단독 소계<br>② `(B)` 단독 소계<br>*(전체 총계는 `()`를 명시할 때만 출력!)* | **인자 개수만큼**<br>*(2개)* | **순서 무관!** |\n\n> 💡 **[핵심 필수 암기]**\n> **시험에서 가장 많이 나오는 `UNION ALL` 치환 및 동치 관계 공식!**:\n> 1. **`GROUP BY ROLLUP(A, B)`** ≡ **`GROUP BY GROUPING SETS((A, B), (A), ())`**\n> 2. **`GROUP BY CUBE(A, B)`** ≡ **`GROUP BY GROUPING SETS((A, B), (A), (B), ())`**\n> 3. **`GROUP BY A, ROLLUP(B)`** *(부분 ROLLUP)*: `A`는 고정되어 있으므로 **전체 총계 `()`가 나오지 않는다!** ➔ **`(A, B)` 소계 + `(A)` 소계** (총 2가지 그룹만 생성!)\n> 4. **`GROUP BY ROLLUP((A, B))`** *(괄호로 묶은 결합 컬럼)*: `(A, B)`를 하나의 덩어리로 취급하므로 중간 단계인 `(A)` 소계가 생략되고 **`(A, B)` 소계 + `()` 전체 총계**만 나온다!\n\n![데이터 분석용 그룹 함수(ROLLUP, CUBE, GROUPING SETS) 개요](images/p060_img02.png)\n\n![일반 GROUP BY와 ROLLUP 수행 결과 비교](images/p060_img03.png)\n\n---\n\n### 📌 2. `ROLLUP` 함수와 **`GROUPING(컬럼)`** 함수 완벽 이해\n- **`ROLLUP(A, B)`의 특징**:\n  - 인자의 **순서가 바뀌면 결과도 완전히 달라진다!** (`ROLLUP(A, B)`는 `A`별 소계를 구하지만, `ROLLUP(B, A)`는 `B`별 소계를 구함 — 비대칭적!).\n  - `N`개의 인자를 지정하면 총 **`N + 1`개**의 그룹핑 조합이 생성된다.\n- **`GROUPING(컬럼)` 함수 (★`1`인지 `0`인지 헷갈리면 틀리는 단골 문제!)**:\n  - 소계나 총계 행이 생성될 때, 집계 대상에서 제외되어 묶인 컬럼 자리는 결과 테이블에 **`NULL`**로 표시된다.\n  - 이때 이 `NULL`이 **원래 테이블에 들어있던 진짜 `NULL` 데이터(`0`)**인지, 아니면 **소계/총계를 내기 위해 시스템이 만든 가짜 `NULL`(`1`)**인지 구분해주는 함수가 **`GROUPING(컬럼)`**이다!\n  - **`GROUPING(컬럼) = 1`**: 해당 컬럼이 소계/총계 계산을 위해 **집계되어 `NULL`로 표시된 행**일 때 **`1`** 반환! (주로 `CASE WHEN GROUPING(DNAME) = 1 THEN '전체합계' ELSE DNAME END` 형태로 소계 이름표를 붙일 때 사용!)\n  - **`GROUPING(컬럼) = 0`**: 일반 그룹화 행(실제 데이터 값 또는 원래 데이터의 진짜 `NULL`)일 때 **`0`** 반환!\n\n![ROLLUP(DNAME, JOB) 실행 쿼리 및 계층적 소계/총계 결과](images/p061_img01.png)\n\n![GROUPING 함수를 활용하여 소계·총계 행 여부를 판별(0 vs 1)한 결과](images/p061_img02.png)\n\n![CASE 표현과 GROUPING 함수를 결합하여 'All Departments', 'All Jobs' 라벨을 출력한 결과](images/p061_img03.png)\n\n![부분 ROLLUP (GROUP BY DNAME, ROLLUP(JOB))과 일반 ROLLUP의 결과 행 차이 비교 1](images/p062_img01.png)\n\n![결합 컬럼 ROLLUP(DNAME, (JOB, MGR))의 수행 결과 비교 2](images/p062_img02.png)\n\n---\n\n### 📌 3. `CUBE` 함수와 `GROUPING SETS` 함수 상세 분석\n- **`CUBE(A, B)`**:\n  - 결합 가능한 **모든 값에 대하여 다차원 집계**를 생성한다 (`N`개 인자 시 **`2^N`개**의 그룹핑 조합 생성).\n  - 인자의 순서가 바뀌어도(`CUBE(A, B)` vs `CUBE(B, A)`) 정렬 순서만 다를 뿐 **결과 데이터 건수와 내용은 100% 동일**하다!\n- **`GROUPING SETS(인자1, 인자2, ...)`**:\n  - 계층 구조와 상관없이 **괄호 안에 나열한 개별 그룹핑 조건들을 각각 독립적으로 `GROUP BY` 한 뒤 `UNION ALL`로 합친 것과 완전히 동일**하다!\n  - 인자 순서를 바꿔도 결과는 동일하며, 전체 총계를 함께 보고 싶다면 인자 안에 빈 괄호 **`()`**(또는 `NULL`)를 명시적으로 추가하면 된다: `GROUPING SETS(DNAME, JOB, ())`.\n\n![CUBE(DNAME, JOB) 쿼리 및 2^2 = 4가지 다차원 소계 결과](images/p063_img01.png)\n\n![CUBE 결과를 UNION ALL 쿼리로 동일하게 풀어쓴 예시](images/p063_img02.png)\n\n![일반 GROUP BY를 UNION ALL로 결합한 쿼리](images/p063_img03.png)\n\n![GROUPING SETS(DNAME, JOB)로 간결하게 작성한 쿼리 및 결과](images/p063_img04.png)\n\n![GROUPING SETS에 전체 총계 ()를 추가한 예시 1](images/p064_img01.png)\n\n![3개 컬럼에 대한 GROUPING SETS 조합 예시 2](images/p064_img02.png)\n\n![GROUPING SETS((DNAME, JOB, MGR), (DNAME, JOB), (JOB, MGR)) 복합 조합 실행 결과](images/p064_img03.png)\n\n![ROLLUP, CUBE, GROUPING SETS 변환 연습 예제 1](images/p065_img01.png)\n\n![ROLLUP, CUBE, GROUPING SETS 변환 연습 결과 2](images/p065_img02.png)\n\n![ROLLUP, CUBE, GROUPING SETS 변환 연습 결과 3](images/p065_img03.png)\n\n![ROLLUP, CUBE, GROUPING SETS 변환 연습 결과 4](images/p065_img04.png)\n\n---\n\n## 🔍 STEP 2. 직관적 Before & After 비교 & 실전 SQL 트레이스\n\n### 🔄 [Before & After] ROLLUP vs CUBE 비교\n\nEMP 3행(D1·D2 부서, A·B 직무)을 부서/직무로 집계. 같은 데이터를 일반 GROUP BY, ROLLUP, CUBE에 차례로 넣어 어디까지 소계가 추가되는지 비교. 핵심은 \"부서 소계만 필요한가, 직무 소계까지 필요한가\".\n\n### EMP\n\n| DEPT_ID | JOB | SAL |\n|---|---|---|\n| D1 | A | 1000 |\n| D1 | B | 2000 |\n| D2 | A | 3000 |\n\n### `GROUP BY (DEPT, JOB)` — 기본\n\n| D | J | SUM |\n|---|---|---|\n| D1 | A | 1000 |\n| D1 | B | 2000 |\n| D2 | A | 3000 |\n\n### `ROLLUP(DEPT, JOB)`\n\n| D | J | SUM |\n|---|---|---|\n| D1 | A | 1000 |\n| D1 | B | 2000 |\n| D1 | NULL | 3000 |\n| D2 | A | 3000 |\n| D2 | NULL | 3000 |\n| NULL | NULL | 6000 |\n\n### `CUBE(DEPT, JOB)` 추가 행\n\n| NULL | A | 4000 |\n| NULL | B | 2000 |\n\n기본 GROUP BY는 (DEPT, JOB) 조합 1단계만, ROLLUP(DEPT, JOB)은 (DEPT, JOB) → (DEPT) → ()로 왼쪽부터 한 칸씩 떼어내며 소계를 쌓는다(N+1단계). CUBE(DEPT, JOB)는 거기에 더해 (JOB) 단독 소계까지 만들어 모든 조합 2^N단계를 채운다. 부서 단위 소계만 필요하면 ROLLUP으로 충분하지만, 직무별 가로 합계까지 한 번에 보고 싶다면 CUBE가 정답. 특정 조합만 골라 뽑고 싶다면 GROUPING SETS.\n\n### 💻 [SQL 실전 트레이스]\n\n### ROLLUP — 계층적 소계\n\n```sql\nSELECT  DEPT_ID, JOB, SUM(SAL)\nFROM    EMP\nGROUP BY ROLLUP(DEPT_ID, JOB);\n```\n\n### 결과 — 4단계(부서+직무, 부서, 전체)\n\n| DEPT_ID | JOB | SUM(SAL) |\n|---|---|---|\n| D1 | MGR | 5000 |\n| D1 | CLERK | 2000 |\n| D1 | NULL | 7000 (D1 소계) |\n| D2 | MGR | 4500 |\n| D2 | NULL | 4500 (D2 소계) |\n| NULL | NULL | 11500 (전체 합계) |\n\nROLLUP(A, B): A → A+B 로 갈수록 세분화, 위로 갈수록 소계\n\n---\n\n### CUBE — 모든 조합\n\n```sql\nSELECT  DEPT_ID, JOB, SUM(SAL)\nFROM    EMP\nGROUP BY CUBE(DEPT_ID, JOB);\n```\n\n### 결과 — ROLLUP 결과 + JOB별 합계까지\n\n| DEPT_ID | JOB | SUM(SAL) |\n|---|---|---|\n| D1 | MGR | 5000 |\n| D1 | CLERK | 2000 |\n| D1 | NULL | 7000 |\n| D2 | MGR | 4500 |\n| D2 | NULL | 4500 |\n| NULL | MGR | 9500 (MGR 합계, CUBE만 추가) |\n| NULL | CLERK | 2000 (CLERK 합계) |\n| NULL | NULL | 11500 |\n\nN 개 컬럼 CUBE = 2^N 가지 조합\n\n---\n\n### GROUPING SETS — 골라 보기\n\n```sql\nSELECT  DEPT_ID, JOB, SUM(SAL)\nFROM    EMP\nGROUP BY GROUPING SETS((DEPT_ID), (JOB), ());\n```\n\n### 결과 — 부서별, 직무별, 전체\n\n| DEPT_ID | JOB | SUM(SAL) |\n|---|---|---|\n| D1 | NULL | 7000 |\n| D2 | NULL | 4500 |\n| NULL | MGR | 9500 |\n| NULL | CLERK | 2000 |\n| NULL | NULL | 11500 |\n\n---\n\n## 🚨 STEP 3. 출제위원 단골 함정 O/X & 노랭이·기출 문항별 족보\n\n### ⚠️ 시험장 단골 함정 vs 정답 1:1 대조표\n\n| 함정 | 정답 |\n|---|---|\n| ROLLUP(A, B) 결과 단계 | (A, B), (A), () |\n| CUBE(A, B) 결과 단계 | (A, B), (A), (B), () |\n| 그룹함수에서 NULL 행의 의미 | 소계 행 또는 원래 NULL |\n| GROUPING 함수 결과가 1이면 | 소계 행 |\n| CUBE의 조합 수 | 2^N (N=컬럼수) |\n| 소계 NULL과 데이터 NULL 구분 | GROUPING 함수 사용 |\n\n단골 함정: ROLLUP(A, B, C) 의 단계 수는 N+1 = 4단계, CUBE 는 2^N = 8단계. 행을 합치는 그룹 함수와 달리, 행을 그대로 두고 옆에 통계를 붙이는 도구는 **윈도우 함수**, 행을 컬럼으로 펼치는 도구는 **PIVOT**.\n\n### 📒 이 단원과 직결된 『SQL 자격검정 실전문제(노랭이)』 & 기출 킬러 족보\n\n- **[노랭이 2과목 108·109번 ★중요체크]** ① 일반 그룹 함수(`GROUP BY` + `UNION ALL`)로 `ROLLUP`, `CUBE`, `GROUPING SETS` 셋 모두와 100% 동일한 결과를 추출할 수 있다. ② 그룹핑 함수들의 집계 대상 칼럼 중 소계/총계로 집계된 칼럼 외의 대상 칼럼 자리는 `NULL` 값을 반환하며, 이를 구분하기 위해 `GROUPING()` 함수를 사용한다.\n- **[21회 기출 단답형 4번]** `DNAME`(3종류), `JOB`(5종류), `DNAME+JOB` 조합(9종류)일 때 `GROUP BY CUBE(DNAME, JOB)`의 전체 결과 행 수는 `전체 총계(1) + DNAME별(3) + JOB별(5) + DNAME+JOB 조합(9) = 총 18개`이다!\n\n---\n\n## ✍️ STEP 4. 실전 적중! 단원 마무리 확인 문제\n\n<div class=\"sqld-quiz-box\" data-answer=\"3\">\n\n**Q. [2-2-3 대표 적중 문제]** 다음 중 아래의 `[원본 SQL]`과 **항상 동일한 결과 집합(행 구성)**을 반환하는 SQL 문은?\n```sql\n-- [원본 SQL]\nSELECT DEPTNO, JOB, Mgr, SUM(SAL)\nFROM EMP\nGROUP BY DEPTNO, ROLLUP(JOB, Mgr);\n```\n\n- ① `SELECT DEPTNO, JOB, Mgr, SUM(SAL) FROM EMP GROUP BY ROLLUP(DEPTNO, JOB, Mgr);`\n- ② `SELECT DEPTNO, JOB, Mgr, SUM(SAL) FROM EMP GROUP BY GROUPING SETS ((DEPTNO, JOB, Mgr), (DEPTNO, JOB), (DEPTNO), ());`\n- ③ `SELECT DEPTNO, JOB, Mgr, SUM(SAL) FROM EMP GROUP BY GROUPING SETS ((DEPTNO, JOB, Mgr), (DEPTNO, JOB), (DEPTNO));`\n- ④ `SELECT DEPTNO, JOB, Mgr, SUM(SAL) FROM EMP GROUP BY DEPTNO, ROLLUP((JOB, Mgr));`\n\n<details>\n<summary>💡 <b>정답 및 시나공·과외노트식 보기별 완벽 해설 확인하기 (클릭)</b></summary>\n\n**정답: ③**\n- **해설**: `GROUP BY DEPTNO, ROLLUP(JOB, Mgr)`는 `DEPTNO`가 바깥에 고정되어 있고 `ROLLUP(JOB, Mgr)`가 `{(JOB, Mgr), (JOB), ()}` 3가지를 만들어내므로, 분배법칙처럼 결합하면 **`(DEPTNO, JOB, Mgr)`, `(DEPTNO, JOB)`, `(DEPTNO)` 총 3가지 그룹 조합**이 생성됩니다 (전체 총계 `()`는 나오지 않음!). 따라서 이를 `GROUPING SETS`로 풀어쓴 **③번**이 정답입니다.\n- 참고로 ④번처럼 안쪽에 괄호를 두 번 친 `ROLLUP((JOB, Mgr))`는 `(JOB, Mgr)`를 한 덩어리로 묶어 `{(DEPTNO, JOB, Mgr), (DEPTNO)}` 2가지만 출력합니다.\n\n</details>\n</div>\n\n---\n\n## ⏱️ STEP 5. 시험장 입실 직전 30초 최종 요약 카드\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · ROLLUP(A, B) = (A,B) → (A) → () — **N+1 단계** (계층적 소계)\n> · CUBE(A, B) = (A,B) → (A) → (B) → () — **2^N 단계** (모든 조합)\n> · GROUPING SETS = 원하는 조합만 골라 (유연)\n> · GROUPING(컬럼) = **1 이면 소계 행** / 0 이면 일반 행\n> · 결과의 NULL 이 데이터인지 소계인지 → **GROUPING 함수로 구분**\n> · \"ROLLUP 시작 위치만 다름\" 함정 — `ROLLUP(A,B)` ≠ `ROLLUP(B,A)` (단계 다름)"}, {"id": "ch-22", "index": 22, "title": "2-2-4. 윈도우 함수(Window Function)", "subj_id": "tab3", "subj_name": "2과목 2장 · SQL 활용", "badge": "2과목 2장 · SQL 활용", "md": "# 2-2-4. 윈도우 함수(Window Function)\n\n> **단원 분류**: `2과목` > `2-2. SQL 활용` > **`2-2-4. 윈도우 함수`**\n> **🎯 출제 빈도**: `★★★★★ (매회 2~3문항 100% 출제!)` &nbsp;|&nbsp; **🧠 두문자 암기 공식**: `순위: RANK(1,2,2,4) / DENSE_RANK(1,2,2,3) / ROW_NUMBER(1,2,3,4) | ORDER BY 넣는 순간 기본 프레임 = RANGE UNBOUNDED PRECEDING (누적합!)`\n\n## 🎯 과외선배의 1분 브리핑 & 핵심 구조도\n\n> [!TIP]\n> **👨‍🏫 1:1 과외선배의 학습 코칭 (`유선배 과외노트` 스타일)**\n> 윈도우 함수에서 꼭 잡아야 할 핵심 3가지: ① **윈도우 함수는 `GROUP BY`와 달리 원래 테이블의 전체 행 건수를 절대 줄이지 않는다!** ② `SUM(SAL) OVER(ORDER BY SAL)`처럼 `OVER` 절 안에 **`ORDER BY`를 적는 순간 기본 윈도우 프레임이 첫 행부터 현재 행까지의 누적(`RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW`)으로 바뀐다!** ③ **`LAG(컬럼, N, 기본값)`은 이전 행**, **`LEAD(컬럼, N, 기본값)`은 다음 행**, **`PERCENT_RANK`는 `(순위-1)/(전체건수-1)`(양 끝값 `0`과 `1`)**, **`CUME_DIST`는 `(누적건수)/(전체건수)`(`1/N` ~ `1`)**입니다!\n\n> 윈도우 함수는 행을 합치지 않으면서, 행마다 **그룹**별 통계나 순위를 옆에 붙여주는 함수다(분석 함수라고도 한다).\n\nex) 학생 명단을 GROUP BY로 묶으면 학년 평균만 남아 개별 정보가 사라지지만, 윈도우 함수는 학생 행은 그대로 두고 옆에 학년 평균/등수를 추가한다.\n\n### 🗺️ 한눈에 보는 핵심 구조도: 일반 집계 vs 윈도우 함수\n\n| 일반 집계 (GROUP BY) | 윈도우 함수 (OVER) |\n|---|---|\n| 행이 그룹별로 **합쳐짐** | 행은 **그대로 유지** + 옆에 분석값 |\n| 결과 1행 | 결과 N행 (원본과 같음) |\n| AVG = 4000 | NAME · SAL · RANK · AVG 모두 보임 |\n\n윈도우 함수 결과 예시 (`AVG(SAL) OVER ()` + `RANK()`):\n\n| NAME | SAL | RANK | AVG |\n|---|---|---|---|\n| 김 | 3000 | 3 | 4000 |\n| 이 | 5000 | 1 | 4000 |\n| 박 | 4000 | 2 | 4000 |\n\n```\n[원본 행]  ──OVER 절로 윈도우 정의──→  [행 그대로 유지 + 옆에 분석값 추가]\n```\n\n---\n\n## 📘 STEP 1. 시험 출제 핵심 이론 & 강의 도표 완벽 정복\n\n### 📌 1. 윈도우 함수(분석 함수, Analytic Function)의 개념과 기본 문법 구조\n- **윈도우 함수의 핵심 특징**:\n  - 일반 `GROUP BY` 집계 함수는 여러 행을 하나로 합쳐서 **전체 행의 개수가 줄어들지만**,\n  - **윈도우 함수(`OVER(...)`)는 원래 테이블의 개별 행(Row)들을 그대로 유지하면서(행 수가 줄어들지 않음!)** 각 행 옆에 그룹별 순위, 합계, 평균, 누적값, 이전/다음 행 값 등을 함께 보여준다!\n  - ⚠️ **주의**: 윈도우 함수는 다른 윈도우 함수 안에 **중첩해서 사용할 수 없으며**(`SUM(RANK() OVER(...)) OVER(...)` ➔ 에러!), 서브쿼리에서도 사용 가능하지만 `WHERE`, `GROUP BY`, `HAVING` 절에는 쓸 수 없고 **`SELECT` 절과 `ORDER BY` 절에서만 사용 가능**하다!\n\n```sql\nSELECT 윈도우함수(인자) OVER (\n           [PARTITION BY 칼럼]                 -- 1. 소그룹 분할 기준 (생략 시 전체 행이 하나의 파티션)\n           [ORDER BY 칼럼 ASC|DESC]            -- 2. 파티션 내 정렬 기준\n           [ROWS | RANGE BETWEEN A AND B]      -- 3. 연산 범위(Windowing Frame) 지정\n       )\n  FROM 테이블명;\n```\n\n![윈도우 함수의 분류 체계 (순위, 집계, 행 순서, 비율 함수) 및 기본 구문](images/p066_img01.png)\n\n---\n\n### 📌 2. 윈도우 프레임(Windowing 절): `ROWS` vs `RANGE`의 결정적 차이 (★킬러 문항!)\n\n> 💡 **[핵심 필수 암기]**\n> **윈도우 프레임 지정 키워드 의미**:\n> - **`UNBOUNDED PRECEDING`**: 파티션의 **맨 첫 번째 행(시작점)**부터\n> - **`n PRECEDING`**: 현재 행 기준 **`n`건 앞(위)의 행**(또는 값 차이가 `n` 이하인 범위)부터\n> - **`CURRENT ROW`**: **현재 행**까지\n> - **`n FOLLOWING`**: 현재 행 기준 **`n`건 뒤(아래)의 행**(또는 값 차이가 `n` 이하인 범위)까지\n> - **`UNBOUNDED FOLLOWING`**: 파티션의 **맨 마지막 행(끝점)**까지\n>\n> **🔥 시험에 무조건 나오는 3가지 핵심 암기 규칙!**:\n> 1. **`OVER()` 안에 `ORDER BY`를 생략했을 때**: 파티션 **전체 행**(`UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING`)의 총합/평균을 구한다!\n> 2. **`OVER()` 안에 `ORDER BY`를 쓰는 순간! (프레임 절 생략 시 기본값)**:\n>    - 자동으로 기본 프레임인 **`RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW` (첫 행부터 현재 행까지의 누적값!)**가 적용된다!\n> 3. **동점자(같은 값)가 있을 때 `ROWS` vs `RANGE`의 차이**:\n>    - **`ROWS` (물리적 행 단위)**: 값이 같든 다르든 **무조건 한 줄씩 물리적인 행 순서대로** 따로따로 누적한다! (예: 급여가 `1000, 1000`인 두 사원이 있으면 첫 번째는 `1000`, 두 번째는 `2000`이 됨)\n>    - **`RANGE` (논리적 값 범위 단위, 기본값!)**: `ORDER BY` 기준 컬럼의 **값이 같으면(동점자이면) 같은 범위로 묶어서 한꺼번에 합산**한다! (예: 급여가 `1000, 1000`인 두 사원이 있으면 **첫 번째 사원 행에서도 이미 두 명을 합친 `2000`이 찍히고, 두 번째 사원 행에서도 `2000`**이 찍힌다!)\n\n![윈도우 프레임(ROWS / RANGE, UNBOUNDED PRECEDING / FOLLOWING, CURRENT ROW) 구조 도식](images/p066_img02.png)\n\n![일반 집계 함수 OVER(PARTITION BY ...) 수행 예시](images/p066_img03.png)\n\n![OVER 절 내 ORDER BY 유무에 따른 전체 합계 vs 누적 합계 비교](images/p066_img04.png)\n\n![윈도우 집계 함수(SUM, MAX, MIN, AVG, COUNT) 실행 예시 1](images/p067_img01.png)\n\n![RANGE BETWEEN 숫자 PRECEDING AND 숫자 FOLLOWING 범위 지정 쿼리](images/p067_img02.png)\n\n![윈도우 집계 함수 파티션별 MAX/MIN/AVG 비교 예시 2](images/p067_img03.png)\n\n![윈도우 집계 함수 누적 평균(ROWS BETWEEN) 실행 결과 3](images/p067_img04.png)\n\n![윈도우 집계 함수 조건 필터링 결합 예시 1](images/p068_img01.png)\n\n![윈도우 집계 함수 범위(RANGE) 연산 실행 결과 2](images/p068_img02.png)\n\n---\n\n### 📌 3. 그룹 내 순위 함수 3대장 (`RANK`, `DENSE_RANK`, `ROW_NUMBER`)\n\n| 순위 함수 | 동점자(같은 값) 처리 방식 | 동점자 다음 순위 | 예시 (`SAL`이 `5000, 3000, 3000, 2000`일 때) |\n| :--- | :---: | :---: | :---: |\n| **`RANK() OVER(ORDER BY ...)`** | 동점자에게 **같은 순위** 부여 | 동점자 수만큼 **건너뛰고** 다음 순위 부여 (올림픽 방식) | **`1등 ➔ 2등 ➔ 2등 ➔ 4등`** (`3등` 없음!) |\n| **`DENSE_RANK() OVER(ORDER BY ...)`** | 동점자에게 **같은 순위** 부여 | 건너뛰지 않고 **바로 다음 순위(+1)** 부여 (빽빽한 순위) | **`1등 ➔ 2등 ➔ 2등 ➔ 3등`** |\n| **`ROW_NUMBER() OVER(ORDER BY ...)`** | 동점자여도 **무조건 서로 다른 고유 순번** 부여 | 순서대로 1씩 증가 | **`1등 ➔ 2등 ➔ 3등 ➔ 4등`** |\n\n- *(참고: 일반 집계형 함수인 **`RANK(특정값) WITHIN GROUP (ORDER BY 컬럼)`**은 전체 행 중에서 해당 `특정값`이 몇 등인지를 숫자 하나로 반환한다!)*\n\n![RANK, DENSE_RANK, ROW_NUMBER 3대 순위 함수 동시 비교 결과](images/p068_img03.png)\n\n![PARTITION BY와 결합한 순위 함수 실행 쿼리 및 결과 1](images/p069_img01.png)\n\n![PARTITION BY와 결합한 순위 함수 실행 결과 테이블 1](images/p069_img02.png)\n\n![DENSE_RANK 단독 실행 쿼리 예시 2](images/p069_img03.png)\n\n![DENSE_RANK 실행 결과 테이블 2](images/p069_img04.png)\n\n![ROW_NUMBER 단독 실행 쿼리 예시 3](images/p069_img05.png)\n\n![ROW_NUMBER 실행 결과 테이블 3](images/p069_img06.png)\n\n![일반 함수 RANK(값) WITHIN GROUP (ORDER BY ...) 예시](images/p069_img07.png)\n\n![집계 함수를 활용한 순위 및 건수 비교](images/p069_img08.png)\n\n---\n\n### 📌 4. 그룹 내 행 순서 함수 (`FIRST_VALUE`, `LAST_VALUE`, `LAG`, `LEAD`) (PDF p.70, p.73)\n\n| 행 순서 함수 | 의미 및 문법 | 시험 핵심 포인트 및 주의사항 |\n| :--- | :--- | :--- |\n| **`FIRST_VALUE(컬럼) OVER(...)`** | 파티션(윈도우) 내에서 **가장 첫 번째 행의 값**을 반환 | `MIN`/`MAX`와 달리 정렬 기준 컬럼이 아닌 다른 컬럼(예: 급여 1등의 `사원이름`)을 바로 가져올 수 있음! (동점자 시 공동 처리가 안 되므로 2차 정렬 기준 지정 권장) |\n| **`LAST_VALUE(컬럼) OVER(...)`** | 파티션(윈도우) 내에서 **가장 마지막 행의 값**을 반환 | ⚠️ **초특급 함정**: `OVER(ORDER BY SAL)`만 쓰면 기본 프레임이 `UNBOUNDED PRECEDING AND CURRENT ROW`(현재 행까지!)이므로 **`LAST_VALUE`를 써도 파티션 끝값이 아니라 '자기 자신(현재 행)'의 값이 나온다!** 진짜 파티션 마지막 행 값을 얻으려면 반드시 **`ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING`**을 명시해야 한다! |\n| **`LAG(컬럼 [, n, 기본값]) OVER(ORDER BY ...)`** | 현재 행보다 **`n`칸 이전(위쪽) 행의 값**을 가져옴 | `n` 생략 시 기본값은 **`1`** (바로 이전 행). 이전 행이 없을 때(첫 번째 행) `기본값` 생략 시 **`NULL`** 반환, `기본값` 지정 시 해당 값 반환 (`NVL` 효과 내장!). |\n| **`LEAD(컬럼 [, n, 기본값]) OVER(ORDER BY ...)`** | 현재 행보다 **`n`칸 이후(아래쪽) 행의 값**을 가져옴 | `n` 생략 시 기본값은 **`1`** (바로 다음 행). 다음 행이 없을 때(마지막 행) `기본값` 생략 시 **`NULL`** 반환. |\n\n---\n\n### 📌 5. 그룹 내 비율 함수 (`RATIO_TO_REPORT`, `PERCENT_RANK`, `CUME_DIST`, `NTILE`) (PDF p.70, p.73 ~ p.74)\n\n> 💡 **[핵심 필수 암기]**\n> **비율 함수 4대장 계산 공식 완벽 암기! (소수점 값 직접 계산 문제 빈출!)**\n\n| 비율 함수 | 의미 | 정확한 수학적 계산 공식 | 값의 범위 |\n| :--- | :--- | :--- | :---: |\n| **`RATIO_TO_REPORT(컬럼) OVER(...)`** | 파티션 내 `컬럼` 전체 합계 중에서 현재 행의 값이 차지하는 **비율(점유율)** *(주의: `OVER()` 안에 `ORDER BY` 사용 불가!)* | $$\frac{\text{현재 행의 값}}{\text{파티션 전체 합계 (SUM)}}$$ | $0 < \text{값} \\le 1$<br>(전체 합 = `1`) |\n| **`PERCENT_RANK() OVER(ORDER BY ...)`** | 파티션 내 첫 번째 행을 **`0`**, 마지막 행을 **`1`**로 놓고 구간(간격) 기준으로 계산한 **백분위 순위** | $$\frac{\text{현재 행의 RANK 순위} - 1}{\text{파티션 전체 행 수} - 1}$$<br>*(단, 파티션 행이 1건뿐이면 `0`)* | **`0` 이상 `1` 이하**<br>($0 \\le \text{값} \\le 1$,<br>첫 행은 무조건 **`0`**!) |\n| **`CUME_DIST() OVER(ORDER BY ...)`** | 파티션 전체 건수 중에서 현재 행의 값보다 **작거나 같은(동점자 포함!) 건수의 누적 백분율** | $$\frac{\text{현재 행 이하(동점 포함)의 누적 행 수}}{\text{파티션 전체 행 수}}$$ | **`0` 초과 `1` 이하**<br>($0 < \text{값} \\le 1$,<br>마지막 행은 무조건 **`1`**!) |\n| **`NTILE(n) OVER(ORDER BY ...)`** | 파티션 전체 행을 `n`개의 조(버킷, Bucket)로 등분하여 각 행에 `1`부터 `n`까지의 조 번호 부여 | **⚠️ 남는 행(나머지) 배분 규칙**: 전체 10건을 `NTILE(4)`로 나누면 몫이 `2`이고 나머지가 `2`이다. 이때 **나머지 2건은 무조건 `1`번 조부터 순서대로 1건씩 추가로 더 배정**한다! ➔ 결과 조별 인원수: **1조(3명), 2조(3명), 3조(2명), 4조(2명)**! | `1` ~ `n` 정수 |\n\n![NTILE 및 비율 함수 개념 요약 1](images/p070_img01.png)\n\n![NTILE(4) 14건 분할 시 몫(3)과 나머지(2)가 앞 조(1, 2조)에 4건씩 배정되는 도식](images/p070_img02.png)\n\n![FIRST_VALUE 실행 쿼리 예시 1](images/p070_img03.png)\n\n![FIRST_VALUE 다중 정렬 기준 쿼리 예시 2](images/p070_img04.png)\n\n![LAST_VALUE 실행 쿼리 예시](images/p070_img05.png)\n\n![LAG 함수 실행 쿼리 예시](images/p070_img06.png)\n\n![LAG / LEAD 및 Top-N 연계 실행 결과](images/p070_img07.png)\n\n![FIRST_VALUE와 LAST_VALUE 실행 쿼리 및 결과 비교](images/p073_img01.png)\n\n![LAG와 LEAD 함수 실행 쿼리 및 인자 설명](images/p073_img02.png)\n\n![LAG와 LEAD 함수 실행 결과 테이블](images/p073_img03.png)\n\n![RATIO_TO_REPORT 함수 실행 쿼리](images/p073_img04.png)\n\n![PERCENT_RANK 함수 실행 쿼리](images/p073_img05.png)\n\n![RATIO_TO_REPORT와 PERCENT_RANK 실행 결과 수치 비교](images/p073_img06.png)\n\n![CUME_DIST와 NTILE 실행 쿼리](images/p074_img01.png)\n\n![CUME_DIST와 NTILE 실행 결과 수치 비교](images/p074_img02.png)\n\n---\n\n## 🔍 STEP 2. 직관적 Before & After 비교 & 실전 SQL 트레이스\n\n### 🔄 [Before & After] 직관적 비교\n\nD1·D2 두 부서 4명에 대해 \"부서 안에서의 등수\"와 \"부서 평균\"을 동시에 한 표에 보여줘야 하는 상황. GROUP BY로 묶으면 4행이 2행으로 줄어 개별 이름이 사라지지만, 윈도우 함수는 4행을 그대로 유지하면서 옆에 부서별 RANK와 부서 AVG를 붙인다. D2의 박·최가 4500으로 동률일 때 RANK가 어떻게 매겨지는지도 함께.\n\n### EMP\n\n| NAME | DEPT_ID | SAL |\n|---|---|---|\n| 김 | D1 | 3000 |\n| 이 | D1 | 5000 |\n| 박 | D2 | 4500 |\n| 최 | D2 | 4500 |\n\n### 쿼리\n\n```sql\nSELECT  NAME, DEPT_ID, SAL,\n        RANK() OVER (PARTITION BY DEPT_ID ORDER BY SAL DESC) AS DEPT_RANK,\n        AVG(SAL) OVER (PARTITION BY DEPT_ID) AS DEPT_AVG\nFROM    EMP;\n```\n\n| NAME | DEPT_ID | SAL | DEPT_RANK | DEPT_AVG |\n|---|---|---|---|---|\n| 이 | D1 | 5000 | 1 | 4000 |\n| 김 | D1 | 3000 | 2 | 4000 |\n| 박 | D2 | 4500 | 1 | 4500 |\n| 최 | D2 | 4500 | 1 | 4500 |\n\nPARTITION BY DEPT_ID가 D1·D2를 각각 독립된 윈도우로 나누기 때문에 RANK와 AVG가 부서별로 따로 계산된다. D2의 박·최가 둘 다 RANK 1을 받는 이유는 RANK()가 동률을 같은 등수로 처리하기 때문이고(다음 등수는 3으로 건너뜀), AVG도 부서 안 두 명만으로 계산해 4500이 된다. 행을 합치지 않고 옆에 통계를 붙이는 윈도우 함수의 본질 — 같은 부서 두 명의 SAL이 그대로 보이면서 평균·등수가 함께 따라붙는다.\n\n### 💻 [SQL 실전 트레이스]\n\n### 순위 함수\n\n| 함수 | 동점 처리 | 다음 순위 |\n|---|---|---|\n| RANK() | 같은 등수 | 건너뜀 (1, 1, 3) |\n| DENSE_RANK() | 같은 등수 | 연속 (1, 1, 2) |\n| ROW_NUMBER() | 무조건 다른 등수 | (1, 2, 3) |\n\n```sql\nSELECT  NAME, SAL,\n        RANK()       OVER (ORDER BY SAL DESC) AS R,\n        DENSE_RANK() OVER (ORDER BY SAL DESC) AS DR,\n        ROW_NUMBER() OVER (ORDER BY SAL DESC) AS RN\nFROM    EMP;\n```\n\n| NAME | SAL | R | DR | RN |\n|---|---|---|---|---|\n| 이 | 5000 | 1 | 1 | 1 |\n| 박 | 5000 | 1 | 1 | 2 |\n| 최 | 4500 | 3 | 2 | 3 |\n| 김 | 3000 | 4 | 3 | 4 |\n\n---\n\n### 집계 윈도우 함수\n\n| 함수 | 의미 |\n|---|---|\n| SUM/AVG/MAX/MIN/COUNT | 행 옆에 그룹 통계 |\n\n```sql\n-- 부서별 평균 급여를 옆에 붙임\nSELECT  NAME, DEPT_ID, SAL,\n        AVG(SAL) OVER (PARTITION BY DEPT_ID) AS DEPT_AVG\nFROM    EMP;\n```\n\n| NAME | DEPT_ID | SAL | DEPT_AVG |\n|---|---|---|---|\n| 김 | D1 | 3000 | 4000 |\n| 이 | D1 | 5000 | 4000 |\n| 박 | D2 | 4000 | 4000 |\n| 최 | D2 | 4000 | 4000 |\n\n---\n\n### 행 순서 함수\n\n| 함수 | 의미 |\n|---|---|\n| LAG(col, n) | n행 전 값(앞 행) |\n| LEAD(col, n) | n행 후 값(뒷 행) |\n| FIRST_VALUE(col) | 윈도우의 첫 값 |\n| LAST_VALUE(col) | 윈도우의 마지막 값 |\n\n```sql\nSELECT  NAME, HIRE_DATE,\n        LAG(NAME)  OVER (ORDER BY HIRE_DATE) AS PREV_EMP,\n        LEAD(NAME) OVER (ORDER BY HIRE_DATE) AS NEXT_EMP\nFROM    EMP;\n```\n\n---\n\n### 비율 함수\n\n| 함수 | 의미 |\n|---|---|\n| CUME_DIST() | 누적 비율 |\n| PERCENT_RANK() | 백분위 순위 |\n| NTILE(N) | N등분 그룹 |\n| RATIO_TO_REPORT(col) | 전체 합 대비 비율(Oracle) |\n\n```sql\n-- 4등분으로 나눠서 그룹 번호 부여\nSELECT NAME, SAL, NTILE(4) OVER (ORDER BY SAL DESC) AS QUARTILE FROM EMP;\n```\n\n---\n\n### 윈도우 프레임 — ROWS / RANGE\n\n```sql\nROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW   -- 처음~현재\nROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING           -- 앞1, 자신, 뒤1\nRANGE BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING  -- 전체\n```\n\n| 키워드 | 의미 |\n|---|---|\n| UNBOUNDED PRECEDING | 그룹의 처음부터 |\n| n PRECEDING | 앞 n번째부터 |\n| CURRENT ROW | 현재 행 |\n| n FOLLOWING | 뒤 n번째까지 |\n| UNBOUNDED FOLLOWING | 그룹의 끝까지 |\n\n```sql\n-- 누적 합(running total)\nSELECT  NAME, HIRE_DATE, SAL,\n        SUM(SAL) OVER (ORDER BY HIRE_DATE\n                       ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS RUN_TOT\nFROM    EMP;\n```\n\n---\n\n## 🚨 STEP 3. 출제위원 단골 함정 O/X & 노랭이·기출 문항별 족보\n\n### ⚠️ 시험장 단골 함정 vs 정답 1:1 대조표\n\n| 함정 | 정답 |\n|---|---|\n| RANK vs DENSE_RANK vs ROW_NUMBER | RANK 건너뜀 / DENSE_RANK 연속 / ROW_NUMBER 모두 다름 |\n| `OVER ()` 빈 괄호 | 전체를 한 윈도우로 |\n| PARTITION BY 생략 | 전체 행을 하나의 그룹으로 |\n| 윈도우 함수에 WHERE 절 사용 | WHERE에 직접 못 씀 → 인라인뷰 사용 |\n| LAG/LEAD 기본 오프셋 | 1 |\n| 윈도우 함수 결과 행 수 | 원본과 동일 |\n\n단골 함정: `RANK() OVER(...)` 결과를 WHERE 에 직접 사용 불가. 서브쿼리/인라인뷰로 감싸야 함(부서별 **Top N 쿼리**도 같은 패턴).\n\n### 📒 이 단원과 직결된 『SQL 자격검정 실전문제(노랭이)』 & 기출 킬러 족보\n\n- **[노랭이 2과목 112·114·118번 ★중요체크]** ① 윈도우 함수는 결과에 대한 함수 처리이므로 **전체 결과 건수에는 영향을 주지 않는다**. ② **`LAG(인수, 몇번째이전, NULL대체값)`**에서 두 번째 인수를 생략하면 기본값은 `1`(바로 직전 행), 세 번째 인수는 이전 행이 없을 때 `NULL` 대신 출력할 값이다.\n- **[34회 기출 42번]** `GROUP BY` 절과 윈도우 함수를 한 쿼리에서 함께 쓸 수는 있지만, 이 경우 윈도우 함수는 원본 테이블 전체가 아니라 `GROUP BY`로 먼저 집약된 결과 집합 위에서 동작한다.\n\n---\n\n## ✍️ STEP 4. 실전 적중! 단원 마무리 확인 문제\n\n<div class=\"sqld-quiz-box\" data-answer=\"4\">\n\n**Q. [2-2-4 대표 적중 문제]** `EMP` 테이블에 사원 4명의 급여(`SAL`)가 `[1000, 2000, 2000, 4000]`으로 저장되어 있을 때, 다음 윈도우 함수들의 실행 결과 설명으로 **가장 부적절한** 것은?\n\n- ① `RANK() OVER(ORDER BY SAL ASC)`의 결과는 차례대로 `1, 2, 2, 4`이고, `DENSE_RANK() OVER(ORDER BY SAL ASC)`의 결과는 `1, 2, 2, 3`이다.\n- ② `SUM(SAL) OVER(ORDER BY SAL ASC ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)`의 결과는 차례대로 `1000, 3000, 5000, 9000`이다.\n- ③ `SUM(SAL) OVER(ORDER BY SAL ASC)`와 같이 윈도우 프레임(`ROWS/RANGE`)을 생략하면 기본값으로 `RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW`가 적용되어, 급여가 `2000`으로 같은 두 번째·세 번째 행 모두 합계가 `5000`으로 출력된다.\n- ④ `PERCENT_RANK() OVER(ORDER BY SAL ASC)`의 첫 번째 행(`SAL=1000`) 결과는 `0.25`이다.\n\n<details>\n<summary>💡 <b>정답 및 시나공·과외노트식 보기별 완벽 해설 확인하기 (클릭)</b></summary>\n\n**정답: ④**\n- **해설**:\n  - ④ **`PERCENT_RANK()`** 공식은 **`(구간 내 자신의 RANK 순위 - 1) / (구간 전체 행 수 - 1)`**입니다! 따라서 1등(`RANK = 1`)인 첫 번째 행은 `(1 - 1) / (4 - 1) = 0 / 3 = 0`이 됩니다! (참고로 첫 번째 행이 `1/4 = 0.25`가 나오는 함수는 누적 분포 함수인 **`CUME_DIST()`**입니다!)\n  - ②, ③ `ROWS`는 물리적 행 단위로 한 줄씩 더하므로 `1000, 3000, 5000, 9000`이 되지만, 프레임 생략 시 기본값인 `RANGE`(논리적 값 단위)는 값이 같은 `2000` 두 행을 한꺼번에 묶어 누적하므로 `1000, 5000, 5000, 9000`이 됩니다! (시험 단골 킬러 비교!)\n\n</details>\n</div>\n\n---\n\n## ⏱️ STEP 5. 시험장 입실 직전 30초 최종 요약 카드\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · 결과 행 수 = **원본과 동일** (GROUP BY 처럼 합치지 않음)\n> · 순위: **RANK** (동점 후 건너뜀: 1,1,3) / **DENSE_RANK** (연속: 1,1,2) / **ROW_NUMBER** (모두 다름)\n> · 문법: `함수() OVER (PARTITION BY ... ORDER BY ... ROWS BETWEEN ...)`\n> · PARTITION BY 생략 = **전체를 한 그룹**\n> · LAG = 앞 / LEAD = 뒤 / FIRST_VALUE / LAST_VALUE / NTILE(N)\n> · 윈도우 결과를 **WHERE 에서 직접 사용 불가** → 서브쿼리·인라인뷰로 감쌈\n> · 누적합 = `SUM(...) OVER (ORDER BY ... ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)`"}, {"id": "ch-23", "index": 23, "title": "2-2-5. Top N 쿼리", "subj_id": "tab3", "subj_name": "2과목 2장 · SQL 활용", "badge": "2과목 2장 · SQL 활용", "md": "# 2-2-5. Top N 쿼리\n\n> **단원 분류**: `2과목` > `2-2. SQL 활용` > **`2-2-5. Top N 쿼리`**\n> **🎯 출제 빈도**: `★★★★★ (매회 1문항 100% 출제!)` &nbsp;|&nbsp; **🧠 두문자 암기 공식**: `Oracle: 인라인뷰 정렬 후 바깥에서 ROWNUM <= N (`ROWNUM = 2` 나 `ROWNUM > 1`은 무조건 0건!) / ANSI: FETCH FIRST N ROWS ONLY (동점 포함은 WITH TIES)`\n\n## 🎯 과외선배의 1분 브리핑 & 핵심 구조도\n\n> [!TIP]\n> **👨‍🏫 1:1 과외선배의 학습 코칭 (`유선배 과외노트` 스타일)**\n> 오라클 `ROWNUM`의 2대 함정: ① `SELECT * FROM EMP WHERE ROWNUM <= 5 ORDER BY SAL DESC;`는 정렬하기 전에 먼저 아무거나 5건을 뽑은 뒤 그 5명끼리만 정렬하는 **오답 쿼리**입니다! 반드시 **인라인 뷰(`FROM (SELECT ... ORDER BY SAL DESC)`) 안에서 먼저 정렬한 뒤 바깥 `WHERE ROWNUM <= 5`로 잘라야** 합니다! ② `ROWNUM`은 `1`번이 만들어져야 `2`번이 부여되므로 **`WHERE ROWNUM = 2` 또는 `WHERE ROWNUM > 1`은 영원히 `0건(공집합)`**입니다!\n\n> Top N 쿼리는 상위 N개 행만 뽑는 쿼리다(예: 매출 상위 10개 상품, 최신 5건의 주문).\n\n### 🗺️ 한눈에 보는 핵심 구조도: Top N의 4가지 방법\n\n| Top N 쿼리 구현 방식 4가지 | 지원 DBMS 및 핵심 문법/특징 |\n| :---: | :--- |\n| **1. `ROWNUM` 의사 컬럼** | **Oracle 전용**: 정렬 전에 번호가 먼저 매겨지므로, 반드시 **인라인 뷰(`FROM (SELECT ... ORDER BY)`)로 먼저 정렬한 뒤 바깥에서 `ROWNUM <= N`** 조건을 걸어야 함! (`ROWNUM = 2` 단독 조건은 항상 조회 0건) |\n| **2. `FETCH FIRST N ROWS`** | **ANSI 표준 (Oracle 12c+)**: `ORDER BY ... OFFSET M ROWS FETCH FIRST N ROWS ONLY` (공동 순위 포함 시 `WITH TIES`) |\n| **3. `TOP (N)` 절** | **SQL Server 전용**: `SELECT TOP (N) [WITH TIES] 컬럼명 FROM ... ORDER BY ...` (인라인 뷰 없이 바로 정렬 후 상위 N개 추출 가능) |\n| **4. 윈도우 순위 함수** | **공통**: 인라인 뷰에서 `RANK() OVER(...)` 또는 `ROW_NUMBER() OVER(...)`를 구한 뒤 바깥에서 `<= N` 필터링 |\n\n---\n\n## 📘 STEP 1. 시험 출제 핵심 이론 & 강의 도표 완벽 정복\n\n### 📌 1. Oracle `ROWNUM`의 동작 원리와 절대 함정 2가지 (PDF p.70 ~ p.71, p.74 ~ p.75)\n- **Oracle의 슈도 컬럼(Pseudo Column, 의사 컬럼) `ROWNUM`**:\n  - 실제 디스크 테이블에 저장되어 있는 컬럼이 아니라, `WHERE` 절을 통과하여 **추출되는 결과 행에 그때그때 `1`부터 차례대로 번호를 매기는 가상 컬럼**이다.\n- **🚨 `ROWNUM`의 2대 절대 함정 (★시험 100% 출제!)**:\n  1. **`ROWNUM`은 반드시 `1`번부터 시작하는 조건만 `TRUE`가 될 수 있다!**\n     - ⭕ 가능: `WHERE ROWNUM = 1`, `WHERE ROWNUM <= 5`, `WHERE ROWNUM < 5`\n     - ❌ **불가능 (결과 무조건 0건!)**: `WHERE ROWNUM = 2`, `WHERE ROWNUM > 1`, `WHERE ROWNUM BETWEEN 2 AND 5`\n     - *(이유: 첫 번째로 읽은 행에 임시로 `ROWNUM = 1`을 부여한 뒤 `WHERE ROWNUM = 2`인지 검사하면 거짓이므로 버려진다. 첫 번째 행이 버려졌으므로 다음 행이 들어와도 또다시 `ROWNUM = 1`이 부여되고 또 버려져서 영원히 한 건도 통과하지 못한다! 만약 2번째~5번째 행을 뽑고 싶다면 **인라인 뷰 안에서 `SELECT ROWNUM AS RN`으로 별칭을 붙여 확정 지은 뒤, 바깥 메인쿼리에서 `WHERE RN BETWEEN 2 AND 5`**로 조회해야 한다!)*\n  2. **`ORDER BY`보다 `WHERE ROWNUM`이 먼저 실행된다!**\n     - 정렬된 상위 `N`건을 뽑으려면 반드시 **인라인 뷰(서브쿼리) 안에서 `ORDER BY`를 먼저 수행한 뒤**, 바깥쪽 쿼리에서 `WHERE ROWNUM <= N`으로 잘라야 한다!\n\n![ROWNUM 잘못된 사용 사례와 인라인 뷰를 이용한 올바른 Top-N 추출 비교 1](images/p071_img01.png)\n\n![ROWNUM 실행 결과 비교 1](images/p071_img02.png)\n\n![인라인 뷰 정렬 후 ROWNUM 적용 쿼리 2](images/p071_img03.png)\n\n![인라인 뷰 정렬 후 ROWNUM 실행 결과 2](images/p071_img04.png)\n\n![윈도우 순위 함수(RANK, DENSE_RANK, ROW_NUMBER)를 활용한 Top-N 추출 1](images/p071_img05.png)\n\n![윈도우 순위 함수를 활용한 Top-N 실행 결과 1](images/p071_img06.png)\n\n![윈도우 순위 함수를 활용한 Top-N 추출 2](images/p071_img07.png)\n\n![윈도우 순위 함수를 활용한 Top-N 실행 결과 2](images/p071_img08.png)\n\n---\n\n### 📌 2. ANSI 표준 `OFFSET ... FETCH` 구문 (Row Limiting Clause)과 SQL Server `TOP` (PDF p.72, p.74 ~ p.76)\n- **1) ANSI 표준 / Oracle 12c 이상 Row Limiting 절 (`ORDER BY` 바로 뒤에 작성!)**:\n  ```sql\n  SELECT ENAME, SAL\n    FROM EMP\n   ORDER BY SAL DESC\n   OFFSET 5 ROWS                          -- 앞의 5건은 건너뛰고 (6번째 행부터!) [생략 가능]\n   FETCH FIRST 3 ROWS ONLY;               -- 그다음 3건만 가져와라! (동점자 포함하려면 WITH TIES)\n  ```\n  - `ROW`와 `ROWS`는 단수/복수 구분 없이 서로 바꿔 써도 완전히 동일하다.\n  - `FIRST`와 `NEXT`도 서로 바꿔 써도 완전히 동일하다.\n  - **`ONLY` vs `WITH TIES`**:\n    - **`ONLY`**: 동점자가 있더라도 정확히 지정한 `N`건만 딱 잘라서 출력한다.\n    - **`WITH TIES`**: 마지막 `N`번째 행과 **동점(같은 정렬 값)인 행이 더 있으면 그 동점자들까지 모두 함께 출력**한다! (따라서 `N`건보다 더 많은 행이 출력될 수 있음)\n- **2) SQL Server `TOP (N) [PERCENT] [WITH TIES]`**:\n  ```sql\n  SELECT TOP(2) WITH TIES ENAME, SAL\n    FROM EMP\n   ORDER BY SAL DESC;\n  ```\n\n![ROWNUM과 인라인 뷰를 이용한 페이징(Paging) 처리 쿼리 1](images/p072_img01.png)\n\n![ROWNUM 페이징 처리 쿼리 및 결과 2](images/p072_img02.png)\n\n![ROWNUM 조건별 조회 가능 여부 비교 예시 1](images/p074_img03.png)\n\n![ROWNUM 조건별 조회 결과 비교 2](images/p074_img04.png)\n\n![인라인 뷰를 활용한 Top-N 쿼리 예시](images/p075_img01.png)\n\n![OFFSET ... FETCH FIRST N ROWS ONLY 기본 구문 예시 1](images/p075_img02.png)\n\n![FETCH FIRST N ROWS ONLY 실행 쿼리 예시 2](images/p075_img03.png)\n\n![FETCH FIRST N ROWS ONLY 실행 결과](images/p075_img04.png)\n\n![OFFSET N ROWS만 단독 사용한 쿼리 예시](images/p075_img05.png)\n\n![OFFSET N ROWS 단독 사용 실행 결과](images/p075_img06.png)\n\n![OFFSET M ROWS FETCH NEXT N ROWS ONLY 결합 쿼리](images/p076_img01.png)\n\n![OFFSET M ROWS FETCH NEXT N ROWS ONLY 실행 결과](images/p076_img02.png)\n\n---\n\n## 🔍 STEP 2. 직관적 Before & After 비교 & 실전 SQL 트레이스\n\n### 🔄 [Before & After] 직관적 비교\n\nEMP 5명에서 급여 상위 3명을 뽑는 상황. 박·최가 4500으로 동률이라는 점이 핵심 차이를 만든다. 같은 \"Top 3\" 요구라도 ROWNUM 기반(정확히 3명)과 WITH TIES(동률 모두 포함)가 어떻게 갈라지는지.\n\n### EMP\n\n| NAME | SAL |\n|---|---|\n| 김 | 3000 |\n| 이 | 5000 |\n| 박 | 4500 |\n| 최 | 4500 |\n| 홍 | 2000 |\n\n### 급여 상위 3명\n\n```sql\nSELECT *\nFROM   (SELECT * FROM EMP ORDER BY SAL DESC)\nWHERE  ROWNUM <= 3;\n```\n\n| NAME | SAL |\n|---|---|\n| 이 | 5000 |\n| 박 | 4500 |\n| 최 | 4500 |\n\n### `WITH TIES` 사용 시\n\n| NAME | SAL |\n|---|---|\n| 이 | 5000 |\n| 박 | 4500 |\n| 최 | 4500 |\n\n4500이 더 있으면 4명 이상 가능\n\n이 예에서는 박·최 두 명이 4500이라 마침 정확히 3명이 떨어졌지만, 만약 4500이 한 명 더 있었다면 ROWNUM 방식은 그중 임의의 3명만, WITH TIES는 동률 전원을 포함해 4명 이상을 반환한다. \"정확한 N개\"가 필요하면 ROW_NUMBER()/ROWNUM, \"공평하게 동률 포함\"이 원칙이면 WITH TIES 나 RANK(). 결과 행 수가 입력 데이터에 따라 달라질 수 있다는 점이 Top N 쿼리의 단골 함정.\n\n### 💻 [SQL 실전 트레이스]\n\n### Oracle ROWNUM\n\nROWNUM = 행이 만들어진 순서대로 1, 2, 3... 이 매겨지는 의사 컬럼\n\n```sql\nSELECT  *\nFROM    EMP\nWHERE   ROWNUM <= 5;\n```\n\n#### ROWNUM의 함정\n\nROWNUM 은 **ORDER BY** 적용 전에 매겨지므로 정렬을 먼저 한 인라인 뷰를 감싸야 함\n\n```sql\n-- 잘못된 예: 정렬 전에 ROWNUM이 매겨짐\nSELECT *\nFROM   EMP\nWHERE  ROWNUM <= 5\nORDER BY SAL DESC;     -- 5개 추출 후 정렬되어 의도와 다름\n\n-- 올바른 예: 인라인 뷰로 정렬 먼저\nSELECT *\nFROM   (SELECT * FROM EMP ORDER BY SAL DESC)\nWHERE  ROWNUM <= 5;\n```\n\n| 조건 | 결과 |\n|---|---|\n| `ROWNUM = 1` | 가능 |\n| `ROWNUM <= 5` | 가능 |\n| `ROWNUM = 5` | 결과 없음 |\n| `ROWNUM > 5` | 결과 없음 |\n\nROWNUM 은 1부터 시작하므로 \"5번째만\"을 ROWNUM = 5 로 표현 불가\n\n---\n\n### 표준 FETCH FIRST (Oracle 12c+)\n\n```sql\n-- 상위 5개\nSELECT *\nFROM   EMP\nORDER BY SAL DESC\nFETCH FIRST 5 ROWS ONLY;\n\n-- 상위 10%(백분율)\nSELECT *\nFROM   EMP\nORDER BY SAL DESC\nFETCH FIRST 10 PERCENT ROWS ONLY;\n\n-- 동률 포함\nSELECT *\nFROM   EMP\nORDER BY SAL DESC\nFETCH FIRST 5 ROWS WITH TIES;     -- 5등 동률은 모두 포함\n```\n\n| 옵션 | 의미 |\n|---|---|\n| FETCH FIRST n ROWS ONLY | 정확히 n개 |\n| FETCH FIRST n ROWS WITH TIES | n등 동률은 모두 포함 |\n| OFFSET n ROWS | n개 건너뛰고 |\n\n---\n\n### MS-SQL TOP\n\n```sql\nSELECT TOP 5 *\nFROM   EMP\nORDER BY SAL DESC;\n\n-- 동률 포함\nSELECT TOP 5 WITH TIES *\nFROM   EMP\nORDER BY SAL DESC;\n```\n\n---\n\n### **윈도우 함수** — 가장 안전·범용\n\n```sql\n-- 부서별 급여 상위 3명\nSELECT *\nFROM   (SELECT NAME, DEPT_ID, SAL,\n               ROW_NUMBER() OVER (PARTITION BY DEPT_ID ORDER BY SAL DESC) AS RN\n        FROM   EMP)\nWHERE  RN <= 3;\n```\n\n| 함수 | 동률 처리 |\n|---|---|\n| ROW_NUMBER() | 무조건 다른 번호 → 정확히 N개 |\n| RANK() | 동률 같은 등수, 건너뜀 |\n| DENSE_RANK() | 동률 같은 등수, 연속 |\n\n---\n\n### 페이징(Pagination)\n\n\"1페이지: 1-10번째, 2페이지: 11-20번째...\"\n\n### Oracle\n\n```sql\n-- 11~20번째\nSELECT *\nFROM   (SELECT ROWNUM RN, X.*\n        FROM   (SELECT * FROM EMP ORDER BY SAL DESC) X\n        WHERE  ROWNUM <= 20)\nWHERE  RN >= 11;\n```\n\n### 표준 (Oracle 12c+)\n\n```sql\nSELECT *\nFROM   EMP\nORDER BY SAL DESC\nOFFSET 10 ROWS FETCH NEXT 10 ROWS ONLY;\n```\n\n---\n\n## 🚨 STEP 3. 출제위원 단골 함정 O/X & 노랭이·기출 문항별 족보\n\n### ⚠️ 시험장 단골 함정 vs 정답 1:1 대조표\n\n| 함정 | 정답 |\n|---|---|\n| `WHERE ROWNUM = 5` | 결과 없음(1만 매칭) |\n| ROWNUM과 ORDER BY 조합 | 인라인 뷰로 정렬 먼저, ROWNUM은 나중에 |\n| 동률 포함하려면 | WITH TIES 또는 RANK() |\n| 부서별 Top N | 윈도우 함수(ROW_NUMBER + PARTITION BY) |\n| 페이징 표준 문법 | OFFSET ... FETCH NEXT ... |\n\n단골 함정: ROWNUM 은 `=1` 만 의미 있음. `>n` 은 항상 거짓.\n\n### 📒 이 단원과 직결된 『SQL 자격검정 실전문제(노랭이)』 & 기출 킬러 족보\n\n- **[30회 기출 26번]** 오라클에서 `ROWNUM` 슈도 컬럼을 이용해 상위 N건을 제한할 때는 `WHERE` 절에서 `1`부터 시작하는 조건(`ROWNUM <= N` 또는 `ROWNUM < N`)으로 사용해야 한다.\n\n---\n\n## ✍️ STEP 4. 실전 적중! 단원 마무리 확인 문제\n\n<div class=\"sqld-quiz-box\" data-answer=\"1\">\n\n**Q. [2-2-5 대표 적중 문제]** `EMP` 테이블에서 급여(`SAL`)가 가장 높은 상위 5명의 사원을 조회하려고 할 때, 다음 중 문법 및 실행 결과가 **올바르지 않은** 것은?\n\n- ① `[Oracle]` `SELECT * FROM EMP WHERE ROWNUM <= 5 ORDER BY SAL DESC;`\n- ② `[Oracle]` `SELECT * FROM (SELECT * FROM EMP ORDER BY SAL DESC) WHERE ROWNUM <= 5;`\n- ③ `[SQL Server]` `SELECT TOP(5) * FROM EMP ORDER BY SAL DESC;`\n- ④ `[Oracle 12c+ / ANSI 표준]` `SELECT * FROM EMP ORDER BY SAL DESC FETCH FIRST 5 ROWS ONLY;`\n\n<details>\n<summary>💡 <b>정답 및 시나공·과외노트식 보기별 완벽 해설 확인하기 (클릭)</b></summary>\n\n**정답: ①**\n- **해설**: ①번 쿼리는 논리적 실행 순서가 `FROM ➔ WHERE (ROWNUM <= 5) ➔ SELECT ➔ ORDER BY (SAL DESC)`이므로, **급여 순으로 정렬하기 전에 테이블에서 임의의 5건을 먼저 추출한 뒤 그 5건만 정렬**하게 되어 급여 상위 5명을 구할 수 없습니다! 반드시 **②번**처럼 인라인 뷰에서 먼저 `ORDER BY SAL DESC`를 수행한 후 바깥에서 `ROWNUM <= 5`로 추출해야 합니다.\n\n</details>\n</div>\n\n---\n\n## ⏱️ STEP 5. 시험장 입실 직전 30초 최종 요약 카드\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · ROWNUM 함정 = **`=1`만 가능**, **`>n` 항상 거짓**, **정렬 전에 매겨짐** → 인라인뷰로 정렬 먼저\n> · 표준: `FETCH FIRST n ROWS ONLY` (Oracle 12c+) / `WITH TIES` 면 동률 포함\n> · MS-SQL: `SELECT TOP n` / `TOP n WITH TIES`\n> · 부서별 Top N = **ROW_NUMBER() OVER (PARTITION BY ... ORDER BY ...)** + 인라인뷰\n> · 페이징 표준 = `OFFSET n ROWS FETCH NEXT m ROWS ONLY`"}, {"id": "ch-24", "index": 24, "title": "2-2-6. 계층형 질의와 셀프 조인", "subj_id": "tab3", "subj_name": "2과목 2장 · SQL 활용", "badge": "2과목 2장 · SQL 활용", "md": "# 2-2-6. 계층형 질의와 셀프 조인\n\n> **단원 분류**: `2과목` > `2-2. SQL 활용` > **`2-2-6. 계층형 질의와 셀프 조인`**\n> **🎯 출제 빈도**: `★★★★★ (매회 1~2문항 100% 출제!)` &nbsp;|&nbsp; **🧠 두문자 암기 공식**: `PRIOR 자식 = 부모 (부모➔자식 순방향 전개! '프자부순') / PRIOR 부모 = 자식 (자식➔부모 역방향 전개! '프부자역')`\n\n## 🎯 과외선배의 1분 브리핑 & 핵심 구조도\n\n> [!TIP]\n> **👨‍🏫 1:1 과외선배의 학습 코칭 (`유선배 과외노트` 스타일)**\n> 계층형 질의는 이 암기법 하나로 끝납니다: **`CONNECT BY PRIOR EMPNO(자식/현재행) = MGR(부모)` ➔ `'프자부순'(PRIOR가 자식 쪽에 붙으면 부모에서 자식으로 내려가는 순방향 전개!)`** 반대로 **`PRIOR MGR(부모) = EMPNO(자식)` ➔ `'프부자역'(역방향 전개!)`** 그리고 또 하나의 킬러 포인트: **`CONNECT BY` 절에 쓴 조건은 해당 노드와 그 하위 자식들까지 통째로 전개를 멈추지만(단, `START WITH` 루트 노드는 무조건 살아남음!), `WHERE` 절에 쓴 조건은 계층 전개를 다 끝낸 뒤 마지막에 해당 행만 쏙 골라내서 지운다!**\n\n> 계층형 질의는 트리 구조 데이터(예: 조직도)를 위에서 아래로 펼치는 쿼리다. 셀프 조인은 같은 테이블을 자기 자신과 조인하는 것이다.\n\nex) 가족 족보를 \"사람ID, 부모ID\" 한 테이블에 저장한 뒤 CONNECT BY로 할아버지 → 아버지 → 나 순으로 펼쳐 보는 쿼리.\n\n### 🗺️ 한눈에 보는 핵심 구조도: 계층형 데이터의 모양\n\n```\n       사장(E1)\n       /    \\\n   매니저A(E2) 매니저B(E3)\n     /\n  사원(E4)\n```\n\n| EMP_ID | NAME | MGR_ID |\n|---|---|---|\n| E1 | 사장 | NULL |\n| E2 | 매니저A | E1 |\n| E3 | 매니저B | E1 |\n| E4 | 사원 | E2 |\n\n---\n\n## 📘 STEP 1. 시험 출제 핵심 이론 & 강의 도표 완벽 정복\n\n### 📌 1. 셀프 조인 (Self-Join) (PDF p.72, p.76)\n- **셀프 조인의 정의**: **동일 테이블 사이의 조인**을 말한다.\n- 한 테이블 내에 두 칼럼이 연관 관계(예: `EMP` 테이블의 사원번호 `EMPNO`와 직속상관 사원번호 `MGR`)가 있을 때 사용한다.\n- `FROM` 절에 같은 테이블이 두 번 들어가므로, DBMS가 두 테이블을 구분할 수 있도록 **반드시 서로 다른 테이블 별칭(Alias, 예 `FROM EMP E1, EMP E2`)을 지정해야만 한다!**\n\n![EMP 테이블의 사원(EMPNO)과 매니저(MGR) 계층 구조 및 셀프 조인 쿼리 1](images/p072_img03.png)\n\n![셀프 조인 쿼리 작성 예시 2](images/p072_img04.png)\n\n![셀프 조인(INNER vs LEFT OUTER) 실행 결과 및 차상위 관리자 조회](images/p072_img05.png)\n\n![셀프 조인 개념 및 계층형 데이터 구조 도식](images/p076_img03.png)\n\n![셀프 조인 SQL 쿼리 및 실행 결과](images/p076_img04.png)\n\n---\n\n### 📌 2. Oracle 계층형 질의 (`START WITH ... CONNECT BY PRIOR ...`) 완벽 공략\n\n> 💡 **[핵심 필수 암기]**\n> **`PRIOR`의 위치에 따른 전개 방향 (★매 시험 100% 출제! 암기 공식: `\"프·자·순 / 프·부·역\"`)**\n> `PRIOR`는 **\"이전 단계(방금 읽은 행)의\"**라는 뜻입니다. 등호(`=`)를 기준으로 `PRIOR`가 어느 쪽에 붙어 있는지만 보면 순방향인지 역방향인지 1초 만에 판별할 수 있습니다!\n> - **`PRIOR 자식컬럼 = 부모컬럼`** (예: **`PRIOR EMPNO = MGR`** 또는 `MGR = PRIOR EMPNO`):\n>   - *\"이전 행의 사원번호(`PRIOR EMPNO`)가 현재 행의 매니저번호(`MGR`)와 같다\"*\n>   - ➔ 위(부모/사장)에서 아래(자식/부하직원)로 내려가는 **순방향 전개 (Top-Down)**! (**\"프자순: `PRIOR 자식 = 부모`는 순방향!\"**)\n> - **`PRIOR 부모컬럼 = 자식컬럼`** (예: **`PRIOR MGR = EMPNO`** 또는 `EMPNO = PRIOR MGR`):\n>   - *\"이전 행의 매니저번호(`PRIOR MGR`)가 현재 행의 사원번호(`EMPNO`)와 같다\"*\n>   - ➔ 아래(자식/부하직원)에서 위(부모/사장)로 올라가는 **역방향 전개 (Bottom-Up)**! (**\"프부역: `PRIOR 부모 = 자식`은 역방향!\"**)\n\n| 실행 순서 | 계층형 질의 절 | 역할 및 핵심 주의사항 (★시험 단골!) |\n| :---: | :---: | :--- |\n| **1단계** | **`START WITH 조건`** | 계층 전개를 시작할 **최상위 루트 노드(`LEVEL = 1`)** 행을 결정 (`START WITH`에 선택된 루트 행은 `CONNECT BY` 조건과 무관하게 무조건 포함됨!) |\n| **2단계** | **`CONNECT BY [NOCYCLE] PRIOR 조건`** | 부모-자식 연결 방향으로 다음 행들을 순차 전개하며, **`CONNECT BY` 절에 적힌 조건을 불만족하는 노드는 그 하위 자식 트리까지 통째로 전개 중단!** |\n| **3단계** | **`WHERE 조건`** | **모든 계층 전개가 다 끝난 뒤**, 마지막에 `WHERE` 조건을 만족하는 개별 행만 남김 (조건 불만족 부모만 빠지고 그 자식 노드는 살아남음!) |\n| **4단계** | **`ORDER SIBLINGS BY 컬럼`** | 계층 트리 구조를 깨뜨리지 않고 **같은 부모를 가진 형제(Sibling) 노드들 사이에서만** 정렬 수행 |\n\n- **🔥 `CONNECT BY` 절에 쓴 조건 vs `WHERE` 절에 쓴 조건의 결정적 차이 (★킬러 문제!)**:\n  - **`CONNECT BY` 절에 `AND 조건`을 추가한 경우**: 계층을 타고 내려가는 **도중에** 조건에 맞지 않는 노드를 만나면, **그 노드뿐만 아니라 그 아래에 매달린 모든 하위 자식/손자 노드들까지 통째로 가지치기(Pruning)되어 결과에서 사라진다!** *(단, `START WITH`로 뽑힌 루트 노드는 `CONNECT BY` 절의 조건을 거치지 않고 무조건 출력된다!)*\n  - **`WHERE` 절에 조건을 쓴 경우**: 일단 `START WITH ... CONNECT BY`로 **전체 계층 트리를 끝까지 다 전개해 놓은 다음**, 마지막에 **`WHERE` 조건에 맞지 않는 해당 단일 행만 쏙 빼고(하위 자식들은 그대로 살아남음!)** 출력한다!\n\n| 계층형 질의 가상 컬럼 / 함수 | 설명 |\n| :--- | :--- |\n| **`LEVEL`** | 루트(시작) 데이터가 **`1`**, 그 하위 자식이 **`2`**, 손자가 **`3`**... 형태로 현재의 깊이(Depth)를 반환 |\n| **`CONNECT_BY_ISLEAF`** | 전개 과정에서 해당 데이터가 **맨 끝단(더 이상 자식이 없는 단말 노드, Leaf Node)이면 `1`**, 자식이 있으면 **`0`**을 반환 |\n| **`CONNECT_BY_ISCYCLE`** | 무한 루프(순환)가 발생했을 때 원인이 되는 행이면 `1`, 아니면 `0` 반환 (`CONNECT BY NOCYCLE` 옵션과 함께 사용해야 함) |\n| **`SYS_CONNECT_BY_PATH(컬럼, 구분자)`** | 루트 데이터부터 현재 전개할 데이터까지의 경로를 구분자(예: `'/'`)로 이어 붙여서 문자열로 출력 (예: `'/KING/JONES/SCOTT'`) |\n| **`CONNECT_BY_ROOT 컬럼`** | 현재 행의 **최상위 루트(Root, `LEVEL = 1`) 노드의 해당 컬럼 값**을 반환 |\n| **`ORDER SIBLINGS BY 컬럼`** | 계층 트리 구조를 깨뜨리지 않고 **동일한 부모를 가진 형제(Sibling) 노드들 사이에서만 정렬** 수행! (일반 `ORDER BY`를 쓰면 계층 줄기가 완전히 뒤섞여 깨짐!) |\n\n![계층형 질의 기본 구문 및 가상 컬럼(LEVEL, CONNECT_BY_ISLEAF) 설명](images/p077_img01.png)\n\n![계층형 질의 순방향 전개 실행 결과 1](images/p077_img02.png)\n\n![역방향 전개 및 LPAD를 활용한 계층 트리 들여쓰기 출력 예시](images/p077_img03.png)\n\n![SYS_CONNECT_BY_PATH 및 CONNECT_BY_ROOT 함수 활용 쿼리 1](images/p077_img04.png)\n\n![ORDER SIBLINGS BY 정렬 쿼리 예시 2](images/p077_img05.png)\n\n![계층형 질의 실행 결과 비교 1](images/p077_img06.png)\n\n![WHERE 절 조건과 CONNECT BY 절 조건의 결과 차이 쿼리](images/p078_img01.png)\n\n![WHERE 절 조건과 CONNECT BY 절 조건의 실행 결과 비교](images/p078_img02.png)\n\n![계층형 질의 가상 함수(CONNECT_BY_ROOT, SYS_CONNECT_BY_PATH) 종합 결과](images/p078_img03.png)\n\n---\n\n## 🔍 STEP 2. 직관적 Before & After 비교 & 실전 SQL 트레이스\n\n### 🔄 [Before & After] 직관적 비교\n\n평면 테이블 EMP는 4행이 단순히 나열돼 있을 뿐, 사장-매니저-사원의 위계가 보이지 않는다. CONNECT BY로 MGR_ID 컬럼을 따라 부모-자식 관계를 펼치면 같은 4행이 트리 순서로 재배열되고 LEVEL 이 1·2·3으로 매겨진다.\n\n### EMP\n\n| EMP_ID | NAME | MGR_ID |\n|---|---|---|\n| E1 | 사장 | NULL |\n| E2 | 매니저A | E1 |\n| E3 | 매니저B | E1 |\n| E4 | 사원 | E2 |\n\n### 쿼리\n\n```sql\nSELECT LEVEL, NAME, EMP_ID, MGR_ID\nFROM   EMP\nSTART WITH MGR_ID IS NULL\nCONNECT BY PRIOR EMP_ID = MGR_ID;\n```\n\n| LEVEL | NAME | EMP_ID | MGR_ID |\n|---|---|---|---|\n| 1 | 사장 | E1 | NULL |\n| 2 | 매니저A | E2 | E1 |\n| 3 | 사원 | E4 | E2 |\n| 2 | 매니저B | E3 | E1 |\n\nSTART WITH MGR_ID IS NULL 이 사장(E1)을 루트로 잡고, CONNECT BY PRIOR EMP_ID = MGR_ID 가 \"현재 행의 EMP_ID = 다음 행의 MGR_ID\"라는 부모-자식 규칙을 정의해 깊이 우선으로 트리를 펼친다. 그래서 매니저A 다음에 그 자식인 사원이 먼저 따라붙고, 그다음에야 매니저B가 출력된다(매니저B 자식이 없으면 거기서 가지 끝). 셀프 조인이라면 \"사원-매니저\" 1단계만 가능하지만, 계층형 질의는 깊이가 깊어져도 LEVEL 과 SYS_CONNECT_BY_PATH 로 재귀 추적이 가능 — 결정적 차이.\n\n### 💻 [SQL 실전 트레이스] 계층형 질의\n\n```sql\nSELECT  LEVEL,\n        LPAD(' ', (LEVEL-1)*4) || NAME AS TREE,\n        SYS_CONNECT_BY_PATH(NAME, '/') AS PATH\nFROM    EMP\nSTART WITH MGR_ID IS NULL\nCONNECT BY PRIOR EMP_ID = MGR_ID;\n```\n\n### 결과\n\n| LEVEL | TREE | PATH |\n|---|---|---|\n| 1 | 사장 | /사장 |\n| 2 | &nbsp;&nbsp;&nbsp;&nbsp;매니저A | /사장/매니저A |\n| 3 | &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;사원 | /사장/매니저A/사원 |\n| 2 | &nbsp;&nbsp;&nbsp;&nbsp;매니저B | /사장/매니저B |\n\n---\n\n## 🚨 STEP 3. 출제위원 단골 함정 O/X & 노랭이·기출 문항별 족보\n\n### ⚠️ 시험장 단골 함정 vs 정답 1:1 대조표\n\n| 함정 | 정답 |\n|---|---|\n| START WITH의 의미 | 루트(최상위) 조건 |\n| `CONNECT BY PRIOR EMP_ID = MGR_ID` | 순방향(부모→자식) |\n| LEVEL의 시작 값 | 1(루트) |\n| 형제 정렬 | ORDER SIBLINGS BY |\n| SYS_CONNECT_BY_PATH | 경로 문자열 |\n| 셀프 조인 시 별칭 | 필수 |\n| 계층형 질의는 표준인가 | Oracle 전용. 표준은 재귀 CTE |\n\n단골 함정: PRIOR 의 위치를 바꾸면 순방향과 역방향이 뒤바뀜\n\n### 📒 이 단원과 직결된 『SQL 자격검정 실전문제(노랭이)』 & 기출 킬러 족보\n\n- **[노랭이 2과목 90번 ★중요체크]** 오라클에서 `PRIOR` 연산자는 `CONNECT BY` 절뿐만 아니라 **`SELECT` 절이나 `WHERE` 절에서도 사용할 수 있다**.\n- **[34회 기출 47번]** SQL Server/ANSI 표준에서는 **`WITH` 절(CTE)을 재귀 호출(Anchor 멤버 + `UNION ALL` + Recursive 멤버)**함으로써 상위부터 하위 방향으로 계층형 전개를 수행한다.\n- **[친구의 단원별 오답메모]** `START WITH`에 해당되는 루트 행은 `CONNECT BY` 조건과 상관없이 무조건 출력되며, `WHERE` 절은 모든 계층 전개를 진행한 이후 필터 조건으로 수행된다. `ORDER SIBLINGS BY`는 동일한 레벨(형제 노드) 사이에서만 정렬을 수행한다.\n\n---\n\n## ✍️ STEP 4. 실전 적중! 단원 마무리 확인 문제\n\n<div class=\"sqld-quiz-box\" data-answer=\"4\">\n\n**Q. [2-2-6 대표 적중 문제]** 다음 오라클 계층형 질의(Hierarchical Query)에 대한 설명으로 **가장 부적절한** 것은?\n\n- ① `CONNECT BY PRIOR EMPNO = MGR`는 이전(부모) 행의 사번(`EMPNO`)이 현재(자식) 행의 관리자번호(`MGR`)와 같은 데이터를 찾아가므로 부모에서 자식으로 내려가는 **순방향 전개**이다.\n- ② 루트 노드의 `LEVEL` 값은 `1`이며, 말단 노드(하위 자식이 없는 노드)인 경우 `CONNECT_BY_ISLEAF` 값은 `1`(자식이 있으면 `0`)을 반환한다.\n- ③ 계층 구조를 그대로 유지하면서 같은 부모를 가진 동일 `LEVEL`(형제 노드)끼리만 정렬하려면 `ORDER SIBLINGS BY` 절을 사용한다.\n- ④ `WHERE` 절에 작성한 조건은 계층 전개를 수행하는 도중에 먼저 필터링되므로, `WHERE` 조건을 만족하지 못하는 노드의 하위 자식 노드들까지 모두 결과에서 제외된다.\n\n<details>\n<summary>💡 <b>정답 및 시나공·과외노트식 보기별 완벽 해설 확인하기 (클릭)</b></summary>\n\n**정답: ④**\n- **해설**: 계층형 질의에서 **`WHERE` 절은 모든 계층 전개(`START WITH ... CONNECT BY`)를 완전히 끝낸 후에 마지막으로 실행**됩니다! 따라서 `WHERE` 조건에서 특정 부모 노드가 걸러지더라도 그 아래로 이미 전개된 **자식 노드들은 사라지지 않고 그대로 결과에 출력**됩니다. (하위 자식 노드들까지 통째로 가지치기하려면 조건을 `WHERE` 절이 아니라 **`CONNECT BY` 절 내부에 `AND` 조건**으로 작성해야 합니다!)\n\n</details>\n</div>\n\n---\n\n## ⏱️ STEP 5. 시험장 입실 직전 30초 최종 요약 카드\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · `START WITH` = **루트 조건** (보통 MGR_ID IS NULL)\n> · `CONNECT BY PRIOR EMP_ID = MGR_ID` = **순방향** (부모 → 자식, 위에서 아래로)\n> · `CONNECT BY PRIOR MGR_ID = EMP_ID` = **역방향** (자식 → 부모)\n> · LEVEL = **1부터** (루트가 1) / SYS_CONNECT_BY_PATH = 경로 표시\n> · 형제 정렬 = **ORDER SIBLINGS BY** (일반 ORDER BY 는 트리 깨짐)\n> · 표준 재귀 쿼리 = **WITH RECURSIVE ... UNION ALL** (CTE)\n> · SELF JOIN = 같은 테이블 두 번 사용, **별칭 필수** (1단계 관계만)"}, {"id": "ch-25", "index": 25, "title": "2-2-7. PIVOT 절과 UNPIVOT 절", "subj_id": "tab3", "subj_name": "2과목 2장 · SQL 활용", "badge": "2과목 2장 · SQL 활용", "md": "# 2-2-7. PIVOT 절과 UNPIVOT 절\n\n> **단원 분류**: `2과목` > `2-2. SQL 활용` > **`2-2-7. PIVOT / UNPIVOT 절`**\n> **🎯 출제 빈도**: `★★★★☆ (2024 개정 신유형 집중 출제!)` &nbsp;|&nbsp; **🧠 두문자 암기 공식**: `PIVOT (행 ➔ 열 가로 펼치기: 집계함수 + FOR 기준컬럼 IN (...)) / UNPIVOT (열 ➔ 행 세로 모으기: 기본은 EXCLUDE NULLS!)`\n\n## 🎯 과외선배의 1분 브리핑 & 핵심 구조도\n\n> [!TIP]\n> **👨‍🏫 1:1 과외선배의 학습 코칭 (`유선배 과외노트` 스타일)**\n> 2024 개정판에서 새롭게 추가된 신유형 단원입니다! ① **`PIVOT (집계함수(값컬럼) FOR 펼칠컬럼 IN (값1, 값2...))`**에서 괄호 안에 적히지 않은 나머지 컬럼들이 **자동으로 `GROUP BY` 기준 컬럼**이 되므로, 원본 테이블을 그대로 쓰지 않고 필요한 컬럼만 뽑은 인라인 뷰를 `FROM` 절에 씁니다! ② **`UNPIVOT`은 기본적으로 값이 `NULL`인 열은 행으로 만들지 않고 제외(`EXCLUDE NULLS`)**하며, `NULL`까지 포함하려면 `UNPIVOT INCLUDE NULLS`를 씁니다!\n\n> PIVOT은 세로 데이터를 가로 데이터로, UNPIVOT은 가로 데이터를 세로 데이터로 바꾼다. 데이터 모양 변환 도구다.\n\nex) \"(김철수, 수학, 3) / (김철수, 영어, 2)\" 같은 세로 카드 형태를 \"김철수 | 수학3 | 영어2\"의 가로 엑셀 표로 펼치는 작업이 PIVOT.\n\n### 🗺️ 한눈에 보는 핵심 구조도: PIVOT vs UNPIVOT\n\n**세로형 (Long) — 원본**\n\n| 회원 | 과목 | 수 |\n|---|---|---|\n| 김 | 수학 | 3 |\n| 김 | 영어 | 2 |\n| 김 | 과학 | 1 |\n\n**↓ PIVOT (세로 → 가로) / ↑ UNPIVOT (가로 → 세로)**\n\n**가로형 (Wide) — 변환**\n\n| 회원 | 수학 | 영어 | 과학 |\n|---|---|---|---|\n| 김 | 3 | 2 | 1 |\n\n---\n\n## 📘 STEP 1. 시험 출제 핵심 이론 & 강의 도표 완벽 정복\n\n> 📌 **[2024 개정 출제 안내]**\n> **2024년 개정 SQLD 신설·강화 파트!**: 문법 구조(`AGG(...) FOR 컬럼 IN (...)`)의 빈칸 채우기나 실행 결과 표의 행·열 개수를 묻는 문제가 매회 출제되고 있습니다.\n\n### 📌 1. 데이터의 구조: Long Data (Tidy Data) vs Wide Data (Cross-table)\n- **Long Data (세로형 데이터)**: 하나의 속성이 하나의 컬럼으로 되어 있어 아래로 행이 길게 쌓이는 형태 (RDB 저장 및 조인에 적합).\n- **Wide Data (가로형 요약표)**: 특정 컬럼의 값들(예: `10번 부서, 20번 부서, 30번 부서`)을 가로 열(Column Header)로 펼쳐서 교차표 형태로 만든 데이터 (보고서/시각화에 적합).\n- **`PIVOT`**: **행(Row) 데이터를 열(Column)로 회전** (Long ➔ Wide 변환, 집계 수행!)\n- **`UNPIVOT`**: **열(Column)로 펼쳐진 데이터를 다시 행(Row)으로 회전** (Wide ➔ Long 변환!)\n\n![Long Data와 Wide Data의 개념 및 PIVOT / UNPIVOT 변환 방향 도식](images/p078_img04.png)\n\n### 📌 2. `PIVOT` 절과 `UNPIVOT` 절 문법 완벽 정리\n\n1. **`PIVOT` 절 구문**:\n   ```sql\n   SELECT *\n     FROM (피벗할 원본 컬럼만 추린 인라인 뷰!)   -- ★중요: 여기에 불필요한 컬럼(예: EMPNO)이 남아있으면 그 컬럼까지 암묵적 그룹핑 기준이 되어 행이 쪼개짐!\n    PIVOT (\n        SUM(SAL)                               -- 1. 교차 칸에 채울 집계함수(값)\n        FOR DEPTNO                             -- 2. 가로 열(Column) 제목이 될 기준 컬럼\n        IN (10 AS D10, 20 AS D20, 30 AS D30)   -- 3. 열로 펼칠 실제 값 목록 (별칭 부여 가능)\n    );\n   ```\n   - **핵심 원리**: `PIVOT` 절에 명시하지 않은 **인라인 뷰의 나머지 모든 컬럼(예: `JOB`)이 자동으로 `GROUP BY` 기준 컬럼(세로 행 기준)**이 된다!\n\n2. **`UNPIVOT` 절 구문**:\n   ```sql\n   SELECT *\n     FROM 피벗된테이블\n   UNPIVOT [INCLUDE NULLS | EXCLUDE NULLS] (   -- 기본값은 EXCLUDE NULLS (값이 NULL인 열은 행으로 안 만듦!)\n        SAL                                    -- 1. 가로 열들에 들어있던 실제 수치 값들이 모일 '새 컬럼명'\n        FOR DEPTNO                             -- 2. 기존 가로 열 이름들(D10, D20...)이 값으로 들어갈 '새 컬럼명'\n        IN (D10 AS 10, D20 AS 20, D30 AS 30)   -- 3. 행으로 내릴 기존 가로 컬럼명 목록\n   );\n   ```\n\n![PIVOT 절 기본 구문 및 실행 원리 도식](images/p078_img05.png)\n\n![PIVOT 절 실행 전 원본 테이블 데이터](images/p078_img06.png)\n\n![PIVOT 수행 쿼리 예시 1](images/p079_img01.png)\n\n![PIVOT 수행 결과 테이블 1](images/p079_img02.png)\n\n![다중 집계함수 및 다중 컬럼 PIVOT / UNPIVOT 쿼리 예시 2](images/p079_img03.png)\n\n![UNPIVOT 수행 쿼리 및 실행 결과 비교](images/p079_img04.png)\n\n---\n\n## 🔍 STEP 2. 직관적 Before & After 비교 & 실전 SQL 트레이스\n
