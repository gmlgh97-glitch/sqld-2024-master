s 반정규화**: 정규화는 입력/수정/삭제 성능을 향상시키지만 조인으로 인해 조회 성능이 저하될 수 있고, 반정규화는 데이터 중복을 허용하여 **조회 속도**를 향상시킨다.\n  - **식별관계 vs 비식별관계**: 부모의 식별자를 자식의 주식별자에 포함하면 **식별관계(실선)**, 자식의 일반속성으로 상속하면 **비식별관계(점선)**.\n- **2과목 1장 (`SQL 기본`)**:\n  - **빈 문자열(`''`) 입력 시**: **Oracle**은 `NULL`로 삽입되고(`IS NULL`로 조회), **SQL Server**는 빈 문자열(`''`) 그대로 삽입된다(`= ''`로 조회).\n  - **Oracle 날짜 연산**: `+ 1`은 **1일**, `+ 1/24`은 **1시간**, `+ 1/24/60`은 **1분**, `+ 1/24/(60/10)`은 **10분**을 더한다.\n  - **`CASE` 표현식**: `ELSE` 절을 생략하고 조건을 만족하지 않으면 **`NULL`**이 반환된다.\n  - **순수 관계 연산자 4가지**: `SELECT`(행 선택), `PROJECT`(열 추출), `JOIN`(결합), `DIVIDE`(나누기 — 현재 SQL에는 없음).\n- **2과목 2장 (`SQL 활용`)**:\n  - **집합 연산자와 `ORDER BY`**: 집합 연산자(`UNION` 등)를 사용한 SQL의 `ORDER BY` 절은 최종 결과를 정렬하며, **가장 마지막 줄에 단 한 번만** 사용할 수 있다.\n  - **계층형 질의 (`START WITH` / `WHERE` / `PRIOR` / `ORDER SIBLINGS BY`)**:\n    - `START WITH`에 해당되는 루트 행은 `CONNECT BY` 조건과 상관없이 무조건 출력된다.\n    - `WHERE` 절은 **모든 계층 전개를 진행한 이후** 필터 조건으로서 조건을 만족하는 데이터만 추출한다.\n    - `PRIOR` 키워드는 `SELECT`, `WHERE`, `CONNECT BY` 절 모두에서 사용할 수 있다.\n    - `ORDER SIBLINGS BY`는 **동일한 레벨(형제 노드) 사이에서 정렬**을 수행한다.\n    - **SQL Server의 계층형 질의**: `CTE`(`WITH`절)를 재귀 호출하며, **앵커 멤버(Anchor Member)**를 실행해 기본 결과 집합을 만든 뒤 **재귀 멤버(Recursive Member)**를 반복 실행한다.\n  - **서브쿼리**:\n    - **비연관 서브쿼리**: 서브쿼리가 메인쿼리 컬럼을 가지지 않으며, 주로 메인쿼리에 값을 제공할 목적으로 사용된다.\n    - **연관 서브쿼리**: 서브쿼리가 메인쿼리 컬럼을 포함한다.\n    - **다중 컬럼 서브쿼리**: 여러 컬럼을 동시에 비교하며, **SQL Server에서는 지원하지 않는다**.\n    - **다중 행 비교 연산자(`IN`, `ANY`, `ALL`)**는 단일 행 서브쿼리의 비교 연산자로도 사용할 수 있다 (단, 반대로 단일 행 연산자 `=`, `>` 등을 다중 행 서브쿼리에 쓰면 에러 발생!).\n  - **윈도우 함수**:\n    - `PARTITION BY` 절이 없으면 전체 집합을 하나의 파티션으로 정의한 것과 동일하다.\n    - 윈도우 함수 처리로 인해 **결과 행 건수가 줄어들지 않는다** (`GROUP BY`와의 결정적 차이!).\n    - 윈도우 함수 적용 범위는 `PARTITION` 경계를 넘을 수 없다.\n- **2과목 3장 (`관리 구문`)**:\n  - **`WITH GRANT OPTION` vs `REVOKE`**: `WITH GRANT OPTION`으로 객체 권한을 부여받은 사용자가 제3자에게 부여한 권한은, 원래 권한이 `REVOKE`되면 **연쇄적으로 함께 취소(Cascade)**된다.\n  - **참조 동작 (Delete / Insert Action)**:\n    - **Delete(/Modify) Action**:\n      1. `Cascade`: Master 삭제 시 Child 같이 삭제\n      2. `Set Null`: Master 삭제 시 Child 해당 필드 `NULL` 처리\n      3. `Set Default`: Master 삭제 시 Child 해당 필드 `Default` 값으로 설정\n      4. `Restrict`: Child 테이블에 참조하는 PK 값이 없는 경우만 Master 삭제 허용\n      5. `No Action`: 참조무결성을 위반하는 삭제/수정 액션을 취하지 않음\n    - **Insert Action**:\n      1. `Automatic`: Master 테이블에 PK가 없는 경우 Master PK를 자동 생성 후 Child 입력\n      2. `Set Null`: Master 테이블에 PK가 없는 경우 Child 외래키를 `NULL` 값으로 처리\n      3. `Set Default`: Master 테이블에 PK가 없는 경우 Child 외래키를 지정된 기본값으로 입력\n      4. `Dependent`: Master 테이블에 PK가 존재할 때만 Child 입력 허용\n      5. `No Action`: 참조무결성을 위반하는 입력 액션을 취하지 않음\n\n---\n\n## 6-4. 실제 기출문제 (21회 · 30회 · 34회) 킬러 문항 오답노트\n\n> [!CAUTION]\n> **실제 시험장에서 수험생 절반 이상이 틀린 기출 킬러 문항 족보 (`SQLD_기출문제.txt` 전문 완벽 정리)**\n> 특히 **34회 23번(`HAVING`절 공집합 `COUNT(*)`)**과 **30회 42번(`MERGE`문 내 `DELETE`절 동작 조건)**은 시험 직전에 반드시 읽고 가세요!\n\n| 핵심 정리 | # SQLD 기출문제 # |\n| 핵심 정리 | -------------------------------------------------------------------------------------------- |\n| 핵심 정리 | [ 21회 ] |\n| 핵심 정리 | * 객관식 |\n| **3번** | NOT IN 연산에서 NULL 값이 포함되어 있을 경우, 조건식에 대해 TRUE 리턴 |\n| 핵심 정리 | ( NULL 값이 하나라도 존재하면 그로 인해 모든 조건 참이 되어 0건 반환 ) |\n| **13번** | SQL Server이 IDENTITY 컬럼 = IDENTITY(시작값, 증가값) |\n| 핵심 정리 | 해당 컬럼에 값을 INSERT 할 경우 ERROR 발생 |\n| 핵심 정리 | Oracle에서 NULL 값은 CHECK 조건 무시 |\n| **15번** | 문제 및 해설 확인. |\n| **21번** | NATURAL JOIN에서 사용된 열은 접두사(식별자) 불가. |\n| **22번** | 문제확인 - 같은 문제 재출시되면 청약자가 정답 인정. |\n| **26번** | FROM 절은 SELECT 절과 항상 짝을 이룸. |\n| **27번** | NULL끼리, 또는 NULL과의 비교연산 자체가 불가. (False) |\n| **28번** | 서브쿼리 WHERE 절에서도 사용 가능. |\n| 핵심 정리 | 27 / 29 = 92점 |\n| 핵심 정리 | * 단답형 |\n| **1번** | 문제확인 - NULL값 연산에서 제외, 유사 문제로 만약 A 테이블 V1 칼럼 |\n| 핵심 정리 | 뒤에 공백이 있는 경우 TRIM 함수 이용, 공백 제거 후 비교하여 추출. |\n| **4번** | 문제확인 - 전체 1그룹, DNAME 3그룹 (40.OPERATIONS는 조인 실패), |\n| 핵심 정리 | JOB 5그룹, DNAME+JOB 9개 총 18개 |\n| **7번** | COUNT(*) 시 조건에 맞는 결과가 없을 경우 0 반환 |\n| 핵심 정리 | 5  /  7 = 70점 |\n| 핵심 정리 | -------------------------------------------------------------------------------------------- |\n| 핵심 정리 | [ 30회 ] |\n| **2번** | 반정규화 기법 - 테이블 병합, 테이블 분할, 테이블 추가(중복, 통계, 이력, 부분) |\n| 핵심 정리 | 칼럼 추가(중복, 파생, 이력테이블(기능성), PK에 의한, 오작동 위한) |\n| 핵심 정리 | 중복 관계 추가 |\n| **6번** | 1:N 관계에서 1쪽은 N쪽의 모든 데이터를 포함하지만 N쪽은 1쪽의 모든 데이터 포함 X |\n| **7번** | 반정규화 대상 - 범위처리 빈도, 대량 범위처리, 통계성 프로세스, 테이블 조인 多 |\n| **11번** | NUMBER 타입 칼럼에 문자 형식으로 비교 가능, 문자 간 크기 비교 가능. |\n| 핵심 정리 | 문자타입 칼럼에 숫자 형식 비교하려면 모든 칼럼이 숫자 타입으로만 입력되어 있어야 함. |\n| **12번** | 스칼라 서브쿼리에서 한 번의 값 전달에 2개 이상의 행이 반환될 수 없음. 단일행, 단일칼럼만 가능 |\n| **15번** | IN 연산에 NULL이 있을 시 무시하고 연산. ([컬럼=인수]의 OR 반복연산, 칼럼=NULL 비교 불가) |\n| **16번** | 실행계획 수행순서 = [ 선행인덱스→선행테이블액세스→후행인덱스→후행액세스→조인→반복 ] |\n| **23번** | COMMIT, ROLLBACK = TCL(DCL), TRUNCATE = DDL |\n| **26번** | ROWNUM 함수 WHERE 절에서 사용해야 함. |\n| **30번** | 모든 회원을 구하라 했는데 1번은 INNER JOIN을 해서 구매안한 고객은 검색 X. |\n| **33번** | PK가 2개의 칼럼으로 구성되어 있는데 4번은 1개의 칼럼에만 조건을 걸어서 여러 행 반환 가능. |\n| **35번** | Cross Join과 Natural Join도 Where절에서 조건 걸 수 있음. (조인 조건을 못거는 것 뿐임) |\n| **42번** | MERGE INTO 대상테이블 |\n| 핵심 정리 | USING 대상 테이블에 삽입 할 테이블 |\n| 핵심 정리 | ON 비교할 키 값 |\n| 핵심 정리 | WHEN MATCHED THEN |\n| 핵심 정리 | UPDATE SET 대상 테이블에 키 값 이미 존재 시, 변경해 줄 컬럼과 값 |\n| 핵심 정리 | DELETE |\n| 핵심 정리 | WHEN NOT MATCHED THEN |\n| 핵심 정리 | INSERT(칼럼, 칼럼, 칼럼) VALUES(인수, 인수 인수); |\n| 핵심 정리 | MERGE INTO 구문은 테이블에 데이터를 조회하여 이미 존재하는 키 값이면 |\n| 핵심 정리 | 수정할 데이터를 입력하고, 존재하지 않으면 새로 삽입하게 해주는 구문이다. |\n| 핵심 정리 | * MERGE INTO 구문에서 DELETE 절은 UPDATE 절에 종속된다. |\n| 핵심 정리 | (UPDATE가 실행된 건에 한해서만 DELETE가 동작함) |\n| **47번** | Default 값 = INSERT 문에서 컬럼 명시 없이 삽입 OR 컬럼 명시 후 Default 입력 시 입력되는 값. |\n| 핵심 정리 | (컬럼 명시 후, NULL 입력시, NULL이 입력됨.) |\n| 핵심 정리 | 45 / 50 = 90점 |\n| 핵심 정리 | -------------------------------------------------------------------------------------------- |\n| 핵심 정리 | [ 34회 ] |\n| **7번** | 식별자 관계 : 자식의 주식별자로 상속, NULL값 X, 부모에 종속, 상속받은 주식별자를 |\n| 핵심 정리 | 타 엔터티에 이전 가능 |\n| **12번** | 서브쿼리를 벗어나면 사라지는 값들은 서브쿼리의 SELECT절에 명시되지 않은 칼럼들 뿐. |\n| **16번** | [MERGE JOIN = Sort Merge Join], WHERE절에 EQUI 조건 한 개만 있을 시 Hash 보다 |\n| 핵심 정리 | NL이 반드시 좋다고 할 수 없음. |\n| **23번** | 기본적으로 ..)` 옵션을 사용한다.\n\n### 3. 정규 표현식 (`Regular Expression`) 핵심 메타문자\n| 메타문자 | 의미 | 대표 예시 및 일치 문자열 |\n| :---: | :--- | :--- |\n| **`.`** | 임의의 **문자 1개**와 일치 | `a.c` ➔ `'abc'`, `'a1c'` 일치 (`'ac'` 불일치) |\n| **`^`** | 문자열의 **시작** (대괄호 `[^...]` 안에서는 **부정 NOT**!) | `^abc` ➔ `'abc'`로 시작하는 문자열 / `[^0-9]` ➔ 숫자가 아닌 문자 |\n| **`$`** | 문자열의 **끝** | `abc$` ➔ `'abc'`로 끝나는 문자열 |\n| **`*`** | 앞 문자가 **0회 이상** 반복 | `ab*c` ➔ `'ac'`, `'abc'`, `'abbc'` 모두 일치 |\n| **`+`** | 앞 문자가 **1회 이상** 반복 | `ab+c` ➔ `'abc'`, `'abbc'` 일치 (`'ac'` 불일치!) |\n| **`?`** | 앞 문자가 **0회 또는 1회** 등장 | `ab?c` ➔ `'ac'`, `'abc'` 일치 (`'abbc'` 불일치) |\n| **`{m,n}`** | 앞 문자가 **최소 m회 ~ 최대 n회** 반복 | `a{2,4}` ➔ `'aa'`, `'aaa'`, `'aaaa'` 일치 |\n| **`[abc]`** | 괄호 안의 문자 중 **하나라도** 일치 | `[0-9]` (숫자), `[a-zA-Z]` (영문자) |\n\n---\n\n## 6-6. 친구 공유 홍쌤 1과목 핵심 슬라이드 & 시각 자료 모음 (70장 전수 수록)\n\n![친구 공유 홍쌤 강의 핵심 슬라이드 1](images/friend_img_01.png)\n\n![친구 공유 홍쌤 강의 핵심 슬라이드 2](images/friend_img_02.png)\n\n![친구 공유 홍쌤 강의 핵심 슬라이드 3](images/friend_img_03.png)\n\n![친구 공유 홍쌤 강의 핵심 슬라이드 4](images/friend_img_04.png)\n\n![친구 공유 홍쌤 강의 핵심 슬라이드 5](images/friend_img_05.png)\n\n![친구 공유 홍쌤 강의 핵심 슬라이드 6](images/friend_img_06.png)\n\n![친구 공유 홍쌤 강의 핵심 슬라이드 7](images/friend_img_07.png)\n\n![친구 공유 홍쌤 강의 핵심 슬라이드 8](images/friend_img_08.png)\n\n![친구 공유 홍쌤 강의 핵심 슬라이드 9](images/friend_img_09.png)\n\n![친구 공유 홍쌤 강의 핵심 슬라이드 10](images/friend_img_10.png)\n\n![친구 공유 홍쌤 강의 핵심 슬라이드 11](images/friend_img_11.png)\n\n![친구 공유 홍쌤 강의 핵심 슬라이드 12](images/friend_img_12.png)\n\n![친구 공유 홍쌤 강의 핵심 슬라이드 13](images/friend_img_13.png)\n\n![친구 공유 홍쌤 강의 핵심 슬라이드 14](images/friend_img_14.png)\n\n![친구 공유 홍쌤 강의 핵심 슬라이드 15](images/friend_img_15.png)\n\n![친구 공유 홍쌤 강의 핵심 슬라이드 16](images/friend_img_16.png)\n\n![친구 공유 홍쌤 강의 핵심 슬라이드 17](images/friend_img_17.png)\n\n![친구 공유 홍쌤 강의 핵심 슬라이드 18](images/friend_img_18.png)\n\n![친구 공유 홍쌤 강의 핵심 슬라이드 19](images/friend_img_19.png)\n\n![친구 공유 홍쌤 강의 핵심 슬라이드 20](images/friend_img_20.png)\n\n![친구 공유 홍쌤 강의 핵심 슬라이드 21](images/friend_img_21.png)\n\n![친구 공유 홍쌤 강의 핵심 슬라이드 22]( 별자 단점  대신  정답: 길거나 변경 위험, 보안 이슈 함정: \"인조식별자는 항상 본질식별자보다 좋다\"  대신  정답: 상황에 따라 다름 함정: 인조식별자 도입 시 본질키 처리  대신  정답: UNIQUE 제약으로 무결성 보존"}, {"code": "2-1-1", "title": "[2-1-1] 관계형 데이터베이스 개요 (핵심 1분)", "script": "단원 2-1-1, 관계형 데이터베이스 개요입니다. 출제 빈도 ★★★★☆ 빈출 ! 핵심 암기 공식: DDL 수-자-카: CREATE, ALTER, DROP, RENAME, TRUNCATE / DML 세-인-업-딜 / DCL 그-리 / TCL 커-롤-세 . 과외 선배의 원포인트 코칭: 2과목 1번 문제는 보통 SQL 명령어 4대 분류 DDL / DML / DCL / TCL 짝짓기나 순수 관계 연산자 SELECT, PROJECT, JOIN, DIVIDE 에서 출제됩니다. 특히 TRUNCATE는 DELETE와 달리 DDL이다! 그리고 SELECT는 행 수평 추출, PROJECT는 열 수직 추출이라는 점을 절대 헷갈리지 마세요! 시험장 직전 30초 요약입니다. 반드시 기억할 단골 함정: 함정: TRUNCATE는 DDL인가 DML인가  대신  정답: DDL 롤백 불가 함정: DELETE는 어디에 속하는가  대신  정답: DML 롤백 가능 함정: COMMIT은  대신  정답: TCL 함정: GRANT/REVOKE는  대신  정답: DCL"}, {"code": "2-1-2", "title": "[2-1-2] SELECT 문 (핵심 1분)", "script": "단원 2-1-2, SELECT 문입니다. 출제 빈도 ★★★★★ 매회 1 2문항 출제 ! 핵심 암기 공식: SQL 작성 순서: 세-프-웨-그-해-오 / 논리적 실행 순서: 프-웨-그-해-세-오 FROM  대신  WHERE  대신  GROUP BY  대신  HAVING  대신  SELECT  대신  ORDER BY . 과외 선배의 원포인트 코칭: SELECT 문 실행 순서 FROM  대신  WHERE  대신  GROUP BY  대신  HAVING  대신  SELECT  대신  ORDER BY 가 모든 함정의 뿌리입니다! SELECT 절에서 정의한 컬럼 별칭 ALIAS 은 SELECT보다 먼저 실행되는 WHERE, GROUP BY, HAVING 절에서는 절대 사용할 수 없고, 가장 마지막에 실행되는 ORDER BY 절에서만 사용할 수 있다는 규칙이 시험에 매번 나옵니다! 시험장 직전 30초 요약입니다. 반드시 기억할 단골 함정: 함정: SELECT 실행 순서  대신  정답: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY 함정: WHERE에서 SELECT 별칭 사용 가능?  대신  정답: 불가 SELECT가 나중에 실행됨 함정: ORDER BY에서 SELECT 별칭 사용 가능?  대신  정답: 가능 함정: DISTINCT 적용 범위  대신  정답: SELECT 절 전체 여러 컬럼이면 조합 단위"}, {"code": "2-1-3", "title": "[2-1-3] 함수(Function) (핵심 1분)", "script": "단원 2-1-3, 함수 Function 입니다. 출제 빈도 ★★★★★ 매회 3 4문항 최다 출제! ! 핵심 암기 공식: NULL 함수 4대장: NVL a,b / NVL2 a,널아닐때,널일때 / NULLIF 같으면NULL,다르면앞에거 / COALESCE 첫NULL아닌값 . 과외 선배의 원포인트 코칭: 함수 파트는 계산 결과가 무엇인지 맞히는 문제가 3문제 이상 쏟아집니다! ① SUBSTR 'SQLD', 2, 2  대신  'QL', ② ROUND 15.36, 1 = 15.4, ROUND 15.36, -1 = 20 음수 자릿수는 소수점 왼쪽 반올림! , ③ CEIL -3.2 = -3  대  FLOOR -3.2 = -4  대  TRUNC -3.2 = -3 음수에서 바닥/버림 차이! , ④ NULLIF A, B 두 값이 같으면 NULL, 다르면 첫 번째 A 반환! 를 반드시 손으로 풀어보세요! 시험장 직전 30초 요약입니다. 반드시 기억할 단골 함정: 함정: SUBSTR 'ABCDE', 2, 3  대신  정답: 'BCD' 2번째부터 3글자 함정: Oracle LENGTH '한글'  대신  정답: 2 글자수 . LENGTHB는 바이트수 함정: MOD 10, 3  대신  정답: 1 함정: ROUND 3.456, 2  대신  정답: 3.46"}, {"code": "2-1-4", "title": "[2-1-4] WHERE 절 (핵심 1분)", "script": "단원 2-1-4, WHERE 절입니다. 출제 빈도 ★★★★★ 매회 2 3문항 100% 출제! ! 핵심 암기 공식: 연산자 우선순위: 괄호  대신  부정 NOT  대신  비교 =, LIKE, IN, BETWEEN  대신  AND  대신  OR / NOT IN ..., NULL = 무조건 0건!. 과외 선배의 원포인트 코칭: WHERE COL NOT IN 10, 20, NULL 의 결과는 무조건 0건 공집합 ! 왜냐하면 COL <> 10 AND COL <> 20 AND COL <> NULL로 풀리는데, COL <> NULL이 UNKNOWN이라서 AND 연산 전체가 UNKNOWN이 되기 때문입니다! 반대로 WHERE COL IN 10, 20, NULL 은 OR로 풀리므로 NULL만 무시되고 10, 20인 행이 정상 출력됩니다. 이 차이는 시험장 갈 때 팔뚝에 적어가야 할 수준으로 중요합니다! 시험장 직전 30초 요약입니다. 반드시 기억할 단골 함정: 함정: WHERE COMM = NULL 의 결과  대신  정답: 0건. IS NULL을 사용 함정: BETWEEN 100 AND 200  대신  정답: 100, 200 포함 양 끝 포함 함정: LIKE ' 김%'  대신  정답: 두 번째 글자가 '김'으로 시작 함정: IN a, b, c 은 OR과 같음  대신  정답: 옳음"}, {"code": "2-1-5", "title": "[2-1-5] GROUP BY, HAVING 절 (핵심 1분)", "script": "단원 2-1-5, GROUP BY, HAVING 절입니다. 출제 빈도 ★★★★★ 매회 2문항 100% 출제! ! 핵심 암기 공식: GROUP BY 시 SELECT 절에는 '그룹 기준 컬럼'과 '집계함수'만 가능! / HAVING 공집합 COUNT = 공집합!. 과외 선배의 원포인트 코칭: 여기서 수험생 90%가 틀리는 킬러 함정이 2개 있습니다: ① AVG NVL COL, 0 은 NULL을 0으로 바꾼 뒤 전체 행 수로 나누고, NVL AVG COL , 0 은 NULL을 제외하고 평균을 먼저 낸 뒤 전체가 NULL일 때만 0으로 바꾼다! ② 일반 WHERE 절에서 조건에 맞는 행이 없을 때 SELECT COUNT 는 0을 출력하지만, GROUP BY나 HAVING 절에서 조건에 맞는 그룹이 하나도 없을 때 SELECT COUNT 는 0이 아니라 공집합 No rows selected 을 반환한다! 34회 기출 23번 시험장 직전 30초 요약입니다. 반드시 기억할 단골 함정: 함정: WHERE에 집계함수 사용  대신  정답: 불가 → HAVING에서 사용 함정: GROUP BY에 없는 일반 컬럼을 SELECT에 사용  대신  정답: 불가 함정: HAVING은 GROUP BY 없이 쓸 수 있는가  대신  정답: 가능 전체를 1개 그룹으로 봄 함정: 실행 순서  대신  정답: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY"}, {"code": "2-1-6", "title": "[2-1-6] ORDER BY 절 (핵심 1분)", "script": "단원 2-1-6, ORDER BY 절입니다. 출제 빈도 ★★★★☆ 빈출 ! 핵심 암기 공식: Oracle은 NULL이 가장 큰 값 맨 뒤!  대  SQL Server는 NULL이 가장 작은 값 맨 앞! . 과외 선배의 원포인트 코칭: ORDER BY에서 시험에 나오는 건 딱 2가지입니다: ① Oracle은 NULL을 무한대 가장 큰 값 로 취급해서 오름차순 ASC 일 때 맨 마지막에 나오고 내림차순 DESC 일 때 맨 처음에 나온다! 반대로 SQL Server는 NULL을 가장 작은 값으로 취급해서 정반대다! ② GROUP BY를 사용한 쿼리에서는 ORDER BY 절에도 그룹 기준 컬럼이나 집계함수만 올 수 있다 일반 개별 행 컬럼으로 정렬 시도 시 에러! . 시험장 직전 30초 요약입니다. 반드시 기억할 단골 함정: 함정: ORDER BY 기본값  대신  정답: ASC 오름차순 함정: ORDER BY에서 SELECT 별칭 사용  대신  정답: 가능 함정: ORDER BY에서 컬럼 번호 숫자 사용  대신  정답: 가능 함정: Oracle ORDER BY ASC, NULL의 위치  대신  정답: 마지막"}, {"code": "2-1-7", "title": "[2-1-7] 조인(JOIN) (핵심 1분)", "script": "단원 2-1-7, 조인 JOIN 입니다. 출제 빈도 ★★★★★ 매회 1 2문항 출제 ! 핵심 암기 공식: N개 테이블 조인 시 최소 조인 조건 = N-1개 / 오라클 + 기호는 데이터가 부족한 자식 쪽에 붙인다!. 과외 선배의 원포인트 코칭: 오라클 외부 조인 기호 + 의 방향과 AND 조건 함정을 조심하세요! ① WHERE A.ID = B.ID + 는 +가 안 붙은 A 테이블이 기준 LEFT OUTER JOIN 입니다! ② 만약 WHERE A.ID = B.ID + AND B.DEPT = '영업'처럼 일반 조건에 + 를 빠뜨리면 외부 조인이 깨지고 내부 조인 INNER JOIN 으로 변질됩니다! 기준 테이블 A 의 모든 행을 살리려면 B.DEPT + = '영업'처럼 + 를 함께 붙여주거나 ANSI ON 절 안에 넣어야 합니다! 시험장 직전 30초 요약입니다. 반드시 기억할 단골 함정: 함정: 조인 조건이 빠지면  대신  정답: 카티션 곱 Cartesian Product 함정: Oracle 외부조인 표기  대신  정답: + 기호 NULL 보충될 쪽에 붙임 함정: N개 테이블 조인 시 조인 조건 수  대신  정답: 최소 N-1개 함정: Non-EQUI 조인 예  대신  정답: BETWEEN, >, < 등"}, {"code": "2-1-8", "title": "[2-1-8] 표준 조인 (ANSI Standard Join) (핵심 1분)", "script": "단원 2-1-8, 표준 조인 ANSI Standard Join 입니다. 출제 빈도 ★★★★★ 매회 2문항 100% 출제! ! 핵심 암기 공식: NATURAL JOIN & USING 절의 공통 기준 컬럼에는 테이블명/별칭 접두어 A.컬럼 절대 사용 금지!. 과외 선배의 원포인트 코칭: 표준 조인 ANSI JOIN 에서는 무조건 이 2가지가 출제됩니다! ① NATURAL JOIN이나 USING 공통컬럼 을 쓸 때, 그 공통 기준 컬럼 앞에는 SELECT 절이든 WHERE 절이든 절대 E.DEPTNO처럼 테이블 별칭 접두어 을 붙이면 에러가 난다! 반면 ON E.DEPTNO = D.DEPTNO 절을 쓸 때는 반대로 별칭을 반드시 붙여야 한다! , ② LEFT OUTER JOIN에서 추가 조건을 ON 절 안에 쓰면 왼쪽 테이블 행이 전부 살아남지만, WHERE 절에 쓰면 NULL 행이 걸러져서 건수가 줄어든다! 시험장 직전 30초 요약입니다. 반드시 기억할 단골 함정: 함정: INNER JOIN 키워드 생략 가능?  대신  정답: 가능. JOIN ... ON 이 INNER JOIN 함정: OUTER 키워드 생략 가능?  대신  정답: 가능. LEFT JOIN = LEFT OUTER JOIN 함정: NATURAL JOIN의 매칭 기준  대신  정답: 이름이 같은 모든 컬럼 함정: NATURAL JOIN에서 같은 이름 컬럼에 별칭  대신  정답: 사용 불가"}, {"code": "2-2-1", "title": "[2-2-1] 서브쿼리(Sub Query) (핵심 1분)", "script": "단원 2-2-1, 서브쿼리 Sub Query 입니다. 출제 빈도 ★★★★★ 매회 2문항 100% 출제! ! 핵심 암기 공식: 위치별 명칭: SELECT절 = 스칼라 서브쿼리 1행1열 / FROM절 = 인라인 뷰 동적 뷰 / WHERE, HAVING절 = 중첩 서브쿼리. 과외 선배의 원포인트 코칭: 서브쿼리 단골 포인트 4가지: ① SELECT 절의 스칼라 서브쿼리는 반드시 단일 행, 단일 컬럼만 반환해야 하며 결과가 0건이면 NULL을 반환하고 2건 이상이면 에러가 난다! ② EXISTS는 존재 여부만 체크하므로 SELECT 1이든 SELECT 이든 상관없으며 조건을 만족하는 행을 찾는 즉시 스캔을 멈춘다! ③ > ALL 10, 20 은 최댓값 20 보다 큰 것, > ANY 10, 20 은 최솟값 10 보다 큰 것! ④ 서브쿼리 안에는 ORDER BY를 쓸 수 없다 인라인 뷰 제외 . 시험장 직전 30초 요약입니다. 반드시 기억할 단골 함정: 함정: 다중행에 = 사용  대신  정답: 에러 → IN 사용 함정: > ANY 의미  대신  정답: 최솟값보다 크면 통과 함정: > ALL 의미  대신  정답: 최댓값보다 커야 통과 함정: 스칼라 서브쿼리 결과  대신  정답: 1행 1값"}, {"code": "2-2-2", "title": "[2-2-2] 집합 연산자(Set Operators) (핵심 1분)", "script": "단원 2-2-2, 집합 연산자 Set Operators 입니다. 출제 빈도 ★★★★☆ 매회 1문항 출제 ! 핵심 암기 공식: UNION / INTERSECT / MINUS EXCEPT = 중복 제거 + 자동 정렬 느림  대  UNION ALL = 중복 포함 + 정렬 없음 빠름! . 과외 선배의 원포인트 코칭: 집합 연산자 3대 공식: ① 결과 테이블의 컬럼 이름 별칭 은 무조건 첫 번째 SELECT 문을 따라간다! ② ORDER BY 절은 쿼리의 맨 마지막 줄에 딱 한 번만 쓸 수 있으며, 정렬 기준 컬럼 이름도 첫 번째 SELECT 문의 컬럼명 또는 별칭/순서번호 을 써야 한다! ③ 두 집합에 중복된 행이 하나도 없을 때 UNION과 UNION ALL은 행 건수는 같지만 정렬 순서가 다를 수 있으므로 완전히 똑같다고 할 수 없다 단, COUNT 건수 비교 문제에서는 같음! . 시험장 직전 30초 요약입니다. 반드시 기억할 단골 함정: 함정: 컬럼 개수가 다르면  대신  정답: 에러 함정: UNION  대  UNION ALL  대신  정답: UNION은 중복 제거, ALL은 그대로 함정: 결과 컬럼명 기준  대신  정답: 첫 SELECT 함정: ORDER BY 위치  대신  정답: 마지막에 한 번"}, {"code": "2-2-3", "title": "[2-2-3] 그룹 함수(Group Functions) (핵심 1분)", "script": "단원 2-2-3, 그룹 함수 Group Functions 입니다. 출제 빈도 ★★★★★ 매회 1 2문항 100% 출제! ! 핵심 암기 공식: ROLLUP A, B = N+1개 계층 소계+총계, 순서 중요! / CUBE A, B = 2^N개 모든 조합! / GROUPING SETS A, B = 개별 소계만 총계 없음! . 과외 선배의 원포인트 코칭: 그룹 함수는 출력되는 그룹 조합 개수 공식만 알면 10초 만에 풉니다! 컬럼이 2개 A, B 일 때: ① ROLLUP A, B  대신  A,B + A + 총계 = 3가지 순서 바꾸면 결과 달라짐! , ② CUBE A, B  대신  A,B + A + B + 총계 = $2^2 = 4$가지, ③ GROUPING SETS A, B  대신  A + B = 2가지 총계 없음! 총계 넣으려면 GROUPING SETS A, B, . 그리고 소계/총계 행에서 집계되어 합쳐진 자리에는 NULL이 찍히며, 이때 GROUPING 컬럼 함수는 집계로 생긴 가짜 NULL이면 1, 원래 데이터는 0을 반환합니다! 시험장 직전 30초 요약입니다. 반드시 기억할 단골 함정: 함정: ROLLUP A, B 결과 단계  대신  정답: A, B , A , 함정: CUBE A, B 결과 단계  대신  정답: A, B , A , B , 함정: 그룹함수에서 NULL 행의 의미  대신  정답: 소계 행 또는 원래 NULL 함정: GROUPING 함수 결과가 1이면  대신  정답: 소계 행"}, {"code": "2-2-4", "title": "[2-2-4] 윈도우 함수(Window Function) (핵심 1분)", "script": "단원 2-2-4, 윈도우 함수 Window Function 입니다. 출제 빈도 ★★★★★ 매회 2 3문항 100% 출제! ! 핵심 암기 공식: 순위: RANK 1,2,2,4 / DENSE RANK 1,2,2,3 / ROW NUMBER 1,2,3,4 | ORDER BY 넣는 순간 기본 프레임 = RANGE UNBOUNDED PRECEDING 누적합! . 과외 선배의 원포인트 코칭: 윈도우 함수에서 꼭 잡아야 할 핵심 3가지: ① 윈도우 함수는 GROUP BY와 달리 원래 테이블의 전체 행 건수를 절대 줄이지 않는다! ② SUM SAL OVER ORDER BY SAL 처럼 OVER 절 안에 ORDER BY를 적는 순간 기본 윈도우 프레임이 첫 행부터 현재 행까지의 누적 RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW 으로 바뀐다! ③ LAG 컬럼, N, 기본값 은 이전 행, LEAD 컬럼, N, 기본값 은 다음 행, PERCENT RANK는 순위-1 / 전체건수-1 양 끝값 0과 1 , CUME DIST는 누적건수 / 전체건수 1/N 1 입니다! 시험장 직전 30초 요약입니다. 반드시 기억할 단골 함정: 함정: RANK  대  DENSE RANK  대  ROW NUMBER  대신  정답: RANK 건너뜀 / DENSE RANK 연속 / ROW NUMBER 모두 다름 함정: OVER 빈 괄호  대신  정답: 전체를 한 윈도우로 함정: PARTITION BY 생략  대신  정답: 전체 행을 하나의 그룹으로 함정: 윈도우 함수에 WHERE 절 사용  대신  정답: WHERE에 직접 못 씀 → 인라인뷰 사용"}, {"code": "2-2-5", "title": "[2-2-5] Top N 쿼리 (핵심 1분)", "script": "단원 2-2-5, Top N 쿼리입니다. 출제 빈도 ★★★★★ 매회 1문항 100% 출제! ! 핵심 암기 공식: Oracle: 인라인뷰 정렬 후 바깥에서 ROWNUM <= N . 과외 선배의 원포인트 코칭: 오라클 ROWNUM의 2대 함정: ① SELECT FROM EMP WHERE ROWNUM <= 5 ORDER BY SAL DESC;는 정렬하기 전에 먼저 아무거나 5건을 뽑은 뒤 그 5명끼리만 정렬하는 오답 쿼리입니다! 반드시 인라인 뷰 FROM SELECT ... ORDER BY SAL DESC 안에서 먼저 정렬한 뒤 바깥 WHERE ROWNUM <= 5로 잘라야 합니다! ② ROWNUM은 1번이 만들어져야 2번이 부여되므로 WHERE ROWNUM = 2 또는 WHERE ROWNUM > 1은 영원히 0건 공집합 입니다! 시험장 직전 30초 요약입니다. 반드시 기억할 단골 함정: 함정: WHERE ROWNUM = 5  대신  정답: 결과 없음 1만 매칭 함정: ROWNUM과 ORDER BY 조합  대신  정답: 인라인 뷰로 정렬 먼저, ROWNUM은 나중에 함정: 동률 포함하려면  대신  정답: WITH TIES 또는 RANK 함정: 부서별 Top N  대신  정답: 윈도우 함수 ROW NUMBER + PARTITION BY"}, {"code": "2-2-6", "title": "[2-2-6] 계층형 질의와 셀프 조인 (핵심 1분)", "script": "단원 2-2-6, 계층형 질의와 셀프 조인입니다. 출제 빈도 ★★★★★ 매회 1 2문항 100% 출제! ! 핵심 암기 공식: PRIOR 자식 = 부모 부모 대신 자식 순방향 전개! '프자부순' / PRIOR 부모 = 자식 자식 대신 부모 역방향 전개! '프부자역' . 과외 선배의 원포인트 코칭: 계층형 질의는 이 암기법 하나로 끝납니다: CONNECT BY PRIOR EMPNO 자식/현재행 = MGR 부모  대신  '프자부순' PRIOR가 자식 쪽에 붙으면 부모에서 자식으로 내려가는 순방향 전개! 반대로 PRIOR MGR 부모 = EMPNO 자식  대신  '프부자역' 역방향 전개! 그리고 또 하나의 킬러 포인트: CONNECT BY 절에 쓴 조건은 해당 노드와 그 하위 자식들까지 통째로 전개를 멈추지만 단, START WITH 루트 노드는 무조건 살아남음! , WHERE 절에 쓴 조건은 계층 전개를 다 끝낸 뒤 마지막에 해당 행만 쏙 골라내서 지운다! 시험장 직전 30초 요약입니다. 반드시 기억할 단골 함정: 함정: START WITH의 의미  대신  정답: 루트 최상위 조건 함정: CONNECT BY PRIOR EMP ID = MGR ID  대신  정답: 순방향 부모→자식 함정: LEVEL의 시작 값  대신  정답: 1 루트 함정: 형제 정렬  대신  정답: ORDER SIBLINGS BY"}, {"code": "2-2-7", "title": "[2-2-7] PIVOT 절과 UNPIVOT 절 (핵심 1분)", "script": "단원 2-2-7, PIVOT 절과 UNPIVOT 절입니다. 출제 빈도 ★★★★☆ 2024 개정 신유형 집중 출제! ! 핵심 암기 공식: PIVOT 행  대신  열 가로 펼치기: 집계함수 + FOR 기준컬럼 IN ... / UNPIVOT 열  대신  행 세로 모으기: 기본은 EXCLUDE NULLS! . 과외 선배의 원포인트 코칭: 2024 개정판에서 새롭게 추가된 신유형 단원입니다! ① PIVOT 집계함수 값컬럼 FOR 펼칠컬럼 IN 값1, 값2... 에서 괄호 안에 적히지 않은 나머지 컬럼들이 자동으로 GROUP BY 기준 컬럼이 되므로, 원본 테이블을 그대로 쓰지 않고 필요한 컬럼만 뽑은 인라인 뷰를 FROM 절에 씁니다! ② UNPIVOT은 기본적으로 값이 NULL인 열은 행으로 만들지 않고 제외 EXCLUDE NULLS 하며, NULL까지 포함하려면 UNPIVOT INCLUDE NULLS를 씁니다! 시험장 직전 30초 요약입니다. 반드시 기억할 단골 함정: 함정: PIVOT의 결과 모양  대신  정답: 행 → 컬럼으로 변환 함정: UNPIVOT의 결과 모양  대신  정답: 컬럼 → 행으로 변환 함정: PIVOT의 IN 절  대신  정답: 변환할 값들 나열 함정: 매칭 안 되는 칸  대신  정답: NULL"}, {"code": "2-2-8", "title": "[2-2-8] 정규 표현식(Regular Expression) (핵심 1분)", "script": "단원 2-2-8, 정규 표현식 Regular Expression 입니다. 출제 빈도 ★★★★☆ 2024 개정 신유형 집중 출제! ! 핵심 암기 공식: ^문자열시작  대  ^괄호안부정NOT / $문자열끝 / 0회이상 / + 1회이상 / ? 0또는1회 / . 임의의 1글자 . 과외 선배의 원포인트 코칭: 정규 표현식도 2024 개정 신유형으로 매회 1문제씩 나옵니다! 가장 많이 나오는 함정은 ^ 기호의 두 얼굴: 대괄호 밖에서 ^A는 'A'로 시작하는 문자열이지만, 대괄호 안에서 ^0-9 는 '숫자가 아닌 NOT 문자'입니다! 또한 는 0회 이상 ab c에 'ac' 포함! , +는 1회 이상 ab+c에 'ac' 불포함! 이라는 수량자 차이와 REGEXP SUBSTR, REGEXP REPLACE, REGEXP LIKE 함수 인수를 꼭 익혀두세요! 시험장 직전 30초 요약입니다. 반드시 기억할 단골 함정: 함정: ^ 의 의미  대신  정답: 문자열의 시작 안에선 부정 함정: $ 의 의미  대신  정답: 문자열의 끝 함정:  대  +  대신  정답: 은 0개 이상, + 은 1개 이상 함정: . 의 의미  대신  정답: 임의의 한 글자 LIKE의 와 같음"}, {"code": "2-3-1", "title": "[2-3-1] DML (Data Manipulation Language) (핵심 1분)", "script": "단원 2-3-1, DML Data Manipulation Language 입니다. 출제 빈도 ★★★★★ 매회 1 2문항 출제 ! 핵심 암기 공식: 빈 문자열 '' 입력 시: Oracle = NULL IS NULL 조회  대  SQL Server = '' 공백 그대로 = '' 조회 / MERGE의 DELETE는 UPDATE된 건만!. 과외 선배의 원포인트 코칭: DML 파트에서 출제위원이 가장 좋아하는 함정 3가지: ① INSERT INTO T VALUES '' 를 실행했을 때, 오라클은 빈 문자열 ''을 NULL로 저장하므로 WHERE COL IS NULL로 찾아야 하지만, SQL Server는 빈 문자열 '' 그대로 저장하므로 WHERE COL = ''로 찾아야 한다! ② DELETE FROM 테이블명;에서 FROM은 생략 가능하지만 DELETE FROM처럼 를 쓰면 문법 에러다! ③ MERGE INTO 구문에서 WHEN MATCHED THEN UPDATE ... DELETE WHERE ...의 DELETE 절은 오직 방금 UPDATE가 수행된 행들에 대해서만 동작한다! 30회 기출 42번 시험장 직전 30초 요약입니다. 반드시 기억할 단골 함정: 함정: TRUNCATE는 DDL인가 DML인가  대신  정답: DDL 롤백 불가 함정: DELETE 후 ROLLBACK 가능?  대신  정답: 가능 DML 함정: INSERT INTO ... VALUES 는 한 번에 한 행만?  대신  정답: 일반 INSERT는 1행. INSERT ALL 또는 INSERT INTO ... SELECT 로 다중행 함정: UPDATE ... WHERE 누락 시  대신  정답: 모든 행 수정"}, {"code": "2-3-2", "title": "[2-3-2] TCL (Transaction Control Language) (핵심 1분)", "script": "단원 2-3-2, TCL Transaction Control Language 입니다. 출제 빈도 ★★★★★ 매회 1 2문항 100% 출제! ! 핵심 암기 공식: ACID 원자성, 일관성, 고립성, 영속성 / Oracle은 DML 시작 시 트랜잭션 자동 시작 + DDL 실행 시 앞선 DML까지 AUTO COMMIT!. 과외 선배의 원포인트 코칭: TCL에서 무조건 나오는 3가지: ① 오라클에서 INSERT/UPDATE를 한 뒤 COMMIT을 안 하고 곧바로 CREATE/ALTER/DROP/TRUNCATE DDL 를 실행하면, DDL이 실행되는 순간 앞선 DML까지 자동으로 COMMIT되어 이후 ROLLBACK을 해도 되돌릴 수 없다! 반면 SQL Server는 DDL도 트랜잭션에 포함되어 ROLLBACK 가능! , ② SAVEPOINT A 이후 SAVEPOINT B를 만들고 ROLLBACK TO A를 실행하면, A 이후에 만든 B는 소멸되어 다시 ROLLBACK TO B를 할 수 없다! ③ 고립성 낮을 때 발생하는 3대 현상 Dirty Read, Non-Repeatable Read, Phantom Read 정의 구분! 시험장 직전 30초 요약입니다. 반드시 기억할 단골 함정: 함정: TCL 명령어 종류  대신  정답: COMMIT / ROLLBACK / SAVEPOINT 함정: DDL 실행 후  대신  정답: Oracle은 자동 COMMIT 함정: ROLLBACK의 범위  대신  정답: 마지막 COMMIT 이후 모든 DML 함정: SAVEPOINT의 의미  대신  정답: 부분 ROLLBACK 가능 지점"}, {"code": "2-3-3", "title": "[2-3-3] DDL (Data Definition Language) (핵심 1분)", "script": "단원 2-3-3, DDL Data Definition Language 입니다. 출제 빈도 ★★★★★ 매회 2문항 100% 출제! ! 핵심 암기 공식: DELETE DML, 롤백O, 로그남김  대  TRUNCATE DDL, 롤백X, 구조유지, 용량초기화  대  DROP DDL, 롤백X, 테이블완전삭제 . 과외 선배의 원포인트 코칭: DDL 파트에서 시험에 나오는 핵심 4가지: ① DELETE  대  TRUNCATE  대  DROP 비교표는 100% 출제됩니다! ② CREATE TABLE 새테이블 AS SELECT ... CTAS 로 테이블을 복제하면 NOT NULL 제약조건만 복사되고 PK, FK, UNIQUE, CHECK, DEFAULT는 전부 날아간다! ③ 컬럼 변경 문법 차이: Oracle은 ALTER TABLE T MODIFY 컬럼 ... 괄호 O , SQL Server는 ALTER TABLE T ALTER COLUMN 컬럼 ... 괄호 X, 여러 컬럼 동시 수정 불가! ④ ON DELETE SET NULL이 걸려 있어도 자식 외래키 컬럼이 NOT NULL이면 부모 행 삭제가 불가능하다! 시험장 직전 30초 요약입니다. 반드시 기억할 단골 함정: 함정: TRUNCATE 분류  대신  정답: DDL 함정: DDL 실행 후 ROLLBACK 가능?  대신  정답: 불가 자동 COMMIT 함정: PRIMARY KEY는 NULL 허용?  대신  정답: 불허 함정: UNIQUE는 NULL 허용?  대신  정답: 허용"}, {"code": "2-3-4", "title": "[2-3-4] DCL (Data Control Language) (핵심 1분)", "script": "단원 2-3-4, DCL Data Control Language 입니다. 출제 빈도 ★★★★★ 매회 1문항 100% 출제! ! 핵심 암기 공식: 객체 권한 ON 테이블 재부여 = WITH GRANT OPTION 연쇄 회수 O! / 시스템 권한 재부여 = WITH ADMIN OPTION 연쇄 회수 X, 유지됨! . 과외 선배의 원포인트 코칭: 마지막 단원 DCL은 딱 한 문제 나오는데, 출제 포인트가 정해져 있습니다! A가 B에게 권한을 주고 B가 C에게 재부여한 뒤 A가 B의 권한을 REVOKE 회수 했을 때: ① 객체 권한 옵션인 WITH GRANT OPTION은 C의 권한까지 도미노처럼 연쇄 회수 Cascade Revoke 되지만, ② 시스템 권한 옵션인 WITH ADMIN OPTION은 B의 권한만 회수되고 C가 받은 권한은 그대로 살아남는다! 이 표 하나만 기억하면 무조건 맞힙니다! 시험장 직전 30초 요약입니다. 반드시 기억할 단골 함정: 함정: DCL 명령어  대신  정답: GRANT, REVOKE 함정: 시스템 권한 부여 시 옵션  대신  정답: WITH ADMIN OPTION 함정: 객체 권한 부여 시 옵션  대신  정답: WITH GRANT OPTION 함정: ROLE의 목적  대신  정답: 권한 묶음을 한 번에 관리"}], "long": [{"code": "1-1-1", "title": "[1-1-1] 데이터 모델의 이해 (상세 3분 강의)", "script": "반갑습니다 희호님! 지금부터 1-1-1단원, 데이터 모델의 이해 정규 과외 강의를 시작하겠습니다. 이번 단원은 출제 빈도가 ★★★★★ 매회 1문항 100% 출제 로 매우 중요한 파트입니다. 먼저 이번 단원을 1초 만에 뚫어내는 마법의 두문자 암기 공식입니다. 특징: 추, 단, 명 / 유의점: 중, 비, 비 / 단계: 개, 논, 물 / 스키마: 외, 개, 내. 머릿속에 이 글자들을 꼭 각인해 두세요. 과외선배의 집중 코칭입니다. 1과목 첫 문제는 무조건 이 단원에서 나옵니다! '추상화, 단순화, 명확화 추단명 ' 뜻 섞어놓기, '정규화는 논리적 모델링 단계'라는 점, 그리고 '개념 스키마가 바뀌어도 외부 스키마는 영향 없다 = 논리적 독립성'만 잡으면 2점 거저먹는 단원입니다. 자, 그럼 출제위원들이 파놓는 대표적인 함정들을 짚어드리겠습니다. 함정: 물리적 모델링이 가장 먼저다  대신  정답: 개념 → 논리 → 물리 순서 함정: 데이터 모델은 코드를 위한 것  대신  정답: 현실 세계를 추상화한 것 함정: 좋은 모델은 데이터 중복을 일부 허용한다  대신  정답: 원칙은 중복 배제. 다만 성능을 위해 의도적으로 허용하는 반정규화는 별개 함정: 데이터 모델링 3대 관점  대신  정답: 데이터 / 프로세스 / 상관관계 여기에 더해, 노랭이와 실제 기출문제에서 수험생들이 가장 많이 틀린 족보입니다. 노랭이 1과목 8번 ERD 작성 시 가장 중요한 엔터티는  집중 코칭입니다. WHERE COL NOT IN 10, 20, NULL 의 결과는 무조건 0건 공집합 ! 왜냐하면 COL <> 10 AND COL <> 20 AND COL <> NULL로 풀리는데, COL <> NULL이 UNKNOWN이라서 AND 연산 전체가 UNKNOWN이 되기 때문입니다! 반대로 WHERE COL IN 10, 20, NULL 은 OR로 풀리므로 NULL만 무시되고 10, 20인 행이 정상 출력됩니다. 이 차이는 시험장 갈 때 팔뚝에 적어가야 할 수준으로 중요합니다! 자, 그럼 출제위원들이 파놓는 대표적인 함정들을 짚어드리겠습니다. 함정: WHERE COMM = NULL 의 결과  대신  정답: 0건. IS NULL을 사용 함정: BETWEEN 100 AND 200  대신  정답: 100, 200 포함 양 끝 포함 함정: LIKE ' 김%'  대신  정답: 두 번째 글자가 '김'으로 시작 함정: IN a, b, c 은 OR과 같음  대신  정답: 옳음 여기에 더해, 노랭이와 실제 기출문제에서 수험생들이 가장 많이 틀린 족보입니다. 21회 기출 3번 & 30회 기출 15번 ★최빈출 IN 연산에 NULL이 포함되어 있으면 OR 연산이므로 NULL을 무시하고 나머지 일치하는 행을 출력하지만, NOT IN 연산에 NULL이 하나라도 포함되어 있으면 AND 연산이므로 전체 조건이 UNKNOWN이 되어 결과는 항상 0건 공집합 이 반환된다! 노랭이 2과목 37, 45번 VARCHAR2 컬럼에 모든 데이터가 숫자로만 들어있으면 숫자와 비교 가능 자동 형변환 . 단, 숫자가 아닌 문자가 하나라도 섞여 있으면 ORA-01722 수치가 부적합합니다 에러 발생! 노랭이 2과목 79번 다중 컬럼에 대해 A, B NOT IN 1, 2 , 3, 4 와 A NOT IN 1, 3 AND B NOT IN 2, 4 는 전혀 다른 결과를 반환한다 다중 컬럼은 묶어서 비교해야 함 . 마지막으로 시험장 입실 직전 30초 최종 요약입니다. 이 공식과 함정을 기억하시면 이 단원 문제는 무조건 2점 확보입니다. 다음 단원으로 넘어가겠습니다!"}, {"code": "2-1-5", "title": "[2-1-5] GROUP BY, HAVING 절 (상세 3분 강의)", "script": "반갑습니다 희호님! 지금부터 2-1-5단원, GROUP BY, HAVING 절 정규 과외 강의를 시작하겠습니다. 이번 단원은 출제 빈도가 ★★★★★ 매회 2문항 100% 출제! 로 매우 중요한 파트입니다. 먼저 이번 단원을 1초 만에 뚫어내는 마법의 두문자 암기 공식입니다. GROUP BY 시 SELECT 절에는 '그룹 기준 컬럼'과 '집계함수'만 가능! / HAVING 공집합 COUNT = 공집합!. 머릿속에 이 글자들을 꼭 각인해 두세요. 과외선배의 집중 코칭입니다. 여기서 수험생 90%가 틀리는 킬러 함정이 2개 있습니다: ① AVG NVL COL, 0 은 NULL을 0으로 바꾼 뒤 전체 행 수로 나누고, NVL AVG COL , 0 은 NULL을 제외하고 평균을 먼저 낸 뒤 전체가 NULL일 때만 0으로 바꾼다! ② 일반 WHERE 절에서 조건에 맞는 행이 없을 때 SELECT COUNT 는 0을 출력하지만, GROUP BY나 HAVING 절에서 조건에 맞는 그룹이 하나도 없을 때 SELECT COUNT 는 0이 아니라 공집합 No rows selected 을 반환한다! 34회 기출 23번 자, 그럼 출제위원들이 파놓는 대표적인 함정들을 짚어드리겠습니다. 함정: WHERE에 집계함수 사용  대신  정답: 불가 → HAVING에서 사용 함정: GROUP BY에 없는 일반 컬럼을 SELECT에 사용  대신  정답: 불가 함정: HAVING은 GROUP BY 없이 쓸 수 있는가  대신  정답: 가능 전체를 1개 그룹으로 봄 함정: 실행 순서  대신  정답: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY 여기에 더해, 노랭이와 실제 기출문제에서 수험생들이 가장 많이 틀린 족보입니다. 노랭이 2과목 51, 53, 56번 ★중요체크 GROUP BY 기준 칼럼에 NULL 값들이 있을 경우 NULL끼리도 하나의 그룹으로 묶여 집계된다! 또한 GROUP BY 사용 시 SELECT 절에는 그룹 대상 칼럼과 집계함수 외의 일반 칼럼은 올 수 없다. 34회 기출 23번 ★전설의 킬러 문항 일반 SELECT COUNT FROM EMP WHERE 1=2;는 결과 행이 0이라는 1건이 출력되지만, GROUP BY 및 HAVING 절을 사용하여 만족하는 그룹이 하나도 없을 때는 그룹 자체의 결과 집합이 생성되지 않으므로 COUNT 도 0이 아닌 공집합 0행 이 반환된다! 34회 기출 27번 WHERE 절에는 집계함수를 직접 사용할 수 없다 단, WHERE 절 내부의 서브쿼리 안에서는 사용 가능 . 마지막으로 시험장 입실 직전 30초 최종 요약입니다. 이 공식과 함정을 기억하시면 이 단원 문제는 무조건 2점 확보입니다. 다음 단원으로 넘어가겠습니다!"}, {"code": "2-1-6", "title": "[2-1-6] ORDER BY 절 (상세 3분 강의)", "script": "반갑습니다 희호님! 지금부터 2-1-6단원, ORDER BY 절 정규 과외 강의를 시작하겠습니다. 이번 단원은 출제 빈도가 ★★★★☆ 빈출 로 매우 중요한 파트입니다. 먼저 이번 단원을 1초 만에 뚫어내는 마법의 두문자 암기 공식입니다. Oracle은 NULL이 가장 큰 값 맨 뒤!  대  SQL Server는 NULL이 가장 작은 값 맨 앞! . 머릿속에 이 글자들을 꼭 각인해 두세요. 과외선배의 집중 코칭입니다. ORDER BY에서 시험에 나오는 건 딱 2가지입니다: ① Oracle은 NULL을 무한대 가장 큰 값 로 취급해서 오름차순 ASC 일 때 맨 마지막에 나오고 내림차순 DESC 일 때 맨 처음에 나온다! 반대로 SQL Server는 NULL을 가장 작은 값으로 취급해서 정반대다! ② GROUP BY를 사용한 쿼리에서는 ORDER BY 절에도 그룹 기준 컬럼이나 집계함수만 올 수 있다 일반 개별 행 컬럼으로 정렬 시도 시 에러! . 자, 그럼 출제위원들이 파놓는 대표적인 함정들을 짚어드리겠습니다. 함정: ORDER BY 기본값  대신  정답: ASC 오름차순 함정: ORDER BY에서 SELECT 별칭 사용  대신  정답: 가능 함정: ORDER BY에서 컬럼 번호 숫자 사용  대신  정답: 가능 함정: Oracle ORDER BY ASC, NULL의 위치  대신  정답: 마지막 여기에 더해, 노랭이와 실제 기출문제에서 수험생들이 가장 많이 틀린 족보입니다. 빈출 핵심 ORDER BY 절에서는 컬럼명, SELECT 절에 정의한 별칭 Alias , 그리고 SELECT 절의 컬럼 순서 번호 1, 2, ... 를 모두 혼용하여 사용할 수 있다. 마지막으로 시험장 입실 직전 30초 최종 요약입니다. 이 공식과 함정을 기억하시면 이 단원 문제는 무조건 2점 확보입니다. 다음 단원으로 넘어가겠습니다!"}, {"code": "2-1-7", "title": "[2-1-7] 조인(JOIN) (상세 3분 강의)", "script": "반갑습니다 희호님! 지금부터 2-1-7단원, 조인 JOIN 정규 과외 강의를 시작하겠습니다. 이번 단원은 출제 빈도가 ★★★★★ 매회 1 2문항 출제 로 매우 중요한 파트입니다. 먼저 이번 단원을 1초 만에 뚫어내는 마법의 두문자 암기 공식입니다. N개 테이블 조인 시 최소 조인 조건 = N-1개 / 오라클 + 기호는 데이터가 부족한 자식 쪽에 붙인다!. 머릿속에 이 글자들을 꼭 각인해 두세요. 과외선배의 집중 코칭입니다. 오라클 외부 조인 기호 + 의 방향과 AND 조건 함정을 조심하세요! ① WHERE A.ID = B.ID + 는 +가 안 붙은 A 테이블이 기준 LEFT OUTER JOIN 입니다! ② 만약 WHERE A.ID = B.ID + AND B.DEPT = '영업'처럼 일반 조건에 + 를 빠뜨리면 외부 조인이 깨지고 내부 조인 INNER JOIN 으로 변질됩니다! 기준 테이블 A 의 모든 행을 살리려면 B.DEPT + = '영업'처럼 + 를 함께 붙여주거나 ANSI ON 절 안에 넣어야 합니다! 자, 그럼 출제위원들이 파놓는 대표적인 함정들을 짚어드리겠습니다. 함정: 조인 조건이 빠지면  대신  정답: 카티션 곱 Cartesian Product 함정: Oracle 외부조인 표기  대신  정답: + 기호 NULL 보충될 쪽에 붙임 함정: N개 테이블 조인 시 조인 조건 수  대신  정답: 최소 N-1개 함정: Non-EQUI 조인 예  대신  정답: BETWEEN, >, < 등 여기에 더해, 노랭이와 실제 기출문제에서 수험생들이 가장 많이 틀린 족보입니다. 노랭이 2과목 77번 ★중요체크 Oracle에서 + 기호가 붙은 반대 방향 쪽으로 OUTER JOIN이 수행되며, 조인 대상 테이블의 추가 필터 조건에도 + 표시가 함께 있어야 ANSI 표준의 ON 절 안에 조건을 함께 작성한 것과 동일한 결과가 나온다 + 를 안 붙이면 WHERE 절 필터가 되어 INNER JOIN 결과와 같아짐! . 30회 기출 30번 '구매 이력이 없는 회원을 포함한 모든 회원의 구매 금액 합계'를 구하라고 할 때 INNER JOIN을 쓰면 구매 안 한 회원이 누락되므로 반드시 OUTER JOIN을 사용해야 한다. 마지막으로 시험장 입실 직전 30초 최종 요약입니다. 이 공식과 함정을 기억하시면 이 단원 문제는 무조건 2점 확보입니다. 다음 단원으로 넘어가겠습니다!"}, {"code": "2-1-8", "title": "[2-1-8] 표준 조인 (ANSI Standard Join) (상세 3분 강의)", "script": "반갑습니다 희호님! 지금부터 2-1-8단원, 표준 조인 ANSI Standard Join 정규 과외 강의를 시작하겠습니다. 이번 단원은 출제 빈도가 ★★★★★ 매회 2문항 100% 출제! 로 매우 중요한 파트입니다. 먼저 이번 단원을 1초 만에 뚫어내는 마법의 두문자 암기 공식입니다. NATURAL JOIN & USING 절의 공통 기준 컬럼에는 테이블명/별칭 접두어 A.컬럼 절대 사용 금지!. 머릿속에 이 글자들을 꼭 각인해 두세요. 과외선배의 집중 코칭입니다. 표준 조인 ANSI JOIN 에서는 무조건 이 2가지가 출제됩니다! ① NATURAL JOIN이나 USING 공통컬럼 을 쓸 때, 그 공통 기준 컬럼 앞에는 SELECT 절이든 WHERE 절이든 절대 E.DEPTNO처럼 테이블 별칭 접두어 을 붙이면 에러가 난다! 반면 ON E.DEPTNO = D.DEPTNO 절을 쓸 때는 반대로 별칭을 반드시 붙여야 한다! , ② LEFT OUTER JOIN에서 추가 조건을 ON 절 안에 쓰면 왼쪽 테이블 행이 전부 살아남지만, WHERE 절에 쓰면 NULL 행이 걸러져서 건수가 줄어든다! 자, 그럼 출제위원들이 파놓는 대표적인 함정들을 짚어드리겠습니다. 함정: INNER JOIN 키워드 생략 가능?  대신  정답: 가능. JOIN ... ON 이 INNER JOIN 함정: OUTER 키워드 생략 가능?  대신  정답: 가능. LEFT JOIN = LEFT OUTER JOIN 함정: NATURAL JOIN의 매칭 기준  대신  정답: 이름이 같은 모든 컬럼 함정: NATURAL JOIN에서 같은 이름 컬럼에 별칭  대신  정답: 사용 불가 여기에 더해, 노랭이와 실제 기출문제에서 수험생들이 가장 많이 틀린 족보입니다. 노랭이 2과목 70번 & 21회 기출 21번 ★최빈출 NATURAL JOIN에서 사용된 열이나 USING 절의 기준 열에는 테이블 이름이나 별칭 Alias, 접두사 을 절대 붙일 수 없다! 오직 컬럼명만 단독 기술 30회 기출 35번 CROSS JOIN과 NATURAL JOIN은 ON 절 조인 조건절 을 사용할 수 없을 뿐, WHERE 절에서 일반 검색 조건은 얼마든지 걸 수 있다. 34회 기출 31번 CROSS JOIN은 조인 조건 없이 왼쪽 테이블 N행과 오른쪽 테이블 M행을 가능한 모든 조합 N × M행 으로 곱집합 출력하며, OUTER JOIN과는 전혀 다르다. 마지막으로 시험장 입실 직전 30초 최종 요약입니다. 이 공식과 함정을 기억하시면 이 단원 문제는 무조건 2점 확보입니다. 다음 단원으로 넘어가겠습니다!"}, {"code": "2-2-1", "title": "[2-2-1] 서브쿼리(Sub Query) (상세 3분 강의)", "script": "반갑습니다 희호님! 지금부터 2-2-1단원, 서브쿼리 Sub Query 정규 과외 강의를 시작하겠습니다. 이번 단원은 출제 빈도가 ★★★★★ 매회 2문항 100% 출제! 로 매우 중요한 파트입니다. 먼저 이번 단원을 1초 만에 뚫어내는 마법의 두문자 암기 공식입니다. 위치별 명칭: SELECT절 = 스칼라 서브쿼리 1행1열 / FROM절 = 인라인 뷰 동적 뷰 / WHERE, HAVING절 = 중첩 서브쿼리. 머릿속에 이 글자들을 꼭 각인해 두세요. 과외선배의 집중 코칭입니다. 서브쿼리 단골 포인트 4가지: ① SELECT 절의 스칼라 서브쿼리는 반드시 단일 행, 단일 컬럼만 반환해야 하며 결과가 0건이면 NULL을 반환하고 2건 이상이면 에러가 난다! ② EXISTS는 존재 여부만 체크하므로 SELECT 1이든 SELECT 이든 상관없으며 조건을 만족하는 행을 찾는 즉시 스캔을 멈춘다! ③ > ALL 10, 20 은 최댓값 20 보다 큰 것, > ANY 10, 20 은 최솟값 10 보다 큰 것! ④ 서브쿼리 안에는 ORDER BY를 쓸 수 없다 인라인 뷰 제외 . 자, 그럼 출제위원들이 파놓는 대표적인 함정들을 짚어드리겠습니다. 함정: 다중행에 = 사용  대신  정답: 에러 → IN 사용 함정: > ANY 의미  대신  정답: 최솟값보다 크면 통과 함정: > ALL 의미  대신  정답: 최댓값보다 커야 통과 함정: 스칼라 서브쿼리 결과  대신  정답: 1행 1값 여기에 더해, 노랭이와 실제 기출문제에서 수험생들이 가장 많이 틀린 족보입니다. 노랭이 2과목 66, 95, 99, 100번 ★중요체크 ① EXISTS 절은 존재 유무만 판단한다. ② 다중 컬럼 서브쿼리는 SQL Server에서 지원하지 않는다. ③ 다중 행 비교 연산자 IN, ALL, ANY 는 단일 행 서브쿼리의 비교 연산자로도 사용할 수 있다 반대는 불가! . ④ 스칼라 서브쿼리는 OUTER JOIN으로 동일한 결과를 추출할 수 있으며, 인라인 뷰 Inline View 는 SQL이 실행될 때만 임시로 생성되는 동적 뷰 Dynamic View 이다. 30회 기출 12번 스칼라 서브쿼리에서 한 번의 값 전달에 2개 이상의 행이 반환될 수 없다 단일행, 단일칼럼만 가능 . 34회 기출 12번 인라인 뷰 서브쿼리 를 벗어나면 메인쿼리에서 참조할 수 없는 값들은 인라인 뷰의 SELECT 절에 명시되지 않은 칼럼들뿐이다 인라인 뷰의 SELECT 절에 명시된 칼럼은 메인쿼리 전체에서 사용 가능! . 마지막으로 시험장 입실 직전 30초 최종 요약입니다. 이 공식과 함정을 기억하시면 이 단원 문제는 무조건 2점 확보입니다. 다음 단원으로 넘어가겠습니다!"}, {"code": "2-2-2", "title": "[2-2-2] 집합 연산자(Set Operators) (상세 3분 강의)", "script": "반갑습니다 희호님! 지금부터 2-2-2단원, 집합 연산자 Set Operators 정규 과외 강의를 시작하겠습니다. 이번 단원은 출제 빈도가 ★★★★☆ 매회 1문항 출제 로 매우 중요한 파트입니다. 먼저 이번 단원을 1초 만에 뚫어내는 마법의 두문자 암기 공식입니다. UNION / INTERSECT / MINUS EXCEPT = 중복 제거 + 자동 정렬 느림  대  UNION ALL = 중복 포함 + 정렬 없음 빠름! . 머릿속에 이 글자들을 꼭 각인해 두세요. 과외선배의 집중 코칭입니다. 집합 연산자 3대 공식: ① 결과 테이블의 컬럼 이름 별칭 은 무조건 첫 번째 SELECT 문을 따라간다! ② ORDER BY 절은 쿼리의 맨 마지막 줄에 딱 한 번만 쓸 수 있으며, 정렬 기준 컬럼 이름도 첫 번째 SELECT 문의 컬럼명 또는 별칭/순서번호 을 써야 한다! ③ 두 집합에 중복된 행이 하나도 없을 때 UNION과 UNION ALL은 행 건수는 같지만 정렬 순서가 다를 수 있으므로 완전히 똑같다고 할 수 없다 단, COUNT 건수 비교 문제에서는 같음! . 자, 그럼 출제위원들이 파놓는 대표적인 함정들을 짚어드리겠습니다. 함정: 컬럼 개수가 다르면  대신  정답: 에러 함정: UNION  대  UNION ALL  대신  정답: UNION은 중복 제거, ALL은 그대로 함정: 결과 컬럼명 기준  대신  정답: 첫 SELECT 함정: ORDER BY 위치  대신  정답: 마지막에 한 번 여기에 더해, 노랭이와 실제 기출문제에서 수험생들이 가장 많이 틀린 족보입니다. 노랭이 2과목 82, 86번 ★중요체크 ① 집합 연산자 사용 시 같은 칼럼의 ALIAS가 각 모듈마다 다르게 선언될 경우, 첫 번째 SELECT 모듈에 선언된 ALIAS가 최종 적용된다. ② UNION과 UNION ALL 결과에 대해 바깥에서 SELECT COUNT 를 수행하는 경우, 교집합 중복 행 이 없다면 두 쿼리의 결과 건수 COUNT 는 동일하다. 마지막으로 시험장 입실 직전 30초 최종 요약입니다. 이 공식과 함정을 기억하시면 이 단원 문제는 무조건 2점 확보입니다. 다음 단원으로 넘어가겠습니다!"}, {"code": "2-2-3", "title": "[2-2-3] 그룹 함수(Group Functions) (상세 3분 강의)", "script": "반갑습니다 희호님! 지금부터 2-2-3단원, 그룹 함수 Group Functions 정규 과외 강의를 시작하겠습니다. 이번 단원은 출제 빈도가 ★★★★★ 매회 1 2문항 100% 출제! 로 매우 중요한 파트입니다. 먼저 이번 단원을 1초 만에 뚫어내는 마법의 두문자 암기 공식입니다. ROLLUP A, B = N+1개 계층 소계+총계, 순서 중요! / CUBE A, B = 2^N개 모든 조합! / GROUPING SETS A, B = 개별 소계만 총계 없음! . 머릿속에 이 글자들을 꼭 각인해 두세요. 과외선배의 집중 코칭입니다. 그룹 함수는 출력되는 그룹 조합 개수 공식만 알면 10초 만에 풉니다! 컬럼이 2개 A, B 일 때: ① ROLLUP A, B  대신  A,B + A + 총계 = 3가지 순서 바꾸면 결과 달라짐! , ② CUBE A, B  대신  A,B + A + B + 총계 = $2^2 = 4$가지, ③ GROUPING SETS A, B  대신  A + B = 2가지 총계 없음! 총계 넣으려면 GROUPING SETS A, B, . 그리고 소계/총계 행에서 집계되어 합쳐진 자리에는 NULL이 찍히며, 이때 GROUPING 컬럼 함수는 집계로 생긴 가짜 NULL이면 1, 원래 데이터는 0을 반환합니다! 자, 그럼 출제위원들이 파놓는 대표적인 함정들을 짚어드리겠습니다. 함정: ROLLUP A, B 결과 단계  대신  정답: A, B , A , 함정: CUBE A, B 결과 단계  대신  정답: A, B , A , B , 함정: 그룹함수에서 NULL 행의 의미  대신  정답: 소계 행 또는 원래 NULL 함정: GROUPING 함수 결과가 1이면  대신  정답: 소계 행 여기에 더해, 노랭이와 실제 기출문제에서 수험생들이 가장 많이 틀린 족보입니다. 노랭이 2과목 108, 109번 ★중요체크 ① 일반 그룹 함수 GROUP BY + UNION ALL 로 ROLLUP, CUBE, GROUPING SETS 셋 모두와 100% 동일한 결과를 추출할 수 있다. ② 그룹핑 함수들의 집계 대상 칼럼 중 소계/총계로 집계된 칼럼 외의 대상 칼럼 자리는 NULL 값을 반환하며, 이를 구분하기 위해 GROUPING 함수를 사용한다. 21회 기출 단답형 4번 DNAME 3종류 , JOB 5종류 , DNAME+JOB 조합 9종류 일 때 GROUP BY CUBE DNAME, JOB 의 전체 결과 행 수는 전체 총계 1 + DNAME별 3 + JOB별 5 + DNAME+JOB 조합 9 = 총 18개이다! 마지막으로 시험장 입실 직전 30초 최종 요약입니다. 이 공식과 함정을 기억하시면 이 단원 문제는 무조건 2점 확보입니다. 다음 단원으로 넘어가겠습니다!"}, {"code": "2-2-4", "title": "[2-2-4] 윈도우 함수(Window Function) (상세 3분 강의)", "script": "반갑습니다 희호님! 지금부터 2-2-4단원, 윈도우 함수 Window Function 정규 과외 강의를 시작하겠습니다. 이번 단원은 출제 빈도가 ★★★★★ 매회 2 3문항 100% 출제! 로 매우 중요한 파트입니다. 먼저 이번 단원을 1초 만에 뚫어내는 마법의 두문자 암기 공식입니다. 순위: RANK 1,2,2,4 / DENSE RANK 1,2,2,3 / ROW NUMBER 1,2,3,4 | ORDER BY 넣는 순간 기본 프레임 = RANGE UNBOUNDED PRECEDING 누적합! . 머릿속에 이 글자들을 꼭 각인해 두세요. 과외선배의 집중 코칭입니다. 윈도우 함수에서 꼭 잡아야 할 핵심 3가지: ① 윈도우 함수는 GROUP BY와 달리 원래 테이블의 전체 행 건수를 절대 줄이지 않는다! ② SUM SAL OVER ORDER BY SAL 처럼 OVER 절 안에 ORDER BY를 적는 순간 기본 윈도우 프레임이 첫 행부터 현재 행까지의 누적 RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW 으로 바뀐다! ③ LAG 컬럼, N, 기본값 은 이전 행, LEAD 컬럼, N, 기본값 은 다음 행, PERCENT RANK는 순위-1 / 전체건수-1 양 끝값 0과 1 , CUME DIST는 누적건수 / 전체건수 1/N 1 입니다! 자, 그럼 출제위원들이 파놓는 대표적인 함정들을 짚어드리겠습니다. 함정: RANK  대  DENSE RANK  대  ROW NUMBER  대신  정답: RANK 건너뜀 / DENSE RANK 연속 / ROW NUMBER 모두 다름 함정: OVER 빈 괄호  대신  정답: 전체를 한 윈도우로 함정: PARTITION BY 생략  대신  정답: 전체 행을 하나의 그룹으로 함정: 윈도우 함수에 WHERE 절 사용  대신  정답: WHERE에 직접 못 씀 → 인라인뷰 사용 여기에 더해, 노랭이와 실제 기출문제에서 수험생들이 가장 많이 틀린 족보입니다. 노랭이 2과목 112, 114, 118번 ★중요체크 ① 윈도우 함수는 결과에 대한 함수 처리이므로 전체 결과 건수에는 영향을 주지 않는다. ② LAG 인수, 몇번째이전, NULL대체값 에서 두 번째 인수를 생략하면 기본값은 1 바로 직전 행 , 세 번째 인수는 이전 행이 없을 때 NULL 대신 출력할 값이다. 34회 기출 42번 GROUP BY 절과 윈도우 함수를 한 쿼리에서 함께 쓸 수는 있지만, 이 경우 윈도우 함수는 원본 테이블 전체가 아니라 GROUP BY로 먼저 집약된 결과 집합 위에서 동작한다. 마지막으로 시험장 입실 직전 30초 최종 요약입니다. 이 공식과 함정을 기억하시면 이 단원 문제는 무조건 2점 확보입니다. 다음 단원으로 넘어가겠습니다!"}, {"code": "2-2-5", "title": "[2-2-5] Top N 쿼리 (상세 3분 강의)", "script": "반갑습니다 희호님! 지금부터 2-2-5단원, Top N 쿼리 정규 과외 강의를 시작하겠습니다. 이번 단원은 출제 빈도가 ★★★★★ 매회 1문항 100% 출제! 로 매우 중요한 파트입니다. 먼저 이번 단원을 1초 만에 뚫어내는 마법의 두문자 암기 공식입니다. Oracle: 인라인뷰 정렬 후 바깥에서 ROWNUM <= N . 머릿속에 이 글자들을 꼭 각인해 두세요. 과외선배의 집중 코칭입니다. 오라클 ROWNUM의 2대 함정: ① SELECT FROM EMP WHERE ROWNUM <= 5 ORDER BY SAL DESC;는 정렬하기 전에 먼저 아무거나 5건을 뽑은 뒤 그 5명끼리만 정렬하는 오답 쿼리입니다! 반드시 인라인 뷰 FROM SELECT ... ORDER BY SAL DESC 안에서 먼저 정렬한 뒤 바깥 WHERE ROWNUM <= 5로 잘라야 합니다! ② ROWNUM은 1번이 만들어져야 2번이 부여되므로 WHERE ROWNUM = 2 또는 WHERE ROWNUM > 1은 영원히 0건 공집합 입니다! 자, 그럼 출제위원들이 파놓는 대표적인 함정들을 짚어드리겠습니다. 함정: WHERE ROWNUM = 5  대신  정답: 결과 없음 1만 매칭 함정: ROWNUM과 ORDER BY 조합  대신  정답: 인라인 뷰로 정렬 먼저, ROWNUM은 나중에 함정: 동률 포함하려면  대신  정답: WITH TIES 또는 RANK 함정: 부서별 Top N  대신  정답: 윈도우 함수 ROW NUMBER + PARTITION BY 여기에 더해, 노랭이와 실제 기출문제에서 수험생들이 가장 많이 틀린 족보입니다. 30회 기출 26번 오라클에서 ROWNUM 슈도 컬럼을 이용해 상위 N건을 제한할 때는 WHERE 절에서 1부터 시작하는 조건 ROWNUM <= N 또는 ROWNUM < N 으로 사용해야 한다. 마지막으로 시험장 입실 직전 30초 최종 요약입니다. 이 공식과 함정을 기억하시면 이 단원 문제는 무조건 2점 확보입니다. 다음 단원으로 넘어가겠습니다!"}, {"code": "2-2-6", "title": "[2-2-6] 계층형 질의와 셀프 조인 (상세 3분 강의)", "script": "반갑습니다 희호님! 지금부터 2-2-6단원, 계층형 질의와 셀프 조인 정규 과외 강의를 시작하겠습니다. 이번 단원은 출제 빈도가 ★★★★★ 매회 1 2문항 100% 출제! 로 매우 중요한 파트입니다. 먼저 이번 단원을 1초 만에 뚫어내는 마법의 두문자 암기 공식입니다. PRIOR 자식 = 부모 부모 대신 자식 순방향 전개! '프자부순' / PRIOR 부모 = 자식 자식 대신 부모 역방향 전개! '프부자역' . 머릿속에 이 글자들을 꼭 각인해 두세요. 과외선배의 집중 코칭입니다. 계층형 질의는 이 암기법 하나로 끝납니다: CONNECT BY PRIOR EMPNO 자식/현재행 = MGR 부모  대신  '프자부순' PRIOR가 자식 쪽에 붙으면 부모에서 자식으로 내려가는 순방향 전개! 반대로 PRIOR MGR 부모 = EMPNO 자식  대신  '프부자역' 역방향 전개! 그리고 또 하나의 킬러 포인트: CONNECT BY 절에 쓴 조건은 해당 노드와 그 하위 자식들까지 통째로 전개를 멈추지만 단, START WITH 루트 노드는 무조건 살아남음! , WHERE 절에 쓴 조건은 계층 전개를 다 끝낸 뒤 마지막에 해당 행만 쏙 골라내서 지운다! 자, 그럼 출제위원들이 파놓는 대표적인 함정들을 짚어드리겠습니다. 함정: START WITH의 의미  대신  정답: 루트 최상위 조건 함정: CONNECT BY PRIOR EMP ID = MGR ID  대신  정답: 순방향 부모→자식 함정: LEVEL의 시작 값  대신  정답: 1 루트 함정: 형제 정렬  대신  정답: ORDER SIBLINGS BY 여기에 더해, 노랭이와 실제 기출문제에서 수험생들이 가장 많이 틀린 족보입니다. 노랭이 2과목 90번 ★중요체크 오라클에서 PRIOR 연산자는 CONNECT BY 절뿐만 아니라 SELECT 절이나 WHERE 절에서도 사용할 수 있다. 34회 기출 47번 SQL Server/ANSI 표준에서는 WITH 절 CTE 을 재귀 호출 Anchor 멤버 + UNION ALL + Recursive 멤버 함으로써 상위부터 하위 방향으로 계층형 전개를 수행한다. 친구의 단원별 오답메모 START WITH에 해당되는 루트 행은 CONNECT BY 조건과 상관없이 무조건 출력되며, WHERE 절은 모든 계층 전개를 진행한 이후 필터 조건으로 수행된다. ORDER SIBLINGS BY는 동일한 레벨 형제 노드 사이에서만 정렬을 수행한다. 마지막으로 시험장 입실 직전 30초 최종 요약입니다. 이 공식과 함정을 기억하시면 이 단원 문제는 무조건 2점 확보입니다. 다음 단원으로 넘어가겠습니다!"}, {"code": "2-2-7", "title": "[2-2-7] PIVOT 절과 UNPIVOT 절 (상세 3분 강의)", "script": "반갑습니다 희호님! 지금부터 2-2-7단원, PIVOT 절과 UNPIVOT 절 정규 과외 강의를 시작하겠습니다. 이번 단원은 출제 빈도가 O COMMIT!. 머릿속에 이 글자들을 꼭 각인해 두세요. 과외선배의 집중 코칭입니다. TCL에서 무조건 나오는 3가지: ① 오라클에서 INSERT/UPDATE를 한 뒤 COMMIT을 안 하고 곧바로 CREATE/ALTER/DROP/TRUNCATE DDL 를 실행하면, DDL이 실행되는 순간 앞선 DML까지 자동으로 COMMIT되어 이후 ROLLBACK을 해도 되돌릴 수 없다! 반면 SQL Server는 DDL도 트랜잭션에 포함되어 ROLLBACK 가능! , ② SAVEPOINT A 이후 SAVEPOINT B를 만들고 ROLLBACK TO A를 실행하면, A 이후에 만든 B는 소멸되어 다시 ROLLBACK TO B를 할 수 없다! ③ 고립성 낮을 때 발생하는 3대 현상 Dirty Read, Non-Repeatable Read, Phantom Read 정의 구분! 자, 그럼 출제위원들이 파놓는 대표적인 함정들을 짚어드리겠습니다. 함정: TCL 명령어 종류  대신  정답: COMMIT / ROLLBACK / SAVEPOINT 함정: DDL 실행 후  대신  정답: Oracle은 자동 COMMIT 함정: ROLLBACK의 범위  대신  정답: 마지막 COMMIT 이후 모든 DML 함정: SAVEPOINT의 의미  대신  정답: 부분 ROLLBACK 가능 지점 여기에 더해, 노랭이와 실제 기출문제에서 수험생들이 가장 많이 틀린 족보입니다. 노랭이 2과목 28번 ★중요체크 낮은 트랜잭션 격리성에서 발생하는 3가지 문제: Dirty Read: 다른 트랜잭션에 의해 수정되었지만 아직 커밋되지 않은 Uncommitted 데이터를 읽는 현상 Non-Repeatable Read: 한 트랜잭션 내에서 같은 쿼리를 두 번 수행할 때, 그사이에 다른 트랜잭션이 값을 수정 Update 또는 삭제 Delete 하여 두 쿼리 결과가 다르게 나타나는 현상 마지막으로 시험장 입실 직전 30초 최종 요약입니다. 이 공식과 함정을 기억하시면 이 단원 문제는 무조건 2점 확보입니다. 다음 단원으로 넘어가겠습니다!"}, {"code": "2-3-3", "title": "[2-3-3] DDL (Data Definition Language) (상세 3분 강의)", "script": "반갑습니다 희호님! 지금부터 2-3-3단원, DDL Data Definition Language 정규 과외 강의를 시작하겠습니다. 이번 단원은 출제 빈도가 ★★★★★ 매회 2문항 100% 출제! 로 매우 중요한 파트입니다. 먼저 이번 단원을 1초 만에 뚫어내는 마법의 두문자 암기 공식입니다. DELETE DML, 롤백O, 로그남김  대  TRUNCATE DDL, 롤백X, 구조유지, 용량초기화  대  DROP DDL, 롤백X, 테이블완전삭제 . 머릿속에 이 글자들을 꼭 각인해 두세요. 과외선배의 집중 코칭입니다. DDL 파트에서 시험에 나오는 핵심 4가지: ① DELETE  대  TRUNCATE  대  DROP 비교표는 100% 출제됩니다! ② CREATE TABLE 새테이블 AS SELECT ... CTAS 로 테이블을 복제하면 NOT NULL 제약조건만 복사되고 PK, FK, UNIQUE, CHECK, DEFAULT는 전부 날아간다! ③ 컬럼 변경 문법 차이: Oracle은 ALTER TABLE T MODIFY 컬럼 ... 괄호 O , SQL Server는 ALTER TABLE T ALTER COLUMN 컬럼 ... 괄호 X, 여러 컬럼 동시 수정 불가! ④ ON DELETE SET NULL이 걸려 있어도 자식 외래키 컬럼이 NOT NULL이면 부모 행 삭제가 불가능하다! 자, 그럼 출제위원들이 파놓는 대표적인 함정들을 짚어드리겠습니다. 함정: TRUNCATE 분류  대신  정답: DDL 함정: DDL 실행 후 ROLLBACK 가능?  대신  정답: 불가 자동 COMMIT 함정: PRIMARY KEY는 NULL 허용?  대신  정답: 불허 함정: UNIQUE는 NULL 허용?  대신  정답: 허용 여기에 더해, 노랭이와 실제 기출문제에서 수험생들이 가장 많이 틀린 족보입니다. 노랭이 2과목 7, 9, 12, 16, 18, 22번 ★최빈출 ① 칼럼 수정: Oracle = ALTER TABLE 테이블명 MODIFY 컬럼명, SQL Server = ALTER TABLE 테이블명 ALTER COLUMN 컬럼명. ② ON DELETE CASCADE = 부모 삭제 시 연결된 자식 행 자체가 삭제됨. ③ 칼럼 레벨에서 PRIMARY KEY를 선언한 뒤 테이블 레벨에서 또 PRIMARY KEY 제약조건을 선언하면 에러 발생 테이블당 PK는 단 1개! . ④ ON DELETE SET NULL로 설정되어 있어도 자식 칼럼에 NOT NULL 제약조건이 걸려 있으면 부모 행 삭제 불가! 21회 기출 13번 오라클에서 CHECK 제약조건은 NULL 값을 무시 통과 한다! 예: CHECK SAL >= 1000 이 걸려 있어도 SAL에 NULL 입력 가능! . 노랭이 2과목 103번 뷰 View 는 단지 정의만 저장하는 가상 테이블이지만, 실제 데이터를 물리적으로 저장하는 뷰 Materialized View, 구체화된 뷰 를 지원하는 DBMS도 있다. 마지막으로 시험장 입실 직전 30초 최종 요약입니다. 이 공식과 함정을 기억하시면 이 단원 문제는 무조건 2점 확보입니다. 다음 단원으로 넘어가겠습니다!"}, {"code": "2-3-4", "title": "[2-3-4] DCL (Data Control Language) (상세 3분 강의)", "script": "반갑습니다 희호님! 지금부터 2-3-4단원, DCL Data Control Language 정규 과외 강의를 시작하겠습니다. 이번 단원은 출제 빈도가 ★★★★★ 매회 1문항 100% 출제! 로 매우 중요한 파트입니다. 먼저 이번 단원을 1초 만에 뚫어내는 마법의 두문자 암기 공식입니다. 객체 권한 ON 테이블 재부여 = WITH GRANT OPTION 연쇄 회수 O! / 시스템 권한 재부여 = WITH ADMIN OPTION 연쇄 회수 X, 유지됨! . 머릿속에 이 글자들을 꼭 각인해 두세요. 과외선배의 집중 코칭입니다. 마지막 단원 DCL은 딱 한 문제 나오는데, 출제 포인트가 정해져 있습니다! A가 B에게 권한을 주고 B가 C에게 재부여한 뒤 A가 B의 권한을 REVOKE 회수 했을 때: ① 객체 권한 옵션인 WITH GRANT OPTION은 C의 권한까지 도미노처럼 연쇄 회수 Cascade Revoke 되지만, ② 시스템 권한 옵션인 WITH ADMIN OPTION은 B의 권한만 회수되고 C가 받은 권한은 그대로 살아남는다! 이 표 하나만 기억하면 무조건 맞힙니다! 자, 그럼 출제위원들이 파놓는 대표적인 함정들을 짚어드리겠습니다. 함정: DCL 명령어  대신  정답: GRANT, REVOKE 함정: 시스템 권한 부여 시 옵션  대신  정답: WITH ADMIN OPTION 함정: 객체 권한 부여 시 옵션  대신  정답: WITH GRANT OPTION 함정: ROLE의 목적  대신  정답: 권한 묶음을 한 번에 관리 여기에 더해, 노랭이와 실제 기출문제에서 수험생들이 가장 많이 틀린 족보입니다. 노랭이 2과목 119번 & 친구 오답메모 ★100% 출제 WITH GRANT OPTION으로 객체 권한을 부여받은 사용자 B 가 제3자 C 에게 부여한 권한은, 원래 사용자 B 의 권한이 REVOKE되면 연쇄적으로 함께 취소 Cascade 된다! 반면 시스템 권한의 WITH ADMIN OPTION은 연쇄 회수되지 않고 유지된다! 마지막으로 시험장 입실 직전 30초 최종 요약입니다. 이 공식과 함정을 기억하시면 이 단원 문제는 무조건 2점 확보입니다. 다음 단원으로 넘어가겠습니다!"}]};

    let currentChapterIdx = 0;
    let viewAllInSubject = false;
    let currentFontSize = 16;
    let blankMode = false;
    let sidebarFilter = "all";

    // Audio Player State
    let isPlayingAudio = false;
    let currentAudioMode = "short"; // 'short' (1-min) or 'long' (3-min)
    let currentAudioTrackIdx = 0; // index in AUDIO_SCRIPTS[currentAudioMode] (0..29)
    let audioSpeed = 1.2;
    let audioLoopAll = true;
    let speechUtterance = null;

    let completedMap = JSON.parse(localStorage.getItem("sqld_completed_v2") || "{}");
    let starredMap = JSON.parse(localStorage.getItem("sqld_starred_v2") || "{}");
    let quizSolvedMap = JSON.parse(localStorage.getItem("sqld_quiz_v2") || "{}");

    // Audio Functions using Web Speech API
    function getKoreanVoice() {
      const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
      return voices.find(v => v.lang.startsWith("ko")) || null;
    }

    function changeAudioMode(mode) {
      currentAudioMode = mode;
      document.getElementById("audio-mode-badge").textContent = mode === "short" ? "⚡ 핵심 1분 모드" : "📻 상세 3분 과외 모드";
      if (isPlayingAudio) {
        playAudioTrack(currentAudioTrackIdx);
      }
    }

    function changeAudioSpeed(val) {
      audioSpeed = parseFloat(val);
      if (speechUtterance && window.speechSynthesis.speaking) {
        // Restart track with new speed
        const currentIdx = currentAudioTrackIdx;
        window.speechSynthesis.cancel();
        playAudioTrack(currentIdx);
      }
    }

    function toggleAudioLoop() {
      audioLoopAll = !audioLoopAll;
      const btn = document.getElementById("audio-loop-btn");
      btn.textContent = audioLoopAll ? "🔁 전단원 연속 ON" : "⏹ 1단원만 재생";
      btn.style.background = audioLoopAll ? "#16a34a" : "#64748b";
    }

    function toggleAudioPlay() {
      if (!window.speechSynthesis) {
        alert("현재 브라우저가 음성 재생(Web Speech)을 지원하지 않습니다. 크롬/사파리/엣지 브라우저를 이용해 주세요!");
        return;
      }
      if (isPlayingAudio) {
        window.speechSynthesis.cancel();
        isPlayingAudio = false;
        updateAudioUI(false);
      } else {
        playAudioTrack(currentAudioTrackIdx);
      }
    }

    function playAudioTrack(idx) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();

      const tracks = AUDIO_SCRIPTS[currentAudioMode];
      if (!tracks || idx < 0 || idx >= tracks.length) return;

      currentAudioTrackIdx = idx;
      const track = tracks[idx];
      document.getElementById("audio-track-title").textContent = track.title;

      speechUtterance = new SpeechSynthesisUtterance(track.script);
      speechUtterance.rate = audioSpeed;
      speechUtterance.pitch = 1.0;
      speechUtterance.lang = "ko-KR";

      const krVoice = getKoreanVoice();
      if (krVoice) speechUtterance.voice = krVoice;

      speechUtterance.onend = () => {
        if (audioLoopAll && currentAudioTrackIdx < tracks.length - 1) {
          playAudioTrack(currentAudioTrackIdx + 1);
        } else {
          isPlayingAudio = false;
          updateAudioUI(false);
        }
      };

      speechUtterance.onerror = (e) => {
        console.error("SpeechSynthesis error:", e);
        isPlayingAudio = false;
        updateAudioUI(false);
      };

      window.speechSynthesis.speak(speechUtterance);
      isPlayingAudio = true;
      updateAudioUI(true);

      // Also navigate the reader to that chapter!
      const targetChIdx = CHAPTERS.findIndex(c => c.title.startsWith(track.code));
      if (targetChIdx !== -1 && targetChIdx !== currentChapterIdx) {
        selectChapter(targetChIdx);
      }
    }

    function prevAudioTrack() {
      const newIdx = Math.max(0, currentAudioTrackIdx - 1);
      playAudioTrack(newIdx);
    }

    function nextAudioTrack() {
      const tracks = AUDIO_SCRIPTS[currentAudioMode];
      const newIdx = Math.min(tracks.length - 1, currentAudioTrackIdx + 1);
      playAudioTrack(newIdx);
    }

    function updateAudioUI(playing) {
      const pBtn = document.getElementById("audio-play-btn");
      const tBtn = document.getElementById("audio-toggle-btn");
      if (playing) {
        pBtn.textContent = "⏸ 일시정지";
        pBtn.style.background = "#ea580c";
        tBtn.classList.add("playing");
        tBtn.textContent = "🔊 오디오 재생 중";
      } else {
        pBtn.textContent = "▶ 재생";
        pBtn.style.background = "#2563eb";
        tBtn.classList.remove("playing");
        tBtn.textContent = "🎧 오디오북 듣기";
      }
    }

    function updateProgressBar() {
      let doneCount = 0;
      for (let i = 1; i <= 30; i++) {
        if (completedMap["ch-" + String(i).padStart(2, "0")]) doneCount++;
      }
      const pct = Math.round((doneCount / 30) * 100);
      document.getElementById("prog-text").textContent = `${doneCount} / 30 단원 (${pct}%)`;
      document.getElementById("prog-fill").style.width = pct + "%";
    }

    function toggleChapterDone(chId) {
      completedMap[chId] = !completedMap[chId];
      localStorage.setItem("sqld_completed_v2", JSON.stringify(completedMap));
      updateProgressBar();
      renderSidebar(document.getElementById("search-box").value);
      renderReader(false);
    }

    function toggleChapterStar(chId) {
      starredMap[chId] = !starredMap[chId];
      localStorage.setItem("sqld_starred_v2", JSON.stringify(starredMap));
      renderSidebar(document.getElementById("search-box").value);
      renderReader(false);
    }

    function setSidebarFilter(mode) {
      sidebarFilter = mode;
      document.getElementById("filter-all").classList.toggle("active", mode === "all");
      document.getElementById("filter-star").classList.toggle("active", mode === "star");
      document.getElementById("filter-todo").classList.toggle("active", mode === "todo");
      renderSidebar(document.getElementById("search-box").value);
    }

    function toggleBlankMode() {
      blankMode = !blankMode;
      document.body.classList.toggle("blank-mode", blankMode);
      const btn = document.getElementById("blank-btn");
      btn.textContent = blankMode ? "🧠 암기 깜지 ON (클릭해 확인)" : "👁️ 암기 깜지 OFF";
      btn.classList.toggle("active", blankMode);
      if (!blankMode) {
        document.querySelectorAll(".revealed").forEach(el => el.classList.remove("revealed"));
      }
    }

    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("open");
    }

    const THEMES = [
      { id: "light", label: "🌿 눈편한 라이트" },
      { id: "sepia", label: "📜 따뜻한 세피아" },
      { id: "dark",  label: "🌙 다크 모드" }
    ];
    let currentThemeIdx = 0;
    function toggleTheme() {
      currentThemeIdx = (currentThemeIdx + 1) % THEMES.length;
      const t = THEMES[currentThemeIdx];
      document.documentElement.setAttribute("data-theme", t.id);
      document.getElementById("theme-btn").textContent = t.label;
      localStorage.setItem("sqld_theme", t.id);
    }

    function changeFontSize(delta) {
      currentFontSize = Math.min(22, Math.max(13, currentFontSize + delta));
      document.body.style.fontSize = currentFontSize + "px";
    }

    function toggleViewMode() {
      viewAllInSubject = !viewAllInSubject;
      const btn = document.getElementById("mode-btn");
      btn.textContent = viewAllInSubject ? "📜 과목 연속 보기 중" : "📖 단원별 집중 보기";
      btn.classList.toggle("active", viewAllInSubject);
      renderReader(true);
    }

    function selectSubject(subjId) {
      document.querySelectorAll(".subj-tab").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.subj === subjId);
      });
      const firstIdx = CHAPTERS.findIndex(c => c.subj_id === subjId);
      if (firstIdx !== -1) {
        currentChapterIdx = firstIdx;
        renderSidebar(document.getElementById("search-box").value);
        renderReader(true);
      }
    }

    function selectChapter(idx) {
      currentChapterIdx = idx;
      const ch = CHAPTERS[idx];
      document.querySelectorAll(".subj-tab").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.subj === ch.subj_id);
      });
      document.getElementById("sidebar").classList.remove("open");
      renderSidebar(document.getElementById("search-box").value);
      renderReader(true);
    }

    function filterChapters(query) {
      renderSidebar(query);
    }

    function renderSidebar(query = "") {
      const listEl = document.getElementById("chapter-list");
      listEl.innerHTML = "";
      const q = query.trim().toLowerCase();
      let lastSubj = "";

      CHAPTERS.forEach((ch, idx) => {
        if (q && !ch.title.toLowerCase().includes(q) && !ch.md.toLowerCase().includes(q)) {
          return;
        }
        if (sidebarFilter === "star" && !starredMap[ch.id]) return;
        if (sidebarFilter === "todo" && (idx >= 1 && idx <= 30) && completedMap[ch.id]) return;

        if (ch.subj_name !== lastSubj) {
          lastSubj = ch.subj_name;
          const groupTitle = document.createElement("div");
          groupTitle.className = "subj-group-title";
          groupTitle.textContent = lastSubj;
          listEl.appendChild(groupTitle);
        }
        const btn = document.createElement("button");
        btn.className = "ch-item" + (idx === currentChapterIdx ? " active" : "");
        btn.onclick = () => selectChapter(idx);
        const icons = (starredMap[ch.id] ? "⭐" : "") + (completedMap[ch.id] ? "✅" : "");
        btn.innerHTML = `
          <span class="ch-item-left">
            <span class="ch-num">${String(idx).padStart(2, '0')}</span>
            <span>${ch.title.replace(/^\d-\d-\d\.\s*/, '')}</span>
          </span>
          <span class="ch-item-icons">${icons}</span>
        `;
        listEl.appendChild(btn);
      });
    }

    function enhanceRenderedCard(cardEl, chId) {
      // Wrap tables for horizontal scroll on mobile
      cardEl.querySelectorAll("table").forEach(tbl => {
        if (!tbl.parentElement.classList.contains("table-wrap")) {
          const wrap = document.createElement("div");
          wrap.className = "table-wrap";
          tbl.parentNode.insertBefore(wrap, tbl);
          wrap.appendChild(tbl);
        }
      });

      // Style 6-Step Textbook headings and build quick jump pills
      const headings = cardEl.querySelectorAll("h2");
      const jumpBar = cardEl.querySelector(".sec-jump-bar");
      if (headings.length > 1 && jumpBar) {
        headings.forEach((h, i) => {
          const hid = "h2-" + i + "-" + Math.random().toString(36).slice(2, 6);
          h.id = hid;
          const txt = h.textContent;
          if (txt.includes("과외선배")) {
            h.classList.add("tutor-heading");
          } else if (txt.includes("STEP 1")) {
            h.classList.add("step1-heading");
          } else if (txt.includes("STEP 2")) {
            h.classList.add("step2-heading");
          } else if (txt.includes("STEP 3")) {
            h.classList.add("step3-heading");
          } else if (txt.includes("STEP 4")) {
            h.classList.add("step4-heading");
          } else if (txt.includes("STEP 5")) {
            h.classList.add("step5-heading");
          }
          const a = document.createElement("a");
          a.className = "sec-pill";
          a.href = "#" + hid;
          a.textContent = txt.replace(/^\[|\]$/g, "");
          jumpBar.appendChild(a);
        });
      } else if (jumpBar) {
        jumpBar.style.display = "none";
      }

      // Style callout blockquotes
      cardEl.querySelectorAll("blockquote").forEach(bq => {
        const html = bq.innerHTML;
        if (html.includes("[!SUMMARY]")) {
          bq.classList.add("callout-summary");
        } else if (html.includes("[!CAUTION]")) {
          bq.classList.add("callout-danger");
        } else if (html.includes("[!WARNING]")) {
          bq.classList.add("callout-warn");
        }
        bq.innerHTML = html
          .replace(/\[!SUMMARY\]/g, "")
          .replace(/\[!IMPORTANT\]/g, "<strong>💡 [핵심 필수 암기]</strong><br>")
          .replace(/\[!WARNING\]/g, "<strong>⚠️ [시험 단골 함정 주의]</strong><br>")
          .replace(/\[!CAUTION\]/g, "<strong>🚨 [절대 주의 / 킬러 포인트]</strong><br>")
          .replace(/\[!TIP\]/g, "")
          .replace(/\[!NOTE\]/g, "<strong>📌 [참고 안내]</strong><br>");
      });

      // Convert .sqld-quiz-box options into interactive CBT buttons
      cardEl.querySelectorAll(".sqld-quiz-box").forEach(qbox => {
        const ans = parseInt(qbox.dataset.answer || "1", 10);
        const ul = qbox.querySelector("ul");
        const details = qbox.querySelector("details");
        if (ul) {
          const items = Array.from(ul.querySelectorAll("li"));
          const optContainer = document.createElement("div");
          const banner = document.createElement("div");
          banner.className = "quiz-feedback-banner";

          items.forEach((li, idx) => {
            const optNum = idx + 1;
            const btn = document.createElement("button");
            btn.className = "quiz-opt-btn";
            btn.innerHTML = li.innerHTML;
            btn.onclick = () => {
              optContainer.querySelectorAll(".quiz-opt-btn").forEach((b, bIdx) => {
                b.classList.remove("correct", "wrong");
                if (bIdx + 1 === ans) b.classList.add("correct");
              });
              if (optNum === ans) {
                btn.classList.add("correct");
                banner.className = "quiz-feedback-banner ok";
                banner.innerHTML = "🎉 <b>정답입니다! (+2점 확보)</b> 아래 해설에서 오답 보기의 함정 포인트도 한 번 더 체크해보세요.";
                quizSolvedMap[chId] = true;
                localStorage.setItem("sqld_quiz_v2", JSON.stringify(quizSolvedMap));
              } else {
                btn.classList.add("wrong");
                banner.className = "quiz-feedback-banner no";
                banner.innerHTML = `❌ <b>아쉽네요! 정답은 ${ans}번입니다.</b> 출제위원이 파놓은 함정에 걸렸어요! 아래 해설을 꼭 읽어보세요.`;
              }
              if (details) details.open = true;
            };
            optContainer.appendChild(btn);
          });
          ul.replaceWith(optContainer);
          optContainer.after(banner);
        }
      });

      // Active recall blank mode click listener
      cardEl.querySelectorAll("td strong, li strong, blockquote strong").forEach(strEl => {
        strEl.addEventListener("click", (e) => {
          if (document.body.classList.contains("blank-mode")) {
            e.stopPropagation();
            strEl.classList.toggle("revealed");
          }
        });
      });

      // Syntax highlighting + Copy button
      cardEl.querySelectorAll("pre code").forEach(block => {
        if (window.hljs) {
          hljs.highlightElement(block);
        }
        const pre = block.parentElement;
        const btn = document.createElement("button");
        btn.className = "copy-btn";
        btn.textContent = "SQL 복사";
        btn.onclick = () => {
          navigator.clipboard.writeText(block.textContent);
          btn.textContent = "✓ 복사됨!";
          setTimeout(() => btn.textContent = "SQL 복사", 1500);
        };
        pre.appendChild(btn);
      });

      // Image click-to-zoom lightbox
      cardEl.querySelectorAll("img").forEach(img => {
        img.loading = "lazy";
        img.onclick = () => {
          document.getElementById("lightbox-img").src = img.src;
          document.getElementById("lightbox").style.display = "flex";
        };
      });
    }

    function renderReader(scrollTop = true) {
      const container = document.getElementById("reader-container");
      container.innerHTML = "";
      const currentCh = CHAPTERS[currentChapterIdx];
      const targetChapters = viewAllInSubject
        ? CHAPTERS.filter(c => c.subj_id === currentCh.subj_id)
        : [currentCh];

      targetChapters.forEach(ch => {
        const card = document.createElement("article");
        card.className = "chapter-card";

        const prevCh = ch.index > 0 ? CHAPTERS[ch.index - 1] : null;
        const nextCh = ch.index < CHAPTERS.length - 1 ? CHAPTERS[ch.index + 1] : null;

        const parsedHtml = window.marked
          ? marked.parse(ch.md, { gfm: true, breaks: false })
          : "<pre>" + ch.md + "</pre>";

        const isDone = !!completedMap[ch.id];
        const isStar = !!starredMap[ch.id];

        let navFooterHtml = `
          <div style="display:flex;justify-content:center;gap:10px;margin-top:28px;">
            <button class="study-check-btn ${isDone ? 'done' : ''}" style="padding:10px 20px;font-size:14px;" onclick="toggleChapterDone('${ch.id}')">
              ${isDone ? '✅ 이 단원 학습 완료됨! (클릭 시 해제)' : '☑️ 이 단원 공부 완료 체크하기'}
            </button>
            <button class="study-check-btn ${isStar ? 'starred' : ''}" style="padding:10px 18px;font-size:14px;" onclick="toggleChapterStar('${ch.id}')">
              ${isStar ? '⭐ 복습 별표 저장됨' : '☆ 취약 단원 별표하기'}
            </button>
          </div>
          <div class="chapter-nav-footer">`;
        if (prevCh) {
          navFooterHtml += `<button class="nav-card-btn prev" onclick="selectChapter(${prevCh.index})">
            <span class="nav-label">◀ 이전 단원</span>
            <span class="nav-title">${prevCh.title}</span>
          </button>`;
        } else {
          navFooterHtml += `<div></div>`;
        }
        if (nextCh) {
          navFooterHtml += `<button class="nav-card-btn next" onclick="selectChapter(${nextCh.index})">
            <span class="nav-label">다음 단원 ▶</span>
            <span class="nav-title">${nextCh.title}</span>
          </button>`;
        }
        navFooterHtml += `</div>`;

        card.innerHTML = `
          <div class="chapter-meta-bar">
            <span class="chapter-badge">📚 ${ch.badge}</span>
            <div class="chapter-study-actions">
              <button class="study-check-btn ${isStar ? 'starred' : ''}" onclick="toggleChapterStar('${ch.id}')">
                ${isStar ? '⭐ 복습 별표됨' : '☆ 복습 별표'}
              </button>
              <button class="study-check-btn ${isDone ? 'done' : ''}" onclick="toggleChapterDone('${ch.id}')">
                ${isDone ? '✅ 학습 완료' : '☑️ 완료 체크'}
              </button>
            </div>
          </div>
          <div class="sec-jump-bar"><span style="font-size:12px;font-weight:700;color:var(--fg-muted);align-self:center;margin-right:4px;">⚡ 단원 내 단계별 이동:</span></div>
          <div class="chapter-body">${parsedHtml}</div>
          ${navFooterHtml}
        `;

        enhanceRenderedCard(card, ch.id);
        container.appendChild(card);
      });

      if (scrollTop) {
        document.getElementById("main").scrollTop = 0;
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      const savedTheme = localStorage.getItem("sqld_theme");
      if (savedTheme) {
        const foundIdx = THEMES.findIndex(t => t.id === savedTheme);
        if (foundIdx !== -1) {
          currentThemeIdx = foundIdx;
          document.documentElement.setAttribute("data-theme", savedTheme);
          document.getElementById("theme-btn").textContent = THEMES[foundIdx].label;
        }
      }
      updateProgressBar();
      renderSidebar();
      renderReader(true);
      // Preload voices
      if (window.speechSynthesis) {
        window.speechSynthesis.onvoiceschanged = () => {
          getKoreanVoice();
        };
      }
    });
  </script>
</body>
</html>
