\n### 🔄 [Before & After] CASE 방식과 PIVOT 절 비교\n\n분기·카테고리·매출이 세로로 쌓인 SALES 표를 분기별 가로 보고서로 변환. Q2에는 카테고리 B 매출이 없어 결과에서 NULL 처리. 같은 변환을 Oracle PIVOT 절과 전통적인 CASE WHEN + GROUP BY 방식으로 동시에 표현해 비교.\n\n### 원본\n\n| 분기 | 카테고리 | 매출 |\n|---|---|---|\n| Q1 | A | 100 |\n| Q1 | B | 200 |\n| Q2 | A | 150 |\n\n### 결과 (PIVOT)\n\n| 분기 | A | B |\n|---|---|---|\n| Q1 | 100 | 200 |\n| Q2 | 150 | NULL |\n\n```sql\n-- PIVOT\nSELECT * FROM SALES\nPIVOT (SUM(매출) FOR 카테고리 IN ('A' AS A, 'B' AS B));\n\n-- CASE WHEN 방식\nSELECT 분기,\n       SUM(CASE WHEN 카테고리='A' THEN 매출 END) AS A,\n       SUM(CASE WHEN 카테고리='B' THEN 매출 END) AS B\nFROM   SALES\nGROUP BY 분기;\n```\n\n두 방식의 결과가 같은 이유는 PIVOT 절이 사실상 \"카테고리별 SUM(CASE WHEN ...)\"을 분기 GROUP BY 로 묶는 동작을 문법적으로 단순화한 것이기 때문이다. Q2의 B 칸이 NULL 이 되는 것도 같은 메커니즘으로, 매칭되는 원본 행이 없어 SUM 의 입력이 비어 있기 때문. PIVOT 은 IN 절에 변환할 값을 명시적으로 나열해야 하므로 \"어떤 컬럼이 만들어질지\"를 미리 알아야 하고, CASE 방식은 분기 컬럼을 동적으로 조립할 수 있어 더 유연. 표현력의 차이.\n\n### 💻 [SQL 실전 트레이스] 추가 예시\n\n```sql\n-- 부서별, 직무별 인원수를 가로로\nSELECT *\nFROM   EMP\n       PIVOT (\n           COUNT(*)\n           FOR JOB IN ('MGR' AS 매니저, 'CLERK' AS 사무직, 'SALES' AS 영업)\n       );\n```\n\n| DEPT_ID | 매니저 | 사무직 | 영업 |\n|---|---|---|---|\n| D1 | 1 | 2 | 0 |\n| D2 | 1 | 0 | 3 |\n\n---\n\n## 🚨 STEP 3. 출제위원 단골 함정 O/X & 노랭이·기출 문항별 족보\n\n### ⚠️ 시험장 단골 함정 vs 정답 1:1 대조표\n\n| 함정 | 정답 |\n|---|---|\n| PIVOT의 결과 모양 | 행 → 컬럼으로 변환 |\n| UNPIVOT의 결과 모양 | 컬럼 → 행으로 변환 |\n| PIVOT의 IN 절 | 변환할 값들 나열 |\n| 매칭 안 되는 칸 | NULL |\n| UNPIVOT 기본 NULL 처리 | 제외(INCLUDE NULLS로 포함 가능) |\n| CASE WHEN으로 PIVOT 가능? | 가능(PIVOT 절 없이) |\n\n단골 함정: PIVOT 은 SUM/COUNT 같은 집계함수 필수. 단순 변환만 하려고 해도 집계함수가 들어가야 함. UNPIVOT 결과를 다른 SELECT 결과와 합치려면 **집합 연산자**(UNION ALL 등)를 함께 사용.\n\n### 📒 이 단원과 직결된 『SQL 자격검정 실전문제(노랭이)』 & 기출 킬러 족보\n\n- **[2024 개정 신유형 핵심]** `PIVOT` 절 내부에는 반드시 `SUM()`, `MAX()`, `COUNT()` 같은 **집계함수**가 들어가야 하며, `UNPIVOT`은 이미 집계된 열들을 행으로 풀기 때문에 집계함수를 쓰지 않는다.\n\n---\n\n## ✍️ STEP 4. 실전 적중! 단원 마무리 확인 문제\n\n<div class=\"sqld-quiz-box\" data-answer=\"3\">\n\n**Q. [2-2-7 대표 적중 문제]** 2024 개정 SQLD 출제 범위인 `PIVOT`과 `UNPIVOT` 절에 대한 설명으로 **가장 부적절한** 것은?\n\n- ① `PIVOT` 절은 행(Row) 단위로 되어 있는 데이터를 지정한 컬럼의 값에 따라 열(Column) 단위로 회전시켜 가로로 펼쳐주는 구문이다.\n- ② `PIVOT` 수행 시 `PIVOT` 절 내부(`집계함수`와 `FOR` 절)에 명시되지 않은 인라인 뷰의 나머지 모든 컬럼들이 암시적으로 그룹화(`GROUP BY`) 기준 컬럼이 된다.\n- ③ `UNPIVOT` 절은 여러 개의 열(Column)을 행(Row)으로 변환하는 구문이며, 별도 옵션을 지정하지 않으면 기본값으로 `INCLUDE NULLS`가 적용되어 값이 `NULL`인 행도 모두 결과에 출력된다.\n- ④ `PIVOT` 절의 `FOR 컬럼 IN (...)` 내부에서는 각 값에 대해 `AS 별칭`을 부여하여 생성될 열의 이름을 지정할 수 있다.\n\n<details>\n<summary>💡 <b>정답 및 시나공·과외노트식 보기별 완벽 해설 확인하기 (클릭)</b></summary>\n\n**정답: ③**\n- **해설**: `UNPIVOT` 절의 기본 동작 옵션은 **`EXCLUDE NULLS` (`NULL`인 행 제외)**입니다! 따라서 변환 대상 열의 값이 `NULL`이면 결과 행에서 자동으로 생략되며, 만약 `NULL`인 행까지 모두 출력하고 싶다면 명시적으로 **`UNPIVOT INCLUDE NULLS (...)`** 옵션을 지정해야 합니다.\n\n</details>\n</div>\n\n---\n\n## ⏱️ STEP 5. 시험장 입실 직전 30초 최종 요약 카드\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · PIVOT = **세로 → 가로** (행을 컬럼으로)\n> · UNPIVOT = **가로 → 세로** (컬럼을 행으로)\n> · PIVOT 은 **집계 함수 필수** (SUM/COUNT/MAX 등) — 단순 변환에도 형식상 필요\n> · 매칭 안 되는 칸 → **NULL**\n> · UNPIVOT 기본 = **NULL 제외**, `INCLUDE NULLS` 로 포함\n> · PIVOT 절 없이 = **CASE WHEN + GROUP BY** 로 흉내 가능 (시험 단골)"}, {"id": "ch-26", "index": 26, "title": "2-2-8. 정규 표현식(Regular Expression)", "subj_id": "tab3", "subj_name": "2과목 2장 · SQL 활용", "badge": "2과목 2장 · SQL 활용", "md": "# 2-2-8. 정규 표현식(Regular Expression)\n\n> **단원 분류**: `2과목` > `2-2. SQL 활용` > **`2-2-8. 정규 표현식`**\n> **🎯 출제 빈도**: `★★★★☆ (2024 개정 신유형 집중 출제!)` &nbsp;|&nbsp; **🧠 두문자 암기 공식**: `^문자열시작 vs [^괄호안부정NOT] / $문자열끝 / *(0회이상) / +(1회이상) / ?(0또는1회) / .(임의의 1글자)`\n\n## 🎯 과외선배의 1분 브리핑 & 핵심 구조도\n\n> [!TIP]\n> **👨‍🏫 1:1 과외선배의 학습 코칭 (`유선배 과외노트` 스타일)**\n> 정규 표현식도 2024 개정 신유형으로 매회 1문제씩 나옵니다! 가장 많이 나오는 함정은 **`^` 기호의 두 얼굴**: 대괄호 밖에서 **`^A`는 `'A'로 시작하는 문자열`**이지만, 대괄호 안에서 **`[^0-9]`는 `'숫자가 아닌(NOT) 문자'`**입니다! 또한 **`*`는 0회 이상(`ab*c`에 `'ac'` 포함!)**, **`+`는 1회 이상(`ab+c`에 `'ac'` 불포함!)**이라는 수량자 차이와 `REGEXP_SUBSTR`, `REGEXP_REPLACE`, `REGEXP_LIKE` 함수 인수를 꼭 익혀두세요!\n\n> 정규 표현식은 문자 패턴을 표현하는 짧은 식이다. LIKE보다 훨씬 강력하게 문자열을 검색·추출·교체할 수 있다.\n\nex) LIKE는 \"'김%'로 시작\" 정도지만, 정규식은 \"010-숫자4자리-숫자4자리\" / \"한글 3글자 이름\" / \"이메일 형식\" 같은 정밀 패턴을 표현한다.\n\n### 🗺️ 한눈에 보는 핵심 구조도: LIKE vs REGEXP 비교\n\n```\nLIKE       │ % (0개 이상), _ (1개)               │  단순·기본 검색\nREGEXP     │ . * + ? [ ] ^ $ | { } \\d \\w \\s …    │  정밀·고급 검색\n```\n\n| 비교 | LIKE | REGEXP |\n|---|---|---|\n| 표현력 | 약함 | 강함 |\n| 와일드카드 | `%`, `_` | `.`, `*`, `+`, `[]`, `^`, `$` 등 다수 |\n| 성능 | 빠름 | 약간 느림 |\n\n---\n\n## 📘 STEP 1. 시험 출제 핵심 이론 & 강의 도표 완벽 정복\n\n> 📌 **[2024 개정 출제 안내]**\n> **2024년 개정 SQLD 신설 파트!**: 메타문자(`^`, `$`, `.`, `|`, `[ ]`, `[^ ]`), 수량자(`?`, `*`, `+`, `{m,n}`), 그리고 오라클 5대 정규식 함수(`REGEXP_LIKE`, `REGEXP_REPLACE`, `REGEXP_SUBSTR`, `REGEXP_INSTR`, `REGEXP_COUNT`)의 인자 순서를 정확히 알아야 합니다.\n\n### 📌 1. 정규 표현식 기본 메타문자 · 수량자 · 문자 클래스 총정리\n\n| 분류 | 기호 / 패턴 | 의미 및 시험 핵심 포인트 | 예시 |\n| :---: | :---: | :--- | :--- |\n| **기본 메타문자** | **`.` (마침표)** | 줄바꿈 문자를 제외한 **임의의 문자 딱 1글자** (`LIKE`의 `_`와 대응!) | `'a.b'` ➔ `'acb'`, `'a1b'` 매칭 (`'ab'`는 불일치!) |\n| | **`\\|` (버티컬 바)** | **또는 (OR)** 조건 | `'a\\|b'` ➔ `'a'` 또는 `'b'` |\n| | **`\\` (역슬래시)** | 다음에 오는 메타문자를 특수기능이 아닌 **일반 문자 그대로(Escape)** 취급 | `'\\.'` ➔ 실제 마침표 `.` 문자 자체를 의미 |\n| **앵커 (위치)** | **`^` (캐럿, 대괄호 밖)** | 문자열(또는 줄)의 **시작(Start)**! | `'^a'` ➔ `'a'`로 시작하는 문자열 |\n| | **`$` (달러)** | 문자열(또는 줄)의 **끝(End)**! | `'a$'` ➔ `'a'`로 끝나는 문자열 |\n| **수량자<br>(Quantifiers)** | **`?` (물음표)** | 앞 문자가 **0회 또는 1회** 나타남 (있거나 없거나) | `'ab?c'` ➔ `'ac'`, `'abc'` 매칭 (`'abbc'` 불일치) |\n| | **`*` (별표)** | 앞 문자가 **0회 이상** 반복됨 (`0, 1, 2...` — 안 나와도 매칭됨!) | `'ab*c'` ➔ `'ac'`, `'abc'`, `'abbbc'` 모두 매칭! |\n| | **`+` (더하기)** | 앞 문자가 **1회 이상** 반복됨 (최소 1번은 반드시 나와야 함!) | `'ab+c'` ➔ `'abc'`, `'abbbc'` 매칭 (**`'ac'`는 불일치!**) |\n| | **`{m}`** | 앞 문자가 **정확히 `m`회** 반복 | `'a{3}'` ➔ `'aaa'` |\n| | **`{m,}`** | 앞 문자가 **최소 `m`회 이상** 반복 | `'a{2,}'` ➔ `'aa'`, `'aaa'`, ... |\n| | **`{,m}` / `{0,m}`** | 앞 문자가 **최대 `m`회 이하** 반복 | `'a{0,2}'` ➔ `''`, `'a'`, `'aa'` |\n| | **`{m,n}`** | 앞 문자가 **최소 `m`회 이상, 최대 `n`회 이하** 반복 | `'a{2,4}'` ➔ `'aa'`, `'aaa'`, `'aaaa'` |\n| **괄호 / 문자클래스** | **`(abc)` (소괄호)** | 괄호 안의 문자열 전체를 **하나의 그룹(단위)**으로 묶음 | `'(ab)+'` ➔ `'ab'`, `'abab'`, `'ababab'` |\n| | **`[abc]` (대괄호)** | 대괄호 안의 문자들 중 **어느 한 글자**와 일치 (`OR` 개념), 범위는 `-` 사용 (`[0-9]`, `[a-zA-Z]`) | `'[abc]d'` ➔ `'ad'`, `'bd'`, `'cd'` |\n| | **`[^abc]` (대괄호 안 첫 글자 `^`)** | ★대괄호 안 맨 앞의 `^`는 시작이 아니라 **부정(NOT — 해당 문자들을 제외한 나머지 1글자)**! | `'[^0-9]'` ➔ 숫자가 아닌 문자 1글자 |\n| **펄(Perl) / POSIX 클래스** | **`\\d` / `[:digit:]`** | **숫자** (`[0-9]`) / **`\\D`**는 숫자가 아닌 문자 (`[^0-9]`) | `'\\d{3}'` 또는 `'[[:digit:]]{3}'` (숫자 3자리) |\n| | **`\\w` / `[:alnum:]`** | 영문자 + 숫자 (`\\w`는 `_` 포함) / **`\\W`**는 그 외 문자 | |\n| | **`\\s` / `[:space:]`** | **공백 문자** (띄어쓰기, 탭 등) / **`\\S`**는 공백이 아닌 문자 | |\n| | **`[:alpha:]` / `[:lower:]` / `[:upper:]`** | 알파벳 전체 / 영문 소문자 / 영문 대문자 *(주의: POSIX 클래스는 대괄호 안에 한 번 더 감싸서 **`[[:digit:]]`** 형태로 사용함!)* | |\n\n![정규 표현식 기본 메타문자(., |, \\, ^, $) 설명 및 예시](images/p079_img05.png)\n\n![정규 표현식 메타문자 매칭 결과 표](images/p079_img06.png)\n\n![수량자(?, *, +, {m,n}) 및 괄호 그룹화 설명 표](images/p080_img01.png)\n\n![수량자 패턴별 매칭 결과 비교 표](images/p080_img02.png)\n\n![대괄호 문자 클래스([char], [^char]) 및 범위 지정 예시](images/p080_img03.png)\n\n![POSIX 문자 클래스([:digit:], [:alpha:] 등) 및 Perl 정규식 기호(\\d, \\w, \\s) 표](images/p080_img04.png)\n\n---\n\n### 📌 2. Oracle 정규 표현식 5대 함수와 `match_param` 옵션\n\n| 정규 표현식 함수 | 대응하는 일반 SQL 함수 | 문법 및 인자 순서 `(원본, 패턴 [, 시작위치, n번째매칭, 옵션])` |\n| :--- | :---: | :--- |\n| **`REGEXP_LIKE(원본, 패턴 [, 옵션])`** | `LIKE` | `WHERE` 절에서 원본 문자열이 정규식 `패턴`과 일치하는지 검사하여 참/거짓 반환 |\n| **`REGEXP_REPLACE(원본, 패턴 [, 대체문자열, 시작위치, n번째, 옵션])`** | `REPLACE` | 원본에서 `패턴`과 일치하는 부분을 찾아 `대체문자열`로 치환 (`n번째`를 생략하거나 `0`으로 주면 **매칭되는 모든 곳을 전부 치환**! `대체문자열` 생략 시 삭제!) |\n| **`REGEXP_SUBSTR(원본, 패턴 [, 시작위치, n번째, 옵션, 서브그룹])`** | `SUBSTR` | 원본에서 `시작위치`(기본 1)부터 검색하여 **`n번째`(기본 1)로 `패턴`에 일치하는 부분 문자열 자체를 추출**하여 반환! |\n| **`REGEXP_INSTR(원본, 패턴 [, 시작위치, n번째, 반환위치옵션, 옵션])`** | `INSTR` | 원본에서 `패턴`과 일치하는 부분의 **위치 인덱스(숫자)**를 반환 (`반환위치옵션`이 `0`(기본)이면 매칭 시작 위치, `1`이면 매칭이 끝난 직후 다음 글자 위치 반환!) |\n| **`REGEXP_COUNT(원본, 패턴 [, 시작위치, 옵션])`** | - | 원본 문자열 내에 해당 `패턴`이 **총 몇 번 등장하는지(개수)**를 숫자로 반환 |\n\n- **일치 옵션 (`match_param`) 5가지**:\n  - **`'i'`**: 대소문자를 구분하지 않고 검색 (Case-**i**nsensitive)\n  - **`'c'`**: 대소문자를 구분하여 검색 (Case-sensitive, 기본값)\n  - **`'n'`**: 마침표(`.`)가 줄바꿈 문자(Newline)까지도 임의의 문자로 매칭하도록 허용\n  - **`'m'`**: 원본 문자열을 여러 줄(Multi-line)로 취급하여 각 줄마다 `^`(줄 시작)와 `$`(줄 끝)를 적용\n  - **`'x'`**: 정규식 패턴 내부에 적은 공백 문자를 무시(무시하고 패턴 가독성만 높일 때 사용)\n\n![정규 표현식 5대 함수 목록 및 match_param 옵션(i, c, n, m, x) 요약표](images/p080_img05.png)\n\n![REGEXP_LIKE 조건절 활용 예시](images/p080_img06.png)\n\n![REGEXP_REPLACE, REGEXP_SUBSTR, REGEXP_INSTR, REGEXP_COUNT 문법 상세 비교](images/p081_img01.png)\n\n![REGEXP 함수별 실행 쿼리 및 결과 비교 1](images/p081_img02.png)\n\n![REGEXP 함수별 실행 쿼리 및 결과 비교 2](images/p081_img03.png)\n\n![REGEXP 함수별 실행 쿼리 및 결과 비교 3](images/p081_img04.png)\n\n---\n\n## 🔍 STEP 2. 직관적 Before & After 비교 & 실전 SQL 트레이스\n\n### 🔄 [Before & After] 직관적 비교\n\nMEMBER 3건에서 \"한글 이름 + 010 휴대폰 번호\" 회원만 골라내야 하는 상황. 2번은 휴대폰이 02 지역번호라 탈락, 3번은 이름이 영문이라 탈락. LIKE 두 개로는 표현하기 까다로운 두 조건을 REGEXP_LIKE 로 정밀하게 거른다.\n\n### MEMBER\n\n| ID | NAME | PHONE |\n|---|---|---|\n| 1 | 김철수 | 010-1234-5678 |\n| 2 | 이영희 | 02-1234-5678 |\n| 3 | Jane | 010-9999-1234 |\n\n### 한글 이름 + 010 휴대폰만\n\n```sql\nSELECT *\nFROM   MEMBER\nWHERE  REGEXP_LIKE(NAME, '^[가-힣]+$')\n  AND  REGEXP_LIKE(PHONE, '^010-');\n```\n\n| ID | NAME | PHONE |\n|---|---|---|\n| 1 | 김철수 | 010-1234-5678 |\n\n`^[가-힣]+$` 는 문자열 처음(`^`)부터 끝(`$`)까지가 모두 한글 한 글자(`[가-힣]`)의 1회 이상 반복으로만 채워질 때만 매칭하므로, \"Jane\"은 영문이라 즉시 탈락하고 김철수·이영희는 통과한다. 다음 조건 `^010-` 은 PHONE 이 정확히 \"010-\"으로 시작할 때만 통과시키므로 02 지역번호인 이영희가 떨어진다. 두 정규식 조건을 AND 로 조합해 \"한글 이름 + 010 휴대폰\" 교집합만 남는다. LIKE 의 `%`·`_` 로는 \"글자 종류(한글)\"를 표현할 수 없으니, 문자 종류·길이·위치를 동시에 검사해야 할 때는 정규식이 자연스러운 선택.\n\n### 💻 [SQL 실전 트레이스]\n\n### REGEXP_LIKE (**WHERE** 조건절)\n\n```sql\n-- 휴대폰 번호 형식 (010으로 시작, 3-4-4 자리)\nSELECT *\nFROM   MEMBER\nWHERE  REGEXP_LIKE(PHONE, '^010-\\d{3,4}-\\d{4}$');\n\n-- 이메일 형식\nSELECT *\nFROM   MEMBER\nWHERE  REGEXP_LIKE(EMAIL, '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$');\n\n-- 한글 3글자 이름\nSELECT *\nFROM   MEMBER\nWHERE  REGEXP_LIKE(NAME, '^[가-힣]{3}$');\n```\n\n### REGEXP_REPLACE (교체)\n\n```sql\n-- 모든 공백 제거\nSELECT REGEXP_REPLACE('Hello   World', '\\s+', '') FROM DUAL;\n-- 결과: 'HelloWorld'\n\n-- 전화번호 가운데를 마스킹\nSELECT REGEXP_REPLACE('010-1234-5678', '(\\d{3})-(\\d{4})-(\\d{4})', '\\1-****-\\3') FROM DUAL;\n-- 결과: '010-****-5678'\n```\n\n### REGEXP_SUBSTR (추출)\n\n```sql\n-- 첫 번째 숫자 묶음 추출\nSELECT REGEXP_SUBSTR('주문번호 12345 입니다', '\\d+') FROM DUAL;\n-- 결과: '12345'\n```\n\n### REGEXP_INSTR / REGEXP_COUNT\n\n```sql\n-- 처음 숫자가 나타나는 위치\nSELECT REGEXP_INSTR('abc123def', '\\d') FROM DUAL;  -- 4\n\n-- 단어 개수\nSELECT REGEXP_COUNT('one two three', '\\w+') FROM DUAL;  -- 3\n```\n\n---\n\n## 🚨 STEP 3. 출제위원 단골 함정 O/X & 노랭이·기출 문항별 족보\n\n### ⚠️ 시험장 단골 함정 vs 정답 1:1 대조표\n\n| 함정 | 정답 |\n|---|---|\n| `^`의 의미 | 문자열의 시작(`[]` 안에선 부정) |\n| `$`의 의미 | 문자열의 끝 |\n| `*` vs `+` | `*`은 0개 이상, `+`은 1개 이상 |\n| `.`의 의미 | 임의의 한 글자(LIKE의 `_`와 같음) |\n| `\\d`의 의미 | 숫자 [0-9] |\n| `[가-힣]` | 한글 한 글자 |\n| LIKE와 REGEXP_LIKE 차이 | LIKE는 `%`와 `_`만, REGEXP는 다양한 메타문자 사용 |\n\n단골 함정: `^` 이 `[]` 안과 밖에서 의미가 다름. 밖에서 `^` 은 시작, `[^abc]` 안에서는 부정.\n\n### 📒 이 단원과 직결된 『SQL 자격검정 실전문제(노랭이)』 & 기출 킬러 족보\n\n- **[2024 개정 신유형 핵심]** POSIX 문자 클래스: `[:digit:]` = `[0-9]`(숫자), `[:alpha:]` = `[a-zA-Z]`(영문자), `[:alnum:]` = `[a-zA-Z0-9]`(영숫자). 오라클 정규식 함수의 마지막 옵션(`match_param`)에서 `'i'`는 대소문자 무시, `'c'`는 대소문자 구분(기본값)이다.\n\n---\n\n## ✍️ STEP 4. 실전 적중! 단원 마무리 확인 문제\n\n<div class=\"sqld-quiz-box\" data-answer=\"2\">\n\n**Q. [2-2-8 대표 적중 문제]** 다음 중 오라클 정규 표현식(Regular Expression) 패턴과 일치하는 문자열의 연결이 **잘못된** 것은?\n\n- ① 패턴 `^A.C$` ➔ `'ABC'`, `'A1C'`와 일치하지만 `'AC'`, `'ABBC'`와는 일치하지 않는다.\n- ② 패턴 `AB+C` ➔ `'AC'`, `'ABC'`, `'ABBC'`와 모두 일치한다.\n- ③ 패턴 `[^0-9]+` ➔ 숫자가 아닌 문자가 1회 이상 연속되는 문자열과 일치한다.\n- ④ `SELECT REGEXP_SUBSTR('010-1234-5678', '[^-]+', 1, 2) FROM DUAL;` ➔ 하이픈(`-`)을 제외한 두 번째 덩어리인 `'1234'`를 반환한다.\n\n<details>\n<summary>💡 <b>정답 및 시나공·과외노트식 보기별 완벽 해설 확인하기 (클릭)</b></summary>\n\n**정답: ②**\n- **해설**: 수량자 **`+`**는 앞 문자(`B`)가 **1회 이상** 나타나야 하므로, `B`가 0번 나타난 **`'AC'`와는 일치하지 않습니다!** (`'AC'`까지 일치하려면 0회 이상을 뜻하는 **`AB*C`** 또는 0~1회를 뜻하는 **`AB?C`**여야 합니다).\n\n</details>\n</div>\n\n---\n\n## ⏱️ STEP 5. 시험장 입실 직전 30초 최종 요약 카드\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · 5개 함수: **REGEXP_LIKE** (조건) / **REGEXP_REPLACE** (교체) / **REGEXP_SUBSTR** (추출) / **REGEXP_INSTR** (위치) / **REGEXP_COUNT** (횟수)\n> · 자주 쓰는 메타: `.` (1글자), `*` (0+), `+` (1+), `?` (0/1), `[abc]`, `[^abc]`, `^` (시작), `$` (끝)\n> · `\\d` = 숫자 / `\\w` = 영숫자_  / `\\s` = 공백 / `[가-힣]` = 한글 1자\n> · `^` 함정 = `[]` 밖이면 **시작** / `[]` 안이면 **부정**\n> · 옵션 4번째 인자: `i` 대소문자 무시 / `m` 멀티라인\n> · LIKE 와 차이 = 표현력 ↑, **성능 약간 ↓**"}, {"id": "ch-27", "index": 27, "title": "2-3-1. DML (Data Manipulation Language)", "subj_id": "tab4", "subj_name": "2과목 3장 · 관리 구문", "badge": "2과목 3장 · 관리 구문 (DML/TCL/DDL/DCL)", "md": "# 2-3-1. DML (Data Manipulation Language)\n\n> **단원 분류**: `2과목` > `2-3. 관리 구문` > **`2-3-1. DML`**\n> **🎯 출제 빈도**: `★★★★★ (매회 1~2문항 출제)` &nbsp;|&nbsp; **🧠 두문자 암기 공식**: `빈 문자열('') 입력 시: Oracle = NULL (IS NULL 조회) vs SQL Server = '' 공백 그대로 (= '' 조회) / MERGE의 DELETE는 UPDATE된 건만!`\n\n## 🎯 과외선배의 1분 브리핑 & 핵심 구조도\n\n> [!TIP]\n> **👨‍🏫 1:1 과외선배의 학습 코칭 (`유선배 과외노트` 스타일)**\n> DML 파트에서 출제위원이 가장 좋아하는 함정 3가지: ① **`INSERT INTO T VALUES ('')`를 실행했을 때, 오라클은 빈 문자열 `''`을 `NULL`로 저장하므로 `WHERE COL IS NULL`로 찾아야 하지만, SQL Server는 빈 문자열 `''` 그대로 저장하므로 `WHERE COL = ''`로 찾아야 한다!** ② **`DELETE [FROM] 테이블명;`에서 `FROM`은 생략 가능하지만 `DELETE * FROM`처럼 `*`를 쓰면 문법 에러다!** ③ **`MERGE INTO` 구문에서 `WHEN MATCHED THEN UPDATE ... DELETE WHERE ...`의 `DELETE` 절은 오직 방금 `UPDATE`가 수행된 행들에 대해서만 동작한다!** (30회 기출 42번)\n\n> DML은 테이블 안의 데이터를 입력·수정·삭제·조회하는 명령어들이다(INSERT, UPDATE, DELETE, MERGE, SELECT).\n\nex) 노트에 비유하면 INSERT는 새 줄 적기, UPDATE는 줄 고치기, DELETE는 줄 지우기, MERGE는 있으면 고치고 없으면 적기, SELECT는 읽기다.\n\n### 🗺️ 한눈에 보는 핵심 구조도: DML의 분류\n\n| DML (데이터 조작어) 5대 명령어 | 역할 및 핵심 특징 |\n| :---: | :--- |\n| **`SELECT`** | 테이블의 데이터를 조회 (엄밀히는 질의어 DQL로 분류하기도 하나 넓은 의미의 DML에 포함) |\n| **`INSERT INTO 테이블 VALUES (...)`** | 테이블에 새로운 행(Row)을 삽입 |\n| **`UPDATE 테이블 SET 컬럼 = 값`** | 조건에 맞는 기존 행의 컬럼 값을 수정 |\n| **`DELETE [FROM] 테이블`** | 조건에 맞는 행을 삭제 (`FROM` 생략 가능, 로그를 남기므로 **`ROLLBACK` 가능**, 용량 초기화 안 됨) |\n| **`MERGE INTO 타겟 USING 소스 ON (조건)`** | 조건이 일치하면(`WHEN MATCHED`) `UPDATE` (+ 선택적 `DELETE`), 불일치하면(`WHEN NOT MATCHED`) `INSERT` 수행 |\n\n| 명령 | 용도 |\n|---|---|\n| INSERT | 새 행 입력 |\n| UPDATE | 기존 행 수정 |\n| DELETE | 행 삭제 |\n| MERGE | UPSERT(있으면 UPDATE, 없으면 INSERT) |\n| SELECT | 조회 |\n\n---\n\n## 📘 STEP 1. 시험 출제 핵심 이론 & 강의 도표 완벽 정복\n\n### 📌 1. DML(데이터 조작어)의 개요와 4대 명령어 (`INSERT`, `UPDATE`, `DELETE`, `MERGE`)\n- 테이블에 데이터를 입력(`INSERT`), 수정(`UPDATE`), 삭제(`DELETE`), 병합(`MERGE`), 조회(`SELECT`)하는 명령어이다.\n\n![DML 주요 명령어(INSERT, UPDATE, DELETE, MERGE) 요약표](images/p082_img01.png)\n\n---\n\n### 📌 2. `INSERT` 문 작성법 2가지와 빈 문자열(`''`)의 DBMS별 차이\n1. **컬럼 리스트를 명시하는 방식**:\n   ```sql\n   INSERT INTO 테이블명 (컬럼1, 컬럼2, ...) VALUES (값1, 값2, ...);\n   ```\n   - `컬럼 리스트`의 순서·개수·데이터 타입과 `VALUES` 절의 값 순서·개수·타입이 1:1로 일치해야 한다.\n   - **명시하지 않은 나머지 컬럼들에는 자동으로 `NULL` 값(또는 테이블 생성 시 지정한 `DEFAULT` 값)이 입력**된다! (단, 생략된 컬럼에 `NOT NULL` 제약조건이 걸려 있고 `DEFAULT` 값도 없다면 에러 발생!)\n2. **컬럼 리스트를 생략하는 방식 (전체 컬럼 입력)**:\n   ```sql\n   INSERT INTO 테이블명 VALUES (전체컬럼값1, 전체컬럼값2, ...);\n   ```\n   - 테이블에 정의된 **모든 컬럼의 순서대로 빠짐없이** 값을 나열해야 한다. 값을 넣지 않을 컬럼 자리에는 명시적으로 `NULL`이나 `''`을 적어야 한다.\n3. **🔥 빈 문자열(`''`) 입력 시 Oracle vs SQL Server 차이 (★단골 출제!)**:\n   - **Oracle**: `INSERT` 시 빈 문자열 **`''`을 입력하면 자동으로 `NULL`로 변환되어 저장**된다! 따라서 조회할 때도 `WHERE COL = ''`이 아니라 **`WHERE COL IS NULL`**로 조회해야 나온다!\n   - **SQL Server**: 빈 문자열 **`''`을 `NULL`이 아닌 길이가 0인 빈 문자열 값 자체로 저장**한다! 따라서 조회할 때 **`WHERE COL = ''`**로 조회해야 나온다!\n\n![INSERT 문 2가지 작성 유형 및 실행 예시 1](images/p082_img02.png)\n\n![INSERT 문 실행 예시 2](images/p082_img03.png)\n\n![INSERT 문 실행 예시 3](images/p082_img04.png)\n\n![INSERT 시 NULL 및 빈 문자열('') 입력 처리 예시 1](images/p083_img01.png)\n\n![서브쿼리를 이용한 다중 행 INSERT (INSERT INTO ... SELECT ...) 예시 2](images/p083_img02.png)\n\n![INSERT 문 제약조건 및 컬럼 매칭 주의사항 3](images/p083_img03.png)\n\n---\n\n### 📌 3. `UPDATE` 문과 `DELETE` 문, 그리고 DDL vs DML의 내부 처리 차이\n- **`UPDATE` 문**:\n  ```sql\n  UPDATE 테이블명\n     SET 수정할컬럼1 = 새값1, 수정할컬럼2 = 새값2\n   [WHERE 조건절];\n  ```\n  - ⚠️ **`WHERE` 절을 생략하면 테이블의 모든 행(전체 데이터)이 전부 수정**되므로 주의!\n- **`DELETE` 문**:\n  ```sql\n  DELETE [FROM] 테이블명\n   [WHERE 조건절];\n  ```\n  - **`FROM` 키워드는 생략 가능**하다 (`DELETE EMP WHERE ...` 가능!).\n  - **`WHERE` 절을 생략하면 테이블의 모든 행이 삭제**된다. (단, 테이블 구조와 디스크 저장공간(용량)은 그대로 남아있으며 `ROLLBACK` 가능!)\n- **🔥 DML (`INSERT/UPDATE/DELETE`) vs DDL (`CREATE/ALTER/DROP/TRUNCATE`) 처리 방식 차이**:\n  - **DML**: 명령어를 실행하면 디스크의 데이터 파일에 바로 반영되는 것이 아니라 **메모리 버퍼(Buffer)에만 변경사항이 올라가며 Redo/Undo 로그를 기록**한다. 따라서 변경을 확정하려면 **`COMMIT`**을 해야 하고, 취소하려면 **`ROLLBACK`**으로 원상복구할 수 있다! *(단, SQL Server는 기본적으로 DML도 `AUTO COMMIT` 모드이나, `BEGIN TRAN`을 열면 수동 커밋/롤백이 가능함)*\n  - **DDL**: 실행하는 즉시 **자동으로 `AUTO COMMIT`**이 수행되어 디스크에 영구 반영되며 **`ROLLBACK`이 불가능**하다!\n\n![UPDATE 문 기본 문법 및 다중 컬럼 수정 예시 1](images/p083_img04.png)\n\n![UPDATE 문 실행 쿼리 예시 2](images/p083_img05.png)\n\n![서브쿼리를 활용한 UPDATE 문 예시 1](images/p084_img01.png)\n\n![서브쿼리를 활용한 UPDATE 문 예시 2](images/p084_img02.png)\n\n![DELETE 문 기본 구문 및 실행 예시 3](images/p084_img03.png)\n\n![DELETE 문 실행 결과 확인 4](images/p084_img04.png)\n\n---\n\n### 📌 4. `MERGE` 문 (조건부 입력·수정·삭제 통합 구문) 및 DML 에러 사례\n- **`MERGE` 문의 역할**: 기준 테이블(Target)과 소스 테이블(Source/서브쿼리)을 조인(`ON`)하여, **일치하는 행이 있으면(`WHEN MATCHED THEN`) `UPDATE`(또는 `DELETE` 포함 가능)**를 수행하고, **일치하는 행이 없으면(`WHEN NOT MATCHED THEN`) `INSERT`**를 한 번에 수행하는 명령어이다.\n\n```sql\nMERGE INTO 타겟테이블 T\nUSING 소스테이블 S\n   ON (T.사원번호 = S.사원번호)               -- ★주의: ON 절에 사용된 연결 컬럼(T.사원번호)은 아래 UPDATE SET 절에서 절대 수정할 수 없음!(에러 발생)\n WHEN MATCHED THEN\n      UPDATE SET T.급여 = S.급여, T.부서 = S.부서   -- (주의: UPDATE 키워드 뒤에 테이블명 안 씀!)\n      [DELETE WHERE 조건]                     -- UPDATE 된 결과 행 중 특정 조건 행 즉시 삭제 가능\n WHEN NOT MATCHED THEN\n      INSERT (T.사원번호, T.급여, T.부서)     -- (주의: INSERT 뒤에 INTO 키워드 안 씀!)\n      VALUES (S.사원번호, S.급여, S.부서);\n```\n\n![MERGE 문 기본 문법 및 수행 과정 예시 1](images/p085_img01.png)\n\n![MERGE 문 실행 예시 2](images/p085_img02.png)\n\n![MERGE 문 실행 예시 3](images/p085_img03.png)\n\n![MERGE 문 실행 예시 4](images/p085_img04.png)\n\n![DML 수행 시 발생하는 주요 제약조건 위반 에러 사례 1 (PK 중복, NOT NULL 위반)](images/p086_img01.png)\n\n![DML 수행 시 발생하는 제약조건 위반 에러 사례 2 (FK 참조 무결성 위반 — 부모 없는 자식 INSERT 불가)](images/p086_img02.png)\n\n![DML 수행 시 발생하는 제약조건 위반 에러 사례 3 (자식이 참조 중인 부모 행 DELETE 불가)](images/p086_img03.png)\n\n![DML 수행 시 데이터 타입 및 자리수 초과 에러 사례 4](images/p086_img04.png)\n\n---\n\n## 🔍 STEP 2. 직관적 Before & After 비교 & 실전 SQL 트레이스\n\n### 🔄 [Before & After] 직관적 비교\n\n3행짜리 EMP 테이블에 INSERT → UPDATE → DELETE를 순서대로 적용한다. D1 부서 직원(김·이) 두 명에게만 10% 인상이 들어가고, 새로 추가했던 4번 직원(최)은 마지막에 다시 삭제되는 흐름이다.\n\n### EMP\n\n| EMP_ID | NAME | DEPT_ID | SAL |\n|---|---|---|---|\n| 1 | 김 | D1 | 3000 |\n| 2 | 이 | D1 | 4000 |\n| 3 | 박 | D2 | 3500 |\n\n### `INSERT INTO EMP VALUES (4, '최', 'D2', 4500);`\n\n| EMP_ID | NAME | DEPT_ID | SAL |\n|---|---|---|---|\n| 1 | 김 | D1 | 3000 |\n| 2 | 이 | D1 | 4000 |\n| 3 | 박 | D2 | 3500 |\n| 4 | 최 | D2 | 4500 |\n\n### `UPDATE EMP SET SAL = SAL * 1.1 WHERE DEPT_ID = 'D1';`\n\n| EMP_ID | NAME | DEPT_ID | SAL |\n|---|---|---|---|\n| 1 | 김 | D1 | 3300 |\n| 2 | 이 | D1 | 4400 |\n| 3 | 박 | D2 | 3500 |\n| 4 | 최 | D2 | 4500 |\n\n### `DELETE FROM EMP WHERE EMP_ID = 4;`\n\n| EMP_ID | NAME | DEPT_ID | SAL |\n|---|---|---|---|\n| 1 | 김 | D1 | 3300 |\n| 2 | 이 | D1 | 4400 |\n| 3 | 박 | D2 | 3500 |\n\nDML은 행 단위로 데이터를 바꾸지만 테이블 구조는 건드리지 않는다. 위 작업은 모두 COMMIT 전까지 메모리에만 머무르므로, 잘못 친 UPDATE·DELETE는 ROLLBACK으로 되돌릴 수 있다. 반대로 같은 \"삭제\"라도 TRUNCATE·DROP은 DDL이라 자동 COMMIT되며 되돌릴 수 없다. 데이터만 비울지·구조까지 없앨지·되돌릴 여지를 둘지를 의식해서 명령을 고른다.\n\n### 💻 [SQL 실전 트레이스]\n\n\n\n---\n\n## 🚨 STEP 3. 출제위원 단골 함정 O/X & 노랭이·기출 문항별 족보\n\n### ⚠️ 시험장 단골 함정 vs 정답 1:1 대조표\n\n| 함정 | 정답 |\n|---|---|\n| TRUNCATE는 DDL인가 DML인가 | DDL(롤백 불가) |\n| DELETE 후 ROLLBACK 가능? | 가능(DML) |\n| `INSERT INTO ... VALUES`는 한 번에 한 행만? | 일반 INSERT는 1행. INSERT ALL 또는 `INSERT INTO ... SELECT`로 다중행 |\n| `UPDATE ... WHERE` 누락 시 | 모든 행 수정 |\n| MERGE의 두 가지 절 | WHEN MATCHED / WHEN NOT MATCHED |\n| DML 후 자동 커밋? | Oracle은 명시적 COMMIT 필요 |\n\n단골 함정: TRUNCATE와 DELETE의 차이. TRUNCATE는 롤백 불가, AUTO_COMMIT, 빠름.\n\n### 📒 이 단원과 직결된 『SQL 자격검정 실전문제(노랭이)』 & 기출 킬러 족보\n\n- **[노랭이 2과목 23·37·45번 ★최빈출]** ① `DELETE FROM 테이블명`에서 `SELECT`처럼 `*`를 쓰지 않으며 `FROM`은 생략 가능하다(`DELETE 테이블명;`). ② `INSERT` 구문으로 `''`(빈 문자열) 삽입 시 **Oracle은 `NULL`로 입력(`IS NULL`로 조회)**되고, **SQL Server는 `''` 공백문자 그대로 입력(`= ''`로 조회)**된다!\n- **[30회 기출 42번 ★중요]** `MERGE INTO` 구문에서 `WHEN MATCHED THEN` 내부의 **`DELETE` 절은 `UPDATE` 절에 종속**된다 (`UPDATE`가 실행된 건에 한해서만 변경된 값을 기준으로 `DELETE` 조건이 동작함!).\n- **[30회 기출 47번 & 34회 기출 36번]** `DEFAULT` 값이 지정된 컬럼이라도 `INSERT` 문에서 컬럼명을 생략하고 전체 컬럼을 입력할 때는 값을 반드시 넣어주어야 하며(`DEFAULT` 키워드 명시 가능), 만약 컬럼을 명시하고 값으로 **`NULL`을 직접 넣으면 `DEFAULT` 값이 아니라 `NULL`이 입력**된다!\n\n---\n\n## ✍️ STEP 4. 실전 적중! 단원 마무리 확인 문제\n\n<div class=\"sqld-quiz-box\" data-answer=\"2\">\n\n**Q. [2-3-1 대표 적중 문제]** 다음 중 데이터 조작어(DML: `INSERT`, `UPDATE`, `DELETE`, `MERGE`)에 대한 설명으로 **가장 부적절한** 것은?\n\n- ① 오라클(Oracle)에서 `INSERT INTO EMP (EMPNO, ENAME) VALUES (1001, '');`를 실행한 후 해당 행을 조회하려면 `WHERE ENAME = ''`가 아니라 `WHERE ENAME IS NULL` 조건을 사용해야 한다.\n- ② `DEFAULT '일반회원'`으로 설정된 `GRADE` 컬럼이 있을 때, `INSERT INTO MEMBER (ID, GRADE) VALUES ('M01', NULL);`을 실행하면 `GRADE` 컬럼에는 `'일반회원'`이 저장된다.\n- ③ `DELETE` 문에서 `FROM` 키워드는 생략이 가능하므로 `DELETE EMP WHERE DEPTNO = 10;`은 정상적으로 실행된다.\n- ④ `MERGE INTO` 문에서 `WHEN MATCHED THEN UPDATE SET ... DELETE WHERE ...` 구문의 `DELETE` 절은 단독으로 사용할 수 없으며, `UPDATE`가 수행된 행들에 대해서만 삭제 조건을 검사한다.\n\n<details>\n<summary>💡 <b>정답 및 시나공·과외노트식 보기별 완벽 해설 확인하기 (클릭)</b></summary>\n\n**정답: ②**\n- **해설**: 컬럼에 `DEFAULT` 값이 설정되어 있더라도, `INSERT` 문에서 값으로 **`NULL`을 명시적으로 지정하여 입력하면 `DEFAULT` 값이 작동하지 않고 그대로 `NULL`이 입력**됩니다! (`DEFAULT` 값이 들어가게 하려면 `INSERT` 컬럼 목록에서 해당 컬럼을 아예 생략하거나, 값 자리에 `DEFAULT` 키워드를 적어야 합니다).\n\n</details>\n</div>\n\n---\n\n## ⏱️ STEP 5. 시험장 입실 직전 30초 최종 요약 카드\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · DML 5종: **INSERT / UPDATE / DELETE / MERGE / SELECT**\n> · DELETE = **DML** (롤백 O) / TRUNCATE = **DDL** (롤백 X, 자동 COMMIT) / DROP = 테이블 자체 삭제\n> · UPDATE 에 WHERE 누락 = **모든 행 수정** (위험)\n> · MERGE = `WHEN MATCHED THEN UPDATE` + `WHEN NOT MATCHED THEN INSERT` (UPSERT)\n> · INSERT 다중행 = **`INSERT ALL`** 또는 **`INSERT INTO ... SELECT`**\n> · DML 후 Oracle 은 **명시적 COMMIT 필요** (DDL 은 자동)"}, {"id": "ch-28", "index": 28, "title": "2-3-2. TCL (Transaction Control Language)", "subj_id": "tab4", "subj_name": "2과목 3장 · 관리 구문", "badge": "2과목 3장 · 관리 구문 (DML/TCL/DDL/DCL)", "md": "# 2-3-2. TCL (Transaction Control Language)\n\n> **단원 분류**: `2과목` > `2-3. 관리 구문` > **`2-3-2. TCL`**\n> **🎯 출제 빈도**: `★★★★★ (매회 1~2문항 100% 출제!)` &nbsp;|&nbsp; **🧠 두문자 암기 공식**: `ACID(원자성·일관성·고립성·영속성) / Oracle은 DML 시작 시 트랜잭션 자동 시작 + DDL 실행 시 앞선 DML까지 AUTO COMMIT!`\n\n## 🎯 과외선배의 1분 브리핑 & 핵심 구조도\n\n> [!TIP]\n> **👨‍🏫 1:1 과외선배의 학습 코칭 (`유선배 과외노트` 스타일)**\n> TCL에서 무조건 나오는 3가지: ① **오라클에서 `INSERT/UPDATE`를 한 뒤 `COMMIT`을 안 하고 곧바로 `CREATE/ALTER/DROP/TRUNCATE`(DDL)를 실행하면, DDL이 실행되는 순간 앞선 DML까지 자동으로 `COMMIT`되어 이후 `ROLLBACK`을 해도 되돌릴 수 없다!** (반면 SQL Server는 DDL도 트랜잭션에 포함되어 `ROLLBACK` 가능!), ② **`SAVEPOINT A` 이후 `SAVEPOINT B`를 만들고 `ROLLBACK TO A`를 실행하면, `A` 이후에 만든 `B`는 소멸되어 다시 `ROLLBACK TO B`를 할 수 없다!** ③ 고립성 낮을 때 발생하는 3대 현상(**Dirty Read, Non-Repeatable Read, Phantom Read**) 정의 구분!\n\n> TCL은 트랜잭션을 제어하는 명령어들이다(COMMIT, ROLLBACK, SAVEPOINT).\n\nex) 워드(Word)에서 작성 중인 내용은 메모리에만 있고, 저장 버튼이 COMMIT(영구 반영), CTRL+Z가 ROLLBACK(취소), 임시 저장 지점이 SAVEPOINT(부분 취소)에 해당한다.\n\n### 🗺️ 한눈에 보는 핵심 구조도: 트랜잭션의 흐름\n\n| 트랜잭션 진행 흐름 | 명령어 | 실행 결과 및 Lock 상태 |\n| :---: | :---: | :--- |\n| **1. 트랜잭션 시작 & 작업** | `INSERT` / `UPDATE` / `DELETE` | 메모리 버퍼에만 반영된 상태, 변경된 행에 **Lock(잠금)** 설정, 본인만 변경 결과 조회 가능 |\n| **2. 중간 저장점 설정** | `SAVEPOINT sp1;` | 전체 롤백 대신 특정 지점(`sp1`)까지만 부분 롤백(`ROLLBACK TO sp1`)할 수 있도록 북마크 지정 |\n| **3-A. 영구 반영 (성공)** | **`COMMIT;`** | 변경 사항을 디스크 DB에 **영구 저장**, 모든 저장점 소멸, **Lock 해제**, 이전 상태로 롤백 불가 |\n| **3-B. 전체 취소 (실패)** | **`ROLLBACK;`** | 마지막 `COMMIT` 직후(또는 트랜잭션 시작 전) 상태로 **전부 되돌림**, 모든 저장점 소멸, **Lock 해제** |\n\n---\n\n## 📘 STEP 1. 시험 출제 핵심 이론 & 강의 도표 완벽 정복\n\n### 📌 1. 트랜잭션(Transaction)의 정의와 4대 특성 (`ACID`) (★100% 출제!)\n- **트랜잭션의 정의**: 데이터베이스의 논리적 연산단위 (밀접히 관련되어 분리될 수 없는 한 개 이상의 데이터베이스 조작).\n- **트랜잭션의 4가지 특성 (`\"원·일·고·지\"` / `ACID`)**:\n\n| 특성 | 영문명 | 핵심 정의 (객관식 보기 판별 키워드) |\n| :---: | :---: | :--- |\n| **1. 원자성** | **Atomicity** | 트랜잭션에서 정의된 연산들은 **모두 성공적으로 실행되던지 아니면 전혀 실행되지 않은 상태로 남아있어야 한다 (`All or Nothing`)**. |\n| **2. 일관성** | **Consistency** | 트랜잭션이 실행되기 전의 데이터베이스 내용이 잘못되어 있지 않다면 **트랜잭션이 실행된 이후에도 데이터베이스의 내용에 잘못이 있으면 안 된다** (제약조건, 합계 일치 등 정합성 유지). |\n| **3. 고립성<br>(격리성)** | **Isolation** | 트랜잭션이 실행되는 도중에 **다른 트랜잭션의 영향을 받아 잘못된 결과를 만들어서는 안 된다**. |\n| **4. 지속성<br>(영속성)** | **Durability** | 트랜잭션이 일단 성공적으로 수행되면(`COMMIT` 완료 시) **그 트랜잭션이 갱신한 데이터베이스의 내용은 영구적으로 저장**된다. |\n\n![트랜잭션의 4대 특성 (원자성, 일관성, 고립성, 지속성) 요약표](images/p087_img01.png)\n\n### 📌 2. 트랜잭션 격리성(Isolation)이 낮을 때 발생하는 3대 문제점\n> 💡 **[핵심 필수 암기]**\n> **동시성 제어 3대 이상 현상 구분 (`\"더·논·팬\"`)**:\n> 1. **Dirty Read (오손 읽기)**: 다른 트랜잭션에 의해 **수정되었고 아직 커밋되지 않은(`Uncommitted`) 데이터**를 읽는 것. (만약 그 트랜잭션이 롤백되면 잘못된 데이터를 읽은 셈이 됨!)\n> 2. **Non-Repeatable Read (반복 불가능 읽기)**: 한 트랜잭션 내에서 같은 쿼리를 두 번 수행했는데, 그 사이에 다른 트랜잭션이 값을 **수정(`UPDATE`) 또는 삭제(`DELETE`)하고 커밋**하여 **두 쿼리의 결과가 다르게 나타나는 현상**.\n> 3. **Phantom Read (유령 데이터 읽기)**: 한 트랜잭션 내에서 같은 범위 쿼리를 두 번 수행했는데, 그 사이에 다른 트랜잭션이 **새로운 행을 삽입(`INSERT`)하고 커밋**하여 첫 번째 쿼리에서 **없던 유령(Phantom) 레코드가 두 번째 쿼리에서 새로 나타나는 현상**.\n\n---\n\n### 📌 3. `COMMIT`, `ROLLBACK`, `SAVEPOINT`의 동작 원리와 주의사항\n\n1. **`COMMIT` (변경사항 영구 반영)**:\n   - 입력/수정/삭제한 자료에 대해서 전혀 문제가 없다고 판단되었을 경우 `COMMIT` 명령어를 통해서 트랜잭션을 완료한다.\n   - **🔥 Oracle에서 자동으로 `COMMIT`이 일어나는 경우 (★초빈출 함정!)**:\n     - **`DDL` 문 (`CREATE`, `ALTER`, `DROP`, `TRUNCATE`, `RENAME`)이나 `DCL` 문 (`GRANT`, `REVOKE`)을 실행하면, 그 이전에 수행했던 아직 커밋 안 된 모든 DML 문장들까지 자동으로 함께 `AUTO COMMIT` 되어버린다!** (이후 `ROLLBACK`을 해도 이미 DDL 시점에 커밋되었으므로 절대 되돌릴 수 없다!)\n     - SQL*Plus 등을 **정상 종료(`EXIT`)**하면 자동 `COMMIT` 되고, 정전이나 강제 종료 등으로 **비정상 종료**되면 자동 `ROLLBACK` 된다.\n\n2. **`ROLLBACK` (변경사항 취소)**:\n   - 테이블 내 입력한 데이터나 수정한 데이터, 삭제한 데이터에 대하여 `COMMIT` 이전에는 변경 사항을 취소할 수 있다.\n   - 전체 `ROLLBACK`을 실행하면 **직전 `COMMIT` 한 지점(또는 트랜잭션 시작 시점)**까지 모든 DML 변경사항이 취소되고, 걸려 있던 행 잠금(Lock)이 해제된다.\n\n3. **`SAVEPOINT` (저장점, 부분 롤백)**:\n   - 저장점(`SAVEPOINT`)을 정의하면 롤백할 때 트랜잭션에 포함된 전체 작업을 롤백하는 것이 아니라 **현 시점에서 해당 `SAVEPOINT`까지만 트랜잭션의 일부를 롤백**할 수 있다!\n   - **문법 차이**:\n     - **Oracle**: `SAVEPOINT SV1;` ➔ **`ROLLBACK TO SV1;`**\n     - **SQL Server**: `SAVE TRANSACTION SV1;` (또는 `SAVE TRAN SV1`) ➔ **`ROLLBACK TRANSACTION SV1;`** (또는 `ROLLBACK TRAN SV1`)\n   - **🚨 `SAVEPOINT` 절대 함정 2가지 (★시험에서 행 개수 계산할 때 100% 출제!)**:\n     1. **과거로 돌아가면 미래의 세이브포인트는 소멸된다!**:\n        - 시간 순서대로 `SAVEPOINT A` ➔ (작업) ➔ `SAVEPOINT B`를 만든 상태에서, 먼저 **`ROLLBACK TO A;`를 실행하여 과거(`A`)로 돌아가 버리면, 그 이후에 만들었던 `SAVEPOINT B`는 메모리에서 사라진다!** 따라서 그 직후에 `ROLLBACK TO B;`를 실행하면 **에러가 발생**한다! (반대로 `ROLLBACK TO B`를 먼저 하고 그 다음에 `ROLLBACK TO A`를 하는 것은 가능!)\n     2. **중간에 `COMMIT`이나 `DDL`(`CREATE`, `ALTER` 등)이 실행되면 모든 `SAVEPOINT`가 초기화(소멸)된다!**:\n        - 트랜잭션이 종료되었으므로 이전의 `SAVEPOINT`로 `ROLLBACK TO`를 시도하면 에러가 나며 데이터도 되돌아가지 않는다!\n\n![COMMIT과 ROLLBACK 수행 전후 데이터 상태 예시](images/p087_img02.png)\n\n![트랜잭션 진행 중 타 세션(사용자)에서 조회되는 데이터와 Lock(잠금) 상태 도식](images/p088_img01.png)\n\n![SAVEPOINT 설정 및 부분 롤백(ROLLBACK TO) 타임라인 도식 1](images/p089_img01.png)\n\n![SAVEPOINT A -> B 설정 후 ROLLBACK 순서에 따른 유효성 비교 도식 2](images/p089_img02.png)\n\n![SAVEPOINT 단계별 DML 실행 및 최종 테이블 결과 추적 예제 3](images/p089_img03.png)\n\n---\n\n## 🔍 STEP 2. 직관적 Before & After 비교 & 실전 SQL 트레이스\n\n### 🔄 [Before & After] SAVEPOINT 동작\n\n비어있는 EMP에 김·이·박을 차례로 INSERT하면서 SP1, SP2 두 지점을 찍어 둔다. 마지막에 `ROLLBACK TO SP1`을 걸면 어디까지 살아남는지, 그 뒤 COMMIT까지 어떻게 이어지는지를 시점별로 추적한다.\n\n### EMP\n\n| EMP_ID | NAME |\n|---|---|\n| (비어있음) | |\n\n### 작업 시나리오\n\n```sql\nINSERT INTO EMP VALUES (1, '김');\nSAVEPOINT SP1;\nINSERT INTO EMP VALUES (2, '이');\nSAVEPOINT SP2;\nINSERT INTO EMP VALUES (3, '박');\nROLLBACK TO SP1;\nCOMMIT;\n```\n\n### 시점별 상태\n\n| 시점 | 데이터 |\n|---|---|\n| 첫 INSERT 후 | 김 |\n| SP1 | 김 |\n| 둘째 INSERT 후 | 김, 이 |\n| SP2 | 김, 이 |\n| 셋째 INSERT 후 | 김, 이, 박 |\n| ROLLBACK TO SP1 | 김 |\n| COMMIT | 김 |\n\n`ROLLBACK TO SP1`은 SP1 이후의 DML(이·박 INSERT)만 취소하고 그 이전 작업은 그대로 둔다. 그래서 최종 COMMIT 시점에는 김 한 행만 남는다. 트랜잭션 도중 일부만 되돌리고 싶을 때는 SAVEPOINT로 안전 지점을 찍어둔다. 단, 전체 ROLLBACK이나 COMMIT이 일어나면 SAVEPOINT는 모두 사라진다.\n\n### 💻 [SQL 실전 트레이스]\n\n```sql\n-- 트랜잭션 1: 정상 처리\nINSERT INTO ACCOUNT VALUES (101, 'A', 10000);\nINSERT INTO ACCOUNT VALUES (102, 'B', 5000);\nCOMMIT;     -- 둘 다 저장\n\n-- 트랜잭션 2: 중간 오류\nUPDATE ACCOUNT SET BALANCE = BALANCE - 1000 WHERE ID = 101;\nSAVEPOINT BEFORE_DEPOSIT;\n\nUPDATE ACCOUNT SET BALANCE = BALANCE + 1000 WHERE ID = 999;  -- 존재 X\n\n-- 부분 취소 후 다른 처리\nROLLBACK TO BEFORE_DEPOSIT;\nUPDATE ACCOUNT SET BALANCE = BALANCE + 1000 WHERE ID = 102;\nCOMMIT;\n```\n\n---\n\n## 🚨 STEP 3. 출제위원 단골 함정 O/X & 노랭이·기출 문항별 족보\n\n### ⚠️ 시험장 단골 함정 vs 정답 1:1 대조표\n\n| 함정 | 정답 |\n|---|---|\n| TCL 명령어 종류 | COMMIT / ROLLBACK / SAVEPOINT |\n| DDL 실행 후 | Oracle은 자동 COMMIT |\n| ROLLBACK의 범위 | 마지막 COMMIT 이후 모든 DML |\n| SAVEPOINT의 의미 | 부분 ROLLBACK 가능 지점 |\n| ROLLBACK TO SP1 후 SP1 이전 작업 | 유지 |\n| ROLLBACK 후 SAVEPOINT는 | 모두 사라짐 |\n| 비정상 종료 시 | 자동 ROLLBACK |\n\n단골 함정: \"DDL 실행 후 ROLLBACK으로 취소 가능\"은 틀렸다. Oracle에서 DDL은 자동 COMMIT이다.\n\n### 📒 이 단원과 직결된 『SQL 자격검정 실전문제(노랭이)』 & 기출 킬러 족보\n\n- **[노랭이 2과목 28번 ★중요체크]** 낮은 트랜잭션 격리성에서 발생하는 3가지 문제:\n  - **Dirty Read**: 다른 트랜잭션에 의해 수정되었지만 **아직 커밋되지 않은(Uncommitted) 데이터**를 읽는 현상\n  - **Non-Repeatable Read**: 한 트랜잭션 내에서 같은 쿼리를 두 번 수행할 때, 그사이에 다른 트랜잭션이 값을 **수정(Update) 또는 삭제(Delete)**하여 두 쿼리 결과가 다르게 나타나는 현상\n  - **Phantom Read**: 한 트랜잭션 내에서 일정 범위를 두 번 조회할 때, 첫 번째 쿼리에서 없던 **유령 레코드가 다른 트랜잭션의 삽입(Insert)으로 인해 두 번째 쿼리에서 새로 나타나는** 현상\n- **[노랭이 2과목 123·126번]** 프로시저와 사용자 정의 함수는 내부에서 `COMMIT/ROLLBACK` 등 TCL 사용이 가능하지만, **트리거(Trigger) 내부에서는 TCL(`COMMIT`, `ROLLBACK`)을 절대 사용할 수 없다!**\n\n---\n\n## ✍️ STEP 4. 실전 적중! 단원 마무리 확인 문제\n\n<div class=\"sqld-quiz-box\" data-answer=\"2\">\n\n**Q. [2-3-2 대표 적중 문제]** 빈 테이블 `T1`에 대하여 **오라클(Oracle)** 환경에서 아래의 SQL 문들을 순서대로 실행했을 때, 마지막 `SELECT COUNT(*) FROM T1;`의 결과로 **올바른** 것은?\n```sql\nINSERT INTO T1 VALUES (1);\nSAVEPOINT SP1;\nINSERT INTO T1 VALUES (2);\nSAVEPOINT SP2;\nINSERT INTO T1 VALUES (3);\nROLLBACK TO SP1;\nCREATE TABLE T2 (ID NUMBER);\nINSERT INTO T1 VALUES (4);\nROLLBACK;\nSELECT COUNT(*) FROM T1;\n```\n\n- ① `0`\n- ② `1`\n- ③ `2`\n- ④ `3`\n\n<details>\n<summary>💡 <b>정답 및 시나공·과외노트식 보기별 완벽 해설 확인하기 (클릭)</b></summary>\n\n**정답: ② (`1`)**\n- **해설**: 단계별로 따라가 보면 아주 쉽습니다!\n  1. `1` 입력 ➔ `SP1` 저장 ➔ `2` 입력 ➔ `SP2` 저장 ➔ `3` 입력 (현재 `[1, 2, 3]`).\n  2. `ROLLBACK TO SP1;` 실행 ➔ `SP1` 이후에 입력된 `2, 3`이 취소되어 현재 **`[1]`**만 남습니다.\n  3. **`CREATE TABLE T2 ...` (DDL 실행!)** ➔ 오라클에서 DDL을 실행하면 그 직전까지 살아있던 DML(`1` 입력)이 **자동으로 `COMMIT` 확정**됩니다!\n  4. `4` 입력 (현재 `[1, 4]`) ➔ `ROLLBACK;` 실행 ➔ 방금 입력한 `4`만 취소되고 이미 자동 커밋된 **`[1]`**은 그대로 남으므로 최종 건수는 **`1`**입니다!\n\n</details>\n</div>\n\n---\n\n## ⏱️ STEP 5. 시험장 입실 직전 30초 최종 요약 카드\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · TCL 3종: **COMMIT / ROLLBACK / SAVEPOINT**\n> · COMMIT = 영구 반영 + 락 해제 + 다른 사용자도 변경 사항 조회 가능\n> · ROLLBACK = **마지막 COMMIT 이후** 모든 DML 취소 (SAVEPOINT 도 함께 사라짐)\n> · ROLLBACK TO sp = **부분 취소** (sp 이전 작업은 유지)\n> · DDL 실행 = **자동 COMMIT** (롤백 불가)\n> · 비정상 종료 = **자동 ROLLBACK** / 정상 종료 = 자동 COMMIT\n> · Oracle 기본 격리 수준 = **READ COMMITTED**"}, {"id": "ch-29", "index": 29, "title": "2-3-3. DDL (Data Definition Language)", "subj_id": "tab4", "subj_name": "2과목 3장 · 관리 구문", "badge": "2과목 3장 · 관리 구문 (DML/TCL/DDL/DCL)", "md": "# 2-3-3. DDL (Data Definition Language)\n\n> **단원 분류**: `2과목` > `2-3. 관리 구문` > **`2-3-3. DDL`**\n> **🎯 출제 빈도**: `★★★★★ (매회 2문항 100% 출제!)` &nbsp;|&nbsp; **🧠 두문자 암기 공식**: `DELETE(DML, 롤백O, 로그남김) vs TRUNCATE(DDL, 롤백X, 구조유지·용량초기화) vs DROP(DDL, 롤백X, 테이블완전삭제)`\n\n## 🎯 과외선배의 1분 브리핑 & 핵심 구조도\n\n> [!TIP]\n> **👨‍🏫 1:1 과외선배의 학습 코칭 (`유선배 과외노트` 스타일)**\n> DDL 파트에서 시험에 나오는 핵심 4가지: ① **`DELETE` vs `TRUNCATE` vs `DROP` 비교표**는 100% 출제됩니다! ② **`CREATE TABLE 새테이블 AS SELECT ... (CTAS)`로 테이블을 복제하면 `NOT NULL` 제약조건만 복사되고 `PK, FK, UNIQUE, CHECK, DEFAULT`는 전부 날아간다!** ③ 컬럼 변경 문법 차이: **Oracle은 `ALTER TABLE T MODIFY (컬럼 ...)`(괄호 O), SQL Server는 `ALTER TABLE T ALTER COLUMN 컬럼 ...`(괄호 X, 여러 컬럼 동시 수정 불가!)** ④ **`ON DELETE SET NULL`이 걸려 있어도 자식 외래키 컬럼이 `NOT NULL`이면 부모 행 삭제가 불가능하다!**\n\n> DDL은 테이블·뷰·인덱스 같은 객체를 만들고 바꾸고 지우는 명령어들이다(CREATE, ALTER, DROP, TRUNCATE, RENAME).\n\n### 🗺️ 한눈에 보는 핵심 구조도: DDL 명령 5종\n\n| DDL (데이터 정의어) 5대 명령어 | 역할 및 핵심 특징 (★Oracle에서는 실행 즉시 `AUTO COMMIT`!) |\n| :---: | :--- |\n| **`CREATE TABLE / VIEW / INDEX`** | 새로운 데이터베이스 객체 생성 |\n| **`ALTER TABLE`** | 컬럼 추가(`ADD`), 컬럼 속성 변경(`MODIFY` / `ALTER COLUMN`), 컬럼 삭제(`DROP COLUMN`), 제약조건 추가/삭제 |\n| **`DROP TABLE`** | 테이블의 **데이터와 구조(존재 자체)를 아예 삭제** (`ROLLBACK` 절대 불가, 용량 완전 반환) |\n| **`TRUNCATE TABLE`** | 테이블의 **구조(껍데기)는 남기고 전체 데이터만 즉시 초기화** (`ROLLBACK` 절대 불가, 용량 초기화됨) |\n| **`RENAME 기존명 TO 새이름`** | 테이블 등 객체의 이름을 변경 |\n\n| 명령 | 의미 |\n|---|---|\n| CREATE | 객체(테이블/뷰/인덱스) 생성 |\n| ALTER | 객체 구조 변경 |\n| DROP | 객체 삭제 |\n| TRUNCATE | 데이터만 비움(구조 유지) |\n| RENAME | 이름 변경 |\n\nDDL은 자동 COMMIT된다. 실행 즉시 영구 반영되며 ROLLBACK 불가.\n\n---\n\n## 📘 STEP 1. 시험 출제 핵심 이론 & 강의 도표 완벽 정복\n\n### 📌 1. 데이터 타입: `CHAR` vs `VARCHAR2` 비교 (★단골 출제!)\n\n| 데이터 타입 | 의미 | 저장 방식 및 공백 채움 | 동등 비교 (`=`) 시 규칙 |\n| :--- | :--- | :--- | :--- |\n| **`CHAR(길이)`** | **고정 길이** 문자열 | 지정한 길이보다 짧은 문자열이 들어오면 **남는 공간을 공백(`' '`)으로 채워서(Padding)** 고정된 크기로 저장! | 끝에 붙은 **공백의 개수만 다르면 서로 같은 값(`TRUE`)으로 판정**! (`'AA' = 'AA   '` ➔ **참!**) |\n| **`VARCHAR2(길이)`** *(Oracle)*<br>**`VARCHAR(길이)`** *(SQL Server)* | **가변 길이** 문자열 | 실제 입력된 문자열의 길이만큼만 저장 공간을 할당하고 **남는 공간을 공백으로 채우지 않음!** | 공백도 엄연한 하나의 문자로 취급하므로 **공백 개수가 다르면 다른 값(`FALSE`)으로 판정**! (`'AA' = 'AA   '` ➔ **거짓!**)<br>*(따라서 `CHAR` 컬럼과 `VARCHAR2` 컬럼을 조인/비교할 때는 `TRIM`이 필요할 수 있음!)* |\n| **`NUMBER(P, S)`** | 가변 숫자형 | `P`(전체 유효 자릿수 Precision), `S`(소수점 이하 자릿수 Scale). 예: `NUMBER(8, 2)`는 전체 8자리 중 정수부 6자리, 소수부 2자리. | |\n| **`DATE` / `DATETIME`** | 날짜 및 시간형 | 연, 월, 일, 시, 분, 초 저장 | |\n\n![주요 데이터 타입(CHAR, VARCHAR2, NUMBER, DATE) 요약표](images/p090_img01.png)\n\n---\n\n### 📌 2. `CREATE TABLE` 규칙과 5대 제약조건 (Constraints), 참조 무결성 옵션\n- **테이블 및 칼럼 명명(Naming) 규칙 (★객관식 선지 단골!)**:\n  1. 반드시 **문자로 시작**해야 한다 (**숫자로 시작할 수 없다!** 단, 중간이나 끝에 숫자가 들어가는 것은 가능).\n  2. 알파벳(`A-Z`, `a-z`), 숫자, 그리고 특수문자는 **`_` (언더바), `$` (달러), `#` (샵) 딱 3가지만 허용**된다! (공백이나 `-` 하이픈 등은 사용 불가!)\n  3. 한 계정(스키마) 내에서 다른 테이블/객체와 이름이 중복될 수 없으며, 한 테이블 내에서 컬럼명이 중복될 수 없다.\n  4. SQL 예약어(`SELECT`, `TABLE`, `WHERE` 등)는 이름으로 사용할 수 없다.\n\n- **5대 제약조건 (Constraints) 특징 비교**:\n  1. **`PRIMARY KEY` (기본키)**: **`UNIQUE` + `NOT NULL`**. 테이블당 **단 1개만** 생성 가능(여러 컬럼을 묶어 1개의 복합 PK로 만드는 것은 가능!). 생성 시 자동으로 고유 인덱스(Unique Index) 생성.\n  2. **`UNIQUE KEY` (고유키)**: 중복된 값을 허용하지 않으나, **`NULL` 값은 여러 개 입력 가능**하다! (테이블에 여러 개 생성 가능)\n  3. **`NOT NULL`**: `NULL` 값 입력을 금지함. (주의: 테이블 레벨 방식으로는 정의할 수 없고 **컬럼 정의 옆에 쓰는 '컬럼 레벨' 방식으로만 정의 가능**!)\n  4. **`CHECK`**: 입력될 수 있는 값의 범위나 조건을 제한 (`CHECK (SAL > 0)`). *(단, 조건식이 `UNKNOWN` 즉 **`NULL`이 들어오면 `CHECK` 제약조건 위반으로 보지 않고 통과(허용)**시킨다!)*\n  5. **`FOREIGN KEY` (외래키)**: 부모 테이블의 `PK` 또는 `UNIQUE` 컬럼을 참조하며, 테이블당 여러 개 생성 가능하고 **`NULL` 값도 가질 수 있다**.\n\n- **외래키(FK) 참조 무결성 옵션 (부모 행 삭제 `ON DELETE` / 수정 시 자식 처리 방식)**:\n  - **`CASCADE`**: 부모 데이터 삭제 시 **자식 테이블의 관련 행들도 연쇄적으로 자동 삭제**!\n  - **`SET NULL`**: 부모 데이터 삭제 시 **자식 테이블의 FK 컬럼 값을 `NULL`로 변경**! (단, 자식 FK 컬럼이 `NOT NULL`이면 불가능)\n  - **`SET DEFAULT`**: 부모 데이터 삭제 시 자식 FK 값을 기본값(`DEFAULT`)으로 변경.\n  - **`RESTRICT` / `NO ACTION` (기본값)**: 자식 테이블에 참조하고 있는 행이 존재하면 **부모 데이터의 삭제를 거부(에러 발생)**!\n  - *(참고: 자식 테이블에 새 행을 `INSERT` 할 때 부모 테이블에 없는 키 값을 넣으려고 할 때의 옵션으로는 **`AUTOMATIC`**(부모 테이블에 자동으로 먼저 PK 생성 후 자식 삽입)과 **`DEPENDENT`**(부모에 있을 때만 삽입 허용, 기본값)가 있다.)*\n\n- **`CREATE TABLE 테이블명 AS SELECT ...` (CTAS, 서브쿼리로 테이블 복사 생성)**:\n  - ⚠️ **초특급 시험 포인트**: CTAS로 테이블을 복사 생성하면 기존 테이블의 구조(컬럼명, 데이터 타입)와 데이터는 그대로 복사되지만, **`PK`, `UNIQUE`, `FK`, `CHECK`, `DEFAULT` 등 모든 제약조건은 사라지고 오직 `NOT NULL` 제약조건 딱 하나만 복사된다!** (따라서 PK 등이 필요하면 생성 후 `ALTER TABLE`로 다시 추가해야 함!)\n\n![제약조건의 종류(PK, UK, NOT NULL, CHECK, FK) 요약표](images/p091_img01.png)\n\n![참조 무결성 옵션 (Delete/Modify Action 및 Insert Action) 표](images/p091_img02.png)\n\n![CREATE TABLE 구문 (컬럼 레벨 및 테이블 레벨 제약조건 정의) 예시 1](images/p091_img03.png)\n\n![DESC 명령어로 생성된 테이블 구조 확인 2](images/p091_img04.png)\n\n![SQL Server의 CREATE TABLE 구문 예시 1](images/p092_img01.png)\n\n![DEFAULT 기본값 옵션 지정 예시 2](images/p092_img02.png)\n\n![제약조건 위배 시 에러 확인 예시 3](images/p092_img03.png)\n\n![CTAS (CREATE TABLE AS SELECT) 테이블 복사 생성 예시 4](images/p092_img04.png)\n\n![CTAS 생성 결과 (NOT NULL 제약조건만 유지됨!) 확인 5](images/p092_img05.png)\n\n---\n\n### 📌 3. `ALTER TABLE` (테이블 구조 변경) Oracle vs SQL Server 문법 비교 (★빈출!)\n\n> 💡 **[핵심 필수 암기]**\n> **Oracle과 SQL Server의 `ALTER TABLE` 문법 차이 (객관식 문법 정오 판별 단골!)**\n\n| 변경 작업 | Oracle (오라클) 문법 | SQL Server (MSSQL) 문법 | 주의사항 |\n| :---: | :--- | :--- | :--- |\n| **1. 컬럼 추가 (`ADD`)** | `ALTER TABLE 테이블명` **`ADD (컬럼명 타입)`**;<br>*(괄호 사용 가능, **`COLUMN` 키워드 안 씀!**)* | `ALTER TABLE 테이블명` **`ADD 컬럼명 타입`**; | 새로 추가된 컬럼은 테이블의 **맨 마지막 열**에 위치하며(중간 위치 지정 불가!), 기존 행들의 값은 `NULL`로 채워짐. |\n| **2. 컬럼 삭제 (`DROP`)** | `ALTER TABLE 테이블명` **`DROP COLUMN 컬럼명`**; | `ALTER TABLE 테이블명` **`DROP COLUMN 컬럼명`**; | 데이터가 있든 없든 즉시 삭제되며 **롤백(복구) 불가!** 테이블에 최소 1개의 컬럼은 남아있어야 함 (모두 삭제 불가). |\n| **3. 컬럼 타입/길이/NOT NULL 변경** | `ALTER TABLE 테이블명` **`MODIFY (컬럼명 타입 [DEFAULT 값] [NOT NULL])`**; | `ALTER TABLE 테이블명` **`ALTER COLUMN 컬럼명 타입 [NOT NULL]`**;<br>*(주의: SQL Server는 **괄호를 쓰지 않으며**, 여러 컬럼을 동시에 변경할 수 없고, `DEFAULT` 제약조건 변경 시 별도 구문 필요!)* | - 컬럼 크기를 **늘리는 것은 항상 가능**하지만, **줄이는 것은 해당 컬럼의 모든 값이 `NULL`이거나 줄이려는 크기보다 작을 때만** 가능!<br>- 데이터 타입 변경은 해당 컬럼의 **모든 값이 `NULL`일 때만** 가능!<br>- `NOT NULL` 추가는 기존 행에 `NULL`이 하나도 없을 때만 가능!<br>- **`DEFAULT` 값을 변경하면 변경 이후에 `INSERT` 되는 행부터만 적용**되며 기존 행의 값은 바뀌지 않음! |\n| **4. 컬럼 이름 변경 (`RENAME`)** | `ALTER TABLE 테이블명` **`RENAME COLUMN 기존컬럼명 TO 새컬럼명`**; | **`sp_rename '테이블명.기존컬럼명', '새컬럼명', 'COLUMN'`* | |\n| **5. 제약조건 삭제 / 추가** | - 삭제: `ALTER TABLE 테이블명` **`DROP CONSTRAINT 제약조건명`**;<br>- 추가: `ALTER TABLE 테이블명` **`ADD CONSTRAINT 제약조건명 PRIMARY KEY (컬럼)`**; | Oracle과 동일! | |\n\n![ALTER TABLE ADD 컬럼 추가 구문 및 예시 1](images/p093_img01.png)\n\n![ALTER TABLE ADD 실행 결과 확인 2](images/p093_img02.png)\n\n![ALTER TABLE DROP COLUMN 컬럼 삭제 구문 3](images/p093_img03.png)\n\n![ALTER TABLE DROP COLUMN 실행 결과 4](images/p093_img04.png)\n\n![ALTER TABLE MODIFY / ALTER COLUMN 구문 5](images/p093_img05.png)\n\n![ALTER TABLE MODIFY로 컬럼 길이 및 NOT NULL 변경 예시 6](images/p093_img06.png)\n\n![ALTER TABLE RENAME COLUMN 컬럼명 변경 구문 7](images/p093_img07.png)\n\n![ALTER TABLE RENAME COLUMN 실행 예시 1](images/p094_img01.png)\n\n![ALTER TABLE DROP CONSTRAINT 제약조건 삭제 예시 2](images/p094_img02.png)\n\n![ALTER TABLE ADD CONSTRAINT 제약조건 추가 예시 3](images/p094_img03.png)\n\n![ALTER TABLE ADD CONSTRAINT로 FK 추가 후 구조 확인 4](images/p094_img04.png)\n\n![RENAME 테이블명 변경 구문 예시 1](images/p095_img01.png)\n\n![ON DELETE CASCADE 옵션이 적용된 테이블 생성 및 부모 삭제 테스트 2](images/p095_img02.png)\n\n![ON DELETE CASCADE 수행 결과 자식 행까지 연쇄 삭제된 모습 3](images/p095_img03.png)\n\n---\n\n### 📌 4. `RENAME`, `DROP TABLE`, `TRUNCATE TABLE` 및 **`DELETE` vs `TRUNCATE` vs `DROP` 완벽 비교**\n- **테이블 이름 변경 (`RENAME`)**:\n  - Oracle: **`RENAME 기존테이블명 TO 새테이블명;`** (또는 `ALTER TABLE 기존테이블명 RENAME TO 새테이블명;`)\n  - SQL Server: **`sp_rename '기존테이블명', '새테이블명';`**\n- **`DROP TABLE 테이블명 [CASCADE CONSTRAINTS];`**:\n  - 테이블의 모든 데이터뿐만 아니라 **테이블의 구조(스키마 정의) 자체를 완전히 삭제**한다.\n  - 다른(자식) 테이블에서 이 테이블의 PK를 외래키(FK)로 참조하고 있는 경우 그냥 `DROP TABLE`을 하면 에러가 발생하는데, 뒤에 **`CASCADE CONSTRAINTS`** 옵션을 붙이면 **자식 테이블에 걸려 있던 참조 제약조건(FK)까지 먼저 자동으로 끊어버린 뒤 부모 테이블을 삭제**한다! *(단, SQL Server에는 `CASCADE CONSTRAINTS` 옵션이 없으므로 자식 테이블의 FK 제약조건이나 자식 테이블을 먼저 삭제해야만 부모 테이블을 `DROP`할 수 있다!)*\n- **`TRUNCATE TABLE 테이블명;`**:\n  - 테이블 구조는 그대로 남기고 **모든 행(데이터)을 한 번에 영구 삭제**하며, 테이블이 사용하던 **디스크 저장 공간(용량)까지 초기 상태로 반환(해제)**한다! (DDL이므로 즉시 `AUTO COMMIT` 되어 **절대 `ROLLBACK` 불가**!)\n\n> 💡 **[핵심 필수 암기]**\n> **🔥 시험 출제율 100%! `DELETE` vs `TRUNCATE` vs `DROP` 3대 삭제 명령어 완벽 비교표**\n\n| 비교 항목 | `DELETE [FROM] 테이블명` | `TRUNCATE TABLE 테이블명` | `DROP TABLE 테이블명` |\n| :---: | :---: | :---: | :---: |\n| **SQL 명령어 분류** | **DML (데이터 조작어)** | **DDL (데이터 정의어)** | **DDL (데이터 정의어)** |\n| **`WHERE` 절(일부 행만 삭제)** | **⭕ 가능** (일부 행 선택 삭제 가능) | **❌ 불가능** (무조건 전체 행 삭제) | **❌ 불가능** (테이블 통째로 삭제) |\n| **삭제 후 테이블 구조(스키마)** | **유지됨** (남아있음) | **유지됨** (남아있음) | **❌ 완전히 삭제됨 (사라짐!)** |\n| **디스크 저장 공간 (용량)** | **반환 안 됨** (공간 그대로 차지) | **⭕ 즉시 반환됨 (초기화)** | **⭕ 즉시 전부 반환됨** |\n| **COMMIT / ROLLBACK 여부** | **수동 `COMMIT` / `ROLLBACK` 가능!** | **`AUTO COMMIT` / `ROLLBACK` 불가!** | **`AUTO COMMIT` / `ROLLBACK` 불가!** |\n| **Undo 로그 생성 및 처리 속도** | 행 단위로 로그 기록 ➔ **느림 (부하 큼)** | 로그 최소 기록 ➔ **매우 빠름 (부하 적음)** | 즉시 삭제 ➔ **가장 빠름** |\n\n![DROP TABLE CASCADE CONSTRAINTS 구문 및 실행 예시 1](images/p096_img01.png)\n\n![TRUNCATE TABLE 구문 예시 2](images/p096_img02.png)\n\n![TRUNCATE TABLE 실행 후 테이블 구조는 남고 데이터만 초기화된 모습 3](images/p096_img03.png)\n\n![DELETE를 사용한 전체 행 삭제 예시 4](images/p096_img04.png)\n\n![트랜잭션 및 테이블 삭제 실습 예시 5](images/p096_img05.png)\n\n![데이터 삭제 실습 결과 비교 1](images/p097_img01.png)\n\n![데이터 삭제 실습 결과 비교 2](images/p097_img02.png)\n\n![DROP, TRUNCATE, DELETE 개념 요약 3](images/p097_img03.png)\n\n![DROP vs TRUNCATE vs DELETE 완벽 비교표 (시험 직전 필수 암기!)](images/p097_img04.png)\n\n---\n\n### 📌 5. 기타 데이터베이스 객체: 뷰(`VIEW`), 시퀀스(`SEQUENCE`), 시노님(`SYNONYM`)\n1. **뷰 (VIEW) — 가상 테이블**:\n   - 실제 데이터를 물리적으로 저장하고 있지 않고, **`SELECT` 쿼리문(정의)만 저장**하고 있는 가상의 테이블이다.\n   - **뷰 사용의 3대 장점 (`\"독·편·보\"`)**:\n     - **독립성 (Independence)**: 원본 테이블 구조가 변경되어도 뷰를 사용하는 응용 프로그램은 변경하지 않아도 됨 (논리적 데이터 독립성 제공).\n     - **편리성 (Convenience)**: 복잡한 조인/서브쿼리 SQL을 뷰로 만들어 두면 사용자는 단순한 `SELECT * FROM 뷰이름`으로 쉽게 조회 가능.\n     - **보안성 (Security)**: 급여나 주민번호 같은 민감한 컬럼을 제외한 채 뷰를 만들어 권한을 부여함으로써 중요 데이터 노출 방지.\n   - 생성/수정: **`CREATE [OR REPLACE] VIEW 뷰이름 AS SELECT ...`** / 삭제: **`DROP VIEW 뷰이름;`**\n2. **시퀀스 (SEQUENCE)**:\n   - 자동으로 순차적으로 증가하는 유일한 번호(일련번호 PK 등)를 생성해주는 객체.\n   - **`시퀀스명.NEXTVAL`** (다음 번호 생성 및 증가), **`시퀀스명.CURRVAL`** (현재 번호 조회).\n3. **시노님 (SYNONYM, 동의어)**:\n   - 다른 유저의 객체나 긴 테이블 이름에 대해 간단한 별명(별칭)을 붙여주는 객체 (`CREATE [PUBLIC] SYNONYM 별칭 FOR 원본객체;`).\n\n![CREATE OR REPLACE VIEW 뷰 생성 구문](images/p098_img01.png)\n\n![시퀀스(SEQUENCE) 생성 옵션(START WITH, INCREMENT BY, MAXVALUE, CYCLE, CACHE) 및 실행 예시 1](images/p099_img01.png)\n\n![시퀀스 NEXTVAL을 활용한 INSERT 실행 결과 2](images/p099_img02.png)\n\n![시노님(SYNONYM) 생성 및 조회 예시 1](images/p100_img01.png)\n\n![DROP SYNONYM 시노님 삭제 구문 2](images/p100_img02.png)\n\n---\n\n## 🔍 STEP 2. 직관적 Before & After 비교 & 실전 SQL 트레이스\n\n### 🔄 [Before & After] 직관적 비교\n\nEMP_ID(PK)·NAME(NOT NULL)·SAL(DEFAULT 0)을 가진 EMP 테이블을 만들고, PHONE 컬럼을 더한 뒤, 같은 테이블에 TRUNCATE와 DROP을 차례로 적용한다. 데이터·구조·테이블 자체가 어느 명령에서 사라지는지를 비교한다.\n\n### CREATE 후\n\n```\nEMP\n─────────\nEMP_ID (PK)\nNAME (NOT NULL)\nSAL (DEFAULT 0)\n```\n\n### `ALTER TABLE EMP ADD (PHONE VARCHAR2(20))` 후\n\n```\nEMP\n─────────\nEMP_ID (PK)\nNAME (NOT NULL)\nSAL (DEFAULT 0)\nPHONE      (추가됨)\n```\n\n### `TRUNCATE TABLE EMP` 후\n\n```\nEMP (구조 유지, 데이터 0행)\n─────────\nEMP_ID (PK)\nNAME\nSAL\nPHONE\n```\n\n### `DROP TABLE EMP` 후\n\n```\n(테이블 자체가 사라짐)\n```\n\nALTER는 컬럼을 추가해 구조를 키우고, TRUNCATE는 데이터만 비우되 컬럼 정의(EMP_ID·NAME·SAL·PHONE)는 그대로 남기며, DROP은 테이블 객체 자체를 지운다. 셋 다 DDL이라 실행 즉시 자동 COMMIT되어 ROLLBACK으로 되돌릴 수 없다. \"데이터만 비우고 싶다 → TRUNCATE\", \"테이블 자체가 필요 없다 → DROP\", \"구조만 바꾼다 → ALTER\" 식으로 의도와 명령을 정확히 매칭한다.\n\n### 💻 [SQL 실전 트레이스]\n\n\n\n---\n\n## 🚨 STEP 3. 출제위원 단골 함정 O/X & 노랭이·기출 문항별 족보\n\n### ⚠️ 시험장 단골 함정 vs 정답 1:1 대조표\n\n| 함정 | 정답 |\n|---|---|\n| TRUNCATE 분류 | DDL |\n| DDL 실행 후 ROLLBACK 가능? | 불가(자동 COMMIT) |\n| PRIMARY KEY는 NULL 허용? | 불허 |\n| UNIQUE는 NULL 허용? | 허용 |\n| 한 테이블에 PK는 몇 개? | 1개 |\n| FK가 참조하는 컬럼 조건 | PK 또는 UNIQUE |\n| CHECK 제약 예 | `CHECK (SAL > 0)` |\n| ON DELETE CASCADE | 부모 삭제 시 자식도 삭제 |\n| `ALTER TABLE ... DROP COLUMN`은 ROLLBACK 가능? | 불가 |\n\n단골 함정: TRUNCATE는 DDL이지만 데이터만 삭제(구조 유지)된다. DROP은 테이블 자체를 삭제한다.\n\n### 📒 이 단원과 직결된 『SQL 자격검정 실전문제(노랭이)』 & 기출 킬러 족보\n\n- **[노랭이 2과목 7·9·12·16·18·22번 ★최빈출]** ① 칼럼 수정: Oracle = `ALTER TABLE 테이블명 MODIFY 컬럼명`, SQL Server = `ALTER TABLE 테이블명 ALTER COLUMN 컬럼명`. ② `ON DELETE CASCADE` = 부모 삭제 시 연결된 자식 행 자체가 삭제됨. ③ **칼럼 레벨에서 `PRIMARY KEY`를 선언한 뒤 테이블 레벨에서 또 `PRIMARY KEY` 제약조건을 선언하면 에러 발생(테이블당 PK는 단 1개!)**. ④ **`ON DELETE SET NULL`로 설정되어 있어도 자식 칼럼에 `NOT NULL` 제약조건이 걸려 있으면 부모 행 삭제 불가!**\n- **[21회 기출 13번]** 오라클에서 **`CHECK` 제약조건은 `NULL` 값을 무시(통과)**한다! (예: `CHECK (SAL >= 1000)`이 걸려 있어도 `SAL`에 `NULL` 입력 가능!).\n- **[노랭이 2과목 103번]** 뷰(View)는 단지 정의만 저장하는 가상 테이블이지만, 실제 데이터를 물리적으로 저장하는 뷰(**Materialized View, 구체화된 뷰**)를 지원하는 DBMS도 있다.\n\n---\n\n## ✍️ STEP 4. 실전 적중! 단원 마무리 확인 문제\n\n<div class=\"sqld-quiz-box\" data-answer=\"3\">\n\n**Q. [2-3-3 대표 적중 문제]** 다음 중 데이터 정의어(DDL)와 제약조건, 그리고 `DELETE / TRUNCATE / DROP` 비교에 대한 설명으로 **가장 부적절한** 것은?\n\n- ① `CREATE TABLE EMP_COPY AS SELECT * FROM EMP;` (CTAS) 구문으로 테이블을 생성하면 기존 테이블의 데이터와 함께 **`NOT NULL` 제약조건만 복제**되고, 기본키(PK)·외래키(FK)·고유키(UNIQUE) 등의 제약조건은 복제되지 않는다.\n- ② 자식 테이블의 외래키(FK) 컬럼에 `ON DELETE SET NULL` 옵션과 `NOT NULL` 제약조건이 동시에 설정되어 있는 경우, 해당 부모 키를 참조하는 자식 행이 존재하면 부모 테이블의 행은 삭제할 수 없다.\n- ③ `TRUNCATE TABLE`은 테이블의 스키마 정의는 유지하면서 모든 데이터를 즉시 삭제하고 저장공간을 반환하며, 별도의 `COMMIT` 전에는 `ROLLBACK`을 통해 삭제된 데이터를 복구할 수 있다.\n- ④ 고유키(`UNIQUE`) 제약조건이 설정된 컬럼에는 중복된 값을 입력할 수 없지만, 기본키(`PRIMARY KEY`)와 달리 `NULL` 값은 여러 건 입력될 수 있다(오라클 기준).\n\n<details>\n<summary>💡 <b>정답 및 시나공·과외노트식 보기별 완벽 해설 확인하기 (클릭)</b></summary>\n\n**정답: ③**\n- **해설**: `TRUNCATE TABLE`은 DML이 아니라 **DDL(데이터 정의어)**이므로 실행 즉시 **Auto Commit(자동 커밋)**되며, Undo 로그를 남기지 않기 때문에 **`ROLLBACK`으로 절대 복구할 수 없습니다!** (`ROLLBACK`이 가능한 데이터 삭제 명령어는 DML인 `DELETE`뿐입니다).\n\n</details>\n</div>\n\n---\n\n## ⏱️ STEP 5. 시험장 입실 직전 30초 최종 요약 카드\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · DDL 5종: **CREATE / ALTER / DROP / TRUNCATE / RENAME** — 모두 **자동 COMMIT** (롤백 불가)\n> · 제약 6종: **PK / FK / UNIQUE / NOT NULL / CHECK / DEFAULT**\n> · PK = **UNIQUE + NOT NULL** / 테이블당 1개 / FK 가 참조하는 컬럼은 PK 또는 UNIQUE\n> · UNIQUE = **NULL 허용** (중복만 막음)\n> · DELETE / TRUNCATE / DROP — **데이터·구조·롤백** 차이 (가장 단골 함정)\n> · ON DELETE CASCADE = 부모 삭제 시 자식도 자동 삭제\n> · 컬럼 추가 = `ALTER TABLE ADD` / 변경 = `MODIFY` / 삭제 = `DROP COLUMN`"}, {"id": "ch-30", "index": 30, "title": "2-3-4. DCL (Data Control Language)", "subj_id": "tab4", "subj_name": "2과목 3장 · 관리 구문", "badge": "2과목 3장 · 관리 구문 (DML/TCL/DDL/DCL)", "md": "# 2-3-4. DCL (Data Control Language)\n\n> **단원 분류**: `2과목` > `2-3. 관리 구문` > **`2-3-4. DCL`**\n> **🎯 출제 빈도**: `★★★★★ (매회 1문항 100% 출제!)` &nbsp;|&nbsp; **🧠 두문자 암기 공식**: `객체 권한(ON 테이블) 재부여 = WITH GRANT OPTION (연쇄 회수 O!) / 시스템 권한 재부여 = WITH ADMIN OPTION (연쇄 회수 X, 유지됨!)`\n\n## 🎯 과외선배의 1분 브리핑 & 핵심 구조도\n\n> [!TIP]\n> **👨‍🏫 1:1 과외선배의 학습 코칭 (`유선배 과외노트` 스타일)**\n> 마지막 단원 DCL은 딱 한 문제 나오는데, 출제 포인트가 정해져 있습니다! **`A`가 `B`에게 권한을 주고 `B`가 `C`에게 재부여한 뒤 `A`가 `B`의 권한을 `REVOKE`(회수)했을 때**: ① 객체 권한 옵션인 **`WITH GRANT OPTION`은 `C`의 권한까지 도미노처럼 연쇄 회수(Cascade Revoke)**되지만, ② 시스템 권한 옵션인 **`WITH ADMIN OPTION`은 `B`의 권한만 회수되고 `C`가 받은 권한은 그대로 살아남는다!** 이 표 하나만 기억하면 무조건 맞힙니다!\n\n> DCL은 사용자에게 권한을 주거나 회수하는 명령어들이다(GRANT, REVOKE).\n\nex) 사무실 출입카드처럼 신입에게 발급(GRANT)·퇴사자 회수(REVOKE)·부서별 묶음(ROLE)으로 누가 어떤 테이블을 SELECT/INSERT/UPDATE 할 수 있는지를 통제한다.\n\n### 🗺️ 한눈에 보는 핵심 구조도: DCL 흐름\n\n| 권한 관리 주체 및 명령어 | 동작 방향 | 핵심 설명 |\n| :---: | :---: | :--- |\n| **`GRANT 권한 TO 사용자`** | 관리자/소유자 ➔ 사용자 | 특정 시스템 권한 또는 테이블 객체 권한을 부여 |\n| **`REVOKE 권한 FROM 사용자`** | 관리자/소유자 ◀ 사용자 | 부여했던 권한을 회수 (`WITH GRANT OPTION`은 연쇄 회수, `WITH ADMIN OPTION`은 본인만 회수!) |\n| **`CREATE ROLE 롤이름`** | 권한 묶음 생성 후 `GRANT 롤 TO 사용자` | 여러 권한을 하나의 **롤(ROLE, 역할 묶음)**로 만들어 여러 사용자에게 편리하게 일괄 부여/관리 |\n\n---\n\n## 📘 STEP 1. 시험 출제 핵심 이론 & 강의 도표 완벽 정복\n\n### 📌 1. 유저(User)와 권한(Privileges)의 개요: 시스템 권한 vs 객체 권한\n- **데이터베이스 보안의 2가지 영역**:\n  - **시스템 보안**: 데이터베이스 자체에 대한 접근(로그인, 유저 생성, 테이블 생성 등)을 통제하는 보안.\n  - **데이터 보안**: 특정 테이블이나 뷰 등 **객체(Object)의 내용에 접근(조회, 입력, 수정, 삭제)**하는 것을 통제하는 보안.\n- **권한의 2가지 종류**:\n  1. **시스템 권한 (System Privileges)**: 사용자가 데이터베이스에서 특정 작업(로그인 접속 `CREATE SESSION`, 테이블 생성 `CREATE TABLE`, 뷰 생성 `CREATE VIEW`, 유저 생성 `CREATE USER` 등)을 수행할 수 있도록 하는 권한 (주로 DBA가 부여).\n     - **⚠️ 단골 함정**: `CREATE USER`로 유저를 새로 만들었다고 해서 바로 로그인을 할 수 있는 것이 아니다! 반드시 데이터베이스 접속 권한인 **`CREATE SESSION`** 권한을 `GRANT` 받아야 로그인이 가능하며, 테이블을 만들려면 `CREATE TABLE` 권한과 테이블스페이스 할당량(Quota)이 필요하다!\n  2. **객체 권한 (Object Privileges)**: 특정 테이블, 뷰, 시퀀스 등에 대해 **`SELECT`, `INSERT`, `UPDATE`, `DELETE`, `ALTER`, `INDEX`, `REFERENCES`** 등을 수행할 수 있는 권한 (`ON 객체명`이 붙음!).\n- **유저 관리 DDL**:\n  - 생성: `CREATE USER 유저명 IDENTIFIED BY 비밀번호;`\n  - 비밀번호 변경: `ALTER USER 유저명 IDENTIFIED BY 새비밀번호;`\n  - 삭제: **`DROP USER 유저명 [CASCADE];`** *(유저가 이미 생성하여 소유하고 있는 테이블/객체가 하나라도 있다면 그냥 `DROP USER`는 에러가 나며, 반드시 **`CASCADE` 옵션**을 붙여야 소유 객체들을 먼저 모두 삭제한 뒤 유저를 삭제한다!)*\n\n![CREATE USER 구문 예시](images/p100_img03.png)\n\n![GRANT 명령어 기본 문법 및 객체 권한 부여 구조](images/p101_img01.png)\n\n![시스템 권한 부여 및 유저 접속 실습 예시 1](images/p101_img02.png)\n\n![테이블 생성 권한 부여 및 스키마.테이블명 조회 예시 2](images/p101_img03.png)\n\n---\n\n### 📌 2. `GRANT`와 `REVOKE`의 핵심 비교: `WITH GRANT OPTION` vs `WITH ADMIN OPTION` (★100% 출제!)\n\n```sql\n-- 1. 객체 권한 부여 및 회수 (ON 객체명 포함!)\nGRANT SELECT, INSERT ON EMP TO SCOTT [WITH GRANT OPTION];\nREVOKE SELECT, INSERT ON EMP FROM SCOTT;\n\n-- 2. 시스템 권한 부여 및 회수 (ON 절 없음!)\nGRANT CREATE SESSION, CREATE TABLE TO SCOTT [WITH ADMIN OPTION];\nREVOKE CREATE SESSION, CREATE TABLE FROM SCOTT;\n```\n\n> 💡 **[핵심 필수 암기]**\n> **🔥 DCL 최고 빈출 문제! 중간자(`B`)의 권한을 회수(`REVOKE`)했을 때 제3자(`C`)의 권한은 어떻게 되는가?**\n> `A(DBA/소유자)` ➔ **`B`에게 권한 부여** ➔ **`B`가 `C`에게 권한 재부여**한 상태에서, **`A`가 `B`로부터 권한을 `REVOKE`(회수)**했을 때:\n\n| 구분 | 객체 권한 옵션: **`WITH GRANT OPTION`** | 시스템 권한 옵션: **`WITH ADMIN OPTION`** |\n| :---: | :--- | :--- |\n| **적용 대상** | **객체 권한** (`SELECT`, `INSERT` **ON 테이블** 등) | **시스템 권한** (`CREATE TABLE`, `CREATE SESSION` 등) 및 **ROLE(롤)** |\n| **역할** | 부여받은 객체 권한을 다른 사용자에게 또 부여할 수 있는 권한 | 부여받은 시스템 권한을 다른 사용자에게 또 부여할 수 있는 권한 |\n| **`A`가 `B`의 권한을 `REVOKE` 했을 때 `C`의 운명 (★핵심!)** | **⚡ 연쇄 회수됨 (Cascade Revoke)!**<br>`B`의 권한이 회수되면 `B`가 `C`에게 주었던 권한까지 **자동으로 함께 연쇄 회수(박탈)**된다! | **🛡️ 연쇄 회수 안 됨 (유지됨)!**<br>`B`의 권한만 회수될 뿐, `B`가 이미 `C`에게 부여했던 권한은 **회수되지 않고 `C`에게 그대로 남아 유지**된다! |\n\n![GRANT와 REVOKE 실행 예시](images/p102_img01.png)\n\n---\n\n### 📌 3. 롤 (ROLE: 권한들의 묶음 주머니)\n- **롤(Role)의 정의**: 사용자에게 허가할 수 있는 **관련 권한들의 집합(묶음)**. 일일이 수십 개의 권한을 사용자마다 `GRANT`하는 대신, 롤 하나에 권한들을 담아두고 사용자에게 롤을 부여하면 권한 관리가 매우 편리해진다.\n- **롤(Role)의特征**:\n  - 롤은 **시스템 권한과 객체 권한을 모두 포함**할 수 있다!\n  - 롤은 사용자에게 직접 부여할 수도 있고, **다른 롤에 포함시켜 부여**할 수도 있다.\n- **롤 생성 및 부여 3단계 순서 (★순서 빈칸 문제 출제!)**:\n  ```sql\n  -- 1단계: 롤 생성 (CREATE ROLE)\n  CREATE ROLE LOGIN_TABLE;\n\n  -- 2단계: 생성된 롤에 권한들을 담기 (GRANT 권한 TO 롤이름)\n  GRANT CREATE SESSION, CREATE TABLE TO LOGIN_TABLE;\n\n  -- 3단계: 사용자에게 롤을 부여하기 (GRANT 롤이름 TO 사용자명)\n  GRANT LOGIN_TABLE TO JISUNG;\n  ```\n- **오라클 기본 내장 롤**:\n  - **`CONNECT` 롤**: `CREATE SESSION` 등 기본 접속 권한 포함.\n  - **`RESOURCE` 롤**: `CREATE TABLE`, `CREATE SEQUENCE`, `CREATE TRIGGER` 등 객체 생성 권한 포함.\n  - **`DBA` 롤**: 모든 시스템 권한을 포함하는 최고 관리자 롤.\n\n![ROLE(롤) 생성 ➔ 롤에 권한 부여 ➔ 사용자에게 롤 부여하는 3단계 실습 1](images/p102_img02.png)\n\n![부여된 ROLE을 통한 로그인 및 테이블 생성 확인 2](images/p102_img03.png)\n\n![DROP ROLE 롤 삭제 및 회수 구문 3](images/p102_img04.png)\n\n![객체 권한 부여 및 타 스키마 테이블 조회 마무리 확인](images/p103_img01.png)\n\n---\n\n## 🔍 STEP 2. 직관적 Before & After 비교 & 실전 SQL 트레이스\n\n### 🔄 [Before & After] 직관적 비교\n\n방금 만들어진 USER1 계정에 권한을 한 단계씩 부여하다가 마지막에 SELECT 한 가지만 회수한다. 시스템 권한(CREATE SESSION)이 먼저 있어야 접속이 되고, 그 위에 객체 권한(SELECT/INSERT)이 올라가는 순서를 따라간다.\n\n### USER1의 권한 변화\n\n| 시점 | 가능한 작업 |\n|---|---|\n| 초기 | 접속도 불가 |\n| GRANT CREATE SESSION 후 | 접속 가능 |\n| GRANT SELECT ON EMP 후 | EMP 조회 가능 |\n| GRANT INSERT ON EMP 후 | EMP 입력 가능 |\n| REVOKE SELECT ON EMP 후 | EMP 조회 불가 |\n\n권한은 \"접속(시스템 권한) → 개별 객체 작업(객체 권한)\" 순으로 쌓인다. CREATE SESSION이 없으면 SELECT 권한이 있어도 접속이 안 되고, REVOKE는 해당 권한만 떼어내므로 INSERT 권한은 그대로 남는다. WITH GRANT OPTION으로 재부여된 권한이라면 REVOKE 한 번에 연쇄적으로 회수된다.\n\n### 💻 [SQL 실전 트레이스] 권한 흐름\n\n```sql\n-- 관리자(DBA)로 접속\nCREATE USER STAFF IDENTIFIED BY pw1234;\n\nGRANT CREATE SESSION TO STAFF;       -- 접속 권한\nGRANT SELECT ON HR.EMP TO STAFF;     -- HR 스키마 EMP 조회 권한\n\n-- STAFF로 접속\nSELECT * FROM HR.EMP;     -- 가능\n\n-- 권한 회수\nREVOKE SELECT ON HR.EMP FROM STAFF;\n\nSELECT * FROM HR.EMP;     -- 권한 부족 에러\n```\n\n---\n\n## 🚨 STEP 3. 출제위원 단골 함정 O/X & 노랭이·기출 문항별 족보\n\n### ⚠️ 시험장 단골 함정 vs 정답 1:1 대조표\n\n| 함정 | 정답 |\n|---|---|\n| DCL 명령어 | GRANT, REVOKE |\n| 시스템 권한 부여 시 옵션 | WITH ADMIN OPTION |\n| 객체 권한 부여 시 옵션 | WITH GRANT OPTION |\n| ROLE의 목적 | 권한 묶음을 한 번에 관리 |\n| `GRANT DEV_ROLE TO USER1`의 분류 | DCL |\n| 모든 사용자에게 권한 | TO PUBLIC |\n| WITH GRANT OPTION 회수 영향 | 연쇄 회수(다시 부여한 사용자도) |\n\n단골 함정: GRANT/REVOKE를 DDL이나 DML로 잘못 분류하는 보기. DCL이 정답이다.\n\n### 📒 이 단원과 직결된 『SQL 자격검정 실전문제(노랭이)』 & 기출 킬러 족보\n\n- **[노랭이 2과목 119번 & 친구 오답메모 ★100% 출제]** `WITH GRANT OPTION`으로 객체 권한을 부여받은 사용자(`B`)가 제3자(`C`)에게 부여한 권한은, 원래 사용자(`B`)의 권한이 `REVOKE`되면 **연쇄적으로 함께 취소(Cascade)**된다! 반면 시스템 권한의 **`WITH ADMIN OPTION`은 연쇄 회수되지 않고 유지**된다!\n\n---\n\n## ✍️ STEP 4. 실전 적중! 단원 마무리 확인 문제\n\n<div class=\"sqld-quiz-box\" data-answer=\"3\">\n\n**Q. [2-3-4 대표 적중 문제]** 데이터베이스 관리자(`DBA`)와 사용자 `A`, `B`, `C` 사이에서 아래의 권한 부여 및 회수 명령이 순서대로 실행되었을 때, 최종 결과에 대한 설명으로 **가장 적절한** 것은?\n```sql\n1. [DBA 실행] GRANT CREATE SESSION, CREATE TABLE TO A WITH ADMIN OPTION;\n2. [A 실행]   GRANT CREATE SESSION, CREATE TABLE TO B;\n3. [A 실행]   GRANT SELECT ON A.EMP TO B WITH GRANT OPTION;\n4. [B 실행]   GRANT SELECT ON A.EMP TO C;\n5. [DBA 실행] REVOKE CREATE TABLE FROM A;\n6. [A 실행]   REVOKE SELECT ON A.EMP FROM B;\n```\n\n- ① 5번 명령이 실행되면 `A`가 `B`에게 부여했던 `CREATE TABLE` 권한도 연쇄적으로 함께 회수되어 `B`는 테이블을 생성할 수 없다.\n- ② 6번 명령이 실행되더라도 `B`가 `C`에게 부여했던 `A.EMP` 테이블 `SELECT` 권한은 회수되지 않고 유지된다.\n- ③ 모든 명령이 끝난 후 `B`는 여전히 `CREATE TABLE` 권한을 가지고 있지만, `C`는 `A.EMP` 테이블을 조회(`SELECT`)할 수 없다.\n- ④ 3번 명령에서 객체 권한을 재부여할 때는 `WITH GRANT OPTION`이 아니라 `WITH ADMIN OPTION`을 사용해야 하므로 문법 오류가 발생한다.\n\n<details>\n<summary>💡 <b>정답 및 시나공·과외노트식 보기별 완벽 해설 확인하기 (클릭)</b></summary>\n\n**정답: ③**\n- **해설**:\n  - **시스템 권한 (`WITH ADMIN OPTION`)**: 5번에서 `DBA`가 `A`의 `CREATE TABLE` 권한을 회수(`REVOKE`)하더라도, `A`가 `B`에게 부여했던 시스템 권한은 **연쇄 회수되지 않고 유지**되므로 `B`는 여전히 테이블을 만들 수 있습니다.\n  - **객체 권한 (`WITH GRANT OPTION`)**: 6번에서 `A`가 `B`의 `SELECT ON A.EMP` 권한을 회수하면, `B`가 `C`에게 재부여했던 객체 권한까지 **연쇄적으로 함께 회수(Cascade Revoke)**되므로 `C`는 더 이상 `A.EMP`를 조회할 수 없습니다!\n\n</details>\n</div>\n\n---\n\n## ⏱️ STEP 5. 시험장 입실 직전 30초 최종 요약 카드\n\n> [!SUMMARY] **⏱️ 30초 시험 직전 핵심 요약 카드**\n> · DCL 명령: **GRANT / REVOKE** (ROLE 부여도 GRANT 로 함)\n> · 권한 종류: **시스템 권한** (CREATE SESSION/TABLE 등) + **객체 권한** (SELECT/INSERT/UPDATE 등)\n> · 옵션: **WITH GRANT OPTION** (객체 권한 재부여) / **WITH ADMIN OPTION** (시스템 권한 재부여)\n> · ROLE = 권한 묶음 → 여러 사용자에 한 번에 부여 (CONNECT / RESOURCE / DBA 가 대표)\n> · `TO PUBLIC` = 모든 사용자에게\n> · WITH GRANT OPTION 으로 재부여한 권한 = REVOKE 시 **연쇄 회수**\n> · 4대 분류 한 줄 정리: **DDL=객체 / DML=데이터 / TCL=트랜잭션 / DCL=권한**"}, {"id": "ch-31", "index": 31, "title": "⚡ 시험 당일 입실 직전 1~2장 초압축 벼락치기 치트시트 (A4 2장 분량)", "subj_id": "tab_cheat", "subj_name": "⚡ 1~2장 초압축 치트시트", "badge": "시험 직전 15분 필수", "md": "# ⚡ 시험 당일 입실 직전 1~2장 초압축 벼락치기 치트시트 (A4 2장 분량)\n\n> **⏱️ 입실 완료 후 시험 시작 15분 전 통독용 (단 한 글자도 버릴 것 없는 60점 합격 족보)**\n> 시험장에 책 무겁게 들고 가지 마시고, 시험 시작 10분 전까지 이 2장만 뚫어져라 보고 머릿속에 공식을 새겨 넣으세요!\n\n---\n\n## 📘 [제1과목] 데이터 모델링의 이해 (10문항 / 20점 ➔ 목표: 8문항 16점)\n\n| 출제 테마 | 핵심 암기 공식 & 1초 판별법 | 시험장 킬러 함정 (❌ 오답 ➔ ⭕ 정답) |\n| :--- | :--- | :--- |\n| **모델링 3대 특징** | **`추·단·명`** (추상화, 단순화, 명확화) | ❌ 현실을 구체적으로 표현 ➔ ⭕ **추상화·단순화** |\n| **모델링 유의점** | **`중·비·비`** (중복, 비유연성, 비일관성) | ❌ 비일관성 해결책은 프로세스 분리 ➔ ⭕ **비유연성** 해결책임 |\n| **3층 스키마 & 독립성** | • **외부(사용자 화면) ➔ 개념(전사 통합 ERD, 단 1개) ➔ 내부(디스크 물리 저장)**<br>• 개념 스키마 변경 시 외부 영향 없음 = **논리적 독립성**<br>• 내부 스키마 변경 시 개념/외부 영향 없음 = **물리적 독립성** | ❌ 개념 스키마는 사용자마다 여러 개 ➔ ⭕ **단 1개만 존재**<br>❌ 내부 변경 시 논리적 독립성 ➔ ⭕ **물리적 독립성** |\n| **엔터티 6대 조건** | **`업·식·인·프·속·관`**<br>(업무필요, 식별자, **인스턴스 ≥ 2개**, 프로세스 이용, **속성 ≥ 2개**, 타 엔터티와 관계) | ❌ 인스턴스 1개도 엔터티 성립 ➔ ⭕ **2개 이상 필수**<br>❌ 속성 1개도 엔터티 성립 ➔ ⭕ **2개 이상 필수** |\n| **엔터티 분류** | • **발생시점 (`기·중·행`)**: 기본(사원/고객/상품) ➔ 중심(주문/매출) ➔ 행위(주문상세/이력)<br>• 유무형: 유형(물리적) / 개념(부서/학과) / 사건(주문/결제) | ❌ 주문·청구는 기본 엔터티 ➔ ⭕ **중심(또는 사건) 엔터티** |\n| **속성 분류** | • **특성 (`기·설·파`)**: 기본(원래속성) ➔ 설계(코드/일련번호) ➔ **파생(계산값, 정합성 위해 가급적 적게!)**<br>• **도메인(Domain)**: 속성이 가질 수 있는 값의 범위(타입, 크기, 제약조건) | ❌ 파생 속성은 많을수록 좋다 ➔ ⭕ **가급적 적게 정의**<br>❌ 한 속성에 여러 값(다치) 허용 ➔ ⭕ **1속성 1값(원자값)** |\n| **관계 & ERD 표기** | • **식별자 관계 (실선 `───`)**: 부모 PK를 자식의 **PK(주식별자)**로 상속 (조인 복잡도 증가)<br>• **비식별자 관계 (점선 `- - -`)**: 부모 PK를 자식의 **일반속성(FK)**으로만 상속<br>• Barker 표기법: 필수 = 실선/`*`, 선택 = 점선/`o` | ❌ 모든 관계를 식별자로 하면 SQL 단순 ➔ ⭕ **PK 과다로 복잡**<br>❌ UML 연관관계는 점선 ➔ ⭕ **연관=실선(속성), 의존=점선(파라미터)** |\n| **주식별자 4대 조건** | **`유·최·불·존`** (유일성, 최소성, 불변성, 존재성/Not Null) | ❌ UNIQUE 제약조건은 NOT NULL 필수 ➔ ⭕ **NULL 허용함** |\n| **정규화 4단계 공식** | • **1NF**: **원자값 확보** (도메인이 원자값이 아니거나 **동일 칼럼 반복 제거!**)<br>• **2NF**: **부분 함수 종속 제거** (복합 PK의 일부 컬럼에만 종속된 것 분리)<br>• **3NF**: **이행 함수 종속 제거** (`A ➔ B ➔ C` 일반 컬럼 간 종속 분리)<br>• **BCNF**: **모든 결정자가 후보키** (후보키 아닌 결정자 분리) | ❌ 전화번호1, 전화번호2는 2NF 대상 ➔ ⭕ **1차 정규화(1NF) 대상!**<br>❌ 정규화는 DML 성능 저하 ➔ ⭕ **입력/수정/삭제 성능은 항상 향상!** (조회만 조인 증가로 느려질 수 있음) |\n| **반정규화 & 트랜잭션** | • 대상: 대량 범위처리, 통계성, 지나친 조인 ➔ **반정규화 전 파티셔닝/인덱스 먼저 고려!**<br>• 필수 참여 관계(`|` 실선)로 묶인 엔터티는 **하나의 트랜잭션(`All or Nothing`)**으로 처리 | ❌ 성능 문제 시 무조건 테이블 병합 ➔ ⭕ **파티셔닝/클러스터링 우선** |\n\n---\n\n## 📙 [제2과목] SQL 기본 및 활용 (40문항 / 80점 ➔ 목표: 24문항 48점)\n\n### 1. SQL 기본 킬러 공식 10선\n1. **SELECT 논리적 실행 순서**: **`FROM ➔ WHERE ➔ GROUP BY ➔ HAVING ➔ SELECT ➔ ORDER BY`**\n   - ⚠️ `SELECT` 절의 **별칭(Alias)은 `ORDER BY`에서만 사용 가능!** (`WHERE`, `GROUP BY`, `HAVING`에 쓰면 즉시 에러)\n2. **`NULL`의 연산 3대 법칙**:\n   - 가로 사칙연산: `NULL + 100 = NULL`, `NULL * 0 = NULL`\n   - 가로 비교연산: `COL = NULL`, `COL != NULL` ➔ 무조건 **`UNKNOWN` (WHERE절 탈락, 0건 반환)**\n   - 세로 집계함수: `SUM`, `AVG`, `MAX`, `MIN` ➔ **`NULL` 행을 아예 제외하고 계산!** (단, `COUNT(*)`는 전체 행 카운트)\n3. **단골 함수 결과 1초 판별**:\n   - `ROUND(163.76, -1)` = **`160`** (음수 자릿수는 소수점 왼쪽 일의 자리에서 반올림!)\n   - 음수 올림/내림: **`CEIL(-3.2) = -3`** vs **`FLOOR(-3.2) = -4`** vs **`TRUNC(-3.2) = -3`**\n   - `NULLIF(A, B)`: **두 값이 같으면 `NULL`**, 다르면 첫 번째 값 `A` 반환!\n   - `COALESCE(A, B, C)`: 인자들 중 **처음으로 `NULL`이 아닌 값** 반환!\n4. **`WHERE`절의 영원한 킬러**:\n   - **`NOT IN (10, 20, NULL)`** ➔ 결과 무조건 **`0건 (공집합)`!** (`AND` 조건에서 `UNKNOWN`이 되기 때문)\n   - **`IN (10, 20, NULL)`** ➔ `NULL`만 무시되고 `10, 20` 정상 출력 (`OR` 조건이기 때문)\n5. **`GROUP BY` & `HAVING` 규칙**:\n   - `GROUP BY` 사용 시 `SELECT` 절에는 **그룹 기준 컬럼과 집계함수만** 올 수 있음!\n   - `HAVING` 절 조건을 만족하는 그룹이 없으면: 일반 `COUNT(*)`처럼 `0`이 나오는 게 아니라 **`공집합 (0행)` 반환!** (34회 23번)\n6. **오라클 vs SQL Server 차이점**:\n   - `ORDER BY` 시 `NULL` 위치: **Oracle = 무한대 취급 (맨 뒤)** vs **SQL Server = 최소값 취급 (맨 앞)**\n   - `INSERT INTO T VALUES ('')`: **Oracle = `NULL` 삽입 (`IS NULL` 조회)** vs **SQL Server = 빈문자열 `''` 삽입 (`= ''` 조회)**\n7. **조인(JOIN)과 조건 위치 (`ON` vs `WHERE`)**:\n   - `LEFT OUTER JOIN`에서 우측 테이블의 필터 조건을 **`ON` 절에 쓰면 좌측 행 전체 보존**, **`WHERE` 절에 쓰면 `INNER JOIN`으로 변질!**\n   - Oracle 외부조인 기호 `(+)`: **데이터가 부족한 쪽에 붙임!** (`A.ID = B.ID(+)` ➔ `A` 기준 `LEFT JOIN`)\n8. **표준 조인 (`NATURAL JOIN` & `USING`) 절대 금지 규칙**:\n   - **기준 공통 컬럼 앞에는 테이블 별칭(접두어 `E.DEPTNO`)을 절대 붙일 수 없다!** (오직 컬럼명만 단독 기술)\n9. **서브쿼리 3대 분류**:\n   - `SELECT` 절: **스칼라 서브쿼리 (반드시 1행 1열 반환!)**\n   - `FROM` 절: **인라인 뷰 (동적 가상 뷰, 메인쿼리에서 인라인 뷰의 SELECT 컬럼만 사용 가능)**\n   - `WHERE` 절: `EXISTS`는 존재 여부만 체크 (`SELECT 1`이든 `*`이든 성능 동일)\n\n---\n\n### 2. SQL 활용 & 관리구문 핵심 공식 10선\n1. **집합 연산자 (`UNION`, `UNION ALL`)**:\n   - `UNION`, `INTERSECT`, `MINUS(EXCEPT)`는 중복 제거를 위해 **자동 정렬(Sort, 느림)** 수행.\n   - `UNION ALL`은 중복 포함하여 그대로 합침 **(정렬 없음, 빠름)**.\n   - 컬럼 이름(헤더)은 **첫 번째 `SELECT` 문의 이름**을 따라감. `ORDER BY`는 **맨 마지막 줄에 단 한 번만!**\n2. **그룹 함수 개수 공식**:\n   - **`ROLLUP(A, B)`** ➔ $(A,B) + (A) + ()$ 총계 = **$N + 1$ 단계 (순서 중요!)**\n   - **`CUBE(A, B)`** ➔ $(A,B) + (A) + (B) + ()$ 총계 = **$2^N$ 단계 (모든 조합, 순서 무관!)**\n   - **`GROUPING SETS(A, B)`** ➔ $(A) + (B)$ = 지정한 항목만 개별 소계 (총계 없음!)\n   - **`GROUPING(컬럼)`**: 소계/총계로 생성된 가짜 `NULL`이면 **`1`**, 원래 데이터면 **`0`** 반환!\n3. **윈도우 순위 함수**:\n   - **`RANK`**: `1, 2, 2, 4` (공동 순위만큼 건너뜀)\n   - **`DENSE_RANK`**: `1, 2, 2, 3` (공동 순위가 있어도 건너뛰지 않음)\n   - **`ROW_NUMBER`**: `1, 2, 3, 4` (동점이어도 고유 번호 부여)\n   - ⚠️ **윈도우 함수는 결과 행 수를 절대 줄이지 않는다!** (`GROUP BY`와의 결정적 차이)\n4. **윈도우 프레임 (`ROWS` vs `RANGE`)**:\n   - `OVER(ORDER BY SAL)`처럼 `ORDER BY` 작성 후 프레임 생략 시 디폴트:\n     ➔ **`RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW` (동일 급여 행들을 한꺼번에 묶어서 누적합!)**\n   - `ROWS`는 물리적 1행씩, `RANGE`는 논리적 값 기준!\n5. **Top N 쿼리 (`ROWNUM`)**:\n   - `WHERE ROWNUM = 2` 또는 `WHERE ROWNUM > 1`은 **무조건 `0건 (공집합)`!** (`1`번이 나와야 `2`번이 부여됨)\n   - 상위 5명 정렬 추출: 반드시 **인라인 뷰에서 먼저 `ORDER BY` 한 후 바깥에서 `ROWNUM <= 5`!**\n6. **계층형 질의 암기 코드 (`프자부순` / `프부자역`)**:\n   - **`CONNECT BY PRIOR 자식 = 부모`** ➔ **순방향 전개 (부모에서 자식으로 하향 전개)**\n   - **`CONNECT BY PRIOR 부모 = 자식`** ➔ **역방향 전개 (자식에서 부모로 상향 전개)**\n   - `WHERE` 절 조건은 모든 계층 전개가 끝난 뒤 최종 필터링 (자식 노드는 살아남음).\n   - 형제 노드끼리만 정렬: **`ORDER SIBLINGS BY`**\n7. **2024 개정 신유형 (`PIVOT` / `UNPIVOT` / `REGEXP`)**:\n   - `PIVOT`: 행 ➔ 열 가로 펼치기. `PIVOT` 절에 명시되지 않은 나머지 컬럼이 자동 `GROUP BY` 기준!\n   - `UNPIVOT`: 열 ➔ 행 세로 모으기. 디폴트는 **`EXCLUDE NULLS` (`NULL` 행 자동 제외)**.\n   - `^`의 두 얼굴: 대괄호 밖 `^A`는 `'A로 시작'`, 대괄호 안 `[^0-9]`는 **`숫자가 아닌 것(NOT)`!**\n8. **DML vs DDL (`DELETE / TRUNCATE / DROP`) 비교 (100% 출제)**:\n   - **`DELETE`**: DML, `WHERE`절 가능, **`ROLLBACK` 가능**, 디스크 용량 초기화 안 됨.\n   - **`TRUNCATE`**: DDL, `WHERE`절 불가, **`ROLLBACK` 불가 (자동 COMMIT)**, 테이블 구조 유지 및 용량 초기화!\n   - **`DROP`**: DDL, 테이블 존재 자체를 삭제, **`ROLLBACK` 불가**.\n9. **TCL (트랜잭션) 격리성 문제 & 자동 커밋**:\n   - **Dirty Read**: 커밋되지 않은 데이터를 읽음 / **Non-Repeatable Read**: 같은 쿼리 도중 다른 트랜잭션이 Update/Delete 하여 값이 바뀜 / **Phantom Read**: 새로운 행이 Insert 되어 유령 행 출현.\n   - Oracle에서 `INSERT/UPDATE` 후 `COMMIT` 안 하고 **`CREATE/ALTER/DROP/TRUNCATE`(DDL) 실행 시 앞선 DML까지 즉시 자동 커밋!**\n10. **DCL 권한 회수 (`REVOKE`) 도미노 법칙 (100% 출제)**:\n    - 객체 권한 옵션: **`WITH GRANT OPTION` ➔ `REVOKE` 시 연쇄 회수(Cascade)됨!**\n    - 시스템 권한 옵션: **`WITH ADMIN OPTION` ➔ `REVOKE` 시 연쇄 회수 안 되고 제3자 권한 유지됨!**\n\n---"}, {"id": "ch-32", "index": 32, "title": "부록: 시험 당일 핵심 총정리 (30개 챕터 빈출 함정 + 체크리스트)", "subj_id": "tab6", "subj_name": "시험 직전 30초 총정리", "badge": "최종 점검 부록", "md": "# 부록: 시험 당일 핵심 총정리 (30개 챕터 빈출 함정 + 체크리스트)\n\n> **시험 직전 통독용**: 30개 전 챕터의 핵심 포인트와 자주 출제되는 단골 함정, 시험 당일 체크리스트를 한눈에 정리한 요약본입니다.\n\n---\n\n## 1. 챕터별 핵심 정리 + 빈출 함정\n\n### 1과목 — 데이터 모델링의 이해\n\n#### [1-1-1] 데이터 모델의 이해\n\n- 3단계: **개념 → 논리 → 물리**\n- 3대 관점: **데이터 / 프로세스 / 상관**\n- 3층 스키마: 외부(View) / 개념(ERD) / 내부(저장)\n- 좋은 모델 6요소: 완전성·중복배제·업무규칙·재사용·의사소통·통합성\n\n> **⚠ 함정**\n> - \"물리 모델링이 가장 먼저\" → **X** (개념 → 논리 → 물리)\n> - \"정규화는 물리 단계\" → **X** (논리 단계)\n\n#### [1-1-2] 엔터티\n\n- 6대 특징 **업·식·인·프·속·관** — 업무 필요·식별·인스턴스 ≥ 2·프로세스가 이용·속성 ≥ 2·관계\n- 유무형 분류: 유형 / 개념 / 사건\n- 발생 시점 분류: **기본 → 중심 → 행위**\n\n> **⚠ 함정**\n> - 인스턴스 1개도 OK → **X (≥ 2)**\n> - 속성 1개도 OK → **X (≥ 2)**\n\n#### [1-1-3] 속성\n\n- 분류: **기본 / 설계 / 파생**\n- 구성 분류: 단순 / 복합 / 다치\n- 한 컬럼에 한 값(원자성) — 1NF의 기본\n\n> **⚠ 함정**\n> - 다치 속성(여러 값) 그대로 OK → **X (1NF 위반)**\n> - 파생 속성은 저장하면 안 된다 → 상황에 따라(성능 시 허용)\n\n#### [1-1-4] 관계\n\n- 차수: **1:1 / 1:N / M:N**\n- 식별 관계 vs 비식별 관계\n- M:N은 분해(연관 엔터티) 필요\n\n> **⚠ 함정**\n> - M:N 그대로 RDB 구현 → **X (분해 필수)**\n\n#### [1-1-5] 식별자\n\n- 4대 조건 **유·최·불·존** — 유일성·최소성·불변성·존재성\n- 4대 분류: 주/보조, 본질/인조, 단일/복합, 내부/외부\n- **PK = UNIQUE + NOT NULL**, 테이블당 1개\n\n> **⚠ 함정**\n> - PK 여러 개 가능? → **X (1개)**\n> - UNIQUE는 NULL 안 됨? → **X (NULL 허용)**\n\n#### [1-2-1] 정규화\n\n- **1NF → 2NF → 3NF → BCNF**\n- **부분종속 = 2NF 위반** / **이행종속 = 3NF 위반**\n- 이상현상 3종: 삽입·갱신·삭제 이상\n- 반정규화: 의도적 중복 허용(성능 위함)\n\n> **⚠ 함정**\n> - BCNF가 3NF보다 약하다 → **X (더 강함)**\n> - 정규화는 항상 성능 개선 → **X (조인 늘어 느려질 수 있음)**\n\n#### [1-2-2] 관계와 조인의 이해\n\n- **관계 = FK = JOIN**의 토대\n- 필수성(NOT NULL)·식별성(PK 포함 여부)\n\n> **⚠ 함정**\n> - FK 없으면 조인 불가 → **X (논리적으론 가능, 권장 X)**\n\n#### [1-2-3] 트랜잭션의 이해\n\n- **ACID** — 원자성 / 일관성 / 고립성 / 지속성\n- 모델의 필수성·식별성이 트랜잭션 무결성과 연결\n\n> **⚠ 함정**\n> - ACID는 3개 원칙 → **X (4개)**\n\n#### [1-2-4] NULL 속성의 이해\n\n- `= NULL` 안 됨 — **`IS NULL` / `IS NOT NULL`만 가능**\n- NULL과 산술 → 결과는 모두 **NULL**\n- SQL 3-값 논리: TRUE / FALSE / **UNKNOWN**\n- 집계: `COUNT(*)`만 NULL 포함 / 나머지는 NULL 무시\n- NULL 처리 함수: `NVL` / `NVL2` / `NULLIF` / `COALESCE`\n\n> **⚠ 함정 (시험 단골)**\n> - `NULL = NULL` → **UNKNOWN** (FALSE 아님)\n> - `WHERE COL = NULL` → **결과 0건**. `IS NULL` 사용\n> - `NULL + 100` → **NULL**\n> - `AVG(컬럼)`의 분모는 **NULL 제외 개수** (0 포함 평균과 다름)\n> - `NULLIF(A, B)` — A=B면 **NULL**\n> - `COALESCE(NULL, NULL, 'X')` → **'X'**\n\n#### [1-2-5] 본질·인조 식별자\n\n- **본질식별자**: 업무 의미가 있는 자연 키 (주민번호, ISBN 등)\n- **인조식별자**: 의도적으로 만든 대리키 (시퀀스, GUID)\n- 인조키는 가독성↓·중복 위험, 별도 UNIQUE 제약 필요\n\n> **⚠ 함정**\n> - 본질식별자가 항상 좋다 → **X (보안·변경 위험 시 인조 선호)**\n\n### 2과목 — SQL 기본 \n\n#### [2-1-1] 관계형 DB 개요\n\n- SQL 분류: **DDL / DML / DCL / TCL**\n- DDL: CREATE/ALTER/DROP/TRUNCATE/RENAME — **자동 COMMIT**\n- DML: INSERT/UPDATE/DELETE/MERGE — **ROLLBACK 가능**\n- DCL: GRANT/REVOKE — 자동 COMMIT\n- TCL: COMMIT/ROLLBACK/SAVEPOINT\n\n> **⚠ 함정**\n> - `TRUNCATE`는 DML이다 → **X (DDL — 자동 COMMIT, ROLLBACK 불가)**\n> - `DELETE`는 DDL이다 → **X (DML — ROLLBACK 가능)**\n\n#### [2-1-2] SELECT문\n\n- 작성 순서: **SELECT** - FROM - WHERE - GROUP BY - HAVING - ORDER BY\n- 실행 순서: **FROM → WHERE → GROUP → HAVING → SELECT → ORDER** (FWGHSO)\n- DUAL: Oracle 시스템 가상 테이블 (1행 1컬럼)\n- DISTINCT로 중복 제거\n\n> **⚠ 함정**\n> - SELECT가 가장 먼저 실행 → **X (거의 마지막)**\n> - SELECT의 별칭(AS)을 WHERE에서 사용 → **X (WHERE는 SELECT보다 먼저 실행)**\n\n#### [2-1-3] 함수\n\n- 단일행 vs 다중행(집계)\n- 문자: UPPER/LOWER/SUBSTR/INSTR/LENGTH/LPAD/RPAD/REPLACE/CONCAT(`||`)\n- 숫자: ROUND/TRUNC/MOD/CEIL/FLOOR\n- 날짜: SYSDATE/ADD_MONTHS/MONTHS_BETWEEN/LAST_DAY/NEXT_DAY\n- 변환: TO_CHAR/TO_NUMBER/TO_DATE\n- NULL: NVL/NVL2/NULLIF/COALESCE\n- 조건: **CASE**(범위 가능) vs **DECODE**(동등비교만)\n\n```sql\n-- 문자/숫자/날짜\nSELECT SUBSTR('SQLD',1,3)        → 'SQL'\n     , LENGTH('양파')             → 2\n     , ROUND(123.456, 1)         → 123.5\n     , MOD(10, 3)                → 1\n     , TO_CHAR(SYSDATE,'YYYY-MM-DD')\nFROM DUAL;\n\n-- NULL/조건\nNVL(SAL, 0), NVL2(COMM,'있음','없음')\nCASE WHEN SAL > 3000 THEN '高' ELSE '低' END\nDECODE(JOB, 'CLERK', 1, 'SALES', 2, 0)\n```\n\n> **⚠ 함정**\n> - DECODE로 BETWEEN 같은 범위 비교 가능 → **X (CASE만 가능)**\n> - 날짜 - 날짜 = 날짜 → **X (일수, 숫자)**\n\n#### [2-1-4] WHERE절\n\n- 비교: =, <>, !=, >, <\n- 논리: AND > OR (AND 우선)\n- SQL 연산자: **BETWEEN**(양 끝 포함) / **IN** / **LIKE**(`_`=1글자, `%`=0+) / **IS NULL**\n\n> **⚠ 함정**\n> - BETWEEN 100 AND 200 → 100, 200 **포함**\n> - `NOT IN (서브쿼리)`에 NULL 있으면 → **결과 0건** 위험\n> - AND/OR 우선순위 헷갈리면 **괄호 사용**\n\n#### [2-1-5] GROUP BY / HAVING\n\n- **WHERE는 집계 전**, **HAVING은 집계 후**\n- SELECT의 일반 컬럼은 GROUP BY에 명시 필수 (집계 함수는 예외)\n- NULL은 하나의 그룹으로 처리\n\n> **⚠ 함정**\n> - HAVING 없이 집계 결과 필터 → **X**\n> - SELECT의 일반 컬럼이 GROUP BY 없으면 → **에러**\n\n#### [2-1-6] ORDER BY절\n\n- 실행 순서 마지막. ASC(기본) / DESC\n- NULLS FIRST / NULLS LAST 직접 지정 가능\n- SELECT의 별칭·컬럼 위치(1, 2, ...) 사용 가능\n\n> **⚠ 함정**\n> - Oracle ASC 기본 NULL 위치 → **마지막 (NULLS LAST)**\n> - MS-SQL ASC 기본 NULL 위치 → **처음 (NULLS FIRST)**\n\n#### [2-1-7] 조인 (JOIN)\n\n- 5종: **EQUI / Non-EQUI / SELF / OUTER / CROSS**\n- EQUI: `=`로 연결 (가장 흔함)\n- Non-EQUI: BETWEEN, >, < 등으로 연결\n- SELF: 같은 테이블 두 번 조인 (별칭 필수)\n- OUTER: LEFT/RIGHT/FULL — 매칭 안 돼도 한쪽 다 포함\n- CROSS: 카티션 곱 (조인 조건 없음)\n\n> **⚠ 함정**\n> - OUTER JOIN 조건은 **ON에**. WHERE에 두면 NULL 행 제외돼 INNER 효과\n> - CROSS JOIN: 조인 조건 빼먹어도 발생 → **의도치 않으면 위험**\n> - Oracle `(+)`는 **NULL로 보충될 쪽(없을 수 있는 쪽)**에 붙임\n\n#### [2-1-8] 표준 조인\n\n- INNER / LEFT OUTER / RIGHT OUTER / FULL OUTER / CROSS / NATURAL / USING\n- **NATURAL**: 같은 이름·타입 컬럼 자동 조인 (조건 명시 X)\n- **USING**: 같은 이름 컬럼 명시\n- FULL OUTER: 양쪽 다 (없는 쪽 NULL)\n\n> **⚠ 함정**\n> - NATURAL JOIN: 이름 같고 **타입 다르면 에러**\n> - MySQL은 FULL OUTER 미지원 → LEFT UNION RIGHT\n\n### 2과목 — SQL 활용 \n\n#### [2-2-1] 서브쿼리\n\n- 위치별: 스칼라 / 인라인뷰 / WHERE 서브쿼리\n- 행 수별: 단일행(=, <, > 등) / 다중행(IN, ANY, ALL, EXISTS)\n- 연관 vs 비연관 서브쿼리\n\n> **⚠ 함정**\n> - **ANY = 최소 기준**(중 어느 하나보다 작아도 OK) / **ALL = 최대 기준**(모두보다 커야)\n> - `IN (a, b, c)` = OR 연결의 단축\n> - 스칼라 서브쿼리는 **1행 1컬럼만 반환**\n\n#### [2-2-2] 집합 연산자\n\n- **UNION**: 합집합 (정렬 + 중복 제거)\n- **UNION ALL**: 합집합 (그대로, 빠름)\n- **INTERSECT**: 교집합 / **MINUS**(EXCEPT): 차집합\n- 컬럼 수·타입 일치 필수\n\n> **⚠ 함정**\n> - UNION ALL은 정렬 안 함 → **O (UNION만 정렬)**\n> - 컬럼 수 다르면 → **에러**\n\n#### [2-2-3] 그룹 함수\n\n- **ROLLUP(A, B)**: N+1 단계 — (A,B), (A), () 3단계\n- **CUBE(A, B)**: 2^N 단계 — 모든 조합 4가지\n- **GROUPING SETS**: 지정한 조합만 (가장 유연)\n- `GROUPING()` 함수로 소계 행 식별 (1=소계, 0=원본)\n\n```sql\nSELECT DEPT, JOB, SUM(SAL)\nFROM EMP\nGROUP BY ROLLUP(DEPT, JOB);\n-- (DEPT,JOB) → (DEPT) → ()  3단계\n\nGROUP BY CUBE(DEPT, JOB);\n-- (D,J),(D),(J),()  4단계 (2^2)\n\nGROUP BY GROUPING SETS((DEPT,JOB),(DEPT));\n-- 지정한 조합만\n```\n\n> **⚠ 함정**\n> - ROLLUP(A,B,C) → **4단계** ((A,B,C), (A,B), (A), ())\n> - CUBE(A,B,C) → **8단계 (2^3)**\n\n#### [2-2-4] 윈도우 함수\n\n- 순위: **RANK**(1,1,3) / **DENSE_RANK**(1,1,2) / **ROW_NUMBER**(1,2,3)\n- 행 순서: LAG / LEAD (앞·뒤 행 값)\n- 집계 OVER: SUM/AVG/COUNT OVER PARTITION BY\n- WINDOWING: ROWS BETWEEN ... AND ... (행 범위 지정)\n\n```sql\nSELECT ENAME, DEPT, SAL,\n  RANK()       OVER(PARTITION BY DEPT ORDER BY SAL DESC) R,\n  DENSE_RANK() OVER(PARTITION BY DEPT ORDER BY SAL DESC) DR,\n  ROW_NUMBER() OVER(ORDER BY SAL DESC) RN,\n  LAG(SAL,1)   OVER(ORDER BY HIRE) PREV,\n  SUM(SAL)    OVER(PARTITION BY DEPT) DEPT_SUM\nFROM EMP;\n-- RANK: 1,1,3 / DENSE_RANK: 1,1,2 / ROW_NUMBER: 1,2,3\n```\n\n> **⚠ 함정**\n> - RANK는 동률 다음 순위 **건너뜀**, DENSE_RANK는 **연속**\n> - LAG/LEAD 기본 오프셋은 **1**\n> - PARTITION BY 없으면 전체가 한 그룹\n\n#### [2-2-5] Top N 쿼리\n\n- Oracle **ROWNUM**: 의사컬럼, 인라인뷰 + ORDER BY 후 사용\n- 표준 **FETCH FIRST** N ROWS ONLY/WITH TIES (Oracle 12c+)\n- MS-SQL **TOP** N / TOP N WITH TIES\n- 윈도우 **ROW_NUMBER() OVER** + PARTITION BY (그룹별 TopN)\n\n> **⚠ 함정**\n> - ROWNUM은 **정렬 전 매겨짐** — 인라인뷰로 정렬 먼저\n> - `ROWNUM = N` (N≥2) → **결과 0건**\n> - `ROWNUM > N` → **항상 거짓**\n\n#### [2-2-6] 계층형 질의\n\n- `START WITH` ... `CONNECT BY PRIOR`\n- **LEVEL** 의사컬럼 (계층 깊이)\n- SYS_CONNECT_BY_PATH (경로 출력)\n- ORDER SIBLINGS BY (같은 LEVEL 정렬)\n\n> **⚠ 함정**\n> - PRIOR 위치가 **부모 결정** (PRIOR 컬럼 = 부모 컬럼)\n> - 일반 ORDER BY는 LEVEL 순서를 흩트림 → ORDER SIBLINGS BY 사용\n\n#### [2-2-7] PIVOT / UNPIVOT\n\n- **PIVOT**: 세로 → 가로 변환\n- **UNPIVOT**: 가로 → 세로 변환\n- PIVOT은 **집계 함수 필수** (SUM, COUNT 등)\n- UNPIVOT는 NULL 기본 제외 → `INCLUDE NULLS` 옵션으로 포함\n\n> **⚠ 함정**\n> - PIVOT은 집계 없이도 가능 → **X (집계 필수)**\n> - UNPIVOT은 NULL 자동 포함 → **X (기본 제외)**\n\n#### [2-2-8] 정규 표현식\n\n- 5함수: REGEXP_LIKE / REPLACE / SUBSTR / INSTR / COUNT\n- 메타문자: `.` `*` `+` `?` `[]` `^` `$` `|` `{n}`\n- 한글: `[가-힣]`\n\n```sql\n-- 한글만 / 휴대폰 형식\nWHERE REGEXP_LIKE(NAME, '^[가-힣]+$')\nWHERE REGEXP_LIKE(PHONE, '^010-[0-9]{4}-[0-9]{4}$')\n\n-- 숫자 추출\nSELECT REGEXP_SUBSTR('A123B45', '[0-9]+') FROM DUAL;\n→ '123'\n\nSELECT REGEXP_REPLACE(STR, '[^0-9]', '') FROM ...;\n-- 숫자만 남김\n```\n\n> **⚠ 함정**\n> - Oracle은 **POSIX 1003.2 기반** — `\\d`·`\\w`·`\\s`는 12c 이후 일부 동작\n> - 호환 안전: `[0-9]`·`[[:digit:]]` 사용\n\n### 2과목 — 관리 구문  · 명령어 분류 포함\n\n#### [2-3-1] DML\n\n- **분류**: INSERT / UPDATE / DELETE / MERGE (SELECT 포함 시 5종)\n- ROLLBACK 가능 → TCL로 확정 필요\n- MERGE: INSERT + UPDATE 합쳐진 형태 (UPSERT)\n\n```sql\nINSERT INTO EMP (ID, NAME, SAL) VALUES (1, '홍길동', 3000);\n\nUPDATE EMP SET SAL = SAL * 1.1 WHERE DEPT = 10;\n\nDELETE FROM EMP WHERE ID = 1;\n\nMERGE INTO TGT USING SRC ON (TGT.ID = SRC.ID)\n  WHEN MATCHED THEN UPDATE SET TGT.NAME = SRC.NAME\n  WHEN NOT MATCHED THEN INSERT (ID, NAME) VALUES (SRC.ID, SRC.NAME);\n```\n\n> **⚠ 함정 (단골)**\n> - `DELETE`는 DDL이다 → **X (DML)**\n> - DELETE WHERE 빠뜨림 → **전체 삭제 위험** (다만 ROLLBACK 가능)\n\n#### [2-3-2] TCL\n\n- **분류**: COMMIT / ROLLBACK / SAVEPOINT\n- SAVEPOINT 후 `ROLLBACK TO SP` = SP 이후 작업만 취소\n- 전체 ROLLBACK 또는 COMMIT 시 SAVEPOINT 소멸\n\n```sql\nINSERT INTO EMP VALUES (1, 'A');\nSAVEPOINT SP1;\nUPDATE EMP SET NAME = 'B' WHERE ID = 1;\nROLLBACK TO SP1;   -- UPDATE만 취소 (INSERT는 살아있음)\nCOMMIT;             -- INSERT 확정\n```\n\n> **⚠ 함정**\n> - COMMIT 후 ROLLBACK 가능 → **X (불가)**\n> - DDL 실행 시 펜딩 트랜잭션 → **자동 COMMIT됨**\n\n#### [2-3-3] DDL\n\n- **분류**: CREATE / ALTER / DROP / TRUNCATE / RENAME\n- **자동 COMMIT** — ROLLBACK 불가\n- 제약조건: PRIMARY KEY / FOREIGN KEY / UNIQUE / NOT NULL / CHECK / DEFAULT\n- PK = UNIQUE + NOT NULL (1개) / UNIQUE는 NULL 허용 (여러 개)\n\n```sql\nCREATE TABLE EMP (\n  ID      NUMBER PRIMARY KEY,\n  NAME    VARCHAR2(20) NOT NULL,\n  EMAIL   VARCHAR2(50) UNIQUE,\n  SAL     NUMBER DEFAULT 0 CHECK (SAL >= 0),\n  DEPT_ID NUMBER REFERENCES DEPT(ID)\n);\n\nALTER TABLE EMP ADD (HIRE_DT DATE);\nALTER TABLE EMP MODIFY (NAME VARCHAR2(30));\nALTER TABLE EMP DROP COLUMN EMAIL;\n\nTRUNCATE TABLE EMP;   -- 전체 삭제, 자동 COMMIT\nDROP TABLE EMP;\n```\n\n> **⚠ 함정 (단골)**\n> - `TRUNCATE`는 DML이다 → **X (DDL — ROLLBACK 불가)**\n> - TRUNCATE는 WHERE 가능 → **X (전체 삭제만)**\n> - FK는 부모의 일반 컬럼 참조 가능 → **X (PK or UNIQUE만)**\n\n#### [2-3-4] DCL\n\n- **분류**: GRANT / REVOKE\n- 시스템 권한: **WITH ADMIN OPTION** (ex: CREATE TABLE)\n- 객체 권한: **WITH GRANT OPTION** (ex: SELECT ON EMP)\n- ROLE: 권한 묶음. GRANT/REVOKE 한 번에\n\n```sql\n-- 객체 권한\nGRANT SELECT, INSERT ON EMP TO USER1;\nGRANT SELECT ON EMP TO USER1 WITH GRANT OPTION;\n\n-- 시스템 권한\nGRANT CREATE TABLE TO USER1 WITH ADMIN OPTION;\n\n-- 회수\nREVOKE SELECT ON EMP FROM USER1;\n\n-- ROLE\nCREATE ROLE DEV_ROLE;\nGRANT SELECT ON EMP TO DEV_ROLE;\nGRANT DEV_ROLE TO USER1;\n```\n\n> **⚠ 함정**\n> - GRANT는 자동 COMMIT 안 됨 → **X (자동 COMMIT)**\n> - REVOKE WITH GRANT OPTION → **연쇄 회수** (위임 받은 사용자도 잃음)\n> - WITH ADMIN OPTION 회수 → **위임 받은 사용자는 유지** (객체 권한과 차이)\n\n---\n\n## 2. 시험 당일 체크리스트\n\n### 📋 준비물\n- **신분증** (필수 — 없으면 응시 불가)\n- 수험표 출력본\n- 컴퓨터용 사인펜 또는 검정 볼펜 2자루\n- 수정테이프 (필요 시)\n- 아날로그 시계 (스마트워치 X)\n\n### ⏰ 시간 관리\n- 시험 시작 **30분 전 도착**\n- 총 **50문항 / 90분** (1문항 평균 1.8분)\n- 막히면 일단 ① 표시 후 다음으로\n- 마지막 5분 OMR 검토\n\n### 💪 컨디션\n- 전날 **충분한 수면** (밤샘 X)\n- 아침 가벼운 식사\n- 커피·차는 평소 양만\n- 화장실 시험 전 미리\n- 긴장될 땐 깊게 호흡 3번\n\n### ★ 마음가짐\n- 모르는 문제가 보여도 당황 X. 보기만 봐도 답이 좁혀지는 경우 많음.\n- 함정 패턴(`NULL`, `ROWNUM`, `ON` vs `WHERE`) 떠올리면서 침착하게.\n- 완전히 막히면 패스 후 끝까지 푼 다음 돌아오기.\n- 합격 기준 60점(60/100). **킬러 문제 욕심 X**, 풀 수 있는 문제부터.\n\n---"}, {"id": "ch-33", "index": 33, "title": "🎁 부록 2. [친구 공유 합격 노션 완결판] 2주 합격 로드맵 · 김강민&홍쌤 족보 · 노랭이 전 문항 오답노트 · 기출 킬러 총정리", "subj_id": "tab5", "subj_name": "노랭이 · 기출 킬러 족보", "badge": "친구 공유 합격 족보 & 오답노트", "md": "# 🎁 부록 2. [친구 공유 합격 노션 완결판] 2주 합격 로드맵 · 김강민&홍쌤 족보 · 노랭이 전 문항 오답노트 · 기출 킬러 총정리\n\n> [!IMPORTANT]\n> **희호님 친구분의 합격 노션(`equinox-gull-ade.notion.site/SQLD`) 100% 완벽 통합본!**\n> 친구분이 직접 정리한 **본문 + 하위 페이지 10개 + 이미지 70장 + 첨부파일 6개(`[정리] SQLD.docx`, `SQL 자격검정 실전문제.txt`, `SQLD 기출문제.txt`, `SQLD 개념 요약.pdf`, `SQLD 요점정리.pdf`, `SQLD 요약정리 2021.pdf`)**의 모든 핵심 알짜배기 족보를 단 하나도 빠짐없이 보기 좋게 재구성하여 수록했습니다.\n> 원본 첨부파일 6개도 [`친구공유자료/`](file:///C:/Users/gmlgh/Downloads/sqld_notion/친구공유자료) 폴더에 모두 다운로드되어 있습니다!\n\n---\n\n## 6-1. 친구의 2주 단기 합격 커리큘럼 & 추천 유튜브 강의 링크 모음\n\n> [!TIP]\n> **친구분이 실제로 합격할 때 사용한 2주 타임라인 & 유튜브 특강 바로가기**\n\n| 단계 | 학습 일정 | 추천 유튜브 강의 / 핵심 자료 | 바로가기 링크 |\n| :---: | :--- | :--- | :--- |\n| **참고 영상** | 시작 전 필독 | 종윤 — *SQLD 자격증 노베이스 2주 합격 공부법 (2024 개정 후기)* | [유튜브 보기](https://www.youtube.com/watch?v=SoZOTt7UZI4&t=409s) |\n| **참고 영상** | 3주/2주 플랜 | 곰사원은 곰대표 — *비전공자 노베이스 SQLD 3주 독학 합격 공부법* | [유튜브 보기](https://www.youtube.com/watch?v=llk__mId4yQ) |\n| **1주차 (Day 1~3)** | 유튜브 강의 보면서 **단권화 3일** | **홍쌤의 데이터랩** — `[2024/2025개정] SQLD 1과목·2과목 완벽 정리` | [1과목 강의](https://www.youtube.com/watch?v=xmkaOqbTQRE&list=PLbflMVhwy2jNx9F4mmDXKSuNkcRetD4LY&index=2) |\n| **1주차 (Day 1~3)** | 빠른 개념 요약 (대체/보조) | **한종구쌤** — `2시간으로 끝내는 SQLD 핵심요약 1과목 / 3시간 2과목` | [1과목](https://www.youtube.com/watch?v=gmMaH5mMJ9M) / [2과목](https://www.youtube.com/watch?v=s22922s5s2c) |\n| **1주차 (Day 4~6)** | **노랭이 1회독 3일** | `SQL 자격검정 실전문제` (노랭이) 풀기 & 틀린 문제 체크 | 아래 **6-4절 노랭이 1줄 오답노트** 참고 |\n| **1주차 (Day 7~9)** | **오답노트 & 기출 풀이 3일** | **어쩌다 DBA쌤** 기출문제 해설 재생목록 / **미나쌤** 핵심 기출 100제 | [어쩌다DBA](https://www.youtube.com/playlist?list=PL_hDrax6_odulENm_BrLTbbzLQCWYYf__) / [미나쌤](https://www.youtube.com/playlist?list=PLyQR2NzLKOCZU_jjLAdebyx9oE9dvvsrE) |\n| **2주차 (시험 3일 전)** | **D-3 초압축 총정리** | **김강민쌤** — *SQLD 최종 요약 정리 강의 (\"이것만 보면 60점 넘는다\")* | [유튜브 보기](https://www.youtube.com/watch?v=PC3ypt_VGWI) |\n| **2주차 (시험 직전)** | **D-1 스피드 암기 점검** | **미나쌤** — *시험 직전 필수 영상! SQLD 스피드 퀴즈* | [유튜브 보기](https://www.youtube.com/watch?v=rWdfFV8Wb18) |\n| **기출 모음** | 블로그 & 카페 복원 기출 | 유나맘 티스토리 기출 모음 / 데이터 전문가 포럼 네이버 카페 | [기출 블로그](https://yunamom.tistory.com/category/IT%EC%9E%90%EA%B2%A9%EC%A6%9D%20%EA%B3%B5%EB%B6%80/SQLD%20%EA%B8%B0%EC%B6%9C%EB%AC%B8%EC%A0%9C) / [네이버 카페](https://cafe.naver.com/sqlpd/13623) |\n\n---\n\n## 6-2. 김강민쌤 *\"이것만 보면 60점 넘는다\"* 초압축 암기 공식 & 1과목 키워드 노트\n\n> [!IMPORTANT]\n> **시험장에서 1초 만에 답을 고르는 두문자 암기 공식 모음 (친구 노션 `김강민 정리` & `요약 공부` 통합)**\n\n### 1. 두문자 암기 공식 5대장\n1. **데이터 모델링 3단계 (`개·논·물`)**:\n   - **개**념적 모델링 (추상화 최고, 업무 중심/포괄적, 핵심 엔터티 도출 및 ERD 작성) ➔ **논**리적 모델링 (식별자·속성·관계 정의, 재사용성 최고, **정규화 수행**) ➔ **물**리적 모델링 (가장 구체적, DB 성능·디스크 저장 구조·파티셔닝 고려)\n2. **스키마 3단계 구조 (`외·개·내`)**:\n   - **외**부 스키마 (개별 사용자 관점, `VIEW`) ➔ **개**념 스키마 (조직 전체의 **통합된** 논리적 구조, 설계자 관점) ➔ **내**부 스키마 (물리적 저장 구조, 칼럼·인덱스·파일)\n   - **논리적 독립성**: 개념 스키마가 바뀌어도 외부 스키마(응용 프로그램)에 영향 X\n   - **물리적 독립성**: 내부(물리) 스키마가 바뀌어도 개념/외부 스키마에 영향 X\n3. **속성의 특성에 따른 분류 (`기·설·파`)**:\n   - **기**본 속성 (업무로부터 추출된 본래 속성) / **설**계 속성 (업무 규칙화를 위해 새로 만든 코드·일련번호) / **파**생 속성 (다른 속성으로부터 계산된 값, 가급적 적게 정의)\n4. **논리 연산자 우선순위 (`NAO 나오~`)**:\n   - 괄호 `()` ➔ **`1순위 NOT` ➔ `2순위 AND` ➔ `3순위 OR`** (앞글자 따서 **`NAO 나오~`**!)\n5. **NULL 관련 함수 암기법 (`널뛰기` & `같이놀자`)**:\n   - **널뛰기 (`NVL`, `NVL2`, `ISNULL`)**:\n     - `NVL(값1, 값2)` / `ISNULL(값1, 값2)`: 값1이 `NULL`이면 값2, 아니면 값1\n     - `NVL2(값1, 값2, 값3)`: 값1이 **`NULL`이 아니면 값2**, **`NULL`이면 값3** (순서 헷갈리지 말 것!)\n   - **같이놀자 (`NULLIF`, `COALESCE`)**:\n     - `NULLIF(값1, 값2)`: 두 값이 **같으면 `NULL`**, 다르면 **값1** 반환 (\"같으면 널(NULL)이다!\")\n     - `COALESCE(값1, 값2, ...)`: 나열된 값 중 **`NULL`이 아닌 첫 번째 값** 반환\n\n### 2. SQL 기본 핵심 함정 & 정렬(`ORDER BY`) 4대 출제 패턴\n- **SQL 실행 순서**: `FROM` ➔ `WHERE` ➔ `GROUP BY` ➔ `HAVING` ➔ `SELECT` ➔ `ORDER BY`\n- **`SELECT DISTINCT deptno, mgr`**: 두 컬럼 조합이 **모두 같아야** 중복으로 제거됨 (`DISTINCT` 뒤의 모든 컬럼에 걸림).\n- **별칭(`AS`) 규칙**:\n  - `SELECT` 절에서는 `AS` 생략 가능, 별칭에 **공백(띄어쓰기)·특수문자·대소문자 구분**이 필요할 때는 **쌍따옴표(`\"직원 번호\"`)** 사용!\n  - **`FROM` 절 테이블 별칭에는 `AS`를 절대 사용할 수 없음!** (Oracle 기준 에러 발생)\n- **`CONCAT` 함수**: 인수가 **무조건 2개**만 가능! (3개 이상 결합 시 중첩하거나 Oracle `||` / SQL Server `+` 연산자 사용)\n- **`ROWNUM` (Oracle) vs `TOP` (SQL Server) 시험 단골 문제**:\n  ```sql\n  SELECT EMPNO, SAL\n  FROM EMP\n  WHERE ROWNUM <= 3\n  ORDER BY SAL DESC;\n  ```\n  - **함정 해설**: `ORDER BY`는 **가장 마지막**에 실행되므로, 급여 상위 3명이 뽑히는 게 아니라 **무작위로 먼저 읽힌 3명을 뽑은 뒤 그 3명끼리만 급여 내림차순 정렬**함! (진짜 상위 3명을 뽑으려면 인라인 뷰에서 먼저 정렬해야 함)\n- **`ORDER BY` 정렬 4문제 고정 출제 포인트**:\n  1. **정의 및 특성**: 가장 마지막에 실행됨, 소팅(Sorting) 작업으로 성능 저하 가능성, **Oracle은 `NULL`을 무한대(최댓값)**로 취급 / **SQL Server는 `NULL`을 `-무한대`(최솟값)**로 취급.\n  2. **컬럼 번호 정렬**: `ORDER BY 1, 2` 가능하지만, **출력(`SELECT`)되는 컬럼의 개수보다 큰 번호는 사용 불가**!\n  3. **인수 여러 개 정렬**: `ORDER BY SAL DESC, ENAME ASC` (각 컬럼마다 개별 정렬 기준 적용)\n  4. **출력되지 않는 컬럼 정렬**: 일반 `SELECT ENAME FROM EMP ORDER BY SAL;` 처럼 **`SELECT` 절에 없는 컬럼으로도 정렬 가능!** (단, `GROUP BY`나 `DISTINCT`, 집합연산자를 쓴 경우에는 `SELECT`절에 있는 컬럼/집계함수만 가능)\n\n---\n\n## 6-3. 노랭이(`SQL 자격검정 실전문제`) 전 과목 문항별 1줄 킬러 오답노트\n\n> [!WARNING]\n> **노랭이 풀다가 막힐 때 바로 찾아보는 문항 번호별 핵심 해설 (`SQL_자격검정_실전문제.txt` + 노션 `문제 풀이` 통합)**\n> 친구분이 노랭이 전 문항을 풀면서 틀렸거나 헷갈렸던 문항의 **핵심 함정 1줄 요약**입니다.\n\n| 비고 | ﻿ |\n| 비고 | # SQL 자격검정 실전문제 # |\n| 비고 | ------------------------------------------------------------------------------------------------------- |\n| 비고 | 1과목 - (1) |\n| **8번** | 가장 중요한 엔터티 왼쪽 상단에 배치. (왼쪽 상단에서 조금 아래쪽 중앙) |\n| **12번** | 기본, 중심, 행위 |\n| **21번** | 관계명, 관계차수, 관계선택사양 |\n| **26번** | 식별자 특성 암기 |\n| 비고 | 1과목 - (2) |\n| **31번** | 성능 데이터모델링을 하면서 데이터 모델의 구조도 변경될 수 있다. |\n| **36번** | 정규화, 몇:몇 관계 개념 확인 |\n| **37번** | 도메인 원자값 말고도 칼럼의 중복도 1차 정규화 대상 |\n| **38번** | 37번과 동일 (칼럼의 중복 = 1차 정규화 대상) |\n| **40번** | 다량의 데이터 탐색 = 반정규화 보다는 파티셔닝 및 클러스터링 먼저 고려 |\n| **46번** | 논리적으로 하나, 물리적으로 여러개로 분할 = 파티셔닝 |\n| **47번** | 슈퍼/서브타입 데이터모델 통합/분리 변환 개념 확인 |\n| **51번** | 조인이 빈번할 경우 FK에도 인덱스 설정, DB에 FK 제약조건 설정 안해도 조인 필요 시 인덱스 설정 O |\n| **52번** | GSI (Global Single Instance) = 통합된 한 개의 인스턴스. 즉, 통합 데이터베이스 구조를 의미. |\n| 비고 | (분산 데이터베이스와는 반대되는 개념) |\n| 비고 | 1회차 48 / 52   92점 |\n| 비고 | 2회차 52 / 52  100점 |\n| 비고 | ------------------------------------------------------------------------------------------------------- |\n| 비고 | 2과목 - (1) |\n| **4번** | 비절차적 데이터 조작어 = 무슨 데이터를 원하는지만 기술. 어떻게 접근 → 절차적 언어 (TL/SQL) |\n| **7번** | ALTER TABLE 테이블명 MODIFY 컬럼명 (SQL Server = ALTER COLUMN 컬럼명) |\n| **9번** | FK의 ON DELETE CASCADE 옵션 = 연결된 행 자체가 삭제됨 |\n| **12번** | 칼럼 선언 때 PK 선언 후 PK 제약조건을 또 생성하면 오류 발생 |\n| **16번** | ALTER TABLE 테이블명 DROP COLUMN 칼럼명; |\n| **18번** | RENAME 테이블명 TO 새테이블명; |\n| **19번** | DEPENDENT = Master 테이블에 PK 존재할 경우만 Child 입력 허용 / [ 해설지 참조동작 암기 ] |\n| **21번** | VARCHAR2 타입 칼럼에 숫자 타입 입력 가능
